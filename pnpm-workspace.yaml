packages:
  - 'packages/*'
  - 'apps/*'
  # tools/ 下的是**独立工具**（不属于任何 app 的运行时）：列进 workspace 只为让
  # pnpm 把依赖接好（`@agentdeck/skill-source`），它们不参与打包、也不是运行前提。
  - 'tools/skill-catalog-sync'
  # 远端管理页是**嵌套**在 apps/remote 下的第二个前端：`apps/*` 匹配不到它，
  # 所以单独列一行（不列的话 `pnpm --filter @agentdeck/remote-web` 会报
  # "No projects matched the filters"——构建脚本静默什么都没做）。
  - 'apps/remote/web'
