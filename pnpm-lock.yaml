lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.9.3
        version: 5.9.3

  apps/cli:
    dependencies:
      '@alpha-helper/protocol':
        specifier: workspace:*
        version: link:../../packages/protocol

  apps/daemon:
