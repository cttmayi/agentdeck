      '@alpha-helper/protocol':
        specifier: workspace:*
        version: link:../protocol

  packages/protocol:
    dependencies:
      zod:
        specifier: ^4.6.2
        version: 4.6.2

  packages/store-file:
    dependencies:
      '@alpha-helper/domain':
        specifier: workspace:*
        version: link:../domain
      '@alpha-helper/protocol':
