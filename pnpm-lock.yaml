      '@alpha-helper/agent-claude':
        specifier: workspace:*
        version: link:../../packages/agent-claude
      '@alpha-helper/agent-core':
        specifier: workspace:*
        version: link:../../packages/agent-core
      '@alpha-helper/agent-generic':
        specifier: workspace:*
        version: link:../../packages/agent-generic
