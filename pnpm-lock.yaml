        specifier: workspace:*
        version: link:../../packages/domain
      '@alpha-helper/protocol':
        specifier: workspace:*
        version: link:../../packages/protocol
      '@alpha-helper/store-file':
        specifier: workspace:*
        version: link:../../packages/store-file
      '@alpha-helper/web':
        specifier: workspace:*
        version: link:../web

  apps/mcp:
    dependencies:
      '@alpha-helper/protocol':
        specifier: workspace:*
        version: link:../../packages/protocol

  apps/remote:
    dependencies:
      '@alpha-helper/protocol':
        specifier: workspace:*
        version: link:../../packages/protocol

  apps/web: {}

  packages/agent-claude:
