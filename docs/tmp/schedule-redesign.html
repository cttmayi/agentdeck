<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>定时任务：调度设定 v4 预览</title>
<style>
  :root {
    --accent: #4a6cf7; --good: #1a9e5c; --bad: #d64545;
    --line: #d8dde6; --line-strong: #b9c1cf; --surface: #fff; --surface-2: #f3f5f9;
    --text: #1d2433; --text-dim: #5b6577; --faint: #8a94a6;
    --radius: 10px; --radius-pill: 999px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px;
  }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background:#eef1f6; margin:0; padding:24px; color:var(--text); }
  .card { background:#fff; border:1px solid var(--line); border-radius:var(--radius); max-width:520px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  h2 { margin:0 0 16px; font-size:16px; }
  .field { margin-bottom:18px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:8px; }
  /* 时间：大字 */
  .time-row { display:flex; align-items:center; gap:10px; }
  .time-input { font-size:22px; font-weight:600; padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; width:110px; }
  .time-input:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  /* 频率五档 */
  .freq-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .freq-btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius-pill); height:40px; font-size:13px; cursor:pointer; color:var(--text); }
  .freq-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  /* 星期：完整词 */
  .week-picker { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .week-btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius-pill); padding:6px 12px; font-size:13px; cursor:pointer; color:var(--text); }
  .week-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .week-btn.workdays { background:var(--surface-2); border-style:dashed; }
  /* 每月几号 */
  .month-row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--text-dim); }
  select { padding:6px 8px; border:1px solid var(--line-strong); border-radius:8px; font-size:13px; }
  /* 间隔 */
  .interval-row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--text-dim); }
  /* 高级折叠 */
  details { margin-top:10px; }
  details summary { cursor:pointer; font-size:12px; color:var(--faint); }
  details input { width:100%; box-sizing:border-box; margin-top:6px; padding:8px 10px; font-family:Menlo, monospace; font-size:13px; border:1px solid var(--line-strong); border-radius:8px; }
  .cron-hint { font-size:12px; color:var(--faint); margin-top:4px; }
  /* 人话预览 */
  .preview { margin-top:14px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; font-size:13px; color:var(--good); }
  .preview b { font-weight:600; }
  .muted { color:var(--faint); font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<div class="card">
  <h2>新建定时任务 · 调度设定（v4）</h2>

  <div class="field">
    <label>什么时候跑</label>
    <div class="time-row">
      <input class="time-input" type="time" value="09:00">
      <div class="muted">时间（24 小时制）</div>
    </div>
  </div>

  <div class="field">
    <label>重复</label>
    <div class="freq-grid">
      <button class="freq-btn active">每天</button>
      <button class="freq-btn">工作日</button>
      <button class="freq-btn">每周</button>
      <button class="freq-btn">每月</button>
      <button class="freq-btn">间隔</button>
    </div>

    <!-- 每天：无附加 -->
    <div class="muted" style="margin-top:6px">每天 09:00 触发一次</div>

    <!-- 每周（选中时展开） -->
    <div class="week-picker" hidden>
      <button class="week-btn active">周一</button>
      <button class="week-btn">周二</button>
      <button class="week-btn">周三</button>
      <button class="week-btn">周四</button>
      <button class="week-btn">周五</button>
      <button class="week-btn">周六</button>
      <button class="week-btn">周日</button>
    </div>

    <!-- 每月（选中时展开） -->
    <div class="month-row" hidden>
      <span>每月</span>
      <select><option>5</option><option>15</option><option selected>1</option></select>
      <span>号 09:00</span>
    </div>

    <!-- 间隔（选中时展开） -->
    <div class="interval-row" hidden>
      <span>每</span>
      <select><option>10</option><option selected>30</option><option>60</option></select>
      <span>分钟触发一次</span>
    </div>

    <details>
      <summary>高级：自定义 cron（懂的人用）</summary>
      <input type="text" placeholder="0 9 * * 1">
      <div class="cron-hint">段序：分 时 日 月 周 · 例：0 9 * * 1 = 每周一 09:00</div>
      <div class="cron-hint">填了自定义，上面的人话预览就跟着它走</div>
    </details>
  </div>

  <div class="preview">
    <b>每天 09:00</b> 触发 · 下次触发：周一 09:00 之后由系统算好显示在列表里
  </div>
</div>
</body>
</html>
