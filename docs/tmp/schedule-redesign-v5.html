<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>定时任务：调度设定 v5 预览（cron 实时可见）</title>
<style>
  :root {
    --accent: #4a6cf7; --good: #1a9e5c; --bad: #d64545;
    --line: #d8dde6; --line-strong: #b9c1cf; --surface: #fff; --surface-2: #f3f5f9;
    --text: #1d2433; --text-dim: #5b6577; --faint: #8a94a6;
    --radius: 10px; --radius-pill: 999px; --fs-xs: 12px; --fs-sm: 13px;
  }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background:#eef1f6; margin:0; padding:24px; color:var(--text); }
  .card { background:#fff; border:1px solid var(--line); border-radius:var(--radius); max-width:560px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  h2 { margin:0 0 16px; font-size:16px; }
  .field { margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:8px; }
  .time-input { font-size:20px; font-weight:600; padding:6px 10px; border:1px solid var(--line-strong); border-radius:8px; width:100px; }
  .freq-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px; }
  .freq-btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius-pill); height:38px; font-size:13px; cursor:pointer; }
  .freq-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .week-picker { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .week-btn { border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius-pill); padding:5px 11px; font-size:13px; cursor:pointer; }
  .week-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  select { padding:5px 8px; border:1px solid var(--line-strong); border-radius:8px; font-size:13px; }
  .sub-row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--text-dim); }
  /* cron 常驻行 */
  .cron-bar { display:flex; align-items:center; gap:8px; margin-top:14px; padding:8px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; }
  .cron-bar .tag { font-size:11px; color:var(--faint); flex-shrink:0; }
  .cron-bar code { font-family:Menlo,monospace; font-size:14px; font-weight:600; color:var(--text); }
  .cron-bar .live { font-size:11px; color:var(--good); flex-shrink:0; }
  /* 高级 */
  details { margin-top:10px; }
  details summary { cursor:pointer; font-size:12px; color:var(--faint); }
  details input { width:100%; box-sizing:border-box; margin-top:6px; padding:8px 10px; font-family:Menlo,monospace; font-size:13px; border:1px solid var(--line-strong); border-radius:8px; }
  .cron-hint { font-size:12px; color:var(--faint); margin-top:4px; }
  /* 高级激活时表单退居次要 */
  .form-zone { transition: opacity .15s; }
  .form-zone.custom { opacity:.45; pointer-events:none; }
  .custom-note { display:none; margin-top:8px; font-size:12px; color:var(--bad); }
  .custom-note.show { display:block; }
  .preview { margin-top:14px; padding:10px 12px; background:#eaf7f0; border:1px solid #bfe8d2; border-radius:8px; font-size:13px; color:var(--good); }
</style>
</head>
<body>
<div class="card">
  <h2>新建定时任务 · 调度设定（v5）</h2>

  <div class="form-zone" id="formZone">
    <div class="field">
      <label>什么时候跑</label>
      <input class="time-input" id="time" type="time" value="09:00">
      <div class="freq-grid">
        <button class="freq-btn active" data-freq="daily">每天</button>
        <button class="freq-btn" data-freq="workdays">工作日</button>
        <button class="freq-btn" data-freq="weekly">每周</button>
        <button class="freq-btn" data-freq="monthly">每月</button>
        <button class="freq-btn" data-freq="interval">间隔</button>
      </div>
      <div class="week-picker" id="week" hidden>
        <button class="week-btn" data-day="1">周一</button><button class="week-btn" data-day="2">周二</button>
        <button class="week-btn" data-day="3">周三</button><button class="week-btn" data-day="4">周四</button>
        <button class="week-btn" data-day="5">周五</button><button class="week-btn" data-day="6">周六</button>
        <button class="week-btn" data-day="7">周日</button>
      </div>
      <div class="sub-row" id="month" hidden>
        <span>每月</span><select id="monthDay"><option>1</option><option>5</option><option>15</option><option>28</option></select><span>号</span>
      </div>
      <div class="sub-row" id="interval" hidden>
        <span>每</span><select id="minutes"><option>10</option><option selected>30</option><option>60</option></select><span>分钟</span>
      </div>
    </div>
  </div>

  <!-- cron 常驻行：实时 -->
  <div class="cron-bar">
    <span class="tag">cron</span>
    <code id="cronText">0 9 * * *</code>
    <span class="live">● 实时</span>
  </div>
  <div class="custom-note" id="customNote">当前是自定义 cron——上面的可视化设定已失效，关掉「自定义」就回到可视化设定。</div>

  <details id="advanced">
    <summary>自定义 cron（直接改下面这行）</summary>
    <input id="cronInput" type="text" placeholder="0 9 * * *">
    <div class="cron-hint">段序：分 时 日 月 周 · 例：0 9 * * 1 = 每周一 09:00</div>
    <div class="cron-hint">改了会立即同步回可视化设定（认得出来的话）；认不出来就进入「自定义模式」</div>
  </details>

  <div class="preview" id="preview"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id)
  const pad = (n) => String(n).padStart(2, '0')
  const time = () => $('time').value.split(':')
  let freq = 'daily'
  let days = [1]
  const setDays = () => { $('week').hidden = freq !== 'weekly' }
  const setSub = () => {
    $('week').hidden = freq !== 'weekly'
    $('month').hidden = freq !== 'monthly'
    $('interval').hidden = freq !== 'interval'
  }
  // 表单 → cron
  function formToCron() {
    const [h, m] = time()
    if (freq === 'daily') return `${m} ${h} * * *`
    if (freq === 'workdays') return `${m} ${h} * * 1-5`
    if (freq === 'weekly') return `${m} ${h} * * ${days.sort((a,b)=>a-b).join(',')}`
    if (freq === 'monthly') return `${m} ${h} ${$('monthDay').value} * *`
    return `*/${$('minutes').value} * * * *`
  }
  // cron → 表单（认得出来的四类）
  function cronToForm(cron) {
    const parts = cron.trim().split(/\s+/)
    if (parts.length !== 5) return false
    const [min, hr, dom, mon, dow] = parts
    const weekly = /^(\d{1,2}),(\d{1,2})$/.test(dow) || /^\d$/.test(dow)
    const daily = min !== '*' && hr !== '*' && dom === '*' && mon === '*' && (dow === '*' || dow === '1-5')
    if (daily) { $('time').value = `${pad(hr)}:${pad(min)}`; freq = dow === '1-5' ? 'workdays' : 'daily' }
    else if (/^\d$/.test(dow)) { $('time').value = `${pad(hr)}:${pad(min)}`; freq = 'weekly'; days = dow.split(',').map(Number) }
    else if (/^\d{1,2}$/.test(dow)) { $('time').value = `${pad(hr)}:${pad(min)}`; freq = 'weekly'; days = [Number(dow)] }
    else if (dom !== '*' && dom !== '*/') { $('time').value = `${pad(hr)}:${pad(min)}`; freq = 'monthly'; $('monthDay').value = dom }
    else if (/^\*\//.test(min)) { freq = 'interval'; $('minutes').value = min.slice(2) }
    else return false
    applyFreqUI()
    return true
  }
  function applyFreqUI() {
    document.querySelectorAll('.freq-btn').forEach(b => b.classList.toggle('active', b.dataset.freq === freq))
    setSub()
    document.querySelectorAll('.week-btn').forEach(b => b.classList.toggle('active', days.includes(Number(b.dataset.day))))
  }
  function sync() {
    $('cronText').textContent = formToCron()
    $('preview').innerHTML = '<b>' + describe() + '</b> 触发'
  }
  function describe() {
    const [h, m] = time()
    if (freq === 'daily') return `每天 ${h}:${m}`
    if (freq === 'workdays') return `工作日（周一至周五）${h}:${m}`
    if (freq === 'weekly') return `每周 ${days.sort((a,b)=>a-b).map(d=>'周' + '一二三四五六日'[d-1]).join('、')} ${h}:${m}`
    if (freq === 'monthly') return `每月 ${$('monthDay').value} 日 ${h}:${m}`
    return `每 ${$('minutes').value} 分钟`
  }
  // 事件
  $('time').addEventListener('input', sync)
  document.querySelectorAll('.freq-btn').forEach(b => b.addEventListener('click', () => {
    freq = b.dataset.freq
    if (freq === 'workdays') days = [1,2,3,4,5]
    applyFreqUI(); sync()
  }))
  document.querySelectorAll('.week-btn').forEach(b => b.addEventListener('click', () => {
    const d = Number(b.dataset.day)
    days = days.includes(d) ? days.filter(x => x !== d) : [...days, d]
    if (days.length === 0) days = [d]
    applyFreqUI(); sync()
  }))
  $('monthDay').addEventListener('change', sync)
  $('minutes').addEventListener('change', sync)
  // 高级：改了同步回表单；认不出来 → 自定义模式
  $('cronInput').addEventListener('input', () => {
    const v = $('cronInput').value.trim()
    if (!v) { $('formZone').classList.remove('custom'); $('customNote').classList.remove('show'); sync(); return }
    if (cronToForm(v)) { $('formZone').classList.remove('custom'); $('customNote').classList.remove('show'); $('cronText').textContent = v }
    else { $('formZone').classList.add('custom'); $('customNote').classList.add('show'); $('cronText').textContent = v }
  })
  // 关掉高级 → 回到可视化设定
  $('advanced').addEventListener('toggle', () => {
    if (!$('advanced').open) { $('formZone').classList.remove('custom'); $('customNote').classList.remove('show'); $('cronInput').value = formToCron(); sync() }
  })
  $('cronInput').value = '0 9 * * *'
  applyFreqUI(); sync()
</script>
</body>
</html>
