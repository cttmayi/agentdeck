<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>agentdeck layout probe</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 12px/1.5 monospace; }
      iframe { width: 1280px; height: 880px; border: 0; display: block; }
      pre { margin: 0; padding: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      ══════════════════════════════════════════════════════════════════
      界面布局探针：它为什么存在
      ══════════════════════════════════════════════════════════════════

      `tsc`/`svelte-check` 看不见布局：类名写对了、模板结构合法，但
      "两栏有没有并排"、"窄屏返回按钮有没有出现"、"`.main:has(> .split-layout)`
      有没有真的生效"这些只有**浏览器量得出来**。改布局时靠"我看着像对"
      是不够的——这个项目里已经有过两次"接口都在、就是没接线"的缺陷。

      于是：把**真应用**放进同源 iframe，用**真实点击**驱动它，把
      `getComputedStyle` 的结果写进自己的 DOM，再由 `run.mjs` 用
      `chrome --dump-dom` 抓回去断言。探针只上报**事实**，期望值全在
      `run.mjs` 里——"量"和"判"分开，改了期望不必动这里。

      ⚠️ 它**基本不造 run**：造 run 就会去调真的 CLI（NFR-T-01 的底线）。所以它验的是
         **布局与结构**，不是"跑起来之后长什么样"。唯一的例外是「新建任务的三步链」
         那一组：那里要证明"界面上选的"与"发出去的请求体"是同一件事，只有真的点一次
         「创建并派发」、再从接口上把那条 run 读回来才做得到。那两条 run 用的
         runtime 是 `generic`（命令 `agent-cli` 不存在）⇒ 它们会立刻失败，**不会**
         拉起任何一个真实的模型去干活（见 `run.mjs` 里造那个夹具 agent 的说明）。
    -->
    <!--
      ⚠️ 高度/宽度可被 URL 参数覆盖（默认 1280×880，与以前逐像素一致）。
      分批第 30 批加这个口子是为了**换窗口高度量同一批判据**：界面自适应高低的缺陷
      只在"窗口高/矮"时暴露（`58vh` 时代大屏留白、小屏整页滚），而 `--window-size`
      对 iframe 里的页面无效（量的是 iframe 视口，不是浏览器视口）——这一点我第一版
      以为是 Chrome 参数没生效，跑了两档都是一模一样的 880 才发现量错了对象。
    -->
    <iframe id="f" src="/#/agents"></iframe>
    <pre id="out">pending</pre>
    <script>
// ★ 分批第 30 批：iframe 尺寸可由 URL 覆盖（`?w=1280&h=1200`）——"自适应高度"必须
//   在**不同窗口高度**下各量一遍，否则只能证明默认那一档而已。
;(() => {
  const q = new URLSearchParams(location.search)
  const w = Number(q.get('w') ?? '')
  const h = Number(q.get('h') ?? '')
  const fr = document.getElementById('f')
  if (!fr) return
  if (w > 0) fr.style.width = `${w}px`
  if (h > 0) fr.style.height = `${h}px`
})()

      const f = document.getElementById('f')
      const facts = {}
      const errors = []
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const d = () => f.contentDocument
      const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : null)

      /**
       * ══════════════════════════════════════════════════════════════════
       * ★ 2026-10（探针加固）：拿不到元素**不许把整趟打死**
       * ══════════════════════════════════════════════════════════════════
       *
       * 原来 `cs(el)` / `click(el)` 直接就把 `el` 用出去，`el === null` 时抛
       * TypeError 一路穿到 `main()` 外面 ⇒ **后面每一段都没量**。报告里于是出现
       * 500 多条"没量到这个值（选择器可能改了）"，而真因只有一个，藏在第一个异常里
       * ——排查它要一次次重跑（这一趟就是被 `.detail-pane .back` 那个已经不存在的
       * 按钮打死的）。
       *
       * 现在的规矩：**拿不到值就记一条、继续往下量**。一次跑完能看到全部问题，
       * 而不是"修一个冒一个"。
       */
      const seenNotes = new Set()
      function note(message) {
        if (seenNotes.has(message)) return
        seenNotes.add(message)
        errors.push(message)
      }

      /**
       * ★★ D177：**这个按钮算不算「这一屏的主操作」**。
       *
       * 界面上的按钮有两种写法都等于 primary：显式 `btn btn--primary`，以及
       * **一个变体都不写**的 `button` / `class="btn"`（`app.css` 那条基类规则给的就是
       * accent 底色——"没有写变体的也按 primary 渲染"）。判据要按**界面看到的样子**算，
       * 不按写法算，否则"主操作跑到栏头去了"会被判成通过。
       */
      function isPrimary(btn) {
        if (btn.classList.contains('btn--primary')) return true
        return !/\bbtn--(secondary|ghost|danger|link)\b/.test(btn.className)
      }

      /** 一组按钮里主操作的个数（`root` 下所有 button，含 `.btn` 形式的） */
      function primaryCount(root) {
        if (!root) return null
        return [...root.querySelectorAll('button')].filter(isPrimary).length
      }

      /**
       * ★★ D177（使用者选的 B 案）：**「主操作放哪」按族定，各族各自量**。
       *
       * 族 1 `.main-panel`（整块换掉右栏的面板：技能安装、工作区设置…）：主操作在
       *   **底栏**（`.main-panel-foot`），栏头**只许** ghost（返回 + 工具性动作）。
       *   这个测量给三处面板共用，所以只在这里写一次。
       */
      function panelActionPlace(panel) {
        if (!panel) return null
        const head = panel.querySelector('.main-panel-head')
        const foot = panel.querySelector('.main-panel-foot')
        const headButtons = [...(head?.querySelectorAll('button') ?? [])]
        const footButtons = [...(foot?.querySelectorAll('button') ?? [])]
        return {
          headButtons: headButtons.map((b) => text(b)),
          headAllGhost: headButtons.every((b) => b.classList.contains('btn--ghost')),
          headPrimary: primaryCount(head),
          footExists: foot !== null,
          footPrimary: primaryCount(foot),
          footButtons: footButtons.map((b) => text(b)),
        }
      }

      /**
       * ★★ D199：**可点元素的高度只有三种来源**——档位（写死的值）/ 内容（文字折行的按钮更高）/
       *   容器（列表行、导航行、拖拽条、分组头撑开）。
       *
       * 把全站可点元素摊开，会看到 13/20/22/24/28/30/34/42/53/60/62/64/65/89/848 这一列，
       * 看着像十五个档位，其实只有"五个档位 + 内容 + 容器"。这条把它们分开量：
       * 归不到任何一类的**新类名**会进 `unexpected`（那就是"漏了一个档"的样子，
       * 比如 `.theme-picker button` 曾经是 28.8）。
       *
       * 累计器：探针跨页面跑，任务页 / 设置页 / 技能页各扫一次，合并成一个事实。
       */
      function sweepCtl(label) {
      const doc = d()
      const win = f.contentWindow
      const styleOf = (el) => win.getComputedStyle(el)
      const acc = facts['ctl.heights'] ?? {
        pages: [],
        total: 0,
        at30: 0,
        rail: 0,
        containers: 0,
        textLinks: 0,
        registered: {},
        wrapped: [],
        unexpected: [],
      }
      /** 登记表：[选择器, 档名, 允许的高度] —— 不在表里的东西一律归"控件 30 / 折行 / 容器" */
      const REG = [
        ['.list-row-action', '行内动作', [28]],
        ['.stage-chips button', '标签胶囊', [24]],
        ['.view-switch button', '标签胶囊', [22]],
        ['.expand-toggle', '内联小件', [13]],
        ['.switch', '内联小件', [20]],
        // ★ D217：可选格子（频率 / 星期）是**控件档**：30 高、13px 字
        ['.chip-row > button', '可选格子', [30]],
      ]
      /** 容器类：高度跟着内容/容器走（列表行、导航行、拖拽条、分组头），不是控件 */
      const CONTAINER = ['.list-row-main', '.nav-item', '.split-grip', '.list-group-head']
      const clickable = [
        ...doc.querySelectorAll(
          'button, a[href], select, input:not([type=hidden]), label[for], summary, [role=button]',
        ),
      ].filter((el) => {
        const r = el.getBoundingClientRect()
        const st = styleOf(el)
        return r.height > 0 && st.visibility !== 'hidden' && st.display !== 'none'
      })
      if (clickable.length === 0) return
      acc.pages.push(`${label}(${String(clickable.length)})`)
      acc.total += clickable.length
      for (const el of clickable) {
        const h = Math.round(el.getBoundingClientRect().height)
        const cls =
          String(el.className || el.tagName)
            .split(/\s+/)
            .filter((c) => c !== '' && !c.startsWith('svelte-'))
            .slice(0, 3)
            .join('.') || el.tagName
        const reg = REG.find(([sel]) => el.matches(sel))
        if (reg) {
          const key = `${String(reg[1])} · ${String(reg[0])}`
          acc.registered[key] = [...new Set([...(acc.registered[key] ?? []), h])]
          continue
        }
        if (CONTAINER.some((sel) => el.matches(sel))) {
          acc.containers += 1
          continue
        }
        /**
         * **文字不是控件**：`<label for>`（字段名，点它只是把焦点给输入框）与行内 `<a>`
         * （正文里的链接）的高度就是行盒高度（21 / 17）——它们没有"档位"这回事，
         * 算进控件里会把这条判据变成噪声（第一版就是这么报红的）。
         */
        const tag = el.tagName
        if (tag === 'LABEL' || (tag === 'A' && styleOf(el).display === 'inline')) {
          acc.textLinks += 1
          continue
        }
        // 轨道里的常驻控件 = `--rail-h`(34)。⚠️ 不能只看 `.topbar`：顶栏的「更多」菜单
        // 也挂在 `.topbar` 里，但菜单项是普通控件（30）——所以要排除菜单容器。
        if (el.closest('.topbar') && !el.closest('[data-page-more-menu], [role=menu]') && h === 34) {
          acc.rail += 1
          continue
        }
        if (h === 30) {
          acc.at30 += 1
          continue
        }
        if (h > 30) {
          acc.wrapped.push(`${label}:${cls}=${String(h)}`)
          continue
        }
        acc.unexpected.push(`${label}:${cls}=${String(h)}`)
      }
      facts['ctl.heights'] = acc
    }

      /**
       * ★★ D214：**每个"换掉右栏"的视图都得有栏头，且栏头内距不能是 0**。
       *
       * 为什么单独量这一条：`Tasks` 的「新建任务」用 `--create-pad-x` 给左右留白，
       * 而那个变量原来定义在 `.pane-body.create-body` 上——**栏头是它的兄弟**，
       * 自定义属性不跨兄弟继承 ⇒ `padding: … var(--create-pad-x) …` 变成无效值、
       * 整条声明被丢弃 ⇒ **栏头内距塌成 0**（实测 0/0/0/0，标题贴着栏边，
       * 而另外三个"新建"视图都是 16/24/12）。这类"整条声明被静默丢弃"的错，
       * 读样式表看不出来，只有量 computed 才会露。
       */
      /**
       * ★★ D214：**一屏只许有一颗"可用"的主操作**（顶栏轨道 + 右栏面板）。
       *
       * 由来：进入"新建/起草"视图后，顶栏那颗主操作（新建任务 / 新建对话…）与视图里的
       *   主操作（创建并派发 / 保存 / 创建）**同时是实心的** ⇒ 一屏两颗"主操作长相"，
       *   而 §2.1.1 明确把这种情况列为要清掉的问题（"一屏会出现好几个'主操作'长相"）。
       * 现在的规矩：**进入那一步之后顶栏那颗 `disabled`**（五页同一套；
       *   聊天页原来是"整颗拿掉"，D214 统一成禁用——拿掉会让格子挪位）。
       * 排除：输入区的发送键（它属于输入区，不属于"这一页的主操作"）。
       */
      function sweepPrimary(label) {
        const doc = d()
        const acc = facts['btn.primaryCount'] ?? { seen: [], bad: [] }
        const scope = [...doc.querySelectorAll('.page-actions .btn--primary, .detail-pane .btn--primary')].filter(
          (b) => {
            const r = b.getBoundingClientRect()
            return r.height > 0 && r.width > 0
          },
        )
        const enabled = scope.filter((b) => !b.disabled)
        acc.seen.push(`${label}=${String(enabled.length)}颗可用/${String(scope.length)}颗`)
        if (enabled.length > 1) {
          acc.bad.push(`${label}：${enabled.map((b) => text(b)).join(' + ')}`)
        }
        facts['btn.primaryCount'] = acc
      }

      function sweepHead(label) {
        const doc = d()
        const acc = facts['heads.sweep'] ?? { seen: [], bad: [] }
        const head = doc.querySelector('.detail-pane .detail-head, .detail-pane .main-panel-head')
        if (!head) return
        const c = f.contentWindow.getComputedStyle(head)
        const pad = [c.paddingTop, c.paddingRight, c.paddingBottom, c.paddingLeft].join('/')
        const h = Math.round(head.getBoundingClientRect().height)
        acc.seen.push(`${label}=${pad}·${String(h)}px`)
        // 面板级 16/24/12，或「新建任务」那一档 16/32/0（文档里写明的例外）
        const ok = pad === '16px/24px/12px/24px' || pad === '16px/32px/0px/32px'
        if (!ok || h < 50) acc.bad.push(`${label}：内距 ${pad}、高 ${String(h)}px`)
        facts['heads.sweep'] = acc
      }

      /**
       * ★★ D203：**字符图标（▸ ▾ ⋯ × ✓ ✗ ⚠）字号只有一档**（`--fs-sm` = 13px），
       *   只有"行内动作里那个 ×"登记为 17px（它是 28px 格子里唯一的内容）。
       *
       * 为什么值得量：字符图标的字号是**继承**来的，容器一换字号它就跟着变——
       *   实测同一个 ▸ 在组头是 14px、折叠头 13px、工作目录树 12px。这类漂移用肉眼
       *   几乎看不出来（差 1px），只有把字号摊开排在一起才看得见。
       */
      function sweepIcons(label) {
        const doc = d()
        const win = f.contentWindow
        const acc = facts['icon.glyphs'] ?? { pages: [], seen: {}, unexpected: [] }
        const GLYPH = /^[\u2190-\u21FF\u2500-\u27BF\u2B00-\u2BFF\uFE0F\u2700-\u27BF]+$/
        /** 登记表：[类名, 允许字号, 理由] —— 探针是纯 JS，别在这儿写 TS 的类型标注 */
        const REG = [
          ['list-row-action', '17px', '列表行里那个删除 ×：28px 见方的格子里它唯一的内容，13px 不像"可点的动作"'],
        ]
        for (const el of doc.querySelectorAll('button, span, i, code, a')) {
          const t = (el.textContent ?? '').trim()
          if (t === '' || t.length > 3 || !GLYPH.test(t)) continue
          if (el.children.length > 0) continue
          const st = win.getComputedStyle(el)
          if (st.display === 'none' || el.getBoundingClientRect().height === 0) continue
          const size = st.fontSize
          const cls = String(el.className || el.tagName)
          const reg = REG.find(([c]) => cls.split(/\s+/).includes(c))
          const key = `${t}|${size}`
          acc.seen[key] = (acc.seen[key] ?? 0) + 1
          if (reg) {
            if (size !== reg[1]) acc.unexpected.push(`${label}:${t}=${size}（登记应为 ${reg[1]}）`)
            continue
          }
          if (size !== '13px') acc.unexpected.push(`${label}:${t}=${size}`)
        }
        acc.pages.push(label)
        facts['icon.glyphs'] = acc
      }

      /**
       * ★★ D202：**每个可聚焦元素在 `:focus-visible` 下都必须落到一条带 outline 的规则**。
       *
       * 为什么不用"真的聚焦再量"：探针里的 `element.focus()` 是**程序聚焦**，Chrome 不会
       * 让它匹配 `:focus-visible`（模态判定要真实的键盘事件）——第一版就是这样量到"按钮全部
       * 没有焦点环"的假结果。所以这里改成从 **CSSOM** 里查：所有选择器含 `:focus` 的规则，
       * 把伪类剥掉后看这个元素是否命中；命中且最后一条（特异性的近似）把 outline 设成 none
       * 的，算"环被吃掉"。
       */
      function sweepFocus(label) {
        const doc = d()
        const acc = facts['focus.rings'] ?? { pages: [], ringRules: 0, eaten: [], checked: 0 }
        const focusRules = []
        for (const sheet of doc.styleSheets) {
          let rules
          try {
            rules = sheet.cssRules
          } catch {
            continue
          }
          for (const rule of rules) {
            if (!rule.selectorText || !/:focus/.test(rule.selectorText)) continue
            const cssText = rule.style.cssText
            // 三种情况必须分开：给了环 / **明确**吃掉（outline: none 或 0）/ 压根没提 outline。
            // 第三种（比如 `input:focus { border-color: accent }`）不该参与比较——它没有覆盖掉任何东西，
            // 第一版把"命中但没给环"当成吃掉 ⇒ 输入框报了假红。
            const mentions = /outline\s*:/.test(cssText)
            const kills = /outline\s*:\s*(none|0\b|0px)/.test(cssText)
            focusRules.push({
              sel: rule.selectorText,
              hasRing: mentions && !kills,
              kills,
              relevant: mentions,
            })
          }
        }
        acc.ringRules = focusRules.length
        const focusable = [
          ...doc.querySelectorAll(
            'button, input:not([type=hidden]), select, textarea, a[href], summary, [tabindex]:not([tabindex="-1"])',
          ),
        ].filter((el) => {
          const st = f.contentWindow.getComputedStyle(el)
          return el.getBoundingClientRect().height > 0 && st.display !== 'none' && !el.disabled
        })
        const spec = (sel) => {
          const ids = (sel.match(/#[\w-]+/g) ?? []).length
          const cls = (sel.match(/\.[\w-]+|:\w[\w-]*|\[[^\]]*\]/g) ?? []).length
          const tag = (sel.match(/(^|[\s>+~,(])([a-zA-Z][\w-]*)/g) ?? []).length
          return ids * 10000 + cls * 100 + tag
        }
        for (const el of focusable) {
          acc.checked += 1
          /**
           * ⚠️ 这里要模拟**一点点层叠**：只问"有没有某条规则给了 outline"会被蒙过去——
           *   变异测试里挂在文件末尾的 `input:focus { outline: none }` 特异性比全局
           *   `:focus-visible` 高，真实情况下环确实被吃掉，而"只要有一条给环就算有"会判它通过。
           * 所以：在命中这个元素的规则里取**特异最高（同特异取靠后）**的那条，看它把 outline 设成了什么。
           */
          let best = null
          for (const [i, r] of focusRules.entries()) {
            for (const part of r.sel.split(',')) {
              const base = part.replace(/:focus(-visible|\-within)?/g, '').trim()
              // 全局那条 `:focus-visible` 去掉伪类后是空选择器（= 匹配所有元素）；空 ⇒ 命中一切
              let hit = base === ''
              if (!hit) {
                try {
                  hit = el.matches(base) || el.closest(base) !== null
                } catch {
                  hit = false
                }
              }
              if (!hit || !r.relevant) continue
              const cand = { spec: spec(part), order: i, hasRing: r.hasRing }
              if (best === null || cand.spec > best.spec || (cand.spec === best.spec && cand.order > best.order)) {
                best = cand
              }
            }
          }
          if (best !== null && best.hasRing) continue
          const cls =
            String(el.className || el.tagName)
              .split(/\s+/)
              .filter((c) => c !== '' && !c.startsWith('svelte-'))
              .slice(0, 2)
              .join('.') || el.tagName
          acc.eaten.push(`${label}:${cls}`)
        }
        acc.pages.push(label)
        facts['focus.rings'] = acc
      }

      /**
       * ★★ D201：**圆角只有五个值**（0 / 4 / 6 / 8 / 12 / 999），外加 `50%`（圆）。
       *
       * 令牌的名字原来还是反的（6px 叫 `--radius-xs`、4px 叫 `--radius-sm`），改的只是名字、
       * 像素一个没动。这条判据扫 computed `border-radius`，任何令牌之外的**新值**都报红——
       * 不管它是裸 px 还是"某个组件自己算出来的"。
       */
      function sweepRadius(label) {
        const doc = d()
        const win = f.contentWindow
        const acc = facts['radius.values'] ?? { pages: [], seen: {}, unexpected: [] }
        const ALLOWED = new Set(['0px', '4px', '6px', '8px', '12px', '999px', '50%'])
        let counted = 0
        for (const el of doc.querySelectorAll('*')) {
          const st = win.getComputedStyle(el)
          if (st.display === 'none') continue
          const raw = st.borderRadius
          if (raw === '' || raw === '0px') continue
          counted += 1
          for (const part of raw.split(/\s+/)) {
            if (part === '') continue
            acc.seen[part] = (acc.seen[part] ?? 0) + 1
            if (ALLOWED.has(part)) continue
            const cls =
              String(el.className || el.tagName)
                .split(/\s+/)
                .filter((c) => c !== '' && !c.startsWith('svelte-'))
                .slice(0, 2)
                .join('.') || el.tagName
            acc.unexpected.push(`${label}:${cls}=${part}`)
          }
        }
        if (counted > 0) acc.pages.push(`${label}(${String(counted)})`)
        facts['radius.values'] = acc
      }

      /**
       * ★★ D200：**元素之间的间距只有四类来源**，这条把它们分开量。
       *
       * 已知的四种：
       *   ① **令牌刻度**：`--sp-1..8` = 4 / 8 / 12 / 16 / 24 / 32 / 48（块与块之间）；
       *   ② **紧贴档 2px**：分段格子之间的缝、标题与副标题、紧凑字段的标签与输入框
       *      （"两块本该连着"的地方，不是"隔着一段距离"）；
       *   ③ **控件内部常量 6px**：`.btn` 里图标与文字之间——它不是间距档，是按钮内部的排版常量；
       *   ④ **内容/容器决定**：行内各元素 8px 之类，跟着内容走。
       *
       * 这条判据扫当前页面所有容器的 `gap`，把值归到上面前三类之一；出现刻度外的**新值**就报红
       * （第一版扫出来的是 6.5px——那是 `<option>` 的 computed 值，不是我们自己写的，已排除）。
       */
      function sweepGap(label) {
        const doc = d()
        const win = f.contentWindow
        const acc = facts['gap.values'] ?? { pages: [], seen: {}, unexpected: [] }
        const ALLOWED = [0, 2, 4, 6, 8, 12, 16, 24, 32, 48]
        const containers = [...doc.querySelectorAll('*')].filter((el) => {
          const st = win.getComputedStyle(el)
          if (st.display === 'none') return false
          return /flex|grid/.test(st.display)
        })
        let counted = 0
        for (const el of containers) {
          const st = win.getComputedStyle(el)
          const raw = (st.columnGap && st.columnGap !== 'normal' ? st.columnGap : '') || st.gap || ''
          if (raw === '' || raw === 'normal') continue
          const px = Math.round(parseFloat(raw.split(/\s+/)[0]))
          if (!Number.isFinite(px) || px === 0) continue
          counted += 1
          const key = `${String(px)}px`
          acc.seen[key] = (acc.seen[key] ?? 0) + 1
          if (!ALLOWED.includes(px)) {
            const cls =
              String(el.className || el.tagName)
                .split(/\s+/)
                .filter((c) => c !== '' && !c.startsWith('svelte-'))
                .slice(0, 2)
                .join('.') || el.tagName
            acc.unexpected.push(`${label}:${cls}=${String(px)}px`)
          }
        }
        if (counted > 0) acc.pages.push(`${label}(${String(counted)})`)
        facts['gap.values'] = acc
      }

      /** 计算样式；元素不在时给空对象（读到的字段是 undefined ⇒ 那条断言红，正是要的）。 */
      function cs(el) {
        if (!el) {
          note('getComputedStyle：目标元素不存在（选择器可能改了）')
          return {}
        }
        return f.contentWindow.getComputedStyle(el)
      }

      /**
       * 智能体详情**卡片里每一格的小标题**。
       *
       * ⚠️ 2026-10 起智能体详情只有**一个态、一张卡片**（选中即编辑）：旧的
       *    `.detail .section h3`（查看态的段落标题）与 `.detail .field-row .row-label`
       *    都不存在了，段落身份由 `.cell > .cell-label` 表示。多处断言要问"这一页
       *    有哪些段"，所以只在这里定义一次——各段各写一遍选择器，改一次界面就要
       *    改十几处（而且会漏）。
       */
      function agentCellLabels(root) {
        const scope = root ?? d()
        return [...scope.querySelectorAll('.card.agent-card .cell')].map((cell) => {
          // ⚠️ 有的格用小标题元素（`<div class="cell"><span class="cell-label">…`），
          //    有的是 `<label class="cell">标题<textarea …>`（「指令」那一格就是）。
          //    只认 `.cell-label` 会把「指令」这一格整个漏掉——它恰恰是判断依据的
          //    唯一出处，漏掉它会让"这一页有哪些格"这件事量错（踩过）。
          const label = cell.querySelector('.cell-label')
          if (label) return text(label)
          const own = [...cell.childNodes].find(
            (n) => n.nodeType === 3 && (n.textContent ?? '').trim() !== '',
          )
          return own ? (own.textContent ?? '').trim() : null
        })
      }

      function publish(done) {
        document.getElementById('out').textContent = JSON.stringify({ errors, facts, done }, null, 1)
      }

      /** 轮询等待条件成立；拿不到就返回 false（调用方自己记一条 error）。 */
      async function until(fn, tries = 100) {
        for (let i = 0; i < tries; i++) {
          try {
            if (fn()) return true
          } catch {}
          await wait(150)
        }
        return false
      }

      /**
       * ★★★ 不用时钟的等待（2026-10-21，踩过一次大坑）。
       *
       * ══════════════════════════════════════════════════════════════════
       * 为什么"跑着"那一屏不能用 `until()` 等
       * ══════════════════════════════════════════════════════════════════
       *
       * 探针是拿 `chrome --virtual-time-budget` 跑完之后 --dump-dom 收结果的。实测（三组
       * 对照实验，`/tmp/sse*.mjs`）：**只要页面里有一个没结束的 fetch（SSE 就是），
       * Chrome 的虚拟时钟就完全不走** —— 连 `setInterval` 的 tick 都是 0，
       * 而虚拟时间预算因此永不到期：dump **永远写不出来**，整个探针挂到超时。
       *
       * 而"审核跑着"那一屏恰恰就是"开着一条 SSE"（`RunLog` 订阅 run 事件流）。
       * 所以那一段的等待只能靠**DOM 变化**（MutationObserver 在微任务里回调，
       * 不依赖时钟），等完之后还必须让这条流**关掉**（点取消 ⇒ run 落终态 ⇒ 流自己结束；
       * 再兜一层：切换路由把这个组件卸载掉），否则后面整页都醒不过来。
       *
       * `maxEvents` 是**故意的上界**：真等到没有变化了也不无限等——宁可让判据变红，
       * 也不要一个挂十分钟、什么都看不出来的探针。
       */
      /**
       * ★★★ 时钟冻结时的"心跳"：用一次**真网络往返**代替 `wait()`。
       *
       * 上面解释了"SSE 开着时虚拟时钟不走"。但**网络请求照样完成**——所以拿一次轻量
       * 的 GET 当节拍器，就能在流开着的时候做有上界的轮询（既不挂死，也不会无限等）。
       */
      async function untilNet(fn, tries = 60) {
        for (let i = 0; i < tries; i++) {
          try {
            if (fn()) return true
          } catch {}
          try {
            await fetch('/api/agents', { cache: 'no-store' })
          } catch {}
        }
        return false
      }

      async function untilDom(fn, maxEvents = 80) {
        for (let i = 0; i < maxEvents; i++) {
          try {
            if (fn()) return true
          } catch {}
          /**
           * ⚠️ 这里原来**只**等 MutationObserver：DOM 一直不变时那个 Promise 永远不
           *    resolve ⇒ 整个探针挂死，dump 里 `facts` 停在上一段、`done` 永远不是 true
           *   （2026-11 实测：一次改动的判据在等一个根本不存在的 DOM 变化，探针连着
           *   两次超时，报出来的话是"探针没在超时前给出结果"——离真因隔了三层）。
           *
           * 现在与 `wait()` 赛跑：时钟能走时它兜住"没变化"，时钟被 SSE 冻住时
           * 那个 timer 本来就不会触发，行为与从前一致（仍靠 DOM 变化推进）。
           */
          const changed = await Promise.race([
            new Promise((resolve) => {
              const target = d().documentElement
              if (!target) {
                resolve(false)
                return
              }
              const mo = new MutationObserver(() => {
                mo.disconnect()
                resolve(true)
              })
              mo.observe(target, { subtree: true, childList: true, characterData: true })
            }),
            wait(400).then(() => false),
          ])
          if (!changed) return false
        }
        return false
      }

      function click(el) {
        if (!el) {
          note('click：目标元素不存在（选择器可能改了）')
          return false
        }
        el.dispatchEvent(
          new MouseEvent('click', { bubbles: true, cancelable: true, view: f.contentWindow }),
        )
        return true
      }

      function need(name, fn) {
        try {
          const v = fn()
          if (v === undefined) errors.push(`${name}：拿不到值`)
          return v
        } catch (e) {
          errors.push(`${name}：${e && e.message ? e.message : e}`)
          return null
        }
      }

      async function main() {
        await new Promise((r) => f.addEventListener('load', r, { once: true }))

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 智能体：主从布局 ══════════════
        // 首启会播种一对 agent（一个执行、一个审核），所以这里等得到卡片；
        // 等不到就说明界面或接口坏了——那本身就是要报出来的事。
        const gotCards = await until(() => d().querySelectorAll('.list-row-main').length > 0)
        const cards = () => [...d().querySelectorAll('.list-row-main')]
        /**
         * ★ 分批第 268 批：列表分组之后（内置默认收拢），**"按名字找一行"必须先展开它所在的那组**。
         *   探针里好几处都靠 `.agent-row` + 名字找人（记忆那一节 / 默认智能体那一节）——
         *   组收着的时候找不到，红的原因会是"没量到"，而那与界面对不对无关。
         *   ⚠️ 每次**离开再回来**页面都会重建、分组回到默认（内置收拢），所以这个助手要在
         *     "每次导航之后"调用，而不是启动时调一次。
         */
        const expandAllGroups = async () => {
          for (const head of [...d().querySelectorAll('[data-list-group]')]) {

              await untilNet(
                () =>
                  d()
                    .querySelector(`[data-list-group="${head.getAttribute('data-list-group')}"]`)
                    ?.getAttribute('aria-expanded') === 'true',

        }

        /**
         * 按名字选中一个 agent（先展开分组，再点那一行，**等详情里的名字真的对上**）。

         * ⚠️ 为什么不能"点第一条"就完事：分组之后第一条可见行会随折叠状态变，而它后面
         *   那几条判据都默认"被点开的是起草者"（runtime 选择器、挂着的技能、内置徽标）。
         */
        const selectAgentByName = async (needle) => {
          await expandAllGroups()
          const row = [...d().querySelectorAll('.list-row-main')].find((c) =>
            (text(c) ?? '').includes(needle),
          )
          if (row) {
            click(row)
            await untilNet(
              () => (text(d().querySelector('.detail-pane [data-agent-head-name]')) ?? '').includes(needle),
              40,
            )
            return true
          }
          return false
        }

        /**
         * ★ 2026-11（D147）：顶栏那一排动作里，**「新建平台成员」要在、而且要置灰**。
         *
         * 使用者 D145 拍板：「一期只允许用户造 `owner=user`，相关入口**显示但置灰**」。
         * 这条判据要的是三件事：位置（顶栏那排）、状态（`disabled`）、以及**给得出原因**
         * （`title` 非空）——只灰不说，读起来就是坏了。
         */
        facts['agents.pageActions'] = [...d().querySelectorAll('.topbar .page-actions button')].map(
          (b) => ({
            label: (text(b) ?? '').trim(),
            primary: b.className.includes('primary'),
            disabled: b.disabled === true,
            title: (b.getAttribute('title') ?? '').trim(),
          }),
        )

        facts['agents.gotData'] = gotCards
        if (!gotCards) errors.push('智能体页等了 15 秒也没出现任何 .list-row-main（数据没到或列表没渲染）')

        facts['agents.cardCount'] = cards().length

        /**
         * ★ 分批第 268 批（使用者："期待分组，将『内置』分成一直，其他分成组"）：
         *   左栏按 **内置 / 自建** 归堆，内置在上且**默认收拢**、自建在下且**默认展开**，
         *   标题后面留一句小字。
         *
         * 量五件（都是"看起来对"量不出来的）：
         *   ① 两个组标题都在、名字是「内置」「自建」，且顺序是内置在前；
         *   ② 内置**收拢**（一个内置行都看不见）、自建**展开**（行看得见）；
         *   ③ 点内置标题能展开、再点收回来（可点，不是装饰）；
         *   ④ 两句小字都在（"不能删" / "可改可删"）；
         *   ⑤ 分组**只归堆**：内置那组里只有 `builtin` 的，自建那组里一个内置都没有。
         */
        facts['agents.listGroups'] = await (async () => {
          const heads = () => [...d().querySelectorAll('[data-list-group]')]
          const headOf = (kind) => heads().find((b) => b.getAttribute('data-list-group') === kind)
          const rowsOf = () =>
            [...d().querySelectorAll('.list-pane .list-row-main')].map((r) =>
              (text(r) ?? '').trim(),
            )
          const before = heads().map((b) => b.getAttribute('data-list-group'))
          const labels = heads().map((b) => (text(b) ?? '').trim())
          const builtinHead = headOf('builtin')
          const ownHead = headOf('own')

          // ★ 2026-11（D161）名字里的「（内置）」后缀去掉了，而名字是使用者能改的、槽位不是）
          const rowsNow = rowsOf()
          const isPlatformRow = (row) => (row.getAttribute('data-slot') ?? 'user') !== 'user'
          const builtinRowsHidden = ![...d().querySelectorAll('.list-pane .list-row')].some(isPlatformRow)
          const ownRowsVisible = rowsNow.length > 0
          // 点一下展开
          click(builtinHead)
          const expanded = await untilNet(
            () => headOf('builtin')?.getAttribute('aria-expanded') === 'true',
            40,

          const rowsAfterExpand = rowsOf()
          const builtinRowsShown = [...d().querySelectorAll('.list-pane .list-row')].some(isPlatformRow)
          /**
           * 再点一次收回 —— 验证"能收"。
           * ⚠️ 但**最后要留在展开态**：这一节后面还有三条判据要量内置那两行
           *    （起草者 / 记忆整理者的徽标）。默认收拢是使用者的要求，可探针必须先把它们
           *    露出来才量得到——"量不到"不等于"不存在"。
           */
          click(headOf('builtin'))

            () => headOf('builtin')?.getAttribute('aria-expanded') === 'false',
            40,
          )

          const leftExpanded = await untilNet(
            () => headOf('builtin')?.getAttribute('aria-expanded') === 'true',
            40,
          )
          return {
            present: true,
            before,
            labels,
            builtinCollapsed,
            ownExpanded,
            builtinRowsHidden,
            ownRowsVisible,
            expanded,
            builtinRowsShown,
            collapsedAgain,
            leftExpanded,
            builtinHints: (text(builtinHead) ?? '').includes('不能删'),
            ownHints: (text(ownHead) ?? '').includes('可改可删'),
          }
        })()




        // ★★ 内置起草者 / 内置 skill 审核者那一行：角色徽标要说出它们是谁（§9/D81、§10/D82）。
        //    ⚠️ 这一条是**改出来才发现**的：列表原先写的是 `role === 'reviewer' ? 审核 : 执行`，
        //    加了 `drafter` / `skill-reviewer` 之后，它们被标成**「执行」**——一个永远不会
        //    接任务的 agent 看起来像执行者。判据用**名字**定位那一行（内置 agent 的名字由
        //    平台给，使用者能改的是指令不是名字的用途），再量徽标文字。
        {
          const rowOf = (needle) =>
            cards().find(
              (c) => (c.querySelector('strong')?.textContent ?? '').includes(needle),
            ) ?? null
          const drafterRow = rowOf('起草者')
          facts['agents.drafterRowFound'] = !!drafterRow
          /*
           * ⚠️ 2026-11（D155）：这里原来还量"起草者那一行的**徽标**写着「起草」"。
           *   列表行不再画成员徽标（使用者："都是智能体"）⇒ 那个事实与它的判据一起删。
           */
          // ★ 分批第 137 批：内置 skill 审核者已下线（沉淀线不再评审）⇒ 启动时只播种起草者。
          //   "那一行在不在 / 徽标说什么"的测量连同内置审核者一起删除（功能没了，判据也该没了）。
          facts['agents.skillAuditorRowFound'] = null
          facts['agents.skillAuditorRowBadge'] = null
          /**
           * ★ 分批第 244 批：内置「记忆整理者」也在这一页（使用者：「要和沉淀技能一样，
           *   也有一个智能体显示在智能体页面列表中，方便我查看其 prompt」）。
           *   量两件：那一行在、徽标写的是「整理记忆」（不是「执行」——它永远不接活）。
           */
          const tidyRow = rowOf('记忆整理者')
          facts['agents.memoryTidyRowFound'] = !!tidyRow
          // ⚠️ 2026-11（D155）：同上，徽标不画了 ⇒ 只量"那一行在不在"。
        }
        // 每张卡都要有：名字、角色徽章、一行说明（指令摘要 + 关系/技能/runtime 两部分）
        // ★ 2026-10（紧凑性）：原先是**两行**说明（`.agent-note` × 2，各占一行），
        //   使用者要求合并成一行——所以这里改量 `.agent-notes` 里的两个子 span。
        /**
         * ★★ 2026-11（D156）：**长名字的智能体行仍然是"标题一行 + 副行一行"**（范例页那条
         *   "长标题被裁成一行"）。
         *
         * 为什么这条要专门量：`.agent-line` 是 `flex-wrap: wrap`（为了让「默认」徽标在窄栏

         * "这一行比别的高一点"**。所以这里量三条：标题被裁（scrollWidth > clientWidth）、
         * 标题元素所在的那一行**没有折行**（行高与短名字那条差 ≤2px）、副行仍在。
         */
        facts['agents.longNameRow'] = (() => {
          const rows = [...d().querySelectorAll('.agent-list .agent-row')]
          const pick = (needle) =>
            rows.find((r) => (r.querySelector('.agent-line strong')?.textContent ?? '').includes(needle))
          const long = pick('探针夹具智能体')
          const short = pick('短名')

            longH: Math.round(box.height),
            shortH: short ? Math.round(short.getBoundingClientRect().height) : null,
            hasSub: !!long.querySelector('.list-row-sub'),
          }
        })()

        facts['agents.everyCardWellFormed'] =
          cards().length > 0 &&
          cards().every(
            (c) =>
              !!c.querySelector('strong') &&
              // ★ 2026-11（D155）：行上不再画成员徽标（"都是智能体"）⇒ 不再要求 .badge
              !!c.querySelector('.agent-notes-trunc') &&
              !!c.querySelector('.agent-notes-meta'),
          )
        /*
         * ⚠️ 2026-11（D155）：这里原来量"执行者卡片上的元信息里，'由谁审它'解析出了名字"。
         *   两个前提都已经不成立：① **审核者这条概念在 D127 就退场了**（元信息里没有它了）；
         *   ② 列表行不再画成员徽标（原来靠它找"执行者那张卡"）。
         *   整条事实与判据一起删——留着只会量到一个恒为 null 的东西。
         */

        const layout = () => d().querySelector('.split-layout')
        const main = () => d().querySelector('main.main')

        facts['agents.initialClass'] = need('初始 class', () => layout()?.className)
        facts['agents.initialListDisplay'] = need('初始左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.initialDetailDisplay'] = need('初始右栏', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        // `:has(> .split-layout)` 那条规则若失效，整页会变成"外层滚动"而不是
        // 两栏各自滚动——类型检查完全看不出来，所以这里量出来。
        facts['agents.mainOverflowY'] = need('main overflow-y', () => cs(main()).overflowY)
        facts['agents.mainPaddingTop'] = need('main padding-top', () => cs(main()).paddingTop)
        facts['agents.layoutHeightDelta'] = need('布局高度 vs main 高度差', () =>
          Math.round(layout().getBoundingClientRect().height - main().clientHeight),
        )

        /**
         * ── 真点击第一条 ──
         *
         * ⚠️ 分组（第 268 批）之后第一条可见行是**自建组的第一条**（内置那组默认收拢），
         *    与分组前"全表第一条"是同一个人（内置的在折叠里本来也看不见）——所以这里
         *    保持"点第一条"，不要改成点起草者：起草者被夹具改挂成了 `generic` runtime，
         *    而下面 `runtimeOptionsNoDefault` 会因此多出一个"(当前)"选项、当场变红。
         */
        /**
         * ★ 分批第 273 批：**只点自建那一条**，不要点"全表第一条"。
         *   内置 agent 现在整份只读（没有角色二选一、CLI/指令锁着、保存那栏换成「恢复成默认值」），
         *   而上面 `listGroups` **故意把内置那组留在展开态**（要量那两行的徽标）⇒ 全表第一条
         *   是「起草者」。点它的话，下面一整串"卡片里真的能改"的判据会全红——
         *   那是判据选错了人，不是界面坏了。
         */
        // ★ 2026-11（D161）：自建 = `data-slot="user"`（名字不再带后缀）
        const firstOwn = cards().find(
          (c) => (c.closest('.list-row')?.getAttribute('data-slot') ?? 'user') === 'user',
        )
        facts['agents.firstCardIsOwn'] = !!firstOwn
        click(firstOwn ?? cards()[0])
        const entered = await until(() => layout()?.className.includes('with-detail'))
        if (!entered) errors.push('点了第一条 agent 之后 .split-layout 没有带上 with-detail')
        facts['agents.afterClickClass'] = need('点击后 class', () => layout()?.className)
        facts['agents.tracks'] = need('网格列数', () => cs(layout()).gridTemplateColumns.split(' '))
        // 2026-11：列表宽度可拖——把手是动作**插进网格**的（不是 CSS 画的），在页面上就得量得到
        facts['agents.listGripPresent'] = !!d().querySelector('.split-layout .split-grip')
        // ⚠️ 选中态挂在 `.agent-row`（那一行才是卡片：边框要包住右侧的开关），
        //    所以这里按**行**取，再确认它里面确实是刚点的那张卡
        facts['agents.activeCardClass'] = need('选中态', () =>
          d().querySelector('.agent-row.active')?.className.replace(/ svelte-\w+/, ''),
        )
        // ⚠️ 2026-10（使用者拍板）：智能体**没有预览页了**——选中即编辑，右栏
        //    进来就是一张可编辑卡片（与智能体组页同款）。原来这里认的是
        //    `.detail-pane .detail`（查看态那套 DOM），那一整套随改造删掉了。
        facts['agents.detailRendered'] = need('右栏是否渲染出详情（可编辑卡片）', () =>
          !!d().querySelector('.detail-pane .card.agent-card'),
        )
        // ★ 这三条钉的就是"没有查看/编辑两态"这个决定：右栏没有 hero 头、
        //   页面上没有「编辑」按钮、卡片里就是能改的控件。
        facts['agents.detailNoHero'] = need('没有 hero 头', () =>
          !d().querySelector('.detail-pane .hero'),
        )
        facts['agents.detailNoEditButton'] = need('没有「编辑」按钮', () =>
          ![...d().querySelectorAll('.detail-pane button')].some(
            (b) => text(b).trim() === '编辑',
          ),
        )
        facts['agents.detailEditableInPlace'] = need('卡片里就是可编辑的控件', () =>
          !!d().querySelector('.detail-pane #agent-instructions') &&
          // ★ 2026-11（D153）：「类型 / 岗位」那一格删了 ⇒ 用「入口」那一格当"卡片里就是控件"的证据
          !!d().querySelector('.detail-pane [data-agent-entries]'),
        )
        // 2026-11（使用者："智能体指令可能写很长"）：指令框的「⛶ 展开」按钮要能
        // 弹大编辑器（选中的是自建 agent，非内置 → 不是只读，按钮应在）
        facts['agents.promptEditorOpens'] = await (async () => {
          const expand = d().querySelector('.detail-pane #agent-instructions + .prompt-expand')
          const anyExpand = d().querySelector('.detail-pane .prompt-expand')
          if (!anyExpand) {
            errors.push('agents.promptEditor：指令框没有「⛶ 展开」按钮')
            return false
          }
          click(anyExpand)
          await until(() => !!d().querySelector('.pe-panel'), 40)
          const opened = !!d().querySelector('.pe-panel .pe-textarea')
          click(d().querySelector('.pe-actions .btn--ghost'))
          await until(() => !d().querySelector('.pe-panel'), 40)
          if (!opened) {
            errors.push('agents.promptEditor：点展开没弹出编辑器')
            return false
          }
          return true
        })()

        /**
         * ══════════════ 记忆（分批第 240 批）══════════════
         *
         * 这一节要量的三件事，每一条都对应一个真实的坏法：
         *   ① **一条一行**（使用者明确要求"紧凑写"）：行高必须像一行文字，不是一张卡；
         *   ② **动作平时不占视线**（悬停才出）：静止时 `.mem-actions` 的 opacity 是 0；
         *   ③ **预览第一句话**（只读）：点开之后能看到「经验」那一段，且里面没有输入框
         *      ——能改的话它就变成第二个编辑入口。
         *
         * ⚠️ 夹具记忆是**这里自己造的**（幂等：详情里 0 条时才造），不依赖 run.mjs 的
         *    造数顺序——探针点的是"第一张卡"，谁排第一由列表决定。
         */
        facts['agents.memorySection'] = await (async () => {
          const win = f.contentWindow
          const name = String(text(d().querySelector('.detail-pane [data-agent-head-name]')) ?? '')
          if (name === '') return null
          const list = await win.fetch('/api/agents').then((r) => r.json())
          const me = (list.agents ?? []).find((a) => a.name === name)
          if (!me) return null
          /**
           * ★ 分批第 259 批：新建的智能体**默认关记忆** ⇒ 这一段量"记忆那一节"之前，
           *   先把它打开（否则写记忆恒 409、列表恒空，量到的全是"关着"的样子）。
           */
          const enableRes = await win.fetch(`/api/agents/${me.id}`, {
            method: 'PATCH',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ memoryEnabled: true }),
          })
          /**
           * ⚠️ PATCH 走的是 raw fetch，**页面里的 `$agents` store 并不会因此变新**；而详情页的
           * 草稿只在"换了一个 agent"时才重铺 ⇒ 直接点回同一个人看到的是旧的开关状态
           * （实测：接口上已经 true，界面上勾选框还是 false、加号行不出现）。
           * 所以先点一次页面级「刷新」把列表拉新，再选人。
           */
          const refreshBtn0 = [...d().querySelectorAll('.topbar .page-actions button')].find(
            (b) => text(b).trim() === '刷新',
          )
          if (refreshBtn0) click(refreshBtn0)
          await untilNet(() => !!d().querySelector('.card.agent-card'), 40)
          const detail = await win.fetch(`/api/agents/${me.id}`).then((r) => r.json())
          if ((detail.memory ?? []).length === 0) {
            await win.fetch(`/api/agents/${me.id}/memory`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                entries: [
                  { kind: 'commitment', text: '报告里不许出现"赋能"这类词' },
                  { kind: 'fact', text: '这个仓库跑测试用 pnpm，不要用 npm' },
                  { kind: 'lesson', text: 'SKILL.md 别超过 60 行：Procedure 太散会被判不过' },
                ],
              }),
            })
          }
          // 离开再回来：让详情重新读一次（记忆跟着 `GET /api/agents/{id}` 一起来）
          win.location.hash = '#/tasks'
          await untilNet(() => !d().querySelector('.detail-pane .card.agent-card'), 40)
          win.location.hash = '#/agents'
          await untilNet(
            () => [...d().querySelectorAll('.list-row-main')].some((c) => text(c).includes(name)),
            60,
          )
          // ★ 第 268 批：分组默认收拢（内置那组）⇒ 先展开，否则按名字找不到行
          await expandAllGroups()
          const row = [...d().querySelectorAll('.list-row-main')].find((c) => text(c).includes(name))
          if (row) click(row)
          await untilNet(() => !!d().querySelector('[data-agent-memory]'), 60)
          await untilNet(() => d().querySelectorAll('[data-mem-row]').length >= 1, 60)

          /**
           * 列表行上的「记忆 N 条」：`memoryCount` 来自 `GET /api/agents`，
           * 而**记忆是刚刚用 raw fetch 造的**（没走界面那条保存路径）⇒ 页面里的
           * 那份列表还是旧的。所以先点一次页面级「刷新」把列表拉新，再读那个徽标。
           * ⚠️ 这一步也在量一件事：列表那个计数真的跟着库走（不是只画了个字段）。
           */
          const refreshBtn = [...d().querySelectorAll('.topbar .page-actions button')].find(
            (b) => text(b).trim() === '刷新',
          )
          if (refreshBtn) click(refreshBtn)
          await untilNet(
            () =>
              [...d().querySelectorAll('.list-row-main')].some(
                (c) => c.querySelector('[data-agent-memory-count]') !== null,
              ),
            60,
          )
          const rowBadge =
            [...d().querySelectorAll('.list-row-main')]
              .map((c) => text(c.querySelector('[data-agent-memory-count]')) ?? '')
              .filter((t) => t !== '')[0] ?? null
          const section = d().querySelector('[data-agent-memory]')
          if (!section) return null
          const rows = [...section.querySelectorAll('[data-mem-row]:not([data-dropped="1"])')]
          const heights = rows.map((r) => Math.round(r.getBoundingClientRect().height))
          const actionsHidden = rows.every((r) => {
            const acts = r.querySelector('.mem-actions')
            return acts === null || cs(acts).opacity === '0'
          })
          const pins = section.querySelectorAll('[data-mem-pin]').length
          const countText = text(section.querySelector('[data-memory-count]')) ?? ''
          const previewBtn = section.querySelector('[data-memory-preview]')
          return {
            rows: rows.length,
            heights,
            oneLine: heights.every((h) => h > 0 && h <= 36),
            actionsHidden,
            pins,
            countText,
            hasPreview: previewBtn !== null,
            hasAddRow: !!section.querySelector('[data-mem-add]'),
            /**
             * ★ 分批第 260 批：「合并同类…」只在"记忆开着 + 至少两条"时出现
             *   （一条没什么可并的；关着则根本不该动记忆）。
             */
            hasConsolidate: !!section.querySelector('[data-memory-consolidate]'),
            rowBadge,
            // 诊断：这一节依赖"记忆开着"（新建的智能体默认关）
            enableStatus: enableRes.status,
            detailEnabled: detail.memoryEnabled,
            switchChecked: section.querySelector('[data-memory-enabled]')?.checked ?? null,
          }
        })()

        /**
         * ★ 分批第 254 批（使用者："加入记忆后，布局乱了"）：**卡片网格里不许有洞**。
         *
         * 卡片是两列网格。原来「指令」与「挂载的技能」都只占**左半列**，右半列空着——
         * 记忆加进来之前那个洞被"指令 | 技能"正好配对遮住了，记忆插到中间之后配对散掉，
         * 洞就露出来。这条判据按"行"量：把顶边相同的格子归成一行，每行的宽度总和
         * 必须铺满卡片（或者只有一格且它占整行）。任何一格只占半行又没人陪它，就红。
         */
        /**
         * ★ 分批第 269 批（使用者："智能体的细节页……只是先要有类似任务和聊天那页的 Title 顶栏"）：
         *
         * 量四件：
         *   ① 标题栏在（`.detail-head` 在详情里、名字在 h2 里）；
         *   ② 副题一行（CLI / 记忆 / 技能数）；
         *   ③ 右侧动作工具条里**有保存与取消**（保存从页面底部上移到这里）；
         *   ④ **名字只有一个入口**：`#agent-name` 那个输入框不该再存在（否则标题与卡片
         *      各一份，谁是真的说不清）。
         */
        facts['agents.headBar'] = await (async () => {
          const head = d().querySelector('.detail-pane .detail-head')
          if (!head) return { present: false }
          const h2 = head.querySelector('h2')
          const name = text(head.querySelector('[data-agent-head-name]')) ?? ''
          const sub = text(head.querySelector('[data-agent-head-sub]')) ?? ''
          const btns = [...head.querySelectorAll('.detail-actions button')]
          const labels = btns.map((b) => (text(b) ?? '').trim())
          const topRow = d().querySelector('.topbar .page-actions')
          const act = head.querySelector('.detail-actions')
          const sameTrack =
            topRow !== null &&
            act !== null &&
            cs(act).backgroundColor === cs(topRow).backgroundColor &&
            cs(act).backgroundColor !== 'rgba(0, 0, 0, 0)'
          return {
            present: true,
            hasH2: h2 !== null,
            name,
            sub,
            labels,
            hasSave: labels.some((l) => l.includes('保存')),
            hasCancel: labels.some((l) => l.includes('取消')),
            sameTrack,
            /**
             * ★★ 2026-11（D157）：**栏头里三块的位置**（这一条以前完全没量过）。
             *
             * `.detail-head` 是两列网格：标题 + 副题必须在**同一个格子**里上下两行，
             * 动作在**右边**那一列、与文字块同一行。不包 `.detail-head-main` 的话，
             * 副题会占掉动作那一格、动作掉到第二行左边——使用者一眼就看出来了：
             * "「CLI：default · 记忆 0 条 · 0 个技能」的位置不对，放副标题的位置？"
             */
            layout: (() => {
              const subEl = head.querySelector('[data-agent-head-sub]')
              const actEl = head.querySelector('.detail-actions')
              if (!h2 || !subEl || !actEl) return null
              const rh = h2.getBoundingClientRect()
              const rs = subEl.getBoundingClientRect()
              const ra = actEl.getBoundingClientRect()
              return {
                // 副题与标题**左沿对齐**（同一个格子里）
                subAligned: Math.abs(rs.left - rh.left) <= 2,
                // 副题在标题**下方**
                subBelow: rs.top >= rh.bottom - 2,
                // 动作在**右边**那一列（标题块右边沿之后）
                actRight: ra.left >= rh.right - 2,
                // 动作与文字块**同一行**（垂直区间有交叠）
                actSameRow: ra.top < rs.bottom && ra.bottom > rh.top,
              }
            })(),
            // 名字的第二个入口：卡片里那个输入框已经删了
            legacyNameInput: d().querySelector('#agent-name') !== null,
          }
        })()
        // 单独发布一份给判据读（`agents.headBarLayout`）——判据一个 key 读一件事，
        // 埋在上面那个大对象里的话它读不到（第一版就是这么红成"没量到这个值"的）。
        facts['agents.headBarLayout'] = facts['agents.headBar']?.layout ?? null

        /**
         * ★ 分批第 273/274 批（使用者："这些内置智能体在我点击之后是不能修改的，那这些保存、删除
         *   等按钮应该就是置灰的"；"我记得内置智能体都是执行智能体，那为什么我没有看到被选择"；
         *   最后定了"内置和自建在呈现方式上行为不同一"⇒ 采用**方案 A：同一套骨架、只读的锁住**）。
         *
         * 服务端**整份拒绝**内置 agent 的 PATCH（连 CLI 也不许）⇒ 界面上不该出现任何"点了
         * 就会 400"的东西。这一条量的是"锁住了"，并且逐件对着当时的真实坏法：
         *   ① 没有「保存」（留着就是假动作），有「恢复成默认值」与「关闭／取消」；
         *   ② 没有「改名」入口；
         *   ③ 角色格**仍在原位、仍是两张卡**，但两张都不可点（内置角色是 drafter /
         *      memory-tidy / skill-reviewer，那个执行/审核二选一对它两边都不亮）；
         *   ④ CLI 下拉 `disabled`、指令框 `readonly`，两者都带一枚「只读」标记；
         *   ⑤ 记忆那节**骨架不缩水**：开关 / 写入口 / 行内改删都还在原位，只是 `disabled`；
         *   ⑥ 技能那一格用的是**同一个 `.skill-picker`**（不是一列 chip），勾选框锁着；
         *   ⑦ **自建 agent 仍然可改**——少了这半，"整页只读"也能让上面全绿。
         */
        facts['agents.builtinReadOnly'] = await (async () => {
          const prevName = String(
            text(d().querySelector('.detail-pane [data-agent-head-name]')) ?? '',
          )
          /**
           * ⚠️ 先给这条内置 agent 造**一条记忆**（幂等）。
           *   为什么非要造：记忆行内那两颗按钮（改 / 删）与 ★ 只有"有条目"时才存在，
           *   没有条目时这两项恒为 null ⇒ 判据空过，将来谁把 `disabled` 弄丢都不会红。
           *   探针的 daemon 允许改内置（`allowBuiltinEdits`），所以这条写得进去。
           */
          {
            const win = f.contentWindow
            const list = await win.fetch('/api/agents').then((r) => r.json())
            // ★ 2026-11（D154）：内置成员看**槽位**（服务端算好发下 `slot`）
            const me = (list.agents ?? []).find((a) => a.slot === 'drafter')
            if (me) {
              await win.fetch(`/api/agents/${me.id}`, {
                method: 'PATCH',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ memoryEnabled: true }),
              })
              const detail = await win.fetch(`/api/agents/${me.id}`).then((r) => r.json())
              if ((detail.memory ?? []).length === 0) {
                await win.fetch(`/api/agents/${me.id}/memory`, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    entries: [{ kind: 'fact', text: '探针夹具：内置智能体的记忆行（量只读态用）' }],
                  }),
                })
              }
              /**
               * PATCH 走的是 raw fetch，页面里的 store 不会自己变新 ⇒ 先点「刷新」把它拉新。
               * ⚠️ 但只刷新**不够**：`AgentDetail` 的草稿只在"换了个 agent"时重铺（同一个
               *   id 换了个对象不算），于是接口上 `memoryEnabled` 已经是 true、勾选框还是
               *   没勾（实测到的正是这个）。所以刷新之后再**换一个人再换回来**，让详情按
               *   新那份重新读一次。
               * ⚠️ 也别用 `location.hash` 离开这一页：那会把整页重建，后面几条判据的前置
               *   状态跟着变（实测：`agents.builtinParity` 与 `agents.runtimeOptions` 一起
               *   变成 null）。
               */
              const refreshBtn = [...d().querySelectorAll('.topbar .page-actions button')].find(
                (b) => text(b).trim() === '刷新',
              )
              if (refreshBtn) click(refreshBtn)
              await untilNet(() => !!d().querySelector('.card.agent-card'), 60)
              // ★ 2026-11（D161）：这里原来选「助手」当"自建 agent"的样本——它现在是**平台成员**
              //   （只读），所以换成本探针自己造的自建夹具（`短名`，见 run.mjs 的长名字夹具）。
              await selectAgentByName('短名')
              await selectAgentByName('起草者')
            }
          }
          const picked = await selectAgentByName('起草者')
          if (!picked) {
            if (prevName !== '') await selectAgentByName(prevName)
            return { found: false }
          }
          await untilNet(() => !!d().querySelector('.card.agent-card'), 40)
          await untilNet(() => d().querySelectorAll('[data-mem-row]').length >= 1, 60)
          const head = d().querySelector('.detail-pane .detail-head')
          const labels = [...(head?.querySelectorAll('.detail-actions button') ?? [])].map((b) =>
            (text(b) ?? '').trim(),
          )
          const cli = d().querySelector('#agent-runtime')
          const ta = d().querySelector('#agent-instructions')
          const memRows = [...d().querySelectorAll('[data-mem-row]')]
          const skillBoxes = [...d().querySelectorAll('.card.agent-card .skill-picker input')]
          const out = {
            found: true,
            headLabels: labels,
            hasSave: labels.some((l) => l.includes('保存')),
            /*
             * ★ 2026-11（D160）：平台成员身上现在是「复制」与「关闭」两颗
             *   （「恢复成默认值」与「改为普通智能体」都删了——复制替掉了它们）。
             */
            hasRestore: labels.some((l) => l.includes('复制')),
            // 三槽位纪律（274 批）：主=写（这里是"恢复成默认值"）、次=离开、危险=删
            hasLeave: labels.some((l) => l.includes('取消') || l.includes('关闭')),
            hasDelete: labels.some((l) => l.includes('删除')),
            rename: d().querySelector('[data-agent-rename]') !== null,
            /**
             * ③ ★ 2026-11（D153）：「类型 / 岗位」那一格**整格删掉**了（使用者："感觉不需要
             *   显示『类型』，把『入口』、把 entries：Action 显示出来"）。现在这一段的证据换成
             *   「入口」那一格：
             *     · 三个勾选框都在、都**锁着**（`disabled`）；
             *     · **平台动作徽标**摆出来了（`action:<id>` 那一半以前界面上一个字都没有）。
             */
            entriesCell: d().querySelector('.card.agent-card [data-agent-entries]') !== null,
            entryBoxes: [...d().querySelectorAll('.card.agent-card [data-agent-entries] input')].length,
            entryBoxesDisabled: [
              ...d().querySelectorAll('.card.agent-card [data-agent-entries] input'),
            ].every((el) => el.disabled === true),
            actionEntries: [...d().querySelectorAll('[data-agent-action-entry]')].map((el) => ({
              id: el.getAttribute('data-agent-action-entry'),
              label: (text(el) ?? '').trim(),
              title: (el.getAttribute('title') ?? '').trim(),
            })),
            rolePicker: d().querySelector('.card.agent-card .role-picker') !== null,
            // ④ 两个文本控件
            cliDisabled: cli === null ? null : cli.disabled === true,
            instructionsReadonly: ta === null ? null : ta.hasAttribute('readonly') === true,
            lockMarks: d().querySelectorAll('.card.agent-card .lockmark').length,
            // ⑤ 记忆那一节：控件都在，只是锁着
            memorySwitch: d().querySelector('[data-memory-enabled]') !== null,
            memorySwitchDisabled:
              d().querySelector('[data-memory-enabled]')?.disabled !== false,
            /**
             * ⚠️ 写入口**在不在只由开关决定**（关着就没有，自建也一样）——所以这里先量开关
             *   自己，再让判据去比"写入口存在与否 == 开关是否打开"。把 `memoryAdd === true`
             *   写死会红在"这条内置 agent 记忆关着"上，而那是**同一套规则**的正确表现。
             */
            memoryOn: d().querySelector('[data-memory-enabled]')?.checked === true,
            memoryAdd: d().querySelector('[data-mem-add]') !== null,
            memoryAddDisabled: d().querySelector('[data-mem-add]')?.disabled !== false,
            memRows: memRows.length,
            memRowActions: memRows.length === 0 ? null : memRows.every((r) => r.querySelector('.mem-actions') !== null),
            memRowActionsDisabled:
              memRows.length === 0
                ? null
                : memRows.every((r) =>
                    [...r.querySelectorAll('.mem-actions button')].every((b) => b.disabled === true),
                  ),
            memPinDisabled:
              memRows.length === 0
                ? null
                : memRows.every((r) => [r.querySelector('[data-mem-pin]')].every((b) => b === null || b.disabled === true)),
            // ⑥ 技能那一格：同一个骨架 + 锁着
            skillPickerLocked: d().querySelector('[data-skill-picker-locked]') !== null,
            skillBoxes: skillBoxes.length,
            skillBoxesDisabled: skillBoxes.length > 0 && skillBoxes.every((b) => b.disabled === true),
            // ⑦ 另一半：自建 agent 必须还是能改的（用「助手」，它一定不是内置）
            ownEditable: false,
          }
          const own = await selectAgentByName('短名')
          const ownCli = d().querySelector('#agent-runtime')
          const ownTa = d().querySelector('#agent-instructions')
          const ownHead = d().querySelector('.detail-pane .detail-head')
          const ownLabels = [...(ownHead?.querySelectorAll('.detail-actions button') ?? [])].map(
            (b) => (text(b) ?? '').trim(),
          )
          const ownEntryBoxes = [...d().querySelectorAll('.card.agent-card [data-agent-entries] input')]
          out.ownEditable =
            own === true &&
            /**
             * ★ 2026-11（D153）：自建那一侧的骨架证据从"一张静态角色卡"换成**「入口」三项
             *   都能勾**（它本来就可配）。意图没变——"自建仍然能改"。
             */
            ownEntryBoxes.length === 3 &&
            ownEntryBoxes.every((el) => el.disabled !== true) &&
            // 平台动作徽标**不该出现在自建用户智能体上**（它没有 action: 接入点）
            d().querySelector('[data-agent-entry-actions]') === null &&
            ownCli !== null &&
            ownCli.disabled === false &&
            ownTa !== null &&
            !ownTa.hasAttribute('readonly') &&
            ownLabels.some((l) => l.includes('保存'))
          if (prevName !== '' && prevName !== '短名') await selectAgentByName(prevName)
          return out
        })()

        /**
         * ★ 分批第 274 批（使用者："内置和自建在呈现方式上行为不同一"，定了方案 A
         *   "同一套骨架、只读的锁住"）。
         *
         * 这一条只量**骨架**：同一批选择器在内置那张卡上与在自建那张卡上是否都成立，
         * 以及角色格的两张卡数量是否一致。为什么只挑这几样：技能列表与记忆行数取决于
         * 那一个 agent 的**数据**（有没有挂技能、有没有记忆），拿它们比会把"数据不同"
         * 误判成"骨架不同"。
         */
        facts['agents.builtinParity'] = await (async () => {
          const prevName = String(
            text(d().querySelector('.detail-pane [data-agent-head-name]')) ?? '',
          )
          const shape = () => {
            const entriesBox = d().querySelector('.card.agent-card [data-agent-entries]')
            return {
              /**
               * ★ 2026-11（D153）：「类型 / 岗位」那一格删掉之后，两边能比的骨架是：
               *   「入口」那一格在不在（**两边都在**——它现在是这一页唯一的"身份"视图）、
               *   CLI、指令、记忆节、记忆开关。
               * ⚠️ 勾选框**数量**不能比：内置那三个锁着，自建那三个能勾，数量都是 3 但
               *   状态不同（状态在 `agents.builtinReadOnly` 那条里分开量）。
               */
              entriesCell: entriesBox !== null,
              cli: d().querySelector('#agent-runtime') !== null,
              instructions: d().querySelector('#agent-instructions') !== null,
              memoryCell: d().querySelector('[data-agent-memory]') !== null,
              memorySwitch: d().querySelector('[data-memory-enabled]') !== null,
            }
          }
          if (!(await selectAgentByName('起草者'))) return { found: false }
          const builtin = shape()
          if (!(await selectAgentByName('短名'))) return { found: false }
          const own = shape()
          if (prevName !== '' && prevName !== '短名') await selectAgentByName(prevName)
          const keys = Object.keys(builtin)
          // 高度按 ±2px 比（亚像素取整不该让这条变红）
          const same = (k) => builtin[k] === own[k]
          return {
            found: true,
            builtin,
            own,
            differs: keys.filter((k) => !same(k)),
          }
        })()

        /**
         * ★★★ 2026-11（D158）：**换人时"这一屏的临时状态"必须一起作废**。
         *
         * 使用者报的：「点改名后，我选中其他智能体，还保持在改名状态」——`renaming` 是
         * 组件自己的状态，`agent` 换了它不变 ⇒ 标题栏还挂着**上一个人的改名输入框**
         * （里面是上一个人的名字），底下却是新的人。
         *
         * 量三件（"变量改了"不算数，要量**界面**）：
         *   ① 改名态真的进去了（输入框在，且里面是那个人的名字）；
         *   ② 选中另一个人之后，改名输入框**没了**、标题显示的是**新那条**的名字；
         *   ③ 没有残留「（未保存）」提示（改名只落在草稿里，换人后草稿作废）。
         * ⚠️ 最后要把选中项恢复到进来时那个人：后面还有判据要量它的详情。
         */
        facts['agents.renameOnSwitch'] = await (async () => {
          const rows = () => [...d().querySelectorAll('.agent-list .agent-row')]
          const nameOf = (row) => (text(row.querySelector('.agent-line strong')) ?? '').trim()
          const headName = () =>
            (text(d().querySelector('[data-agent-head-name]')) ?? '').trim()
          const renameBtn = () => d().querySelector('[data-agent-rename]')
          // 找两条**能改名**的（自建）行
          const editable = rows().filter((r) => (text(r) ?? '').includes(''))
          const prev = headName()
          // ★ 2026-11（D161）：自建 = `data-slot="user"`
          const ownRows = rows().filter(
            (r) => (r.getAttribute('data-slot') ?? 'user') === 'user',
          )
          if (ownRows.length < 2) return { skipped: '自建的智能体不足两条' }
          const first = ownRows[0]
          click(first.querySelector('.list-row-main') ?? first)
          await until(() => headName() === nameOf(first), 60)
          const btn = renameBtn()
          if (!btn) return { skipped: '这一条没有「改名」入口' }
          click(btn)
          /*
           * ⚠️ `until()` 返回的是**布尔**（不是它等的那个元素）——第一版写成
           * `const input = await until(...)` 再读 `input.value`，于是 `entered` 恒为 false，
           * 判据红在一个"量法错"上，而不是界面上。
           */
          const enteredOk = await until(() => !!d().querySelector('.agent-rename-input'), 40)
          const input = d().querySelector('.agent-rename-input')
          const entered = enteredOk && !!input && (input.value ?? '') === nameOf(first)

          // 换到另一条（**不提交改名**）
          const second = ownRows[1]
          click(second.querySelector('.list-row-main') ?? second)
          const switched = await until(() => headName() === nameOf(second), 60)
          const renameGone = !d().querySelector('.agent-rename-input')
          const pendingGone = !d().querySelector('[data-agent-rename-pending]')
          const shown = headName()

          // 恢复到进来时那个人（后面的判据要量它的详情）
          const back = rows().find((r) => nameOf(r) === prev)
          if (back) {
            click(back.querySelector('.list-row-main') ?? back)
            await until(() => headName() === prev, 60)
          }
          void editable
          return {
            entered,
            switched,
            renameGone,
            pendingGone,
            shownIsSecond: shown === nameOf(second),
            first: nameOf(first),
            second: nameOf(second),
            shown,
          }
        })()

        facts['agents.cardNoHoles'] = await (async () => {
          /**
           * ★ 第 272 批：**选一个挂着技能的智能体**再量。
           *   不然"技能列表与指令框同高"那两项永远量不到（没有技能时 `.skill-picker` 不存在），
           *   而那正是第 255/256 批修的那件事——量不到就等于没守。
           */
          if (d().querySelector('.card.agent-card .skill-picker') === null) {
            await expandAllGroups()
            const withSkills = [...d().querySelectorAll('.list-row-main')].find((row) => {
              const t = text(row) ?? ''
              return /· [1-9]\d* 个技能/.test(t)
            })
            if (withSkills) {
              click(withSkills)
              await untilNet(() => !!d().querySelector('.card.agent-card .skill-picker'), 40)
            }
          }
          const card = d().querySelector('.card.agent-card')
          if (!card) return null
          const kids = [...card.children].filter((el) => {
            const st = cs(el)
            return st.display !== 'none'
          })
          const csOf = (el) => el.getBoundingClientRect()
          const cardRect = csOf(card)
          // 内容区宽度：去掉 padding
          const padL = parseFloat(cs(card).paddingLeft) || 0
          const padR = parseFloat(cs(card).paddingRight) || 0
          const innerW = Math.round(cardRect.width - padL - padR)
          const gap = Math.round(parseFloat(cs(card).columnGap) || 0)
          // 按顶边分组（同一网格行的格子顶边相同）
          const rows = new Map()
          for (const el of kids) {
            const r = csOf(el)
            if (r.width < 2 || r.height < 1) continue
            const key = Math.round(r.top)
            const list = rows.get(key) ?? []
            list.push({
              label: (el.querySelector('.cell-label')?.textContent ?? el.textContent ?? '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 14),
              w: Math.round(r.width),
            })
            rows.set(key, list)
          }
          const holes = []
          for (const [, cells] of [...rows.entries()].sort((a, b) => a[0] - b[0])) {
            const sum = cells.reduce((n, c) => n + c.w, 0) + gap * (cells.length - 1)
            // 允许 6px 的取整误差
            if (sum < innerW - 6) {
              holes.push({ cells: cells.map((c) => `${c.label}:${c.w}`), sum, innerW })
            }
          }
          /**
           * ★ 使用者接着问的那句（"为什么不能保持之前的一半一半"）：**要量到"真的是并排"**。
           *   只量"没有洞"是不够的——把每一格都拉成整行也能没有洞，但那不是他要的布局。
           *   所以再钉两件事：「指令」与「挂载的技能」**同一行、各占一半**；
           *   「记忆」**独占一行、占满宽**。
           */
          const rect = (sel) => {
            const el = card.querySelector(sel)
            return el === null ? null : csOf(el)
          }
          const instr = rect('.instructions-cell')
          const skills = rect('.skills-cell')
          const memory = rect('.memory-cell')
          const halfOf = (w) => Math.abs(w - (innerW - gap) / 2) <= 6
          const pair = {
            present: instr !== null && skills !== null,
            sameRow: instr !== null && skills !== null && Math.abs(instr.top - skills.top) < 2,
            eachHalf:
              instr !== null && skills !== null && halfOf(instr.width) && halfOf(skills.width),
          }
          const memOwnRow =
            memory !== null && Math.abs(memory.width - innerW) <= 6
          /**
           * ★ 使用者（第 255 批）："技能出现了滚动条，高度明显小于左侧的指令；既然是左右，
           *   应该一样高"。并排的两格**必须同高**，而技能列表只有在真的装不下时才滚。
           */
          const picker = card.querySelector('.skill-picker')
          const pickerRect = picker === null ? null : csOf(picker)
          const pairSameHeight =
            instr !== null && skills !== null && Math.abs(instr.height - skills.height) <= 2
          const pickerScrolls =
            picker !== null && picker.scrollHeight > picker.clientHeight + 2
          /**
           * 真正要看的是**两个控件等高等宽**（人眼看到的就是那两个框）：左边的指令输入框
           * 与右边的技能列表。格子本身已经同高（上面那条），这里再钉住"框也一样高"。
           */
          /**
           * ★ 分批第 258 批（使用者："挂载的技能里面每个技能的上下间隔太大"）：
           *   grid 的 `align-content` 默认是 `stretch` —— 行数不够时会**把每一行拉开**去
           *   铺满容器，于是技能少的时候中间出现一大段空白（看起来像"间距设得很大"）。
           *   量两件：同一列相邻两项的**竖直间隙**、以及每个选项的实际高度（被拉开就会很高）。
           */
          const opts = [...card.querySelectorAll('.skill-picker .skill-option')]
          const optRects = opts.map((el) => csOf(el))
          // 两列网格：**按左边缘分列**再比同一列里相邻两项的竖直间隙
          //（第一版拿"下标相邻的两项"比，而它们在左右两列里交替 ⇒ 一个间隙都没比到，
          //  判据于是靠"项高 ≤40"兜底，而项高跟"行被拉伸"不是一回事）
          const columns = new Map()
          for (const r of optRects) {
            const key = Math.round(r.left)
            const list = columns.get(key) ?? []
            list.push(r)
            columns.set(key, list)
          }
          const colGaps = []
          for (const list of columns.values()) {
            list.sort((a, b) => a.top - b.top)
            for (let i = 1; i < list.length; i += 1) {
              colGaps.push(Math.round(list[i].top - list[i - 1].bottom))
            }
          }
          const skillRows = {
            count: opts.length,
            // 选项自然高度：一个勾选框 + 一行字，超过 40px 说明被行拉伸了
            maxItemH: optRects.length === 0 ? 0 : Math.round(Math.max(...optRects.map((r) => r.height))),
            maxGap: colGaps.length === 0 ? 0 : Math.max(...colGaps),
            gaps: colGaps,
          }
          const box = card.querySelector('.instructions')
          const boxRect = box === null ? null : csOf(box)
          const pickerFillsCell =
            pickerRect !== null && boxRect !== null && Math.abs(pickerRect.height - boxRect.height) <= 4
          /**
           * ★ 2026-11：共享 + 独有技能共用的框（`.skill-box`）要**与左边指令框同高**
           *   （使用者："框的高度不对了，没有和左边的指令框一致"）——`.skill-box`
           *   `flex: 1` 撑满格子，格子与指令格同高。
           */
          const skillBox = card.querySelector('.skill-box')
          const skillBoxRect = skillBox === null ? null : csOf(skillBox)
          const boxFillsCell =
            skillBoxRect !== null && boxRect !== null && Math.abs(skillBoxRect.height - boxRect.height) <= 4
          /**
           * ★ 2026-11（D111，使用者："独有技能还是放里面比较合适，可以用一横线隔开"）：
           *   独有技能住进了「挂载的技能」这一格（共享技能列表**下面**，border-top 横线分开）。
           *   于是"技能列表与左边指令框同高"（第 255 批的 `pickerFillsCell`）**不再是意图**——
           *   那一格里现在有两段，列表只占一段。新意图：**独有技能区在共享列表下面**（同一格）。
           */
          const exclusive = card.querySelector('.exclusive-cell')
          const exclusiveRect = exclusive === null ? null : csOf(exclusive)
          const hasExclusive = exclusive !== null
          const exclusiveBelow =
            exclusiveRect !== null && pickerRect !== null && exclusiveRect.top >= pickerRect.bottom - 1
          return {
            rows: rows.size,
            holes,
            innerW,
            pair,
            memOwnRow,
            pairSameHeight,
            pickerScrolls,
            pickerFillsCell,
            boxFillsCell,
            hasExclusive,
            exclusiveBelow,
            skillRows,
            // 诊断用（红了才看得懂）
            instrH: instr === null ? null : Math.round(instr.height),
            labelH: card.querySelector('.skills-cell .cell-label') === null ? null : Math.round(csOf(card.querySelector('.skills-cell .cell-label')).height),
            boxClientH: skillBox === null ? null : skillBox.clientHeight,
            pickerClientH: picker === null ? null : picker.clientHeight,
            pickerScrollH: picker === null ? null : picker.scrollHeight,
            exclusiveH: exclusive === null ? null : Math.round(csOf(exclusive).height),
            skillBoxH: skillBoxRect === null ? null : Math.round(skillBoxRect.height),
            instrTop: instr === null ? null : Math.round(instr.top),
            skillsTop: skills === null ? null : Math.round(skills.top),
            instrAlignSelf: (() => {
              const el = card.querySelector('.instructions-cell')
              return el === null ? null : cs(el).alignSelf
            })(),
            skillsH: skills === null ? null : Math.round(skills.height),
            pickerH: pickerRect === null ? null : Math.round(pickerRect.height),
            boxH: boxRect === null ? null : Math.round(boxRect.height),
            hasPicker: picker !== null,
          }
        })()

        /**
         * ★ 分批第 245 批：记忆功能的**总开关**（使用者："配置页面里面有个选项，表示是否使能记忆功能"）。
         *
         * 量四件，缺一都不算数：
         *   ① 那一格在，且默认是**勾着**的（缺省 = 开，老记录不许静默失忆）；
         *   ② 取消勾选 ⇒ 写入口（「记下一条」那一行）**当场收起**、并出现"不会被带进"的说明；
         *   ③ 点「保存」之后，接口上 `memoryEnabled` 真的变 false（**轮询到位**，不是读一眼）；
         *   ④ 此时再手写一条 ⇒ 被拒 `memory_disabled`（界面是第一道，**不是唯一一道**）。
         * 量完用界面把开关拨回去并保存（**不切换路由**——这一页后面还有 3 条窄屏判据要看
         * "有一条被选中"的现场；第一版在这里 `#/tasks` 来回一次，把选中态丢了，
         * 于是那三条判据量的其实是一个没有详情页的界面，红得莫名其妙）。
         */
        facts['agents.memorySwitch'] = await (async () => {
          const win = f.contentWindow
          const sec = d().querySelector('[data-agent-memory]')
          const box = sec?.querySelector('[data-memory-enabled]')
          if (!sec || !box) return { present: false }
          const name = String(text(d().querySelector('.detail-pane [data-agent-head-name]')) ?? '')
          const list = await win.fetch('/api/agents').then((r) => r.json())
          const me = (list.agents ?? []).find((a) => a.name === name)
