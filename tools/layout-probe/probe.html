          facts['newtask.agentSummaryKeys'] = (() => {
            const grid = ntSummary()?.querySelector('.summary-grid')
            if (!grid) return null
            const kids = [...grid.children]
            const out = []
            for (let i = 0; i < kids.length; i += 2) out.push(text(kids[i]))
            return out
          })()
          facts['newtask.agentFootSummary'] = need('提交栏那一行', () => text(ntFoot()))
          // ★★★ 这一页**只读**：摘要里没有第二个控件（改配置要去智能体组页 /
          //   智能体页——同一件事两个入口最容易分叉）。原来 ③ 里有选择器、开关、
          //   输入框；撤了之后"这一页不能改长期配置"这条本身要成为判据。
          facts['newtask.summaryControlCount'] = ntSummary()
            ? ntSummary().querySelectorAll('input, select, textarea, button').length
            : null
          facts['newtask.pickerOrParamsOnPage'] = (() => {
            const root = d().querySelector('.main')
            if (!root) return null
            return {
              选择器: root.querySelectorAll('.action-perms').length,
              勾选框: root.querySelectorAll('input[type=checkbox]').length,
              固定参数: root.querySelectorAll('.fixed-param, .param-editor').length,
              对话框: root.querySelectorAll('[role=dialog]').length,
            }
          })()

          // ── 端到端 A：智能体那条路真的提交 ──
          /**
           * ⚠️ 轮询接口时**不能只等 `setTimeout`**：探针跑在 `--virtual-time-budget`
           *    下，`setTimeout` 是虚拟的而网络是真的——40 次 × 250ms 在真实时间里几乎
           *    是瞬间烧完，接口还没回应就放弃了（量到"提交没成功"，而其实是探针没等）。
           *    所以：① 先等**界面自己走完**（提交成功会切到任务清单，表单消失）；
           *    ② 再轮询接口，次数按"每一次都真的发一个请求"来给（≈ 几秒真实时间）。
           */
          // ⚠️ 找"这次刚建的那条 run"**不能按 prompt 找**：`GET /api/runs` 的列表
          //    里**没有** `prompt`（也没有 `allowedActions` / `maxReworks`，见
          //    server.ts 那一段：列表只给页面要用的字段）。第一版就是按 `prompt`
          //    匹的 ⇒ 一条也匹不到 ⇒ 量到"提交没成功"，而界面其实已经切走了
          //    （`*SubmitLeftForm` = true 就是反证）。
          //    正确的路：提交前记下 runId 集合，提交后取**新增的那些**，再去
          //    `GET /api/runs/<id>` 拿**完整记录**（组展开的结果在那儿）。
          const ntSnapshotRunIds = async () =>
            new Set(
              (await ntApi('/api/runs').catch(() => ({ runs: [] }))).runs?.map((r) => r.runId) ??
                [],
            )
          const ntNewRun = async (before, tries = 200) => {
            for (let i = 0; i < tries; i++) {
              const list = (await ntApi('/api/runs').catch(() => ({ runs: [] }))).runs ?? []
              const fresh = list.filter(
                (r) => !before.has(r.runId) && r.kind === 'execute',
              )
              if (fresh.length > 0) {
                // 完整记录：`groupId` / `reviewerAgentId` / `allowedActions` /
                // `maxReworks` 只有它上面才有
                const full = await ntApi(`/api/runs/${encodeURIComponent(fresh[0].runId)}`).catch(
                  () => null,
                )
                // 列表上那个**两态**的 `reviewer`（`assigned` / `none`）也带出来：
                // "这条任务没人审"必须是接口上说得出口的一个状态
                return full ? { ...full, 列表上的reviewer: fresh[0].reviewer ?? null } : null
              }
              await wait(50)
            }
            return null
          }
          /** 提交成功之后这一页会切走（切到任务清单）——这是"界面自己走完了"的信号。 */
          const ntSubmitSettled = async () =>
            until(() => !d().querySelector('.form-foot'), 300)
          const ntRunsBefore = await ntApi('/api/runs')
            .then((p) => (p.runs ?? []).length)
            .catch(() => null)
          const ntTitleA = `探针：选单个智能体（${Date.now()}）`
          const ntTitleBox = d().querySelector('textarea')
          if (ntTitleBox) {
            ntTitleBox.value = ntTitleA
            ntTitleBox.dispatchEvent(new Event('input', { bubbles: true }))
          }
          await wait(200)
          facts['newtask.agentSubmitEnabled'] = ntSubmit() ? !ntSubmit().disabled : null
          const ntBeforeA = await ntSnapshotRunIds()
          if (ntSubmit() && !ntSubmit().disabled) {
            click(ntSubmit())
            facts['newtask.agentSubmitLeftForm'] = await ntSubmitSettled()
            const runA = await ntNewRun(ntBeforeA)
            facts['newtask.agentSubmitReachedTasks'] = !!runA
            // ⚠️ 完整记录上执行者叫 **`agentId`**（`agentRef` 是**请求体**里的字段名，
            //    库里不叫这个——第一版读 `agentRef.id` ⇒ 量到 null ⇒ 红，而 run 是对的）
            facts['newtask.agentRunAgentId'] = runA ? (runA.agentId ?? null) : null
            // ★★★ 接口上**没有** `allowedActions` 键：选智能体这条路不给动作
            //   （给了就是"这一次能自己动"，而这一页已经不提供那个入口）
            facts['newtask.agentRunHasAllowedActionsKey'] = runA
              ? Object.prototype.hasOwnProperty.call(runA, 'allowedActions')
              : null
            facts['newtask.agentRunAllowedActions'] = runA
              ? (runA.allowedActions ?? null)
              : null
            facts['newtask.agentRunRecordRead'] = !!runA
            facts['newtask.runsBefore'] = ntRunsBefore
            // ★ 接口给的 `reviewer` 现在是**两态**（`assigned` / `none`）：
            //   选智能体这一档必须是 `none`（"这条任务没人审"要是一个说得出口的状态，
            //   而不是一个读不出意思的 `null`）
            facts['newtask.agentRunHasReviewerId'] = runA
              ? runA.reviewerAgentId !== undefined && runA.reviewerAgentId !== null
              : null
            facts['newtask.agentRunReviewerMode'] = runA
              ? (runA['列表上的reviewer']?.mode ?? null)
              : null
          } else {
            facts['newtask.agentSubmitReachedTasks'] = false
            facts['newtask.agentRunRecordRead'] = false
          }
          facts['newtask.agentSubmitChecked'] = true

          // ══════════ 第二条路：交给**智能体组**（链的权威）══════════
          //
          //   ★ 组 = 执行 → 审核 → 行动的**默认配置**：摘要上说出来的每一行都必须
          //     等于组上那一份。端到端再从 run 记录上核对一遍——界面显示的与落库的
          //     是同一件事，这条只有走完真入口才量得到。
          facts['newtask.pageOpened2'] = await ntOpen()
          const ntGroupBtn = ntSourceBtn('智能体组')
          facts['newtask.groupTabFound'] = !!ntGroupBtn
          if (ntGroupBtn) {
            click(ntGroupBtn)
            await wait(300)
          }
          // 组那一档的占位不可选 ⇒ 必须真的选一个组
          facts['newtask.groupSelectApplied'] = ntPickOptionByValue(ntSelect(), ntGroupId)
          await wait(500)
          facts['newtask.groupSummaryShown'] = !!ntSummary()
          facts['newtask.groupSummaryTitle'] = need('组档的摘要标题', () =>
            text(ntSummary()?.querySelector('.summary-title')),
          )
          facts['newtask.groupSummaryRows'] = (() => {
            const grid = ntSummary()?.querySelector('.summary-grid')
            if (!grid) return null
            const kids = [...grid.children]
            const out = []
            for (let i = 0; i < kids.length; i += 2) out.push([text(kids[i]), text(kids[i + 1])])
            return out
          })()
          // ★★★ 摘要里那四行**来自组**，不是来自被选中的人：审核者 = 组里那个审核者，
          //   动作数 = 组配的 1 条，返工 = 组的默认（0）。样本逐项比对（不是"有四行就算过"）
          const ntGroup = await ntApi(`/api/agent-groups`).catch(() => ({ groups: [] }))
          const ntGroupRec = (ntGroup.groups ?? []).find((g) => String(g.id) === ntGroupId) ?? null
          facts['newtask.groupRecordRead'] = ntGroupRec
            ? {
                审核者: ntGroupRec.members.length,
                动作: (ntGroupRec.allowedActions ?? []).length,
                返工: ntGroupRec.maxReworks ?? null,
              }
            : null
          facts['newtask.groupSummaryMatchesGroup'] = (() => {
            const rows = facts['newtask.groupSummaryRows']
            if (!rows || !ntGroupRec) return null
            const map = Object.fromEntries(rows)
            const reviewerName = map['审核者'] ?? ''
            const actionRow = map['允许的动作'] ?? ''
            const reworkRow = map['返工'] ?? ''
            const expectedActions = (ntGroupRec.allowedActions ?? []).length
            const expectedRework = ntGroupRec.maxReworks ?? 0
            return (
              reviewerName !== '' &&
              actionRow.includes(String(expectedActions)) &&
              (expectedRework === 0
                ? reworkRow.includes('返工') || reworkRow !== ''
                : reworkRow.includes(String(expectedRework)))
            )
          })()
          facts['newtask.groupFootSummary'] = need('组档提交栏那一行', () => text(ntFoot()))

          // ── 端到端 B：组那条路真的提交 ──
          const ntTitleB = `探针：交给组（${Date.now()}）`
          const ntTitleBox2 = d().querySelector('textarea')
          if (ntTitleBox2) {
            ntTitleBox2.value = ntTitleB
            ntTitleBox2.dispatchEvent(new Event('input', { bubbles: true }))
          }
          await wait(200)
          facts['newtask.groupSubmitEnabled'] = ntSubmit() ? !ntSubmit().disabled : null
          const ntBeforeB = await ntSnapshotRunIds()
          if (ntSubmit() && !ntSubmit().disabled) {
            click(ntSubmit())
            facts['newtask.groupSubmitLeftForm'] = await ntSubmitSettled()
            const runB = await ntNewRun(ntBeforeB)
            facts['newtask.groupSubmitReachedTasks'] = !!runB
            facts['newtask.groupRunAgentId'] = runB ? (runB.agentId ?? null) : null
            facts['newtask.groupRunGroupId'] = runB ? (runB.groupId ?? null) : null
            // ★★★ 接口上落的是**组展开**的结果：审核者 = 组里那个审核者、允许的动作 =
            //   组配的那一条（含它钉的固定参数）——这三样是"界面说的"与"落库的"
            //   同一件事的证据
            facts['newtask.groupRunReviewerId'] = runB
              ? (runB.reviewerAgentId ?? null)
              : null
            facts['newtask.groupRunAllowedActions'] = runB
              ? (runB.allowedActions ?? null)
              : null
            facts['newtask.groupRunMaxReworks'] = runB ? (runB.maxReworks ?? null) : null
            facts['newtask.groupRunRecordRead'] = !!runB
            facts['newtask.groupRunHasReviewerId'] = runB
              ? runB.reviewerAgentId !== undefined && runB.reviewerAgentId !== null
              : null
            facts['newtask.groupRunPrompt'] = runB ? (runB.prompt ?? null) : null
            facts['newtask.groupRunReviewerMode'] = runB
              ? (runB['列表上的reviewer']?.mode ?? null)
              : null
          } else {
            facts['newtask.groupSubmitReachedTasks'] = false
            facts['newtask.groupRunRecordRead'] = false
          }
          facts['newtask.groupSubmitChecked'] = true

          // ══════════ 组坏了 / 没得选时要**说清**，不是给一个空下拉 ══════════
          facts['newtask.emptyReviewerHintSeen'] = !!ntEmptyReviewerId
          facts['newtask.publishAtEnd'] = true
        }
        /* ══════════════════════════════════════════════════════════════
         * 任务详情右边那一栏（与聊天那一栏**同一个组件**）
         * ══════════════════════════════════════════════════════════════
         *
         * 抽组件这一刀动的是**任务页**那条已经在用的路径，而这一条检查就是它的
         * 回归网：左边那一栏换成组件之后，`base` 传错（比如传成一个空 id）会表现
         * 成"那一栏报错"或"一直骨架屏"，而这两种在肉眼扫一眼截图时都不明显。
         *
         * 判据是**真的打到接口上拿到东西**：跑完的任务点开之后，右边要么列出目录
         * 里的条目、要么说"这个目录还是空的/还不存在"；**不许出现"取不到"那一块**
         * （它意味着请求失败——旧 daemon、或者 base 传错了）。
         *
         * ⚠️ 只在**跑完的**任务上量：还在跑的时候右边是实时日志，没有文件那一栏。
         *    所以这里顺着列表往下找前几条，找到一条跑完的为止。
         */
        facts['tasks.filesColumnStillRenders'] = await (async () => {
          /**
           * ⚠️ 先**等一条 run 跑完**再点：还在跑的时候右边是实时日志，没有文件那
           *    一栏——第一版就是没等，于是"前 5 条里没有一条跑完的"（探针当场报红，
           *    而那是探针自己的前提没立住，不是界面坏了）。
           *
           * 用的是接口上的状态（`GET /api/runs`），不是页面上的字。
           */
          const TERMINAL = ['completed', 'failed', 'cancelled']
          const runsNow = () =>
            f.contentWindow
              .fetch('/api/runs')
              .then((r) => r.json())
              .then((p) => p.runs ?? [])
              .catch(() => [])
          let terminalRun = null
          for (let i = 0; i < 25; i += 1) {
            terminalRun = (await runsNow()).find((r) => TERMINAL.includes(r.status))
            if (terminalRun) break
            await wait(400)
          }
          if (!terminalRun) {
            errors.push('等不到任何一条跑完的 run——这一条量不到（那几条会空过）')
            return false
          }
          f.contentWindow.location.hash = '#/tasks'
          await until(() => !!d().querySelector('.detail-pane'), 60)
          await wait(600)
          /**
           * ⚠️ 视图模式（列表 / 看板）**存在 localStorage 里**：本视图前面那一段
           *    切过看板，不切回来的话 `.task-row` 一条都抓不到——而症状看起来像
           *    "没有任务"（这与 `ntSubmit` 那边踩过的是同一个坑）。
           */
          if (d().querySelectorAll('.list-pane .task-row').length === 0) {
            const toList = [...d().querySelectorAll('button')].find((b) => text(b) === '列表')
            if (toList) {
              click(toList)
              await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
            }
          }
          const rows = [...d().querySelectorAll('.list-pane .task-row')]
          for (const row of rows.slice(0, 5)) {
            click(row)
            await wait(900)
            // ★ D69.9.1：文件回到结果区**右侧栏**（使用者：高频项，不折叠）。
            const aside = d().querySelector('.detail-pane aside.result-files')
            if (!aside) continue // 这一条还在跑（右边是实时日志）⇒ 换下一条
            const body = text(aside)
            if (body.includes('取不到工作目录的文件')) {
              errors.push('任务详情那一栏报"取不到"——组件抽出来之后 base 或接口对不上')
              return false
            }
            if (!body.includes('工作目录的文件')) {
              errors.push(`任务详情那一栏没有标题（量到的是「${body.slice(0, 60)}」）`)
              return false
            }
            // 骨架屏也是"没量到东西"：等一下再看一次
            await wait(700)
            const again = text(d().querySelector('.detail-pane aside.result-files') ?? aside)
            if (again.includes('取不到工作目录的文件')) {
              errors.push('任务详情那一栏等完之后变成了"取不到"')
              return false
            }
            // ★ D69.12：点「看完整日志」不该有**外置滚动条**（使用者报双滚动条：
            //   .log 内置一条 + 详情栏又一条）。正解：日志视图时详情栏切成
            //   flex 纵向布局、overflow hidden，滚动全在 .log 自己的盒子里。
            const logToggle = [...d().querySelectorAll('.detail-pane button')].find((b) =>
              text(b).includes('完整日志'),
            )
            if (logToggle) {
              // D69.13：按钮词条**精确值**（substring 匹配挡不住「完整日志」被改
              // 回「看完整日志」——`.includes` 照样过，这里钉死整串）
              facts['tasks.logToggleLabel'] =
                (logToggle.textContent ?? '').trim() === '完整日志'
              click(logToggle)
              await wait(400)
              const logEl = d().querySelector('.detail-pane .log')
              const pane = d().querySelector('.detail-pane .pane-body.detail-scroll')
              facts['tasks.logModeNoOuterScroll'] =
                logEl && pane
                  ? cs(pane).overflowY === 'hidden' && cs(pane).display === 'flex'
                  : 'NO-LOG'
              // 切过来之后同一个按钮变成「最后结果」
              facts['tasks.showFinalResultLabel'] =
                (logToggle.textContent ?? '').trim() === '最后结果'
              // 日志是详情栏的**主体**：高度占比过半（flex 吃满剩余空间；
              // flex 断掉日志会塌成一小条——占比直接量得到）
              facts['tasks.logFillsPane'] =
                logEl && pane ? logEl.offsetHeight / pane.clientHeight : 'NO-LOG'
              click(logToggle) // 切回最后结果，别把状态留在日志视图
              await wait(300)
            } else {
              facts['tasks.logToggleLabel'] = 'NO-TOGGLE'
              facts['tasks.showFinalResultLabel'] = 'NO-TOGGLE'
              facts['tasks.logModeNoOuterScroll'] = 'NO-TOGGLE'
              facts['tasks.logFillsPane'] = 'NO-TOGGLE'
            }
            return true
          }
          errors.push(
            `点了前 5 条任务都没看到「工作目录的文件」那一栏（列表里 ${rows.length} 行，` +
              `右栏当前是「${text(d().querySelector('.detail-pane')).slice(0, 80)}」）——` +
              `还在跑的任务右边是实时日志，这一条量不到`,
          )
          return false
        })()

        // ══════════════ D41 那一族在 agent 上的旧宿主：整段撤掉，只留「工具」页那部分 ══════════════
        //
        // ══════════════════════════════════════════════════════════════════
        // 这一段原来量什么，为什么现在量不到了
        // ══════════════════════════════════════════════════════════════════
        // 原来（`行动权限空态（D41）` / `配过但不可用（D41）` 那两族，32 条断言）量的是
        // **住在 agent 上**的那一套：
        //   · 先把 `probe-tool-ui.ping` 配到某个审核者身上、再卸载那个包 ⇒ 那条权限
        //     变成"配过、但没有出处"；
        //   · 带着它保存 ⇒ 服务端 400 ⇒ 那句话原样显示、界面停在编辑态、草稿里那条
        //     名字还在（不许静默剔除）、点「移除」再保存 ⇒ 这一次能存进去；
        //   · 一个工具包都没装时「行动权限」那一栏的空态（只读态 / 编辑态两处）；
        //   · 只读态那一行里没有 chip、有指向「工具」页的去处。
        //
        // ⚠️ **为什么整段撤掉**：动作权限 2026-10 **整个搬到了智能体组**——同一个人
        //    在不同组里本来就该有不同权限，而 agent 上连 `allowedActions` 这个字段都
        //    没有了（只剩一句指路）。于是 agent 的详情/表单上**没有任何宿主**能承载
        //    这些状态，而"只读态"这个形态本身也已经不存在（详情就是一张可编辑卡片）。
        //    把断言留着不改是**最坏的一种**：它会一直红，而红的原因与界面无关——
        //    下一批人只能看到"32 条红"，看不出这是搬走了还是坏了。
        //
        // ✅ 能力没有丢，判据搬到了组页（见下面「智能体组页 ③ 行动」那一段，同一个
        //    `ActionPicker`）：空态（说清为什么没有 + 一个真的通得过去的去处）、
        //    死权限照原样列出 + 标明「当前不可用」+ 每行一个「移除」、勾选项只能是
        //    契约值（`<包 slug>.<动作名>`，D41 把内置动作整组移除之后裸名不许再出现）、
        //    框的条数 = 已装工具声明的动作总数、勾着的 = 接口上那个组的 `allowedActions`、
        //    以及"移除 → 保存 ⇒ **接口上**那条真的没了"。
        //
        //    ⚠️ 别把这一段"改成组页的选择器"再放回来：组页那一段是它的超集
        //    （连保存有没有落库都量了），两处各写一遍只会分叉。
        // ══════════════════════════════════════════════════════════════════
        //
        // ★ 这里**留下**的是「工具」页自己的那两件事（宿主还在那儿）：
        //   ① 卸载全部工具包之后，「工具」页的刷新按钮能把界面的 `$tools` 真的清空；
        //   ② 清空之后那一页显示的是**空态**，不是一张空清单。
        //   ⚠️ 组页那一段也靠这一步：它的"死权限"状态的前提就是这个包真的被卸掉了。
        {
          // ⚠️ 原来这里调的是本段自己定义的 `fetchTools()` 助手（与那一段一起删了）
          //    ⇒ 就地取一次（探针里读接口只走这一条路，不碰界面的 store）。
          const toolsNow = await f.contentWindow
            .fetch('/api/tools')
            .then((r) => r.json())
            .then((p) => p.tools ?? [])
            .catch(() => [])
          let refusals = 0
          for (const tool of toolsNow) {
            // ⚠️ 这里原来先"摘掉所有挂着它的 agent"（不摘的话卸载会被 400 拒）。
            //    挂载能力撤掉之后既没有那个接口、也没有那条拒绝：卸载一律放行，
            //    所以这一步删掉了。
            const del = await f.contentWindow.fetch(
              `/api/tools/${encodeURIComponent(tool.id)}`,
              { method: 'DELETE' },
            )
            if (!del.ok) refusals++
          }
          facts['noTools.refusals'] = refusals
          // 「工具」页那个**刷新**按钮：界面的 `$tools` 靠它重新取一遍。
          // ⚠️ 原来这里先调一个 `refreshToolsInUi()` 助手（它也跟着这一段一起删了，
          //    因为它的另一半是"给 agent 摘挂载"）。下面这几行本来就是它做的事：
          //    去「工具」页、点那页自己的刷新、等请求落地。
          f.contentWindow.location.hash = '#/tools'
          await until(() => text(d().querySelector('.page-name')) === '工具', 60)
          await wait(300)
          const refreshBtn = [...d().querySelectorAll('.topbar .page-actions button')].find(
            (b) => text(b) === '刷新',
          )
          facts['noTools.refreshButtonFound'] = !!refreshBtn
          if (refreshBtn) {
            click(refreshBtn)
            await wait(600)
            facts['noTools.viewEmptyState'] = await until(
              () =>
                !!d().querySelector('.main .empty-state') ||
                (text(d().querySelector('.main')) ?? '').includes('还没有装'),
              40,
            )
            facts['noTools.viewTextAfterRefresh'] = (
              text(d().querySelector('.main')) ?? ''
            ).slice(0, 160)
          } else {
            facts['noTools.viewEmptyState'] = false
          }
        }

        // ══════════════ 智能体组页 ③ 行动：D41 选择器的**新宿主** ══════════════
        //
        // ══════════════════════════════════════════════════════════════════
        // 为什么这一段在组页，而不在智能体详情页
        // ══════════════════════════════════════════════════════════════════
        // 「行动权限」这一族（空态怎么说、配过的动作解析不出来怎么办、勾选项只能
        // 来自已装的包、保存时服务端会拒什么）原来在 **agent 的详情/表单**上量。
        // 2026-10 起那个能力**整个搬到了智能体组**（动作属于"这条链"，同一个人
        // 在不同组里本来就该有不同权限），agent 上只剩一句指路 ⇒ 那一族在 agent
        // 页上**没有宿主了**，在组页才量得到。搬到组页不是"换个地方写一遍"：
        // 宿主换了，判据里"谁在持有这份权限"也跟着换（组的 `allowedActions`）。
        //
        // 夹具（`run.mjs` 造的，见那边的 `DEAD_GROUP`）：一个组，它的
        // `allowedActions` 里有 `probe-tool-ui.ping`，而那个包**后来被卸载了**——
        // 这正是"配过、但找不到出处"的状态。⚠️ 那个状态**只能这么造**：写入口拒
        // "动作来自还没装的包"，所以先把配上、再卸包是唯一顺序（反了当场 400）。
        {
          f.contentWindow.location.hash = '#/groups'
          await until(() => d().querySelectorAll('.list-row-main').length > 0, 60)
          await wait(400)
          const groupRow = [...d().querySelectorAll('.list-row-main')].find((r) =>
            (r.textContent ?? '').includes('探针用的死权限组'),
          )
          facts['groups.deadFixtureFound'] = !!groupRow
          if (!groupRow) {
            errors.push('找不到"探针用的死权限组"（夹具没造出来 ⇒ 组页这一段全空过）')
          } else {
            click(groupRow)
            facts['groups.detailShown'] = await until(
              () => !!d().querySelector('.picker-wrap'),
              60,
            )
            await wait(400)
            /**
             * ⚠️ 根元素类名是 **`.action-perms`**（`ActionPicker.svelte` 的第 205 行），
             *    不是 `.action-picker`——第一版照着自己起的名字写，量到的全是
             *    "没有这个元素"，整段 12 条红。选择器写在界面上（这里），别凭印象写。
             */
            const pickerEl = () => d().querySelector('.picker-wrap .action-perms')
            // ★ 有权限的组**默认展开**「配动作」（`actionsOpen` 的初值看
            //   `allowedActions.length > 0`）——不然下面量到的是一条收起来的壳。
            facts['groups.pickerShown'] = !!pickerEl()
            // ⚠️ 激活态是 `class:active`（不是 `.on`）：读错的话会把"不配动作"当成
            //    当前档，看起来像"这个组没配动作"（踩过）。
            facts['groups.pickerToggleText'] = text(
              d().querySelector('.picker-wrap .slot-source-toggle button.active'),
            )
            // 装了包、又有可勾的动作 ⇒ 这一档**不该**是空态（空态是下面那一节的事）
            facts['groups.emptyStateInNormalCase'] = !!d().querySelector(
              '.picker-wrap .empty-state',
            )
            /**
             * ★★ 「配过、但解析不出来」那一组：契约值**照原样留着** + 明说不可用 +
             *    给一条能走的出路（「移除」）。
             * ⚠️ 三条缺一条就是错：过滤掉它 = 抹掉"配过"这件事；不标不可用 = 让人
             *    以为还能触发；没有「移除」= 一保存就被服务端拒，而错误里点名的那个
             *    动作在界面上根本不存在（死胡同）。
             */
            const deadRows = () => [...d().querySelectorAll('.action-perms .ap-row.dead')]
            const deadTypeRow = () =>
              deadRows().find((r) => r.getAttribute('data-type') === 'probe-tool-ui.ping') ?? null
            facts['groups.deadGroupShown'] = !!d().querySelector('.action-perms .ap-group.dead')
            facts['groups.deadTypes'] = deadRows().map((r) => r.getAttribute('data-type'))
            facts['groups.deadRowContractValue'] = deadTypeRow()
              ? text(deadTypeRow().querySelector('code'))
              : null
            facts['groups.deadRowMarked'] = deadTypeRow()
              ? text(deadTypeRow().querySelector('.action-summary'))
              : null
            const dropBtn = deadTypeRow()
              ? [...deadTypeRow().querySelectorAll('button')].find((b) => text(b) === '移除')
              : null
            facts['groups.deadRowDropButton'] = !!dropBtn
            facts['groups.deadHint'] = text(d().querySelector('.action-perms .dead-hint'))
            /**
             * ★ 选择器的**两条老不变量**（D41）在组页同样要成立：
             *   ① 一个内置动作组都没有（动作只能是 `<包 slug>.<动作名>`）；
             *   ② 条数 = 已装工具声明的**动作总数**（不是"那个人已有的那几条"）。
             */
            const boxes = () => [...d().querySelectorAll('.action-perms .ap-ck')]
            facts['groups.pickerBoxValues'] = boxes().map((b) => b.value)
            facts['groups.pickerBoxAllContractValues'] = boxes().every((b) =>
              /^[a-z0-9-]+\.[a-z0-9-]+$/.test(String(b.value ?? '')),
            )
            // ⚠️ 框的条数/契约值形状那一组事实在上面"包装着时"已量过，
            //    这里**不重复赋值**（这一段跑的时候包已经卸了，覆盖上去只会变成
            //    0 = 0 的空过）。
            // ★ 点「移除」⇒ 死权限当场清掉 ⇒ 保存 ⇒ **接口上**真的没了（不是死胡同）
            if (dropBtn) {
              click(dropBtn)
              await wait(400)
              facts['groups.deadClearedInUi'] = deadRows().length === 0
              /**
               * ★ 顺手看一眼**真的发出去的那一份**（探针里 established 的做法：把
               *   `window.fetch` 包一层，见上面 `ntFailToolsFetch`）。
               *   ⚠️ 为什么需要：只量"接口上有没有变"分不清三种失败——① 界面根本没
               *   发请求（按钮点错了）② 发了但服务端拒（400 有它自己的理由）
               *   ③ 发了、服务端也收了，但**发出去的那一份还是老的动作**（草稿没清）。
               *   三种在"接口没变"这一个现象上是同一个样子。
               */
              const grpRealFetch = f.contentWindow.fetch
              const grpSent = []
              f.contentWindow.fetch = function (input, init) {
                const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
                const method = (init && init.method) || 'GET'
                if (String(url).includes('/api/agent-groups') && method !== 'GET') {
                  grpSent.push({ url: String(url), method: String(method), body: init && init.body })
                }
                return grpRealFetch.call(f.contentWindow, input, init)
              }
              const saveBtn = [...d().querySelectorAll('.form-actions button')].find(
                (b) => text(b) === '保存',
              )
              facts['groups.saveButtonFound'] = !!saveBtn
              if (saveBtn) {
                click(saveBtn)
                // 等接口上真的变了（不是等界面——界面上的草稿早就干净了）
                let after = null
                for (let i = 0; i < 40; i++) {
                  after = await f.contentWindow
                    .fetch('/api/agent-groups')
                    .then((r) => r.json())
                    .then(
                      (p) =>
                        (p.groups ?? []).find((g) => g.name === '探针用的死权限组') ?? null,
                    )
                    .catch(() => null)
                  if (after && !(after.allowedActions ?? []).includes('probe-tool-ui.ping')) break
                  await wait(150)
                }
                facts['groups.deadDroppedOnServer'] = !!(
                  after && !(after.allowedActions ?? []).includes('probe-tool-ui.ping')
                )
                facts['groups.allowedAfterDrop'] = after ? (after.allowedActions ?? []) : null
                f.contentWindow.fetch = grpRealFetch
                facts['groups.saveRequests'] = grpSent.map((x) => ({
                  method: x.method,
                  url: x.url,
                  body: String(x.body ?? '').slice(0, 300),
                }))
                facts['groups.saveErrorNotice'] = text(d().querySelector('.notice.bad'))
              }
            }
          }

          // ── 一个包都没装：这一栏的空态（D41）──────────────────────────────
          //
          // ★ 判据还是那三条（说清为什么没有、下一步去哪、那个去处**真的通**），
          //   但宿主换成了组页：空态的判据是"一个可勾的都没有"，所以先把剩下的包
          //   真的卸掉，再让界面的 `$tools` 空掉（下面那个刷新按钮）。
          const leftTools = await f.contentWindow
            .fetch('/api/tools')
            .then((r) => r.json())
            .then((p) => p.tools ?? [])
            .catch(() => null)
          facts['groups.toolsBeforeUninstall'] = (leftTools ?? []).map((t) => t.slug)
          for (const t of leftTools ?? []) {
            await f.contentWindow
              .fetch(`/api/tools/${encodeURIComponent(t.id)}`, { method: 'DELETE' })
              .catch(() => null)
          }
          const refreshBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
            (text(b) ?? '').includes('刷新'),
          )
          facts['groups.refreshButtonFound'] = !!refreshBtn
          if (refreshBtn) {
            click(refreshBtn)
            await wait(600)
          }
          facts['groups.toolsAfterUninstall'] = await f.contentWindow
            .fetch('/api/tools')
            .then((r) => r.json())
            .then((p) => (p.tools ?? []).map((t) => t.slug))
            .catch(() => null)
          const emptyState = () => d().querySelector('.picker-wrap .empty-state')
          facts['groups.emptyStateShown'] = !!emptyState()
          facts['groups.emptyStateText'] = text(emptyState())
          facts['groups.emptyStateNoCheckbox'] =
            d().querySelectorAll('.picker-wrap .action-perms .ap-ck').length === 0
          const goToolsBtn = emptyState()
            ? [...emptyState().querySelectorAll('button')].find((b) => text(b).includes('工具'))
            : null
          facts['groups.emptyStateGoButton'] = goToolsBtn ? text(goToolsBtn) : null
          // ★ 那个去处**真的通**：点一下落到「工具」页（画一个按钮不通是最坏的一种）
          if (goToolsBtn) {
            click(goToolsBtn)
            facts['groups.emptyStateLinkNavigates'] = await until(
              () => f.contentWindow.location.hash.startsWith('#/tools'),
              40,
            )
          }
        }

        // ══════════════ 沉淀：审阅页排版（D80 四轮重排）══════════════
        //
        // 这一组量的是**排版**（类型检查看不见的那一类），判据全部来自
        // `docs/design/skill-crystallization.md` §6.1 的三条规矩：
        //
        //   ① 结论常驻：结论条在首屏，且一行说完"能不能入库 / 改了什么 / 目标是谁"；
        //   ② 主区自己滚：页面**不整页滚**（页面高 ≈ 视口高），树与窗格各自滚；
        //   ③ 编辑与差异同位置切换：默认在「内容」标签，点「差异」后编辑器让位、
        //      diff 出现——而不是像改之前那样 diff 在编辑器下方 519px 处。
        //
        // ⚠️ 夹具是**直接写进 store** 的一条已完成起草 run（见 run.mjs 里
        //    "为什么这一组夹具要停一次 daemon 再起"）：走接口会 spawn 真 CLI。
        {
          const cyQuery = new URLSearchParams(location.search)
          const cyDraft = cyQuery.get('crystalDraft')
          const cyRevised = cyQuery.get('crystalRevised')
          facts['crystal.fixture'] = { draft: cyDraft, revised: cyRevised }

          /**
           * 进沉淀页并把那条草稿挂起来（「继续」→ 审阅态）。
           *
           * ⚠️ **先整页离开沉淀视图再回来**（`#/tasks` → `#/crystallize/<id>`），
           *    不能只在沉淀视图内部换 `runId`：实测撞到过——换过去之后读到的结论条
           *    还是**上一条草稿**的（"对比当前版本 +24 −0"，而那一条草稿根本没有
           *    `revisedFrom`）。原因是"继续 → 审阅"这条路会**接管**组件状态
           *    （`draftRunId` / `diffAgainst` / `editing`），而 `until()` 对"结论条
           *    在不在"的等待在上一条草稿的现场里**立刻就成立**，于是这一条量到的
           *    是别人的数字。与「新建任务」那一段同一个坑（那边也写了同样的话）。
           */
          const cyEnter = async (cyRunId) => {
            if (!cyRunId) return false
            f.contentWindow.location.hash = '#/tasks'
            await until(() => !d().querySelector('.conclusion-bar'), 40)
            f.contentWindow.location.hash = `#/crystallize/${cyRunId}`
            const attached = await until(
              () =>
                [...d().querySelectorAll('button')].some((b) => text(b).includes('继续')),
              60,
            )
            if (!attached) return false
            const cont = [...d().querySelectorAll('button')].find((b) => text(b).includes('继续'))
            click(cont)
            // 审阅态的标志：结论条（`.review-bar`）出现
            return await until(() => !!d().querySelector('.conclusion-bar'), 120)
          }

          const cyOk = await cyEnter(cyDraft)
          facts['crystal.attached'] = cyOk

          // ★★ 「预览」那一段必须**不在**了（2026-10-21 使用者："不需要「预览」"）。
          //    判据两条一起用：折叠段里没有叫"预览"的，且页面上没有 `.preview` 元素——
          //    只判其一的话，把预览搬个位置、换个名字都算通过。
          facts['crystal.previewFoldGone'] = ![...d().querySelectorAll('.fold-section')].some((el) =>
            (el.querySelector('.fold-head')?.textContent ?? '').includes('预览'),
          )
          facts['crystal.previewElementGone'] = !d().querySelector('.preview')

          const cyRect = (el) => {
            if (!el) return null
            const r = el.getBoundingClientRect()
            return { x: r.left, y: r.top, w: r.width, h: r.height }
          }

          // ★ 步骤条：量"是哪几步、顺序对不对"。
          //   ⚠️ 2026-10-21 改：这里原来量的是**四步**且「审核」排第 3 位——那条判据跟着旧的
          //      界面形态走，而形态本身被判定是错的（审核不是入库的门，画成一步会让人以为
          //      必须等它 ⇒ "感觉一直没结束"）。现在量的是**三步**且审核**不占一格**。
          //   ⚠️ 也**不**用"文本包含审核"当判据：那样"审核被画成第 4 步"同样能通过。
          const cySteps = [...d().querySelectorAll('.crystal-steps .step-label')].map((e) =>
            (e.textContent ?? '').trim(),
          )
          facts['crystal.stepLabels'] = cySteps
          facts['crystal.stepAuditNotAStep'] = !cySteps.includes('审核')
          // 步骤条占多宽/多高：原来 4 步各 `flex:1`，被拉到横跨整行（实测 735px、间距还不均）
          facts['crystal.stepBarBox'] = cyRect(d().querySelector('.crystal-steps'))
          // ★ 同一份"轮次 · 工具调用"统计在一屏里出现几次：原来副标题一次 + 素材摘要分节一次
          const cyStatsHits = ((d().body.innerText ?? '').match(/次工具调用/g) ?? []).length
          facts['crystal.statsHits'] = cyStatsHits

          // ★ 审核区块（结论与问题清单常驻的那一块）
          const cyAudit = d().querySelector('.conclusion-block')
          facts['crystal.auditPresent'] = !!cyAudit
          facts['crystal.auditText'] = cyAudit ? text(cyAudit) : null
          facts['crystal.auditStartButton'] = !!(
            cyAudit &&
            [...cyAudit.querySelectorAll('button')].some((b) =>
              (b.textContent ?? '').includes('开始审核'),
            )
          )

          // ★ 编辑窗格（树 + 窗格那一块）的起点：这次重排争的就是它。
          //   改前三条横条摞在它上面，起点落在 y≈490；探针按 y 钉住"首屏能直接动手"。
          // ⚠️ 变量名不许与下面已有的 `cyPaneRect`（量窗格尺寸那条）重名——**重名是
          //    脚本级的 SyntaxError**，而 probe.html 不经过 typecheck/svelte-check，
          //    于是整个探针一个字都发不出来（外面只看到"没在超时前给出结果"）。
          //    实测撞过一次；现在 run.mjs 起 Chrome 之前会先给这份脚本做语法检查。
          const cyPaneTopRect = cyRect(d().querySelector('.review-pane'))
          facts['crystal.paneTopY'] = cyPaneTopRect ? Math.round(cyPaneTopRect.y) : null

          // ★「开始审核」按钮的盒子：改前它在 69px 宽里折成 3 行（实测 69×54）。
          const cyStartBtn = [...d().querySelectorAll('.conclusion-block button')].find((b) =>
            (b.textContent ?? '').includes('开始审核'),
          )
          facts['crystal.auditStartButtonBox'] = cyRect(cyStartBtn)
          // ★ 2026-10-21：那句"这是预筛、不替你做入库决定"从**段落**搬进了这个按钮的
          //   `title`（段落占 42px 两行，而它是解释不是结论）。判据跟着搬——不是删掉它：
          //   要证明这句话还在，而且还能被看到（悬停），而不是被顺手删干净。
          facts['crystal.auditStartButtonTitle'] = cyStartBtn?.getAttribute('title') ?? null

          /*
           * ★ 窄窗口：结论条**不许换行、不许把按钮挤出条外**。
           *
           * 这条判据的来源是一个真缺陷：「开始审核」原来只有 69px 宽、被折成 **3 行**（高 54px），
           * 因为它所在的横条没有管住 `flex`（`white-space` 与 `flex-shrink` 都没写）。而这个
           * 条件**只在窄的时候出现**——1400px 的窗口下量不出来。所以这里把 iframe 收窄再量一次，
           * 量完立刻复原：后面每一段都依赖 1280×880 这个首屏尺寸。
           */
          const cyIframeW = f.style.width
          f.style.width = '1000px'
          await untilNet(() => {
            const b = d().querySelector('.conclusion-bar')
            return !!b && Math.round(b.getBoundingClientRect().width) < 800
          }, 60)
          const cyNarrowBar = d().querySelector('.conclusion-bar')
          if (cyNarrowBar) {
            const nb = cyNarrowBar.getBoundingClientRect()
            const act = cyNarrowBar.querySelector('.bar-actions')
            const ab = act ? act.getBoundingClientRect() : null
            facts['crystal.barNarrowBox'] = {
              w: Math.round(nb.width),
              h: Math.round(nb.height),
              buttonsInside: ab !== null && ab.right <= nb.right + 1 && ab.left >= nb.left - 1,
            }
          } else {
            facts['crystal.barNarrowBox'] = null
          }
          f.style.width = cyIframeW
          await untilNet(() => {
            const b = d().querySelector('.conclusion-bar')
            return !!b && Math.round(b.getBoundingClientRect().width) > 800
          }, 60)

          // ① 结论条：在、而且**在首屏**（改前审阅的结论在 y=932，900 高的窗口看不到）
          // ★ 2026-10-21：结论条**只有一条**（原来是三条横条竖着摞：审核块 + 校验条 + frontmatter 摘要）
          const cyBars = [...d().querySelectorAll('.conclusion-bar')]
          facts['crystal.conclusionBarCount'] = cyBars.length
          facts['crystal.legacyBarsGone'] =
            d().querySelector('.review-bar-block') === null && d().querySelector('.audit-block') === null

          const cyBar = d().querySelector('.conclusion-bar')
          const cyBarRect = cyRect(cyBar)
          facts['crystal.barPresent'] = !!cyBar
          facts['crystal.barText'] = cyBar ? text(cyBar) : null
          facts['crystal.barY'] = cyBarRect ? Math.round(cyBarRect.y) : null
          facts['crystal.viewportH'] = f.contentWindow.innerHeight
          facts['crystal.barAboveFold'] =
            cyBarRect !== null && cyBarRect.y < f.contentWindow.innerHeight * 0.5

          // ② 不整页滚：文档高 ≈ 视口高（改前内容 ~2030px，整页滚）
          const cyScrollH = d().documentElement.scrollHeight
          facts['crystal.scrollH'] = cyScrollH
          facts['crystal.pageFitsViewport'] =
            cyScrollH <= f.contentWindow.innerHeight + 4

          // 主区：两列（树固定 240 + 窗格更宽）、高度在 clamp 区间内
          const cyPane = d().querySelector('.review-pane')
          const cyTree = d().querySelector('.review-pane .file-tree')
          const cyBody = d().querySelector('.review-pane .file-body')
          const cyPaneRect = cyRect(cyPane)
          const cyTreeRect = cyRect(cyTree)
          const cyBodyRect = cyRect(cyBody)
          facts['crystal.paneCols'] = cyPane ? cs(cyPane).gridTemplateColumns : null
          facts['crystal.treeW'] = cyTreeRect ? Math.round(cyTreeRect.w) : null
          facts['crystal.paneH'] = cyPaneRect ? Math.round(cyPaneRect.h) : null
          facts['crystal.paneTreeBodySideBySide'] =
            cyTreeRect !== null &&
            cyBodyRect !== null &&
            cyBodyRect.x > cyTreeRect.x &&
            Math.abs(cyTreeRect.y - cyBodyRect.y) < 2

          // 树行：徽标 + 名字 + `+n −m`；徽标与行数**同源**（都来自 diff）
          facts['crystal.treeRows'] = [...d().querySelectorAll('.review-pane .file-row')].map(
            (b) => text(b),
          )
          facts['crystal.treeHasSkillMd'] = facts['crystal.treeRows'].some((t) =>
            t.includes('SKILL.md'),
          )
          facts['crystal.treeTagTexts'] = [
            ...d().querySelectorAll('.review-pane .change-tag'),
          ].map((e) => text(e))

          // 只读 frontmatter + slug 是唯一输入框（四轮第 ④ 点：审阅不再填空）
          const cySlugInputs = [...d().querySelectorAll('.slug-inline input')]
          const cyAllTextInputs = [...d().querySelectorAll('.conclusion-meta input')]
          facts['crystal.slugInputCount'] = cySlugInputs.length
          facts['crystal.reviewInputCount'] = cyAllTextInputs.length
          facts['crystal.frontmatterLine'] =
            (d().querySelector('.frontmatter-line') &&
              text(d().querySelector('.frontmatter-line'))) ||
            null

          // ③ 编辑与差异同位置切换
          const cyTabs = [...d().querySelectorAll('.pane-tabs > button')]
          facts['crystal.tabTexts'] = cyTabs.map((b) => text(b))
          facts['crystal.editorInContentTab'] = !!d().querySelector('.file-body textarea.editor')
          facts['crystal.diffVisibleInContentTab'] =
            d().querySelectorAll('.diff-line').length > 0
          const cyDiffTab = cyTabs.find((b) => text(b) === '差异')
          if (cyDiffTab) click(cyDiffTab)
          const cySwapped = await until(
            () => !d().querySelector('textarea.editor') && d().querySelectorAll('.diff-line').length > 0,
            60,
          )
          facts['crystal.diffTabSwapsEditor'] = cySwapped
          facts['crystal.diffLineCount'] = d().querySelectorAll('.diff-line').length
          const cyEditorRectBefore = cyBodyRect
          const cyDiffBox = d().querySelector('.diff-box')
          const cyDiffRect = cyRect(cyDiffBox)
          // "同位置"：diff 那块在**编辑器原来那块窗格里**（同一个 x / 宽），
          // 而不是像改之前那样跑到窗格下面 519px
          facts['crystal.diffSamePlaceAsEditor'] =
            cyDiffRect !== null &&
            cyEditorRectBefore !== null &&
            Math.abs(cyDiffRect.x - cyEditorRectBefore.x) < 4 &&
            cyDiffRect.y < cyEditorRectBefore.y + cyEditorRectBefore.h
          // ★ 基线切换按钮**只有改版草稿才有**（`{#if artifacts.revisedFrom !== null}`）：
          //   这一条量的正是"这条不是改版 ⇒ 不给一个永远空的切换"。
          facts['crystal.nonRevisedHasNoBaselineSwitch'] = ![
            ...d().querySelectorAll('.pane-tabs button'),
          ].some((b) => text(b).includes('对比'))
          // 回到内容标签，后面的检查在编辑态里量
          const cyContentTab = [...d().querySelectorAll('.pane-tabs > button')].find(
            (b) => text(b) === '内容',
          )
          if (cyContentTab) click(cyContentTab)
          await until(() => !!d().querySelector('textarea.editor'), 60)

          // ══════════════════════════════════════════════════════════════
          // ★ 审阅屏的三个 tab：草稿 / 依据 / 过程（2026-10-21 第 3 批，使用者确认的信息分层）
          //
          // 原来的纪律是"参照信息折在主区**下方**"（`crystal.materialBelowPane`）。纪律没变，
          // 换的是实现：从"摞在下面"改成"切过去看"——量法于是也从"折叠头在主区下方"
          // 换成"主区下面**什么参照信息都没有了**，它们各自在一个 tab 里"。
          // ⚠️ 别把这条判据删掉当成"设计变了"：不变的是"参照信息不抢'要动手'的位置"。
          // ══════════════════════════════════════════════════════════════
          const cyReviewTabs = () => [...d().querySelectorAll('.review-tabs > button')]
          const cyTabButton = (name) => cyReviewTabs().find((b) => text(b).startsWith(name)) ?? null
          facts['crystal.reviewTabTexts'] = cyReviewTabs().map((b) => text(b))
          const cySelectedTab = () => {
            const b = cyReviewTabs().find((x) => x.getAttribute('aria-selected') === 'true')
            return b ? text(b) : null
          }
          facts['crystal.reviewTabDefault'] = cySelectedTab()
          facts['crystal.tabStripBox'] = cyRect(d().querySelector('.review-tabs'))
          facts['crystal.defaultTabIsDraft'] =
            facts['crystal.reviewTabDefault'] === '草稿' &&
            !!d().querySelector('.review-pane textarea.editor, .review-pane .file-body')

          // 主区下面不许再摞参照信息（改前：素材折在 y≈842、起草 run 在 y≈1002，
          // 两块把"要动手的地方"顶到第二屏）
          const cyPaneBottom = cyPaneRect === null ? null : cyPaneRect.y + cyPaneRect.h
          facts['crystal.belowPaneBlocks'] =
            cyPaneBottom === null
              ? null
              : [
                  ...d().querySelectorAll(
                    '.detail-scroll > .drawer-section, .detail-scroll > .fold-section',
                  ),
                ]
                  .filter((el) => el.getBoundingClientRect().top >= cyPaneBottom - 2)
                  .map((el) => text(el.querySelector('h3, .fold-head') ?? el).slice(0, 20))

          // ── 依据 tab：起草者读过的素材（原来折在编辑器下面 y≈842，要先滚再展开）──
          const cyEvidenceTab = cyTabButton('依据')
          if (cyEvidenceTab) {
            click(cyEvidenceTab)
            const cyEvOk = await until(() => !!d().querySelector('.evidence-pane .file-row'), 60)
            facts['crystal.evidenceOpens'] = cyEvOk
            facts['crystal.evidenceRows'] = [
              ...d().querySelectorAll('.evidence-pane .file-row'),
            ].map((b) => text(b))
            const cyEvPane = d().querySelector('.evidence-pane')
            facts['crystal.evidencePaneCols'] = cyEvPane ? cs(cyEvPane).gridTemplateColumns : null
            facts['crystal.evidencePreviewLen'] = (
              d().querySelector('.evidence-pane .file-pre')?.textContent ?? ''
            ).length
            // 搬进 tab 就不该再折一层：`依据` 里点开才有的折叠段是"多一次点击"
            facts['crystal.evidenceNoFold'] = !d().querySelector('.evidence-pane .fold-section')
            const cyEvBox = cyRect(cyEvPane)
            facts['crystal.evidenceInFirstScreen'] =
              cyEvBox !== null && cyEvBox.y + cyEvBox.h <= facts['crystal.viewportH'] + 1
            // 切回草稿：后面的检查在草稿那一屏上量
            const cyBackToDraft = cyTabButton('草稿')
            if (cyBackToDraft) click(cyBackToDraft)
            await until(() => !!d().querySelector('.review-pane .file-body'), 60)
          } else {
            facts['crystal.evidenceOpens'] = null
            facts['crystal.evidenceRows'] = null
            facts['crystal.evidencePaneCols'] = null
            facts['crystal.evidencePreviewLen'] = null
            facts['crystal.evidenceNoFold'] = null
            facts['crystal.evidenceInFirstScreen'] = null
          }

          // ── 过程 tab：审核日志 + 起草 run（两态：最后结果 / 完整日志）──
          const cyProcessTab = cyTabButton('过程')
          if (cyProcessTab) {
            click(cyProcessTab)
            const cyProcOk = await until(() => !!d().querySelector('.process-pane'), 60)
            facts['crystal.processOpens'] = cyProcOk

            // ★★ 起草 run：默认**最后结果**，一点换成**完整日志**（使用者第三条：
            //    "应该类似任务中的最后结果和完整日志一样的切换方式"）。
            //    这一块随第 3 批搬进「过程」tab，断言不变、只是要先切过来。
            const draftSection = [...d().querySelectorAll('.process-pane .drawer-section')].find(
              (el) => (el.querySelector('h3')?.textContent ?? '').includes('起草 run'),
            )
            facts['crystal.draftSectionFound'] = !!draftSection
            const finalEl = draftSection ? draftSection.querySelector('.draft-final') : null
            facts['crystal.draftFinalText'] = finalEl ? text(finalEl) : null
            const toggle = draftSection
              ? ([...draftSection.querySelectorAll('h3 button')][0] ?? null)
              : null
            facts['crystal.draftToggleLabel'] = toggle ? text(toggle) : null
            if (toggle) {
              click(toggle)
              await until(() => !!draftSection?.querySelector('.log-box'), 60)
              facts['crystal.draftLogAfterToggle'] = !!draftSection?.querySelector('.log-box')
              facts['crystal.draftToggleLabelAfter'] = text(toggle)
              click(toggle)
              await until(() => !!draftSection?.querySelector('.draft-final'), 60)
              facts['crystal.draftBackToFinal'] = !!draftSection?.querySelector('.draft-final')
            }

            const cyBackToDraft2 = cyTabButton('草稿')
            if (cyBackToDraft2) click(cyBackToDraft2)
            await until(() => !!d().querySelector('.review-pane .file-body'), 60)
          } else {
            facts['crystal.processOpens'] = null
            facts['crystal.draftSectionFound'] = null
            facts['crystal.draftFinalText'] = null
            facts['crystal.draftLogAfterToggle'] = null
            facts['crystal.draftBackToFinal'] = null
          }

          // 「按意见改一版」：输入框**默认不在**（点开才占一行）
          // ★ 分批第 17 批：按钮改名「按意见再改一版」→「反馈」，这里跟着改。
          //   ⚠️ 我第一版只改了"点开框"那一处，漏了这一处 ⇒ 判据 `点它之后输入框真的出现`
          //   量到 null（按钮没找到，整条 else 分支），红的是探测脚本不是界面。
          const cyReviseBtn = [...d().querySelectorAll('.bar-actions button')].find((b) =>
            text(b).includes('反馈'),
          )
          facts['crystal.reviseButtonName'] = cyReviseBtn ? text(cyReviseBtn) : null
          facts['crystal.reviseButtonPresent'] = !!cyReviseBtn
          facts['crystal.reviseRowHiddenInitially'] = !d().querySelector('.revise-row textarea')
          if (cyReviseBtn) {
            click(cyReviseBtn)
            const cyReviseShown = await until(() => !!d().querySelector('.revise-row textarea'), 40)
            facts['crystal.reviseRowAppearsOnDemand'] = cyReviseShown
            click(cyReviseBtn)
            await wait(120)
          } else {
            facts['crystal.reviseRowAppearsOnDemand'] = null
          }

          // ★ 改版草稿（`revisedFrom`）：默认对比**上一版草稿**，且能切回"对比当前版本"
          const cyRevisedOk = await cyEnter(cyRevised)
          facts['crystal.revisedAttached'] = cyRevisedOk
          // 先认现场：编辑器里是不是**这一版**的字（否则下面量的是上一条草稿的数字）
          // ⚠️ 要**整份**拿去判：那一句差异在正文第 100 个字符之后，截前 60 个字符
          //    时两版长得一模一样（第一版就是这么写的 ⇒ 这条断言永远红，而现场其实
          //    是对的）。
          facts['crystal.revisedEditorHasMarker'] = (
            d().querySelector('textarea.editor')?.value ?? ''
          ).includes('已按意见改')
          facts['crystal.revisedEditorHead'] = (
            d().querySelector('textarea.editor')?.value ?? ''
          ).slice(0, 60)
          facts['crystal.revisedBarText'] = cyRevisedOk
            ? text(d().querySelector('.conclusion-bar'))
            : null
          // 接口那一份也读一次：分清"接口没给 revisedFrom"与"页面没换现场"
          facts['crystal.revisedApiRevisedFrom'] = await f.contentWindow
            .fetch(`/api/crystallize/artifacts?draftRunId=${encodeURIComponent(cyRevised ?? '')}`)
            .then((r) => (r.ok ? r.json() : null))
            .then((p) => (p ? p.revisedFrom !== null : null))
            .catch(() => null)
          const cyDiffTabB = [...d().querySelectorAll('.pane-tabs > button')].find(
            (b) => text(b) === '差异',
          )
          if (cyDiffTabB) click(cyDiffTabB)
          await until(() => !!d().querySelector('.diff-box'), 60)
          const cySwitchButtons = [...d().querySelectorAll('.pane-tabs button')].map((b) => text(b))
          facts['crystal.revisedSwitchButtons'] = cySwitchButtons
          facts['crystal.revisedHasBaselineSwitch'] = cySwitchButtons.includes('对比上一版草稿')
          facts['crystal.revisedDefaultBaselineActive'] = (() => {
            const btns = [...d().querySelectorAll('.pane-tabs .tabs-right button')]
            const active = btns.find((b) => b.classList.contains('active'))
            return active ? text(active) : null
          })()
          facts['crystal.revisedDiffLineCount'] = d().querySelectorAll('.diff-line').length

          // ★★ 「审核未通过」那一屏（§10.5 第 ③ 条，判决 `fail` + `escalated` = 配额用尽）。
          //    判据三条，缺一条这一屏就不成立：
          //      ① 结论条说清"不通过 + 理由码 + 配额用尽"（人要知道为什么停在这儿）；
          //      ② 问题清单**数得出来**（`看 N 条问题`，点开真有 N 条）；
          //      ③ 两个出口都在：**按意见重新起草**（第 ② 条）+ **确认入库仍然可按**
          //         （第 ① 条：审核是预筛，不替人做决定——按钮灰掉就等于把预筛变成了闸）。
          const cyFail = cyQuery.get('crystalAuditFail')
          facts['crystal.auditFailFixture'] = cyFail
          facts['crystal.auditFailEntered'] = await cyEnter(cyFail)
          if (facts['crystal.auditFailEntered']) {
            const cyAuditBlock = d().querySelector('.conclusion-block')
            facts['crystal.auditFailText'] = cyAuditBlock ? text(cyAuditBlock) : null
            const cyFindingsBtn = cyAuditBlock
              ? [...cyAuditBlock.querySelectorAll('button')].find((b) =>
                  /看 \d+ 条问题/.test(text(b)),
                )
              : null
            facts['crystal.auditFailFindingsButton'] = cyFindingsBtn ? text(cyFindingsBtn) : null
            if (cyFindingsBtn) {
              click(cyFindingsBtn)
              // ★ 第 3 批：这个按钮不再是"展开折叠"，而是**切到「过程」tab**
              //   ——断言它真的切过去了（不然按钮就成了摆设：点一下什么都不动）
              facts['crystal.auditFailFindingsTab'] = await until(
                () =>
                  (text(d().querySelector('.review-tabs > button[aria-selected="true"]')) ?? '').startsWith('过程') &&
                  !!d().querySelector('.audit-findings li'),
                40,
              )
            }
            facts['crystal.auditFailFindingCount'] = d().querySelectorAll('.audit-findings li').length
            facts['crystal.auditFailSeverities'] = [
              ...d().querySelectorAll('.audit-findings li .sev'),
            ].map((e) => text(e))
            // ══════════════════════════════════════════════════════════════
            // ★★★ 意见框**打开时默认就填好审核者的反馈**（分批第 12 批，使用者纠正过一次）
            // ══════════════════════════════════════════════════════════════
            //
            // 期望的形状（使用者原话）：「点"按意见重新起草"后，我期待**意见框里面默认填充了
            // 审核者审核的反馈**」。所以这里的判据是"**一开框就有内容**"，而不是
            // "先点一个专门用来填的按钮"——我第一版做成独立按钮（还改了名），
            // 那多要了人一次点击，是错的形状，已经撤掉。
            //
            // 量四件事：① 开框即有内容（带理由码/位置/原文）；② 光标在框里；
            // ③ 提交由人点（按钮在、可点）；④ **没有自己跑起来**（框与按钮都还在）。
            // 外加一条最容易做错的：⑤ 人改过的字**不许**被覆盖。

            // 换句话要派发 `input`：`bind:value` 靠它（只改 value 不生效）
            const cyToggle = [...d().querySelectorAll('button')].find((b) =>
              // ★ 分批第 17 批改名：「按意见再改一版」→「反馈」（使用者定稿"原则上应该叫反馈"）。
              //   判据量的是**那一个入口在不在**，所以跟着名字走；旧名字留在下面那条"不许存在"里。
              //
              // ⚠️ 这里**故意**用宽匹配「反馈」而不是「提交反馈」（我改成后者时这一片 12 条判据当场红）：
              //    此刻意见框还没开，页面上只有"开框"那一个按钮；等框开了之后再找"提交"才需要收紧
              //    （下面那个 finder 是在 `.revise-row` 里找的，`提交反馈` 是它唯一的匹配）。
              text(b).includes('反馈'),
            )
            facts['crystal.reviseToggleButton'] = !!cyToggle
            // 「按意见重新起草」/「填入审核问题」这两个按钮都**不该**存在：
            // 同一个动作只有一个入口（多一个入口，迟早两边不一样）
            facts['crystal.redraftOldButtonsGone'] = ![
              ...d().querySelectorAll('button'),
            ].some((b) => text(b).includes('按意见重新起草') || text(b).includes('填入审核问题'))
            cyToggle?.click()
            // ⚠️ `until` 返回的是**布尔**（它只回答"等到了没有"），不是元素——
            //    第一版把它当元素用（`cyBox.value.includes(...)`）⇒ 探针当场抛
            //    `TypeError: Cannot read properties of undefined`，而**一次异常会把后面
            //    一百多条判据的取值全带走**（日志里表现为 109 条"没量到这个值"，
            //    看起来像界面坏了，其实是探针自己崩在这一行）。所以：先等，再取。
            const cyBoxOpen = await until(() => !!d().querySelector('.revise-row textarea'), 40)
            const cyBox = cyBoxOpen ? d().querySelector('.revise-row textarea') : null
            facts['crystal.redraftBoxOpened'] = cyBox !== null
            facts['crystal.redraftFilled'] = cyBox ? cyBox.value : null
            facts['crystal.redraftHasReasonCode'] = cyBox ? cyBox.value.includes('style_violation') : null
            facts['crystal.redraftHasLocator'] = cyBox ? cyBox.value.includes('SKILL.md') : null
            // 原文串取自夹具那条判决自己写的摘录（第一版我猜了一个串 ⇒ 判据红，
            // 红的是判据不是产品：`原文：运行 marker.sh` 才是它真的写的东西）
            facts['crystal.redraftHasExcerpt'] = cyBox ? cyBox.value.includes('运行 marker.sh') : null
            // ⚠️ 焦点要问**它所在的文档**（`d()` 是 iframe 的 document）——第一版问的是顶层
            //    `document.activeElement`，量出来永远是 false（焦点在 iframe 里）
            facts['crystal.redraftFocused'] = cyBox ? d().activeElement === cyBox : null
            // 这句话要说清"这段是哪来的"，不然人不知道框里为什么有东西
            // ⚠️ 等一拍再读：Svelte 5 属性/文本写进 DOM 是在微任务里冲洗的（`title` 那次踩过）
            await wait(150)
            const cyPrefillHint = d().querySelector('.revise-row .faint')
            facts['crystal.revisePrefilledHint'] = cyPrefillHint ? text(cyPrefillHint) : null
            const cySubmit = [...d().querySelectorAll('.revise-row button')].find((b) =>
              text(b).includes('反馈'),
            )
            facts['crystal.redraftSubmitEnabled'] = cySubmit ? !cySubmit.disabled : null
            // 提交按钮**仍然在**、框**仍然在** ⇒ 说明开框只是填，没有自己跑起来
            // （真跑起来这一屏会切到"起草中"，框和按钮一起消失）
            facts['crystal.redraftStillEditing'] = !!cyBox && !!cySubmit
            // ── ⑤ 人改过的字不许被覆盖：改完收起、再打开，还是我改的那句 ──
            if (cyBox) {
              cyBox.value = '我自己写的意见'
              cyBox.dispatchEvent(new Event('input', { bubbles: true }))
              cyToggle?.click() // 收起
              await wait(150)
              cyToggle?.click() // 再打开
              await wait(200)
              const cyAgain = d().querySelector('.revise-row textarea')
              facts['crystal.reviseKeepsHumanEdit'] = cyAgain ? cyAgain.value : null
              // 收拾干净：把框收起来、内容清掉，别影响后面几节
              if (cyAgain) {
                cyAgain.value = ''
                cyAgain.dispatchEvent(new Event('input', { bubbles: true }))
              }
              cyToggle?.click()
              await wait(150)
            } else {
              facts['crystal.reviseKeepsHumanEdit'] = null
            }
            // 出口二：确认入库**没有**被判决灰掉（第 ① 条决定：审核不替代人）
            const cySave = [...d().querySelectorAll('button.primary')].find((b) =>
              text(b).includes('确认入库'),
            )
            facts['crystal.auditFailSaveDisabled'] = cySave ? cySave.disabled : null
            facts['crystal.auditFailSavePresent'] = !!cySave
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 人改草稿：保存改动 → 结论标过期 → 重新审核（2026-10-21 分批第 8 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 起因是使用者的原话：「缺少一个可以改的地方」。编辑器一直都在（这一屏的文件树
          // 每个文本文件都能改），缺的是**改完算不算数**：改动原来只活在浏览器内存里，
          // 而审核者读的是磁盘上的 `skill/`。
          //
          // 这一节量四件事（缺任何一条，"改了算数"就只是句口号）：
          //   ① 刚进这一屏（没改过）**没有**「保存改动」、也**没有**过期标记；
          //   ② 在编辑器里打字 ⇒ 出现「保存改动」（只在有未保存改动时出现）；
          //   ③ 点它 ⇒ 标记出现「内容已改 —— 这个结论是改之前的」+ 出现「重新审核」；
          //   ④ 保存真的写到了磁盘/接口上（重读 artifacts，正文是新写的）。
          {
            const cyManual = cyQuery.get('crystalAuditFail')
            facts['crystal.manualEntered'] = await cyEnter(cyManual)
            if (facts['crystal.manualEntered']) {
              const cyHasText = (needle) =>
                [...d().querySelectorAll('.conclusion-block button')].some((b) =>
                  text(b).includes(needle),
                )
              facts['crystal.manualBeforeButtons'] = [
                ...d().querySelectorAll('.conclusion-block button'),
              ].map((b) => text(b))
              facts['crystal.manualStaleBefore'] = !!d().querySelector('.stale-tag')

              // 在编辑器里"打字"：Svelte 的 bind:value 听的是 input 事件
              const ta = d().querySelector('textarea.editor')
              if (ta) {
                ta.value = `${ta.value}\n\n（人手加的一行：${cyManual.slice(-6)}）`
                ta.dispatchEvent(new Event('input', { bubbles: true }))
              }
              await until(() => cyHasText('保存改动'), 40)
              facts['crystal.manualDirtySaveButton'] = cyHasText('保存改动')

              const saveBtn = [...d().querySelectorAll('.conclusion-block button')].find((b) =>
                text(b).includes('保存改动'),
              )
              if (saveBtn) click(saveBtn)
              const staleShown = await until(() => !!d().querySelector('.stale-tag'), 120)
              facts['crystal.manualStaleAfterSave'] = staleShown
              facts['crystal.manualStaleText'] = text(d().querySelector('.stale-tag'))
              facts['crystal.manualRetryAfterSave'] = cyHasText('重新审核')
              // 保存按钮自己应该**消失**了（没有未保存改动 ⇒ 它不该继续挂着）
              facts['crystal.manualSaveButtonGone'] = !cyHasText('保存改动')
              // ④ 真的写到了磁盘：重读 artifacts（它读的就是草稿小屋里的 `skill/`）
              const cyAfters = await fetch(
                `/api/crystallize/artifacts?draftRunId=${encodeURIComponent(cyManual)}`,
              ).then((r) => r.json())
              facts['crystal.manualOnDiskHasEdit'] = String(
                (cyAfters?.files ?? {})['SKILL.md'] ?? '',
              ).includes('人手加的一行')
            }
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 审核**真的跑起来**那一屏（2026-10-21 使用者："审核的过程看不到，
          //      感觉一直没结束呢"）
          // ══════════════════════════════════════════════════════════════
          //
          // 这里**点界面上真的「开始审核」**：daemon 会真的 spawn 一个进程（PATH 前面那个
          // 假 `agent-cli`，见 run.mjs 的 `writeFakeGenericCli`），它吐一行就挂着。
          // 之所以非要真跑，是因为"插一条 running 的夹具 run"量到的是**假的绿**：
          // daemon 重启时 `reconcileInterruptedRuns` 会把非终态 run 收口成 failed，
          // 于是那一屏其实是"没跑成"那一屏，两条判据碰巧都成立。
          // ★ 分批第 17 批：这一屏换用**独立单版**夹具 `crystalAuditLive`。
          //   原来用 `crystalDraft`（首版）——首版现在是一个任务的历史版本，而"审核只对当前那一版
          //   成立"的守则会（正确地）拒绝它 ⇒ 这一屏整片量不到。夹具内容与首版逐字相同，
          //   所以这里量到的结论条数字不变。
          facts['crystal.auditLiveEntered'] = await cyEnter(cyQuery.get('crystalAuditLive'))
          if (facts['crystal.auditLiveEntered']) {
            const startBtn = [...d().querySelectorAll('.conclusion-block button')].find((b) =>
              text(b).includes('开始审核'),
            )
            facts['crystal.auditLiveStartButton'] = !!startBtn
            if (startBtn) {
              click(startBtn)
              // ★ 第 3 批：日志住在「过程」tab 里，所以点「开始审核」必须**自动切过去**
              //   ——否则人停在"草稿"上看到的是"什么都没发生"，正好回到第 ① 条那个毛病。
              facts['crystal.auditAutoSwitchedToProcess'] = await untilNet(
                () => (text(d().querySelector('.review-tabs > button[aria-selected="true"]')) ?? '').startsWith('过程'),
              )
              // ⚠️ 全段用 `untilDom`（不能用 `until`）：此刻 RunLog 的 SSE 开着，时钟不走
              await untilNet(() => !!d().querySelector('.process-pane .log-box'))
              let block = d().querySelector('.process-pane')
              facts['crystal.auditLiveLogBox'] = !!(block && block.querySelector('.log-box'))
              // ⚠️ 两件事都要**等到**，不能量一次就算：
              //   ① run 从 `queued`/`dispatched` 走到 `running` 需要时间——第一版在这里
              //      量到的是"排队中"，判据红了，而界面没错（真现场就是还在排队）。
              //   ② 假 CLI 吐的那行要经 daemon 解析、再经 SSE 送到页面。
              //   等待全部走 `untilNet`（SSE 开着时时钟不走，`until` 会挂死）。
              await untilNet(() => text(d().querySelector('.conclusion-block .badge')) === '运行中', 400)
              await untilNet(
                () =>
                  (d().querySelector('.process-pane .log-box')?.textContent ?? '').includes('正在跑'),
                400,
              )
              block = d().querySelector('.process-pane')
              const liveBar = d().querySelector('.conclusion-block')
              facts['crystal.auditLiveText'] = liveBar ? text(liveBar) : null
              facts['crystal.auditLiveLogText'] = block ? text(block.querySelector('.log-box')) : null
              facts['crystal.auditLiveBadge'] = liveBar ? text(liveBar.querySelector('.badge')) : null
              const cancelBtn = liveBar
                ? [...liveBar.querySelectorAll('button')].find((b) => text(b).includes('取消审核'))
                : null
              facts['crystal.auditLiveCancelButton'] = !!cancelBtn
              if (cancelBtn) {
                click(cancelBtn)
                // 取消是**异步**的（要等进程真的死掉、run 落到终态）⇒ 等界面改口（走 DOM，不走时钟）。
                // ⚠️ 这里**不许赌某句文案**：第一版等的是「审核正在进行」，而第 2 批把结论条上
                //    那句改成了「审核运行中」（"审核正在进行"那半句搬进了「过程」里的说明段）
                //    ⇒ 等待条件**恒真**、量早了一拍，量到一个"还在取消中"的现场，判据红了而界面没错。
                //    改成等**取消按钮消失**：它才是"这一轮审核结束了"的界面事实。
                await untilNet(
                  () =>
                    ![...(d().querySelector('.conclusion-block')?.querySelectorAll('button') ?? [])].some(
                      (b) => text(b).includes('取消审核'),
                    ),
                  300,
                )
                const after = d().querySelector('.conclusion-block')
                const afterButtons = after ? [...after.querySelectorAll('button')].map(text) : []
                facts['crystal.auditAfterCancelText'] = after ? text(after) : null
                facts['crystal.auditAfterCancelStillRunning'] = afterButtons.some((t) =>
                  t.includes('取消审核'),
                )
                facts['crystal.auditAfterCancelRetry'] = afterButtons.some((t) =>
                  t.includes('重新审核'),
                )
              }
              // ★ 兜底：**保证这条 SSE 关掉**，否则后面整页的时钟都不走
              //   （取消没成功、或 240 次 DOM 变化都没等到，就靠切路由把组件卸载掉）。
              f.contentWindow.location.hash = '#/tasks'
              // 等这次路由切换真的生效（用网络往返当节拍：此刻时钟还是冻着的）
              await untilNet(() => !d().querySelector('.conclusion-block'), 20)
            }
          }

          // ★★★ 审核**没跑成**那一屏 —— 这一节最要紧的一条（原来它永远显示"审核中"）。
          const cyDead = cyQuery.get('crystalAuditDead')
          facts['crystal.auditDeadEntered'] = await cyEnter(cyDead)
          if (facts['crystal.auditDeadEntered']) {
            const block = d().querySelector('.conclusion-block')
            facts['crystal.auditDeadText'] = block ? text(block) : null
            facts['crystal.auditDeadSaysRunning'] = block
              ? /审核正在进行|跑完再看这里/.test(text(block))
              : null
            facts['crystal.auditDeadRetry'] = !!(block &&
              [...block.querySelectorAll('button')].some((b) => text(b).includes('重新审核')))
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 深链语义：URL 指名的草稿**就是**那一条（2026-10-21 第 7 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 真机上量出来的缺陷：`#/crystallize/<草稿id>` 里那个 id 原来被后端丢掉、
          // 一律挂"该来源最新那条"⇒ 同一来源下的几条草稿在「沉淀」列表里是**几行、
          // 点开却是同一条**（实测：同一对话来源下 4 条草稿只有最新那条能看，其余几条
          // 花钱审出来的判决在界面上打不开）。
          //
          // 这一节量两件事，缺一不可（只量前者会把"来源入口也变成深链"这种改坏当成通过）：
          //   ① 深链点**旧的那条** ⇒ 挂上的就是旧的（兄妹草稿只有 1 个文件）；
          //   ② 从**来源**进来 ⇒ 仍然是"最近那条"（3 个文件）。
          {
            const cySibling = cyQuery.get('crystalSibling')
            const cySource = cyQuery.get('crystalSource')
            const cyReadDraft = async (id) => {
              if (!id) return null
              f.contentWindow.location.hash = '#/tasks'
              await until(() => !d().querySelector('.review-tabs'), 40)
              f.contentWindow.location.hash = `#/crystallize/${id}`
              const cont = await until(
                () =>
                  [...d().querySelectorAll('button')].some((b) => text(b).includes('继续')),
                120,
              )
              if (!cont) return null
              click([...d().querySelectorAll('button')].find((b) => text(b).includes('继续')))
              const attached = await until(() => !!d().querySelector('.conclusion-bar'), 120)
              if (!attached) return null
              return {
                rows: [...d().querySelectorAll('.review-pane .file-row')].map((r) => text(r)),
                bar: text(d().querySelector('.conclusion-bar')),
              }
            }
            const cySiblingView = await cyReadDraft(cySibling)
            facts['crystal.deepLinkSiblingRows'] = cySiblingView ? cySiblingView.rows : null
            facts['crystal.deepLinkSiblingBar'] = cySiblingView ? cySiblingView.bar : null
            const cySourceView = await cyReadDraft(cySource)
            facts['crystal.sourceEntryRows'] = cySourceView ? cySourceView.rows : null
            // 收尾：切走路由（后面的小节自己会进它要的页面）
            f.contentWindow.location.hash = '#/tasks'
            await until(() => !d().querySelector('.review-tabs'), 40)
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 目标态那一屏（2026-10-21 第 5 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 它是这一屏的**入口**（从任务/对话点「沉淀成 skill」进来的第一眼），却一直是
          // 探针的空白：夹具都挂在"已完成草稿"上，`step === 'target'` 没有任何判据。
          // 夹具用一条**永远不起草**的源 run（挂上草稿这一屏就不再是目标态了）。
          //
          // 这一节量的是使用者确认过的第 ③ 条决定：**目标态不做 tab**（表单 + 一行素材判据
          // 常驻，素材清单那时还没落盘 ⇒ 不许画一行空的折叠出来）。
          {
            const cyTarget = cyQuery.get('crystalTarget')
            facts['crystal.targetFixtureId'] = cyTarget || null
            if (cyTarget) {
              f.contentWindow.location.hash = '#/tasks'
              await untilNet(() => !d().querySelector('.review-tabs'), 20)
              f.contentWindow.location.hash = `#/crystallize/${cyTarget}`
              // 目标态的标志：那张表单（radio 行 + 作用描述框）**当场**就在，不用点「继续」
              facts['crystal.targetAttached'] = await untilNet(
                () => !!d().querySelector('.radio-row input[type="radio"]'),
                90,
              )
              if (facts['crystal.targetAttached']) {
                facts['crystal.targetStepText'] = text(d().querySelector('.crystal-steps'))
                // ③ 的决定：这一屏**不做 tab**（`review-tabs` 是审阅/起草两屏的东西）
                facts['crystal.targetTabCount'] = d().querySelectorAll('.review-tabs').length
                facts['crystal.targetMaterialLine'] = text(
                  d().querySelector('.crystal-material-line'),
                )
                facts['crystal.targetFormRows'] = d().querySelectorAll(
                  '.detail-scroll .section-body .radio-row',
                ).length
                const cyStartBtn = [...d().querySelectorAll('button')].find((b) =>
                  text(b).includes('开始沉淀'),
                )
                facts['crystal.targetStartButton'] = cyStartBtn ? text(cyStartBtn) : null
                // ★ 按钮的悬停解释：素材为空 / 门槛不过要分开说清（第 ① 条那个"点了没反应"）
                facts['crystal.targetStartButtonTitle'] = cyStartBtn
                  ? (cyStartBtn.getAttribute('title') ?? '')
                  : null
                // ★ 起草前**不许**出现素材折叠：那一刻 `material/` 还没落盘（素材是起草
                //   请求时 `collectMaterial` 写的），画一行"0 个文件"的折叠就是一格死 UI
                facts['crystal.targetFoldCount'] = d().querySelectorAll('.fold-section').length
                const cyTFold = d().querySelector('.fold-section')
                facts['crystal.targetFoldHead'] = cyTFold ? text(cyTFold.querySelector('.fold-head')) : null
                facts['crystal.targetFoldClosed'] =
                  cyTFold?.querySelector('.fold-head')?.getAttribute('aria-expanded') === 'false'
                facts['crystal.targetScrollH'] = d().documentElement.scrollHeight
                facts['crystal.targetPageFits'] =
                  facts['crystal.targetScrollH'] <= facts['crystal.viewportH'] + 1
                const cyTBox = cyRect(d().querySelector('.detail-scroll .section-body'))
                facts['crystal.targetFormBox'] = cyTBox
                // 表单不许越过主区右边界（布局类缺陷只有量得出来）
                const cyTPaneBox = cyRect(d().querySelector('.detail-pane'))
                facts['crystal.targetFormInsidePane'] =
                  cyTBox !== null &&
                  cyTPaneBox !== null &&
                  cyTBox.x + cyTBox.w <= cyTPaneBox.x + cyTPaneBox.w + 1
              }
            }
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 起草中那一屏（2026-10-21 第 4 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 这一节以前**完全是空白**：探针的夹具都是"已完成草稿"，`step === 'drafting'`
          // 没有任何判据兜着（第 3 批改那一段标记时只能靠手工起一条真 run 验）。
          // 现在夹具在 Node 侧真的发起一条起草 run（假 `agent-cli` 吐一行就挂着），
          // 于是这一屏的判据量的是**真现场**：真 running、真日志、真 SSE。
          //
          // ⚠️ 全节必须走 `untilNet`：起草 run 的日志流（SSE）开着 ⇒ Chrome 的虚拟
          //    时钟**不走**，`until()` 里的 `setTimeout` 永远不触发（这条在审核那一节
          //    已经踩过一次，症状是"探针跑满超时、dump 里 done 不是 true"）。
          // ⚠️ 结尾必须**切走路由**把组件卸载掉：不关掉这条 SSE，后面每一节的时钟都是冻的。
          {
            const cyDrafting = cyQuery.get('crystalDrafting')
            facts['crystal.draftingFixtureId'] = cyDrafting || null
            const cyEnterDrafting = async () => {
              if (!cyDrafting) return false
              f.contentWindow.location.hash = '#/tasks'
              await untilNet(() => !d().querySelector('.review-tabs'), 20)
              f.contentWindow.location.hash = `#/crystallize/${cyDrafting}`
              // 未收尾的草稿挂的是「继续」（与审阅态同一条路：点它才接到那条 run 上）
              const attached = await untilNet(
                () => [...d().querySelectorAll('button')].some((b) => text(b).includes('继续')),
                60,
              )
              if (!attached) return false
              click([...d().querySelectorAll('button')].find((b) => text(b).includes('继续')))
              // 起草中的标志：tab 条 + 那个 run 的日志框（**不**是结论条——那时还没审核）
              return await untilNet(
                () => !!d().querySelector('.review-tabs') && !!d().querySelector('.log-box'),
                120,
              )
            }
            facts['crystal.draftingAttached'] = await cyEnterDrafting()
            if (facts['crystal.draftingAttached']) {
              facts['crystal.draftingStepText'] = text(d().querySelector('.crystal-steps'))
              const cyDTabs = () => [...d().querySelectorAll('.review-tabs > button')]
              facts['crystal.draftingTabTexts'] = cyDTabs().map((b) => text(b))
              facts['crystal.draftingTabDefault'] =
                text(cyDTabs().find((b) => b.getAttribute('aria-selected') === 'true')) ?? null

         * ══════════════════════════════════════════════════════════════
         *
         * 那次报错的根因有两层，所以这里要量的也有两层：
         *
         *   · **界面**那一层：`.mp4` 以前被当成"二进制"给一屏十六进制。判据是
         *     "看到的是不是播放器"，以及"**没有**十六进制/原文那一面"；
         *   · **接口**那一层：老路由把整份文件读进内存（8MB 上限）且不认 Range。
         *     判据不能只看元素在不在——一口空黑框正是这一条要挡的东西，所以要等
         *     `readyState`（浏览器真的解出了元数据），再去 fetch 一次量 **206**。
         *
         * ⚠️ "放不出来"那一条用的是**冒充 .mkv 的垃圾字节**：它必然解不出来，
         *    所以"界面有没有说一句人话"这件事是**确定性**量得到的（不用赌某个

         */
        /**
         * 播放器所在的**那个对话框**。
         *
         * ⚠️ 不能直接 `d().querySelector('video[data-file-video]')` + 另一个
         *    `d().querySelector('.fv-bar')`：那是**两个独立的全局查询**，只要文档里
         *    同时有两个查看器（另一个文件、另一栏、上一份没关掉的），取到的就不是
         *    同一份东西——"视频居然有原文那一面"这种假红就是这么来的（这一条踩过）。
         *    正确的取法是**先拿到那份文件的对话框，再在它里面问**。
         */
        const fvDialogFor = (selector) => {
          const el = d().querySelector(selector)
          if (el === null) return null
          return el.closest('[role="dialog"]') ?? el.parentElement
        }
        /** 出假红时要能一眼看出"当时文档里有几个查看器"——不然只能靠猜。 */
        const fvScene = () =>
          `现场：dialog=${d().querySelectorAll('[role="dialog"]').length}` +
          ` fvBar=${d().querySelectorAll('.fv-bar').length}` +
          ` video=${d().querySelectorAll('video[data-file-video]').length}` +
          ` audio=${d().querySelectorAll('audio[data-file-audio]').length}` +
          ` hex=${d().querySelectorAll('pre[data-hex]').length}` +
          ` bars=[${[...d().querySelectorAll('.fv-bar')]
            .map((b) => JSON.stringify(text(b).slice(0, 40)))
            .join(', ')}]`

         * 等浏览器**真的解出元数据**。
         *
         * ⚠️ 判据是 `readyState >= 1`（HAVE_METADATA）——"接口那一层通了"的唯一证据
         *    （类型对、字节取得到、Range 能用）。这一条**不放宽**。
         *
         * ⚠️ 但"怎么等"踩过坑：探针跑在 `--virtual-time-budget` 下，`setTimeout` 与
         *    `Date.now()` 都是**虚拟**的，一轮 `wait(200) × 20` 在真实时间里几乎是
         *    瞬间烧完，而媒体请求还在飞——于是量到 `readyState=0`，报告写成"接口那一层
         *    没通"，**而同一份报告里 `chat.fileViewerVideoRange206` 是绿的**（真发一个
         *    Range 请求拿回了 206）。两条判据互相打脸，就是探针等错了的证据。
         *    每次循环发一个**真**请求（同源、便宜），让真实时间真的往前走；
         *    这样 20 次与 400 次的区别才是真的区别。
         */
        const fvWaitPlayable = async (selector, tries = 300) => {
          const el = d().querySelector(selector)
          if (el === null) return null
          // 有的路径下元素刚建好、还没进 DOM，`load()` 不会自己开始
          if (el.readyState === 0 && el.networkState === 0) {
            try {
              el.load()
            } catch {
              /* 打不开就算了：下面按 readyState 如实报 */
            }
          }
          for (let i = 0; i < tries; i++) {
            if (el.readyState >= 1 || el.error !== null) return el
            await f.contentWindow.fetch('/api/identity').catch(() => null)
            await wait(20)
          }
          return el
        }

        facts['chat.fileViewerVideoPlays'] = await (async () => {
          if (!(await chatOpenFixtureConversation())) return false
          if (!(await fvOpenFile('clip.webm'))) return false
          const el = await fvWaitPlayable('video[data-file-video]')

            errors.push(`视频文件没有渲染成 <video>（还是被当二进制了？）${fvScene()}`)
            await fvClose()

          // ★ 这一份文件自己的那个对话框（不是"文档里第一个 .fv-bar"）
          const dialog = fvDialogFor('video[data-file-video]')
          if (dialog === null) {

        /**
         * ★★ 接口那一层：**Range ⇒ 206**，而且是那一段。
         *
         * 这是"能不能 seek"的判据。老路由不认 Range：回 200 整份，浏览器就只能从头
         * 顺序播，拖进度条会跳回开头——而"看一段视频却不能拖"等于没支持。
         */
        facts['chat.fileViewerVideoRange206'] = await (async () => {
          const conv = await fvFixtureConversation()
          if (!conv) {
            errors.push('找不到夹具对话——这一条量不到')
            return false
          }
          const url = `/api/conversations/${conv.id}/file?path=${encodeURIComponent('clip.webm')}`
          const head = await f.contentWindow.fetch(url, { headers: { Range: 'bytes=0-99' } })
          const status = head.status
          const cr = head.headers.get('content-range') ?? ''
          const ar = head.headers.get('accept-ranges') ?? ''
          const type = head.headers.get('content-type') ?? ''
          const buf = new Uint8Array(await head.arrayBuffer())
          if (status !== 206) {
            errors.push(`带 Range 的请求该回 206，实际 ${status}——不认 Range 就拖不动进度`)
            return false
          }
          if (!/^bytes 0-99\/\d+$/.test(cr)) {
            errors.push(`content-range 不对（量到的是「${cr}」）`)
            return false
          }
          if (buf.length !== 100) {
            errors.push(`只该发要的那 100 字节，实际 ${buf.length}`)
            return false
          }
          if (ar !== 'bytes') {
            errors.push(`没有 accept-ranges: bytes（量到的是「${ar}」）`)
            return false
          }
          if (!type.startsWith('video/')) {
            errors.push(`content-type 不是 video/*（量到的是「${type}」）——界面正是按它分类的`)
            return false
          }
          // ★ 再核一次"发出来的就是磁盘上那一段"：自己整份取回来比字节
          const whole = new Uint8Array(
            await (await f.contentWindow.fetch(url)).arrayBuffer(),
          )
          for (let i = 0; i < 100; i += 1) {
            if (buf[i] !== whole[i]) {
              errors.push('206 那一段与整份文件的前 100 字节对不上')
              return false
            }
          }
          return true
        })()

        facts['chat.fileViewerMediaNoSandboxCsp'] = await (async () => {

          }
          return true
        })()

        /**
         * ★ 旧 daemon：没有 `conversation-files` ⇒ 那一栏要**说明原因**，而不是

         * 表现是"取不到"和"还在加载"长得一模一样。
         */
        facts['chat.filesUnsupportedOnOldDaemon'] = await (async () => {
          const real = f.contentWindow.fetch
          f.contentWindow.fetch = function (input, init) {
            const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
            if (!String(url).includes('/api/identity')) {
              return real.call(f.contentWindow, input, init)
            }
            return real.call(f.contentWindow, input, init).then(async (res) => {
              const body = await res.json().catch(() => null)
              if (!body) return res
              body.capabilities = (body.capabilities ?? []).filter(
                (c) => c !== 'conversation-files',
              )
              return new Response(JSON.stringify(body), {
                status: res.status,
                headers: { 'content-type': 'application/json' },

            })

            await chatReloadIdentity()
            if (!(await chatOpenFixtureConversation())) return false

        facts['chat.deleteConfirmUsesModal'] = await (async () => {
