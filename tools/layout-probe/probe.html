          await until(() => langNavItem('任务') !== null, 40)
          const saved = await f.contentWindow
            .fetch('/api/identity')
            .then((r) => r.json())
            .catch(() => null)
          facts['lang.savedOnServer'] = saved ? saved.locale : null
        }

        // ★ 2026-10：语言组开着的设置抽屉要关掉——后面那几组（三步链等）量的是
        //   中文界面，抽屉浮层（含遮罩）会挡着它们点按钮。
        {
          const closeBtn = [...d().querySelectorAll('.drawer-head button')].find(
            (b) => ['关闭', 'Close'].includes(text(b).trim()),
          )
          if (closeBtn) click(closeBtn)
          await wait(300)
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 新建任务的三步链：① 执行 → ② 审核 → ③ 行动 ══════════════
        //
        // ⚠️ 2026-10（D58 第二步）：表单搬进「任务」页右栏之后，**这一组要把窗口
        //    画宽一点**（1600 而不是默认的 1280）——右栏的宽度 = 窗口 - 侧栏 240 -
        //    左栏清单 416，1280 的窗口下只剩 549px，按容器判会退成单列（那是**对**
        //    的，见任务页那几条 `createNarrow*/createWide*`），但这一组要量的是
        //    **那一张三步链的地图**（① 左、②③ 同列上下），单列下它没有形状可量。
        //    所以这一组统一在"右栏 860px"的窗口下跑，跑完还原。
        f.style.width = '1600px'
        await wait(400)
        //
        // 这一页原来只问一件事（交给谁执行），审核者藏在**执行者的长期配置**里
        // （`Agent.reviewerAgentId`），于是"这条任务会不会被审、由谁审、判完之后
        // 平台能替我做什么"三件事在提交之前全都看不见。现在三步都看得见，
        // 而且后一步默认由前一步推出来。
        //
        // ⚠️ **位置**（两处都不能挪）：
        //   · 排在**语言切换那一段之后**：那一段前面全是中文断言，语言切成英文
        //     会让它们全红，而这里量的是中文（zh 是文案的权威出处）；
        //   · 排在**D41 卸载工具那一段之前**：③ 列的是"**已装**工具包里的动作"，
        //     工具被卸载之后那个契约值就掉进"当前不可用"那一组，量到的不是同一件事。
        //
        // ⚠️ 夹具（两个审核者 + 一个执行者）由 `run.mjs` 造、三个 id 与动作名经
        //    URL 传进来：理由与工具那一段一样——探针跑在 `--virtual-time-budget` 下，
        //    `setTimeout` 是虚拟的而网络是真的，"自己造再等界面刷新"会**看早**。
        //    探针也**不许**靠"列表里的第一个执行者/第一个审核者"去找它们
        //    （那样夹具一多就会点错人，而症状是"读到的值莫名其妙"）。
        //
        // ⚠️ 这一段会**真的提交两次**（点「创建并派发」）。这是有意的：这一页最贵的
        //    错误是"界面上选的"与"发出去的请求体"不是同一件事，而那种错只有走完真
        //    入口、再从**接口**上把那条 run 读回来才看得见（三态在接口上的投影是
        //    分开的：`follow` / `none` / `override`）。夹具执行者的 runtime 是
        //    `generic`（命令 `agent-cli` 不存在）⇒ 那两条 run 会立刻失败，
        //    不会真的拉起一个模型去干活（见 `run.mjs` 里造夹具那一段的说明）。
        {
          const ntQuery = new URLSearchParams(location.search)
          const ntExecutorId = ntQuery.get('chainExecutor')
          const ntReviewerId = ntQuery.get('chainReviewer')
          const ntEmptyReviewerId = ntQuery.get('chainEmptyReviewer')
          const ntAction = ntQuery.get('chainAction')
          // 夹具 id 原样上报：`run.mjs` 拿它们与自己造出来的那三个比对——
          // "夹具没造出来"与"界面画错了"在报告里必须是两件事。
          facts['newtask.fixtureExecutorId'] = ntExecutorId
          facts['newtask.fixtureReviewerId'] = ntReviewerId
          facts['newtask.fixtureEmptyReviewerId'] = ntEmptyReviewerId
          facts['newtask.fixtureAction'] = ntAction

          /** 三步里第 n 步那一段。**按标题认**，不按顺序：少一步时顺序本身就全错位了。 */
          const ntStep = (ntTitle) =>
            [...d().querySelectorAll('.chain-step')].find(
              (s) => text(s.querySelector('.step-title')) === ntTitle,
            ) ?? null
          const ntActions = () => ntStep('③ 行动')
          /**
           * ③ 那一栏**说了什么**。
           *
           * ⚠️ 细节（胶囊 + 出处句）**在 ③ 这张卡片里面**，不是外面的一条。
           *    中间试过挪出去做成全宽的一条（理由是这一格只有一列宽、胶囊会折行），
           *    读起来就成了"另一件事"——使用者问"这些是什么"时，答案在 ③ 里。
           *    所以取文字就是取这张卡片（`.actions-detail` 是它的子孙，天然含在内）。
           */
          const ntActionsText = () => text(ntActions())

          /** ③ 里那块配置细节（胶囊 + 出处句）——它在卡片**内部**。 */
          const ntActionsDetail = () => ntActions()?.querySelector('.actions-detail') ?? null
          /** ① 那个下拉：认**取值里有夹具执行者**，不认"页面上的第一个 select"。 */
          const ntExecutorSelect = () =>
            [...d().querySelectorAll('select')].find((s) =>
              [...s.options].some((o) => o.value === ntExecutorId),
            ) ?? null
          /** ② 那个下拉：认它的取值里有 `follow`（三态的编码，见 `newtask-chain.ts`）。 */
          const ntReviewerSelect = () =>
            [...d().querySelectorAll('select')].find((s) =>
              [...s.options].some((o) => o.value === 'follow'),
            ) ?? null
          /**
           * ① 里那个「审核不通过时返工几次」下拉（D45）。
           *
           * ⚠️ 认的是"取值里同时有 0 和 5"这件事——不按"① 里的第二个 select"
           *    认（那是结构，加一个控件就错位）。`0`/`5` 是协议上的上下限，
           *    与 `SubmitRunRequest.maxReworks` 同源。
           */
          const ntReworkSelect = () =>
            [...d().querySelectorAll('select')].find((s) => {
              const vs = [...s.options].map((o) => o.value)
              return vs.includes('0') && vs.includes('5')
            }) ?? null
          /** 把返工次数拧到 n。 */
          const ntSetRework = async (ntValue) => {
            const ntSel = ntReworkSelect()
            if (!ntSel) return false
            ntSel.value = String(ntValue)
            ntSel.dispatchEvent(new Event('change', { bubbles: true }))
            return until(() => ntReworkSelect()?.value === String(ntValue), 40)
          }
          /**
           * 标题那个**多行框**：工作目录那个在「高级」折叠区里，不算。
           *
           * ⚠️ 它原来是一个 `input`（单行），探针按"第一个不在 details 里的 input"
           *    找。改成多行 `textarea` 之后那个找法会返回 `null`——而症状是
           *    **提交按钮一直 disabled**，看起来像"表单坏了"（实测：这一改让 30 多条
           *    端到端断言变红，全都是"提交没走完"这一个原因）。
           */
          const ntTitleInput = () => {
            const ntForm = d().querySelector('form')
            if (!ntForm) return null
            return (
              [...ntForm.querySelectorAll('textarea')].find((i) => !i.closest('details')) ?? null
            )
          }
          const ntSubmitButton = () =>
            [...d().querySelectorAll('form button')].find(
              (b) => b.getAttribute('type') === 'submit' || text(b) === '创建并派发',
            ) ?? null
          /** 接口上的 run 列表（端到端那两条的判据**只认这份**，不认页面上的字）。 */
          const ntRuns = () =>
            f.contentWindow
              .fetch('/api/runs')
              .then((r) => r.json())
              .then((p) => p.runs ?? [])
              .catch(() => [])
          /**
           * 那条 run 的**落库原文**（`GET /api/runs/<id>` 回的就是它）。
           *
           * ★ ③ 那两份端到端要判的是"请求体里那个 key 到没到库里"，而列表接口
           *   （`GET /api/runs`）给的是投影：它没有 `allowedActions`。所以必须回
           *   单条那个路由，判据是 `'allowedActions' in run`——**键在不在**这件事
           *   只有落库原文说得清（`undefined` 与 `[]` 在 JSON 里一个是"没有这个
           *   键"、一个是"空数组"，而它们的意思差了十万八千里）。
           */
          const ntRunRecord = (ntId) =>
            f.contentWindow
              .fetch(`/api/runs/${encodeURIComponent(ntId)}`)
              .then((r) => (r.ok ? r.json() : null))
              .catch(() => null)

          /**
           * 进这一页，并把 ① 选成夹具那个执行者。
           *
           * ⚠️ **先离开这一页再回来**，不能只写 `location.hash = '#/new'`：那一行在
           *    **已经**是 `#/new` 的时候是个空操作，组件不会重新挂载——而 ② 选的那一档
           *    是**组件状态**（`reviewerPick`，初值才是「跟随」），于是"上一次量完留下的
           *    那一档"会被当成这一次的默认值提交出去。实测踩过：提交①之前 ② 上还停着
           *    刚才量空态时选的「不自动审核」，于是那条 run 的 `reviewer.mode` 是 `none`
           *    ——**一条真 bug 的样子**（"跟随被写成了 null"），其实是探针自己的现场
           *    没收拾干净。所以下面还多量了一条 `followSubmitPick`：提交①之前 ② 上
           *    到底是哪一档，必须自己看得见。
           *
           * ⚠️ 每次重进都要重选 ①：`agentId` 也是**组件状态**，重进这一页时它会回到
           *    "生效中的默认"（播种的那个执行者），而不是上一次选的那个人。
           */
          const ntEnter = async () => {
            f.contentWindow.location.hash = '#/agents'
            await until(() => d().querySelectorAll('.agent-row').length > 0, 40)
            // ⚠️ 2026-10（D58 第二步）：建任务的表单**住在「任务」页右栏**里了。
            //    地址仍是 `#/tasks/new`（`#/new` 是老地址，同样直达），但顶栏
            //    页名是**「任务」**（那张表单不再是独立一页），所以等待条件从
            //    "页名 == 新建任务"改成"页名 == 任务 **且** 表单真的在右栏里"。
            f.contentWindow.location.hash = '#/tasks/new'
            await until(
              () =>
                text(d().querySelector('.page-name')) === '任务' &&
                !!d().querySelector('.detail-pane .create-body .newtask-form'),
              60,
            )
            await until(() => !!ntExecutorSelect(), 40)
            const ntSel = ntExecutorSelect()
            if (!ntSel) return false
            ntSel.value = ntExecutorId
            ntSel.dispatchEvent(new Event('change', { bubbles: true }))
            // ②③ 都在 `{#if chosen}` 里：等它们真的画出来再往下量
            return until(() => !!ntReviewerSelect() && !!ntActions(), 60)
          }

          /**
           * 进页面**并**打开 ③ 的对话框。
           *
           * ⚠️ 重进 `#/new` 会把这一页重新挂载 ⇒ `actionsOpen` 回到 `false`
           *    （它是组件状态，不跨挂载存活）。所以凡是要量勾选框的地方都得用这个，
           *    不能用裸的 `ntEnter()`——否则量到的是"对话框没开"的现场，而症状是
           *    一批断言说"0 个框"，看起来像权限没了。
           */
          const ntEnterWithActions = async () => {
            const ntOk = await ntEnter()
            if (!ntOk) return false
            return await ntOpenActions()
          }

          /** 把 ② 切成某一档（下拉的**取值**就是三态的编码）。 */
          const ntSetReviewer = async (ntValue) => {
            const ntSel = ntReviewerSelect()
            if (!ntSel) return false
            ntSel.value = ntValue
            ntSel.dispatchEvent(new Event('change', { bubbles: true }))
            return until(() => ntReviewerSelect()?.value === ntValue, 40)
          }

          /** ③ 里所有"能拧的旋钮"——**只读那一档**要求是一个都没有。 */
          const ntControlCount = () =>
            ntActions()
              ? ntActions().querySelectorAll('input, select, textarea, button').length
              : null
          /**
           * ③ 里的勾选框（可勾那一档才该有）。
           *
           * ⚠️ 只按 `input[type=checkbox]` 认，不按 `.action-option` 那类类名：
           *    这一条要证明的是"**这一栏有可勾的东西**"，类名改了不该把它弄红
           *    （真弄红了，读到的是"找不到框"，而不是"框没了"）。
           */
          /**
           * 打开 ③ 的挑选对话框（选择器从页面上搬进去了，见 `components/NewTaskForm.svelte` 里那段）。
           *
           * ★ 判据是**那颗按钮真的点开了浮层**（不是"页面上有个按钮"）：按钮存在
           *   但点了不开，是这次改动最容易出的错，而它的症状是后面所有关于勾选框的
           *   断言一起红——一片红里看不出是哪一条坏的。
           */
          const ntOpenActions = async () => {
            if (d().querySelector('.modal')) return true
            const ntBtn = [...(ntActions()?.querySelectorAll('button') ?? [])].find((b) =>
              (text(b) ?? '').includes('选择动作'),
            )
            if (!ntBtn) return false
            click(ntBtn)
            return until(() => !!d().querySelector('.modal'), 60)
          }
          /**
           * 对话框里的文字。
           *
           * ★ 有些话跟着选择器一起搬进去了（"固定参数改了"那句说的是**右栏里那些
           *   固定值**），所以它只能在对话框里读到——读页面上那一段会永远读不到，
           *   而症状是"那句提示没出现"，看起来像功能坏了。
           */
          const ntDialogText = () => text(d().querySelector('.modal'))

          /** 关掉它（用对话框自己的「完成」按钮——顺带量了那个按钮真的能关）。 */
          const ntCloseActions = async () => {
            const ntBtn = d().querySelector('.modal-foot button')
            if (!ntBtn) return false
            click(ntBtn)
            return until(() => !d().querySelector('.modal'), 40)
          }
          /**
           * ③ 上的勾选框 = **对话框里**的那些。
           *
           * ⚠️ 作用域必须是 `.modal`，不能是 `document`：智能体页那边也有一个同款
           *    选择器，而"哪一页的框"这种错在探针里是静默的（数量对得上就绿）。
           */
          const ntBoxes = () =>
            [...(d().querySelectorAll('.modal input[type=checkbox]') ?? [])]
          /** 勾着的那些框的契约值（`value` 就是契约值本身，判决里写的也是它）。 */
          const ntCheckedValues = () => ntBoxes().filter((b) => b.checked).map((b) => b.value)
          /**
           * 某一个框**旁边**那两样：契约值（`code`）与工具清单里的 `summary`。
           *
           * ⚠️ 从框往上找它那个 `<label>`，**不按顺序取**：这一栏按包分组，顺序
           *    由 `$tools` 决定，按位置取迟早会读到别的动作的说明。
           */
          const ntBoxParts = (ntValue) => {
            const ntBox = ntBoxes().find((b) => b.value === ntValue)
            if (!ntBox) return null
            const ntLabel = ntBox.closest('label') ?? ntBox.parentElement
            return {
              code: text(ntLabel ? ntLabel.querySelector('code') : null),
              summary: text(ntLabel ? ntLabel.querySelector('.action-summary') : null),
              checked: ntBox.checked,
            }
          }
          /**
           * 只读那一档的 chip（契约值 + `.chip-sub`）。
           *
           * ★ 这一份**不是**给可勾那一档用的：③ 可勾时契约值画在勾选框旁边，
           *   而"旧 daemon 兑现不了覆盖"那一档才退回 chip——那两个形状各量各的。
           */
          // 胶囊在**细节那一条**里（不是卡片里，见 `ntActionsText` 那段）。
          const ntChips = () =>
            [...(ntActionsDetail()?.querySelectorAll('.chip') ?? [])].map((c) =>
              text(c.querySelector('code')),
            )
          /** 切某一个框的勾选（`change` 事件用的是界面自己那个 `onchange`）。 */
          const ntSetBox = (ntValue, ntOn) => {
            const ntBox = ntBoxes().find((b) => b.value === ntValue)
            if (!ntBox) return false
            ntBox.checked = ntOn
            ntBox.dispatchEvent(new Event('change', { bubbles: true }))
            return true
          }
          /**
           * 去某一页点一次它自己的「刷新」按钮。
           *
           * ★ 为什么非要走界面：`$tools` / `$identity` 是**界面手里的那一份**，
           *   光靠接口改不了它（这也是 D41 那一段的教训）。下面两档要的正是
           *   "界面手里的那一份变了"之后 ③ 怎么画。
           */
          const ntRefreshView = async (ntHash, ntTitleSelector, ntTitle, ntRoot) => {
            f.contentWindow.location.hash = ntHash
            const ntHere = await until(
              () => text(d().querySelector(ntTitleSelector)) === ntTitle,
              60,
            )
            if (!ntHere) return false
            await wait(200)
            const ntBtn = [...d().querySelectorAll(`${ntRoot} button`)].find(
              (b) => text(b) === '刷新',
            )
            if (!ntBtn) return false
            click(ntBtn)
            return true
          }

          /**
           * 点「创建并派发」，然后把那条**新** run 从接口上读回来。
           *
           * ⚠️ 等的不是 toast：它有一个 4 秒的定时器，在虚拟时间下几乎立刻消失，
           *    拿它当"提交成功了"的信号会偶发地看早。等的是 hash 变成 `#/tasks`
           *    ——`submit()` 里那两次 POST 都是 await 过的，`go('tasks')` 在它们
           *    之后才跑，所以"落到任务页并且列表里有行"就等于"请求体真的发出去了"。
           *
           * ⚠️ 判"哪条是新的"用的是**提交之前那份 runId 名单**，不是"列表里的第一条"：
           *    这一页提交两次，靠位置找必然读到上一次那条。
           */
          const ntSubmit = async (ntTitle) => {
            const ntBefore = (await ntRuns()).map((r) => r.runId)
            const ntInput = ntTitleInput()
            if (!ntInput) return { reached: false, run: null }
            ntInput.value = ntTitle
            ntInput.dispatchEvent(new Event('input', { bubbles: true }))
            // 标题还没写进去时提交按钮是 disabled 的：先等它可点，再点
            const ntClickable = await until(() => {
              const ntBtn = ntSubmitButton()
              return !!ntBtn && !ntBtn.disabled
            }, 40)
            const ntBtn = ntSubmitButton()
            if (!ntClickable || !ntBtn) return { reached: false, run: null }
            click(ntBtn)
            const ntArrived = await until(
              () => f.contentWindow.location.hash === '#/tasks',
              60,
            )
            // 任务视图的模式存在 localStorage 里：万一停在看板，先切回列表
            // （不切的话 `.task-row` 一条都抓不到，而症状看起来像"任务没建出来"）
            if (ntArrived && d().querySelectorAll('.list-pane .task-row').length === 0) {
              const ntToList = [...d().querySelectorAll('button')].find(
                (b) => text(b) === '列表',
              )
              if (ntToList) {
                click(ntToList)
                await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
              }
            }
            const ntReached =
              f.contentWindow.location.hash === '#/tasks' &&
              d().querySelectorAll('.list-pane .task-row').length > 0
            let ntRun = null
            for (let i = 0; i < 40 && !ntRun; i++) {
              const ntAll = await ntRuns()
              ntRun = ntAll.find((r) => !ntBefore.includes(r.runId)) ?? null
              if (!ntRun) await wait(120)
            }
            return { reached: ntReached, run: ntRun }
          }

          // ── ① 选夹具执行者；三步的标题 ──
          facts['newtask.pageReady'] = await ntEnter()
          if (!facts['newtask.pageReady']) {
            errors.push(
              '新建任务页没能把 ① 选成夹具执行者（②③ 在 `{#if chosen}` 里，下面那一组会空过）',
            )
          }
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // ★ 版面：三步排成一行 + 首屏看得见三个问题 + 提交栏那行摘要
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 这一组守的是**这一页的形状**：它要回答的就是"谁做 / 谁审 / 能做什么"
          //   三个问题，而原来 ①② 一行、③ 掉到第二行，实测首屏（448px）只看得见
          //   「要做什么」和 ① 的开头——三个问题一个都没看全，同时屏幕里还有 204px
          //   是空的（① 高 332、② 只有 128）。
          const ntRectOf = (el) => {
            if (!el) return null
            const r = el.getBoundingClientRect()
            return {
              top: Math.round(r.top),
              left: Math.round(r.left),
              w: Math.round(r.width),
              // ★ 高度是"两列是否齐平"那条判据要用的
              h: Math.round(r.height),
            }
          }
          /**
           * ★★「要做什么」那一块的位置。
           *
           * ★ 为什么要单独量：它曾经被网格**挪到三步下面**——`.step-exec` 写了显式
           *   `grid-row: 1 / span 2`，而它只定了列、行交给自动排布，CSS Grid 先把
           *   "行列都确定"的放好，于是它被挤到第 3 行。它在 DOM 里仍是最前面一个，
           *   看代码完全看不出问题——**只有量位置才发现**。
           */
          facts['newtask.layoutLead'] = (() => {
            const ntLead = ntRectOf(d().querySelector('.form-lead'))
            const ntTa = ntRectOf(ntTitleInput())
            const ntFirst = ntRectOf(d().querySelector('.step-exec'))
            return ntLead && ntFirst ? { lead: ntLead, textarea: ntTa, firstStep: ntFirst } : null
          })()

          facts['newtask.layoutSteps'] = {
            exec: ntRectOf(d().querySelector('.step-exec')),
            review: ntRectOf(d().querySelector('.step-review')),
            actions: ntRectOf(d().querySelector('.step-actions')),
            detail: ntRectOf(d().querySelector('.actions-detail')),
          }
          facts['newtask.layoutFirstScreen'] = (() => {
            const ntSc = d().querySelector('.main')
            if (!ntSc) return null
            const ntBottom = ntSc.getBoundingClientRect().bottom
            return [...d().querySelectorAll('.chain-step')].map((el) => {
              const ntTitle = el.querySelector('.step-title')
              // 这一栏的**主控件**（按钮 / 下拉）在不在首屏里
              const ntCtl = el.querySelector('button, select')
              return {
                title: text(ntTitle),
                titleVisible: ntTitle ? ntTitle.getBoundingClientRect().bottom <= ntBottom : null,
                controlVisible: ntCtl ? ntCtl.getBoundingClientRect().bottom <= ntBottom : null,
              }
            })
          })()
          /**
           * ★★「要做什么」那个框：默认 3 行、随输入长高、**15 行封顶**、占满宽度。
           *
           * ★ 判据是**量出来的高度**，不是"它有个 `rows` 属性"：`rows=3` 只是个
           *   初值，一个写死的 `rows` 与"真的会跟着长"在属性上看不出区别——而
           *   使用者要的正是后者（写第四行时不该在一个三行的小窗里滚动）。
           *
           * ⚠️ 量完**必须还原**（把值写回空并触发一次 input）：这一条会改页面上的
           *    输入框，而后面所有端到端提交都靠它。
           */
          facts['newtask.titleAutoGrow'] = await (async () => {
            const ntTa = ntTitleInput()
            if (!ntTa) return null
            const ntBack = ntTa.value
            const ntH = () => Math.round(ntTa.getBoundingClientRect().height)
            const ntSet = async (ntN) => {
              ntTa.value = Array.from({ length: ntN }, (_, i) => `第 ${i + 1} 行`).join('\n')
              ntTa.dispatchEvent(new Event('input', { bubbles: true }))
              await wait(140)
              return ntH()
            }
            const ntOut = {
              rows: ntTa.rows,
              width: Math.round(ntTa.getBoundingClientRect().width),
              formWidth: Math.round(
                d().querySelector('.newtask-form')?.getBoundingClientRect().width ?? 0,
              ),
              resize: getComputedStyle(ntTa).resize,
            }
            ntOut.h1 = await ntSet(1)
            ntOut.h3 = await ntSet(3)
            ntOut.h6 = await ntSet(6)
            ntOut.h15 = await ntSet(15)
            ntOut.h30 = await ntSet(30)
            ntOut.overflowAt30 = getComputedStyle(ntTa).overflowY
            ntTa.value = ntBack
            ntTa.dispatchEvent(new Event('input', { bubbles: true }))
            await wait(160)
            ntOut.hAfterClear = ntH()
            return ntOut
          })()

          // 宽度单独一条 fact（判据不同、失败时也各自看得见是哪一条）
          facts['newtask.titleFullWidth'] = (() => {
            const ntTa = ntTitleInput()
            const ntForm = d().querySelector('.newtask-form')
            if (!ntTa || !ntForm) return null
            return {
              width: Math.round(ntTa.getBoundingClientRect().width),
              formWidth: Math.round(ntForm.getBoundingClientRect().width),
            }
          })()

          facts['newtask.footSummaryText'] = text(d().querySelector('.foot-summary'))
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // ★★ 提交栏**吸底**：滚到这一页最底下时它还在视口里
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 判据必须是"**滚动之后**它还在"，不是"它有个 sticky 声明"：这一页
          //   实测 914px 而首屏只有 448px，提交按钮原来在 y=891——这一页唯一要做
          //   的那件事要滚两屏才够得着。CSS 写了但没生效（父级 overflow 不对、
          //   或者被后面的元素盖住）是最常见的一种"看着改了其实没改"。
          //
          // ★ 顺带量宽度：它要**横贯整块可滚区**（`.main` 自己有左右留白，不留
          //   负边距的话它会缩在那圈留白里，滚过去的内容从两侧露出来）。
          //
          // ⚠️ 必须在这一页**真的在屏幕上**时量。放到 E1 之后就会踩在"任务清单"
          //    那一页上（提交成功会跳过去），那时 `.form-foot` 根本不存在——症状是
          //    这两条永远"没量到值"，看着像选择器写错了。
          {
            const ntFoot = d().querySelector('.form-foot')
            // ⚠️ 可滚区**不再写死成 `.main`**（D58 第二步之后表单住在右栏里，
            //    而 `.main` 在 `:has(> .split-layout)` 那条规则下是 `overflow: hidden`）。
            //    改成"从提交栏往上找第一个能滚的祖先"：这样它量的是**事实**，
            //    以后再换容器也不会因为选择器过期而静默失效。
            const ntSc = (() => {
              let el = ntFoot?.parentElement ?? null
              while (el) {
                const o = cs(el).overflowY
                if (o === 'auto' || o === 'scroll') return el
                el = el.parentElement
              }
              return null
            })()
            if (ntSc && ntFoot) {
              const ntBack = ntSc.scrollTop
              ntSc.scrollTop = ntSc.scrollHeight
              await wait(350)
              const ntFr = ntFoot.getBoundingClientRect()
              const ntSr = ntSc.getBoundingClientRect()
              // ⚠️ 比的是 `clientWidth`，不是 `getBoundingClientRect().width`：
              //    后者**把滚动条那一条也算进去**（实测差 10px），于是"横贯整块
              //    可滚区"这条断言会在有滚动条时永远差一点点——一个纯属测量口径的
              //    假红，会让人去改本来正确的 CSS。
              const ntSpan = {
                spansPane: Math.abs(ntFr.width - ntSc.clientWidth) <= 2,
                footW: Math.round(ntFr.width),
                paneW: ntSc.clientWidth,
              }
              facts['newtask.footStickyAtBottom'] = {
                visible: ntFr.top >= ntSr.top - 1 && ntFr.bottom <= ntSr.bottom + 1,
                ...ntSpan,
              }
              // 宽度单独一条（两条断言各自能红，不必从上面那条里挑字段看）
              facts['newtask.footSpansPane'] = ntSpan
              ntSc.scrollTop = ntBack
              await wait(250)
            }
          }

          //
          // ⚠️ 这两条守的是一次**合并**（两个字段 → 一个多行框）。判据要具体到
          //    "控件类型"与"另一个字段真的不在了"：只看"页面里有没有那个词"的话，
          //    把「补充说明」换成一句提示文字也会绿。
          facts['newtask.titleField'] = (() => {
            const ntLead = d().querySelector('.form-lead')
            if (!ntLead) return null
            const ntCtl = [...ntLead.querySelectorAll('input, textarea')]
            return {
              count: ntCtl.length,
              tag: ntCtl[0]?.tagName ?? null,
              // 多行的判据是**控件类型**，不是"rows 写了没有"（`rows` 只是个初值，
              // 而 `input` 永远不换行）
              multiline: ntCtl[0]?.tagName === 'TEXTAREA',
              required: ntCtl[0]?.required ?? null,
            }
          })()
          facts['newtask.hasDescriptionField'] = (text(d().querySelector('.form-lead')) ?? '').includes(
            '补充说明',
          )

          facts['newtask.stepTitles'] = [
            ...d().querySelectorAll('.chain-step .step-title'),
          ].map((el) => text(el))
          facts['newtask.executorSelectApplied'] = need('① 的取值', () =>
            ntExecutorSelect() ? ntExecutorSelect().value : null,
          )

          // ── ② 的三档与默认值（默认必须是「跟随」）──
          facts['newtask.reviewerOptionValues'] = need('② 的取值们', () =>
            ntReviewerSelect() ? [...ntReviewerSelect().options].map((o) => o.value) : null,
          )
          facts['newtask.reviewerDefaultPick'] = need('② 的默认取值', () =>
            ntReviewerSelect() ? ntReviewerSelect().value : null,
          )
          // ★ 「跟随」那一项的文字：它必须自己说清**跟到谁**（那是这一档唯一的含义）。
          facts['newtask.followOptionText'] = need('「跟随」那一项的文字', () => {
            const ntOpt = [...(ntReviewerSelect()?.options ?? [])].find(
              (o) => o.value === 'follow',
            )
            return ntOpt ? text(ntOpt) : null
          })

          // ── ③ 可勾那一档：勾选框、默认勾着什么、旁边写什么 ──
          //
          // ★ 这一页的 ③ 原来只读，现在**可勾**——而"改了什么、这一次生效"这件事
          //   只有走完真入口再从接口读回来才算数（下面那两条端到端）。
          //   这里先量"形状"，判据全部从**接口**取，不去猜：
          //     · 已装工具包声明的动作 ⇒ 框该有的条数（这一栏照**已装工具**画，
          //       不是只画那个审核者已有的那几条：只画已有的就只能减不能加，而
          //       "这一次允许一个它长期没有的动作"正是这份覆盖的意义）；
          //     · 夹具那个审核者当前生效的动作 ⇒ **默认该勾着**的那几条；
          //     · 工具清单里那句 `summary` ⇒ 框旁边必须逐字显示它。
          //   ⚠️ 三个都读不到时下面那几条会拿到 null —— 那是"探针没量到"，
          //      与"界面画错了"必须分得开，所以每一条都自带一条 guard 检查。
          const ntTools = await f.contentWindow
            .fetch('/api/tools')
            .then((r) => r.json())
            .then((p) => p.tools ?? null)
            .catch(() => null)
          const ntAgentsNow = await f.contentWindow
            .fetch('/api/agents')
            .then((r) => r.json())
            .then((p) => p.agents ?? null)
            .catch(() => null)
          facts['newtask.fixtureSourcesRead'] =
            Array.isArray(ntTools) && Array.isArray(ntAgentsNow)
          /** 已装工具包声明的全部动作（契约值）——框该有的就是这一份。 */
          facts['newtask.installedActions'] = (ntTools ?? [])
            .flatMap((t) =>
              (t.manifest?.actions ?? []).map((a) => `${t.slug}.${a.name}`),
            )
            .sort()
          facts['newtask.installedActionTotal'] = (facts['newtask.installedActions'] ?? []).length
          /** 夹具那个审核者当前生效的动作（默认该勾着的那一份）。 */
          facts['newtask.fixtureReviewerActions'] = need('夹具审核者的动作权限', () =>
            ntAgentsNow
              ? [
                  ...((ntAgentsNow.find((a) => a.id === ntReviewerId)?.allowedActions ?? [])),
                ].sort()
              : null,
          )
          /** 那个动作在工具清单里的 `summary`（框旁边必须**逐字**是它）。 */
          facts['newtask.fixtureActionSummary'] = need('那个动作的 summary', () => {
            const ntDot = ntAction.indexOf('.')
            const ntSlug = ntAction.slice(0, ntDot)
            const ntName = ntAction.slice(ntDot + 1)
            const ntTool = (ntTools ?? []).find((t) => t.slug === ntSlug)
            const ntAct = (ntTool?.manifest?.actions ?? []).find((a) => a.name === ntName)
            return ntAct ? ntAct.summary : null
          })

          facts['newtask.actionsSectionFound'] = ntActions() !== null

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // ★ ③ 收成了一行：选择器搬进对话框（这次改动在界面上的全部内容）
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          //
          // 先量"收起来了"这件事，**再**打开对话框量里面——顺序反了的话下面那些
          // 关于"页面上没有选择器"的断言会踩在打开状态上（而它们本该在关闭状态量）。
          facts['newtask.actionsSectionHeight'] = ntActions()
            ? Math.round(ntActions().getBoundingClientRect().height)
            : null
          /**
           * ③ 那一段**由什么撑起来的**（逐块高度）。
           *
           * ★ 这是给高度那条断言配的"读数"：它红了的时候，输出里直接写着是哪一块
           *   变高了（说明句？胶囊？还是一整块选择器又铺回来了）——不然只能看到
           *   "722px" 这个数字，然后回去猜。
           */
          facts['newtask.actionsSectionParts'] = ntActions()
            ? [...ntActions().children].map((el) => ({
                cls: el.className,
                h: Math.round(el.getBoundingClientRect().height),
                text: (text(el) ?? '').slice(0, 30),
              }))
            : null
          facts['newtask.actionsPickerNotInline'] = !ntActions()?.querySelector('.action-perms')
          facts['newtask.actionsDialogClosedInitially'] = !d().querySelector('.modal')
          facts['newtask.actionsChooseButtonText'] = need('③ 那颗按钮的字', () => {
            const ntBtn = [...(ntActions()?.querySelectorAll('button') ?? [])][0]
            return ntBtn ? text(ntBtn) : null
          })
          facts['newtask.actionsCountText'] = need('③ 的计数', () =>
            text(ntActions()?.querySelector('.actions-count')),
          )
          /**
           * ★★ ③ 上**当前的配置细节**：一个计数不算配置。
           *
           * 「已允许 1 / 5」只说了几个，没说"是哪几个、各自干什么、钉了什么值"。
           * 选择器进对话框之后，这一行是**不点开就唯一能看见配置的地方**——所以
           * 它必须真的把配置画出来（契约值 + 说明 + 固定值），而不是只报个数。
           */
          const ntConfigChips = () => [
            ...(ntActionsDetail()?.querySelectorAll('.chip') ?? []),
          ]
          facts['newtask.actionsConfigChips'] = ntConfigChips().map((c) => ({
            type: text(c.querySelector('code')),
            summary: text(c.querySelector('.chip-sub:not(.fixed):not(.bad)')),
            fixed: text(c.querySelector('.chip-sub.fixed')),
          }))
          /**
           * ★★ 配置细节**在 ③ 那张卡片里面**（不是页面另一处的一条）。
           *
           * ★ 这是使用者提出来的一条：挪出去之后那一块读起来是"另一件事"——
           *   页面上多出一片没有归属的胶囊，而使用者问"这些是什么"时，答案在 ③ 里。
           *   窄了就该让它窄着折行，**位置对**比**一行放得下**重要。
           */
          /**
           * ★★ ③ 变高之后 ① 是否**跟着长**（两列仍然齐平）。
           *
           * ★ 这条和上面 `layoutSteps` 里那个"齐平"是两回事：那一条在**进页面时**
           *   量，夹具里 ① 的自然高度恰好等于右列，所以它**怎么都是齐的**——测不出
           *   "拉伸有没有生效"。这一条在 ③ 里多了一枚胶囊（③ 变高）之后重量，
           *   这时右列比 ① 的自然高度高，只有 `align-self: stretch` 真的生效才齐。
           *
           * ⚠️ 三个数必须在**同一时刻**取：我第一版把"勾之前量的 ①"和"勾之后量的
           *    ③"放在一起比，得出过假的"不齐平"。
           */
          facts['newtask.layoutFlushAfterConfig'] = (() => {
            const ntExec = ntRectOf(d().querySelector('.step-exec'))
            const ntAct = ntRectOf(d().querySelector('.step-actions'))
            if (!ntExec || !ntAct) return null
            return {
              execBottom: ntExec.top + ntExec.h,
              actionsBottom: ntAct.top + ntAct.h,
              execH: ntExec.h,
              actionsH: ntAct.h,
              alignSelf: getComputedStyle(d().querySelector('.step-exec')).alignSelf,
            }
          })()

          facts['newtask.chipRadius'] = (() => {
            const ntChip = ntActionsDetail()?.querySelector('.chip')
            if (!ntChip) return null
            return {
              radius: getComputedStyle(ntChip).borderTopLeftRadius,
              height: Math.round(ntChip.getBoundingClientRect().height),
            }
          })()

          facts['newtask.actionsConfigOnePerLine'] = (() => {
            const ntDetail = ntActionsDetail()
            if (!ntDetail) return null
            const ntChips = [...ntDetail.querySelectorAll('.chip')]
            return {
              count: ntChips.length,
              tops: ntChips.map((c) => Math.round(c.getBoundingClientRect().top)),
              heights: ntChips.map((c) => Math.round(c.getBoundingClientRect().height)),
              widths: ntChips.map((c) => Math.round(c.getBoundingClientRect().width)),
            }
          })()

          facts['newtask.actionsConfigInCard'] = (() => {
            const ntCard = ntActions()
            const ntDetail = ntActionsDetail()
            if (!ntCard || !ntDetail) return null
            const ntChipsAll = d().querySelectorAll('.chip')
            const ntChipsHere = ntCard.querySelectorAll('.chip')
            return {
              detailInsideCard: ntCard.contains(ntDetail),
              chipsInCard: ntChipsHere.length,
              chipsOutside: ntChipsAll.length - ntChipsHere.length,
              // 一枚一行：一列宽里横排会折成"契约值半行、说明挤到下一行"的乱条
              chipTops: [...ntDetail.querySelectorAll('.chip')].map((c) =>
                Math.round(c.getBoundingClientRect().top),
              ),
              chipWidths: [...ntDetail.querySelectorAll('.chip')].map((c) =>
                Math.round(c.getBoundingClientRect().width),
              ),
            }
          })()

          /**
           * ★★ 每个动作的**参数**：钉死的（`name=value`）、由模型填的、平台注入的。
           *
           * ★ 使用者要的是"看得见配置"：一个动作名 + 一句说明还不够——同一句
           *   "模拟关闭单据"，钉了 `reason=巡检` 与没钉是两回事。而**钉死的值必须
           *   与契约值同一行**（第一行）：压在说明下面时，那是最容易漏看的一行。
           */
          facts['newtask.actionsConfigParamLines'] = ntConfigChips().map((c) => ({
            type: text(c.querySelector('code')),
            head: text(c.querySelector('.chip-head')),
            subs: [...c.querySelectorAll('.chip-sub')].map((x) => text(x)),
            /**
             * ⚠️ 胶囊里**只该有**这些：契约值 + 钉死的固定值（同一行）+ `summary`
             *    （或"当前不可用"）。曾经多出过"由模型填 / 平台注入"两行机器名——
             *    使用者没法据它们做任何决定，纯噪音。
             */
            subCount: c.querySelectorAll('.chip-sub').length,
          }))

          // ★ 固定值必须在页面上看得见：夹具那个审核者钉了 `text=长期钉的`，
          //   所以那一枚胶囊上一定带「已固定: text=长期钉的」。看不见的话，使用者
          //   以为这次会带着他上次钉的值去执行，而实际发出去的是另一个。
          facts['newtask.actionsConfigFixedText'] = ntConfigChips()
            .map((c) => text(c.querySelector('.chip-sub.fixed')))
            .filter(Boolean)
            .join(' | ')

          // 打开它：从这一行往下，③ 的勾选框都在这个浮层里
          facts['newtask.actionsDialogOpens'] = await ntOpenActions()
          // ⚠️ 这里**不**用 `ntPicker()`：它定义在下面（`const` 在 TDZ 里，调用
          //    它会抛 ReferenceError，而症状是整个探针"什么都没量到"——一片 `—`，
          //    看不出是哪一条坏的）。直接写选择器，不引入顺序耦合。
          facts['newtask.actionsDialogHasPicker'] = !!d().querySelector('.modal .action-perms')
          // ★★ 页面上的胶囊 == 对话框里勾着的框（同一个事实的两种画法）。
          //    两处各算一遍就会分叉，而分叉的表现是"页面上写着允许 A、点开对话框
          //    里勾的是 B"——那种不一致没有任何报错，使用者只能靠运气发现。
          facts['newtask.actionsConfigMatchesPicks'] = (() => {
            const ntChips = ntConfigChips()
              .map((c) => text(c.querySelector('code')))
              .filter(Boolean)
              .sort()
            const ntPicks = ntBoxes()
              .filter((b) => b.checked)
              .map((b) => b.value)
              .sort()
            return { chips: ntChips, picks: ntPicks }
          })()
          facts['newtask.actionsDialogBox'] = need('对话框的盒子', () => {
            const ntModal = d().querySelector('.modal')
            if (!ntModal) return null
            const ntBox = ntModal.getBoundingClientRect()
            return {
              h: Math.round(ntBox.height),
              top: Math.round(ntBox.top),
              // ★ 浮层要**一屏放得下**：装不下就会出现"对话框自己套一层滚动条"，
              //   而两栏挑选器在里面滚是最难受的一种（左栏滚走了右栏还在）。
              fits: ntBox.height <= f.contentWindow.innerHeight && ntBox.top >= 0,
            }
          })
          // ★ 按钮旁的计数与选择器状态条**必须同分母**：两处各算一遍就会在"装了
          //   什么包"变化时分叉，而症状是同一屏上两个不同的总数（实测踩过：
          //   "已允许 2 / 1 个动作"）。
          facts['newtask.actionsCountMatchesPicker'] = (() => {
            const ntCount = text(ntActions()?.querySelector('.actions-count'))
            const ntStatus = text(d().querySelector('.modal .ap-status'))
            if (!ntCount || !ntStatus) return null
            const ntA = /(\d+)\s*\/\s*(\d+)/.exec(ntCount)
            const ntB = /(\d+)\/(\d+)/.exec(ntStatus)
            if (!ntA || !ntB) return null
            return { button: [ntA[1], ntA[2]], picker: [ntB[1], ntB[2]] }
          })()

          // ⚠️ 这里原来的 `actionChips` / `actionChipSummary` 是**只读那一档**的
          //    判据（`.chip code` + `.chip-sub`）。③ 可勾之后这一档的契约值画在
          //    **勾选框旁边**，所以那两条搬到"旧 daemon 兑现不了覆盖"那一档去量
          //    ——那一档才是 chip 的形状（§ 档四）。
          facts['newtask.actionBoxValues'] = ntBoxes().map((b) => b.value).sort()
          facts['newtask.actionBoxCount'] = ntBoxes().length
          facts['newtask.actionCheckedValues'] = ntCheckedValues().sort()
          facts['newtask.actionCheckedCount'] = ntCheckedValues().length
          facts['newtask.actionFixtureBox'] = need('夹具那个动作的勾选框', () =>
            ntBoxParts(ntAction),
          )
          facts['newtask.actionsMentionsReviewer'] = ntActionsText()
          // 档三要用的**前提**：这一刻界面手里的清单是非空的（框就是证据）
          facts['newtask.toolsUnknownBoxesBefore'] = ntBoxes().length

          // ── ★ 「只对这一次任务生效」那句：**改过之后才该出现** ──
          //
          // ⚠️ 这一条不能只测"字在页面上"：默认状态（一下都没碰过）就**不该**有它
          //    ——有它等于对使用者说"你改了它的长期权限"，而那是句假话（长期那一份
          //    还好好的，这一页只是准备了一次覆盖）。反过来，动一下（取消一个勾）
          //    就必须出现：少了它，这一次的收紧会被当成改了那个审核者的长期权限。
          facts['newtask.actionsOnceOnlyWhenDefault'] = (ntActionsText() ?? '').includes(
            '只对这一次任务生效',
          )
          // ★ 动一下：把夹具那个动作的勾**取消**（夹具里那个审核者只有这一条）
          facts['newtask.untickDispatched'] = ntSetBox(ntAction, false)
          facts['newtask.actionsOnceOnlyAfterUntick'] = await until(
            () => (ntActionsText() ?? '').includes('只对这一次任务生效'),
            30,
          )
          facts['newtask.clearedCheckedValues'] = ntCheckedValues()
          facts['newtask.actionsClearedHint'] = ntActionsText()
          // ★ 再勾回来 ⇒ 勾选结果又与审核者当前那份**一致**了 ⇒ 那句必须消失。
          //   判据是"改没改"（集合相等），不是"碰没碰过"：写成"碰过就一直显示"
          //   的实现会把"其实没改"报成改了，从而**多带一份覆盖**出去。
          facts['newtask.retickDispatched'] = ntSetBox(ntAction, true)
          // 等这一次重渲染**落地**再读：判据用"取消那一档那句话没了"——
          // 它一定会变，所以它不是"还在等"而是"已经过去了"的证据。
          facts['newtask.retickSettled'] = await until(
            () => !(ntActionsText() ?? '').includes('这一次一个动作都不勾'),
            30,
          )
          facts['newtask.actionsOnceOnlyAfterRetick'] = (ntActionsText() ?? '').includes(
            '只对这一次任务生效',
          )

          // ── ★ ③ 的固定参数（D43 / D44）：默认值 = 审核者长期那份；改过才说"只对这一次" ──
          //
          // 固定参数与白名单是同一件事的两半：白名单回答"这一次能不能触发"，固定
          // 参数回答"触发时用什么参数"。所以这一组量的东西与上面白名单那一组
          // **一一对应**：
          //   · D44 之后编辑器长在「左选右配」的**右栏**（`ActionPicker`），只对
          //     **允许的**动作出现；夹具里 `clean-notes` 允许且有 open 参数，
          //     而默认就选中它 ⇒ 右栏一进来就该有编辑器；
          //   · 编辑器默认值 = 审核者长期那份（夹具里钉了 `text=长期钉的`）——
          //     不是空白："跟随"被画成"这次没设"就会诱导人把长期配置冻成覆盖；
          //   · 改过一个值 ⇒ "固定参数改了"那句（与白名单"只对这一次任务生效"
          //     同一条口径）必须出现；改回来 ⇒ 必须消失（没改却带一次覆盖出去，
          //     等于把长期配置冻成一次性决定）。
          const ntPicker = () => d().querySelector('.modal .action-perms') ?? null
          const ntPickRow = (v) =>
            [...(ntPicker()?.querySelectorAll('.ap-row') ?? [])].find(
              (r) => r.getAttribute('data-type') === v,
            ) ?? null
          const ntPickSelRow = () => ntPicker()?.querySelector('.ap-row.sel') ?? null
          const ntParamEditor = () => ntPicker()?.querySelector('.ap-detail .param-editor') ?? null
          const ntParamTextInput = (el) =>
            el?.querySelector('.param-editor input[type=text]') ?? null
          /** 选中某个动作并等它的配置面板（含编辑器）出现在右栏。 */
          const ntEnsureAction = async (v) => {
            const row = ntPickRow(v)
            if (!row) return false
            if (!row.classList.contains('sel')) click(row)
            return until(() => {
              const selRow = ntPickSelRow()
              return !!selRow && selRow.getAttribute('data-type') === v && !!ntParamEditor()
            }, 40)
          }
          // 先确保选中夹具那个动作（默认选中规则也应选中它，点一下更稳）
          await ntEnsureAction(ntAction)
          facts['newtask.paramEditorForFixture'] = need('③ 上夹具动作的配置面板', () => {
            const picker = ntPicker()
            if (!picker) return null
            const selRow = ntPickSelRow()
            const editor = ntParamEditor()
            if (!selRow || !editor) return null
            return {
              selected: selRow.getAttribute('data-type'),
              hasEditor: true,
              // 面板里那句"绑定参数（平台注入 · 只读）"
              hasBoundNote: (text(picker.querySelector('.ap-detail')) ?? '').includes('平台注入'),
            }
          })
          facts['newtask.paramEditorDefault'] = need('固定参数编辑器的默认值', () => {
            const input = ntParamTextInput(ntParamEditor())
            return input ? input.value : null
          })
          // ★ 界面反馈修的点：字符串参数必须有**显式**的「不固定（模型填）/ 固定」
          //   开关——不能只靠输入框 placeholder 暗示，否则使用者看到的就只有
          //   "不固定（模型填）"，看不出哪里能设固定值。
          facts['newtask.paramFixedPairSwitch'] = need('字符串参数的固定/不固定开关', () => {
            const sel = ntParamEditor()?.querySelector('.param-fixed-pair select')
            if (!sel) return null
            return {
              options: [...sel.querySelectorAll('option')].map((o) => text(o)),
              mode: sel.value,
            }
          })
          // ★ 界面反馈第二轮：输入框**常驻**——"直接写值 = 固定"（开关自动跟着变），
          //   而不是先选「固定」才冒出输入框（那会让使用者问"平台会传入什么"）。
          //   先把开关切到「不固定」：输入框**还在**（空的），开关 = open，且这次
          //   切换真的改了参数（"固定参数改了"出现）——不是只动了开关没动值。
          {
            const sel0 = ntParamEditor()?.querySelector('.param-fixed-pair select')
            if (sel0) {
              sel0.value = 'open'
              sel0.dispatchEvent(new Event('change', { bubbles: true }))
            }
            let snap = null
            const ok = await until(() => {
              const el = ntParamEditor()
              const sel = el?.querySelector('.param-fixed-pair select')
              const input = ntParamTextInput(el)
              const dirty = (ntDialogText() ?? '').includes('固定参数改了')
              const hit = !!sel && !!input && sel.value === 'open' && input.value === '' && dirty
              if (hit) snap = { mode: sel.value, inputVisible: true, inputValue: input.value, dirty: true }
              return hit
            }, 30)
            facts['newtask.paramFixedInputAlwaysVisible'] = ok ? snap : null
          }
          // 再切回「固定」但**不填值**：必须出现"还没填值"的提示——不许静默当没设。
          {
            const appErrors = []
            const onAppErr = (e) => appErrors.push(String(e.message ?? e))
            f.contentWindow.addEventListener('error', onAppErr)
            const sel0 = ntParamEditor()?.querySelector('.param-fixed-pair select')
            if (sel0) {
              sel0.selectedIndex = 1
              sel0.dispatchEvent(new Event('input', { bubbles: true }))
              sel0.dispatchEvent(new Event('change', { bubbles: true }))
              await Promise.resolve()
              sel0.dispatchEvent(new Event('change', { bubbles: true }))
              await Promise.resolve()
            }
            let snap = null
            const ok = await until(() => {
              const el = ntParamEditor()
              const sel = el?.querySelector('.param-fixed-pair select')
              const hasHint = (text(el) ?? '').includes('还没填值')
              const hit = !!sel && sel.value === 'fixed' && hasHint
              if (hit) snap = { hintShown: true, mode: sel.value }
              return hit
            }, 30)
            if (!ok && snap === null) {
              const el = ntParamEditor()
              const inp = ntParamTextInput(el)
              snap = {
                hintShown: false,
                mode: el?.querySelector('.param-fixed-pair select')?.value ?? null,
                hasInput: !!inp,
                inputValue: inp?.value ?? null,
                dirty: (ntDialogText() ?? '').includes('固定参数改了'),
                textPreview: (text(el) ?? '').slice(0, 160),
                appErrors: appErrors.slice(0, 3),
              }
            }
            f.contentWindow.removeEventListener('error', onAppErr)
            facts['newtask.paramFixedPendingHint'] = snap
          }
          // 填上值 ⇒ 提示消失、开关停在「固定」、输入框里就是那个值
          // （"平台会传入什么" = 你填的这个）。然后恢复"长期钉的"，让后面
          // 那档"脏提示"从干净状态继续。
          {
            const input = ntParamTextInput(ntParamEditor())
            if (input) {
              input.value = '临时钉一下'
              input.dispatchEvent(new Event('input', { bubbles: true }))
            }
            let snap = null
            const ok = await until(() => {
              const el = ntParamEditor()
              const sel = el?.querySelector('.param-fixed-pair select')
              const input2 = ntParamTextInput(el)
              const hit =
                !!sel &&
                !!input2 &&
                sel.value === 'fixed' &&
                input2.value === '临时钉一下' &&
                !(text(el) ?? '').includes('还没填值')
              if (hit) snap = { pendingGone: true, mode: sel.value, inputValue: input2.value }
              return hit
            }, 30)
            facts['newtask.paramFixedPendingGone'] = ok ? snap : null
          }
          {
            const input = ntParamTextInput(ntParamEditor())
            if (input) {
              input.value = '长期钉的'
              input.dispatchEvent(new Event('input', { bubbles: true }))
            }
            await until(() => !(ntDialogText() ?? '').includes('固定参数改了'), 30)
          }
          // 改一个值（受控组件：value 由父组件持有，`input` 事件是它唯一的入口）
          const ntParamInput = ntParamTextInput(ntParamEditor())
          if (ntParamInput) {
            ntParamInput.value = '这一次钉的'
            ntParamInput.dispatchEvent(new Event('input', { bubbles: true }))
          }
          facts['newtask.paramDirtyShown'] = await until(
            () => (ntDialogText() ?? '').includes('固定参数改了'),
            30,
          )
          // 改回来 ⇒ 那句消失（"其实没改"不许带覆盖出去）
          const ntParamInput2 = ntParamTextInput(ntParamEditor())
          if (ntParamInput2) {
            ntParamInput2.value = '长期钉的'
            ntParamInput2.dispatchEvent(new Event('input', { bubbles: true }))
          }
          facts['newtask.paramDirtyGone'] = await until(
            () => !(ntDialogText() ?? '').includes('固定参数改了'),
            30,
          )
          // ★ 智能体详情**只读**那一档：契约值 chip 旁边带「已固定: text=长期钉的」
          //   （读一下再回新建任务页——后面那几档都从这一页继续）
          facts['newtask.agentDetailFixedChip'] = await (async () => {
            f.contentWindow.location.hash = '#/agents'
            // ⚠️ 不能用 `until`：它只回 boolean（"等到了"），拿不回那个元素。
            let row = null
            for (let i = 0; i < 60 && !row; i++) {
              row =
                [...d().querySelectorAll('.agent-row')].find((r) =>
                  (r.textContent ?? '').includes('探针用的三步链审核者'),
                ) ?? null
              if (!row) await wait(150)
            }
            if (!row) return null
            click(row.querySelector('.list-row-main'))
            const switched = await until(
              () => String(d().querySelector('#agent-name')?.value ?? '') === '探针用的三步链审核者',
              60,
            )
            if (!switched) return null
            await wait(200)
            const chip = [...d().querySelectorAll('.card.agent-card .chip-sub.fixed')]
              .map((c) => text(c))
              .join(' | ')
            // ⚠️ 这里原来写的是 `#/newtask`（**一个不存在的地址**）——它能"用"纯属
            //    借了当时"未知 hash 回落 `#/new`"那条规则（D58 之前），于是这一行
            //    连同下面那条等待**一直在静默失效**：`until` 的返回值被丢掉了，
            //    而 chip 是在**上一页**读的，所以这条检查照样绿。回落目标改成
            //    `#/tasks` 之后它才现形（这一批 8 条红就是这么来的）。
            //    地址写对，并且把"到没到"如实记进结果里——写错的地址不该测得过。
            f.contentWindow.location.hash = '#/new'
            // ⚠️ 合并之后这一栏的页名是**「任务」**（表单在右栏里，不是独立一页）。
            const ntBack = await until(
              () =>
                text(d().querySelector('.page-name')) === '任务' &&
                !!d().querySelector('.detail-pane .create-body .newtask-form'),
              60,
            )
            if (!ntBack) errors.push('从智能体页回「新建任务」没到位（地址写错或没回落）')
            await wait(200)
            return { chip, landed: ntBack }
          })()

          // ── ② 指名换一个审核者（那个**没有配动作**的）⇒ ③ 该改说后果 ──
          //
          // ★ 这一档与"不审"那一档**不同**：这里有一个审核者，所以"判决"是有的，
          //   它只是什么也不能触发。两句文案必须分开（`actionsNoneHint` vs
          //   `actionsNoReviewerHint`），而这一档只有"有标准、没动作"的审核者
          //   才量得到——夹具里专门有一个（`CHAIN_EMPTY_REVIEWER`）。
          facts['newtask.pickApplied'] = await ntSetReviewer(`pick:${ntEmptyReviewerId}`)
          await until(
            () => (ntActionsText() ?? '').includes('现在没有一个能用的动作'),
            30,
          )
          // "只对这一次生效"那句：它是 ② 那一段里的一条 `.hint`（下拉的
          // `textContent` 会带上所有选项，所以整段的文字里一定含选项名——
          // 这里要的正是"那一段里出现了这一句"，不按位置认）。
          facts['newtask.onceOnlyAfterPick'] = (text(ntStep('② 审核')) ?? '').includes(
            '只对这一次任务生效',
          )
          facts['newtask.emptyPermsActionsText'] = ntActionsText()
          facts['newtask.emptyPermsChips'] = ntChips()
          // ★ 可勾那一档的第二个形态：审核者**一个动作都没有** ⇒ 框照画（框是照
          //   已装工具画的），但**一个都不勾**。所以这里量的不是"没有框"，是
          //   "框在、全空"——两者的差别正是"这一栏还能不能加一个动作"。
          //
          // ⚠️ 上面那个 IIFE 去过一趟智能体页再回来（`location.hash` 换了两次），
          //    这一页是**重新挂载**的 ⇒ 对话框回到关着（`actionsOpen` 是组件状态）。
          //    不重新打开的话这里量到的是"0 个框"，而症状是"这一档一个框都不画"，
          //    看起来像功能坏了（实测就是这条先红）。
          await ntOpenActions()
          facts['newtask.emptyPermsBoxValues'] = ntBoxes().map((b) => b.value).sort()
          facts['newtask.emptyPermsCheckedValues'] = ntCheckedValues()

          // ── ② 切到「不自动审核（这一次）」⇒ ③ 改说"连判决都不会有" ──
          //
          // ★ 这一档**没有审核者**（`chain.reviewer === null`）。所以它说的不能是
          //   上面那一档那句"它的判决只会给出结论"——这一档连判决都不会有。
          facts['newtask.noneApplied'] = await ntSetReviewer('none')
          await until(() => (ntActionsText() ?? '').includes('这次没有审核者'), 30)
          facts['newtask.onceOnlyAfterNone'] = (text(ntStep('② 审核')) ?? '').includes(
            '只对这一次任务生效',
          )
          facts['newtask.noneActionsText'] = ntActionsText()
          facts['newtask.noneActionsControlCount'] = ntControlCount()

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // 档三：**工具清单没到** ⇒ 一个勾选框都不画
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 现场怎么造：`$tools` 是启动时取的一份，而"取失败"与"一个包都没装"
          //   在 store 里都表现为空数组（`toolsKnown` 的注释就是这件事）——区别是
          //   失败时 store **还留着上一次取到的那份清单**（`load()` 只在成功时
          //   `set`）。于是这正是最危险的那一刻：清单非空，而这一栏"说不准它有哪些
          //   动作"；写成"空了就说没有动作"的实现会在这时对使用者说一句关于**他
          //   自己的权限**的假话。
          //
          // ★ 造法是"让 `/api/tools` 真的失败" + 在「工具」页点**它自己的**刷新：
          //   走的是界面那条真路径（`loadTools()` → `loadError['tools']`），
          //   探针不许直接把 store 改成那个样子。
          const ntRealFetch = f.contentWindow.fetch
          /** 让 `/api/tools` 失败（其它请求原样放行）。 */
          const ntFailToolsFetch = () => {
            const ntReal = ntRealFetch
            f.contentWindow.fetch = function (input, init) {
              const ntUrl =
                typeof input === 'string' ? input : input && input.url ? input.url : ''
              if (String(ntUrl).includes('/api/tools')) {
                return Promise.reject(new TypeError('探针：这一次让 /api/tools 取失败'))
              }
              return ntReal.call(f.contentWindow, input, init)
            }
            return f.contentWindow.fetch !== ntRealFetch
          }
          facts['newtask.toolsUnknownPatched'] = ntFailToolsFetch()
          facts['newtask.toolsUnknownRefreshClicked'] = await ntRefreshView(
            '#/tools',
            '.page-name',
            '工具',
            '.topbar .page-actions',
          )
          // 失败**真的落到了界面上**：那一页显示的就是 store 里记下的那条
          // `loadError`（判据是探针自己编的那句话原样出现在页面上）。
          const ntToolsErrShown = await until(
            () => !!d().querySelector('.main .notice.bad'),
            30,
          )
          facts['newtask.toolsUnknownViewError'] = ntToolsErrShown
            ? (text(d().querySelector('.main .notice.bad')) ?? '').slice(0, 120)
            : null
          // 回到新建任务页（重进 ⇒ 重新选 ①），看 ③ 怎么画
          facts['newtask.toolsUnknownEntered'] = await ntEnter()
          await until(() => (ntActionsText() ?? '').includes('工具清单还没到'), 30)
          facts['newtask.toolsUnknownBoxValues'] = ntBoxes().map((b) => b.value)
          facts['newtask.toolsUnknownText'] = ntActionsText()
          facts['newtask.toolsUnknownChips'] = ntChips()
          facts['newtask.toolsUnknownControlCount'] = ntControlCount()
          // 收尾：还原 fetch + 再点一次刷新，让界面手里的清单回到真的那一份
          f.contentWindow.fetch = ntRealFetch
          facts['newtask.toolsUnknownRefreshBack'] = await ntRefreshView(
            '#/tools',
            '.page-name',
            '工具',
            '.topbar .page-actions',
          )
          facts['newtask.toolsUnknownEnteredBack'] = await ntEnterWithActions()
          // ★ 残局收拾干净了吗：后面那两条端到端量的必须是**恢复之后**的现场
          facts['newtask.toolsUnknownRestored'] = await until(
            () =>
              ntBoxes().length > 0 &&
              ntBoxes().length === (facts['newtask.installedActionTotal'] ?? -1),
            40,
          )

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // 档四：这个 daemon **兑现不了这一栏的覆盖** ⇒ 退回只读（画 chip）
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 真老 daemon 在探针里造不出来（这一台跑的就是新 daemon），所以现场用
          //   **可达的等价状态**造：把 `/api/identity` 回的 `capabilities` 里
          //   `task-action-whitelist` **只去掉这一个**（`reviewer-override` 留着），
          //   再在「智能体」页点它自己的刷新——那一页的 `refresh()` 会
          //   `loadIdentity()`，于是界面手里的身份真的变成了"半新半旧"那一档。
          //
          //   ⚠️ 这正是 script 里那段注释点名要防的中间态（只重建了一半、或回退到
          //      更早的构建）：**两个标志是两份契约**。③ 必须退回只读（那份覆盖发
          //      过去会被静默忽略，画了勾选框就是在撒谎），而 ② 该照旧能换人/不审。
          const ntStripWhitelistCap = () => {
            const ntReal = ntRealFetch
            f.contentWindow.fetch = function (input, init) {
              const ntUrl =
                typeof input === 'string' ? input : input && input.url ? input.url : ''
              if (!String(ntUrl).includes('/api/identity')) {
                return ntReal.call(f.contentWindow, input, init)
              }
              return ntReal.call(f.contentWindow, input, init).then(async (res) => {
                const ntBody = await res.json().catch(() => null)
                if (!ntBody) return res
                ntBody.capabilities = (ntBody.capabilities ?? []).filter(
                  (c) => c !== 'task-action-whitelist',
                )
                return new Response(JSON.stringify(ntBody), {
                  status: res.status,
                  headers: { 'content-type': 'application/json' },
                })
              })
            }
            return f.contentWindow.fetch !== ntRealFetch
          }
          facts['newtask.oldDaemonPatched'] = ntStripWhitelistCap()
          facts['newtask.oldDaemonRefreshClicked'] = await ntRefreshView(
            '#/agents',
            '.page-name',
            '智能体',
            '.topbar .page-actions',
          )
          // patch 之后那份身份**确实少了那一个标志**（从探针这一侧再问一遍）
          facts['newtask.oldDaemonCapsAfterPatch'] = await f.contentWindow
            .fetch('/api/identity')
            .then((r) => r.json())
            .then((p) => p.capabilities ?? null)
            .catch(() => null)
          facts['newtask.oldDaemonEntered'] = await ntEnter()
          await until(() => (ntActionsText() ?? '').includes('这一栏这一次改不了'), 30)
          facts['newtask.oldDaemonBoxValues'] = ntBoxes().map((b) => b.value)
          facts['newtask.oldDaemonControlCount'] = ntControlCount()
          facts['newtask.oldDaemonChips'] = ntChips()
          facts['newtask.oldDaemonChipSummary'] = need('只读那一档 chip 旁边的 summary', () => {
            // 胶囊在**细节那一条**里（三步排成一行之后 ③ 的卡片只有一列宽）
            const ntChip = [...(ntActionsDetail()?.querySelectorAll('.chip') ?? [])].find(
              (c) => text(c.querySelector('code')) === ntAction,
            )
            // ⚠️ 不能取"第一个 `.chip-sub`"：胶囊第一行现在是**契约值 + 已固定**
            //    （钉死的固定值与动作名同一行），第一个 `.chip-sub` 常常是那一枚。
            //    说明要按"既不是 fixed 也不是 bad"来挑。
            return ntChip
              ? text(ntChip.querySelector('.chip-sub:not(.fixed):not(.bad)'))
              : null
          })
          facts['newtask.oldDaemonText'] = ntActionsText()
          facts['newtask.oldDaemonReviewerOptions'] = ntReviewerSelect()
            ? [...ntReviewerSelect().options].map((o) => o.value)
            : null
          // 收尾：还原 + 再刷新一次，界面手里的身份回到真的那一个
          f.contentWindow.fetch = ntRealFetch
          facts['newtask.oldDaemonRefreshBack'] = await ntRefreshView(
            '#/agents',
            '.page-name',
            '智能体',
            '.topbar .page-actions',
          )
          facts['newtask.oldDaemonEnteredBack'] = await ntEnterWithActions()
          facts['newtask.oldDaemonRestored'] = await until(
            () =>
              ntBoxes().length > 0 &&
              ntBoxes().length === (facts['newtask.installedActionTotal'] ?? -1),
            40,
          )

          // ── 端到端：三次真提交，钉三态里各一半 ──
          //
          // ★★ 五条布局断言加起来也证明不了"使用者选了 A、发出去的是 A"。而
          //    `follow` 与 `none` 在接口上**长得不一样**（`{mode:'follow'}` vs
          //    `{mode:'none'}`），所以这两次提交各自是一条端到端的判据：
          //      · 默认的「跟随」⇒ `follow`。它若变成 `none`，意味着那个 key 被写成了
          //        `null`：使用者以为自己只是照旧，实际把审核关掉了，而界面一切正常；
          //      · 「不自动审核（这一次）」⇒ `none`。
          //
          // ★★ ③（动作白名单）那两条与它们同源、后果一样贵，判据是**落库原文里
          //    那个 key 在不在**：
          //      · E1 一下都没碰 ③ ⇒ **没有 `allowedActions`**（跟随审核者的长期权限）。
          //        写成 `?? []` 的实现这里会给出 `[]` ⇒ 红：那等于用一次"什么都没做"
          //        把那个审核者的权限**永久冻死**在这条任务上；
          //      · E2 把 ③ 上那个勾取消掉（一个都不勾）⇒ `[]`（键在、空数组）。
          //        它与 E1 一起钉死"省略 ≠ 空数组"：省略 = 照旧，`[]` = 这一次一个
          //        动作都不许触发。少了 E2，"取消勾选"这条路上使用者的收紧会被
          //        **静默丢掉**，而那条任务看起来一切正常。
          // ★ 两处 patch（失败的工具清单 / 缺标志的身份）都**还原**了吗：端到端那三条
          //   量的必须是恢复正常之后的现场，不能踩在残局上。
          facts['newtask.fetchRestored'] = f.contentWindow.fetch === ntRealFetch

          await ntEnterWithActions() // 重进页面：② 回到默认的「跟随」
          // ★ 提交之前**原样记下 ② 上是哪一档**（这一条只观察、不设置）：它若不
          //   是 `follow`，那么"跟随 ⇒ follow"这条端到端断言量到的其实是别的东西。
          facts['newtask.followSubmitPick'] = ntReviewerSelect()
            ? ntReviewerSelect().value
            : null
          // ★ E1 的前提：③ 上一下都没碰过（勾着的仍是审核者当前那份）
          facts['newtask.followSubmitChecked'] = ntCheckedValues()
          const ntFollowSubmit = await ntSubmit('探针的三步链夹具：跟随（别动它）')
          facts['newtask.followSubmitReachedTasks'] = ntFollowSubmit.reached
          facts['newtask.followRunAgentId'] = ntFollowSubmit.run
            ? ntFollowSubmit.run.agentId
            : null
          facts['newtask.followRunMode'] = ntFollowSubmit.run?.reviewer?.mode ?? null
          if (ntFollowSubmit.run) {
            const ntFollowRec = await ntRunRecord(ntFollowSubmit.run.runId)
            facts['newtask.followRunRecordRead'] = ntFollowRec !== null
          /**
           * ★★ 投递档要落在 run 上（2026-09 三块组装）。
           *
           * 探针里的 run 走 **generic** runtime（刻意不调真 CLI），而它没有系统提示
           * 这条通道 ⇒ 该落 **B**（三块合成一段）。这一条正好钉住 A 档的**另一侧**：
           * 换一个 runtime 时投递形状真的变了、而且**说得出来**。
           */
          // ⚠️ 这里是浏览器里的**原生 JS**，不能写 TypeScript 的 `as`（写了一次，
          //    整个探针脚本直接语法错误、页面不执行，表现成"探针没在超时前给出结果"）。
          facts['newtask.deliveryModeRecorded'] = ntFollowRec
            ? (ntFollowRec.deliveryMode ?? null)
            : null
            facts['newtask.followRunHasAllowedActionsKey'] = ntFollowRec
              ? Object.prototype.hasOwnProperty.call(ntFollowRec, 'allowedActions')
              : null
            facts['newtask.followRunAllowedActions'] = ntFollowRec
              ? (ntFollowRec.allowedActions ?? null)
              : null
          } else {
            facts['newtask.followRunRecordRead'] = false
            facts['newtask.followRunHasAllowedActionsKey'] = null
            facts['newtask.followRunAllowedActions'] = null
          }

          // ── E2：③ 上一个都不勾再提交 ⇒ `[]`（键在、空数组）──
          await ntEnterWithActions()
          // ★ 动一下：把夹具那个动作的勾取消（夹具里那个审核者只有这一条）
          facts['newtask.clearedSubmitUntick'] = ntSetBox(ntAction, false)
          // 提交之前**原样记下 ③ 上是哪几个勾**（只观察、不设置）：接口上那个 `[]`
          // 必须对应界面上这个状态，否则这条断言量到的是别的东西。
          facts['newtask.clearedSubmitChecked'] = await until(
            () => ntCheckedValues().length === 0,
            30,
          )
          facts['newtask.clearedSubmitCheckedValues'] = ntCheckedValues()
          const ntClearedSubmit = await ntSubmit('探针的三步链夹具：一个动作都不许（别动它）')
          facts['newtask.clearedSubmitReachedTasks'] = ntClearedSubmit.reached
          facts['newtask.clearedRunAgentId'] = ntClearedSubmit.run
            ? ntClearedSubmit.run.agentId
            : null
          if (ntClearedSubmit.run) {
            const ntClearedRec = await ntRunRecord(ntClearedSubmit.run.runId)
            facts['newtask.clearedRunRecordRead'] = ntClearedRec !== null
            facts['newtask.clearedRunHasAllowedActionsKey'] = ntClearedRec
              ? Object.prototype.hasOwnProperty.call(ntClearedRec, 'allowedActions')
              : null
            facts['newtask.clearedRunAllowedActions'] = ntClearedRec
              ? (ntClearedRec.allowedActions ?? null)
              : null
          } else {
            facts['newtask.clearedRunRecordRead'] = false
            facts['newtask.clearedRunHasAllowedActionsKey'] = null
            facts['newtask.clearedRunAllowedActions'] = null
          }

          // ── E3：返工次数（D45）──
          //
          // 这是这条回路在**界面 ↔ 请求体 ↔ 落库**之间唯一可能断掉的地方：
          // 界面选了 2、请求体没带、或者 daemon 没落库，使用者都会得到
          // "配了不返工"而没有任何提示。所以两端都量：
          //   ① 进页面时它必须是 **0**（默认不返工，不能替使用者决定多跑几轮）；
          //   ② 拧到 2 再提交 ⇒ 落库原文里 `maxReworks === 2`。
          await ntEnterWithActions()
          facts['newtask.reworkDefault'] = ntReworkSelect()?.value ?? null
          facts['newtask.setRework'] = await ntSetRework(2)
          const ntReworkSubmit = await ntSubmit('探针的三步链夹具：返工 2 次（别动它）')
          facts['newtask.reworkSubmitReachedTasks'] = ntReworkSubmit.reached
          if (ntReworkSubmit.run) {
            const ntReworkRec = await ntRunRecord(ntReworkSubmit.run.runId)
            facts['newtask.reworkRunRecordRead'] = ntReworkRec !== null
            facts['newtask.reworkRunMaxReworks'] = ntReworkRec
              ? (ntReworkRec.maxReworks ?? null)
              : null
          } else {
            facts['newtask.reworkRunRecordRead'] = false
            facts['newtask.reworkRunMaxReworks'] = null
          }

          await ntEnterWithActions()
          await ntSetReviewer('none')
          const ntNoneSubmit = await ntSubmit('探针的三步链夹具：不自动审核（别动它）')
          facts['newtask.noneSubmitReachedTasks'] = ntNoneSubmit.reached
          facts['newtask.noneRunAgentId'] = ntNoneSubmit.run ? ntNoneSubmit.run.agentId : null
          facts['newtask.noneRunMode'] = ntNoneSubmit.run?.reviewer?.mode ?? null
        }

        // 这一组量完了：把窗口还原成探针默认的 1280（后面那些组按它量的）
        f.style.width = '1280px'
        await wait(400)

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 一个工具包都没装：那一栏的空态（D41）══════════════
        //
        // 使用者点名要的空态是"还没有装工具包 ⇒ 现在没有任何动作可授权"，而且要
        // **指向「工具」页**——不是留一片空白，也不是显示一个空的分组标题。
        //
        // ★ 这一段必须**自己把现场造成那个样子**：夹具里装着 `probe-tool`（前面
        //   整套"工具"的检查都靠它），所以"一个都没装"这个状态在探针跑到这里之前
        //   根本不存在。做法与夹具一样**走真接口**：先把它从挂着的 agent 上摘掉
        //   （还有 agent 挂着时卸载会被服务端拒），再卸载，然后在「工具」页点**刷新**
        //   让界面的 `$tools` 真的空掉。
        //
        // ⚠️ 它排在**最后**：这一步之后工具都没了，前面那些靠夹具工具的检查全都
        //    量不到了，所以不能在中间做。剩下的只有"新建页不崩"那一条，它不依赖工具。
        // ⚠️ 每一步都**如实上报**（卸载被拒 / 刷新按钮找不到都没有藏起来）：
        //    这一组绿的意思是"空态真的被看到过"，不是"没跑到"。
        /* ══════════════════════════════════════════════════════════════
         * 任务详情右边那一栏（与聊天那一栏**同一个组件**）
         * ══════════════════════════════════════════════════════════════
         *
         * 抽组件这一刀动的是**任务页**那条已经在用的路径，而这一条检查就是它的
         * 回归网：左边那一栏换成组件之后，`base` 传错（比如传成一个空 id）会表现
         * 成"那一栏报错"或"一直骨架屏"，而这两种在肉眼扫一眼截图时都不明显。
         *
         * 判据是**真的打到接口上拿到东西**：跑完的任务点开之后，右边要么列出目录
         * 里的条目、要么说"这个目录还是空的/还不存在"；**不许出现"取不到"那一块**
         * （它意味着请求失败——旧 daemon、或者 base 传错了）。
         *
         * ⚠️ 只在**跑完的**任务上量：还在跑的时候右边是实时日志，没有文件那一栏。
         *    所以这里顺着列表往下找前几条，找到一条跑完的为止。
         */
        facts['tasks.filesColumnStillRenders'] = await (async () => {
          /**
           * ⚠️ 先**等一条 run 跑完**再点：还在跑的时候右边是实时日志，没有文件那
           *    一栏——第一版就是没等，于是"前 5 条里没有一条跑完的"（探针当场报红，
           *    而那是探针自己的前提没立住，不是界面坏了）。
           *
           * 用的是接口上的状态（`GET /api/runs`），不是页面上的字。
           */
          const TERMINAL = ['completed', 'failed', 'cancelled']
          const runsNow = () =>
            f.contentWindow
              .fetch('/api/runs')
              .then((r) => r.json())
              .then((p) => p.runs ?? [])
              .catch(() => [])
          let terminalRun = null
          for (let i = 0; i < 25; i += 1) {
            terminalRun = (await runsNow()).find((r) => TERMINAL.includes(r.status))
            if (terminalRun) break
            await wait(400)
          }
          if (!terminalRun) {
            errors.push('等不到任何一条跑完的 run——这一条量不到（那几条会空过）')
            return false
          }
          f.contentWindow.location.hash = '#/tasks'
          await until(() => !!d().querySelector('.detail-pane'), 60)
          await wait(600)
          /**
           * ⚠️ 视图模式（列表 / 看板）**存在 localStorage 里**：本视图前面那一段
           *    切过看板，不切回来的话 `.task-row` 一条都抓不到——而症状看起来像
           *    "没有任务"（这与 `ntSubmit` 那边踩过的是同一个坑）。
           */
          if (d().querySelectorAll('.list-pane .task-row').length === 0) {
            const toList = [...d().querySelectorAll('button')].find((b) => text(b) === '列表')
            if (toList) {

              await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
            }
          }
          const rows = [...d().querySelectorAll('.list-pane .task-row')]
          for (const row of rows.slice(0, 5)) {
            click(row)
            await wait(900)
            // ★ D69.9.1：文件回到结果区**右侧栏**（使用者：高频项，不折叠）。
            const aside = d().querySelector('.detail-pane aside.result-files')
            if (!aside) continue // 这一条还在跑（右边是实时日志）⇒ 换下一条
            const body = text(aside)
            if (body.includes('取不到工作目录的文件')) {
              errors.push('任务详情那一栏报"取不到"——组件抽出来之后 base 或接口对不上')
              return false
            }
            if (!body.includes('工作目录的文件')) {
              errors.push(`任务详情那一栏没有标题（量到的是「${body.slice(0, 60)}」）`)
              return false
            }
            // 骨架屏也是"没量到东西"：等一下再看一次
            await wait(700)
            const again = text(d().querySelector('.detail-pane aside.result-files') ?? aside)
            if (again.includes('取不到工作目录的文件')) {
              errors.push('任务详情那一栏等完之后变成了"取不到"')
              return false
            }
            // ★ D69.12：点「看完整日志」不该有**外置滚动条**（使用者报双滚动条：
            //   .log 内置一条 + 详情栏又一条）。正解：日志视图时详情栏切成

            const logToggle = [...d().querySelectorAll('.detail-pane button')].find((b) =>
              text(b).includes('完整日志'),
            )
            if (logToggle) {
              // D69.13：按钮词条**精确值**（substring 匹配挡不住「完整日志」被改
              // 回「看完整日志」——`.includes` 照样过，这里钉死整串）
              facts['tasks.logToggleLabel'] =
                (logToggle.textContent ?? '').trim() === '完整日志'
              click(logToggle)
              await wait(400)
              const logEl = d().querySelector('.detail-pane .log')
              const pane = d().querySelector('.detail-pane .pane-body.detail-scroll')
              facts['tasks.logModeNoOuterScroll'] =
                logEl && pane
                  ? cs(pane).overflowY === 'hidden' && cs(pane).display === 'flex'
                  : 'NO-LOG'
              // 切过来之后同一个按钮变成「最后结果」
              facts['tasks.showFinalResultLabel'] =
                (logToggle.textContent ?? '').trim() === '最后结果'
              // 日志是详情栏的**主体**：高度占比过半（flex 吃满剩余空间；
              // flex 断掉日志会塌成一小条——占比直接量得到）
              facts['tasks.logFillsPane'] =
                logEl && pane ? logEl.offsetHeight / pane.clientHeight : 'NO-LOG'
              click(logToggle) // 切回最后结果，别把状态留在日志视图
              await wait(300)
            } else {
              facts['tasks.logToggleLabel'] = 'NO-TOGGLE'
              facts['tasks.showFinalResultLabel'] = 'NO-TOGGLE'
              facts['tasks.logModeNoOuterScroll'] = 'NO-TOGGLE'
              facts['tasks.logFillsPane'] = 'NO-TOGGLE'

          }
          errors.push(
            `点了前 5 条任务都没看到「工作目录的文件」那一栏（列表里 ${rows.length} 行，` +
              `右栏当前是「${text(d().querySelector('.detail-pane')).slice(0, 80)}」）——` +
              `还在跑的任务右边是实时日志，这一条量不到`,

          return false
        })()

        {
          const fetchAgents = () =>
            f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then((p) => p.agents ?? [])
              .catch(() => [])
          const fetchTools = () =>
            f.contentWindow
              .fetch('/api/tools')

              .then((p) => p.tools ?? [])
              .catch(() => [])
          // 现场起点：装着哪些工具。下面每一阶段都会改动它，所以先记一笔。
          const toolsAtStart = await fetchTools()
          facts['noTools.slugsBefore'] = toolsAtStart.map((x) => x.slug)
          /** 「工具」页那个**刷新**按钮：界面的 `$tools` 靠它重新取一遍。 */
          const refreshToolsInUi = async () => {

            await until(() => text(d().querySelector('.page-name')) === '工具', 60)
            await wait(300)
            const btn = [...d().querySelectorAll('.topbar .page-actions button')].find(

            if (btn) {

              // ⚠️ 这一次刷新是**真的网络请求**，所以要**等它落地**再往下走：

              await wait(600)

          }

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）

          // ══════════════════════════════════════════════════════════════
          // 阶段 A：**配过、但提供它的包被卸载了** ⇒ 保存被服务端拒（400）
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)

          //

          //     ② 走接口把 `probe-tool-ui` 卸载 —— 那条权限立刻变成"配过、但没有

          //        ⇒ 这一份 patch 里带着那条没有出处的名字 ⇒ **400**。
          //
          //   ⚠️ 授权那一步必须走**界面**（不能直接 PATCH）：界面的 agent 列表是

          const holder = (await fetchAgents()).find((a) =>

              .catch(() => null)

          if (holder && uiTool) {
            // ① 走界面勾上 `probe-tool-ui.ping` 并保存

            await wait(200)
            const grantEdit = detailButton('编辑')

              await until(() => !!d().querySelector('.action-perms'), 40)

              }

                await until(() => !d().querySelector('.action-perms'), 40)
                await wait(200)
              }
            }
            facts['noTools.staleGrantOk'] = (await allowedActionsOf(holder.name))?.includes(

            // ② 卸载那个包（没有 agent 挂它 ⇒ 不会被拒）⇒ 那条权限失去出处
            const dropped = await f.contentWindow
              .fetch(`/api/tools/${encodeURIComponent(uiTool.id)}`, { method: 'DELETE' })
              .then((r) => r.ok)
              .catch(() => false)
            facts['noTools.staleUninstallOk'] = dropped

            // ③ 让界面的 `$tools` 跟着少掉那一组
            await refreshToolsInUi()

            // ④ 回到它的详情 → 编辑：那条**列出来**，勾一个可用的动作，保存 ⇒ 400
            await openAgentDetail(holder.name)
            await wait(200)
            const staleEditBtn = detailButton('编辑')
            if (staleEditBtn) {
              click(staleEditBtn)
              await until(() => !!d().querySelector('.action-perms'), 40)
              await wait(150)
              const stalePerms = d().querySelector('.action-perms')
              facts['noTools.staleListedInEdit'] = !!(
                stalePerms && (text(stalePerms) ?? '').includes('probe-tool-ui.ping')
              )
              // ★ 勾一个**可用**的动作：使用者会做的那种改动（改名字也一样），
              //   它让这一份 patch 里带上了那条没有出处的名字。
              const liveBox = [
                ...(stalePerms?.querySelectorAll('.ap-ck') ?? []),
              ].find((i) => i.value === 'probe-tool.clean-notes')
              facts['noTools.staleLiveBoxFound'] = !!liveBox
              if (liveBox) {
                liveBox.checked = true
                liveBox.dispatchEvent(new Event('change', { bubbles: true }))
                await wait(200)
              }
              // 服务端对这一份名单的原话（拿同一份名单直接问接口，作为"逐字"的基准）
              const refused = await f.contentWindow
                .fetch(`/api/agents/${encodeURIComponent(holder.id)}`, {
                  method: 'PATCH',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    allowedActions: ['probe-tool.append-note', 'probe-tool.clean-notes', 'probe-tool-ui.ping'],
                  }),
                })
                .then(async (r) => ({ ok: r.ok, body: await r.json().catch(() => null) }))
                .catch(() => null)
              facts['noTools.staleServerRefuses'] = refused?.ok === false
              facts['noTools.staleServerErrorText'] = refused?.body?.error ?? null

              const staleSaveBtn = saveButton()
              facts['noTools.staleSaveButton'] = !!staleSaveBtn
              if (staleSaveBtn) {
                click(staleSaveBtn)
                await until(() => !!d().querySelector('.detail-pane .notice.bad'), 40)
                await wait(250)
                const shownError = text(d().querySelector('.detail-pane .notice.bad'))
                facts['noTools.staleErrorShown'] = shownError
                // ★ ① **原样显示**：页面上那句与接口回的那句**逐字相同**
                //   （不吞掉、也不自己编一句概括——服务端那句里已经说了是哪一条、

                facts['noTools.staleErrorVerbatim'] =
                  typeof shownError === 'string' &&
                  shownError !== '' &&
                  typeof facts['noTools.staleServerErrorText'] === 'string' &&
                  shownError === facts['noTools.staleServerErrorText']
                // ★ ② 还停在编辑态（没有假装保存成功）
                facts['noTools.staleStillEditing'] = !!d().querySelector('.action-perms')
                // ★ ③ 那条名字**还在草稿里**：被拒之后不许静默剔除
                facts['noTools.staleKeptAfterRefusal'] = (
                  text(d().querySelector('.action-perms')) ?? ''
                ).includes('probe-tool-ui.ping')

                // ── 出口：点「移除」→ 保存 ⇒ 这一次能存进去 ──
                const staleDropBtn = [
                  ...(d().querySelector('.action-perms')?.querySelectorAll('button') ?? []),
                ].find((b) => text(b) === '移除')
                facts['noTools.staleDropButton'] = !!staleDropBtn
                if (staleDropBtn) {
                  click(staleDropBtn)
                  await wait(200)
                  const retryBtn = saveButton()
                  if (retryBtn) {
                    click(retryBtn)
                    await until(() => !d().querySelector('.action-perms'), 40)
                    await wait(250)
                    const after = await allowedActionsOf(holder.name)
                    facts['noTools.staleFixedOnServer'] =

                  }
                }

          }

          publish(false)

          publish(false)
          // ══════════════════════════════════════════════════════════════
          const toolsNow = await fetchTools()

          // ③ 「工具」页那个**刷新**按钮：界面的 `$tools` 靠它重新取一遍
          f.contentWindow.location.hash = '#/tools'
          await until(() => text(d().querySelector('.page-name')) === '工具', 60)
          await wait(300)
          const refreshBtn = [...d().querySelectorAll('.topbar .page-actions button')].find(
            (b) => text(b) === '刷新',
          )
          facts['noTools.refreshButtonFound'] = !!refreshBtn
          if (refreshBtn) {

            ).slice(0, 160)
          } else {

          }

            facts['noTools.readOnlyHasEmptyState'] = !!(

                perms &&
                (text(perms) ?? '').includes('还没有装任何工具包') &&
                (text(perms) ?? '').includes('没有任何动作可授权')
              )
              // ★ 不许有"空的分组标题"：既没有分组容器，也没有那一组的标题
              //
              //   ⚠️ 判据是**那一组的标题文本**（`tools.stdToolsHeading` = 「已装工具的动作」），
              //      不是"`.field-label` 一处都没有"：那一栏里后来长出了别的分组
