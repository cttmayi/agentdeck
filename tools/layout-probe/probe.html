          //   界面上就不成立）——这是这次搬家在界面上最直接的一条判据。
          facts['standard.formStandardEditorHasNoActions'] = !standardHost?.querySelector(
            '.action-picker',
          )

          // ══════════════════════════════════════════════════════════════
          // D41：这一栏里**没有**内置动作那一组，而且一个都不预勾
          // ══════════════════════════════════════════════════════════════
          //
          // 原来这里量的是"内置动作那一组里有六个复选框、默认预勾 `comment.create`"。
          // 内置动作整组被移除之后，那两条量的是**已经不存在的东西**——而且危险的是
          // 它们还能碰巧绿（容器类名没删干净、或者老数据里恰好留着那个名字）。
          //
          // 换成三条，都是"现在是什么"：
          //   ① 这一栏里**没有** `.action-picker`（内置动作那一组当年的骨架容器）；
          //   ② **一个都不预勾**：没有任何内置动作可以预勾，而工具动作要不要授权
          //      是使用者自己决定的（协议 schema 的默认就是空数组）；
          //   ③ 这一栏里出现的**每一个**勾选项都必须是已装工具包的动作
          //      （`<slug>.<动作名>`，slug 取自接口回的已装列表）——这一条才是
          //      "动作只能来自工具包"在界面上的落点：只有 ① 的话，把内置动作那一组
          //      换个类名重新长出来仍然绿。
          facts['standard.formNoBuiltinGroup'] = actionsHost
            ? actionsHost.querySelector('.action-picker') === null
            : false
          const formActionBoxes = () => [
            ...(actionsHost?.querySelectorAll('input[type=checkbox]') ?? []),
          ]
          facts['standard.formActionOptions'] = formActionBoxes().map((i) => i.value)
          facts['standard.installedSlugs'] = await f.contentWindow
            .fetch('/api/tools')
            .then((r) => r.json())
            .then((payload) => (payload.tools ?? []).map((x) => x.slug))
            .catch(() => null)
          facts['standard.formDefaultAction'] = need('默认勾选的动作', () => {
            const checked = formActionBoxes()
              .filter((i) => i.checked)
              .map((i) => i.value)
            return checked.join(',')
          })
          facts['standard.formMentionsNoSkillNeeded'] = (form2?.textContent ?? '').includes(
            '判断依据是上面那条',
          )
          // ★ D40：行动权限里也要能勾到**已装工具的动作**（它原来在标准那一栏里）。
          //   两者管的是两件事——"挂载"回答"这个执行者能触发什么"（住在 agent
          //   上，单位是组），"行动权限"回答"判完之后允许触发什么"（住在 agent 上，
          //   判决按它校验）。勾不到第三方动作 ⇒ 装了工具也永远用不上。
          facts['standard.formToolActions'] = actionsHost
            ? [...actionsHost.querySelectorAll('.ap-ck')].map((i) => i.value)
            : []
          facts['standard.formToolSummaryShown'] = need('工具动作旁边的 summary', () => {
            const el = actionsHost?.querySelector('.ap-row .action-summary')
            return el ? text(el) : null
          })
          // ★ 选中的动作/标准**真的回到父组件**了吗（不是只画了勾选框）。
          //
          //   判据是标准那一栏头部的状态徽章：写正文之后它必须从「没有标准」变成
          //   「已写」——那个徽章读的是**父组件传下来的 `value`**，所以它一变就说明
          //   "子组件 → 父组件 → 再传回来"这一圈是通的。
          //
          //   ⚠️ 这一条守的是一类**看不见的**错：Svelte 5 里组件的 `bind:value`
          //      不是"子组件调 onchange 就算"，子组件必须**写自己的那个 prop** 才会
          //      通知父组件。只调 `onchange` 的组件配 `bind:value` 用，写进抽屉里的
          //      东西会**一个字都没到父组件**——界面上一切正常，创建出来的却是空的。
          //
          // ★ 顺便把这一栏的**草稿**在真实交互之后再看一次：在标准那一栏写下正文
          //   之后，行动权限里勾着的那一个工具动作不该被抖掉（两个字段的草稿是
          //   分开的：标准归标准、权限归权限）。
          //
          //   ⚠️ D41 之前这里量的是"预勾的那一档还在"。预勾没有了之后，若还照着
          //      原样量"空的还是空的"，这条就退化成**空过**（两个字段确实分开时
          //      它也是空的）。所以先**真的勾一个**工具动作，再看它经受住那次输入
          //      没有——这才是同一条判断在新现实下的形态。
          const tickBox = formActionBoxes().find((i) => i.value === 'probe-tool.append-note')
          facts['standard.formToolTickBoxFound'] = !!tickBox
          if (tickBox) {
            tickBox.checked = true
            tickBox.dispatchEvent(new Event('change', { bubbles: true }))
            await wait(200)
          }
          const stdTextarea = standardHost?.querySelector('textarea')
          if (stdTextarea) {
            stdTextarea.value = '探针写的标准正文'
            stdTextarea.dispatchEvent(new Event('input', { bubbles: true }))
            await wait(250)
          }
          facts['standard.formStandardReachesParent'] = need('标准的状态徽章', () =>
            text(form2.querySelector('.std-head .badge')),
          )
          facts['standard.formTickSurvivesTyping'] = need('写下正文之后仍勾着的动作', () => {
            const checked = formActionBoxes()
              .filter((i) => i.checked)
              .map((i) => i.value)
            return checked.join(',')
          })
          const cancel2 = [...form2.querySelectorAll('button')].find(
            (b) => b.textContent.trim() === '取消',
          )
          if (cancel2) click(cancel2)
          await wait(250)
        }

        // ══════════════ 迁移：把挂载的 skill 转成内联标准（D38）══════════════
        //
        // 使用者的真实处境：他删不掉 general-review，因为审核者还挂着它、而且标准
        // 正来自它。这条路要端到端量：详情页那个按钮 → 标准出现、挂载清空 →
        // 那条 skill 才卸得掉。
        const legacyRow = [...d().querySelectorAll('.agent-row')].find((row) =>
          (row.textContent ?? '').includes('探针用的老形态审核者'),
        )
        facts['migrate.legacyFixtureFound'] = !!legacyRow
        // ★ 拿到这个夹具 agent 的 id：下面"挂载有没有被摘掉"要**问接口**，
        //   而不是扫页面文字（页面上另有一处「挂载的 skill」是编辑态的选择器标签，
        //   它与"这个 agent 当前挂着什么"无关，扫全文的断言必然空过或误报）。
        const agentsBefore = await f.contentWindow
          .fetch('/api/agents')
          .then((r) => r.json())
          .catch(() => null)
        const legacyAgent = (agentsBefore?.agents ?? []).find(
          (a) => a.name === '探针用的老形态审核者',
        )
        const legacyAgentId = legacyAgent ? legacyAgent.id : null
        facts['migrate.legacyAgentFound'] = legacyAgentId !== null
        if (legacyRow) {
          click(legacyRow.querySelector('.agent-item'))
          // ⚠️ 必须等右栏**换成了这个 agent**——前面的段落已经选过别的 agent 了，
          //    只等 `.detail` 存在会立刻返回，读到的是上一个 agent 的详情
          //    （又一次"看早"，这次被 `legacyHintBefore` 那条断言抓到）
          facts['migrate.detailSwitched'] = await until(
            () => text(d().querySelector('.detail h2')) === '探针用的老形态审核者',
            60,
          )
          await wait(300)
          const adoptBtn = [...d().querySelectorAll('.detail button')].find(
            (b) => b.textContent.trim() === '把挂载的 skill 转成内联标准',
          )
          facts['migrate.buttonFound'] = !!adoptBtn
          if (adoptBtn) {
            // 固化之前：这一段显示的是"沿用挂载的 skill"那句提示
            facts['migrate.stdRowText'] = need('审核标准那一行的文字', () => {
              const row = [...d().querySelectorAll('.detail .field-row')].find(
                (r) => text(r.querySelector('.row-label')) === '审核标准',
              )
              return row ? text(row).slice(0, 140) : null
            })
            facts['migrate.legacyHintBefore'] = String(facts['migrate.stdRowText'] ?? '').includes(
              '沿用挂载',
            )

            // ★ 老数据的**更早一层**：这个夹具只挂了 skill、agent 上没有动作权限，
            //   所以「行动权限」那一行是空的，而它**仍然**能触发 skill 里那些动作
            //   （服务端的解析链：agent → 标准 → 挂载 skill）。界面上必须说出来，
            //   否则"一个都没勾"看着就像勾选坏了。
            //
            //   ⚠️ 两条判据一起量：① 那段里确实有那句"动作来自这些 skill"的提示；
            //      ② 空态**没有**同时说"只报告、不动作"——列表空是因为白名单住在
            //      skill 里，那句话说出口就是假的（自相矛盾的一对最容易被当成 bug）。
            const legacyActionsSection =
              [...d().querySelectorAll('.detail .section')].find((s) =>
                (text(s.querySelector('h3')) ?? '').includes('行动权限'),
              ) ?? null
            facts['migrate.legacyActionsHintShown'] = String(
              text(legacyActionsSection) ?? '',
            ).includes('也来自这些 skill')
            facts['migrate.legacyActionsNoFalseClaim'] = !String(
              text(legacyActionsSection) ?? '',
            ).includes('只报告、不动作')
            // ★ **两条提示要在同一屏上一起看得见**（"标准与动作都还是老形态"这件事
            //   两句话合起来才说得清）：
            //     ① 标准那一行说"沿用挂载的 skill 当标准（老配置）"；
            //     ② 行动权限那一段说"能触发的动作也来自这些 skill（老配置）"。
            //   ⚠️ 判据是**同一次渲染里两条都在**（不是分别出现过）：这正是使用者
            //      说的"两条一起看"，也是这一组唯一守得住它的地方——两条提示分属
            //      两段，任何一条被挪走/被条件挡掉，界面就只剩半句话。
            facts['migrate.legacyBothHintsTogether'] =
              facts['migrate.legacyHintBefore'] === true &&
              facts['migrate.legacyActionsHintShown'] === true

            click(adoptBtn)
            // 固化之后：出现标准名的徽章（`.std-name-badge`，D37 的那个）
            facts['migrate.adopted'] = await until(
              () => !!d().querySelector('.detail .std-name-badge'),
              60,
            )
            // ⚠️ 这三条原来写的是 `d().textContent`——而 `d()` 是**文档**，
            //    按 DOM 规范 `Document.textContent` 恒为 `null`，于是 `?? ''`
            //    让它永远变成"不含那句话"，这三条**否定**断言因此**不可能红**。
            //    （发现它的是 D41 那次改动：新加的检查用了同样的写法，表现为
            //    "永远 false"，才回头看出这三条一直在空过。）
            //    改成读**页面主区**的文字。
            const mainText = () => text(d().querySelector('.main')) ?? ''
            facts['migrate.legacyHintGone'] = !mainText().includes('沿用挂载的 skill')
            // ★ 固化会把挂载摘掉（`skillIds: []`）⇒ 动作不再可能来自 skill，
            //   那句提示必须跟着消失（否则它开始说假话）。
            facts['migrate.legacyActionsHintGone'] = !mainText().includes('也来自这些 skill')

            // ★ "挂载被摘掉"问接口，而不是扫页面文字（见上）
            const agentsAfter = await f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .catch(() => null)
            const adoptedAgent = (agentsAfter?.agents ?? []).find(
              (a) => a.id === legacyAgentId,
            )
            facts['migrate.mountCleared'] = adoptedAgent
              ? (adoptedAgent.skillIds ?? []).length === 0
              : null
          }
        }

        // ══════════════ 默认智能体（D36）══════════════
        //
        // 使用者要的是"每个智能体上一个默认按钮，设过之后新建任务默认选它"。
        // 两轮反馈之后的语义：**单选**（设了新的，原来那个自动让位；没有"取消默认"），
        // 而且开关要在卡片**里面**、不许溢出。
        f.contentWindow.location.hash = '#/agents'
        await until(() => d().querySelectorAll('.agent-item').length > 0)
        await wait(400)

        const paneEl2 = d().querySelector('.pane')
        const paneBodyEl = d().querySelector('.pane-body')
        const rowBox = (el) => {
          if (!el) return null
          const r = el.getBoundingClientRect()
          return { x: r.x, y: r.y, w: r.width, h: r.height, right: r.right }
        }
        // ⚠️ 限定在**列表**里：详情页也有徽章（审核标准的名字），
        //    文档级的 querySelectorAll 会把两件事混成一件（踩过）
        const badge = () => d().querySelector('.agent-list .default-badge')
        const toggleBtns = () =>
          [...d().querySelectorAll('.default-toggle')].filter(Boolean)
        const cancelBtns = () =>
          [...d().querySelectorAll('.agent-row button')].filter((b) =>
            (b.textContent ?? '').includes('取消默认'),
          )

        // ⚠️ 第二个执行者是**夹具**（run.mjs 在启动 Chrome 之前造的，见那边的注释：
        //    不能在探针里造，虚拟时间会让"等界面刷新"看早）。
        facts['defaultAgent.executorCount'] = [...d().querySelectorAll('.agent-row')].filter(
          (row) => row.querySelector('.badge.in_progress'),
        ).length

        facts['defaultAgent.badgeCount'] = d().querySelectorAll('.agent-list .default-badge').length
        facts['defaultAgent.noCancelButton'] = cancelBtns().length === 0
        facts['defaultAgent.setButtonCount'] = toggleBtns().length
        facts['defaultAgent.noButtonOnReviewer'] = !(
          d()
            .querySelector('.agent-row .badge.in_review')
            ?.closest('.agent-row')
            ?.querySelector('button.default-toggle')
        )

        // ★ 布局：开关必须在卡片的边框**里面**，整行不许溢出栏宽
        const paneW = rowBox(paneEl2)
        const rowWithToggle = toggleBtns()[0]?.closest('.agent-row')
        facts['defaultAgent.rowFitsPane'] = !!(
          rowWithToggle &&
          paneW &&
          rowBox(rowWithToggle).right <= paneW.right + 1
        )
        facts['defaultAgent.switchInsideRow'] = !!(
          rowWithToggle &&
          toggleBtns()[0] &&
          rowBox(toggleBtns()[0]).right <= rowBox(rowWithToggle).right + 1
        )
        facts['defaultAgent.rowOverflowX'] = rowWithToggle
          ? rowWithToggle.scrollWidth - rowWithToggle.clientWidth
          : null
        facts['defaultAgent.paneBodyOverflowX'] = paneBodyEl
          ? paneBodyEl.scrollWidth - paneBodyEl.clientWidth
          : null

        const target = toggleBtns()[0]
        facts['defaultAgent.setButtonFound'] = !!target
        if (target) {
          const targetRow = target.closest('.agent-row')
          facts['defaultAgent.targetName'] = text(targetRow.querySelector('.agent-item strong'))
          const previous = need('点之前谁是默认', () => text(badge().closest('.agent-row').querySelector('.agent-item strong')))
          facts['defaultAgent.previousName'] = previous

          click(target)
          const marked = await until(
            () =>
              text(badge()?.closest('.agent-row')?.querySelector('.agent-item strong')) ===
              facts['defaultAgent.targetName'],
          )
          facts['defaultAgent.badgeMovesToTarget'] = marked
          // ★ 单选：设完之后「默认」徽章**只有一个**，而且没有"取消默认"这种东西
          facts['defaultAgent.badgeStillExactlyOne'] =
            d().querySelectorAll('.agent-list .default-badge').length === 1
          facts['defaultAgent.noCancelAfterSet'] = cancelBtns().length === 0
          facts['defaultAgent.targetHasNoToggle'] = !targetRow.querySelector('.default-toggle')

          // ★ 端到端：新建任务页预选的就是它
          f.contentWindow.location.hash = '#/new'
          await until(() => !!d().querySelector('select'))
          await wait(500)
          const select = [...d().querySelectorAll('select')].find((sel) =>
            [...sel.options].some((o) => (o.textContent ?? '').includes('（默认）')),
          )
          facts['defaultAgent.optionMarked'] = !!select
          facts['defaultAgent.selectListsOnlyExecutors'] = need('选择器里的选项', () => {
            const sel = select ?? d().querySelector('select')
            return [...sel.options].every((o) => !(o.textContent ?? '').includes('（审核）'))
          })
          facts['defaultAgent.preselected'] = need('新建任务页预选的 agent', () => {
            const sel = select ?? d().querySelector('select')
            const chosen = sel.options[sel.selectedIndex]
            return chosen ? (chosen.textContent ?? '').replace('（默认）', '').trim() : null
          })
        }

        // ══════════════ 语言切换（D39）══════════════
        //
        // ⚠️ 这一段必须放在**最后**：前面所有检查都断言中文，切成英文会让它们全红。
        //    测完切回中文，保证探针结束时状态与开始时一致。
        f.contentWindow.location.hash = '#/agents'
        await until(() => !!d().querySelector('.topbar select'))
        await wait(300)

        const langSelect = d().querySelector('.topbar select')
        facts['lang.switchPresent'] = !!langSelect
        facts['lang.defaultIsZh'] = langSelect ? langSelect.value : null
        facts['lang.navBefore'] = need('切换前的导航文字', () =>
          text(d().querySelector('.sidebar .nav-title')),
        )

        if (langSelect) {
          langSelect.value = 'en'
          langSelect.dispatchEvent(new Event('change', { bubbles: true }))
          // 英文生效：导航文字与顶栏按钮都变成英文
          const switched = await until(
            () => text(d().querySelector('.sidebar .nav-title')) === 'New task',
            40,
          )
          facts['lang.switchedToEn'] = switched
          facts['lang.navAfter'] = need('切换后的导航文字', () =>
            text(d().querySelector('.sidebar .nav-title')),
          )
          facts['lang.settingsLabel'] = need('顶栏「设置」按钮', () => {
            const b = [...d().querySelectorAll('.topbar-actions button')].find(
              (x) => text(x) === 'Settings',
            )
            return b ? 'Settings' : null
          })
          // ★ 契约值**不翻译**：动作名、runtime key 这些仍然是机器值。
          //
          //   ⚠️ 这条原来在 **Skills 页**上量：那张表里有一列「允许的动作」，值就是
          //      `comment.create`。D40 收口把动作从 skill 搬到了**审核者**身上
          //      （`Agent.allowedActions`）之后，那一列整列没有了——量点跟着搬到了
          //      审核者详情里的「行动权限」那一行，值仍然是原样的
          //      `<code>comment.create</code>`。
          //
          //      改的是**它现在在哪一段**、以及**哪一个具体的动作名**，判据一点没
          //      放宽：仍然要求英文界面下这个机器值一字不差地出现在页面上（而不是
          //      被当成文案翻掉）。
          //
          //   ⚠️ D41 把量点从 `comment.create` 换成了 `probe-tool.append-note`：
          //      前者已经不是任何动作了（内置动作整组被移除），而后者是探针自己
          //      在**同一个审核者**身上、走真实写入口刚勾上去的那个工具动作
          //      （见上面那条端到端）。所以这一条量的是一个**确实存在的契约值**，
          //      不是一条老数据里可能碰巧留着的字符串。
          f.contentWindow.location.hash = '#/agents'
          await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
          await wait(300)
          const reviewerRowEn = [...d().querySelectorAll('.agent-row')].find((row) =>
            row.querySelector('.badge.in_review'),
          )
          if (reviewerRowEn) click(reviewerRowEn.querySelector('.agent-item'))
          await until(() => !!d().querySelector('.detail'), 60)
          await wait(300)
          // 先记一个"详情真的渲染出来了"的基数（否则下面那条会空过）
          facts['lang.detailRowsInEn'] = d().querySelectorAll('.detail .field-row').length
          facts['lang.contractValuesUntranslated'] = (() => {
            const detail = d().querySelector('.detail')
            if (!detail) return false
            const codes = [...detail.querySelectorAll('.field-row code')].map((c) => text(c))
            return codes.includes('probe-tool.append-note')
          })()

          // ── 阶段文案也跟着语言走（列头 / 短标签 / 行内提示） ──
          //   ★ 这一块是对"**推导层只给文案键**"的端到端验收：`stageOf` 返回的是
          //     `noteId`/`warningId`，列定义给的是 `titleId`/`hintId`，句子的中英
          //     两版都在词条表里。只要有一处还写着中文硬编码，这里就红。
          f.contentWindow.location.hash = '#/tasks'
          // ★ 先等**任务视图真的挂上**，再找「列表/看板」那对按钮。
          //   第一次跑就是漏了这一步：设完 hash 立刻找按钮，那时页面还是 Skills，
          //   于是"切回列表"没发生；而视图模式**存在 localStorage 里**（前面看板
          //   那一节留的是看板），结果按 `.task-row` 一条都抓不到——两个值变成
          //   `—`，看起来像"选择器改了"，其实是探针自己的状态没整理。
          //
          //   ⚠️ 判据不能用 `.list-pane, .board`：**智能体页的左栏也叫 `.list-pane`**，
          //      所以从智能体页过来时它在"还没切过去"的那一刻就已经命中（这一节
          //      前一版停在 Skills 页，那个选择器只是**碰巧**对）。按任务视图独有的
          //      「列表/看板」切换按钮等，才是"任务视图在不在"。
          await until(
            () =>
              [...d().querySelectorAll('button')].some((b) =>
                ['List', 'Board'].includes(b.textContent.trim()),
              ),
            60,
          )
          const toListFirst = [...d().querySelectorAll('button')].find(
            (b) => b.textContent.trim() === 'List',
          )
          facts['lang.modeBeforeInEn'] = need('进任务视图时的模式', () =>
            d().querySelector('.board') ? 'board' : 'list',
          )
          if (toListFirst) {
            click(toListFirst)
            await wait(50)
          }
          const gotRowsEn = await until(
            () => d().querySelectorAll('.list-pane .task-row').length > 0,
            60,
          )
          facts['lang.taskRowsInEn'] = gotRowsEn
          if (gotRowsEn) {
            facts['lang.stageShort'] = need('英文界面下的阶段短标签', () =>
              text(d().querySelector('.list-pane .task-row .stage-tag')),
            )
            facts['lang.stageNote'] = need('英文界面下的行内提示', () =>
              text(d().querySelector('.list-pane .task-row .task-meta .faint.small')),
            )
          }
          const toBoardEn = [...d().querySelectorAll('button')].find(
            (b) => b.textContent.trim() === 'Board',
          )
          facts['lang.boardButtonInEn'] = !!toBoardEn
          if (toBoardEn) {
            click(toBoardEn)
            await until(() => d().querySelectorAll('.column').length > 0, 40)
            // `h4` 里是「标题 + 计数 + 说明」三段，只取**标题**那一段：读整个 `h4`
            // 会得到 "Executing 2 the agent is working"（`text()` 会把换行压成空格，
            // 所以按 `\n` 切那一版是错的——第一次跑就是这么红的）。
            facts['lang.boardColumnsInEn'] = [...d().querySelectorAll('.column h4')].map((h) =>
              (h.querySelector('span')?.firstChild?.textContent ?? '').trim(),
            )
            facts['lang.boardHintsInEn'] = [...d().querySelectorAll('.col-hint')].map((h) =>
              text(h),
            )
            // ★ 切回列表再走：视图模式**存在 localStorage 里**，留在看板会让下一次
            //   （或同一轮后面的）断言去 `.list-pane .task-row` 上抓不到任何东西。
            const backToList = [...d().querySelectorAll('button')].find(
              (b) => b.textContent.trim() === 'List',
            )
            if (backToList) {
              click(backToList)
              await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
            }
            facts['lang.backToListInEn'] = !!backToList
          }

          // 切回中文，并以服务端为准确认它记住了
          langSelect.value = 'zh'
          langSelect.dispatchEvent(new Event('change', { bubbles: true }))
          await until(() => text(d().querySelector('.sidebar .nav-title')) === '新建任务', 40)
          const saved = await f.contentWindow
            .fetch('/api/identity')
            .then((r) => r.json())
            .catch(() => null)
          facts['lang.savedOnServer'] = saved ? saved.locale : null
        }

        // ══════════════ 新建任务的三步链：① 执行 → ② 审核 → ③ 行动 ══════════════
        //
        // 这一页原来只问一件事（交给谁执行），审核者藏在**执行者的长期配置**里
        // （`Agent.reviewerAgentId`），于是"这条任务会不会被审、由谁审、判完之后
        // 平台能替我做什么"三件事在提交之前全都看不见。现在三步都看得见，
        // 而且后一步默认由前一步推出来。
        //
        // ⚠️ **位置**（两处都不能挪）：
        //   · 排在**语言切换那一段之后**：那一段前面全是中文断言，语言切成英文
        //     会让它们全红，而这里量的是中文（zh 是文案的权威出处）；
        //   · 排在**D41 卸载工具那一段之前**：③ 列的是"**已装**工具包里的动作"，
        //     工具被卸载之后那个契约值就掉进"当前不可用"那一组，量到的不是同一件事。
        //
        // ⚠️ 夹具（两个审核者 + 一个执行者）由 `run.mjs` 造、三个 id 与动作名经
        //    URL 传进来：理由与工具那一段一样——探针跑在 `--virtual-time-budget` 下，
        //    `setTimeout` 是虚拟的而网络是真的，"自己造再等界面刷新"会**看早**。
        //    探针也**不许**靠"列表里的第一个执行者/第一个审核者"去找它们
        //    （那样夹具一多就会点错人，而症状是"读到的值莫名其妙"）。
        //
        // ⚠️ 这一段会**真的提交两次**（点「创建并派发」）。这是有意的：这一页最贵的
        //    错误是"界面上选的"与"发出去的请求体"不是同一件事，而那种错只有走完真
        //    入口、再从**接口**上把那条 run 读回来才看得见（三态在接口上的投影是
        //    分开的：`follow` / `none` / `override`）。夹具执行者的 runtime 是
        //    `generic`（命令 `agent-cli` 不存在）⇒ 那两条 run 会立刻失败，
        //    不会真的拉起一个模型去干活（见 `run.mjs` 里造夹具那一段的说明）。
        {
          const ntQuery = new URLSearchParams(location.search)
          const ntExecutorId = ntQuery.get('chainExecutor')
          const ntReviewerId = ntQuery.get('chainReviewer')
          const ntEmptyReviewerId = ntQuery.get('chainEmptyReviewer')
          const ntAction = ntQuery.get('chainAction')
          // 夹具 id 原样上报：`run.mjs` 拿它们与自己造出来的那三个比对——
          // "夹具没造出来"与"界面画错了"在报告里必须是两件事。
          facts['newtask.fixtureExecutorId'] = ntExecutorId
          facts['newtask.fixtureReviewerId'] = ntReviewerId
          facts['newtask.fixtureEmptyReviewerId'] = ntEmptyReviewerId
          facts['newtask.fixtureAction'] = ntAction

          /** 三步里第 n 步那一段。**按标题认**，不按顺序：少一步时顺序本身就全错位了。 */
          const ntStep = (ntTitle) =>
            [...d().querySelectorAll('.chain-step')].find(
              (s) => text(s.querySelector('.step-title')) === ntTitle,
            ) ?? null
          const ntActions = () => ntStep('③ 行动')
          const ntActionsText = () => text(ntActions())
          /** ① 那个下拉：认**取值里有夹具执行者**，不认"页面上的第一个 select"。 */
          const ntExecutorSelect = () =>
            [...d().querySelectorAll('select')].find((s) =>
              [...s.options].some((o) => o.value === ntExecutorId),
            ) ?? null
          /** ② 那个下拉：认它的取值里有 `follow`（三态的编码，见 `newtask-chain.ts`）。 */
          const ntReviewerSelect = () =>
            [...d().querySelectorAll('select')].find((s) =>
              [...s.options].some((o) => o.value === 'follow'),
            ) ?? null
          /**
           * ① 里那个「审核不通过时返工几次」下拉（D45）。
           *
           * ⚠️ 认的是"取值里同时有 0 和 5"这件事——不按"① 里的第二个 select"
           *    认（那是结构，加一个控件就错位）。`0`/`5` 是协议上的上下限，
           *    与 `SubmitRunRequest.maxReworks` 同源。
           */
          const ntReworkSelect = () =>
            [...d().querySelectorAll('select')].find((s) => {
              const vs = [...s.options].map((o) => o.value)
              return vs.includes('0') && vs.includes('5')
            }) ?? null
          /** 把返工次数拧到 n。 */
          const ntSetRework = async (ntValue) => {
            const ntSel = ntReworkSelect()
            if (!ntSel) return false
            ntSel.value = String(ntValue)
            ntSel.dispatchEvent(new Event('change', { bubbles: true }))
            return until(() => ntReworkSelect()?.value === String(ntValue), 40)
          }
          /** 标题输入框：工作目录那个在「高级」折叠区里，不算。 */
          const ntTitleInput = () => {
            const ntForm = d().querySelector('form')
            if (!ntForm) return null
            return (
              [...ntForm.querySelectorAll('input')].find((i) => !i.closest('details')) ?? null
            )
          }
          const ntSubmitButton = () =>
            [...d().querySelectorAll('form button')].find(
              (b) => b.getAttribute('type') === 'submit' || text(b) === '创建并派发',
            ) ?? null
          /** 接口上的 run 列表（端到端那两条的判据**只认这份**，不认页面上的字）。 */
          const ntRuns = () =>
            f.contentWindow
              .fetch('/api/runs')
              .then((r) => r.json())
              .then((p) => p.runs ?? [])
              .catch(() => [])
          /**
           * 那条 run 的**落库原文**（`GET /api/runs/<id>` 回的就是它）。
           *
           * ★ ③ 那两份端到端要判的是"请求体里那个 key 到没到库里"，而列表接口
           *   （`GET /api/runs`）给的是投影：它没有 `allowedActions`。所以必须回
           *   单条那个路由，判据是 `'allowedActions' in run`——**键在不在**这件事
           *   只有落库原文说得清（`undefined` 与 `[]` 在 JSON 里一个是"没有这个
           *   键"、一个是"空数组"，而它们的意思差了十万八千里）。
           */
          const ntRunRecord = (ntId) =>
            f.contentWindow
              .fetch(`/api/runs/${encodeURIComponent(ntId)}`)
              .then((r) => (r.ok ? r.json() : null))
              .catch(() => null)

          /**
           * 进这一页，并把 ① 选成夹具那个执行者。
           *
           * ⚠️ **先离开这一页再回来**，不能只写 `location.hash = '#/new'`：那一行在
           *    **已经**是 `#/new` 的时候是个空操作，组件不会重新挂载——而 ② 选的那一档
           *    是**组件状态**（`reviewerPick`，初值才是「跟随」），于是"上一次量完留下的
           *    那一档"会被当成这一次的默认值提交出去。实测踩过：提交①之前 ② 上还停着
           *    刚才量空态时选的「不自动审核」，于是那条 run 的 `reviewer.mode` 是 `none`
           *    ——**一条真 bug 的样子**（"跟随被写成了 null"），其实是探针自己的现场
           *    没收拾干净。所以下面还多量了一条 `followSubmitPick`：提交①之前 ② 上
           *    到底是哪一档，必须自己看得见。
           *
           * ⚠️ 每次重进都要重选 ①：`agentId` 也是**组件状态**，重进这一页时它会回到
           *    "生效中的默认"（播种的那个执行者），而不是上一次选的那个人。
           */
          const ntEnter = async () => {
            f.contentWindow.location.hash = '#/agents'
            await until(() => d().querySelectorAll('.agent-row').length > 0, 40)
            f.contentWindow.location.hash = '#/new'
            await until(() => text(d().querySelector('.view-head h2')) === '新建任务', 40)
            await until(() => !!ntExecutorSelect(), 40)
            const ntSel = ntExecutorSelect()
            if (!ntSel) return false
            ntSel.value = ntExecutorId
            ntSel.dispatchEvent(new Event('change', { bubbles: true }))
            // ②③ 都在 `{#if chosen}` 里：等它们真的画出来再往下量
            return until(() => !!ntReviewerSelect() && !!ntActions(), 60)
          }

          /** 把 ② 切成某一档（下拉的**取值**就是三态的编码）。 */
          const ntSetReviewer = async (ntValue) => {
            const ntSel = ntReviewerSelect()
            if (!ntSel) return false
            ntSel.value = ntValue
            ntSel.dispatchEvent(new Event('change', { bubbles: true }))
            return until(() => ntReviewerSelect()?.value === ntValue, 40)
          }

          /** ③ 里所有"能拧的旋钮"——**只读那一档**要求是一个都没有。 */
          const ntControlCount = () =>
            ntActions()
              ? ntActions().querySelectorAll('input, select, textarea, button').length
              : null
          /**
           * ③ 里的勾选框（可勾那一档才该有）。
           *
           * ⚠️ 只按 `input[type=checkbox]` 认，不按 `.action-option` 那类类名：
           *    这一条要证明的是"**这一栏有可勾的东西**"，类名改了不该把它弄红
           *    （真弄红了，读到的是"找不到框"，而不是"框没了"）。
           */
          const ntBoxes = () =>
            [...(ntActions()?.querySelectorAll('input[type=checkbox]') ?? [])]
          /** 勾着的那些框的契约值（`value` 就是契约值本身，判决里写的也是它）。 */
          const ntCheckedValues = () => ntBoxes().filter((b) => b.checked).map((b) => b.value)
          /**
           * 某一个框**旁边**那两样：契约值（`code`）与工具清单里的 `summary`。
           *
           * ⚠️ 从框往上找它那个 `<label>`，**不按顺序取**：这一栏按包分组，顺序
           *    由 `$tools` 决定，按位置取迟早会读到别的动作的说明。
           */
          const ntBoxParts = (ntValue) => {
            const ntBox = ntBoxes().find((b) => b.value === ntValue)
            if (!ntBox) return null
            const ntLabel = ntBox.closest('label') ?? ntBox.parentElement
            return {
              code: text(ntLabel ? ntLabel.querySelector('code') : null),
              summary: text(ntLabel ? ntLabel.querySelector('.action-summary') : null),
              checked: ntBox.checked,
            }
          }
          /**
           * 只读那一档的 chip（契约值 + `.chip-sub`）。
           *
           * ★ 这一份**不是**给可勾那一档用的：③ 可勾时契约值画在勾选框旁边，
           *   而"旧 daemon 兑现不了覆盖"那一档才退回 chip——那两个形状各量各的。
           */
          const ntChips = () =>
            [...(ntActions()?.querySelectorAll('.chip') ?? [])].map((c) =>
              text(c.querySelector('code')),
            )
          /** 切某一个框的勾选（`change` 事件用的是界面自己那个 `onchange`）。 */
          const ntSetBox = (ntValue, ntOn) => {
            const ntBox = ntBoxes().find((b) => b.value === ntValue)
            if (!ntBox) return false
            ntBox.checked = ntOn
            ntBox.dispatchEvent(new Event('change', { bubbles: true }))
            return true
          }
          /**
           * 去某一页点一次它自己的「刷新」按钮。
           *
           * ★ 为什么非要走界面：`$tools` / `$identity` 是**界面手里的那一份**，
           *   光靠接口改不了它（这也是 D41 那一段的教训）。下面两档要的正是
           *   "界面手里的那一份变了"之后 ③ 怎么画。
           */
          const ntRefreshView = async (ntHash, ntTitleSelector, ntTitle, ntRoot) => {
            f.contentWindow.location.hash = ntHash
            const ntHere = await until(
              () => text(d().querySelector(ntTitleSelector)) === ntTitle,
              60,
            )
            if (!ntHere) return false
            await wait(200)
            const ntBtn = [...d().querySelectorAll(`${ntRoot} button`)].find(
              (b) => text(b) === '刷新',
            )
            if (!ntBtn) return false
            click(ntBtn)
            return true
          }

          /**
           * 点「创建并派发」，然后把那条**新** run 从接口上读回来。
           *
           * ⚠️ 等的不是 toast：它有一个 4 秒的定时器，在虚拟时间下几乎立刻消失，
           *    拿它当"提交成功了"的信号会偶发地看早。等的是 hash 变成 `#/tasks`
           *    ——`submit()` 里那两次 POST 都是 await 过的，`go('tasks')` 在它们
           *    之后才跑，所以"落到任务页并且列表里有行"就等于"请求体真的发出去了"。
           *
           * ⚠️ 判"哪条是新的"用的是**提交之前那份 runId 名单**，不是"列表里的第一条"：
           *    这一页提交两次，靠位置找必然读到上一次那条。
           */
          const ntSubmit = async (ntTitle) => {
            const ntBefore = (await ntRuns()).map((r) => r.runId)
            const ntInput = ntTitleInput()
            if (!ntInput) return { reached: false, run: null }
            ntInput.value = ntTitle
            ntInput.dispatchEvent(new Event('input', { bubbles: true }))
            // 标题还没写进去时提交按钮是 disabled 的：先等它可点，再点
            const ntClickable = await until(() => {
              const ntBtn = ntSubmitButton()
              return !!ntBtn && !ntBtn.disabled
            }, 40)
            const ntBtn = ntSubmitButton()
            if (!ntClickable || !ntBtn) return { reached: false, run: null }
            click(ntBtn)
            const ntArrived = await until(
              () => f.contentWindow.location.hash === '#/tasks',
              60,
            )
            // 任务视图的模式存在 localStorage 里：万一停在看板，先切回列表
            // （不切的话 `.task-row` 一条都抓不到，而症状看起来像"任务没建出来"）
            if (ntArrived && d().querySelectorAll('.list-pane .task-row').length === 0) {
              const ntToList = [...d().querySelectorAll('button')].find(
                (b) => text(b) === '列表',
              )
              if (ntToList) {
                click(ntToList)
                await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
              }
            }
            const ntReached =
              f.contentWindow.location.hash === '#/tasks' &&
              d().querySelectorAll('.list-pane .task-row').length > 0
            let ntRun = null
            for (let i = 0; i < 40 && !ntRun; i++) {
              const ntAll = await ntRuns()
              ntRun = ntAll.find((r) => !ntBefore.includes(r.runId)) ?? null
              if (!ntRun) await wait(120)
            }
            return { reached: ntReached, run: ntRun }
          }

          // ── ① 选夹具执行者；三步的标题 ──
          facts['newtask.pageReady'] = await ntEnter()
          if (!facts['newtask.pageReady']) {
            errors.push(
              '新建任务页没能把 ① 选成夹具执行者（②③ 在 `{#if chosen}` 里，下面那一组会空过）',
            )
          }
          facts['newtask.stepTitles'] = [
            ...d().querySelectorAll('.chain-step .step-title'),
          ].map((el) => text(el))
          facts['newtask.executorSelectApplied'] = need('① 的取值', () =>
            ntExecutorSelect() ? ntExecutorSelect().value : null,
          )

          // ── ② 的三档与默认值（默认必须是「跟随」）──
          facts['newtask.reviewerOptionValues'] = need('② 的取值们', () =>
            ntReviewerSelect() ? [...ntReviewerSelect().options].map((o) => o.value) : null,
          )
          facts['newtask.reviewerDefaultPick'] = need('② 的默认取值', () =>
            ntReviewerSelect() ? ntReviewerSelect().value : null,
          )
          // ★ 「跟随」那一项的文字：它必须自己说清**跟到谁**（那是这一档唯一的含义）。
          facts['newtask.followOptionText'] = need('「跟随」那一项的文字', () => {
            const ntOpt = [...(ntReviewerSelect()?.options ?? [])].find(
              (o) => o.value === 'follow',
            )
            return ntOpt ? text(ntOpt) : null
          })

          // ── ③ 可勾那一档：勾选框、默认勾着什么、旁边写什么 ──
          //
          // ★ 这一页的 ③ 原来只读，现在**可勾**——而"改了什么、这一次生效"这件事
          //   只有走完真入口再从接口读回来才算数（下面那两条端到端）。
          //   这里先量"形状"，判据全部从**接口**取，不去猜：
          //     · 已装工具包声明的动作 ⇒ 框该有的条数（这一栏照**已装工具**画，
          //       不是只画那个审核者已有的那几条：只画已有的就只能减不能加，而
          //       "这一次允许一个它长期没有的动作"正是这份覆盖的意义）；
          //     · 夹具那个审核者当前生效的动作 ⇒ **默认该勾着**的那几条；
          //     · 工具清单里那句 `summary` ⇒ 框旁边必须逐字显示它。
          //   ⚠️ 三个都读不到时下面那几条会拿到 null —— 那是"探针没量到"，
          //      与"界面画错了"必须分得开，所以每一条都自带一条 guard 检查。
          const ntTools = await f.contentWindow
            .fetch('/api/tools')
            .then((r) => r.json())
            .then((p) => p.tools ?? null)
            .catch(() => null)
          const ntAgentsNow = await f.contentWindow
            .fetch('/api/agents')
            .then((r) => r.json())
            .then((p) => p.agents ?? null)
            .catch(() => null)
          facts['newtask.fixtureSourcesRead'] =
            Array.isArray(ntTools) && Array.isArray(ntAgentsNow)
          /** 已装工具包声明的全部动作（契约值）——框该有的就是这一份。 */
          facts['newtask.installedActions'] = (ntTools ?? [])
            .flatMap((t) =>
              (t.manifest?.actions ?? []).map((a) => `${t.slug}.${a.name}`),
            )
            .sort()
          facts['newtask.installedActionTotal'] = (facts['newtask.installedActions'] ?? []).length
          /** 夹具那个审核者当前生效的动作（默认该勾着的那一份）。 */
          facts['newtask.fixtureReviewerActions'] = need('夹具审核者的动作权限', () =>
            ntAgentsNow
              ? [
                  ...((ntAgentsNow.find((a) => a.id === ntReviewerId)?.allowedActions ?? [])),
                ].sort()
              : null,
          )
          /** 那个动作在工具清单里的 `summary`（框旁边必须**逐字**是它）。 */
          facts['newtask.fixtureActionSummary'] = need('那个动作的 summary', () => {
            const ntDot = ntAction.indexOf('.')
            const ntSlug = ntAction.slice(0, ntDot)
            const ntName = ntAction.slice(ntDot + 1)
            const ntTool = (ntTools ?? []).find((t) => t.slug === ntSlug)
            const ntAct = (ntTool?.manifest?.actions ?? []).find((a) => a.name === ntName)
            return ntAct ? ntAct.summary : null
          })

          facts['newtask.actionsSectionFound'] = ntActions() !== null
          // ⚠️ 这里原来的 `actionChips` / `actionChipSummary` 是**只读那一档**的
          //    判据（`.chip code` + `.chip-sub`）。③ 可勾之后这一档的契约值画在
          //    **勾选框旁边**，所以那两条搬到"旧 daemon 兑现不了覆盖"那一档去量
          //    ——那一档才是 chip 的形状（§ 档四）。
          facts['newtask.actionBoxValues'] = ntBoxes().map((b) => b.value).sort()
          facts['newtask.actionBoxCount'] = ntBoxes().length
          facts['newtask.actionCheckedValues'] = ntCheckedValues().sort()
          facts['newtask.actionCheckedCount'] = ntCheckedValues().length
          facts['newtask.actionFixtureBox'] = need('夹具那个动作的勾选框', () =>
            ntBoxParts(ntAction),
          )
          facts['newtask.actionsMentionsReviewer'] = ntActionsText()
          // 档三要用的**前提**：这一刻界面手里的清单是非空的（框就是证据）
          facts['newtask.toolsUnknownBoxesBefore'] = ntBoxes().length

          // ── ★ 「只对这一次任务生效」那句：**改过之后才该出现** ──
          //
          // ⚠️ 这一条不能只测"字在页面上"：默认状态（一下都没碰过）就**不该**有它
          //    ——有它等于对使用者说"你改了它的长期权限"，而那是句假话（长期那一份
          //    还好好的，这一页只是准备了一次覆盖）。反过来，动一下（取消一个勾）
          //    就必须出现：少了它，这一次的收紧会被当成改了那个审核者的长期权限。
          facts['newtask.actionsOnceOnlyWhenDefault'] = (ntActionsText() ?? '').includes(
            '只对这一次任务生效',
          )
          // ★ 动一下：把夹具那个动作的勾**取消**（夹具里那个审核者只有这一条）
          facts['newtask.untickDispatched'] = ntSetBox(ntAction, false)
          facts['newtask.actionsOnceOnlyAfterUntick'] = await until(
            () => (ntActionsText() ?? '').includes('只对这一次任务生效'),
            30,
          )
          facts['newtask.clearedCheckedValues'] = ntCheckedValues()
          facts['newtask.actionsClearedHint'] = ntActionsText()
          // ★ 再勾回来 ⇒ 勾选结果又与审核者当前那份**一致**了 ⇒ 那句必须消失。
          //   判据是"改没改"（集合相等），不是"碰没碰过"：写成"碰过就一直显示"
          //   的实现会把"其实没改"报成改了，从而**多带一份覆盖**出去。
          facts['newtask.retickDispatched'] = ntSetBox(ntAction, true)
          // 等这一次重渲染**落地**再读：判据用"取消那一档那句话没了"——
          // 它一定会变，所以它不是"还在等"而是"已经过去了"的证据。
          facts['newtask.retickSettled'] = await until(
            () => !(ntActionsText() ?? '').includes('这一次一个动作都不勾'),
            30,
          )
          facts['newtask.actionsOnceOnlyAfterRetick'] = (ntActionsText() ?? '').includes(
            '只对这一次任务生效',
          )

          // ── ★ ③ 的固定参数（D43 / D44）：默认值 = 审核者长期那份；改过才说"只对这一次" ──
          //
          // 固定参数与白名单是同一件事的两半：白名单回答"这一次能不能触发"，固定
          // 参数回答"触发时用什么参数"。所以这一组量的东西与上面白名单那一组
          // **一一对应**：
          //   · D44 之后编辑器长在「左选右配」的**右栏**（`ActionPicker`），只对

          const ntPicker = () => ntStep('③ 行动')?.querySelector('.action-perms') ?? null

          }
          // 先确保选中夹具那个动作（默认选中规则也应选中它，点一下更稳）
          await ntEnsureAction(ntAction)
          facts['newtask.paramEditorForFixture'] = need('③ 上夹具动作的配置面板', () => {
            const picker = ntPicker()
            if (!picker) return null

          // ★ 界面反馈修的点：字符串参数必须有**显式**的「不固定（模型填）/ 固定」

            const ok = await until(() => {

              if (hit) snap = { hintShown: true, mode: sel.value }

            if (!ok && snap === null) {

            facts['newtask.paramFixedPendingHint'] = snap

          // 填上值 ⇒ 提示消失、开关停在「固定」、输入框里就是那个值

          {

          const ntParamInput = ntParamTextInput(ntParamEditor())

          const ntParamInput2 = ntParamTextInput(ntParamEditor())

            () => !(ntActionsText() ?? '').includes('固定参数改了'),

          //   （读一下再回新建任务页——后面那几档都从这一页继续）
          facts['newtask.agentDetailFixedChip'] = await (async () => {
            f.contentWindow.location.hash = '#/agents'
            // ⚠️ 不能用 `until`：它只回 boolean（"等到了"），拿不回那个元素。

          // ── ② 指名换一个审核者（那个**没有配动作**的）⇒ ③ 该改说后果 ──
          //
          // ★ 这一档与"不审"那一档**不同**：这里有一个审核者，所以"判决"是有的，
          //   它只是什么也不能触发。两句文案必须分开（`actionsNoneHint` vs

          facts['newtask.pickApplied'] = await ntSetReviewer(`pick:${ntEmptyReviewerId}`)
          await until(
            () => (ntActionsText() ?? '').includes('现在没有一个能用的动作'),
            30,
          )
          // "只对这一次生效"那句：它是 ② 那一段里的一条 `.hint`（下拉的
          // `textContent` 会带上所有选项，所以整段的文字里一定含选项名——

          facts['newtask.onceOnlyAfterPick'] = (text(ntStep('② 审核')) ?? '').includes(

          )
          facts['newtask.emptyPermsActionsText'] = ntActionsText()
          facts['newtask.emptyPermsChips'] = ntChips()
          // ★ 可勾那一档的第二个形态：审核者**一个动作都没有** ⇒ 框照画（框是照

          facts['newtask.emptyPermsBoxValues'] = ntBoxes().map((b) => b.value).sort()
          facts['newtask.emptyPermsCheckedValues'] = ntCheckedValues()

          //
          // ★ 这一档**没有审核者**（`chain.reviewer === null`）。所以它说的不能是
          //   上面那一档那句"它的判决只会给出结论"——这一档连判决都不会有。
          facts['newtask.noneApplied'] = await ntSetReviewer('none')
          await until(() => (ntActionsText() ?? '').includes('这次没有审核者'), 30)
          facts['newtask.onceOnlyAfterNone'] = (text(ntStep('② 审核')) ?? '').includes(
            '只对这一次任务生效',
          )
          facts['newtask.noneActionsText'] = ntActionsText()
          facts['newtask.noneActionsControlCount'] = ntControlCount()

          // ══════════════════════════════════════════════════════════════

          //

          //   在 store 里都表现为空数组（`toolsKnown` 的注释就是这件事）——区别是
          //   失败时 store **还留着上一次取到的那份清单**（`load()` 只在成功时
          //   `set`）。于是这正是最危险的那一刻：清单非空，而这一栏"说不准它有哪些
          //   动作"；写成"空了就说没有动作"的实现会在这时对使用者说一句关于**他
          //   自己的权限**的假话。
          //
          // ★ 造法是"让 `/api/tools` 真的失败" + 在「工具」页点**它自己的**刷新：
          //   走的是界面那条真路径（`loadTools()` → `loadError['tools']`），
          //   探针不许直接把 store 改成那个样子。
          const ntRealFetch = f.contentWindow.fetch
          /** 让 `/api/tools` 失败（其它请求原样放行）。 */
          const ntFailToolsFetch = () => {
            const ntReal = ntRealFetch
            f.contentWindow.fetch = function (input, init) {
              const ntUrl =
                typeof input === 'string' ? input : input && input.url ? input.url : ''
              if (String(ntUrl).includes('/api/tools')) {
                return Promise.reject(new TypeError('探针：这一次让 /api/tools 取失败'))
              }
              return ntReal.call(f.contentWindow, input, init)
            }
            return f.contentWindow.fetch !== ntRealFetch
          }
          facts['newtask.toolsUnknownPatched'] = ntFailToolsFetch()
          facts['newtask.toolsUnknownRefreshClicked'] = await ntRefreshView(
            '#/tools',
            '.view-head h2',
            '工具',
            '.view-head',
          )
          // 失败**真的落到了界面上**：那一页显示的就是 store 里记下的那条
          // `loadError`（判据是探针自己编的那句话原样出现在页面上）。
          const ntToolsErrShown = await until(
            () => !!d().querySelector('.main .notice.bad'),
            30,
          )
          facts['newtask.toolsUnknownViewError'] = ntToolsErrShown
            ? (text(d().querySelector('.main .notice.bad')) ?? '').slice(0, 120)
            : null
          // 回到新建任务页（重进 ⇒ 重新选 ①），看 ③ 怎么画
          facts['newtask.toolsUnknownEntered'] = await ntEnter()
          await until(() => (ntActionsText() ?? '').includes('工具清单还没到'), 30)
          facts['newtask.toolsUnknownBoxValues'] = ntBoxes().map((b) => b.value)
          facts['newtask.toolsUnknownText'] = ntActionsText()
          facts['newtask.toolsUnknownChips'] = ntChips()
          facts['newtask.toolsUnknownControlCount'] = ntControlCount()
          // 收尾：还原 fetch + 再点一次刷新，让界面手里的清单回到真的那一份
          f.contentWindow.fetch = ntRealFetch
          facts['newtask.toolsUnknownRefreshBack'] = await ntRefreshView(
            '#/tools',
            '.view-head h2',
            '工具',
            '.view-head',

          facts['newtask.toolsUnknownEnteredBack'] = await ntEnter()

          facts['newtask.toolsUnknownRestored'] = await until(
            () =>
              ntBoxes().length > 0 &&
              ntBoxes().length === (facts['newtask.installedActionTotal'] ?? -1),
            40,
          )

          // ══════════════════════════════════════════════════════════════
          // 档四：这个 daemon **兑现不了这一栏的覆盖** ⇒ 退回只读（画 chip）
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 真老 daemon 在探针里造不出来（这一台跑的就是新 daemon），所以现场用
          //   **可达的等价状态**造：把 `/api/identity` 回的 `capabilities` 里

          //   再在「智能体」页点它自己的刷新——那一页的 `refresh()` 会

          //

          const ntStripWhitelistCap = () => {

            f.contentWindow.fetch = function (input, init) {
              const ntUrl =
                typeof input === 'string' ? input : input && input.url ? input.url : ''
              if (!String(ntUrl).includes('/api/identity')) {

              }
              return ntReal.call(f.contentWindow, input, init).then(async (res) => {

                ntBody.capabilities = (ntBody.capabilities ?? []).filter(

                )
                return new Response(JSON.stringify(ntBody), {

              })
            }

          }
          facts['newtask.oldDaemonPatched'] = ntStripWhitelistCap()
          facts['newtask.oldDaemonRefreshClicked'] = await ntRefreshView(
            '#/agents',
            '.pane-head h2',
            '智能体',
            '.pane-head',

          facts['newtask.oldDaemonCapsAfterPatch'] = await f.contentWindow
            .fetch('/api/identity')
            .then((r) => r.json())
            .then((p) => p.capabilities ?? null)
            .catch(() => null)

          await until(() => (ntActionsText() ?? '').includes('这一栏这一次改不了'), 30)
          facts['newtask.oldDaemonBoxValues'] = ntBoxes().map((b) => b.value)
          facts['newtask.oldDaemonControlCount'] = ntControlCount()
          facts['newtask.oldDaemonChips'] = ntChips()
          facts['newtask.oldDaemonChipSummary'] = need('只读那一档 chip 旁边的 summary', () => {
            const ntChip = [...(ntActions()?.querySelectorAll('.chip') ?? [])].find(

            : null

          facts['newtask.oldDaemonRefreshBack'] = await ntRefreshView(

            '.pane-head h2',
            '智能体',
            '.pane-head',

          facts['newtask.oldDaemonRestored'] = await until(
            () =>

          facts['newtask.fetchRestored'] = f.contentWindow.fetch === ntRealFetch

          // ★ 提交之前**原样记下 ② 上是哪一档**（这一条只观察、不设置）：它若不

          facts['newtask.followSubmitPick'] = ntReviewerSelect()
            ? ntReviewerSelect().value
            : null
          // ★ E1 的前提：③ 上一下都没碰过（勾着的仍是审核者当前那份）
          facts['newtask.followSubmitChecked'] = ntCheckedValues()
          const ntFollowSubmit = await ntSubmit('探针的三步链夹具：跟随（别动它）')
          facts['newtask.followSubmitReachedTasks'] = ntFollowSubmit.reached
          facts['newtask.followRunAgentId'] = ntFollowSubmit.run
            ? ntFollowSubmit.run.agentId
            : null
          facts['newtask.followRunMode'] = ntFollowSubmit.run?.reviewer?.mode ?? null
          if (ntFollowSubmit.run) {
            const ntFollowRec = await ntRunRecord(ntFollowSubmit.run.runId)
            facts['newtask.followRunRecordRead'] = ntFollowRec !== null
            facts['newtask.followRunHasAllowedActionsKey'] = ntFollowRec
              ? Object.prototype.hasOwnProperty.call(ntFollowRec, 'allowedActions')
              : null
            facts['newtask.followRunAllowedActions'] = ntFollowRec
              ? (ntFollowRec.allowedActions ?? null)
              : null
          } else {
            facts['newtask.followRunRecordRead'] = false
            facts['newtask.followRunHasAllowedActionsKey'] = null
            facts['newtask.followRunAllowedActions'] = null
          }

          // ── E2：③ 上一个都不勾再提交 ⇒ `[]`（键在、空数组）──
          await ntEnter()
          // ★ 动一下：把夹具那个动作的勾取消（夹具里那个审核者只有这一条）
          facts['newtask.clearedSubmitUntick'] = ntSetBox(ntAction, false)
          // 提交之前**原样记下 ③ 上是哪几个勾**（只观察、不设置）：接口上那个 `[]`
          // 必须对应界面上这个状态，否则这条断言量到的是别的东西。
          facts['newtask.clearedSubmitChecked'] = await until(
            () => ntCheckedValues().length === 0,
            30,
          )
          facts['newtask.clearedSubmitCheckedValues'] = ntCheckedValues()
          const ntClearedSubmit = await ntSubmit('探针的三步链夹具：一个动作都不许（别动它）')
          facts['newtask.clearedSubmitReachedTasks'] = ntClearedSubmit.reached
          facts['newtask.clearedRunAgentId'] = ntClearedSubmit.run
            ? ntClearedSubmit.run.agentId
            : null
          if (ntClearedSubmit.run) {
            const ntClearedRec = await ntRunRecord(ntClearedSubmit.run.runId)
            facts['newtask.clearedRunRecordRead'] = ntClearedRec !== null
            facts['newtask.clearedRunHasAllowedActionsKey'] = ntClearedRec
              ? Object.prototype.hasOwnProperty.call(ntClearedRec, 'allowedActions')
              : null
            facts['newtask.clearedRunAllowedActions'] = ntClearedRec
              ? (ntClearedRec.allowedActions ?? null)
              : null
          } else {
            facts['newtask.clearedRunRecordRead'] = false
            facts['newtask.clearedRunHasAllowedActionsKey'] = null
            facts['newtask.clearedRunAllowedActions'] = null
          }

          // ── E3：返工次数（D45）──
          //
          // 这是这条回路在**界面 ↔ 请求体 ↔ 落库**之间唯一可能断掉的地方：
          // 界面选了 2、请求体没带、或者 daemon 没落库，使用者都会得到
          // "配了不返工"而没有任何提示。所以两端都量：
          //   ① 进页面时它必须是 **0**（默认不返工，不能替使用者决定多跑几轮）；
          //   ② 拧到 2 再提交 ⇒ 落库原文里 `maxReworks === 2`。
          await ntEnter()
          facts['newtask.reworkDefault'] = ntReworkSelect()?.value ?? null
          facts['newtask.setRework'] = await ntSetRework(2)
          const ntReworkSubmit = await ntSubmit('探针的三步链夹具：返工 2 次（别动它）')
          facts['newtask.reworkSubmitReachedTasks'] = ntReworkSubmit.reached
          if (ntReworkSubmit.run) {
            const ntReworkRec = await ntRunRecord(ntReworkSubmit.run.runId)
            facts['newtask.reworkRunRecordRead'] = ntReworkRec !== null
            facts['newtask.reworkRunMaxReworks'] = ntReworkRec
              ? (ntReworkRec.maxReworks ?? null)
              : null
          } else {
            facts['newtask.reworkRunRecordRead'] = false
            facts['newtask.reworkRunMaxReworks'] = null
          }

          await ntEnter()
          await ntSetReviewer('none')
          const ntNoneSubmit = await ntSubmit('探针的三步链夹具：不自动审核（别动它）')
          facts['newtask.noneSubmitReachedTasks'] = ntNoneSubmit.reached
          facts['newtask.noneRunAgentId'] = ntNoneSubmit.run ? ntNoneSubmit.run.agentId : null
          facts['newtask.noneRunMode'] = ntNoneSubmit.run?.reviewer?.mode ?? null
        }

        // ══════════════ 一个工具包都没装：那一栏的空态（D41）══════════════
        //
        // 使用者点名要的空态是"还没有装工具包 ⇒ 现在没有任何动作可授权"，而且要
        // **指向「工具」页**——不是留一片空白，也不是显示一个空的分组标题。
        //
        // ★ 这一段必须**自己把现场造成那个样子**：夹具里装着 `probe-tool`（前面
        //   整套"工具"的检查都靠它），所以"一个都没装"这个状态在探针跑到这里之前
        //   根本不存在。做法与夹具一样**走真接口**：先把它从挂着的 agent 上摘掉
        //   （还有 agent 挂着时卸载会被服务端拒），再卸载，然后在「工具」页点**刷新**
        //   让界面的 `$tools` 真的空掉。
        //
        // ⚠️ 它排在**最后**：这一步之后工具都没了，前面那些靠夹具工具的检查全都
        //    量不到了，所以不能在中间做。剩下的只有"新建页不崩"那一条，它不依赖工具。
        // ⚠️ 每一步都**如实上报**（卸载被拒 / 刷新按钮找不到都没有藏起来）：
        //    这一组绿的意思是"空态真的被看到过"，不是"没跑到"。
        {
          const fetchAgents = () =>
            f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then((p) => p.agents ?? [])
              .catch(() => [])
          const fetchTools = () =>
            f.contentWindow
              .fetch('/api/tools')
              .then((r) => r.json())
              .then((p) => p.tools ?? [])
              .catch(() => [])
          // 现场起点：装着哪些工具。下面每一阶段都会改动它，所以先记一笔。
          const toolsAtStart = await fetchTools()
          facts['noTools.slugsBefore'] = toolsAtStart.map((x) => x.slug)
          /** 「工具」页那个**刷新**按钮：界面的 `$tools` 靠它重新取一遍。 */
          const refreshToolsInUi = async () => {
            f.contentWindow.location.hash = '#/tools'
            await until(() => !!d().querySelector('.view-head h2'), 60)
            await wait(300)
            const btn = [...d().querySelectorAll('.view-head button')].find(
              (b) => text(b) === '刷新',
            )
            if (btn) {
              click(btn)
              // ⚠️ 这一次刷新是**真的网络请求**，所以要**等它落地**再往下走：
              //    `--virtual-time-budget` 下 `setTimeout` 是虚拟的，固定等 700ms
              //    会在请求回来之前就继续（第一次跑就是这么红的）。
              await wait(600)
            }
            return !!btn
          }

          // ══════════════════════════════════════════════════════════════
          // 阶段 A：**配过、但提供它的包被卸载了** ⇒ 保存被服务端拒（400）
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 这一阶段复现的是使用者报的那条路径："打开审核者的「行动权限」→
          //   名单里还留着已经失效的名字 → 改点别的再保存 → 400"，而使用者觉得
          //   自己什么都没动。
          //
          //   现场用**可达的**等价状态造，而且每一步都走真入口：
          //     ① 在界面上把 `probe-tool-ui.ping` 勾给审核员并保存（那个包装着，
          //        写入口收）；
          //     ② 走接口把 `probe-tool-ui` 卸载 —— 那条权限立刻变成"配过、但没有
          //        出处"；
          //     ③ 让界面的 `$tools` 跟着刷新；
          //     ④ 再打开编辑：那条必须**列出来**；勾一个**仍然可用**的动作再保存
          //        ⇒ 这一份 patch 里带着那条没有出处的名字 ⇒ **400**。
          //
          //   ⚠️ 授权那一步必须走**界面**（不能直接 PATCH）：界面的 agent 列表是
          //      启动时取的一份，绕过界面改库之后它会**变旧**，于是"草稿 vs 库里
          //      那份"的比较全是错的——第一次跑就是这么红的（编辑态里根本看不到
          //      那条，因为界面手里的名单还是旧的）。
          //
          //   ⚠️ 真实老库（`reviewStandard.allowedActions` 里躺着 `comment.create`
          //      这类旧的内置动作名）在探针里**造不出来**：写入口按设计拒绝裸名，
          //      而且**刻意忽略**那个老字段（见 daemon 的 `parseReviewStandard`）。
          //      所以这里覆盖的是**同一段界面 + 同一条接口路径**的等价状态；旧名字
          //      本身由 `apps/web/src/lib/agent-actions.test.ts` 钉住。
          const holder = (await fetchAgents()).find((a) =>
            (a.allowedActions ?? []).includes('probe-tool.append-note'),
          )
          facts['noTools.staleHolderFound'] = !!holder
          const uiTool = toolsAtStart.find((t) => t.slug === 'probe-tool-ui')
          facts['noTools.staleToolFound'] = !!uiTool
          /** 打开某个 agent 的详情（按名字找行，并等右栏**真的换成它**）。 */
          const openAgentDetail = async (name) => {
            f.contentWindow.location.hash = '#/agents'
            await until(() => d().querySelectorAll('.agent-row').length > 0, 40)
            await wait(200)
            const row = [...d().querySelectorAll('.agent-row')].find((r) =>
              (r.textContent ?? '').includes(name),
            )
            if (!row) return false
            click(row.querySelector('.agent-item'))
            return until(() => text(d().querySelector('.detail h2')) === name, 40)
          }
          const detailButton = (label) =>
            [...d().querySelectorAll('.detail button')].find((b) => text(b) === label)
          const saveButton = () =>
            [...d().querySelectorAll('.detail button')].find((b) => text(b).startsWith('保存'))
          const allowedActionsOf = (name) =>
            f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then(
                (p) => (p.agents ?? []).find((a) => a.name === name)?.allowedActions ?? [],
              )
              .catch(() => null)

          if (holder && uiTool) {
            // ① 走界面勾上 `probe-tool-ui.ping` 并保存
            facts['noTools.staleDetailSwitched'] = await openAgentDetail(holder.name)
            await wait(200)
            const grantEdit = detailButton('编辑')
            if (grantEdit) {
              click(grantEdit)
              await until(() => !!d().querySelector('.action-perms'), 40)
              const pingBox = [...d().querySelectorAll('.action-perms .ap-ck')].find(
                (i) => i.value === 'probe-tool-ui.ping',
              )
              facts['noTools.stalePingBoxFound'] = !!pingBox
              if (pingBox) {
                pingBox.checked = true
                pingBox.dispatchEvent(new Event('change', { bubbles: true }))
                await wait(200)
              }
              const grantSave = saveButton()
              if (grantSave) {
                click(grantSave)
                await until(() => !d().querySelector('.action-perms'), 40)
                await wait(200)
              }
            }
            facts['noTools.staleGrantOk'] = (await allowedActionsOf(holder.name))?.includes(
              'probe-tool-ui.ping',
            )

            // ② 卸载那个包（没有 agent 挂它 ⇒ 不会被拒）⇒ 那条权限失去出处
            const dropped = await f.contentWindow
              .fetch(`/api/tools/${encodeURIComponent(uiTool.id)}`, { method: 'DELETE' })
              .then((r) => r.ok)
              .catch(() => false)
            facts['noTools.staleUninstallOk'] = dropped

            // ③ 让界面的 `$tools` 跟着少掉那一组
            await refreshToolsInUi()

            // ④ 回到它的详情 → 编辑：那条**列出来**，勾一个可用的动作，保存 ⇒ 400
            await openAgentDetail(holder.name)
            await wait(200)
            const staleEditBtn = detailButton('编辑')
            if (staleEditBtn) {
              click(staleEditBtn)
              await until(() => !!d().querySelector('.action-perms'), 40)
              await wait(150)
              const stalePerms = d().querySelector('.action-perms')
              facts['noTools.staleListedInEdit'] = !!(
                stalePerms && (text(stalePerms) ?? '').includes('probe-tool-ui.ping')
              )
              // ★ 勾一个**可用**的动作：使用者会做的那种改动（改名字也一样），
              //   它让这一份 patch 里带上了那条没有出处的名字。
              const liveBox = [
                ...(stalePerms?.querySelectorAll('.ap-ck') ?? []),
              ].find((i) => i.value === 'probe-tool.clean-notes')
              facts['noTools.staleLiveBoxFound'] = !!liveBox
              if (liveBox) {
                liveBox.checked = true
                liveBox.dispatchEvent(new Event('change', { bubbles: true }))
                await wait(200)
              }
              // 服务端对这一份名单的原话（拿同一份名单直接问接口，作为"逐字"的基准）
              const refused = await f.contentWindow
                .fetch(`/api/agents/${encodeURIComponent(holder.id)}`, {
                  method: 'PATCH',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    allowedActions: ['probe-tool.append-note', 'probe-tool.clean-notes', 'probe-tool-ui.ping'],
                  }),
                })
                .then(async (r) => ({ ok: r.ok, body: await r.json().catch(() => null) }))
                .catch(() => null)
              facts['noTools.staleServerRefuses'] = refused?.ok === false
              facts['noTools.staleServerErrorText'] = refused?.body?.error ?? null

              const staleSaveBtn = saveButton()
              facts['noTools.staleSaveButton'] = !!staleSaveBtn
              if (staleSaveBtn) {
                click(staleSaveBtn)
                await until(() => !!d().querySelector('.detail .notice.bad'), 40)
                await wait(250)
                const shownError = text(d().querySelector('.detail .notice.bad'))
                facts['noTools.staleErrorShown'] = shownError
                // ★ ① **原样显示**：页面上那句与接口回的那句**逐字相同**
                //   （不吞掉、也不自己编一句概括——服务端那句里已经说了是哪一条、
                //   为什么）。
                facts['noTools.staleErrorVerbatim'] =
                  typeof shownError === 'string' &&
                  shownError !== '' &&
                  typeof facts['noTools.staleServerErrorText'] === 'string' &&
                  shownError === facts['noTools.staleServerErrorText']
                // ★ ② 还停在编辑态（没有假装保存成功）
                facts['noTools.staleStillEditing'] = !!d().querySelector('.action-perms')
                // ★ ③ 那条名字**还在草稿里**：被拒之后不许静默剔除
                facts['noTools.staleKeptAfterRefusal'] = (
                  text(d().querySelector('.action-perms')) ?? ''
                ).includes('probe-tool-ui.ping')

                // ── 出口：点「移除」→ 保存 ⇒ 这一次能存进去 ──
                const staleDropBtn = [
                  ...(d().querySelector('.action-perms')?.querySelectorAll('button') ?? []),
                ].find((b) => text(b) === '移除')
                facts['noTools.staleDropButton'] = !!staleDropBtn
                if (staleDropBtn) {
                  click(staleDropBtn)
                  await wait(200)
                  const retryBtn = saveButton()
                  if (retryBtn) {
                    click(retryBtn)
                    await until(() => !d().querySelector('.action-perms'), 40)
                    await wait(250)
                    const after = await allowedActionsOf(holder.name)
                    facts['noTools.staleFixedOnServer'] =
                      Array.isArray(after) && !after.includes('probe-tool-ui.ping')
                  }
                }
              }
            }
          }

          // ══════════════════════════════════════════════════════════════
          // 阶段 B：**一个工具包都没装** ⇒ 「行动权限」那一栏的空态
          // ══════════════════════════════════════════════════════════════
          const agentsNow = await fetchAgents()
          const toolsNow = await fetchTools()
          let refusals = 0
          for (const tool of toolsNow) {
            // ① 摘掉所有挂着它的 agent（不摘的话卸载会被 400 拒）
            for (const a of agentsNow.filter((x) => (x.toolIds ?? []).includes(tool.id))) {
              const put = await f.contentWindow.fetch(
                `/api/agents/${encodeURIComponent(a.id)}/tools`,
                {
                  method: 'PUT',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ toolIds: [] }),
                },
              )
              if (!put.ok) refusals++
            }
            // ② 卸载
            const del = await f.contentWindow.fetch(
              `/api/tools/${encodeURIComponent(tool.id)}`,
              { method: 'DELETE' },
            )
            if (!del.ok) refusals++
          }
          facts['noTools.refusals'] = refusals
          // ③ 「工具」页那个**刷新**按钮：界面的 `$tools` 靠它重新取一遍
          f.contentWindow.location.hash = '#/tools'
          await until(() => !!d().querySelector('.view-head h2'), 60)
          await wait(300)
          const refreshBtn = [...d().querySelectorAll('.view-head button')].find(
            (b) => text(b) === '刷新',
          )
          facts['noTools.refreshButtonFound'] = !!refreshBtn
          if (refreshBtn) {
            click(refreshBtn)
            // ⚠️ 这一次刷新是**真的网络请求**，所以必须**等它落地**再量：`--virtual-time-budget`
            //    下 `setTimeout` 是虚拟的，固定等 700ms 会在请求回来之前就往下走
            //    （第一次跑就是这么红的：界面那一刻还画着旧列表）。
            // ⚠️ 判据读的是 `.main` 的 `textContent`，**不是 `d().textContent`**：
            //    `Document` 节点的 `textContent` 按 DOM 规范返回 **null**，写成
            //    `(d().textContent ?? '').includes(...)` 永远是 false —— 那种写法
            //    在**否定**断言里会静默地"永远通过"（本文件别处有几条就是这样），
            //    在肯定断言里则永远失败（第一次跑就是这么红的）。
            facts['noTools.viewEmptyState'] = await until(
              () => (text(d().querySelector('.main')) ?? '').includes('还没有装任何工具'),
              25,
            )
            // 空态没等到时**把那一刻的原文记下来**：否则"没等到"与"文案改了"
            // 在报告里长得一样（两种都要看得见）。
            facts['noTools.viewTextAfterRefresh'] = (
              text(d().querySelector('.main')) ?? ''
            ).slice(0, 160)
          } else {
            facts['noTools.viewEmptyState'] = false
          }

          // ── 只读态：审核者详情里的「行动权限」那一行 ──
          //
          //   夹具里那个**已经被固化过**的老形态审核者（走完上面 D38 那一段之后：
          //   有内联标准、没挂 skill、一个动作权限都没有）正是要看的形状。
          f.contentWindow.location.hash = '#/agents'
          await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
          await wait(300)
          const migratedRow = [...d().querySelectorAll('.agent-row')].find((row) =>
            (row.textContent ?? '').includes('探针用的老形态审核者'),
          )
          facts['noTools.fixtureRowFound'] = !!migratedRow
          if (migratedRow) {
            click(migratedRow.querySelector('.agent-item'))
            // ⚠️ 等右栏真的换成**这个** agent：只等 `.detail` 会立刻返回，读到上一个
            facts['noTools.detailSwitched'] = await until(
              () => text(d().querySelector('.detail h2')) === '探针用的老形态审核者',
              60,
            )
            await wait(300)
            const roSection =
              [...d().querySelectorAll('.detail .section')].find((s) =>
                (text(s.querySelector('h3')) ?? '').includes('行动权限'),
              ) ?? null
            const roRow = [...(roSection?.querySelectorAll('.field-row') ?? [])].find((r) =>
              text(r.querySelector('.row-label')) === '允许触发的动作',
            )
            facts['noTools.readOnlyText'] = text(roRow)
            // ★ 空态的两半：说清"为什么没有"，以及一个去「工具」页的去处
            facts['noTools.readOnlyHasEmptyState'] = !!(
              roRow &&
              (text(roRow) ?? '').includes('还没有装任何工具包') &&
              (text(roRow) ?? '').includes('没有任何动作可授权')
            )
            facts['noTools.readOnlyHasChip'] = !!(roRow && roRow.querySelector('.chip'))
            facts['noTools.readOnlyGoButton'] = text(
              [...(roRow?.querySelectorAll('button') ?? [])][0] ?? null,
            )

            // ── 编辑态：那一栏由 `ActionPermissions.svelte` 画 ──
            const editBtnNoTools = [...d().querySelectorAll('.detail button')].find(
              (b) => text(b) === '编辑',
            )
            if (editBtnNoTools) {
              click(editBtnNoTools)
              await until(() => !!d().querySelector('.action-perms'), 60)
              await wait(200)
              const perms = d().querySelector('.action-perms')
              facts['noTools.formText'] = text(perms)
              facts['noTools.formHasEmptyState'] = !!(
                perms &&
                (text(perms) ?? '').includes('还没有装任何工具包') &&
                (text(perms) ?? '').includes('没有任何动作可授权')
              )
              // ★ 不许有"空的分组标题"：既没有分组容器，也没有那一组的标题
              //
              //   ⚠️ 判据是**那一组的标题文本**（`tools.stdToolsHeading` = 「已装工具的动作」），
              //      不是"`.field-label` 一处都没有"：那一栏里后来长出了别的分组
              //      （"配过、但现在解析不出来"那一组也有自己的 `.field-label`），
              //      按 `.field-label` 判会把一个**合理**的分组误认成"空标题"。
              //      要拦的是"标题在、下面什么都没有"。
              facts['noTools.formHasGroupBox'] = !!(
                perms?.querySelector('.ap-group') ?? null
              )
              facts['noTools.formHasToolsHeading'] = (text(perms) ?? '').includes(
                '已装工具的动作',
              )
              // D44：编辑态那一栏是「左选右配」的 ActionPicker（根 `.action-perms`）。
              //   空态下它**仍在**（空态画在组件内部），但没有分组、没有勾选框。
              facts['noTools.formPickerShown'] = !!perms
              facts['noTools.formHasAnyCheckbox'] = !!(
                perms?.querySelector('input[type=checkbox]') ?? null
              )
              // ★ 那个去处**真的通**：点了之后落到「工具」页
              const goToolsBtn = [...(perms?.querySelectorAll('button') ?? [])].find((b) =>
                (text(b) ?? '').includes('工具'),
              )
              facts['noTools.formGoButton'] = text(goToolsBtn ?? null)
              if (goToolsBtn) {
                click(goToolsBtn)
                await wait(600)
                facts['noTools.linkNavigatesToTools'] =
                  f.contentWindow.location.hash === '#/tools' &&
                  text(d().querySelector('.view-head h2')) === '工具'
              }
            }
          }

          // ══════════════════════════════════════════════════════════════
          // 「配过、但现在解析不出来」：包被卸载之后那条权限该怎么显示
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 这是**老数据那条兜底显示的孪生情形**，而且它**现在就能造成**：
          //   前面在详情里把 `probe-tool.append-note` 勾给了审核员，刚才又把
          //   `probe-tool` 卸载了 —— 于是那个 agent 身上留着一条**没有任何已装包
          //   提供**的权限。同一件事在内置动作被移除之后也会发生在老数据上
          //   （`comment.create` 这类名字再也不是动作了）。
          //
          //   要求是三条一起成立，缺一条就是错：
          //     ① 契约值**照原样留着**（不静默过滤掉——"配过"这件事不能抹）；
          //     ② 旁边明说它**当前不可用**（不假装还能用）；
          //     ③ 编辑态里**列得出来、去得掉**（否则一保存就被服务端拒，而错误里
          //        点名的那个动作在界面上根本不存在 —— 那是个死胡同）。
          const deadAction = 'probe-tool.append-note'
          // ⚠️ 这里复用**阶段 A** 就已找到的那个 agent（它身上配着 `deadAction`）：
          //    按动作名重新找一遍会在阶段 A 改过名单之后失手，而且同一个东西
          //    不该有两个出处。
          facts['noTools.deadHolderFound'] = !!holder
          if (holder) {
            f.contentWindow.location.hash = '#/agents'
            await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
            await wait(300)
            const holderRow = [...d().querySelectorAll('.agent-row')].find((row) =>
              (row.textContent ?? '').includes(holder.name),
            )
            if (holderRow) {
              click(holderRow.querySelector('.agent-item'))
              facts['noTools.deadDetailSwitched'] = await until(
                () => text(d().querySelector('.detail h2')) === holder.name,
                60,
              )
              await wait(300)
              const deadSection =
                [...d().querySelectorAll('.detail .section')].find((s) =>
                  (text(s.querySelector('h3')) ?? '').includes('行动权限'),
                ) ?? null
              const deadRow = [...(deadSection?.querySelectorAll('.field-row') ?? [])].find((r) =>
                text(r.querySelector('.row-label')) === '允许触发的动作',
              )
              const deadChip = [...(deadRow?.querySelectorAll('.chip') ?? [])].find((c) =>
                text(c.querySelector('code')) === deadAction,
              )
              facts['noTools.deadChipKept'] = !!deadChip
              // ② 标记：chip 里除了契约值还有一句"当前不可用"
              facts['noTools.deadChipMarked'] = need('那条 chip 的附注', () =>
                deadChip ? text(deadChip.querySelector('.chip-sub')) : null,
              )
              // ③ 解释那一句（为什么不可用、下一步怎么办）
              //
              //   ⚠️ 两件事分开量：**成因**（内置动作已整组移除 / 包被卸载——两种
              //      来源都必须说出来）与**下一步**（只读态里没有「移除」按钮，
              //      所以那句话必须是"点「编辑」…"，不能是编辑态那一句）。
              const deadHintText = String(text(deadSection) ?? '')
              facts['noTools.deadHintShown'] = deadHintText.includes('现在找不到出处')
              facts['noTools.deadHintBothCauses'] =
                deadHintText.includes('内置动作') &&
                deadHintText.includes('工具包被卸载')
              facts['noTools.deadHintNextStepReadOnly'] =
                deadHintText.includes('点「编辑」') && deadHintText.includes('移除')
              // 编辑态：列得出来 + 有「移除」入口
              const deadEditBtn = [...d().querySelectorAll('.detail button')].find(
                (b) => text(b) === '编辑',
              )
              if (deadEditBtn) {
                click(deadEditBtn)
                await until(() => !!d().querySelector('.action-perms'), 60)
                await wait(200)
                const deadPerms = d().querySelector('.action-perms')
                facts['noTools.deadListedInEdit'] = !!(
                  deadPerms &&
                  (text(deadPerms) ?? '').includes(deadAction) &&
                  (text(deadPerms) ?? '').includes('配过、但现在解析不出来')
                )
                facts['noTools.deadHintNextStepInEdit'] =
                  (text(deadPerms) ?? '').includes('「移除」') &&
                  (text(deadPerms) ?? '').includes('工具')
                const dropBtn = [...(deadPerms?.querySelectorAll('button') ?? [])].find(
                  (b) => text(b) === '移除',
                )
                facts['noTools.deadRemoveButton'] = !!dropBtn

                // ★ 出口的两半：
                //   ① 只去掉**一条**就保存 ⇒ **仍然被拒**。服务端的规则是"名单里
                //      只要还有一条没有出处的动作，整份就不收"——把这一条量出来，
                //      使用者才不会以为"点一下就通了"。
                //   ② 把**所有**没有出处的都去掉 ⇒ 这一次真的存进去（以接口为准）。
                //   没有②的话，界面上"列出来了"仍然可能是个死胡同。
                const permsNow = () => d().querySelector('.action-perms')
                const anyDropBtn = () =>
                  [...(permsNow()?.querySelectorAll('button') ?? [])].find(
                    (b) => text(b) === '移除',
                  )
                if (dropBtn) {
                  click(dropBtn)
                  await wait(250)
                  const partialSaveBtn = [...d().querySelectorAll('.detail button')].find((b) =>
                    text(b).startsWith('保存'),
                  )
                  if (partialSaveBtn) {
                    click(partialSaveBtn)
                    await until(() => !!d().querySelector('.detail .notice.bad'), 40)
                    await wait(250)
                    facts['noTools.deadPartialStillRefused'] =
                      !!d().querySelector('.detail .notice.bad')
                  }
                  // 剩下的逐条去掉（每点一次就少一条，最多循环几轮兜住）
                  for (let i = 0; i < 6; i++) {
                    const btn = anyDropBtn()
                    if (!btn) break
                    click(btn)
                    await wait(200)
                  }
                  facts['noTools.deadAllRemoved'] = !/probe-tool\.[a-z-]+/.test(
                    text(permsNow()) ?? '',
                  )
                  const finalSaveBtn = [...d().querySelectorAll('.detail button')].find((b) =>
                    text(b).startsWith('保存'),
                  )
                  if (finalSaveBtn) {
                    click(finalSaveBtn)
                    await until(() => !d().querySelector('.action-perms'), 40)
                    await wait(250)
                    facts['noTools.deadDroppedOnServer'] = await f.contentWindow
                      .fetch('/api/agents')
                      .then((r) => r.json())
                      .then((p) => {
                        const after = (p.agents ?? []).find((a) => a.name === holder.name)
                        return (
                          !!after && !(after.allowedActions ?? []).includes(deadAction)
                        )
                      })
                      .catch(() => false)
                  }
                }
              }
            }
          }
        }

        // ══════════════ 新建任务：至少不崩 ══════════════
        f.contentWindow.location.hash = '#/new'
        await wait(600)
        facts['new.hasContent'] = need('新建页有内容', () => main().textContent.trim().length > 0)

        publish(true)
      }

      main().catch((e) => {
        errors.push('探针自身异常：' + (e && e.stack ? e.stack : String(e)))
        publish(true)
      })
    </script>
  </body>
</html>
