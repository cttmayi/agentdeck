<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>alpha-helper layout probe</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 12px/1.5 monospace; }
      iframe { width: 1280px; height: 880px; border: 0; display: block; }
      pre { margin: 0; padding: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      ══════════════════════════════════════════════════════════════════
      界面布局探针：它为什么存在
      ══════════════════════════════════════════════════════════════════

      `tsc`/`svelte-check` 看不见布局：类名写对了、模板结构合法，但
      "两栏有没有并排"、"窄屏返回按钮有没有出现"、"`.main:has(> .split-layout)`
      有没有真的生效"这些只有**浏览器量得出来**。改布局时靠"我看着像对"
      是不够的——这个项目里已经有过两次"接口都在、就是没接线"的缺陷。

      于是：把**真应用**放进同源 iframe，用**真实点击**驱动它，把
      `getComputedStyle` 的结果写进自己的 DOM，再由 `run.mjs` 用
      `chrome --dump-dom` 抓回去断言。探针只上报**事实**，期望值全在
      `run.mjs` 里——"量"和"判"分开，改了期望不必动这里。

      ⚠️ 它**基本不造 run**：造 run 就会去调真的 CLI（NFR-T-01 的底线）。所以它验的是
         **布局与结构**，不是"跑起来之后长什么样"。唯一的例外是「新建任务的三步链」
         那一组：那里要证明"界面上选的"与"发出去的请求体"是同一件事，只有真的点一次
         「创建并派发」、再从接口上把那条 run 读回来才做得到。那两条 run 用的
         runtime 是 `generic`（命令 `agent-cli` 不存在）⇒ 它们会立刻失败，**不会**
         拉起任何一个真实的模型去干活（见 `run.mjs` 里造那个夹具 agent 的说明）。
    -->
    <iframe id="f" src="/#/agents"></iframe>
    <pre id="out">pending</pre>
    <script>
      const f = document.getElementById('f')
      const facts = {}
      const errors = []
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const d = () => f.contentDocument
      const cs = (el) => f.contentWindow.getComputedStyle(el)
      const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : null)

      function publish(done) {
        document.getElementById('out').textContent = JSON.stringify({ errors, facts, done }, null, 1)
      }

      /** 轮询等待条件成立；拿不到就返回 false（调用方自己记一条 error）。 */
      async function until(fn, tries = 100) {
        for (let i = 0; i < tries; i++) {
          try {
            if (fn()) return true
          } catch {}
          await wait(150)
        }
        return false
      }

      function click(el) {
        el.dispatchEvent(
          new MouseEvent('click', { bubbles: true, cancelable: true, view: f.contentWindow }),
        )
      }

      function need(name, fn) {
        try {
          const v = fn()
          if (v === undefined) errors.push(`${name}：拿不到值`)
          return v
        } catch (e) {
          errors.push(`${name}：${e && e.message ? e.message : e}`)
          return null
        }
      }

      async function main() {
        await new Promise((r) => f.addEventListener('load', r, { once: true }))

        // ══════════════ 智能体：主从布局 ══════════════
        // 首启会播种一对 agent（一个执行、一个审核），所以这里等得到卡片；
        // 等不到就说明界面或接口坏了——那本身就是要报出来的事。
        const gotCards = await until(() => d().querySelectorAll('.agent-item').length > 0)
        const cards = () => [...d().querySelectorAll('.agent-item')]
        facts['agents.gotData'] = gotCards
        if (!gotCards) errors.push('智能体页等了 15 秒也没出现任何 .agent-item（数据没到或列表没渲染）')

        facts['agents.cardCount'] = cards().length
        // 每张卡都要有：名字、角色徽章、两行说明（指令摘要 + 关系/技能/runtime）
        facts['agents.everyCardWellFormed'] =
          cards().length > 0 &&
          cards().every(
            (c) =>
              !!c.querySelector('strong') &&
              !!c.querySelector('.badge') &&
              c.querySelectorAll('.agent-note').length === 2,
          )
        facts['agents.executorShowsReviewer'] = need('执行者卡片上的审核者', () => {
          const exec = cards().find((c) => c.textContent.includes('执行'))
          return exec ? text(exec.querySelectorAll('.agent-note')[1]) : null
        })

        const layout = () => d().querySelector('.split-layout')
        const main = () => d().querySelector('main.main')

        facts['agents.initialClass'] = need('初始 class', () => layout()?.className)
        facts['agents.initialListDisplay'] = need('初始左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.initialDetailDisplay'] = need('初始右栏', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        // `:has(> .split-layout)` 那条规则若失效，整页会变成"外层滚动"而不是
        // 两栏各自滚动——类型检查完全看不出来，所以这里量出来。
        facts['agents.mainOverflowY'] = need('main overflow-y', () => cs(main()).overflowY)
        facts['agents.mainPaddingTop'] = need('main padding-top', () => cs(main()).paddingTop)
        facts['agents.layoutHeightDelta'] = need('布局高度 vs main 高度差', () =>
          Math.round(layout().getBoundingClientRect().height - main().clientHeight),
        )

        // ── 真点击第一条 ──
        click(cards()[0])
        const entered = await until(() => layout()?.className.includes('with-detail'))
        if (!entered) errors.push('点了第一条 agent 之后 .split-layout 没有带上 with-detail')
        facts['agents.afterClickClass'] = need('点击后 class', () => layout()?.className)
        facts['agents.tracks'] = need('两栏宽度', () => cs(layout()).gridTemplateColumns.split(' '))
        // ⚠️ 选中态挂在 `.agent-row`（那一行才是卡片：边框要包住右侧的开关），
        //    所以这里按**行**取，再确认它里面确实是刚点的那张卡
        facts['agents.activeCardClass'] = need('选中态', () =>
          d().querySelector('.agent-row.active')?.className.replace(/ svelte-\w+/, ''),
        )
        facts['agents.detailRendered'] = need('右栏是否渲染出详情', () =>
          !!d().querySelector('.detail-pane .detail'),
        )
        facts['agents.detailHeading'] = need('右栏标题', () =>
          text(d().querySelector('.detail-pane h2')),
        )
        // ── runtime 选择器：选项必须来自身份接口，不是写死两项 ──
        //
        //   加一个 runtime = 描述表一行 + 适配器包 + 装配表一行。若界面写死
        //   选项，那个 runtime 就**只有直接调接口才选得到**——"接口支持、界面
        //   没有入口"是这个仓库最常见的那类缺陷。
        const editBtn = [...d().querySelectorAll('button')].find(
          (b) => b.textContent.trim() === '编辑',
        )
        facts['agents.editButtonFound'] = !!editBtn
        if (editBtn) {
          click(editBtn)
          await until(() => d().querySelector('select#agent-runtime'))
          const sel = d().querySelector('select#agent-runtime')
          facts['agents.runtimeOptions'] = sel ? [...sel.options].map((o) => o.value).sort() : null
          try {
            const identity = await fetch(`${location.origin}/api/identity`).then((r) => r.json())
            facts['agents.identityRuntimeKeys'] = (identity.runtimes ?? [])
              .map((r) => r.key)
              .sort()
          } catch {
            facts['agents.identityRuntimeKeys'] = null
          }
          // ── 选一个**未验证**的 runtime，警告必须出现 ──
          //
          //   判据是描述表里的 `evidence`。改成"选到它时该不该有提示"这件事
          //   以前**在编辑态根本没有**（提示只在只读态、而且还写死了
          //   `runtimeKey === 'generic'`）。所以这条不只是防写死。
          const provisional = (facts['agents.identityRuntimeKeys'] ?? []).find((k) => k !== 'claude')
          if (sel && provisional) {
            sel.value = provisional
            sel.dispatchEvent(new Event('change', { bubbles: true }))
            const warned = await until(() => !!d().querySelector('.field-row .row-hint.warn'))
            facts['agents.provisionalWarningInEdit'] = warned
              ? text(d().querySelector('.field-row .row-hint.warn'))
              : null
          }

          // 别把状态留在编辑态：后面的断言按只读态写的
          const cancel = [...d().querySelectorAll('button')].find(
            (b) => b.textContent.trim() === '取消',
          )
          if (cancel) click(cancel)
          await wait(200)
        }

        const back = d().querySelector('.detail-pane .back')
        // 宽屏下列表就在左边，返回按钮不该出现（它只在窄屏整页显示详情时有意义）
        facts['agents.wideBackDisplay'] = need('宽屏返回按钮', () =>
          back ? cs(back).display : 'MISSING',
        )
        facts['agents.wideListDisplay'] = need('宽屏左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )

        // ── 收窄：应当只剩一栏 + 返回按钮出现 ──
        f.style.width = '900px'
        await wait(400)
        facts['agents.narrowListDisplay'] = need('窄屏左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.narrowDetailDisplay'] = need('窄屏右栏（选中态）', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        facts['agents.narrowBackDisplay'] = need('窄屏返回按钮', () => cs(back).display)

        // ── 点返回：回到列表，右栏在窄屏下应当消失 ──
        click(back)
        await wait(300)
        facts['agents.afterBackClass'] = need('返回后 class', () => layout()?.className)
        facts['agents.afterBackListDisplay'] = need('返回后左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.afterBackDetailDisplay'] = need('返回后右栏（窄屏）', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        f.style.width = '1280px'
        await wait(300)

        // ── Runtime 概览（原来六列表格，现在是竖排卡片）──
        const rc = () => [...d().querySelectorAll('.runtime-card')]
        facts['agents.runtimeCardCount'] = rc().length
        facts['agents.runtimeCardsWellFormed'] =
          rc().length > 0 && rc().every((c) => c.querySelectorAll('.runtime-line').length >= 2)

        // ══════════════ 任务清单：同样的主从 + 去重字样 ══════════════
        f.contentWindow.location.hash = '#/tasks'
        await until(() => d().querySelector('.view-head, .pane-head'))
        // 等表格真的出现行：run.mjs 会先造一条任务当夹具。等不到就是夹具没造上，
        // 下面那条"重复字样"的检查会**空过**——所以这里必须如实报出来。
        const gotRows = await until(() => d().querySelectorAll('.list-pane .task-row').length > 0)
        facts['tasks.gotRows'] = gotRows
        if (!gotRows) errors.push('任务清单里一行都没等到（夹具任务没造上或列表没渲染）')

        const rows = [...d().querySelectorAll('.list-pane .task-row')]
        facts['tasks.rowCount'] = rows.length
        // 从没跑过的任务：标签「执行中」+ 额外信息「还没开始执行」。
        // 这一行同时钉住了"标签之外的信息该不该显示"这条规则。
        facts['tasks.firstRowStageCell'] = need('第一行元信息', () =>
          text(rows[0]?.querySelector('.task-meta')),
        )
        // ── 行高：长标题不许把一行撑高 ──
        facts['tasks.rowHeights'] = need('各行高度', () =>
          rows.map((r) => Math.round(r.getBoundingClientRect().height)),
        )
        facts['tasks.maxRowHeight'] = need('最高的一行', () =>
          Math.max(...rows.map((r) => Math.round(r.getBoundingClientRect().height))),
        )
        // ★ 行高与标题长度无关：拿"长标题那行"和"短标题那行"对比。
        facts['tasks.heightSpread'] = need('长短标题的行高差', () => {
          const heights = rows.map((r) => Math.round(r.getBoundingClientRect().height))
          return heights.length >= 2 ? Math.max(...heights) - Math.min(...heights) : 'ROWS-TOO-FEW'
        })
        // 被裁掉了吗（scrollHeight > clientHeight 说明内容被截断了，而不是被挤宽）
        facts['tasks.titleClipped'] = need('长标题是否被截断显示', () => {
          const longRow = rows.find((r) =>
            (r.querySelector('.task-title')?.textContent ?? '').startsWith('探针用的任务'),
          )
          const t = longRow?.querySelector('.task-title')
          if (!t) return 'NO-LONG-TITLE-ROW'
          // 单行省略：内容比可见宽度长，就是被截断了
          return t.scrollWidth > t.clientWidth + 1
        })
        // 标题那一格的实际宽度（它现在独占一行，应当接近整栏宽）
        facts['tasks.titleWidth'] = need('标题宽度', () => {
          const t = rows[0]?.querySelector('.task-title')
          return t ? Math.round(t.getBoundingClientRect().width) : null
        })
        facts['tasks.layoutPresent'] = need('任务页主从布局', () =>
          !!d().querySelector('.split-layout .list-pane') &&
          !!d().querySelector('.split-layout .detail-pane'),
        )
        facts['tasks.mainOverflowY'] = need('任务页 main overflow-y', () => cs(main()).overflowY)
        // 使用者点名要去掉的那句「等待审核」：整份渲染结果里一次都不该出现。
        // 任何视图里重新长出这句话，这里就会红。
        facts['tasks.duplicateStageTextCount'] = need('「等待审核」出现次数', () =>
          (d().documentElement.innerHTML.match(/等待审核/g) ?? []).length,
        )

        // ── 点一行 → 右栏显示**完整**的标题 ──
        // 列表把标题截断了，所以"完整标题还能不能看到"必须另有地方证明：
        // 详情栏就是那个地方。顺带守住"改写列表标记之后点选还通不通"。
        facts['tasks.clickedRowTitle'] = need('被点那一行的标题', () =>
          text(rows[0]?.querySelector('.task-title')),
        )
        click(rows[0])
        await until(() => d().querySelector('.detail-pane .detail-head h2'))
        facts['tasks.detailTitleAfterClick'] = need('点之后右栏的标题', () =>
          text(d().querySelector('.detail-pane .detail-head h2')),
        )
        // 列表里只剩日期 ⇒ 完整时间戳必须在别处还看得见（否则是悄悄丢信息）
        facts['tasks.detailHasTimestamp'] = need('右栏有没有完整时间戳', () =>
          /\d{1,2}:\d{2}/.test(text(d().querySelector('.detail-pane .detail-sub')) ?? ''),
        )

        // ── 看板：四档状态，且"待人工"排在"已审查"之前 ──
        //
        //   使用者反馈过「审查的结论是 needs_human，被标为已审查，不合理」——
        //   修法是把它单独列一档。这条守住：列本身在，且顺序是"从左往右越来越
        //   接近结束"（待人工还没结束，所以它在已审查前面）。
        //
        //   ⚠️ 放在本视图**最后**：切看板会让列表重新渲染，前面那些"抓住元素
        //      再点"的断言会拿到已脱离文档的旧节点而失败（实测踩到过）。
        const toBoard = [...d().querySelectorAll('button')].find(
          (b) => b.textContent.trim() === '看板',
        )
        facts['tasks.boardButtonFound'] = !!toBoard
        if (toBoard) {
          click(toBoard)
          await until(() => d().querySelectorAll('.column').length > 0)
          facts['tasks.boardColumnCount'] = d().querySelectorAll('.column').length
          facts['tasks.boardHasActingColumn'] = [...d().querySelectorAll('.column h4')].some((h) =>
            (h.textContent ?? '').includes('行动中'),
          )
          facts['tasks.boardColumns'] = [...d().querySelectorAll('.column h4')].map((h) =>
            (h.textContent ?? '').trim().split('\n')[0].trim(),
          )
        }

        // ══════════════ Skills：安装面板在抽屉里 ══════════════
        f.contentWindow.location.hash = '#/skills'
        await until(() => d().querySelector('.view-head h2')?.textContent.trim() === 'Skills')
        await wait(500)
        facts['skills.title'] = need('Skills 标题', () =>
          text(d().querySelector('.view-head h2')),
        )
        // 老结构（正文里展开的面板）不该再存在
        facts['skills.oldInlinePanel'] = need('正文里还有 .install-panel 吗', () =>
          !!d().querySelector('.install-panel'),
        )
        const skillRows = () => d().querySelectorAll('.main table tbody tr').length
        facts['skills.tableRows'] = skillRows()
        // 卸载入口：README 里"没有卸载"那个缺口补上了
        facts['skills.uninstallButtonFound'] = [...d().querySelectorAll('.main table tbody button')].some(
          (b) => b.textContent.trim() === '卸载',
        )

        const openBtn = [...d().querySelectorAll('button')].find(
          (b) => b.textContent.trim() === '安装 skill',
        )
        facts['skills.openButtonFound'] = !!openBtn
        if (!openBtn) {
          errors.push('找不到「安装 skill」按钮')
        } else {
          click(openBtn)
          const opened = await until(() => d().querySelector('.drawer'))
          if (!opened) errors.push('点了「安装 skill」之后没有出现 .drawer')
        }

        const drawer = d().querySelector('.drawer')
        if (drawer) {
          facts['skills.drawerClass'] = drawer.className.replace(/ svelte-\w+/, '')
          facts['skills.drawerWidth'] = Math.round(drawer.getBoundingClientRect().width)
          facts['skills.backdropPresent'] = !!d().querySelector('.drawer-backdrop')
          facts['skills.footButtonText'] = need('底部按钮', () =>
            text(d().querySelector('.drawer-foot button')),
          )
          // 主操作要贴着底部常驻（`.drawer-foot`），而不是随正文滚走
          facts['skills.footBottomDelta'] = need('底部按钮距视口底部', () => {
            const r = d().querySelector('.drawer-foot').getBoundingClientRect()
            return Math.round(Math.abs(r.bottom - f.contentWindow.innerHeight))
          })
          facts['skills.tabCount'] = d().querySelectorAll('.drawer .tab').length
          // 页签条里那个和抽屉头重复的「关闭」应当已经删掉
          facts['skills.duplicateCloseInTabs'] = !!d().querySelector('.drawer .tabs .close')
          facts['skills.rowsBehindDrawer'] = skillRows()

          // Esc 关闭（这个抽屉是视图自己渲染的，不在 App 的 $openDrawer 里）
          f.contentWindow.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
          )
          await wait(300)
          facts['skills.drawerGoneAfterEsc'] = !d().querySelector('.drawer')
        }

        // ══════════════ 侧边栏第五项 + 工具（D40）══════════════
        //
        // 使用者要的是"可插拔的行动"：一个工具包 = **一个组**（一个目录、一次
        // 安装），组内多个动作，判决里写作 `<包slug>.<动作名>`。这一节量的是
        // 界面把这三件事说清楚了没有：
        //
        //   ① **侧边栏五项**（D40 起「工具」是第 5 项，排在 Skills 之后）；
        //   ② 列表：组名、动作数、**挂给了谁**；
        //   ③ 点开一行：动作清单（契约值 `<slug>.<动作名>`、`summary`、
        //      「不可回滚」「不支持预演，不能自动执行」两条标注、参数分
        //      bound / open 两组）；
        //   ④ 安装抽屉：**右侧**、Esc 能关、失败时显示 error + **多行 detail**，
        //      成功时说清装进来了什么、并且列表立刻多一条；
        //   ⑤ 智能体详情：执行者有「工具」段、挂载能来回改并立刻刷新；
        //      **审核者没有那一段**。
        //
        // ⚠️ 夹具（三个工具目录 + 一次安装 + 一次挂载）由 `run.mjs` 造，理由
        //    与 skill 那份一样：探针跑在 `--virtual-time-budget` 下，`setTimeout`
        //    是虚拟的而网络是真的，"自己造再等界面刷新"会看早。
        // ⚠️ 两个夹具路径从 URL 传进来（抽屉里那次安装要真的往输入框里打字）。
        const probeQuery = new URLSearchParams(location.search)
        const badToolPath = probeQuery.get('badToolPath')
        const uiToolPath = probeQuery.get('uiToolPath')

        f.contentWindow.location.hash = '#/tools'
        await until(() => text(d().querySelector('.view-head h2')) === '工具')
        await until(() => d().querySelectorAll('.tool-table tbody tr.tool-row').length > 0)
        await wait(400)

        // ── ① 侧边栏：恰好五项，而且**顺序就是那五项** ──
        //
        //    ★ 这一组是"4 → 5"那次改动的守卫：`view.ts` 的 `VIEWS` 与
        //      `Sidebar.svelte` 的 `ITEMS` 是两处联动，少动一处不报错，
        //      只表现为"视图打不开 / 侧边栏点不到它"。
        //
        //    ⚠️ **只数个数 + 只看最后一项是不够的**（实测过两次变异）：
        //      · "把「工具」插到 Skills 前面" ⇒ 末项变成 Skills，抓得住；
        //      · "把 Skills 那一项的文案悄悄换成「工具」" ⇒ 项数还是 5、末项还是
        //        「工具」，**两条全绿**——一个非末项凭空消失也照样通过。
        //      所以这里把**整串顺序**一起量出来，由 `shell.navItems` 那条逐项比对。
        //      （原来有没有"恰好四项"的断言？没有——那一版只有注释与文档里的说法。）
        const probeNavTitles = [...d().querySelectorAll('.sidebar .nav-title')].map((el) =>
          text(el),
        )
        facts['shell.navItems'] = probeNavTitles
        facts['shell.navItemCount'] = d().querySelectorAll('.sidebar .nav-item').length
        facts['shell.navLastItem'] =
          probeNavTitles.length > 0 ? probeNavTitles[probeNavTitles.length - 1] : null

        // ── ② 列表 ──
        facts['tools.title'] = need('工具页标题', () => text(d().querySelector('.view-head h2')))
        const probeToolRows = () => [...d().querySelectorAll('.tool-table tbody tr.tool-row')]
        const probeFixtureRow = () =>
          probeToolRows().find(
            (r) => text(r.querySelector('.tool-slug')) === 'probe-tool',
          )
        facts['tools.rowCount'] = probeToolRows().length
        facts['tools.fixtureFound'] = !!probeFixtureRow()
        if (!probeFixtureRow()) errors.push('工具列表里找不到夹具工具 probe-tool（夹具没装上？）')
        facts['tools.fixtureActionCell'] = need('夹具那行的动作数', () =>
          text(probeFixtureRow()?.querySelector('.tool-action-count')),
        )
        facts['tools.fixtureMountedBy'] = need('夹具那行的"挂给了谁"', () =>
          text(probeFixtureRow()?.querySelector('.tool-mounted')),
        )

        // ── ③ 点一行 → 动作清单 ──
        const probeExpand = [...(probeFixtureRow()?.querySelectorAll('button') ?? [])].find(
          (b) => text(b) === '看动作',
        )
        if (probeExpand) {
          click(probeExpand)
          await until(() => !!d().querySelector('.tool-detail-row .tool-action'))
        }
        facts['tools.actionTypes'] = [
          ...d().querySelectorAll('.tool-detail-row .tool-action-type'),
        ].map((el) => text(el))
        const probeActionText = () =>
          text(d().querySelector('.tool-detail-row')) ?? ''
        facts['tools.irreversibleFlag'] = need('不可回滚那条标注', () =>
          probeActionText().includes('不可回滚'),
        )
        facts['tools.noDryRunFlag'] = need('不支持预演那条标注', () =>
          probeActionText().includes('不支持预演，不能自动执行'),
        )
        facts['tools.boundGroupNote'] = need('绑定参数那一组', () => {
          const group = d().querySelector('.tool-detail-row .params-bound')
          return !!group && (text(group) ?? '').includes('模型看不到也填不了')
        })
        facts['tools.openGroupNote'] = need('模型可填那一组', () => {
          const group = d().querySelector('.tool-detail-row .params-open')
          // 那一组要显示类型与上限：夹具的 `text` 是 string/max 500
          return !!group && /最长\s*500/.test(text(group) ?? '')
        })

        // ── ④ 安装抽屉：右侧 + Esc + 失败（多行 detail）+ 成功 ──
        const probeInstallBtn = [...d().querySelectorAll('.view-head button')].find(
          (b) => text(b) === '安装工具',
        )
        facts['tools.installButtonFound'] = !!probeInstallBtn
        if (!probeInstallBtn) {
          errors.push('找不到「安装工具」按钮')
        } else {
          click(probeInstallBtn)
          const probeDrawerOpen = await until(() => !!d().querySelector('.drawer'))
          if (!probeDrawerOpen) errors.push('点了「安装工具」之后没有出现 .drawer')
          const probeDrawer = d().querySelector('.drawer')
          if (probeDrawer) {
            // 右侧：抽屉的右边缘贴住**布局视口**右缘，且整体落在右半边
            facts['tools.drawerAtRight'] = need('抽屉在不在右边', () => {
              const r = probeDrawer.getBoundingClientRect()
              // ⚠️ 参照系是 `documentElement.clientWidth`（布局视口），**不是**
              //    `innerWidth`：工具页比视口高时会出现纵向滚动条，而 `innerWidth`
              //    把滚动条那十几像素也算进去，`position: fixed; right: 0` 贴的却是
              //    布局视口的右缘——用 innerWidth 比会恒差一个滚动条宽度，
              //    症状是"抽屉明明在右边，这条却红"（第一版就是这么红的）。
              const layoutWidth = d().documentElement.clientWidth
              // 「在右边」= 右缘贴住布局视口 + **不是**整屏（左边还看得见列表）。
              // ⚠️ 不要判 `r.left > layoutWidth / 2`：这个抽屉是 46rem(736px)，
              //    在 1280 的视口里 left 只有 544——"宽度超过半屏"是对的，
              //    而那条判据会把它判成"不在右边"（第一版就是这么红的）。
              return (
                Math.abs(r.right - layoutWidth) <= 2 &&
                r.width < layoutWidth &&
                r.left > 0
              )
            })
            facts['tools.drawerWidth'] = Math.round(probeDrawer.getBoundingClientRect().width)
            facts['tools.drawerBackdrop'] = !!d().querySelector('.drawer-backdrop')

            // 往输入框里打字要派发 `input`：`bind:value` 靠它（只改 value 不生效）
            const probeType = (el, value) => {
              el.value = value
              el.dispatchEvent(new Event('input', { bubbles: true }))
            }
            const probeSource = d().querySelector('#tool-source')
            const probeFoot = () => d().querySelector('.drawer-foot button')

            // ── 失败路径：一个"清单合法但入口不在包里"的目录 ──
            if (probeSource && probeFoot() && badToolPath) {
              probeType(probeSource, badToolPath)
              click(probeFoot())
              const probeFailed = await until(
                () => !!d().querySelector('.drawer .tool-error-detail'),
                60,
              )
              facts['tools.installFailureShown'] = probeFailed
              if (!probeFailed) {
                errors.push('装一个坏包之后没有出现失败块（.tool-error-detail）')
              }
              facts['tools.installFailureDetailLines'] = need('detail 有几行', () => {
                const el = d().querySelector('.drawer .tool-error-detail')
                return el ? (el.textContent ?? '').split('\n').length : null
              })
              facts['tools.installFailureDetailKeepsLines'] = need('detail 的 white-space', () => {
                const el = d().querySelector('.drawer .tool-error-detail')
                return el ? cs(el).whiteSpace === 'pre-wrap' : null
              })
              facts['tools.installFailureHint'] = need('失败时的下一步建议', () => {
                const hints = [
                  ...d().querySelectorAll('.drawer .notice.bad p.faint.small'),
                ]
                return hints.length > 0 ? text(hints[hints.length - 1]) : null
              })
            }

            // ── 成功路径：另一个 slug 的夹具包（同名会被自己挡住，量到的就不是"装上了"）──
            if (probeSource && probeFoot() && uiToolPath) {
              probeType(probeSource, uiToolPath)
              click(probeFoot())
              const probeOk = await until(
                () => !!d().querySelector('.drawer .notice.good'),
                90,
              )
              facts['tools.installSuccess'] = probeOk
              if (!probeOk) errors.push('从抽屉里装一个合法包没有出现成功块（.notice.good）')
              facts['tools.installSuccessListsWhat'] = need('成功块说的是什么', () => {
                const block = d().querySelector('.drawer .notice.good')
                if (!block) return null
                const body = text(block) ?? ''
                // 「装进来什么」= 动作名 + 文件名都列出来了
                return body.includes('probe-tool-ui.ping') && body.includes('scripts/run.mjs')
              })
            }

            // Esc 关（这个抽屉是视图自己渲染的，不在 App 的 $openDrawer 里）
            f.contentWindow.dispatchEvent(
              new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
            )
            facts['tools.drawerGoneAfterEsc'] = await until(() => !d().querySelector('.drawer'), 40)
          }
        }
        // ★ 装完之后列表里**立刻**多一条（不是等下一次刷新才看见）
        await until(() => probeToolRows().length >= 2, 60)
        facts['tools.rowsAfterUiInstall'] = probeToolRows().length

        // ── ⑤ 智能体详情：执行者有工具段（挂载能改），审核者没有那一段 ──
        f.contentWindow.location.hash = '#/agents'
        await until(() => d().querySelectorAll('.agent-row').length > 0)
        await wait(400)

        /** 详情里那一段「干活时能用的工具包」的标题元素——判据是 h3 的文字，不是类名。 */
        const probeToolsHeading = () =>
          [...d().querySelectorAll('.detail .section h3')].find(
            (h) => text(h) === '干活时能用的工具包',
          ) ?? null
        const probeDetailText = () => text(d().querySelector('.detail')) ?? ''

        const probeExecRow = [...d().querySelectorAll('.agent-row')].find((row) =>
          (row.textContent ?? '').includes('探针用的执行者'),
        )
        if (!probeExecRow) {
          errors.push('找不到夹具执行者「探针用的执行者」')
        } else {
          click(probeExecRow.querySelector('.agent-item'))
          // ⚠️ 必须等右栏**换成了这个 agent**：前面的段落已经选过别的 agent 了
          const probeSwitched = await until(
            () => text(d().querySelector('.detail h2')) === '探针用的执行者',
            60,
          )
          if (!probeSwitched) errors.push('点开夹具执行者之后右栏没换成它')
          await wait(300)
          facts['tools.detailSectionForExecutor'] =
            !!probeToolsHeading() && probeDetailText().includes('probe-tool')

          // ★ 对称的一条（D40 收口）：**执行者**详情里没有「行动权限」段。
          //   与下面"审核者没有工具段"是同一条不变量：各人的能力只给各自的人
          //   ——执行者的能力是工具（干活时用的），动作是判完之后由平台执行的，
          //   服务端对"执行者带动作"是 400。同理，界面上给出一个必然失败的勾选
          //   比没有更糟（使用者会以为是权限问题）。
          //   判据与那一条一样：段落标题得**先有**，否则整页空白也能通过。
          facts['standard.executorHasNoActionsSection'] = need('执行者详情里的段落标题', () => {
            const headings = [...d().querySelectorAll('.detail .section h3')].map((h) => text(h))
            facts['standard.executorSectionHeadings'] = headings
            return headings.length > 0 && !headings.some((h) => h.includes('行动权限'))
          })

          // ── 编辑态：勾选 → 保存 → 摘掉 → 再挂回来 ──
          const probeEditBtn = [...d().querySelectorAll('.detail button')].find(
            (b) => text(b) === '编辑',
          )
          if (!probeEditBtn) {
            errors.push('详情里找不到「编辑」按钮')
          } else {
            click(probeEditBtn)
            await until(() => !!d().querySelector('.tool-picker'))
            const probeOptions = () => [
              ...d().querySelectorAll('.tool-picker .tool-option'),
            ]
            facts['tools.detailPickerHasFixture'] = probeOptions().some((o) =>
              (o.textContent ?? '').includes('probe-tool'),
            )
            // ★ D42 行为面：编辑态的说明必须说清"挂载 = 送进工作目录、干活时用"，
            //   而不是旧的"把整组动作交给它"（那是审核者那一侧的说法——两个
            //   行为面混成一个，正是使用者担心会误解的地方）。
            facts['tools.detailMountHintWording'] = need('执行者工具段的挂载说明', () =>
              (text(d().querySelector('.detail')) ?? '').includes('送进它的工作目录'),
            )
            const probeSaveBtn = () =>
              [...d().querySelectorAll('.detail button')].find(
                (b) => text(b) === '保存挂载',
              )

            const probeSetMount = async (on) => {
              const option = probeOptions().find((o) =>
                (o.textContent ?? '').includes('probe-tool'),
              )
              const input = option?.querySelector('input')
              if (!input) return false
              if (input.checked !== on) click(input)
              const save = probeSaveBtn()
              if (!save) return false
              click(save)
              // 保存是**真的**写接口：等按钮从"保存中…"回到「保存挂载」再走
              const settled = await until(
                () => text(probeSaveBtn() ?? { textContent: '' }) === '保存挂载',
                60,
              )
              return settled
            }

            const probeUnmounted = await probeSetMount(false)
            // 退出编辑态才看得到只读那段（"保存后真的刷新"就看它）
            const probeCancelBtn = () =>
              [...d().querySelectorAll('.detail button')].find((b) => text(b) === '取消')
            if (probeCancelBtn()) click(probeCancelBtn())
            await wait(400)
            facts['tools.mountSaveTookEffect'] =
              probeUnmounted && !probeDetailText().includes('probe-tool')

            // 再挂回去：来回都走接口，而不是"本地勾选的样子"
            const probeEditAgain = [...d().querySelectorAll('.detail button')].find(
              (b) => text(b) === '编辑',
            )
            if (probeEditAgain) {
              click(probeEditAgain)
              await until(() => !!d().querySelector('.tool-picker'))
              const probeRemounted = await probeSetMount(true)
              if (probeCancelBtn()) click(probeCancelBtn())
              await wait(400)
              facts['tools.mountRestoreTookEffect'] =
                probeRemounted && probeDetailText().includes('probe-tool')
            }
          }
        }

        // ── 审核者：**没有**工具那一段 ──
        //
        //    ★ 审核者只判断、不动手，服务端也会 400 拒掉"给审核者挂工具"。
        //      界面给出一个必然失败的开关比没有更糟（使用者会以为是权限问题）。
        const probeReviewerRow = [...d().querySelectorAll('.agent-row')].find((row) =>
          row.querySelector('.badge.in_review'),
        )
        if (!probeReviewerRow) {
          errors.push('找不到审核者的卡片')
        } else {
          click(probeReviewerRow.querySelector('.agent-item'))
          const probeReviewerSwitched = await until(
            () => !!d().querySelector('.detail .badge.in_review'),
            60,
          )
          if (!probeReviewerSwitched) errors.push('点开审核者之后右栏没换过去')
          await wait(300)
          facts['tools.reviewerHasNoToolsSection'] = need('审核者详情里的段落标题', () => {
            const headings = [...d().querySelectorAll('.detail .section h3')].map((h) => text(h))
            // 行必须先有（否则"没有工具段"会**空过**：整页空白也能通过）。
            // ⚠️ 按**包含**判断，不按等于：D42 之后执行者那段的标题是
            //   「干活时能用的工具包」，若它漏到审核者身上，`includes('工具')`
            //   仍然抓得住——等于判断会被改名的标题骗过。
            facts['tools.reviewerSectionHeadings'] = headings
            return headings.length > 0 && !headings.some((h) => h.includes('工具'))
          })
        }

        // ══════════════ 新建表单 / 设置：右侧抽屉（D32）══════════════
        //
        // 这两个面板在左栏里待过两版都不行（一版溢出去盖住右栏，一版不溢出但
        // 太窄），现在是**右侧抽屉**。这里量的是"它们在不在该在的地方"：
        // 有遮罩、够宽、不在主从两栏里、Esc 能关、栏头不会被撑大。
        // 上一版正是**量外观的检查全绿而布局已经垮了**，所以这一组量容纳关系。
        f.contentWindow.location.hash = '#/agents'
        await until(() => d().querySelectorAll('.agent-item').length > 0)
        await wait(400)

        const paneEl = d().querySelector('.pane')
        const headEl = d().querySelector('.pane-head')
        const box = (el) => {
          if (!el) return null
          const r = el.getBoundingClientRect()
          return { x: r.x, y: r.y, w: r.width, h: r.height }
        }
        const paneBox = box(paneEl)
        const headBox = box(headEl)
        facts['template.paneWidthPx'] = paneBox ? Math.round(paneBox.w) : null
        facts['template.headHeightBefore'] = headBox ? Math.round(headBox.h) : null
        facts['template.viewportWidth'] = f.contentWindow.innerWidth

        const paneBtn = (label) =>
          [...d().querySelectorAll('.pane-actions button')].find(
            (b) => b.textContent.trim() === label,
          )
        const findIn = (root, label) =>
          [...(root?.querySelectorAll('button') ?? [])].find((b) => b.textContent.trim() === label)

        const newAgentBtn = paneBtn('新建')
        const settingsBtn = paneBtn('设置')
        facts['template.openButtonFound'] = !!newAgentBtn
        facts['template.openButtonLabel'] = newAgentBtn ? newAgentBtn.textContent.trim() : null
        facts['template.settingsButtonFound'] = !!settingsBtn
        facts['template.settingsButtonLabel'] = settingsBtn ? settingsBtn.textContent.trim() : null
        facts['template.settingsButtonIsSecondary'] = settingsBtn
          ? settingsBtn.className.includes('secondary')
          : null
        facts['template.oldSettingsLabelGone'] = ![...d().querySelectorAll('button')].some(
          (b) => b.textContent.trim() === '第一句话设置',
        )

        const headNow = () => Math.round((headEl?.getBoundingClientRect().height ?? 0))

        if (!newAgentBtn) {
          errors.push('找不到「新建」按钮')
        } else {
          click(newAgentBtn)
          facts['template.formOpened'] = await until(() => !!d().querySelector('.drawer'))
          const drawer = d().querySelector('.drawer')
          const drawerBox = box(drawer)
          facts['template.formDrawerTitle'] = need('抽屉标题', () =>
            text(drawer.querySelector('.drawer-head h2')),
          )
          facts['template.formHasBackdrop'] = !!d().querySelector('.drawer-backdrop')
          facts['template.formWidthPx'] = drawerBox ? Math.round(drawerBox.w) : null
          // ★ 抽屉必须在**右边**（贴着视口右缘），而且是浮层
          facts['template.formAtRight'] = !!(
            drawerBox && Math.abs(drawerBox.x + drawerBox.w - f.contentWindow.innerWidth) <= 1
          )
          facts['template.formInsidePane'] = !!(paneEl && drawer && paneEl.contains(drawer))
          facts['template.formInsideHead'] = !!(headEl && drawer && headEl.contains(drawer))
          facts['template.headGrowthPx'] = headNow() - (facts['template.headHeightBefore'] ?? 0)
          facts['template.formOverflowX'] = drawer ? drawer.scrollWidth - drawer.clientWidth : null
          facts['template.formHasNoTemplateField'] = !(
            drawer && drawer.querySelector('.agent-form .tpl-text')
          )
          facts['template.footVisible'] = (() => {
            const foot = drawer && drawer.querySelector('.drawer-foot button')
            if (!foot) return false
            const r = foot.getBoundingClientRect()
            return r.top >= 0 && r.bottom <= f.contentWindow.innerHeight + 1
          })()
          facts['template.footPrimaryLabel'] = need('底部主操作', () =>
            text(drawer.querySelector('.drawer-foot button')),
          )

          // Esc 关掉（Esc 在 Drawer 组件里统一处理）
          f.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
          facts['template.formGoneAfterEsc'] = await until(() => !d().querySelector('.drawer'), 40)
          facts['template.listBackAfterEsc'] = !!d().querySelector('.agent-item')
        }

        // ══════════════ 设置抽屉 ══════════════
        const settingsBtn2 = paneBtn('设置')
        if (!settingsBtn2) {
          errors.push('找不到「设置」按钮')
        } else {
          click(settingsBtn2)
          facts['settings.panelOpened'] = await until(() => !!d().querySelector('.drawer'))
          const panel = d().querySelector('.drawer')
          const panelBox = box(panel)
          facts['settings.drawerTitle'] = need('设置抽屉标题', () =>
            text(panel.querySelector('.drawer-head h2')),
          )
          facts['settings.hasBackdrop'] = !!d().querySelector('.drawer-backdrop')
          facts['settings.isWide'] = !!(panel && panel.className.includes('wide'))
          facts['settings.panelWidthPx'] = panelBox ? Math.round(panelBox.w) : null
          facts['settings.panelAtRight'] = !!(
            panelBox && Math.abs(panelBox.x + panelBox.w - f.contentWindow.innerWidth) <= 1
          )
          facts['settings.panelInsidePane'] = !!(paneEl && panel && paneEl.contains(panel))
          facts['settings.headGrowthPx'] = headNow() - (facts['template.headHeightBefore'] ?? 0)
          facts['settings.panelOverflowX'] = panel ? panel.scrollWidth - panel.clientWidth : null
          // 它是"装设置的容器"：底部有一个共用的保存，正文里是分段的
          facts['settings.sectionCount'] = panel.querySelectorAll('.drawer-section').length
          facts['settings.sectionTitles'] = [...panel.querySelectorAll('.drawer-section h3')].map(
            (h) => text(h),
          )
          facts['settings.footSaveLabel'] = need('设置抽屉底部主操作', () =>
            text(panel.querySelector('.drawer-foot button')),
          )

          const tabs = [...(panel?.querySelectorAll('.tabs .tab') ?? [])]
          facts['settings.tabCount'] = tabs.length
          facts['settings.tabLabels'] = tabs.map((t) => text(t).replace('●', '').trim())
          facts['settings.activeTab'] = need('当前页签', () =>
            text(tabs.find((t) => t.className.includes('active'))).replace('●', '').trim(),
          )
          facts['settings.badgeBefore'] = need('模版状态徽章', () =>
            text(panel.querySelector('.tpl-state .badge')),
          )
          facts['settings.tplFieldPresent'] = !!(panel && panel.querySelector('.tpl-text'))
          // 抽屉够宽：模版输入框应当明显宽于原来那个 416px 的左栏
          const ta = panel && panel.querySelector('.tpl-text')
          facts['settings.tplFieldWidthPx'] = ta ? Math.round(ta.getBoundingClientRect().width) : null
          // ★ 输入框高度：使用者点名"太小了，不利用看内容"。空的模版也必须有
          //   一个像样的下限；填入默认那段之后要**跟着内容长高**。
          facts['settings.tplFieldHeightEmptyPx'] = ta
            ? Math.round(ta.getBoundingClientRect().height)
            : null

          const fillBtn = findIn(panel, '填入默认模版')
          facts['settings.fillButtonFound'] = !!fillBtn
          if (fillBtn) {
            click(fillBtn)
            await wait(150)
            facts['settings.filledHasPrompt'] = ta ? ta.value.includes('{{prompt}}') : null
            facts['settings.filledBadge'] = need('填完后的状态徽章', () =>
              text(panel.querySelector('.tpl-state .badge')),
            )
            // 执行那份只有十几行，可能还够不到最小高度——真正能证明"跟着内容长"

            facts['settings.tplFieldHeightExecPx'] = ta

          // 切到审核页签：**另一份是独立的**

          facts['settings.reviewTabFound'] = !!reviewTab
          if (reviewTab) {

            await wait(250)
            facts['settings.reviewBadgeWhileExecuteCustom'] = need('审核页签的徽章', () =>

              facts['settings.reviewFilledLines'] = ta2 ? ta2.value.split('\n').length : null

          const varBtn = findIn(d().querySelector('.drawer'), '可用的变量')

            facts['settings.panelClosedAfterSave'] = await until(

              .fetch('/api/first-sentence/templates')

            facts['settings.savedReview'] = api ? api.current.reviewTemplate.length > 0 : null
            const again = paneBtn('设置')

          }
        }

        // ══════════════ 审核标准（D37）══════════════
        //
        // 标准内联在审核者身上，所以：① 列表/详情里要看得见"它按什么判"；

        await until(() => d().querySelectorAll('.agent-row').length > 0)
        await wait(400)

        // 详情：点开审核者 ⇒ 看得到标准的名字与正文
        const reviewerRow = [...d().querySelectorAll('.agent-row')].find((row) =>

        if (reviewerRow) {
          click(reviewerRow.querySelector('.agent-item'))
          await until(() => !!d().querySelector('.detail'))
          await wait(400)
          facts['standard.detailHasName'] = need('标准名', () => {
            const row = [...d().querySelectorAll('.detail .field-row')].find((r) =>
              text(r.querySelector('.row-label')) === '审核标准',

          })
          facts['standard.detailShowsBody'] = (() => {
            const row = [...d().querySelectorAll('.detail .field-row')].find((r) =>
              text(r.querySelector('.row-label')) === '审核标准',
            )
            const pre = row && row.querySelector('pre')

          })()
          // ★ D40 收口：行动权限是审核者自己的**一段**（不在「审核标准」那一行里了）。
          //   原来这两条读的都是"审核标准"那一行里的文字；现在读的是那一段本身
          //   ——位置变了，断言跟着改（改的是"它现在在哪一段"，不是放宽判据）。
          //
          //   ⚠️ 先把**那一段的容器**取出来再在里面量：只把选择器换到另一个地方，
          //      "动作清单到底在不在「行动权限」段里"就没人看着了，而那是这次搬家的
          //      全部内容。容器靠段落标题认（`h3` 就是那一段的名字）。
          const actionsSection =
            [...d().querySelectorAll('.detail .section')].find((s) =>
              (text(s.querySelector('h3')) ?? '').includes('行动权限'),
            ) ?? null
          facts['standard.detailActionsSectionTitle'] = need('行动权限那一段的标题', () =>
            actionsSection ? text(actionsSection.querySelector('h3')) : null,
          )
          facts['standard.detailHasActionsSection'] = actionsSection !== null
          // ══════════════════════════════════════════════════════════════
          // 只读态那一行里显示的**契约值**（D41 之后判据换了，而且是收窄）
          // ══════════════════════════════════════════════════════════════
          //
          // 原来这里量的是"chips 里有 `comment.create`"。D41 把内置动作整组移除
          // 之后，那个名字**不再是任何动作**（动作只能是 `<包 slug>.<动作名>`），
          // 留着它就等于把断言钉在旧现实上——而它是绿的还是红的，取决于夹具里
          // 那个 agent 当年存了什么，与新现实无关。
          //
          // 现在量两份事实，由 run.mjs 判：
          //   ① 那一行里 chip 的**值**（契约值原样显示，不是翻译、也不是别的什么）；
          //   ② 接口回给这个 agent 的 `allowedActions`——判据是"界面上显示的逐字
          //      等于库里那份"，而不是"显示了我期待的那一个名字"。
          const reviewerName = text(d().querySelector('.detail h2'))
          const detailActionRow = () =>
            [...(actionsSection?.querySelectorAll('.field-row') ?? [])].find((r) =>
              text(r.querySelector('.row-label')) === '允许触发的动作',
            )
          facts['standard.detailActionChips'] = (() => {
            const row = detailActionRow()
            return row ? [...row.querySelectorAll('.chip code')].map((c) => text(c)) : null
          })()
          facts['standard.detailActionSource'] = await f.contentWindow
            .fetch('/api/agents')
            .then((r) => r.json())
            .then((payload) => {
              const a = (payload.agents ?? []).find((x) => x.name === reviewerName)
              if (!a) return null
              // ⚠️ 按**界面那条显示规则**取：自己的那份为空时回退到老字段
              //    （`reviewStandard.allowedActions`，见 `lib/agent-actions.ts`）。
              //    照 `allowedActions` 一个字段硬比的话，老工作区里那种"动作写在
              //    标准里"的 agent 会把这条检查骗成红的——而界面上显示的正是那份。
              const own = a.allowedActions ?? []
              return own.length > 0 ? own : (a.reviewStandard?.allowedActions ?? [])
            })
            .catch(() => null)
          // ★ 反向（老数据那条提示的**负例**）：这个审核者**自己**有动作权限，
          //   所以"动作也来自那些 skill"那句不该出现——它一出现就是在说假话
          //   （列表明明是满的）。只读与编辑两种形态都不该有。
          facts['standard.actionsHintAbsentWhenSet'] = !String(
            text(actionsSection) ?? '',
          ).includes('也来自这些 skill')
          // 反向：那一行**不再**在「审核标准」里（否则同一件事有两个出处）。
          // ⚠️ 判据不能是"那一行的文字里有没有 comment.create"——标准的**正文**本身
          //    就提到了这个动作名（内置标准里那句"纯提示用 `comment.create`"），
          //    于是"正文提到过"会把这条检查骗成红的。动作在界面上是 `.chip`，
          //    所以按结构判：标准那一行里不该有任何动作 chip。
          //    （只看**标准那一行**，不看"用什么标准"整段：那一段里还有"挂载的
          //     skill"那一行，它本来就该有 chip。）
          facts['standard.detailActionsOutOfStandard'] = (() => {
            const row = [...d().querySelectorAll('.detail .field-row')].find((r) =>
              text(r.querySelector('.row-label')) === '审核标准',
            )
            return row ? row.querySelector('.chip') === null : false
          })()
          facts['standard.emptyWarning'] = !d()
            .querySelector('.headline')
            ?.textContent?.includes('审不了任何东西')

          // ── 端到端：在详情里勾一个动作 → 保存 → **以接口为准**真的变了 ──
          //
          //   ★ 这是这一组里唯一一条走完整写入口的检查（`PATCH /api/agents/:id` 的
          //     `allowedActions`）：段落、勾选栏、草稿、patch、刷新少一环都会红。
          //     少一条的话，"界面画得对"与"真的写得进去"之间就没人看着（这个仓库里
          //     "接口支持、界面没有入口"以及反过来的情况都出现过）。
          //
          //   ⚠️ 勾的是夹具工具的那个动作（`probe-tool.append-note`）：后面那条
          //      "切英文时契约值不翻译"靠的正是详情里的这个动作名，所以两条量的是
          //      同一个动作名，不会互相踩。
          const stdEditBtn = [...d().querySelectorAll('.detail button')].find(
            (b) => text(b) === '编辑',
          )
          if (stdEditBtn) {
            click(stdEditBtn)
            // ⚠️ D41：勾选栏里**只剩**已装工具的动作（内置动作那一组连同
            //    `.action-picker` 那个容器一起没有了），所以等一下的是工具动作
            //    的勾选框。勾的是夹具工具的一个动作——`probe-tool.append-note`：
            //    它正是这条端到端链路的**唯一**合法取值（旧的 `notify.emit` 已经
            //    不是一个动作了，提交它会被服务端 400 拒在保存那一刻）。
            await until(() => !!d().querySelector('.action-perms .ap-ck'), 60)
            const notifyBox = [
              ...d().querySelectorAll('.action-perms .ap-ck'),
            ].find((i) => i.value === 'probe-tool.append-note')
            facts['standard.actionEditBoxFound'] = !!notifyBox
            if (notifyBox) {
              notifyBox.checked = true
              notifyBox.dispatchEvent(new Event('change', { bubbles: true }))
              await wait(200)
            }
            const saveBtn = [...d().querySelectorAll('.detail button')].find((b) =>
              text(b).startsWith('保存'),
            )
            facts['standard.actionSaveButtonFound'] = !!saveBtn
            if (saveBtn) {
              click(saveBtn)
              // 保存成功 ⇒ 退出编辑态（勾选栏消失）；否则等超时再往下走
              await until(() => !d().querySelector('.action-perms .ap-ck'), 60)
              await wait(300)
            }
            facts['standard.actionChipsAfterSave'] = [
              ...d().querySelectorAll('.detail .field-row .chip code'),
            ].map((c) => text(c))
            facts['standard.actionEditSaved'] =
              facts['standard.actionChipsAfterSave'].includes('probe-tool.append-note')
            // ★ 契约值旁边**带着它的 `summary`**（工具作者写的那一句话）。
            //   只显示机器名的话，"它允许的到底是什么"就只能靠猜——所以这一条与
            //   上面那条一起量：值对了、说明也在。
            facts['standard.actionSummaryAfterSave'] = need('动作 chip 旁边的说明', () => {
              const row = detailActionRow()
              const chip = [...(row?.querySelectorAll('.chip') ?? [])].find((c) =>
                text(c.querySelector('code')) === 'probe-tool.append-note',
              )
              return chip ? text(chip.querySelector('.chip-sub')) : null
            })
            // ★ 界面显示的不算数，**接口回的那份**才算数（免得"只画对了"也算通过）
            facts['standard.actionSavedOnServer'] = await f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then((payload) => {
                const rev = (payload.agents ?? []).find((a) => a.name === reviewerName)
                facts['standard.serverAllowedActions'] = rev ? rev.allowedActions : null
                return (
                  Array.isArray(rev?.allowedActions) &&
                  rev.allowedActions.includes('probe-tool.append-note')
                )
              })
              .catch(() => false)
          }
        } else {
          errors.push('找不到审核者的卡片')
        }

        // 新建表单：审核角色下出现标准编辑栏，执行者下不出现
        const newBtn2 = [...d().querySelectorAll('.pane-actions button')].find(
          (b) => b.textContent.trim() === '新建',
        )
        if (newBtn2) {
          click(newBtn2)
          await until(() => !!d().querySelector('.agent-form'))
          const form2 = d().querySelector('.agent-form')
          facts['standard.formHasEditorForExecutor'] = !!(
            form2 && form2.querySelector('.standard')
          )
          // ★ 执行者身上**一段都不出现**，更不会预勾任何动作：执行者的能力是工具，
          //   动作是判完之后由平台执行的；服务端对"执行者带动作"是 400，所以表单
          //   连这一栏都不该给（给了就是一个必然失败的勾选）。
          facts['standard.formActionsAbsentForExecutor'] = !(
            form2?.querySelector('.action-perms') ?? null
          )
          // 切成"审核"角色 ⇒ 标准编辑栏出现
          const roleCards = [...form2.querySelectorAll('.role-card')]
          const reviewerCard = roleCards.find((c) => (c.textContent ?? '').includes('审核'))
          if (reviewerCard) {
            click(reviewerCard)
            await until(() => !!(form2 && form2.querySelector('.standard')))
          }
          facts['standard.formHasEditorForReviewer'] = !!(form2 && form2.querySelector('.standard'))

          // ══════════════════════════════════════════════════════════════
          // 两栏各自量：**标准 = 名字 + 正文**，**行动权限 = 动作勾选**
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 动作的勾选从"审核标准那一栏"搬到了新的「行动权限」栏（D40 收口），
          //   所以这里**先把新段的容器取出来**，再在容器里量——只改数字（把选择器
          //   从一个地方换到另一个地方）是不够的：那样"勾选框在不在那一段里"就没
          //   人看着，而这正是这次搬家的全部内容。
          //
          //   ⚠️ 两个容器分开取，别用一个 `.agent-form` 兜底：以后两边各自演化
          //      （标准加字段、行动权限加分组）时，混在一个根上的断言会互相牵连。
          const formFieldWithLabel = (needle) =>
            [...(form2?.querySelectorAll('.field') ?? [])].find((f) =>
              (text(f.querySelector('.field-label')) ?? '').includes(needle),
            ) ?? null
          // 「行动权限」那一栏的宿主容器（它的字段标题就是那一段的名字）
          const actionsHost = formFieldWithLabel('行动权限')
          facts['standard.formActionsBlockLabel'] = need('行动权限那一栏的标题', () =>
            actionsHost ? text(actionsHost.querySelector('.field-label')) : null,
          )
          // 标准编辑器容器（名字 + 正文）
          const standardHost = form2?.querySelector('.standard') ?? null
          facts['standard.formStandardEditorIsNameAndBody'] = !!(standardHost?.querySelector('input') &&
