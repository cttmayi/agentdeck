           *   度量的宿主跟着换，但量的还是同一件事：时间线里有起草这一轮、它两态走得通。
           */
          const draftBubble = () =>
            d().querySelector('[data-draft-turn-msg] [data-chat-turn]')
          facts['crystal.processOpens'] = !!draftBubble()
          const draftSection = draftBubble()
          facts['crystal.draftSectionFound'] = !!draftSection
          facts['crystal.processDraftHasRunBlock'] = !!draftSection
          // 抬头 = `who` 那一行（说的人 + 这一轮的状态），气泡里是产出本身
          facts['crystal.draftHeadText'] = draftSection
            ? text(draftSection.querySelector('.who'))
            : null
          facts['crystal.draftBubbleRole'] = draftSection
            ? draftSection.getAttribute('data-turn-role')
            : null
          /**
           * ★ 分批第 194 批：**时间线的第一条是"你"**（它凭什么开始起草），而且起草那一轮
           *   与聊天页用的是**同一个气泡组件**（`[data-chat-turn]` + `.bubble`）。
           *   这两条合起来才是使用者要的"像聊天那页的对话方式"——只量文案会漏掉形状。
           */
          const requestTurn = d().querySelector('[data-crystal-request] [data-chat-turn]')
          facts['crystal.requestTurnText'] = text(requestTurn?.querySelector('.bubble'))
          facts['crystal.requestTurnRole'] = requestTurn?.getAttribute('data-turn-role') ?? null
          // ★ 分批第 212 批：第一条是**交给它的任务原文**（run 日志里的 ③），不是那句标签
          facts['crystal.requestTurnIsTask'] =
            (facts['crystal.requestTurnText'] ?? '').includes('交给它的任务原文')
          facts['crystal.draftBubbleShape'] = draftSection
            ? {
                chatTurn: draftSection.matches('[data-chat-turn]'),
                bubble: !!draftSection.querySelector('.bubble.agent'),
                who: !!draftSection.querySelector('.who'),
              }
            : null
          // ⚠️ 「最后结果」是异步读回来的 ⇒ 等它出现再量（现在它是气泡正文，不是 `.draft-final`）
          await until(() => !!draftSection?.querySelector('.bubble'), 60)
          const finalEl = draftSection ? draftSection.querySelector('.bubble') : null
          facts['crystal.draftFinalText'] = finalEl ? text(finalEl) : null
          {
            const paneRect = cyRect(draftBubble())
            const box = d().querySelector('.pane-body.detail-scroll')
            const boxRect = cyRect(box)
            const padB = box ? parseFloat(cs(box).paddingBottom || '0') : 0
            const finalRect = cyRect(finalEl)
            facts['crystal.procFinalPaneH'] = paneRect ? Math.round(paneRect.h) : null
            facts['crystal.procFinalContentH'] = finalRect ? Math.round(finalRect.h) : null
            facts['crystal.procFinalGap'] =
              paneRect === null || boxRect === null
                ? null
                : Math.round(boxRect.y + boxRect.h - padB - (paneRect.y + paneRect.h))
          }
          // ★ 分批第 193 批：过程按钮从 `h3` 里搬到消息末尾一行小字（`data-draft-process-toggle`）
          const toggle = draftSection
            ? draftSection.querySelector('[data-draft-process-toggle]')
            : null
          facts['crystal.draftToggleLabel'] = toggle ? text(toggle) : null
          // ★ 分批第 196 批：`who` 行现在是 `.who`（气泡上那行小字），不是 `[data-draft-turn-head]`
          facts['crystal.draftRunIdInHead'] = draftSection
            ? (text(draftSection.querySelector('.who')) ?? '').includes('run ')
            : null
          if (toggle) {
            click(toggle)
            await until(() => !!draftSection?.querySelector('.log-box'), 60)
            facts['crystal.draftLogAfterToggle'] = !!draftSection?.querySelector('.log-box')
            facts['crystal.draftToggleLabelAfter'] = text(toggle)
            click(toggle)
            await until(() => !!draftSection?.querySelector('.bubble'), 60)
            facts['crystal.draftBackToFinal'] = !!draftSection?.querySelector('.bubble')
          }
          // 「按意见改一版」：输入框**默认不在**（点开才占一行）
          // ★ 分批第 17 批：按钮改名「按意见再改一版」→「反馈」，这里跟着改。
          //   ⚠️ 我第一版只改了"点开框"那一处，漏了这一处 ⇒ 判据 `点它之后输入框真的出现`
          //   量到 null（按钮没找到，整条 else 分支），红的是探测脚本不是界面。
          /**
           * ★ 分批第 196 批：「反馈」按钮与它的意见框**删了**（使用者："中栏页头应该不需要
           *   「反馈」"）。改版改由**栏脚那句话**发起（`这里不对：…`）——所以这里量两件事：
           *     ① 页头**没有**「反馈」钮（原来那条"入口叫反馈"的判据翻成反向检查）；
           *     ② 栏脚的占位文案里写得出这句话（否则人不知道怎么改一版 = 假删）。
           */
          facts['crystal.reviseButtonPresent'] = [
            ...d().querySelectorAll('[data-review-actions] button'),
          ].some((b) => text(b).includes('反馈'))
          facts['crystal.reviseButtonName'] = null
          facts['crystal.composerPlaceholder'] =
            d().querySelector('[data-composer] .composer-input')?.getAttribute('placeholder') ?? null
          facts['crystal.reviseRowHiddenInitially'] = !d().querySelector('.revise-row textarea')
          facts['crystal.reviseRowAppearsOnDemand'] = null

          // ★ 改版草稿（`revisedFrom`）：默认对比**上一版草稿**，且能切回"对比当前版本"
          const cyRevisedOk = await cyEnter(cyRevised)
          facts['crystal.revisedAttached'] = cyRevisedOk
          // 先认现场：编辑器里是不是**这一版**的字（否则下面量的是上一条草稿的数字）
          // ⚠️ 要**整份**拿去判：那一句差异在正文第 100 个字符之后，截前 60 个字符
          //    时两版长得一模一样（第一版就是这么写的 ⇒ 这条断言永远红，而现场其实
          //    是对的）。
          facts['crystal.revisedEditorHasMarker'] = (
            d().querySelector('textarea.editor')?.value ?? ''
          ).includes('已按意见改')
          facts['crystal.revisedEditorHead'] = (
            d().querySelector('textarea.editor')?.value ?? ''
          ).slice(0, 60)
          /**
           * ★ 分批第 196 批：结论条删了 ⇒ `+N` 那个数字改从**「差异」页签的表头**读
           *   （`[data-diff-total]`，格式 `共 +2 −2`）。判据的意图没变：量"默认停在哪条基线"。
           */
          // ⚠️ 这个数字在**「差异」页签里**（结论条删了）⇒ 由下面点开页签之后再读，这里先留空
          facts['crystal.revisedBarText'] = null
          // 接口那一份也读一次：分清"接口没给 revisedFrom"与"页面没换现场"
          facts['crystal.revisedApiRevisedFrom'] = await f.contentWindow
            .fetch(`/api/crystallize/artifacts?draftRunId=${encodeURIComponent(cyRevised ?? '')}`)
            .then((r) => (r.ok ? r.json() : null))
            .then((p) => (p ? p.revisedFrom !== null : null))
            .catch(() => null)
          const cyDiffTabB = [...d().querySelectorAll('.pane-tabs > button')].find(
            (b) => text(b) === '差异',
          )
          if (cyDiffTabB) click(cyDiffTabB)
          await until(() => !!d().querySelector('.diff-box'), 60)
          // ★ 分批第 196 批：整条链的合计在「差异」页签的表头（`共 +N −M`）
          await until(() => !!d().querySelector('[data-diff-total]'), 60)
          facts['crystal.revisedBarText'] = text(d().querySelector('[data-diff-total]'))
          const cySwitchButtons = [...d().querySelectorAll('.pane-tabs button')].map((b) => text(b))
          facts['crystal.revisedSwitchButtons'] = cySwitchButtons
          facts['crystal.revisedHasBaselineSwitch'] = cySwitchButtons.includes('对比上一版草稿')
          // ★ 分批第 18 批：第三条基线「对比原 skill」必须常驻（新建场景 = 第一版、更新场景 = 库里那一份）
          facts['crystal.revisedHasOriginalSwitch'] = cySwitchButtons.includes('对比原 skill')
          facts['crystal.revisedDefaultBaselineActive'] = (() => {
            const btns = [...d().querySelectorAll('.pane-tabs .tabs-right button')]
            const active = btns.find((b) => b.classList.contains('active'))
            return active ? text(active) : null
          })()
          facts['crystal.revisedDiffLineCount'] = d().querySelectorAll('.diff-line').length
          // ★ 分批第 18 批：那个合计 `+N` 才是"改动了几行"（`.diff-line` 数的是**渲染出来的**
          //   行，含上下文 ⇒ 夹具里改 1 行也会量到 8 行；我第一版拿它当"改动行数"断言 === 2，红了）。
          // ★ 分批第 196 批：它原来在结论条上，现在在「差异」页签的表头（`[data-diff-total]`）。
          const cyAdded = (t) => {
            const m = /\+(\d+)/.exec(t ?? '')
            return m ? Number(m[1]) : null
          }
          facts['crystal.revisedDiffAdded'] = cyAdded(facts['crystal.revisedBarText'])
          // 再点一次「对比上一版草稿」：同一屏、同一份草稿，只换基线 ⇒ 数字必须**变小**
          // （这是"默认到底停在哪条基线"唯一咬得住的量法；只量一次的话两条基线的值可能撞在一起）
          const cyPrevBtn = [...d().querySelectorAll('.pane-tabs .tabs-right button')].find(
            (b) => text(b) === '对比上一版草稿',
          )
          if (cyPrevBtn) {
            click(cyPrevBtn)
            await wait(250)
            facts['crystal.revisedDiffAddedPrevious'] = cyAdded(
              text(d().querySelector('[data-diff-total]')),
            )
            // 切回默认那条，后面的判据看到的还是默认现场
            const cyOrigBtn = [...d().querySelectorAll('.pane-tabs .tabs-right button')].find(
              (b) => text(b) === '对比原 skill',
            )
            if (cyOrigBtn) click(cyOrigBtn)
            await wait(200)
          }

          // ★★ 「审核未通过」那一屏（§10.5 第 ③ 条，判决 `fail` + `escalated` = 配额用尽）。
          //    判据三条，缺一条这一屏就不成立：
          //      ① 结论条说清"不通过 + 理由码 + 配额用尽"（人要知道为什么停在这儿）；
          //      ② 问题清单**数得出来**（`看 N 条问题`，点开真有 N 条）；
          //      ③ 两个出口都在：**按意见重新起草**（第 ② 条）+ **确认入库仍然可按**
          //         （第 ① 条：审核是预筛，不替人做决定——按钮灰掉就等于把预筛变成了闸）。
          // ★ 分批第 137 批（§12.42 第 ③ 步）：沉淀线的「审核」整条删除。这一屏的夹具仍然叫
          //   `crystalManual`（它会被真的编辑/保存，所以用一条独立夹具）。这一屏还兼量
          //   消息流外壳、栏脚、过程格那几组与审核无关的判据。
          const cyFail = cyQuery.get('crystalManual')
          facts['crystal.manualFixture'] = cyFail
          facts['crystal.legacyEntered'] = await cyEnter(cyFail)
          if (facts['crystal.legacyEntered']) {
            /**
             * ★ 分批第 196 批：**结论条与「反馈」意见框都删了**（它们住在中栏那条产物消息里，
             *   而那条消息整块去掉了）。所以这一屏原来量的：
             *     · `legacyBarText` / `legacySaysCheck` / `legacyNoAuditContent`（结论条只说体检、
             *       不许出现审核/判决内容）——**目标换了宿主**：体检结论现在在**右栏**，
             *       于是改成量右栏的体检那一节；
             *     · `reviseToggleButton` 与那五条"意见框"判据（开框、默认为空、有焦点、提交可点、
             *       开框不自己跑）——**功能搬到了栏脚**（`这里不对：…`）。判据跟着搬成
             *       "栏脚那句话能开出一条改版 run"（见 `crystal.reviseViaComposer*`）。
             */
            const cyPaneText = text(d().querySelector('.artifact-pane')) ?? ''
            facts['crystal.legacyBarText'] = cyPaneText
            facts['crystal.legacySaysCheck'] = /体检/.test(cyPaneText)
            // 右栏里**不许**出现审核/判决内容（§12.15 代价 ③：入库不许声称"审过"）
            facts['crystal.legacyNoAuditContent'] = !/审核不通过|style_violation|问题清单/.test(
              cyPaneText,
            )
            // 历史判决的条目**不再渲染**（问题清单是审核的东西，审核删了它就该消失）
            facts['crystal.legacyFindingsGone'] =
              d().querySelectorAll('.audit-findings, .findings').length === 0
            // 同一个动作只有一个入口：这两个旧按钮不该存在
            facts['crystal.redraftOldButtonsGone'] = ![
              ...d().querySelectorAll('button'),
            ].some((b) => text(b).includes('按意见重新起草') || text(b).includes('填入审核问题'))
            /**
             * ★ 分批第 196 批：**「反馈」按钮与它的意见框都删了**。
             *
             * 使用者："中栏页头应该不需要「反馈」"。改版现在是**在栏脚说一句**
             * 「这里不对：…」（那条路由与「追加材料：…」同一条，见上面栏脚那一段），
             * 所以这里原来量"开框 / 框里默认空 / 有焦点 / 提交可点 / 开框不自己跑"的五条
             * 一起作废——它们量的**功能已经不存在了**，不是量不到。
             */
            facts['crystal.reviseToggleButton'] = null
            facts['crystal.redraftBoxOpened'] = null
            facts['crystal.reviseEmptyByDefault'] = null
            facts['crystal.redraftFocused'] = null
            facts['crystal.redraftSubmitEnabled'] = null
            facts['crystal.redraftStillEditing'] = null

            // 出口二：确认入库**没有**被判决灰掉（第 ① 条决定：审核不替代人）
            const cySave = [...d().querySelectorAll('button.btn--primary')].find((b) =>
              text(b).includes('确认入库'),
            )
            facts['crystal.auditFailSaveDisabled'] = cySave ? cySave.disabled : null
            facts['crystal.auditFailSavePresent'] = !!cySave
            // ★ 分批第 27 批：使用者报「多轮起草-审核过程中界面没有更新，看不出来是否已经结束了」。
            //   这一屏**有判决**（就是刚判 fail 的那条），所以结论条上必须挂着"循环状态"——
            //   那是人判断"结束了没有"唯一的一眼可见的东西。
            //   ⚠️ 第一版我把它量在了深链那屏（那条草稿没判决）⇒ 量到 null、判据红，
            //      而界面没错：没判决时本来就不该有"循环"这回事。**量错地方比没有量更坏**。

            /**
             * ★★★ 分批第 33 批：使用者报「草稿过程和审核过程的高度没有适应」。
             *
             * 先量两个子 tab 各自的格子：高度是多少、底边离内容盒底还差多少、
             * 格子里的日志框有没有把格子填起来（日志框自己有 `max-height`）。
             */
            const cyProcTab = (name) =>
              [...d().querySelectorAll('.process-subtabs button')].find(
                (b) => text(b) === name,
              )
            const cyProcTabOuter = [...d().querySelectorAll('.review-tabs > button')].find(
              (b) => text(b).startsWith('过程'),
            )
            if (cyProcTabOuter) click(cyProcTabOuter)
            await untilNet(() => !!d().querySelector('.process-subtabs button'), 60)
            const cyBodyBox = d().querySelector('.pane-body.detail-scroll')
            const cyBodyBoxRect = cyRect(cyBodyBox)
            const cyBodyPadB = cyBodyBox ? parseFloat(cs(cyBodyBox).paddingBottom || '0') : 0
            /**
             * ★ 分批第 106 批（U3a）：中间栏多了**栏脚输入条**，所以"格子填满到哪儿"的参照线
             * 从内容盒底上移了一个栏脚高度。这里只**量出**栏脚高（一条事实），
             * 由判据那头自己减——不去改那几处 gap 计算（上一版改测量代码，一次 188 红、一次 185 红）。
             *
             * ★ 分批第 131 批：栏脚从"只有输入条"变成"输入条 + 回执"（`追加材料` 等动作会在
             * 栏脚留一行回执，§12.41）。**不能把两块包进一个新 div 再量**——组件里 §12.22
             * 的教训就是"多包一层打断高度链、过程格缩 100px"（这一批先踩了一次，探针当场红
             * 两条）。所以改成两块**分别量**，判据那头**加**起来减：
             *   · composerH  = 输入条（form）高
             *   · composerReceiptH = 回执那一行（含 margin-top），没有回执时为 0
             * 三层一起量（form / 回执 / footH=detail-pane 底 − pane-body 底）是为了下次
             * 判据说"没量到"时能直接看出是哪一层的账对不上，而不是再猜 markup。
             */
            facts['crystal.composerH'] = (() => {
              const composer = d().querySelector('[data-composer]')
              return composer ? Math.round(composer.getBoundingClientRect().height) : 0
            })()
            // U3a 的形态判据：外壳在、旧内容确实在"一条消息"里、输入条贴在栏脚
            facts['crystal.chatShellPresent'] =
              !!d().querySelector('.crystal-chat > .crystal-msg .crystal-flow')
            facts['crystal.composerAtFoot'] = (() => {
              const chat = d().querySelector('.crystal-chat')
              const composer = d().querySelector('[data-composer]')
              if (!chat || !composer) return null
              // 回执出现时它是 chat 的最后一个孩子（栏脚变成两块），两种都算"在栏脚"
              const last = chat.lastElementChild
              const isFoot =
                last === composer || (last?.classList?.contains('composer-receipt') ?? false)
              const chatRect = chat.getBoundingClientRect()
              const cRect = (last ?? composer).getBoundingClientRect()
              return isFoot && Math.abs(chatRect.bottom - cRect.bottom) <= 2
            })()

            const cyProbePane = async (name, paneSel) => {
              void name
              const pane = d().querySelector(paneSel)
              const rect = cyRect(pane)
              // 日志框与「最后结果」是同一条规矩的两种形态（在跑 = 日志；跑完 = 最后结果），
              // 两个都要量：只量 `.log-box` 的话，已完成草稿那一档永远是 null、判据无从落。
              const logBox =
                (pane ? pane.querySelector('.log-box') : null) ??
                (pane ? pane.querySelector('.draft-final') : null)
              const logRect = cyRect(logBox)
              return {
                paneH: rect ? Math.round(rect.h) : null,
                gap:
                  rect === null || cyBodyBoxRect === null
                    ? null
                    : Math.round(
                        cyBodyBoxRect.y + cyBodyBoxRect.h - cyBodyPadB - (rect.y + rect.h),
                      ),
                logBoxH: logRect ? Math.round(logRect.h) : null,
              }
            }
            // ★ 分批第 143 批（U4d）：过程 tab 已删 ⇒ 草稿过程在**系统消息**里
            //   （它照样要"贴着内容盒底"，那组判据本来就是量这一格的）。
            const cyDraftProc = await cyProbePane('草稿过程', '.crystal-msg[data-msg-role="system"]')
            facts['crystal.procDraftPaneH'] = cyDraftProc.paneH
            // ⚠️ 形态要**无条件**量（第一版只在 paneH===0 时量 ⇒ 判据拿到 undefined，
            //    把"空态"误判成"有内容但没吃满"。这一屏的草稿确实没有文字产出 ⇒ 空态是对的）。
            {
              const pane = d().querySelector('.crystal-msg[data-msg-role="system"]')
              facts['crystal.procDraftState'] = !pane
                ? 'missing'
                : pane.querySelector('.log-box')
                  ? 'log'
                  : pane.querySelector('.draft-final')
                    ? 'final'
                    : pane.querySelector('.skeleton')
                      ? 'skeleton'
                      : pane.querySelector('.empty')
                        ? 'empty'
                        : 'nothing'
            }
            facts['crystal.procDraftGap'] = cyDraftProc.gap
            facts['crystal.procDraftLogBoxH'] = cyDraftProc.logBoxH
            facts['crystal.procViewportH'] = facts['crystal.viewportH']
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 人改草稿：保存改动 → 结论标过期 → 重新审核（2026-10-21 分批第 8 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 起因是使用者的原话：「缺少一个可以改的地方」。编辑器一直都在（这一屏的文件树
          // 每个文本文件都能改），缺的是**改完算不算数**：改动原来只活在浏览器内存里，
          // 而审核者读的是磁盘上的 `skill/`。
          //
          // 这一节量四件事（缺任何一条，"改了算数"就只是句口号）：
          //   ① 刚进这一屏（没改过）**没有**「保存改动」、也**没有**过期标记；
          //   ② 在编辑器里打字 ⇒ 出现「保存改动」（只在有未保存改动时出现）；
          //   ③ 点它 ⇒ 标记出现「内容已改 —— 这个结论是改之前的」+ 出现「重新审核」；
          //   ④ 保存真的写到了磁盘/接口上（重读 artifacts，正文是新写的）。
          {
            const cyManual = cyQuery.get('crystalManual')
            facts['crystal.manualEntered'] = await cyEnter(cyManual)
            if (facts['crystal.manualEntered']) {
              /**
               * ★ 分批第 153 批：找按钮的范围从 `.conclusion-block` 放到**整页**。
               * 为什么：编辑器和它的「保存改动」一起从结论条那一行搬进了编辑器
               * （`CrystallizeDraftEditor`，下一步就挂到右栏），仍按结论条找就永远找不到。
               * 判据本身没变（"改过字才出现、保存完消失、磁盘真的变了"），只是参照物跟着搬家。
               */
              const cyHasText = (needle) =>
                [...d().querySelectorAll('button')].some((b) => text(b).includes(needle))
              facts['crystal.manualBeforeButtons'] = [
                ...d().querySelectorAll('.conclusion-block button'),
              ].map((b) => text(b))
              // ★ 分批第 137 批：没有审核结论 ⇒ 不该有"结论已过期"标记（那条判据删了）

              // 在编辑器里"打字"：Svelte 的 bind:value 听的是 input 事件
              const ta = d().querySelector('textarea.editor')
              if (ta) {
                ta.value = `${ta.value}\n\n（人手加的一行：${cyManual.slice(-6)}）`
                ta.dispatchEvent(new Event('input', { bubbles: true }))
              }
              await until(() => cyHasText('保存改动'), 40)
              facts['crystal.manualDirtySaveButton'] = cyHasText('保存改动')

              const saveBtn = [...d().querySelectorAll('button')].find((b) =>
                text(b).includes('保存改动'),
              )
              if (saveBtn) click(saveBtn)
              // ★ 分批第 137 批："结论已过期 / 重新审核"随审核一起删除——
              //   没有审核结论，也就没有"过期"；保存之后只该看**保存按钮消失**与**磁盘真的变了**。
              await until(() => !cyHasText('保存改动'), 120)
              // 保存按钮自己应该**消失**了（没有未保存改动 ⇒ 它不该继续挂着）
              facts['crystal.manualSaveButtonGone'] = !cyHasText('保存改动')
              // ④ 真的写到了磁盘：重读 artifacts（它读的就是草稿小屋里的 `skill/`）
              const cyAfters = await fetch(
                `/api/crystallize/artifacts?draftRunId=${encodeURIComponent(cyManual)}`,
              ).then((r) => r.json())
              facts['crystal.manualOnDiskHasEdit'] = String(
                (cyAfters?.files ?? {})['SKILL.md'] ?? '',
              ).includes('人手加的一行')
            }
          }

          // ★ 分批第 137 批（§12.42 第 ③ 步）：沉淀线的「审核」整条删除 ⇒
          //   "审核真的跑起来"（实时日志/取消/重试）与"审核没跑成"（卡死兜底文案）这两屏
          //   连同夹具（`crystalAuditLive` / `crystalAuditDead`）一起删除。
          //   被删的是**功能本身**，它们的判据也一起删（§12.42 第 ③ 步）。

          // ★ 分批第 191 批：「优化智能体指令」整条功能删掉了，这里原来量智能体草稿审阅屏的
          //   五条（`crystal.agent*`）与它的夹具一起删——功能不存在了，判据留着只会红。
          //   被删的原因是**功能下线**，不是"量不到"。

          // ★★★ 深链语义：URL 指名的草稿**就是**那一条（2026-10-21 第 7 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 真机上量出来的缺陷：`#/crystallize/<草稿id>` 里那个 id 原来被后端丢掉、
          // 一律挂"该来源最新那条"⇒ 同一来源下的几条草稿在「沉淀」列表里是**几行、
          // 点开却是同一条**（实测：同一对话来源下 4 条草稿只有最新那条能看，其余几条
          // 花钱审出来的判决在界面上打不开）。
          //
          // 这一节量两件事，缺一不可（只量前者会把"来源入口也变成深链"这种改坏当成通过）：
          //   ① 深链点**旧的那条** ⇒ 挂上的就是旧的（兄妹草稿只有 1 个文件）；
          //   ② 从**来源**进来 ⇒ 仍然是"最近那条"（3 个文件）。
          {
            const cySibling = cyQuery.get('crystalSibling')
            const cySource = cyQuery.get('crystalSource')
            const cyReadDraft = async (id) => {
              if (!id) return null
              f.contentWindow.location.hash = '#/tasks'
              await until(() => !d().querySelector('.crystal-chat'), 80)
              await wait(80)
              f.contentWindow.location.hash = `#/crystallize/${id}`
              // ★ 分批第 141 批：自动接上（见 `cyEnter` 的注释）
              // ★ 分批第 196 批：结论条删了 ⇒ 审阅态的标志是栏头那排动作
              const attached = await until(
                () => !!d().querySelector('[data-review-actions]'),
                120,
              )
              if (!attached) return null
              // ★ 分批第 155 批：编辑器搬进右栏 ⇒ 树在 `.artifact-pane` 里（不是中间那条消息）。
              //   而且它**比结论条晚一拍**：右栏自己拉产物、自己打开编辑器 ⇒ 不等它就会读到空数组
              //   （第一版就是这么误判成"从来源进来挂错了草稿"的）。
              // ⚠️ 这里**不能**把选择器钉死在 `.artifact-pane` 上：从"来源 run"进来时，
              //   右栏拿到的是**路由里的那个 runId**（来源 run），它的 `artifacts` 是 404
              //   （产物属于挂上来的那条草稿）⇒ 右栏空、编辑器不出现，而中间那栏已经接上了
              //   那条草稿。所以量"编辑器里列了几个文件"就该问**整页**（编辑器在哪一栏都一样）。
              await until(() => d().querySelectorAll('.review-pane .file-row').length > 0, 120)
              return {
                rows: [...d().querySelectorAll('.review-pane .file-row')].map((r) => text(r)),
                bar: text(d().querySelector('[data-diff-total]')),
              }
            }
            const cySiblingView = await cyReadDraft(cySibling)
            facts['crystal.deepLinkSiblingRows'] = cySiblingView ? cySiblingView.rows : null
            facts['crystal.deepLinkSiblingBar'] = cySiblingView ? cySiblingView.bar : null

            const cySourceView = await cyReadDraft(cySource)
            facts['crystal.sourceEntryRows'] = cySourceView ? cySourceView.rows : null
            // 收尾：切走路由（后面的小节自己会进它要的页面）
            f.contentWindow.location.hash = '#/tasks'
            await until(() => !d().querySelector('.crystal-chat'), 80)
              await wait(80)
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ "它只说了话、没交 skill"那一屏（分批第 211 批，前身是第 194 批的"拒绝"）
          // ══════════════════════════════════════════════════════════════
          //
          // 使用者真机上撞到的：一条"没什么可沉淀的"草稿，界面上写着「体检发现 1 处问题 ·
          // 校验未通过（1）」，读起来像**审核没过**（而审核第 137 批就删了）。它不是失败，
          // 是"这一轮没交东西" ⇒ 不画结论条、不给入库，理由就是**它自己那句话**。
          //
          // ⚠️ 分批第 211 批换掉了夹具与判据的名字：从前那一屏靠 `skill/REFUSED.md` 认出来
          //    （协议文件），现在靠 `skill/SKILL.md` **不在**（事实）。所以这里量的是同一批行为，
          //    只是"为什么"从文件变成了产出形态：`who` 行说「没交 skill」、理由出现一次、
          //    没有结论条/审阅抬头/确认入库、两个出口都在。
          {
            const cyNoOutput = cyQuery.get('crystalNoOutput')
            facts['crystal.noOutputFixtureId'] = cyNoOutput || null
            if (cyNoOutput) {
              f.contentWindow.location.hash = '#/tasks'
              await until(() => !d().querySelector('.crystal-chat'), 80)
              await wait(80)
              f.contentWindow.location.hash = `#/crystallize/${cyNoOutput}`
              // 没交 skill ⇒ 结论条整条不画 ⇒ 等的是起草那一轮的消息本身
              const attached = await until(
                () =>
                  (d().querySelector('[data-draft-turn-msg] [data-chat-turn] .who')?.textContent ?? '')
                    .includes('没交 skill'),
                120,
              )
              facts['crystal.noOutputAttached'] = attached
              if (attached) {
                facts['crystal.noOutputHeadText'] = text(
                  d().querySelector('[data-draft-turn-msg] [data-chat-turn] .who'),
                )
                facts['crystal.noOutputBubbleText'] = text(
                  d().querySelector('[data-draft-turn-msg] [data-chat-turn] .bubble'),
                )
                const pageText = d().body?.textContent ?? ''
                // 数**正文那一句**（它说的话就是理由；不该在别处再出现一遍）
                facts['crystal.noOutputReasonHits'] = (
                  pageText.match(/只有一次性的环境排错/g) ?? []
                ).length
                facts['crystal.noOutputNoConclusionBar'] = !d().querySelector('.conclusion-bar')
                facts['crystal.noOutputNoReviewHeading'] =
                  ![...d().querySelectorAll('h3')].some((h) => text(h).includes('审阅草稿'))
                facts['crystal.noOutputNoConfirmButton'] = ![...d().querySelectorAll('button')].some(
                  (b) => text(b).includes('确认入库'),
                )
                /**
                 * ★ 分批第 239 批：这一屏原来有两个出口（重新起草 / 放弃），现在只剩
                 *   「重新起草」——「放弃」按钮整页删掉了（使用者定）。
                 */
                facts['crystal.noOutputHasExits'] = [
                  ...d().querySelectorAll('[data-draft-turn-msg] button'),
                ].some((b) => text(b).includes('重新起草'))
              }
              f.contentWindow.location.hash = '#/tasks'
              await until(() => !d().querySelector('.crystal-chat'), 40)
            }
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 目标态那一屏（2026-10-21 第 5 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 它是这一屏的**入口**（从任务/对话点「沉淀成 skill」进来的第一眼），却一直是
          // 探针的空白：夹具都挂在"已完成草稿"上，`step === 'target'` 没有任何判据。
          // 夹具用一条**永远不起草**的源 run（挂上草稿这一屏就不再是目标态了）。
          //
          // 这一节量的是使用者确认过的第 ③ 条决定：**目标态不做 tab**（表单 + 一行素材判据
          // 常驻，素材清单那时还没落盘 ⇒ 不许画一行空的折叠出来）。
          {
            const cyTarget = cyQuery.get('crystalTarget')
            facts['crystal.targetFixtureId'] = cyTarget || null
            if (cyTarget) {
              f.contentWindow.location.hash = '#/tasks'
              await untilNet(() => !d().querySelector('.crystal-chat'), 40)
              await wait(80)
              f.contentWindow.location.hash = `#/crystallize/${cyTarget}`
              // 目标态的标志：那张表单（radio 行 + 作用描述框）**当场**就在，不用点「继续」
              // 分批第 96 批：先按**状态锚点**定位这一屏，再在它里面找控件。
              // 断言没变（目标态那张表单在），变的只是"怎么找到这一屏"。
              // 分批第 103 批：目标屏换成向导
              facts['crystal.targetAttached'] = await untilNet(
                // 等的是**第一问的选项**，不是 `.intake` 外壳：外壳在 targets 还没到时
                // 也在（里面是骨架），那样会量到"0 个选项"然后一路空过。
                () => !!d().querySelector('[data-crystallize-step="target"] .intake-choice'),
                90,
              )
              // 分批第 98 批：目标组的**入口断言**——进这一组之前先确认"现在是 target 那一屏"
              facts['crystal.enterStepTarget'] =
                d().querySelector('.crystal-flow')?.getAttribute('data-crystallize-step') ?? null
              if (facts['crystal.targetAttached']) {
                facts['crystal.stepMarkerValue'] =
                  d().querySelector('.crystal-flow')?.getAttribute('data-crystallize-step') ?? null
                // ★ 分批第 142 批（U4c）：目标态不再有"面板标题"（`.intake-title`）——问答已经是
                //   消息。原来那条「目标态停在**第 1 步**」的判据随步骤条/面板一起删（见 run.mjs）。
                facts['crystal.targetFirstQuestion'] = text(d().querySelector('.intake-q'))
                facts['crystal.targetTabCount'] = d().querySelectorAll('.review-tabs').length
                facts['crystal.targetOldFormCount'] = d().querySelectorAll('.radio-row').length
                facts['crystal.targetFormRows'] = d().querySelectorAll('.intake-choice').length
                facts['crystal.targetFormLabels'] = [...d().querySelectorAll('.intake-choice')].map((el) =>
                  text(el).split('\n')[0],
                )
                const cyNew = [...d().querySelectorAll('.intake-choice')].find((b) => text(b).includes('新建'))
                if (cyNew) click(cyNew)
                await until(() => !!d().querySelector('.intake-input'), 40)
                const cyNext = () => [...d().querySelectorAll('button')].find((b) => text(b) === '下一步')
                facts['crystal.targetNextDisabledWhenEmpty'] = cyNext() ? cyNext().disabled : null
                const cyTa = d().querySelector('.intake-input')
                if (cyTa) {
                  cyTa.value = '探针填的作用描述：把一次跑通的流程固化成技能'
                  cyTa.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }))
                }
                await until(() => {
                  const b = cyNext()
                  return !!b && !b.disabled
                }, 40)
                const cyCanAdvance = !!cyNext() && !(cyNext()?.disabled ?? true)
                if (cyNext()) click(cyNext())
                await until(
                  () => [...d().querySelectorAll('button')].some((b) => text(b).includes('开始提炼')),
                  40,
                )
                facts['crystal.targetAdvanced'] =
                  cyCanAdvance &&
                  [...d().querySelectorAll('button')].some((b) => text(b).includes('开始提炼')) &&
                  d().querySelectorAll('.intake-choice').length === 0
                const cyStartBtn = [...d().querySelectorAll('button')].find((b) => text(b).includes('开始提炼'))
                facts['crystal.targetStartButton'] = cyStartBtn ? text(cyStartBtn) : null
                // ⚠️ 必须兜住 null：走不到确认步时 `.intake-summary` 不存在，`text()` 会给 null，
                //    紧接着 `.replace` 就抛 TypeError——**探针自己当场死掉**，后面所有组全空
                //    （表现为"改沉淀页，聊天页整组红"，其实是同一件事：脚本没跑完）。
                facts['crystal.targetSummary'] = String(
                  text(d().querySelector('.intake-summary')) ?? '',
                )
                  .replace(/\s+/g, ' ')
                  .trim()
                facts['crystal.targetMaterialLine'] = facts['crystal.targetSummary']
                facts['crystal.targetFoldCount'] = d().querySelectorAll('.fold-section').length
                facts['crystal.targetScrollH'] = d().documentElement.scrollHeight
                facts['crystal.targetPageFits'] =
                  facts['crystal.targetScrollH'] <= facts['crystal.viewportH'] + 1
                const cyTBox = cyRect(d().querySelector('.intake'))
                facts['crystal.targetFormBox'] = cyTBox
                const cyTPaneBox = cyRect(d().querySelector('.detail-pane'))
                facts['crystal.targetFormInsidePane'] =
                  cyTBox !== null && cyTPaneBox !== null && cyTBox.x + cyTBox.w <= cyTPaneBox.x + cyTPaneBox.w + 1
              }
            }
          }

          // ══════════════════════════════════════════════════════════════
          // ★★★ 起草中那一屏（2026-10-21 第 4 批）
          // ══════════════════════════════════════════════════════════════
          //
          // 这一节以前**完全是空白**：探针的夹具都是"已完成草稿"，`step === 'drafting'`
          // 没有任何判据兜着（第 3 批改那一段标记时只能靠手工起一条真 run 验）。
          // 现在夹具在 Node 侧真的发起一条起草 run（假 `agent-cli` 吐一行就挂着），
          // 于是这一屏的判据量的是**真现场**：真 running、真日志、真 SSE。
          //
          // ⚠️ 全节必须走 `untilNet`：起草 run 的日志流（SSE）开着 ⇒ Chrome 的虚拟
          //    时钟**不走**，`until()` 里的 `setTimeout` 永远不触发（这条在审核那一节
          //    已经踩过一次，症状是"探针跑满超时、dump 里 done 不是 true"）。
          // ⚠️ 结尾必须**切走路由**把组件卸载掉：不关掉这条 SSE，后面每一节的时钟都是冻的。
          {
            const cyDrafting = cyQuery.get('crystalDrafting')
            facts['crystal.draftingFixtureId'] = cyDrafting || null
            const cyEnterDrafting = async () => {
              if (!cyDrafting) return false
              f.contentWindow.location.hash = '#/tasks'
              await untilNet(() => !d().querySelector('.crystal-chat'), 40)
              await wait(80)
              f.contentWindow.location.hash = `#/crystallize/${cyDrafting}`
              // ★ 分批第 141 批：自动接上（不再有「继续」按钮）
              // 起草中的标志：**状态锚点 = drafting** + 那个 run 的日志框（不是结论条——那时还没审核）。
              // 分批第 115 批：起草态的 tab 条已经删了（依据改为直接跟在日志下面），所以这里**不能**
              // 再等 `.review-tabs`——否则整组空过（探针当场红的就是这条：起草中那一屏挂不上）。
              return await untilNet(
                () =>
                  d().querySelector('.crystal-flow')?.getAttribute('data-crystallize-step') ===
                    'drafting' && !!d().querySelector('.log-box'),
                120,
              )
            }
            facts['crystal.draftingAttached'] = await cyEnterDrafting()
            if (facts['crystal.draftingAttached']) {
              // ★ 分批第 140 批：步骤条已删 ⇒ 这里改量顶栏的状态徽标（drafting）
              facts['crystal.draftingStatusBadge'] = (d().querySelector('[data-cryst-status]')?.textContent ?? '').trim()
              /**
               * ★ 分批第 163 批（§12.14）：**起草中那一屏右栏也要列材料**（只读）。
               *
               * 改之前整块材料被包在"有产物"的分支里 ⇒ 起草中右栏只有一句"还没有产物"，而材料
               * 明明已经在磁盘上（`GET /material` 早就有了）。同时这一屏**不该**有追加区：
               * daemon 那边"没跑完就改材料"是拒的（§12.41：不给按了会被拒的按钮）。
               */
              // ⚠️ 这一屏开着起草 run 的 SSE ⇒ Chrome 的虚拟时钟冻着，必须用 `untilNet`
              //    （`until` 里的 setTimeout 永远不触发，症状是"探针跑满超时、dump 里 done 不是
              //    true"——本节开头就写着这条，我加这一段时正好踩了一遍）
              // ★ 分批第 198 批：材料是栏脚的一棵树（`WorkDirTree`）⇒ 顶层行数
              await untilNet(() => d().querySelectorAll('[data-foot-files] .wd > li').length > 0, 60)
              facts['crystal.draftingPaneMaterialCount'] =
                d().querySelectorAll('[data-foot-files] .wd > li').length
              // ★ 分批第 202 批：拖拽区已经整块删掉 ⇒ 这条改成量"任何状态都不再有收文件的入口"
              facts['crystal.draftingMaterialLocked'] =
                !d().querySelector('[data-mat-dropzone]') &&
                ![...d().querySelectorAll('[data-foot-files] button')].some(
                  (b) => text(b) === '选文件' || text(b) === '选目录',
                )
              const cyDTabs = () => [...d().querySelectorAll('.review-tabs > button')]
              facts['crystal.draftingTabTexts'] = cyDTabs().map((b) => text(b))
              facts['crystal.draftingTabDefault'] =
                text(cyDTabs().find((b) => b.getAttribute('aria-selected') === 'true')) ?? null
              facts['crystal.draftingTabStripBox'] = cyRect(d().querySelector('.review-tabs'))
              // 产出：日志真的在流（假 CLI 那一行经 daemon 解析、再经 SSE 落到页面上）
              //
              // ⚠️ 必须**等那一行真的落地**再量，不能只等 `.log-box` 出现：日志框一挂上
              //    就先显示"· 等待输出…"，而那一行要经 daemon 解析、再经 SSE 送过来。
              //    第一版只等了 `.log-box`，量到的是"· 等待输出…"，判据红了——而界面没错
              //    （那时 run 刚被 dispatch，确实还没输出）。审核那一节早就记着这条教训。
              await untilNet(
                () =>

              // ── ★★ 起草中点「停止」⇒ 回目标态（素材折叠在这里，2026-10-21 第 6 批）──
              //
              // 为什么专门量这一下：第 4 批把素材折叠的条件收窄成
              // `draftRunId !== '' && material !== null && step === 'target'`——而

                 * 成对：只说"按钮存在"的话，搬错位置（还留在栏头）也会绿。

                // ★ 分批第 193 批：起草那一轮的消息角色从 `system` 改成 `assistant`
                //   （抬头是一句人话，不再报 run id 与状态徽标）⇒ 这条跟着换角色量。
                //   判据本身没变：**停止必须在"这次起草跑到哪了"那条消息里**，不在栏头。
                facts['crystal.stopInMsg'] = (() => {
                  const btn = [

                  ].find((b) => text(b).includes('停止'))

                })()

                  // 停止是异步的（要等进程真的死掉）；回到目标态的标志是那张表单又在了

                  facts['crystal.stoppedBackToTarget'] = await untilNet(

            // ══════════════ 产物栏（分批第 155 批起：1280 下也是**真列**）══════════════

            //   都依赖"停止之后页面上还剩什么"，而那不是这条判据问的事。第 211 批改了
            //   "没交 skill"那一屏的渲染之后它当场红（实测 `{hash: 起草来源, step: target,

            {

              facts['crystal.artifactGridCols'] = cyGrid

              // 抽屉已经不该出现了；老判据读它时按"没有抽屉"处理（`data-open` 恒 false）
              await until(
                () => (d().querySelector('.artifact-pane')?.dataset.open ?? 'false') === 'false',
                20,

              facts['crystal.artifactDrawerOpens'] =
                (d().querySelector('.artifact-pane')?.dataset.open ?? '') === 'true'

              /**
               * ★ 分批第 171 批（使用者："能从中间消息拿宽度，改成可动态调节"）：**产物栏宽度可拖**。
               *
               * 判据量"拖 120px ⇒ 栏真的宽了 120、编辑器正文也跟着宽"——只量"有把手"的话，
               * 把手拖不动也会绿。合成 `pointerdown/move/up`（拖动逻辑挂在 window 上，

               */
              {
                // 编辑器正文宽度（右栏里的 `textarea.editor` 那个格子）
                const cyEdW = () => {
                  const cell = d().querySelector('.artifact-pane .review-cell[data-cell="content"]')
                  return cell ? Math.round(cell.getBoundingClientRect().width) : null

                const artPaneEl = d().querySelector('.artifact-pane')
                const resizer = d().querySelector('.pane-resizer')
                const wBefore = artPaneEl ? Math.round(artPaneEl.getBoundingClientRect().width) : null
                const edBefore = cyEdW()
                if (resizer && artPaneEl) {
                  const r = resizer.getBoundingClientRect()
                  const y = Math.round(r.top + r.height / 2)
                  const x = Math.round(r.left + r.width / 2)
                  const opts = (cx) => ({ bubbles: true, cancelable: true, clientX: cx, clientY: y })
                  resizer.dispatchEvent(new f.contentWindow.PointerEvent('pointerdown', opts(x)))
                  f.contentWindow.dispatchEvent(
                    new f.contentWindow.PointerEvent('pointermove', opts(x - 120)),
                  )
                  f.contentWindow.dispatchEvent(
                    new f.contentWindow.PointerEvent('pointerup', opts(x - 120)),
                  )
                  await until(
                    () => Math.round(artPaneEl.getBoundingClientRect().width) > (wBefore ?? 0) + 60,
                    60,
                  )
                }
                facts['crystal.artifactResize'] = {
                  before: wBefore,
                  after: artPaneEl ? Math.round(artPaneEl.getBoundingClientRect().width) : null,
                  edBefore,
                  edAfter: cyEdW(),
                  hasHandle: !!resizer,
                }
              }
              /**
               * ★ 分批第 173 批（使用者定："技能走注入，但不预置在仓库里，让用户自己装、一键安装"）：
               * 右栏要有一块「沉淀用技能」，且二选一：**已装好**（说出名字）或**一键安装**按钮。
               * 只量"有这么一块"不够——"两个字都在、什么也按不动"正是本仓库最防的那种。
               */
              {
                // ★ 207 批：右栏栏头那句"没装沉淀用技能"删了 ⇒ 这里不再量它（改到智能体页量）
              }

              {

              const artBefore = artPre()
              if (artFiles.length > 1) click(artFiles[1])

              facts['crystal.artifactPreviewChanged'] = artFiles.length < 2 ? null : artPre() !== artBefore

               *
               * ★ 分批第 211 批：量**进来时那一个**（= `SKILL.md`，第一个文件），不是点完第二个
               *   文件之后的那个。原来它在 `click(artFiles[1])` 之后量，于是这条判据实际问的是
               *   "第二个文件有多长"——夹具里第二个是脚本（`#!/bin/sh` 恰 10 字符），而标签写的是
               *   "真产物正文"。语义纠正：正文这一条量第一个文件（那是审阅默认打开的那个），

               * ★ 分批第 224 批（使用者："下面有个『机械体检 通过 ✔』，移动到右栏顶的右侧"）：

              // ⚠️ 材料与产物是**两个接口**，产物先到不代表材料到了——等一小会儿再数，

              await until(() => d().querySelectorAll('[data-foot-files] .wd > li').length > 0, 60)

                d().querySelectorAll('[data-foot-files] .wd > li').length

                () => (d().querySelector('.artifact-pane')?.dataset.open ?? 'true') === 'false',
                40,

            }

            // ★ 兜底：**保证那条 SSE 关掉**（这一屏的 run 是 Node 侧起的，探针刚把它停了，

            f.contentWindow.location.hash = '#/tasks'
            await untilNet(() => !d().querySelector('.crystal-chat'), 40)
              await wait(80)
          }
        }


        // 分批第 99 批：把"每组的入口"汇总成一个事实，供 `harness.entryRoutes` 判据读
        // ⚠️ 2026-11（S3/D123）：「工具」与「智能体组」两组随它们的页面一起删了 ⇒
        //    入口清单里也不再有它们（留着它恒为 false，而那不是"界面坏了"）。
        facts['harness.entriesRecorded'] = ['任务', '技能', '智能体'].every(
          (n) => typeof facts['entry.' + n]?.from === 'string',

        // ══════════════ 沉淀：从空白/材料起（分批第 133 批的界面入口）══════════════
        //
        // 「新建沉淀」多了第三种起点：**没有来源 run**（daemon 半边已在同一批里落地）。

        //    否则"没进去"会被读成一堆 null，看起来像界面坏了（§12.25 的入口纪律）。
        {
          f.contentWindow.location.hash = '#/crystallize'
          // ⚠️ 等的是**这一页的顶栏按钮**，不是 `.list-pane`（任务页也有 `.list-pane`，会量到别的页）
          await untilNet(
            () =>
              [...d().querySelectorAll('.topbar .page-actions button')].some((b) =>

            60,

          const blankOpenBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
            text(b).includes('新建沉淀'),
          )
          facts['crystal.blankEntryButton'] = !!blankOpenBtn
          if (blankOpenBtn) {
            // ★ 分批第 141 批（U4b，§12.7）：**「新建沉淀」不再弹 Modal** ⇒ 起点变成页面内的
            //   第一问（`#/crystallize/new`）。所以这里等的是"起点问题 + 选项"，不是 Modal。
            click(blankOpenBtn)
            await until(() => !!d().querySelector('[data-crystallize-step="new"] .intake-choice'), 120)
            facts['crystal.blankRoute'] = f.contentWindow.location.hash
            /**
             * ★ 分批第 227 批：起点屏上**不能有任何错误条**。
             *
             * 这一条钉的是一个真 bug（使用者报的：「新建沉淀」一进去就提示
             * 「读取沉淀信息失败：run 不存在（new）」）：`blankMode`/`newMode` 两个 `$:` 判断
             * 写得比读它们的那个 `$:` 块晚，legacy `$:` 按源码顺序跑 ⇒ 首次渲染那一趟护栏失效，
             * 拿哨兵值 `new` 去查 `/api/crystallize/targets`，404 反过来盖在屏幕上。
             *
             * ⚠️ 要**等一拍**再量：那条 404 是异步回来的，`.intake-choice` 出现时它可能还在路上。
             *   节拍用 `untilNet` 的真往返，不用 `wait()`（虚拟时钟可能被挂住的流转冻住）。
             */
            await untilNet(() => false, 4)
            facts['crystal.newErrorText'] = text(d().querySelector('[data-target-error]'))
            facts['crystal.newNoError'] = (facts['crystal.newErrorText'] ?? '').trim() === ''
            const blankRowBtn = [...d().querySelectorAll('[data-crystallize-step="new"] .intake-choice')].find(

              const blankLanded = await until(() => !!d().querySelector('.intake .intake-q'), 120)
              facts['crystal.blankLanded'] = blankLanded
              facts['crystal.blankRoute'] = f.contentWindow.location.hash
              /**
               * ★ 分批第 165 批（§12.58）：空白起**也问第一问**——"新建一份技能 / 优化已有技能"。
               * 以前它直接问作用描述（"空白起只能新建"）。所以这里先量这一问与两个选项，
               * 点「新建」之后才回到"作用描述"那一问（下面的判据量的是**那一问**，语义没变）。
               */
              facts['crystal.blankTargetQuestion'] = text(d().querySelector('.intake .intake-q'))
              const blankChoices = [...d().querySelectorAll('.intake .intake-choice')]
              const blankNewBtn = blankChoices.find((b) => text(b).includes('新建一份技能'))
              const blankUpdateBtn = blankChoices.find((b) => text(b).includes('优化已有技能'))
              const cySkillCount = await f.contentWindow
                .fetch('/api/skills')
                .then((r) => (r.ok ? r.json() : null))
                .then((j) => (Array.isArray(j?.skills) ? j.skills.length : null))
                .catch(() => null)
              facts['crystal.blankTargetChoices'] = {
                new: !!blankNewBtn,
                update: !!blankUpdateBtn,

              /**
               * ★ 分批第 235 批（使用者："下面有2个选项，说是什么呀"）：选项里**不再塞长括注**。
               *
               * 原来第二项后面跟着一长串"（提炼的=进化；安装的=存为你的版本并遮蔽）"，

               * 「是哪一份？」里**只说一次**（`crystallize.updateChoiceNote`），选项只留
               * 名字 + 一句极短的数量提示。这条判据盯的就是"别再往选项里塞解释"。
               */
              facts['crystal.updateOptionText'] = blankUpdateBtn ? text(blankUpdateBtn) : null
              if (blankNewBtn) click(blankNewBtn)
              await until(() => !!d().querySelector('.intake textarea.intake-input'), 120)
              facts['crystal.blankIntakeQuestion'] = [
                ...d().querySelectorAll('.intake .intake-q'),
              ].pop()?.textContent ?? ''
              facts['crystal.blankHasPurposeBox'] =
                !!d().querySelector('.intake textarea.intake-input')

              facts['crystal.blankNoTraceLine'] = !(d().body.innerText ?? '').includes('轨迹')

              const compInput = d().querySelector('[data-composer] .composer-input')

                  delBtn?.click()

                  matOk = twoRows === 2 && matRows().length === 1
                }
                facts['crystal.blankMultiMaterial'] = matOk
                facts['crystal.composerAnswersIntake'] =

                  (d().querySelector('.composer-receipt')?.textContent ?? '').includes('作用描述')

        /**

        facts['chat.composerControlHeights'] = (() => {

          const send = d().querySelector('.detail-pane [data-composer-send]')

        })()

        /**

         * （临时数据目录），所以正确行为是：点一下**当场说清原因**（"还没有语音模型…
         * 首次使用需要下载一次"），而不是静静地什么都不做。

        /**

        facts['chat.voiceRechecksOnClick'] = await (async () => {

          if (!btn) return null
          let calls = 0
          const real = f.contentWindow.fetch
          f.contentWindow.fetch = function (input, init) {

            if (String(url).includes('/api/voice/capability')) calls += 1

          }

            await wait(600)
          } finally {
            f.contentWindow.fetch = real
          }
          return { calls }
        })()

        facts['chat.voiceButton'] = await (async () => {
          const pane = d().querySelector('.detail-pane [data-composer]')
          if (!pane) return null
          const btn = pane.querySelector('[data-voice-button]')
          if (!btn) return { present: false }

          const stateBefore = btn.getAttribute('data-voice-state') ?? ''
          const title = btn.getAttribute('title') ?? ''
          click(btn)
          /**

          const composerH = Math.round(
            (d().querySelector('.detail-pane [data-composer]')?.getBoundingClientRect().height ?? 0),

        const chatSelect = () => d().querySelector('#chat-agent')

         * 那些检查量到的是真实身份。

        const chatReloadIdentity = async () => {

          const back = await until(() => text(d().querySelector('.list-pane h2')) === '对话', 60)

          return back

        facts['chat.unownedHiddenOnOldDaemon'] = await (async () => {

            text(b).includes('探针：这一条对话'),

        /**
         * ★★ 静态资源的缓存头。
         *
         * 这一组来自一次真实的误判：使用者报"聊天页不工作、任务页正常"，查下来

         * 而那边原本**一个缓存头都不发**：浏览器对那份外壳既不知道能不能复用，
         * 也没有依据去问"变了没有"。
         *
         * 所以：外壳 `no-cache`（每次核对）+ 带内容哈希的产物 `immutable`，
         * 并且**带 ETag 回来问时要回 304**（核对要便宜，否则每次刷新都重下 HTML）。
         */
        facts['web.shellNotCachedBlindly'] = await (async () => {
          const res = await f.contentWindow.fetch('/index.html')
          const cc = res.headers.get('cache-control') ?? ''
          const etag = res.headers.get('etag') ?? ''
          if (!/no-cache/.test(cc)) {
            errors.push(`外壳的 cache-control 不是 no-cache（实际「${cc}」）——浏览器会拿着旧外壳不放`)
            return false
          }
          if (etag === '') {
            errors.push('外壳没有 ETag：浏览器没法问"变了没有"，只能整份重下或者一直用旧的')
            return false
          }
          return true
        })()

        facts['web.hashedAssetImmutable'] = await (async () => {
          const html = await (await f.contentWindow.fetch('/index.html')).text()
          const m = /assets\/(index-[A-Za-z0-9_-]+\.js)/.exec(html)
          if (!m) {
            errors.push('外壳里找不到构建产物（界面没构建？）')
            return false
          }
          const res = await f.contentWindow.fetch(`/assets/${m[1]}`)
          const cc = res.headers.get('cache-control') ?? ''
          if (!/immutable/.test(cc) || !/max-age=\d{6,}/.test(cc)) {
            errors.push(`带内容哈希的产物应当是 immutable 长缓存（实际「${cc}」）`)
            return false
          }
          // 带 ETag 回来问 ⇒ 必须 304（核对便宜，否则每次刷新都重下）
          const etag = res.headers.get('etag')
          if (!etag) {
            errors.push('产物没有 ETag')
            return false
          }
          const again = await f.contentWindow.fetch(`/assets/${m[1]}`, {
            headers: { 'if-none-match': etag },
          })
          if (again.status !== 304) {
            errors.push(`带 If-None-Match 再问应当是 304，实际 ${again.status}`)
            return false
          }
          return true
        })()

        /**
         * ★★ 代码块里的换行必须真的显示出来。
         *
         * ══════════════════════════════════════════════════════════════
         * 这条检查的由来：一次"看起来像模型没写换行"的误判
         * ══════════════════════════════════════════════════════════════
         *
         * 使用者报「聊天里那段代码的换行没有了」。用真实数据量 computed style：
         * 文字里**有 10 个换行**，而 `<code>` 的 `white-space` 是 **`nowrap`**
         * ——那条规则本来是给**行内**代码写的（中文段落里不被压扁），却被继承进了
         * `pre > code`，于是十行代码被折成一行、那个 `<pre>` 只有 47px 高。
         *
         * ⚠️ 怎么量：探针的 daemon 没有真模型，页面上生不出真实的代码块，所以这里
         *    在**真实页面**里插一段与渲染器产出**完全相同**的结构，量它的 computed
         *    style 与高度。测的是那两条**全局**规则（`code{nowrap}` 与 `pre code`），
         *    而那正是当初出错的地方——不是"照着想象量"。
         * ⚠️ 高度必须与行数相称：只看 `white-space` 会漏掉"换成 pre-wrap 之后仍然
         *    没有换行"之类的情况，而使用者看到的就是高度。
         */
        facts['chat.codeBlockKeepsNewlines'] = (() => {
          const LINES = 6
          const host = d().createElement('div')
          host.className = 'markdown'
          host.setAttribute('data-probe-code', '')
          host.style.position = 'absolute'
          host.style.left = '-9999px'
          const body = Array.from({ length: LINES }, (_, i) => `line ${i + 1}`).join('\n')
          host.innerHTML = `<pre><code>${body}</code></pre>`
          d().body.appendChild(host)
          try {
            const code = host.querySelector('code')
            const pre = host.querySelector('pre')
            const ws = f.contentWindow.getComputedStyle(code).whiteSpace
            const h = Math.round(pre.getBoundingClientRect().height)
            if (ws === 'nowrap' || ws === 'normal') {
              errors.push(
                `代码块的 white-space 是「${ws}」——换行会被折掉（行内代码那条 nowrap 被继承进来了）`,
              )
              return false
            }
            // 六行、字号 xs（约 12px）、行高 1.55 ⇒ 至少要到 60px 以上；折成一行只有 ~20px
            if (h < LINES * 12) {
              errors.push(
                `六行代码块只有 ${h}px 高（每行约 ${Math.round(h / LINES)}px）——换行没有真的显示出来`,
              )
              return false
            }
            return true
          } finally {
            host.remove()
          }
        })()

        /* ══════════════════════════════════════════════════════════════

         * ══════════════════════════════════════════════════════════════
         *
         * 这一栏里的文件是 **agent 写的**，使用者要靠它判断"到底做成了什么"。

         *
         * 其余几条各自挡一类"不报错但讲错事实"的错：

        const fvBar = () => d().querySelector('.fv-bar')

        facts['chat.fileViewerRawIsVerbatim'] = await (async () => {

        /* ══════════════════════════════════════════════════════════════
         * 音视频（2026-10）：使用者报的是"展示页面不支持视频文件显示"
         * ══════════════════════════════════════════════════════════════
         *
         * 那次报错的根因有两层，所以这里要量的也有两层：
         *
         *   · **界面**那一层：`.mp4` 以前被当成"二进制"给一屏十六进制。判据是
         *     "看到的是不是播放器"，以及"**没有**十六进制/原文那一面"；
         *   · **接口**那一层：老路由把整份文件读进内存（8MB 上限）且不认 Range。
         *     判据不能只看元素在不在——一口空黑框正是这一条要挡的东西，所以要等
         *     `readyState`（浏览器真的解出了元数据），再去 fetch 一次量 **206**。
         *
         * ⚠️ "放不出来"那一条用的是**冒充 .mkv 的垃圾字节**：它必然解不出来，
         *    所以"界面有没有说一句人话"这件事是**确定性**量得到的（不用赌某个
         *    编解码器在某个 Chrome 版本里的支持情况）。
         */
        /**
         * 播放器所在的**那个对话框**。
         *
         * ⚠️ 不能直接 `d().querySelector('video[data-file-video]')` + 另一个
         *    `d().querySelector('.fv-bar')`：那是**两个独立的全局查询**，只要文档里
         *    同时有两个查看器（另一个文件、另一栏、上一份没关掉的），取到的就不是
         *    同一份东西——"视频居然有原文那一面"这种假红就是这么来的（这一条踩过）。
         *    正确的取法是**先拿到那份文件的对话框，再在它里面问**。
         */
        const fvDialogFor = (selector) => {
          const el = d().querySelector(selector)
          if (el === null) return null
          return el.closest('[role="dialog"]') ?? el.parentElement
        }
        /** 出假红时要能一眼看出"当时文档里有几个查看器"——不然只能靠猜。 */
        const fvScene = () =>
          `现场：dialog=${d().querySelectorAll('[role="dialog"]').length}` +
          ` fvBar=${d().querySelectorAll('.fv-bar').length}` +
          ` video=${d().querySelectorAll('video[data-file-video]').length}` +
          ` audio=${d().querySelectorAll('audio[data-file-audio]').length}` +
          ` hex=${d().querySelectorAll('pre[data-hex]').length}` +
          ` bars=[${[...d().querySelectorAll('.fv-bar')]
            .map((b) => JSON.stringify(text(b).slice(0, 40)))
            .join(', ')}]`

        /**
         * 等浏览器**真的解出元数据**。
         *
         * ⚠️ 判据是 `readyState >= 1`（HAVE_METADATA）——"接口那一层通了"的唯一证据
         *    （类型对、字节取得到、Range 能用）。这一条**不放宽**。
         *
         * ⚠️ 但"怎么等"踩过坑：探针跑在 `--virtual-time-budget` 下，`setTimeout` 与
         *    `Date.now()` 都是**虚拟**的，一轮 `wait(200) × 20` 在真实时间里几乎是
         *    瞬间烧完，而媒体请求还在飞——于是量到 `readyState=0`，报告写成"接口那一层
         *    没通"，**而同一份报告里 `chat.fileViewerVideoRange206` 是绿的**（真发一个
         *    Range 请求拿回了 206）。两条判据互相打脸，就是探针等错了的证据。
         *    每次循环发一个**真**请求（同源、便宜），让真实时间真的往前走；
         *    这样 20 次与 400 次的区别才是真的区别。
         */
        const fvWaitPlayable = async (selector, tries = 300) => {
          const el = d().querySelector(selector)
          if (el === null) return null
          // 有的路径下元素刚建好、还没进 DOM，`load()` 不会自己开始
          if (el.readyState === 0 && el.networkState === 0) {
            try {
              el.load()
            } catch {
              /* 打不开就算了：下面按 readyState 如实报 */
            }
          }
          for (let i = 0; i < tries; i++) {
            if (el.readyState >= 1 || el.error !== null) return el
            await f.contentWindow.fetch('/api/identity').catch(() => null)
            await wait(20)
          }
          return el
        }

        facts['chat.fileViewerVideoPlays'] = await (async () => {
          if (!(await chatOpenFixtureConversation())) return false
          if (!(await fvOpenFile('clip.webm'))) return false
          const el = await fvWaitPlayable('video[data-file-video]')
          if (el === null) {
            errors.push(`视频文件没有渲染成 <video>（还是被当二进制了？）${fvScene()}`)
            await fvClose()
            return false
          }
          // ★ 这一份文件自己的那个对话框（不是"文档里第一个 .fv-bar"）
          const dialog = fvDialogFor('video[data-file-video]')
          if (dialog === null) {
            errors.push(`找不到播放器所在的对话框——这一条量不到。${fvScene()}`)
            await fvClose()
            return false
          }
          const hex = dialog.querySelector('pre[data-hex]') !== null
          const rawText = dialog.querySelector('.fv-pre[data-raw-text]') !== null
          const bar = dialog.querySelector('.fv-bar')
          const rawFace = bar === null ? false : bar.querySelector('[data-face-raw]') !== null
          const controls = el.hasAttribute('controls')
          const src = el.getAttribute('src') ?? ''
          const ready = el.readyState
          const err = el.error === null ? '' : `（播放器报错 code=${el.error.code}）`
          const barText = bar === null ? '(没有标题栏)' : text(bar).slice(0, 60)
          // ⚠️ 现场必须在**关闭之前**抓：关掉之后对话框就没了，量到的是一堆 0
          const scene = fvScene()
          await fvClose()
          if (hex || rawText) {
            errors.push(
              `视频文件被当二进制/文本显示了——那正是使用者报的那个 bug。${fvScene()}`,
            )
            return false
          }
          if (rawFace) {
            errors.push(
              `视频不该有「原文」那一面（把几百 MB 拉回页面来 hex dump 是荒谬的）。` +
                `这个对话框的标题栏是「${barText}」。${scene}`,
            )
            return false
          }
          if (!controls) {
            errors.push('播放器没有 controls——使用者没法暂停/拖进度')
            return false
          }
          if (!src.includes('/file?path=')) {
            errors.push(`播放器的 src 不是那条文件路由（量到的是「${src}」）`)
            return false
          }
          if (ready < 1) {
            errors.push(`播放器没拿到元数据（readyState=${ready}${err}）——接口那一层没通`)
            return false
          }
          return true
        })()

        /**
         * ★★ 接口那一层：**Range ⇒ 206**，而且是那一段。
         *
         * 这是"能不能 seek"的判据。老路由不认 Range：回 200 整份，浏览器就只能从头
         * 顺序播，拖进度条会跳回开头——而"看一段视频却不能拖"等于没支持。
         */
        facts['chat.fileViewerVideoRange206'] = await (async () => {
          const conv = await fvFixtureConversation()
          if (!conv) {
            errors.push('找不到夹具对话——这一条量不到')
            return false
          }
          const url = `/api/conversations/${conv.id}/file?path=${encodeURIComponent('clip.webm')}`
          const head = await f.contentWindow.fetch(url, { headers: { Range: 'bytes=0-99' } })
          const status = head.status
          const cr = head.headers.get('content-range') ?? ''
          const ar = head.headers.get('accept-ranges') ?? ''
          const type = head.headers.get('content-type') ?? ''
          const buf = new Uint8Array(await head.arrayBuffer())
          if (status !== 206) {
            errors.push(`带 Range 的请求该回 206，实际 ${status}——不认 Range 就拖不动进度`)
            return false
          }
          if (!/^bytes 0-99\/\d+$/.test(cr)) {
            errors.push(`content-range 不对（量到的是「${cr}」）`)
            return false
          }
          if (buf.length !== 100) {
            errors.push(`只该发要的那 100 字节，实际 ${buf.length}`)
            return false
          }
          if (ar !== 'bytes') {
            errors.push(`没有 accept-ranges: bytes（量到的是「${ar}」）`)
            return false
          }
          if (!type.startsWith('video/')) {
            errors.push(`content-type 不是 video/*（量到的是「${type}」）——界面正是按它分类的`)
            return false
          }
          // ★ 再核一次"发出来的就是磁盘上那一段"：自己整份取回来比字节
          const whole = new Uint8Array(
            await (await f.contentWindow.fetch(url)).arrayBuffer(),
          )
          for (let i = 0; i < 100; i += 1) {
            if (buf[i] !== whole[i]) {
              errors.push('206 那一段与整份文件的前 100 字节对不上')
              return false
            }
          }
          return true
        })()

        /**
         * ★ 媒体响应**不能**带那条 sandbox 的 CSP。
         *
         * 那条 CSP 是给"agent 写的**文档**"用的；带上它，浏览器在新标签页里为媒体
         * 合成的那张文档自己会被 `default-src 'none'` 管住，视频直接放不出来。
         * 但 `nosniff` 必须还在——它才是"不会被当文档解析"的那道闸。
         */
        facts['chat.fileViewerMediaNoSandboxCsp'] = await (async () => {
          const conv = await fvFixtureConversation()
          if (!conv) return false
          const media = await f.contentWindow.fetch(
            `/api/conversations/${conv.id}/file?path=${encodeURIComponent('clip.webm')}`,
          )
          const csp = media.headers.get('content-security-policy')
          const nosniff = media.headers.get('x-content-type-options')
          const textRes = await f.contentWindow.fetch(
            `/api/conversations/${conv.id}/file?path=${encodeURIComponent('page.html')}`,
          )
          const textCsp = textRes.headers.get('content-security-policy') ?? ''
          await media.arrayBuffer()
          await textRes.text()
          if (csp !== null) {
            errors.push(`媒体响应带了 CSP（「${csp}」）——那会让视频在新标签页里放不出来`)
            return false
          }
          if (nosniff !== 'nosniff') {
            errors.push('媒体响应少了 nosniff——那才是"不许当文档解析"的那道闸')
            return false
          }
          if (!textCsp.includes('sandbox')) {
            errors.push('文本/HTML 那一档的 sandbox CSP 被顺手拿掉了（这条边界不该动）')
            return false
          }
          return true
        })()

        facts['chat.filesHiddenInDraft'] = await (async () => {

          }

          facts['chat.workDirPickerOpens'] = await (async () => {

          /**
           * ★ 分批第 230 批（使用者报的）：**按钮上的字不许折行**。
           *
           * 「新对话」里新加的「浏览…」与目录选择框里的「关闭 / 上一级 / 选这个目录」
           * 都曾被折成两行。根因不是宽度算错：那一行里按钮与输入框/副标题**都是 flex 项**，
           * 空间不够时一起收缩，而 flex 项能缩到的最小宽度是 `min-content`——对中文就是
           * **一个字**（每个汉字都是断行点）。所以判据量的是**文字的行盒**：
           *
           * ⚠️ 不能用 `el.getClientRects()`：一个按钮无论里面折成几行，元素盒永远只有一个
           *    矩形——第一版就是这么量成"全是 1 行"的，而屏幕上明明是两行。
           *    必须用 `Range.selectNodeContents(el).getClientRects()`。
           */
          facts['chat.pickerButtonLabels'] = await (async () => {

              const range = d().createRange()
              range.selectNodeContents(el)
              return range.getClientRects().length

            const values = {

              pick: lineCount(d().querySelector('[data-dir-picker-pick]')),

            const bad = Object.entries(values).filter(([, n]) => n !== 1)
            if (bad.length > 0) {
              errors.push(
                `按钮上的字折行了：${bad.map(([k, n]) => `${k}=${String(n)} 行`).join('、')}`,
              )
            }
            return values
          })()

          facts['chat.workDirPickerPicks'] = await (async () => {
            const pick = d().querySelector('[data-dir-picker-pick]')
            const current = text(d().querySelector('[data-dir-picker-current]')) ?? ''
            if (!pick) {
              errors.push('选择框里找不到「选这个目录」按钮')
              return null
            }
            click(pick)
            const closed = await untilNet(() => !d().querySelector('[data-dir-picker-list]'), 30)
            const input = d().querySelector('.detail-pane #chat-draft-workdir')
            const got = input ? input.value : ''
            if (!closed) errors.push('选完目录之后框没关掉')
            if (current === '' || got !== current) {

              input.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }))
            }
            return { filled: current !== '' && got === current, closed, input: got }
          })()

          /**
           * ★ 分批第 229 批（旧 daemon）：界面是构建产物，换掉就是新的，而 daemon 还是
           *   重启之前那个 —— 那时 `/api/fs/dirs` 回一个**没有错误码**的 404
           *   （`未知路径 /api/fs/dirs`）。这一条量的是"它有没有说清楚要重启"，
           *   而不是把 404 说成"读不出这个目录"（那会让人去查权限）。
           */
          facts['chat.workDirPickerOldDaemon'] = await (async () => {
            const real = f.contentWindow.fetch
            f.contentWindow.fetch = function (input, init) {
              const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
              if (!String(url).includes('/api/fs/dirs')) {
                return real.call(f.contentWindow, input, init)
              }

            try {

              if (!browse) return false

              await untilNet(
                () => (text(d().querySelector('[data-dir-picker-error]')) ?? '') !== '',
                30,

            } finally {

              if (backdrop) click(backdrop)
              await untilNet(() => !d().querySelector('[data-dir-picker-list]'), 20)
            }

           */
          facts['chat.memoryEntries'] = await (async () => {
            // 先打开夹具对话：草稿态没有「整理成记忆」那颗顶栏动作，也还没有"人说过的话"

            let editKept = null

          /**

           */
          /**

          facts['chat.tidyAnalyses'] = await (async () => {
