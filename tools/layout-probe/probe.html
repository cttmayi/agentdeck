        // ★ D69.7：技能表首列叫「技能」（不是「标识」），且「来源」列在「版本」之前
        facts['skills.slugHeader'] = (() => {
          const ths = [...d().querySelectorAll('.main table thead th')]
          return ths[0] ? text(ths[0]) : null
        })()
        facts['skills.sourceBeforeVersion'] = (() => {
          const ths = [...d().querySelectorAll('.main table thead th')].map((th) => text(th))
          return ths.indexOf('来源') !== -1 && ths.indexOf('来源') < ths.indexOf('版本')
        })()
        // ★ D69.8：首格 `▸ slug` 由 flex（.row-title）撑住、flex-wrap 必须 nowrap
        //   ——列一窄内联元素会折行，flex 不会（这就是"▸ xxx 被换行"的一劳永逸修法）
        facts['skills.slugCellFlexWrap'] = (() => {
          const row = [...d().querySelectorAll('.main table tbody tr')].find((r) =>
            text(r).includes('probe-skill'),
          )
          const el = row?.querySelector('.row-title')
          return el ? cs(el).flexWrap : null
        })()

        // ══════════════ ★ P2：历史（git）那一节 ══════════════
        //
        // ⚠️ 必须**在打开安装面板之前**量：面板一开，列表就被从 DOM 里换掉了
        //    （下面那条 `skills.panelReplacesList` 钉的正是这件事）。
        //
        // 夹具是 run.mjs 里**真入库**的那条 `probe-mine`（走
        // POST /api/crystallize/commit ⇒ daemon 在 skills-mine 里打了真 commit）。
        // 为什么非得真入库：这一节的内容来自 git，注入一条 `source:'mine'` 的技能
        // 只能量到「还没有历史」，列表、首次入库标记、全部新增的 diff 一条都量不到。
        const mineRow = rowOfSlug('probe-mine')
        const installRow = rowOfSlug('probe-skill')
        facts['skills.historyMineRowFound'] = !!mineRow
        /** 展开某一行并等它里面的内容（点首格 chevron，与工具页同一做法）。 */
        const expandRow = async (row) => {
          const toggle = row?.querySelector('.expand-toggle')
          if (!toggle) return false
          click(toggle)
          await until(() => !!row?.parentElement?.querySelector('td[colspan]'))
          return true
        }
        /** 展开行的内容格（表格里展开的内容挂在下一行的 `td[colspan]` 上）。 */
        const expandedCell = (row) =>
          row?.nextElementSibling?.querySelector('td[colspan]') ??
          row?.parentElement?.querySelector('td[colspan]') ??
          null
        if (mineRow) {
          await expandRow(mineRow)
          const cell = expandedCell(mineRow)
          const foldTitle = () =>
            [...(cell?.querySelectorAll('button, summary') ?? [])].find((b) =>
              (text(b) ?? '').includes('历史（git）'),
            ) ?? null
          facts['skills.historySectionOnMine'] = !!foldTitle()
          // 折叠入口必须是**真按钮**（tab 能到、读屏器能读）——与全站折叠区块同一纪律
          facts['skills.historyFoldTag'] = foldTitle()?.tagName ?? null
          const fold = foldTitle()
          if (fold) {
            click(fold)
            // 打开 ⇒ 组件挂载 ⇒ 取历史 ⇒ 默认选中最新那条（都要等异步回来）
            await until(() => !!d().querySelector('.history-row'))
          }
          const rows = [...d().querySelectorAll('.history-row')]
          facts['skills.historyEntryCount'] = rows.length
          // 默认选中**最新**那条（打开这一节想问的是"最近改了什么"）
          facts['skills.historyTopActive'] =
            rows.length > 0 ? rows[0].classList.contains('active') : null
          facts['skills.historyRowText'] = rows.length > 0 ? (text(rows[0]) ?? '').slice(0, 80) : null
          // 只有一条提交时，它就是"首次入库"——那条标记要看得见（否则最早那条会被
          // 读成"相对上一版改了什么"，而它其实是对着空目录）
          facts['skills.historyFirstVersionBadge'] =
            rows.length === 1 ? (text(rows[0]) ?? '').includes('首次入库') : null
          const diffs = [...d().querySelectorAll('.rev-diff .file-diff')]
          facts['skills.historyDiffFileCount'] = diffs.length
          facts['skills.historyDiffChangeBadges'] = [
            ...d().querySelectorAll('.rev-diff .change'),
          ].map((el) => (text(el) ?? '').trim())
          facts['skills.historyDiffHunkCount'] = d().querySelectorAll('.rev-diff .hunk-head').length
          // ★ 界面上的文件数必须与**后端算的那一份**对得上（前端只渲染，不自己算）：
          //   比 DOM 行数与 `/compare` 返回的"非 same 文件数"，多一个少一个都要红。
          facts['skills.historyDiffMatchesApi'] = await (async () => {
            try {
              const list = await f.contentWindow.fetch('/api/skills').then((r) => r.json())
              const mine = (list.skills ?? []).find((sk) => sk.name === 'probe-mine')
              if (!mine) return null
              const hist = await f.contentWindow
                .fetch(`/api/skills/${encodeURIComponent(mine.id)}/history`)
                .then((r) => r.json())
              if (!hist.available || (hist.entries ?? []).length === 0) return null
              const rev = hist.entries[0].rev
              const cmp = await f.contentWindow
                .fetch(
                  `/api/skills/${encodeURIComponent(mine.id)}/compare?from=empty&to=${encodeURIComponent(rev)}`,
                )
                .then((r) => r.json())
              if (!cmp.available) return null
              const changed = (cmp.files ?? []).filter((x) => x.change !== 'same').length
              return { 界面上: diffs.length, 后端算的: changed }
            } catch {
              return null
            }
          })()
          // 安装来的技能**不该**有这一节（那是外部内容，重新装就行；点开看到
          // "版本管理未启用"是纯噪音）
          if (installRow) {
            await expandRow(installRow)
            const installCell = expandedCell(installRow)
            facts['skills.historyAbsentOnInstalled'] = ![
              ...(installCell?.querySelectorAll('button, summary') ?? []),
            ].some((b) => (text(b) ?? '').includes('历史（git）'))
          }
        }

        const openBtn = [...d().querySelectorAll('button')].find(
          (b) => b.textContent.trim() === '安装技能',
        )
        facts['skills.openButtonFound'] = !!openBtn
        if (!openBtn) {
          errors.push('找不到「安装技能」按钮')
        } else {
          click(openBtn)
          const opened = await until(() => d().querySelector('.main-panel'))
          if (!opened) errors.push('点了「安装技能」之后主区没有出现 .main-panel')
        }

        const panel = d().querySelector('.main-panel')
        if (panel) {
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════ ★ 2026-10：安装面板在主区里，不是弹框 ══════════════
          //
          // 使用者报的是"技能和工具的安装都是右侧弹框"，要的是与智能体页
          // 「新建智能体」同一种行为：**主区换成表单**。所以这里量的不是"在不在
          // 右边"，而是三件事：
          //   ① 它是 `.main` 内容区里的一块（左右边缘对齐主区的内容盒）；
          //   ② 它**不是**浮层（`position` 不是 fixed/absolute、没有遮罩）；
          //   ③ 它**取代**列表（表格不在 DOM 里），而不是被推到视口外。
          facts['skills.panelClass'] = panel.className.replace(/ svelte-\w+/, '')
          facts['skills.panelInMain'] = need('面板在主区内容盒里', () => {
            const main = d().querySelector('.main')
            if (!main) throw new Error('找不到 .main')
            const r = panel.getBoundingClientRect()
            const mr = main.getBoundingClientRect()
            const padRight = parseFloat(cs(main).paddingRight) || 0
            const padLeft = parseFloat(cs(main).paddingLeft) || 0
            const pos = cs(panel).position
            if (pos === 'fixed' || pos === 'absolute') {
              throw new Error(`面板是浮层（position: ${pos}）——弹框的味道又回来了`)
            }
            const dLeft = Math.round(Math.abs(r.left - (mr.left + padLeft)))
            const dRight = Math.round(Math.abs(r.right - (mr.right - padRight)))
            if (dLeft > 2 || dRight > 2) {
              throw new Error(`面板左右边缘没对齐主区内容盒（左差 ${dLeft}px、右差 ${dRight}px）`)
            }
            return true
          })
          facts['skills.panelNoBackdrop'] = !d().querySelector('.drawer-backdrop')
          // 列表是被"换掉"的，不是被推走：面板开着时表格**不在 DOM 里**
          facts['skills.panelReplacesList'] = !d().querySelector('.main table')
          facts['skills.panelBackLabel'] = need('返回入口文案', () =>
            text(panel.querySelector('.panel-back')),
          )
          facts['skills.panelBackVisible'] = need('返回入口可见', () => {
            const back = panel.querySelector('.panel-back')
            if (!back) throw new Error('面板头部没有返回入口（列表被换掉了，它是唯一的路）')
            // ⚠️ 判据取**真实盒子**：`.back-to-list` 那个全局 class 在宽屏是
            //    `display:none`，抄错一个 class 就会得到一个"看着有、其实不可见"的返回
            return back.getBoundingClientRect().width > 0
          })
          facts['skills.footButtonText'] = need('面板底部按钮', () =>
            text(panel.querySelector('.main-panel-foot button')),
          )
          /**
           * ★★ D177（B 案）：技能安装面板是族 1（`.main-panel` + 底栏）。
           *   量的是**位置**：主操作在底栏、栏头只有返回。
           *   ⚠️ 底栏那颗按钮没写变体（`<button type="submit">`）——按界面看到的重量算，
           *      它**就是** primary（`app.css` 基类给 accent 底色）；按写法算会漏掉它。
           */
          facts['skills.panelActions'] = panelActionPlace(panel)
          facts['skills.tabCount'] = panel.querySelectorAll('.tab').length
          // 页签条里那个和面板头重复的「关闭」应当已经删掉
          facts['skills.duplicateCloseInTabs'] = !!panel.querySelector('.tabs .close')

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════ 远端目录页签的**状态链**（2026-10 使用者报过的那条）══════════════
          //
          // 报的原话：「安装 skill，提示『远端不可用』，我明确已经启动 remote 了」。
          // 根因在模板里：`{#if remoteError}` 写的是**裸的 store 对象**（恒为真），
          // 于是这条"远端不可用"**无条件**显示、冒号后面还空着（因为压根没有错误），
          // 同时把"未登录"和"目录里没有条目"两个状态都挤掉了。
          //
          // 两条判据刻意做成**与环境无关**（远端在不在、有没有登录都成立）：
          //   · 出现了「远端不可用」⇒ 冒号后面必须有**真实的错误文字**（不许空着）
          //   · 这个页签不许一片空白 ⇒ 四种状态里必须有一种在渲染
          const remoteTabBtn = [...panel.querySelectorAll('.tab')].find((b) =>
            /远端/.test(b.textContent),
          )
          if (!remoteTabBtn) {
            errors.push('安装面板里找不到「远端目录」页签')
          } else {
            click(remoteTabBtn)
            await wait(600)
            // ★ 判据一：**出现了**那句提示，冒号后面就必须有真实的错误文字。
            //   它没出现也是正常（远端在跑、目录拉到了）——所以这条判据是
            //   "如果出现就不许空着"，与环境无关。
            facts['skills.remoteUnavailableLabel'] = need(
              '「远端不可用」那句提示（出现时冒号后必须有真实错误）',
              () => {
                const bad = panel.querySelector('.notice.bad')
                if (!bad) return '(没有出现，正常)'
                // 那句话 = 提示块的文字减去下面那段说明（说明里也有地址和括号，
                // 直接对整块做正则会**被它救活**，于是这条检查永远绿）
                const hint = bad.querySelector('p')
                const label = (text(bad) || '').replace(hint ? text(hint) || '' : '', '').trim()
                if (!/：\s*\S/.test(label)) {
                  throw new Error(
                    `冒号后面没有错误文字（渲染成「${label}」）——这正是 2026-10 那个 bug：` +
                      '裸用 store（`{#if remoteError}`）让这条提示无条件显示',
                  )
                }
                return label.slice(0, 80)
              },
            )
            // ★ 判据二：这个页签**不许一片空白**。四种状态（远端不可用 / 未登录 /
            //   目录为空 / 表）必须至少有一种在——原来那个 bug 把其中两种压成了
            //   死代码，而"整页只剩一句错的提示"看起来也像"页面就是这样"。
            facts['skills.remoteStates'] = need(
              '远端目录页签的状态（四种里至少有一种在渲染）',
              () => {
                const states = ['.notice.bad', '.notice.warn', '.empty', 'table'].filter(
                  (sel) => panel.querySelector(sel) !== null,
                )
                if (states.length === 0) {
                  throw new Error(
                    '四种状态一个都没渲染（远端不可用 / 未登录 / 目录为空 / 表）',
                  )
                }
                return states.join('+')
              },
            )
          }

          /**
           * ★★ D219：**列表本身现在也是一个 `.main-panel`**（表格页有头了）⇒ 不能用
           *   "有没有 `.main-panel`"判断"回到列表没有"。按**安装面板**认：它带
           *   `aria-label="安装技能"`。⚠️ 必须定义在下面 `if` 之外——Esc 那一段在块外
           *   也要用它（第一版定义在 `if` 里 ⇒ 块外 `ReferenceError`）。
           */
          const installPanel = () => d().querySelector('.main-panel[aria-label="安装技能"]')
          // 返回入口回到列表（列表被换掉了，所以这一步是**唯一**的路）
          const backBtn = panel.querySelector('.panel-back')
          if (backBtn) {
            click(backBtn)
            await wait(300)
            facts['skills.backReturnsToList'] = await until(
              () => !installPanel() && !!d().querySelector('.main table'),
              40,
            )
          } else {
            facts['skills.backReturnsToList'] = false
          }

          // Esc 关闭（这个面板是视图自己渲染的，不在 App 的 $openDrawer 里；
          // 技能页的设置抽屉与它同一页，Esc 手感必须一致）
          click(openBtn)
          await until(() => !!installPanel(), 40)
          f.contentWindow.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
          )
          await wait(300)
          // ★ D219：同上——列表也是 `.main-panel` 了，按**安装面板**认（不能看"有没有 .main-panel"）
          facts['skills.escClosesPanel'] = !installPanel() && !!d().querySelector('.main table')
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 从本地安装：扫描已知目录 ⇒ 逐条装 ⇒ 能挂给智能体 ══════════════
        //
        // ══════════════════════════════════════════════════════════════════
        // 这一段原来量的是**抽屉 + 勾目录**那一套（2026-10 之前）
        // ══════════════════════════════════════════════════════════════════
        // 原来是：Skills 页顶栏「设置」按钮 → `.drawer` → 四个候选目录（每个一个勾选框）
        // → 还能自己填一个路径加进去 → 勾上之后"每次读列表自动对账读进库"，然后量
        // "本地目录来的那条技能在表里、徽标里带路径、卸载按钮置灰"。
        //
        // ⚠️ **那一套已经撤了（D73）**：现在扫只负责"看现在有什么"（`GET
        //    /api/skills/local-dirs`，只读、不写库），**装不装由使用者逐条点**；也没有
        //    "自己加一个目录"——候选目录是**内置表**（Claude Code / Codex / Cursor /
        //    AGENTS 约定目录），显示名在界面词表里。于是：
        //      · 顶栏没有「设置」按钮了（原来这里会因为"找不到它"而 21 条断言全空过）；
        //      · 那一栏也不是抽屉，而是 Skills 页的**一个页签**「从本地安装」；
        //      · 目录行上**没有勾选框**（这条现在是**要钉住**的判据，不再是缺点了）；
        //      · 夹具那个"自己填进去的目录"根本不会被扫到（候选表是内置的），
        //        所以"表里有 probe-local-a/b"这条断言**没法再量**——改成量真的那条路：
        //        扫到的目录里**挑一条真的技能装进来**，再看它是不是真的落库、能不能挂。
        //
        // ⚠️ 探针的 daemon 用 `--skills-root` 指向 `.cache/layout-probe/`，所以这次安装
        //    只写进**临时库**（不碰 `~/.agentdeck`）；候选目录读的是本机家目录，**只读**。
        //    机器上那几个目录里一个技能都没有时，如实上报（不许把"没东西可装"说成通过）。
        {
          f.contentWindow.location.hash = '#/skills'
          await until(() => text(d().querySelector('.page-name')) === '技能', 60)
          await wait(300)
          // ⚠️ 「从本地安装」这几个页签住在**安装面板里**（`.main-panel .tabs`），不是
          //    技能页列表上的页签——要先把面板打开（顶栏主操作「安装技能」）。第一版
          //    直接找 `.tabs .tab`，量到 0 个，整段空过（教训：选择器要照着界面上
          //    的真实结构写，别照着自己想象的页面结构写）。
          const localInstallBtn = [
            ...d().querySelectorAll('.topbar .page-actions button'),
          ].find((b) => (text(b) ?? '').includes('安装技能'))
          facts['skills.localPanelButtonFound'] = !!localInstallBtn
          if (localInstallBtn) {
            click(localInstallBtn)
            await until(() => !!d().querySelector('.main-panel'), 40)
            await wait(300)
          }
          facts['skills.tabTexts'] = [...d().querySelectorAll('.main-panel .tabs .tab')].map(
            (b) => text(b),
          )
          // ⚠️ 用 **includes** 比，不用等号：页签里除了词条还可能带计数/角标，等号比
          //    会在"文字对了但多一个角标"时判成"没找到"（第一版就是这么空过的）。
          const localTab = [...d().querySelectorAll('.main-panel .tabs .tab')].find((b) =>
            (text(b) ?? '').includes('从本地安装'),
          )
          facts['skills.localTabFound'] = !!localTab
          if (!localTab) {
            errors.push('Skills 页没有「从本地安装」页签（这一段全空过）')
          } else {
            click(localTab)
            facts['skills.localTabActive'] = await until(
              () =>
                [...d().querySelectorAll('.main-panel .tabs .tab')].some(
                  (b) => (text(b) ?? '').includes('从本地安装') && b.classList.contains('active'),
                ),
              40,
            )
            // 扫的是**本机**目录，要等接口回来（`$localSkillScan`）
            await until(
              () => d().querySelectorAll('.main-panel table tr.cat-row').length > 0,
              60,
            )
            await wait(300)
            const localGroups = () => [...d().querySelectorAll('.main-panel table tr.cat-row')]
            facts['skills.localGroupCount'] = localGroups().length
            facts['skills.localGroupLabels'] = localGroups().map(
              (r) => text(r.querySelector('.cat-label')),
            )
            // ★ 每个目录都要把**路径**说清（"哪个目录"是这一页唯一的上下文）
            facts['skills.localGroupsAllHavePath'] = localGroups().every(
              (r) => (text(r.querySelector('.dir-group-path')) ?? '').length > 1,
            )
            facts['skills.localGroupPaths'] = localGroups().map((r) =>
              text(r.querySelector('.dir-group-path')),
            )
            // ★★ D73 之后这里**一个勾选框都不该有**：装不装是逐条点的事，不再"勾目录
            //    ⇒ 后台自动对账"。勾选框回来了就说明那条被撤的路又接上了。
            // ⚠️ 只数**表里**的勾选框：面板里那颗「覆盖已存在的技能」是另一件事
            //    （它管"同名要不要覆盖"，与"勾上目录就自动对账"无关）。第一版数了整
            //    个面板 ⇒ 把覆盖开关也算进来 ⇒ 判据变红，而红的理由与 D73 无关。
            facts['skills.localTabNoCheckbox'] =
              d().querySelectorAll('.main-panel table input[type=checkbox]').length === 0
            facts['skills.localTabNoCheckboxCount'] =
              d().querySelectorAll('.main-panel table input[type=checkbox]').length
            facts['skills.localPanelCheckboxCount'] =
              d().querySelectorAll('.main-panel input[type=checkbox]').length
            // ★ 目录行上要有「安装」/「已安装」的分寸：折叠着的时候先说"里面几个"，
            //   展开之后逐条给按钮（不是整目录一键装——那会把使用者没看过的也装进来）
            facts['skills.localGroupCounts'] = localGroups().map((r) =>
              text(r.querySelector('.cat-count')),
            )
            const openFirstGroup = async (row) => {
              click(row.querySelector('.cat-toggle'))
              return until(
                () => !!(row.nextElementSibling && row.nextElementSibling.querySelector('code')),
                40,
              )
            }
            let expanded = null
            for (const row of localGroups()) {
              if (await openFirstGroup(row)) {
                expanded = row
                break
              }
            }
            facts['skills.localGroupExpands'] = !!expanded
            const localSkillRows = () =>
              [...d().querySelectorAll('.main-panel table tbody tr')].filter(
                (r) =>
                  !!r.querySelector('code') &&
                  !!r.querySelector('button') &&
                  !r.classList.contains('cat-row'),
              )
            facts['skills.localRowCount'] = localSkillRows().length
            facts['skills.localRowsAllHaveInstallButton'] = localSkillRows().every((r) =>
              [...r.querySelectorAll('button')].some((b) =>
                ['安装', '已安装', '正在检查并安装…'].includes(text(b)),
              ),
            )
            // ★ 真的装一条：挑第一条**还没装**的技能（已经装过的按钮是禁用的）
            const firstInstall = [...d().querySelectorAll('.main-panel table tbody tr')]
              .filter((r) => !!r.querySelector('code'))
              .map((r) => ({
                slug: text(r.querySelector('code')),
                btn: [...r.querySelectorAll('button')].find((b) => text(b) === '安装'),
              }))
              .find((x) => x.btn)
            facts['skills.localInstallCandidate'] = firstInstall ? firstInstall.slug : null
            if (firstInstall && firstInstall.btn) {
              const installedBefore = await f.contentWindow
                .fetch('/api/skills')
                .then((r) => r.json())
                .then((p) => (p.skills ?? []).map((s) => s.name))
                .catch(() => null)
              click(firstInstall.btn)
              // ★ 等的是**接口上真的有了**（不是等按钮变灰——那可能只是本地状态）
              let after = null
              for (let i = 0; i < 60; i++) {
                after = await f.contentWindow
                  .fetch('/api/skills')
                  .then((r) => r.json())
                  .then((p) => (p.skills ?? []).map((s) => s.name))
                  .catch(() => null)
                if (after && after.includes(firstInstall.slug)) break
                await wait(200)
              }
              facts['skills.localInstallLandedOnServer'] = !!(
                after && after.includes(firstInstall.slug)
              )
              facts['skills.localInstalledSlug'] = firstInstall.slug
              facts['skills.localSlugWasNew'] = !!(
                installedBefore && !installedBefore.includes(firstInstall.slug)
              )
              // ★ 那一条的来源徽标：本地目录来的要指回**它的来源目录**（不是一句
              //   含糊的"本地"）——装进来的东西正文已经落在我们自己的 skills 目录下，
              //   徽标是使用者唯一能追回去的线索。
              const installedSkill = await f.contentWindow
                .fetch('/api/skills')
                .then((r) => r.json())
                .then((p) => (p.skills ?? []).find((s) => s.name === firstInstall.slug) ?? null)
                .catch(() => null)
              facts['skills.localInstallSourceKind'] = installedSkill
                ? installedSkill.source
                : null
              // ⚠️ 界面那枚徽标认的是 **`localDir`**（不是 `source.path`——那个字段
              //    在库里是 null，来源目录落在 `localDir` 上）。第一版读 `source.path`：
              //    量到 null ⇒ 下面那条永远红，而界面其实是对的。
              facts['skills.localInstallSourcePath'] = installedSkill
                ? (installedSkill.localDir ?? null)
                : null
              // ★ 关掉面板回到列表，再看那一条：装进来的东西**必须在那张表里出现**，
              //   而且来源徽标要带着**它的来源目录**（不是笼统的「本机自建」）。
              const backToList = d().querySelector('.main-panel .panel-back')
              if (backToList) {
                click(backToList)
              } else {
                f.contentWindow.dispatchEvent(
                  new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
                )
              }
              const listBack = await until(
                () => !d().querySelector('.main-panel') && !!d().querySelector('.main table'),
                40,
              )
              facts['skills.listBackAfterLocalInstall'] = listBack
              const localRow = [...d().querySelectorAll('.main table tbody tr')].find((r) =>
                (text(r) ?? '').includes(firstInstall.slug),
              )
              facts['skills.localRowInList'] = !!localRow
              facts['skills.localBadgeHasPath'] = (() => {
                if (!localRow) return false
                // 那一行的来源列里要出现**来源目录的路径**（逐字，不截断成"本地"）
                const wanted = installedSkill?.localDir ?? '@@'
                return (text(localRow) ?? '').includes(wanted)
              })()
            } else {
              facts['skills.localInstallCandidate'] = null
              errors.push(
                '「从本地安装」里没有一条**可装**的技能（本机那几个目录是空的？）——' +
                  '"装进来 ⇒ 能挂给智能体"这条链这次量不到',
              )
            }
            // ★ 跳过的东西要说清理由（没有 SKILL.md / 太深 / 解析不了…）——一直挂在
            //   组里，不藏在折叠里。机器上没有被跳过的东西时如实记 null。
            facts['skills.dirsSkipNote'] = need('「跳过」那一行', () => {
              const note = d().querySelector('.main-panel .dir-skip')
              return note ? (text(note) ?? '').includes('跳过') : null
            })
            // ★ 目录读不了要说读不了（不是一张空表）
            facts['skills.dirReadErrorShown'] = !!d().querySelector('.main-panel .notice.warn')
            // ★ 空目录要**如实说**「里面没有技能」（不是一行空白，也不是干脆不列这个目录）。
            //   ⚠️ 这条得**展开每一组**才看得到，所以是异步的（`need()` 是同步的，量不了）。
            const emptyGroupResults = []
            for (const row of localGroups()) {
              const count = Number((text(row.querySelector('.cat-count')) ?? '0').trim())
              if (count !== 0) continue
              const ok = await openFirstGroup(row)
              const next = row.nextElementSibling
              emptyGroupResults.push(
                ok && !!next && (text(next) ?? '').includes('里面没有技能'),
              )
            }
            facts['skills.dirEmptyGroupCount'] = emptyGroupResults.length
            facts['skills.dirEmptyReported'] =
              emptyGroupResults.length === 0 ? null : emptyGroupResults.every(Boolean)
          }
        }

          // ── 能挂给智能体：去智能体页点开一个执行者，看选择器里有没有它 ──
          //
          //   ★ 这一环是那条链的**终点**：装进来的本地技能必须能被挂到执行者身上
          //     （"装进来"与"用得上"是两件事，中间断了是最容易漏的）。
          //   ⚠️ 选择器里要出现的是**刚刚真的装进来的那个 slug**
          //     （`facts['skills.localInstalledSlug']`）——原来钉的是夹具那两个名字
          //     （`probe-local-a/b`），而那两个现在扫不到（候选目录是内置表）。
          f.contentWindow.location.hash = '#/agents'
          await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
          await wait(400)
          const ldsExecItem = [...d().querySelectorAll('.list-row-main')].find((el) =>
            (el.textContent ?? '').includes('探针用的执行者'),
          )
          const wantName = facts['skills.localInstalledSlug'] ?? null
          if (ldsExecItem) {
            click(ldsExecItem)
            await until(
              () => String(text(d().querySelector('[data-agent-head-name]')) ?? '') === '探针用的执行者',
              60,
            )
            await wait(300)
            // 单态卡片：技能那一栏直接在卡片里（没有「编辑」这一步了）
            const ldsPicker = d().querySelector('.skill-picker')
            facts['skills.pickerFound'] = !!ldsPicker
            const ldsOptions = [...d().querySelectorAll('.skill-picker input')].map(
              (i) => i.value,
            )
            // ⚠️ 选择器的取值是**技能 id**，不是 slug（第一版拿 slug 比，永远 false）。
            //    这里把 id 翻成 slug 一起记下来——判据要能读懂，也得能追到是哪一个。
            const allSkills = await f.contentWindow
              .fetch('/api/skills')
              .then((r) => r.json())
              .then((p) => p.skills ?? [])
              .catch(() => [])
            const nameOf = new Map(allSkills.map((sk) => [String(sk.id), sk.name]))
            facts['skills.pickerOptions'] = ldsOptions
            facts['skills.pickerOptionNames'] = ldsOptions.map((v) => nameOf.get(v) ?? `?${v}`)
            const wantId = wantName
              ? String((allSkills.find((sk) => sk.name === wantName) ?? {}).id ?? '')
              : ''
            facts['skills.pickerWantId'] = wantId || null
            facts['skills.pickerHasLocalSkill'] = !!wantId && ldsOptions.includes(wantId)
            // ★ 真的能勾上（不是"只有一行字"）：勾之后服务端那份要跟着变
            const ldsBox = wantId
              ? [...d().querySelectorAll('.skill-picker input')].find((i) => i.value === wantId)
              : null
            if (ldsBox && !ldsBox.checked) {
              click(ldsBox)
              await wait(200)
              // ⚠️ 选择器是 `bind:group` 的**草稿**（只改本地状态）——落库要点保存。
              //    第一版勾完就等接口：接口永远不动，于是"勾不上"变红，而其实只是少点
              //    了一下保存（使用者走的正是"勾 ⇒ 保存"这条路）。
              const pickerSave = [...d().querySelectorAll('.detail-pane button')].find((b) =>
                (text(b) ?? '').startsWith('保存'),
              )
              facts['skills.pickerSaveButtonFound'] = !!pickerSave
              if (pickerSave) {
                click(pickerSave)
                await wait(400)
              }
              let skillIds = null
              for (let i = 0; i < 40; i++) {
                skillIds = await f.contentWindow
                  .fetch('/api/agents')
                  .then((r) => r.json())
                  .then(
                    (p) =>
                      (p.agents ?? []).find((a) => a.name === '探针用的执行者')?.skillIds ?? null,
                  )
                  .catch(() => null)
                if (skillIds && skillIds.length > 0) break
                await wait(200)
              }
              facts['skills.pickerCheckboxTook'] = !!(skillIds && skillIds.length > 0)
            } else if (ldsBox) {
              facts['skills.pickerCheckboxTook'] = true
            }
            facts['skills.pickerSkillIdsAfter'] = await f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then(
                (p) =>
                  (p.agents ?? []).find((a) => a.name === '探针用的执行者')?.skillIds ?? null,
              )
              .catch(() => null)
          } else {
            errors.push('智能体页找不到执行者卡片，挂载那一环量不了')
          }
        f.contentWindow.location.hash = '#/skills'
        await until(() => text(d().querySelector('.page-name')) === '技能', 60)

        // ── ① 侧边栏：项数 + 整串顺序（外壳的守卫）──
        //
        //    `view.ts` 的 `VIEWS` 与 `Sidebar.svelte` 的 `ITEMS` 是两处联动，
        //    少动一处不报错，只表现为"视图打不开 / 侧边栏点不到它"。
        //
        //    ⚠️ **只数个数 + 只看最后一项是不够的**（实测过两次变异）：
        //      · "把某一项插到别的项前面" ⇒ 末项不变，抓不住；
        //      · "把某一项的文案悄悄换成另一项" ⇒ 项数不变、末项不变，**两条全绿**。
        //      所以这里把**整串顺序**一起量出来，由 `shell.navItems` 那条逐项比对。
        //
        //    ⚠️ 2026-11（S6）：这一段原来住在「工具页」那一段开头（先导航到 `#/tools`
        //      再量侧栏）。工具页退场之后我把整段一起删了，于是侧栏三条判据**没有
        //      生产者**（恒 null）。现在单独成段、不依赖任何一页——侧栏在哪一页都在。
        {
          const probeNavTitles = [...d().querySelectorAll('.sidebar .nav-title')].map((el) =>
            text(el),
          )
          facts['shell.navItems'] = probeNavTitles
          facts['shell.navItemCount'] = d().querySelectorAll('.sidebar .nav-item').length
          facts['shell.navLastItem'] =
            probeNavTitles.length > 0 ? probeNavTitles[probeNavTitles.length - 1] : null
          // ★ 2026-11（使用者：左栏减半 + 辅助文字不超过 1 行）：侧栏**标题与辅助文字**
          //   都必须是一行且放得下（scrollWidth ≤ clientWidth）。省略是兜底不是常态。
          facts['shell.navHintsOneLineAndFit'] = (() => {
            const els = [
              ...[...d().querySelectorAll('.sidebar .nav-title')].map((el) => ({ el, what: '标题' })),
              ...[...d().querySelectorAll('.sidebar .nav-hint')].map((el) => ({
                el,
                what: '辅助文字',
              })),
            ]
            if (els.length === 0) {
              errors.push('侧栏找不到标题或辅助文字（.nav-title / .nav-hint 一个都没有）')
              return false
            }
            const bad = []
            for (const { el, what } of els) {
              if (el.scrollHeight > el.clientHeight) {
                bad.push(
                  `${what}「${text(el)}」换行了（scrollH ${el.scrollHeight} > clientH ${el.clientHeight}）`,
                )
              } else if (el.scrollWidth > el.clientWidth) {
                bad.push(
                  `${what}「${text(el)}」被省略了（scrollW ${el.scrollWidth} > clientW ${el.clientWidth}）`,
                )
              }
            }
            if (bad.length > 0) {
              errors.push(bad.join('；'))
              return false
            }
            return true
          })()
          // ★ 侧栏宽度**减半**后钉死为 7.5rem（120px），它同时是顶栏左格的列宽。
          facts['shell.sidebarHalfWidth'] = (() => {
            const side = d().querySelector('.sidebar')
            if (!side) return false
            const w = Math.round(side.getBoundingClientRect().width)
            if (w !== 120) {
              errors.push(`侧栏宽度不是减半后的 120px（量到 ${w}px）`)
              return false
            }
            return true
          })()
        }

        // ── 定时任务（D115）：右栏可见 + 点「新建定时任务」表单出现 ──
        //
        //   2026-11 修过一版布局缺陷：右栏（`.detail-pane`）没放进 `split-layout`
        //   的把手列布局里，被网格塞进 0.375rem 的缝隙——点「新建定时任务」界面毫无
        //   反应（表单其实渲染了，只是看不见）。类型检查看不见这种缺陷（CLAUDE.md
        //   §8.3：布局类缺陷只有浏览器量得出来），这条判据是它的守卫：右栏必须
        //   > 200px 宽，点新建后表单真出现（标题 + 5 个预设键 + 结果区三行 + 6 个
        //   变量 chips + 名字框），预设交互（每周→工作日快捷、每月→最后一天、
        //   自定义→cron 输入）真能点，点「取消」能回到空态。
        //   2026-11 v8 还踩过预览脚本的 SyntaxError（`do` 是保留字）——交互断言
        //   是真浏览器点击，专防"界面画出来了但脚本挂了"这类回归。
        f.contentWindow.location.hash = '#/schedules'
        await until(() => !!d().querySelector('.detail-pane'))
        await wait(300)
        facts['schedules.mainPaneWidth'] = await (async () => {
          const right = d().querySelector('.detail-pane')
          if (!right) {
            errors.push('定时任务页右栏 .detail-pane 不存在')
            return -1
          }
          const w = Math.round(right.getBoundingClientRect().width)
          if (w < 200) {
            errors.push(`定时任务右栏被挤窄了（${w}px）——它应该占详情那列`)
          }
          return w
        })()
        facts['schedules.createFormOpens'] = await (async () => {
          const newBtn = [...d().querySelectorAll('button')].find((b) => text(b) === '新建定时任务')
          if (!newBtn) {
            errors.push('定时任务页找不到「新建定时任务」按钮')
            return false
          }
          click(newBtn)
          // 2026-11 表单容器改为与任务页同款（detail-head + 动作工具条），
          // 判据跟着走：栏头存在 + 工具条里有「保存」
          const panel = await until(() => d().querySelector('.detail-pane .detail-actions'))
          if (!panel) {
            errors.push('点「新建定时任务」后表单没出现（.detail-actions 没有）')
            return false
          }
          const saveBtn = [...d().querySelectorAll('.detail-pane .detail-actions button')].find(
            (b) => text(b) === '保存',
          )
          if (!saveBtn) {
            errors.push('表单栏头工具条里没有「保存」按钮')
            return false
          }
          const freq = d().querySelectorAll('.detail-pane .freq-picker button').length
          // 2026-11：变量 chips 已搬进大编辑器弹层（.pe-var-chip）——表单里不再有
          //   .var-chip，改为断言「⛶ 展开」按钮存在（chips 的数量在 promptEditor
          //   判据里量弹层）
          const expandBtn = !!d().querySelector('.detail-pane .prompt-expand')
          const nameField = !!d().querySelector('.detail-pane input[type=text]')
          const timeField = d().querySelectorAll('.detail-pane .schedule-time input').length === 2
          const resultRows = d().querySelectorAll('.detail-pane .schedule-result-row').length
          if (freq !== 5 || !expandBtn || !nameField || !timeField || resultRows !== 3) {
            errors.push(`表单不完整：预设键 ${freq}/5、展开按钮 ${expandBtn}、名字框 ${nameField}、时间行 ${timeField}、结果区三行 ${resultRows}/3`)
            return false
          }
          return true
        })()
        facts['schedules.formPresets'] = await (async () => {
          // 预设交互（v8 定型）：每周 → 工作日快捷 + 7 天；快捷点亮后 cron 行出 1-5；
          // 每月 → 下拉含「最后一天（L）」；自定义 → cron 输入框出现；回每天恢复。
          const freqBtns = [...d().querySelectorAll('.detail-pane .freq-picker button')]
          const byText = (t) => freqBtns.find((b) => text(b) === t)
          const clickByText = (t) => { const b = byText(t); if (!b) return false; click(b); return true }
          const cronText = () => d().querySelector('.detail-pane .schedule-result code')?.textContent ?? ''

          if (!clickByText('每周')) { errors.push('预设键「每周」找不到'); return false }
          await wait(60)
          /**
           * ★★ D217：星期键 / 工作日快捷原来各有自己的类名（`.weekday-btn` / `.quick-weekdays`），
           *   现在都收进全局"可选格子"一族 `.chip-row`：星期 = 含 7 颗的 `.chip-row`，
           *   快捷键 = 带 `.dashed` 的那颗（虚线 = "一键套用"而不是"一个选项"）。
           */
          const chipRows = [...d().querySelectorAll('.detail-pane .chip-row')]
          const dayRow = chipRows.find((r) => r.querySelectorAll('button').length === 7) ?? null
          const dayBtns = dayRow ? dayRow.querySelectorAll('button').length : 0
          const quick = !!d().querySelector('.detail-pane .chip-row > button.dashed')
          if (dayBtns !== 7 || !quick) {
            errors.push(`每周视图不对：星期键 ${dayBtns}/7、工作日快捷 ${quick}`)
            return false
          }
          // 2026-11 v8：星期按钮曾是 1.9rem 圆形，「周一」两个字出框（使用者抓到）——
          // 量每个按钮有没有文字溢出（scrollWidth > clientWidth 就是溢出）
          const overflowDays = [...(dayRow ? dayRow.querySelectorAll('button') : [])].filter(
            (b) => b.scrollWidth > b.clientWidth,
          )
          if (overflowDays.length > 0) {
            errors.push(`星期按钮文字出框：${overflowDays.length} 个（scrollWidth > clientWidth）`)
            return false
          }
          const quickBtn = d().querySelector('.detail-pane .chip-row > button.dashed')
          click(quickBtn)
          await wait(60)
          const quickActive = quickBtn.classList.contains('active')
          const cronHas15 = cronText().includes('1-5')
          if (!quickActive || !cronHas15) {
            errors.push(`工作日快捷未生效：active ${quickActive}、cron 含 1-5 ${cronHas15}（${cronText()}）`)
            return false
          }

          if (!clickByText('每月')) { errors.push('预设键「每月」找不到'); return false }
          await wait(60)
          const lastDayOption = [...d().querySelectorAll('.detail-pane select option')].some(
            (o) => o.value === 'L',
          )
          if (!lastDayOption) {
            errors.push('每月下拉缺「最后一天（L）」选项')
            return false
          }

          if (!clickByText('自定义')) { errors.push('预设键「自定义」找不到'); return false }
          await wait(60)
          const customInput = !!d().querySelector('.detail-pane .custom-cron input')
          if (!customInput) {
            errors.push('自定义视图缺 cron 输入框')
            return false
          }

          if (!clickByText('每天')) { errors.push('预设键「每天」找不到'); return false }

          // 2026-11（使用者："间隔 240 提示 cron 不合法"）：60 分钟以上的间隔
          //   走小时字段（0 */4 * * *），preview 不再报 "steps cannot be greater
          //   than maximum value of part (60)"。选间隔→240→结果区无 bad + cron 对
          if (!clickByText('间隔')) { errors.push('预设键「间隔」找不到'); return false }
          await wait(60)
          const mins = d().querySelector('.detail-pane .schedule-line select')
          if (!mins) {
            errors.push('间隔视图缺分钟下拉')
            return false
          }
          mins.value = '240'
          mins.dispatchEvent(new Event('change', { bubbles: true }))
          await wait(500) // preview 是 300ms debounce + 网络，等它跑完
          const badRow = d().querySelector('.detail-pane .schedule-result-row .bad')
          if (badRow) {

          const actsVisible = (() => {
            const el = d().querySelector('.page-actions')

          facts['topbar.actionGapPx'][tpHash] = !actsVisible

          // ── 端到端：界面选的 = 请求体里带的 = 落库记录上的 ──
          /**
           * ⚠️ 轮询接口时**不能只等 `setTimeout`**：探针跑在 `--virtual-time-budget`
           *    下，`setTimeout` 是虚拟的而网络是真的——40 次 × 250ms 在真实时间里几乎
           *    是瞬间烧完，接口还没回应就放弃了（量到"提交没成功"，而其实是探针没等）。
           *    所以：① 先等**界面自己走完**（提交成功会切到任务清单，表单消失）；
           *    ② 再轮询接口，次数按"每一次都真的发一个请求"来给。
           *
           * ⚠️ 找"这次刚建的那条 run"**不能按 prompt 找**：列表里没有 `prompt`。
           *    正确做法：提交前记下 runId 集合，提交后取**新增的**，再
           *    `GET /api/runs/<id>` 拿完整记录。
           */
          const ntSnapshotRunIds = async () =>
            new Set(
              (await ntApi('/api/runs').catch(() => ({ runs: [] }))).runs?.map((r) => r.runId) ??
                [],
            )
          const ntNewRun = async (before, tries = 200) => {
            for (let i = 0; i < tries; i++) {
              const list = (await ntApi('/api/runs').catch(() => ({ runs: [] }))).runs ?? []
              const fresh = list.filter((r) => !before.has(r.runId) && r.kind === 'execute')
              if (fresh.length > 0) {
                const full = await ntApi(`/api/runs/${encodeURIComponent(fresh[0].runId)}`).catch(
                  () => null,
                )
                return full ?? null
              }
              await wait(50)
            }
            return null
          }
          /** 提交成功之后这一页会切走（切到任务清单）——这是"界面自己走完了"的信号。 */
          const ntSubmitSettled = async () => until(() => !d().querySelector('.form-foot'), 300)
          const ntTitle = `探针：选单个智能体（${Date.now()}）`
          const ntTitleBox = d().querySelector('textarea')
          if (ntTitleBox) {
            ntTitleBox.value = ntTitle
            ntTitleBox.dispatchEvent(new Event('input', { bubbles: true }))
          }
          await wait(200)
          facts['newtask.agentSubmitEnabled'] = ntSubmit() ? !ntSubmit().disabled : null
          const ntBefore = await ntSnapshotRunIds()
          if (ntSubmit() && !ntSubmit().disabled) {
            click(ntSubmit())
            facts['newtask.agentSubmitLeftForm'] = await ntSubmitSettled()
            const run = await ntNewRun(ntBefore)
            facts['newtask.agentSubmitReachedTasks'] = !!run
            // ⚠️ 完整记录上执行者叫 **`agentId`**（`agentRef` 是**请求体**里的字段名，
            //    库里不叫这个——第一版读 `agentRef.id` ⇒ 量到 null ⇒ 红，而 run 是对的）
            facts['newtask.agentRunAgentId'] = run ? (run.agentId ?? null) : null
            facts['newtask.agentRunKind'] = run ? (run.kind ?? null) : null
            facts['newtask.agentRunRecordRead'] = !!run
            // ★★★ 退场的键**一个都不许在记录上**：审核者、组展开、动作清单、返工预算、
            //   材料与报告。留着它们就是"字段还在、没有代码路径让它发生"（本仓库第一
            //   号缺陷）；而它们**同时**也是"界面画对了、请求体多带了东西"的证据。
            facts['newtask.agentRunRetiredKeys'] = run
              ? [
                  'reviewerAgentId',
                  'groupId',
                  'allowedActions',
                  'maxReworks',
                  'materialRefs',
                  'reportBody',
                ].filter((k) => Object.prototype.hasOwnProperty.call(run, k))
              : null
          } else {
            facts['newtask.agentSubmitReachedTasks'] = false
            facts['newtask.agentRunRecordRead'] = false
          }
          facts['newtask.agentSubmitChecked'] = true
          facts['newtask.publishAtEnd'] = true
        }
        /* ══════════════════════════════════════════════════════════════
         * 任务详情右边那一栏（与聊天那一栏**同一个组件**）
         * ══════════════════════════════════════════════════════════════
         *
         * 抽组件这一刀动的是**任务页**那条已经在用的路径，而这一条检查就是它的
         * 回归网：左边那一栏换成组件之后，`base` 传错（比如传成一个空 id）会表现
         * 成"那一栏报错"或"一直骨架屏"，而这两种在肉眼扫一眼截图时都不明显。
         *
         * 判据是**真的打到接口上拿到东西**：跑完的任务点开之后，右边要么列出目录
         * 里的条目、要么说"这个目录还是空的/还不存在"；**不许出现"取不到"那一块**
         * （它意味着请求失败——旧 daemon、或者 base 传错了）。
         *
         * ⚠️ 只在**跑完的**任务上量：还在跑的时候右边是实时日志，没有文件那一栏。
         *    所以这里顺着列表往下找前几条，找到一条跑完的为止。
         */
        facts['tasks.filesColumnStillRenders'] = await (async () => {
          /**
           * ⚠️ 先**等一条 run 跑完**再点：还在跑的时候右边是实时日志，没有文件那
           *    一栏——第一版就是没等，于是"前 5 条里没有一条跑完的"（探针当场报红，
           *    而那是探针自己的前提没立住，不是界面坏了）。
           *
           * 用的是接口上的状态（`GET /api/runs`），不是页面上的字。
           */
          const TERMINAL = ['completed', 'failed', 'cancelled']
          const runsNow = () =>
            f.contentWindow
              .fetch('/api/runs')
              .then((r) => r.json())
              .then((p) => p.runs ?? [])
              .catch(() => [])
          let terminalRun = null
          for (let i = 0; i < 25; i += 1) {
            terminalRun = (await runsNow()).find((r) => TERMINAL.includes(r.status))
            if (terminalRun) break
            await wait(400)
          }
          if (!terminalRun) {
            errors.push('等不到任何一条跑完的 run——这一条量不到（那几条会空过）')
            return false
          }
          f.contentWindow.location.hash = '#/tasks'
          await until(() => !!d().querySelector('.detail-pane'), 60)
          await wait(600)
          /**
           * ⚠️ 视图模式（列表 / 看板）**存在 localStorage 里**：本视图前面那一段
           *    切过看板，不切回来的话 `.task-row` 一条都抓不到——而症状看起来像
           *    "没有任务"（这与 `ntSubmit` 那边踩过的是同一个坑）。
           */
          if (d().querySelectorAll('.list-pane .task-row').length === 0) {
            const toList = [...d().querySelectorAll('button')].find((b) => text(b) === '列表')
            if (toList) {
              click(toList)
              await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
            }
          }
          const rows = [...d().querySelectorAll('.list-pane .task-row')]
          for (const row of rows.slice(0, 5)) {
            click(row)
            await wait(900)
            // ★ D69.9.1：文件回到结果区**右侧栏**（使用者：高频项，不折叠）。
            const aside = d().querySelector('.detail-pane aside.result-files')
            if (!aside) continue // 这一条还在跑（右边是实时日志）⇒ 换下一条
            const body = text(aside)
            if (body.includes('取不到工作目录的文件')) {
              errors.push('任务详情那一栏报"取不到"——组件抽出来之后 base 或接口对不上')
              return false
            }
            if (!body.includes('工作目录的文件')) {
              errors.push(`任务详情那一栏没有标题（量到的是「${body.slice(0, 60)}」）`)
              return false
            }
            // 骨架屏也是"没量到东西"：等一下再看一次
            await wait(700)
            const again = text(d().querySelector('.detail-pane aside.result-files') ?? aside)
            if (again.includes('取不到工作目录的文件')) {
              errors.push('任务详情那一栏等完之后变成了"取不到"')
              return false
            }
            // ★ D69.12：点「看完整日志」不该有**外置滚动条**（使用者报双滚动条：
            //   .log 内置一条 + 详情栏又一条）。正解：日志视图时详情栏切成
            //   flex 纵向布局、overflow hidden，滚动全在 .log 自己的盒子里。
            const logToggle = [...d().querySelectorAll('.detail-pane button')].find((b) =>
              text(b).includes('完整日志'),
            )
            if (logToggle) {
              // D69.13：按钮词条**精确值**（substring 匹配挡不住「完整日志」被改
              // 回「看完整日志」——`.includes` 照样过，这里钉死整串）
              facts['tasks.logToggleLabel'] =
                (logToggle.textContent ?? '').trim() === '完整日志'
              click(logToggle)
              await wait(400)
              const logEl = d().querySelector('.detail-pane .log')
              const pane = d().querySelector('.detail-pane .pane-body.detail-scroll')
              facts['tasks.logModeNoOuterScroll'] =
                logEl && pane
                  ? cs(pane).overflowY === 'hidden' && cs(pane).display === 'flex'
                  : 'NO-LOG'
              // 切过来之后同一个按钮变成「最后结果」
              facts['tasks.showFinalResultLabel'] =
                (logToggle.textContent ?? '').trim() === '最后结果'
              // 日志是详情栏的**主体**：高度占比过半（flex 吃满剩余空间；
              // flex 断掉日志会塌成一小条——占比直接量得到）
              facts['tasks.logFillsPane'] =
                logEl && pane ? logEl.offsetHeight / pane.clientHeight : 'NO-LOG'
              click(logToggle) // 切回最后结果，别把状态留在日志视图
              await wait(300)
            } else {
              facts['tasks.logToggleLabel'] = 'NO-TOGGLE'
              facts['tasks.showFinalResultLabel'] = 'NO-TOGGLE'
              facts['tasks.logModeNoOuterScroll'] = 'NO-TOGGLE'
              facts['tasks.logFillsPane'] = 'NO-TOGGLE'
            }
            return true
          }
          errors.push(
            `点了前 5 条任务都没看到「工作目录的文件」那一栏（列表里 ${rows.length} 行，` +
              `右栏当前是「${text(d().querySelector('.detail-pane')).slice(0, 80)}」）——` +
              `还在跑的任务右边是实时日志，这一条量不到`,
          )
          return false
        })()

        // ══════════════ 沉淀：审阅页排版（D80 四轮重排）══════════════
        //
        // 这一组量的是**排版**（类型检查看不见的那一类），判据全部来自
        // `docs/design/skill-crystallization.md` §6.1 的三条规矩：
        //
        //   ① 结论常驻：结论条在首屏，且一行说完"能不能入库 / 改了什么 / 目标是谁"；
        //   ② 主区自己滚：页面**不整页滚**（页面高 ≈ 视口高），树与窗格各自滚；
        //   ③ 编辑与差异同位置切换：默认在「内容」标签，点「差异」后编辑器让位、
        //      diff 出现——而不是像改之前那样 diff 在编辑器下方 519px 处。
        //
        // ⚠️ 夹具是**直接写进 store** 的一条已完成起草 run（见 run.mjs 里
        //    "为什么这一组夹具要停一次 daemon 再起"）：走接口会 spawn 真 CLI。
        {
          const cyQuery = new URLSearchParams(location.search)
          const cyDraft = cyQuery.get('crystalDraft')
          const cyRevised = cyQuery.get('crystalRevised')
          facts['crystal.fixture'] = { draft: cyDraft, revised: cyRevised }

          /**
           * 进沉淀页并把那条草稿挂起来（「继续」→ 审阅态）。
           *
           * ⚠️ **先整页离开沉淀视图再回来**（`#/tasks` → `#/crystallize/<id>`），
           *    不能只在沉淀视图内部换 `runId`：实测撞到过——换过去之后读到的结论条
           *    还是**上一条草稿**的（"对比当前版本 +24 −0"，而那一条草稿根本没有
           *    `revisedFrom`）。原因是"继续 → 审阅"这条路会**接管**组件状态
           *    （`draftRunId` / `diffAgainst` / `editing`），而 `until()` 对"结论条
           *    在不在"的等待在上一条草稿的现场里**立刻就成立**，于是这一条量到的
           *    是别人的数字。与「新建任务」那一段同一个坑（那边也写了同样的话）。
           */
          const cyEnter = async (cyRunId) => {
            if (!cyRunId) return false
            f.contentWindow.location.hash = '#/tasks'
            // ★ 分批第 196 批：结论条删了 ⇒ "切走"与"进审阅"的锚点都换成**栏头那排动作**
            //   （`[data-review-actions]` 只在审阅态、有产物、非拒绝时渲染）。
            await until(() => !d().querySelector('[data-review-actions]'), 40)
            f.contentWindow.location.hash = `#/crystallize/${cyRunId}`
            // ★ 分批第 141 批（U4b，§12.7）：**不再有「继续」这个动作**——进到有进行中草稿的
            //   来源页会**自动接上**（状态在列表行上，点进去就是接上）。所以直接等审阅态的标志。
            const enteredReview = await until(
              () => !!d().querySelector('[data-review-actions]'),
              120,
            )
            // 分批第 98 批：**入口断言**。各组是靠"送回 #/tasks → 再进 #/crystallize/<id> → 等某个
            // 控件"进入目标屏的；那个控件一换形态就没了 ⇒ 入口漂、整组空过（§12.24 量到 86 项红）。
            // 所以进入之后先确认状态锚点，再往下量。
            facts['crystal.enterStepReview'] =
              d().querySelector('.crystal-flow')?.getAttribute('data-crystallize-step') ?? null
            return enteredReview
          }

          const cyOk = await cyEnter(cyDraft)
          facts['crystal.attached'] = cyOk
          // 2026-11：列表宽度可拖——沉淀页的把手也在（动作插进网格的）
          facts['crystal.listGripPresent'] = !!d().querySelector('.split-layout .split-grip')

          // ★★ 「预览」那一段必须**不在**了（2026-10-21 使用者："不需要「预览」"）。
          //    判据两条一起用：折叠段里没有叫"预览"的，且页面上没有 `.preview` 元素——
          //    只判其一的话，把预览搬个位置、换个名字都算通过。
          facts['crystal.previewFoldGone'] = ![...d().querySelectorAll('.fold-section')].some((el) =>
            (el.querySelector('.fold-head')?.textContent ?? '').includes('预览'),
          )
          facts['crystal.previewElementGone'] = !d().querySelector('.preview')

          const cyRect = (el) => {
            if (!el) return null
            const r = el.getBoundingClientRect()
            return { x: r.left, y: r.top, w: r.width, h: r.height }
          }

          // ★ 分批第 140 批（U4a，§12.6/§12.7）：**步骤条已删**（设计原文「3 步步骤条 → 删除」）。
          //   进度写在消息流的位置里；"现在到哪了"由顶栏的**状态徽标**说。判据两条一起量：
          //   ① 步骤条真的不在；② 徽标在、且说的是这几种状态之一（提问中/起草中/待审阅/已入库）。
          facts['crystal.stepBarGone'] = d().querySelector('.crystal-steps') === null
          facts['crystal.statusBadgeText'] = (
            d().querySelector('[data-cryst-status]')?.textContent ?? ''
          ).trim()
          // ★ 同一份"轮次 · 工具调用"统计在一屏里出现几次：原来副标题一次 + 素材摘要分节一次
          const cyStatsHits = ((d().body.innerText ?? '').match(/次工具调用/g) ?? []).length
          facts['crystal.statsHits'] = cyStatsHits

          // ★ 审核区块（结论与问题清单常驻的那一块）
          const cyAudit = d().querySelector('.conclusion-block')
          facts['crystal.auditPresent'] = !!cyAudit
          /**
           * ★ 分批第 196 批：中栏那条"产物消息"删了（中间只留对话，结论条也一起没了）
           * ⇒ 这条改名量**审阅态本身**：栏头那排动作在（它是"这一版能收尾"的唯一入口）。
           * 判据的意图没变（"审阅态挂上了、而且有能动手的地方"），宿主跟着改。
           */
          facts['crystal.reviewInArtifactMsg'] = !!d().querySelector('[data-review-actions]')
          // U3d：栏脚输入条真的能用了（不再是 disabled 占位）
          facts['crystal.composerEnabled'] = (() => {
            const input = d().querySelector('[data-composer] .composer-input')
            if (!input) return null
            const send = [...d().querySelectorAll('[data-composer] button')].find((b) => text(b) === '发送')
            return input.disabled === false && !!send
          })()
          /**
           * ★ 分批第 130 批（§12.14 / U3d 第二半）：「追加材料：…」真的接上了写接口。
           *
           * 三条一起量（少一条就会放过"半截功能"）：
           *   ① 回执照实说"已追加为素材 xxx"（不是从前那句"没有写接口"）；
           *   ② 服务端 `GET /api/crystallize/material` 里真的有 `appended/` 那一份；
           *   ③ 那份的正文里**有我打进去的标记**（写进去的是这句话，不是一句空壳）。
           * 只在这条夹具草稿上做（它已 completed；真跑起来的起草在别的夹具上，别抢）。
           *
           * ⚠️ 派发 `input` 而不是只改 value：`bind:value` 靠它才把状态写回组件。
           */
          facts['crystal.appendMaterial'] = await (async () => {
            const input = d().querySelector('[data-composer] .composer-input')
            const send = d().querySelector('[data-composer-send]')
            if (!input || !send) return null
            const marker = '探针追加的复审结论：先看日志再动手'
            input.value = `追加材料：${marker}`
            input.dispatchEvent(new Event('input', { bubbles: true }))
            await wait(30)
            // ★ 分批第 197 批：输入条换成与聊天页同一个控件（`ChatComposer`：textarea + 发送钮，
            //   不再是一个 `<form>`）⇒ 走"点发送"这条路，而不是 `requestSubmit()`。
            send.click()
            const gotReceipt = await until(
              () => (d().querySelector('.composer-receipt')?.textContent ?? '').includes('已追加为素材'),
              100,
            )
            const receipt = d().querySelector('.composer-receipt')?.textContent ?? ''
            const items = await f.contentWindow
              .fetch(`/api/crystallize/material?draftRunId=${encodeURIComponent(cyDraft ?? '')}`)
              .then((r) => (r.ok ? r.json() : null))
              .catch(() => null)
            const appended = (items?.items ?? []).filter((i) => i.relPath.startsWith('appended/'))
            return {
              receiptOk: gotReceipt,
              receipt: receipt.slice(0, 80),
              serverCount: appended.length,
              hasMarker: appended.some((i) => i.text.includes(marker)),
            }
          })()
          /**
           * ★ 分批第 162 批（§12.14）：**对话那行摘要与右栏清单同源**。
           *
           * 判据为什么量"两个数相等"而不是"摘要里有材料"：设计原文是"两处必须由同一份数据现算，
           * 否则必漂"——只量文字存在的话，摘要写死一个数、右栏另算一份，两边对不上也会绿。
           * 这里覆盖了"追加一份"和"删掉一份"之后的状态（上面两段正好改过材料）。
           */
          /**
           * ★ 分批第 196 批：那句「材料 N 项（轨迹 …）」从**中栏对话**搬到了**右栏材料那一节的
           * 标题里**（使用者说对话里那些是冗余信息）。判据的意图不变：**数字必须与清单同源**
           * （写死一个数、清单另算一份，两处对不上就会绿 ⇒ 这里量"标题里的 N == 清单条数"）。
           */
          /**
           * ★ 分批第 198 批：清单换成**与聊天页同一个树**（`WorkDirTree`）⇒ 折叠头那个「N 项」
           * 必须等于**树的顶层行数**（`bind:count`，与树同源）。判据的意图没变：
           * 两个数字对不上就红（写死一个数、树另算一份，照样会红）。
           */
          /**
           * ★ 分批第 200 批（使用者："工作目录的文件的位置是透明的，完全透出下面的文章了"）：
           * 量两件事——栏脚那块**不透明**（computed background-color 带 alpha=1），
           * 以及**消息区自己滚**（`overflow-y: auto`，内容不再溢出到栏脚上面）。
           */
          facts['crystal.footerOpaque'] = (() => {
            const el = d().querySelector('[data-foot-files]')
            if (!el) return null
            const bg = cs(el).backgroundColor ?? ''
            const m = /rgba?\(([^)]+)\)/.exec(bg)
            const alpha = m && m[1].split(',').length === 4 ? Number(m[1].split(',')[3]) : 1
            const stream = d().querySelector('.crystal-msg[data-msg-role="stream"]')
            return {
              bg,
              opaque: alpha >= 0.99,
              streamOverflow: stream ? cs(stream).overflowY : 'absent',
            }
          })()
          /**
