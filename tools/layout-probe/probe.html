              //      按 `.field-label` 判会把一个**合理**的分组误认成"空标题"。
              //      要拦的是"标题在、下面什么都没有"。
              facts['noTools.formHasGroupBox'] = !!(
                perms?.querySelector('.ap-group') ?? null
              )
              facts['noTools.formHasToolsHeading'] = (text(perms) ?? '').includes(
                '已装工具的动作',
              )
              // D44：编辑态那一栏是「左选右配」的 ActionPicker（根 `.action-perms`）。
              //   空态下它**仍在**（空态画在组件内部），但没有分组、没有勾选框。
              facts['noTools.formPickerShown'] = !!perms
              facts['noTools.formHasAnyCheckbox'] = !!(
                perms?.querySelector('input[type=checkbox]') ?? null
              )
              // ★ 那个去处**真的通**：点了之后落到「工具」页
              const goToolsBtn = [...(perms?.querySelectorAll('button') ?? [])].find((b) =>
                (text(b) ?? '').includes('工具'),
              )
              facts['noTools.formGoButton'] = text(goToolsBtn ?? null)
              if (goToolsBtn) {
                click(goToolsBtn)
                await wait(600)
                facts['noTools.linkNavigatesToTools'] =
                  f.contentWindow.location.hash === '#/tools' &&
                  text(d().querySelector('.page-name')) === '工具'
              }
            }
          }

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // 「配过、但现在解析不出来」：包被卸载之后那条权限该怎么显示
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          //
          // ★ 这是**老数据那条兜底显示的孪生情形**，而且它**现在就能造成**：
          //   前面在详情里把 `probe-tool.append-note` 勾给了审核员，刚才又把
          //   `probe-tool` 卸载了 —— 于是那个 agent 身上留着一条**没有任何已装包
          //   提供**的权限。同一件事在内置动作被移除之后也会发生在老数据上
          //   （`comment.create` 这类名字再也不是动作了）。
          //
          //   要求是三条一起成立，缺一条就是错：
          //     ① 契约值**照原样留着**（不静默过滤掉——"配过"这件事不能抹）；
          //     ② 旁边明说它**当前不可用**（不假装还能用）；
          //     ③ 编辑态里**列得出来、去得掉**（否则一保存就被服务端拒，而错误里
          //        点名的那个动作在界面上根本不存在 —— 那是个死胡同）。
          const deadAction = 'probe-tool.append-note'
          // ⚠️ 这里复用**阶段 A** 就已找到的那个 agent（它身上配着 `deadAction`）：
          //    按动作名重新找一遍会在阶段 A 改过名单之后失手，而且同一个东西
          //    不该有两个出处。
          facts['noTools.deadHolderFound'] = !!holder
          if (holder) {
            f.contentWindow.location.hash = '#/agents'
            await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
            await wait(300)
            const holderRow = [...d().querySelectorAll('.agent-row')].find((row) =>
              (row.textContent ?? '').includes(holder.name),
            )
            if (holderRow) {
              click(holderRow.querySelector('.list-row-main'))
              facts['noTools.deadDetailSwitched'] = await until(
                () => String(d().querySelector('#agent-name')?.value ?? '') === holder.name,
                60,
              )
              await wait(300)
              const deadSection =
                [...d().querySelectorAll('.card.agent-card .cell')].find((s) =>
                  (text(s.querySelector('h3')) ?? '').includes('行动权限'),
                ) ?? null
              const deadRow = [...(deadSection?.querySelectorAll('.field-row') ?? [])].find((r) =>
                text(r.querySelector('.row-label')) === '允许触发的动作',
              )
              const deadChip = [...(deadRow?.querySelectorAll('.chip') ?? [])].find((c) =>
                text(c.querySelector('code')) === deadAction,
              )
              facts['noTools.deadChipKept'] = !!deadChip
              // ② 标记：chip 里除了契约值还有一句"当前不可用"
              facts['noTools.deadChipMarked'] = need('那条 chip 的附注', () =>
                deadChip ? text(deadChip.querySelector('.chip-sub')) : null,
              )
              // ③ 解释那一句（为什么不可用、下一步怎么办）
              //
              //   ⚠️ 两件事分开量：**成因**（内置动作已整组移除 / 包被卸载——两种
              //      来源都必须说出来）与**下一步**（只读态里没有「移除」按钮，
              //      所以那句话必须是"点「编辑」…"，不能是编辑态那一句）。
              const deadHintText = String(text(deadSection) ?? '')
              facts['noTools.deadHintShown'] = deadHintText.includes('现在找不到出处')
              facts['noTools.deadHintBothCauses'] =
                deadHintText.includes('内置动作') &&
                deadHintText.includes('工具包被卸载')
              facts['noTools.deadHintNextStepReadOnly'] =
                deadHintText.includes('点「编辑」') && deadHintText.includes('移除')
              // 编辑态：列得出来 + 有「移除」入口
              const deadEditBtn = [...d().querySelectorAll('.detail-pane button')].find(
                (b) => text(b) === '编辑',
              )
              if (deadEditBtn) {
                click(deadEditBtn)
                await until(() => !!d().querySelector('.action-perms'), 60)
                await wait(200)
                const deadPerms = d().querySelector('.action-perms')
                facts['noTools.deadListedInEdit'] = !!(
                  deadPerms &&
                  (text(deadPerms) ?? '').includes(deadAction) &&
                  (text(deadPerms) ?? '').includes('配过、但现在解析不出来')
                )
                facts['noTools.deadHintNextStepInEdit'] =
                  (text(deadPerms) ?? '').includes('「移除」') &&
                  (text(deadPerms) ?? '').includes('工具')
                const dropBtn = [...(deadPerms?.querySelectorAll('button') ?? [])].find(
                  (b) => text(b) === '移除',
                )
                facts['noTools.deadRemoveButton'] = !!dropBtn

                // ★ 出口的两半：
                //   ① 只去掉**一条**就保存 ⇒ **仍然被拒**。服务端的规则是"名单里
                //      只要还有一条没有出处的动作，整份就不收"——把这一条量出来，
                //      使用者才不会以为"点一下就通了"。
                //   ② 把**所有**没有出处的都去掉 ⇒ 这一次真的存进去（以接口为准）。
                //   没有②的话，界面上"列出来了"仍然可能是个死胡同。
                const permsNow = () => d().querySelector('.action-perms')
                const anyDropBtn = () =>
                  [...(permsNow()?.querySelectorAll('button') ?? [])].find(
                    (b) => text(b) === '移除',
                  )
                if (dropBtn) {
                  click(dropBtn)
                  await wait(250)
                  const partialSaveBtn = [...d().querySelectorAll('.detail-pane button')].find((b) =>
                    text(b).startsWith('保存'),
                  )
                  if (partialSaveBtn) {
                    click(partialSaveBtn)
                    await until(() => !!d().querySelector('.detail-pane .notice.bad'), 40)
                    await wait(250)
                    facts['noTools.deadPartialStillRefused'] =
                      !!d().querySelector('.detail-pane .notice.bad')
                  }
                  // 剩下的逐条去掉（每点一次就少一条，最多循环几轮兜住）
                  for (let i = 0; i < 6; i++) {
                    const btn = anyDropBtn()
                    if (!btn) break
                    click(btn)
                    await wait(200)
                  }
                  facts['noTools.deadAllRemoved'] = !/probe-tool\.[a-z-]+/.test(
                    text(permsNow()) ?? '',
                  )
                  const finalSaveBtn = [...d().querySelectorAll('.detail-pane button')].find((b) =>
                    text(b).startsWith('保存'),
                  )
                  if (finalSaveBtn) {
                    click(finalSaveBtn)
                    await until(() => !d().querySelector('.action-perms'), 40)
                    await wait(250)
                    facts['noTools.deadDroppedOnServer'] = await f.contentWindow
                      .fetch('/api/agents')
                      .then((r) => r.json())
                      .then((p) => {
                        const after = (p.agents ?? []).find((a) => a.name === holder.name)
                        return (
                          !!after && !(after.allowedActions ?? []).includes(deadAction)
                        )
                      })
                      .catch(() => false)
                  }
                }
              }
            }
          }
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ★★ 这一段**故意排在前面**（紧接着工具空态、在聊天与列表骨架那几段之前）：
        //    探针页的虚拟时间预算会被**前面那些失败的 `until()`** 吃掉（每次 15s
        //    虚拟时间），排在最后的话，前面一有夹具造不出来，这一段就整段量不到
        //    （实测：`crystal.*` 一个事实都没有，dump 里最后一个事实停在 noTools）。
        //    它自己会导航到沉淀页，与前后段落的现场互不依赖。
        // ══════════════ 沉淀：审阅页排版（D80 四轮重排）══════════════
        //
        // 这一组量的是**排版**（类型检查看不见的那一类），判据全部来自
        // `docs/design/skill-crystallization.md` §6.1 的三条规矩：
        //
        //   ① 结论常驻：结论条在首屏，且一行说完"能不能入库 / 改了什么 / 目标是谁"；
        //   ② 主区自己滚：页面**不整页滚**（页面高 ≈ 视口高），树与窗格各自滚；
        //   ③ 编辑与差异同位置切换：默认在「内容」标签，点「差异」后编辑器让位、
        //      diff 出现——而不是像改之前那样 diff 在编辑器下方 519px 处。
        //
        // ⚠️ 夹具是**直接写进 store** 的一条已完成起草 run（见 run.mjs 里
        //    "为什么这一组夹具要停一次 daemon 再起"）：走接口会 spawn 真 CLI。
        {
          const cyQuery = new URLSearchParams(location.search)
          const cyDraft = cyQuery.get('crystalDraft')
          const cyRevised = cyQuery.get('crystalRevised')
          facts['crystal.fixture'] = { draft: cyDraft, revised: cyRevised }

          /**
           * 进沉淀页并把那条草稿挂起来（「继续」→ 审阅态）。
           *
           * ⚠️ **先整页离开沉淀视图再回来**（`#/tasks` → `#/crystallize/<id>`），
           *    不能只在沉淀视图内部换 `runId`：实测撞到过——换过去之后读到的结论条
           *    还是**上一条草稿**的（"对比当前版本 +24 −0"，而那一条草稿根本没有
           *    `revisedFrom`）。原因是"继续 → 审阅"这条路会**接管**组件状态
           *    （`draftRunId` / `diffAgainst` / `editing`），而 `until()` 对"结论条
           *    在不在"的等待在上一条草稿的现场里**立刻就成立**，于是这一条量到的
           *    是别人的数字。与「新建任务」那一段同一个坑（那边也写了同样的话）。
           */
          const cyEnter = async (cyRunId) => {
            if (!cyRunId) return false
            f.contentWindow.location.hash = '#/tasks'
            await until(() => !d().querySelector('.review-bar'), 40)
            f.contentWindow.location.hash = `#/crystallize/${cyRunId}`
            const attached = await until(
              () =>
                [...d().querySelectorAll('button')].some((b) => text(b).includes('继续')),
              60,
            )
            if (!attached) return false
            const cont = [...d().querySelectorAll('button')].find((b) => text(b).includes('继续'))
            click(cont)
            // 审阅态的标志：结论条（`.review-bar`）出现
            return await until(() => !!d().querySelector('.review-bar'), 120)
          }

          const cyOk = await cyEnter(cyDraft)
          facts['crystal.attached'] = cyOk

          const cyRect = (el) => {
            if (!el) return null
            const r = el.getBoundingClientRect()
            return { x: r.left, y: r.top, w: r.width, h: r.height }
          }

          // ① 结论条：在、而且**在首屏**（改前审阅的结论在 y=932，900 高的窗口看不到）
          const cyBar = d().querySelector('.review-bar')
          const cyBarRect = cyRect(cyBar)
          facts['crystal.barPresent'] = !!cyBar
          facts['crystal.barText'] = cyBar ? text(cyBar) : null
          facts['crystal.barY'] = cyBarRect ? Math.round(cyBarRect.y) : null
          facts['crystal.viewportH'] = f.contentWindow.innerHeight
          facts['crystal.barAboveFold'] =
            cyBarRect !== null && cyBarRect.y < f.contentWindow.innerHeight * 0.5

          // ② 不整页滚：文档高 ≈ 视口高（改前内容 ~2030px，整页滚）
          const cyScrollH = d().documentElement.scrollHeight
          facts['crystal.scrollH'] = cyScrollH
          facts['crystal.pageFitsViewport'] =
            cyScrollH <= f.contentWindow.innerHeight + 4

          // 主区：两列（树固定 240 + 窗格更宽）、高度在 clamp 区间内
          const cyPane = d().querySelector('.review-pane')
          const cyTree = d().querySelector('.review-pane .file-tree')
          const cyBody = d().querySelector('.review-pane .file-body')
          const cyPaneRect = cyRect(cyPane)
          const cyTreeRect = cyRect(cyTree)
          const cyBodyRect = cyRect(cyBody)
          facts['crystal.paneCols'] = cyPane ? cs(cyPane).gridTemplateColumns : null
          facts['crystal.treeW'] = cyTreeRect ? Math.round(cyTreeRect.w) : null
          facts['crystal.paneH'] = cyPaneRect ? Math.round(cyPaneRect.h) : null
          facts['crystal.paneTreeBodySideBySide'] =
            cyTreeRect !== null &&
            cyBodyRect !== null &&
            cyBodyRect.x > cyTreeRect.x &&
            Math.abs(cyTreeRect.y - cyBodyRect.y) < 2

          // 树行：徽标 + 名字 + `+n −m`；徽标与行数**同源**（都来自 diff）
          facts['crystal.treeRows'] = [...d().querySelectorAll('.review-pane .file-row')].map(
            (b) => text(b),
          )
          facts['crystal.treeHasSkillMd'] = facts['crystal.treeRows'].some((t) =>
            t.includes('SKILL.md'),
          )
          facts['crystal.treeTagTexts'] = [
            ...d().querySelectorAll('.review-pane .change-tag'),
          ].map((e) => text(e))

          // 只读 frontmatter + slug 是唯一输入框（四轮第 ④ 点：审阅不再填空）
          const cySlugInputs = [...d().querySelectorAll('.slug-inline input')]
          const cyAllTextInputs = [...d().querySelectorAll('.review-bar-block input')]
          facts['crystal.slugInputCount'] = cySlugInputs.length
          facts['crystal.reviewInputCount'] = cyAllTextInputs.length
          facts['crystal.frontmatterLine'] =
            (d().querySelector('.frontmatter-line') &&
              text(d().querySelector('.frontmatter-line'))) ||
            null

          // ③ 编辑与差异同位置切换
          const cyTabs = [...d().querySelectorAll('.pane-tabs > button')]
          facts['crystal.tabTexts'] = cyTabs.map((b) => text(b))
          facts['crystal.editorInContentTab'] = !!d().querySelector('.file-body textarea.editor')
          facts['crystal.diffVisibleInContentTab'] =
            d().querySelectorAll('.diff-line').length > 0
          const cyDiffTab = cyTabs.find((b) => text(b) === '差异')
          if (cyDiffTab) click(cyDiffTab)
          const cySwapped = await until(
            () => !d().querySelector('textarea.editor') && d().querySelectorAll('.diff-line').length > 0,
            60,
          )
          facts['crystal.diffTabSwapsEditor'] = cySwapped
          facts['crystal.diffLineCount'] = d().querySelectorAll('.diff-line').length
          const cyEditorRectBefore = cyBodyRect
          const cyDiffBox = d().querySelector('.diff-box')
          const cyDiffRect = cyRect(cyDiffBox)
          // "同位置"：diff 那块在**编辑器原来那块窗格里**（同一个 x / 宽），
          // 而不是像改之前那样跑到窗格下面 519px
          facts['crystal.diffSamePlaceAsEditor'] =
            cyDiffRect !== null &&
            cyEditorRectBefore !== null &&
            Math.abs(cyDiffRect.x - cyEditorRectBefore.x) < 4 &&
            cyDiffRect.y < cyEditorRectBefore.y + cyEditorRectBefore.h
          // ★ 基线切换按钮**只有改版草稿才有**（`{#if artifacts.revisedFrom !== null}`）：
          //   这一条量的正是"这条不是改版 ⇒ 不给一个永远空的切换"。
          facts['crystal.nonRevisedHasNoBaselineSwitch'] = ![
            ...d().querySelectorAll('.pane-tabs button'),
          ].some((b) => text(b).includes('对比'))
          // 回到内容标签，后面的检查在编辑态里量
          const cyContentTab = [...d().querySelectorAll('.pane-tabs > button')].find(
            (b) => text(b) === '内容',
          )
          if (cyContentTab) click(cyContentTab)
          await until(() => !!d().querySelector('textarea.editor'), 60)

          // 折叠：素材与起草日志**默认收起**，且都在审阅主区**下方**
          const cyFolds = [...d().querySelectorAll('.fold-section')]
          const cyFoldHeads = cyFolds.map((el) => ({
            label: text(el.querySelector('.fold-head')),
            open: el.querySelector('.fold-head')?.getAttribute('aria-expanded') === 'true',
            y: Math.round(el.getBoundingClientRect().top),
          }))
          facts['crystal.foldHeads'] = cyFoldHeads
          const cyMaterialFold = cyFolds.find((el) =>
            text(el.querySelector('.fold-head')).includes('素材'),
          )
          facts['crystal.materialFoldPresent'] = !!cyMaterialFold
          facts['crystal.materialFoldClosed'] =
            cyMaterialFold?.querySelector('.fold-head')?.getAttribute('aria-expanded') === 'false'
          facts['crystal.materialFoldSummary'] = cyMaterialFold
            ? text(cyMaterialFold.querySelector('.fold-summary'))
            : null
          facts['crystal.materialBelowPane'] =
            !!cyMaterialFold &&
            cyPaneRect !== null &&
            cyMaterialFold.getBoundingClientRect().top >= cyPaneRect.y + cyPaneRect.h - 2

          // 展开素材：清单 + 预览（与审阅的文件树**同一套**观感）
          if (cyMaterialFold) {
            click(cyMaterialFold.querySelector('.fold-head'))
            const cyOpened = await until(
              () => !!d().querySelector('.fold-section .file-pane .file-row'),
              60,
            )
            facts['crystal.materialFoldOpens'] = cyOpened
            facts['crystal.materialRows'] = [
              ...d().querySelectorAll('.fold-section .file-pane .file-row'),
            ].map((b) => text(b))
            const cyMatPane = d().querySelector('.fold-section .file-pane')
            facts['crystal.materialPaneCols'] = cyMatPane ? cs(cyMatPane).gridTemplateColumns : null
            facts['crystal.materialPreviewLen'] = (
              d().querySelector('.fold-section .file-pre')?.textContent ?? ''
            ).length
            // 收回去，别让后面的检查量到展开态
            click(d().querySelector('.fold-head'))
            await wait(120)
          } else {
            facts['crystal.materialFoldOpens'] = null
            facts['crystal.materialRows'] = null
            facts['crystal.materialPaneCols'] = null
            facts['crystal.materialPreviewLen'] = null
          }

          // 「按意见改一版」：输入框**默认不在**（点开才占一行）
          const cyReviseBtn = [...d().querySelectorAll('.bar-actions button')].find((b) =>
            text(b).includes('按意见'),
          )
          facts['crystal.reviseButtonPresent'] = !!cyReviseBtn
          facts['crystal.reviseRowHiddenInitially'] = !d().querySelector('.revise-row textarea')
          if (cyReviseBtn) {
            click(cyReviseBtn)
            const cyReviseShown = await until(() => !!d().querySelector('.revise-row textarea'), 40)
            facts['crystal.reviseRowAppearsOnDemand'] = cyReviseShown
            click(cyReviseBtn)
            await wait(120)
          } else {
            facts['crystal.reviseRowAppearsOnDemand'] = null
          }

          // ★ 改版草稿（`revisedFrom`）：默认对比**上一版草稿**，且能切回"对比当前版本"
          const cyRevisedOk = await cyEnter(cyRevised)
          facts['crystal.revisedAttached'] = cyRevisedOk
          // 先认现场：编辑器里是不是**这一版**的字（否则下面量的是上一条草稿的数字）
          // ⚠️ 要**整份**拿去判：那一句差异在正文第 100 个字符之后，截前 60 个字符
          //    时两版长得一模一样（第一版就是这么写的 ⇒ 这条断言永远红，而现场其实
          //    是对的）。
          facts['crystal.revisedEditorHasMarker'] = (
            d().querySelector('textarea.editor')?.value ?? ''
          ).includes('已按意见改')
          facts['crystal.revisedEditorHead'] = (
            d().querySelector('textarea.editor')?.value ?? ''
          ).slice(0, 60)
          facts['crystal.revisedBarText'] = cyRevisedOk
            ? text(d().querySelector('.review-bar'))
            : null
          // 接口那一份也读一次：分清"接口没给 revisedFrom"与"页面没换现场"
          facts['crystal.revisedApiRevisedFrom'] = await f.contentWindow
            .fetch(`/api/crystallize/artifacts?draftRunId=${encodeURIComponent(cyRevised ?? '')}`)
            .then((r) => (r.ok ? r.json() : null))
            .then((p) => (p ? p.revisedFrom !== null : null))
            .catch(() => null)
          const cyDiffTabB = [...d().querySelectorAll('.pane-tabs > button')].find(
            (b) => text(b) === '差异',
          )
          if (cyDiffTabB) click(cyDiffTabB)
          await until(() => !!d().querySelector('.diff-box'), 60)
          const cySwitchButtons = [...d().querySelectorAll('.pane-tabs button')].map((b) => text(b))
          facts['crystal.revisedSwitchButtons'] = cySwitchButtons
          facts['crystal.revisedHasBaselineSwitch'] = cySwitchButtons.includes('对比上一版草稿')
          facts['crystal.revisedDefaultBaselineActive'] = (() => {
            const btns = [...d().querySelectorAll('.pane-tabs .tabs-right button')]
            const active = btns.find((b) => b.classList.contains('active'))
            return active ? text(active) : null
          })()
          facts['crystal.revisedDiffLineCount'] = d().querySelectorAll('.diff-line').length
        }


        // ══════════════ 聊天（闭环的旁路）══════════════
        //
        // 这一组刻意**不造对话、不发消息**：发一条就会起一条真 run，而这个探针
        // 的边界是"基本不造 run"（唯一例外是新建任务那组三步链）。所以量的是
        // **空态那一屏**——它恰恰是最容易画错的一屏（没有对话时右栏该显示什么、
        // 输入框在不在该在的容器里）。
        //
        // ⚠️ 历史教训（`README.md` 的"教训"一节）：上一回表单画进了左栏、横盖
        //    右栏，而当时所有检查全绿——因为只量了"长什么样"、没量"在不在该在的
        //    容器里"。所以这里量的是**包含关系与几何**，不是"页面上有没有这几个字"。
        f.contentWindow.location.hash = '#/chat'
        await until(() => text(d().querySelector('.list-pane h2')) === '对话')
        await wait(400)

        const chatList = () => d().querySelector('.list-pane')
        const chatDetail = () => d().querySelector('.detail-pane')
        const chatRect = (el) => {
          if (!el) return null
          const r = el.getBoundingClientRect()
          return {
            top: Math.round(r.top),
            left: Math.round(r.left),
            w: Math.round(r.width),
            h: Math.round(r.height),
          }
        }

        facts['chat.hasListPane'] = chatList() !== null
        facts['chat.hasDetailPane'] = chatDetail() !== null
        facts['chat.twoColumnsSideBySide'] = need('两栏并排', () => {
          const a = chatRect(chatList())
          const b = chatRect(chatDetail())
          if (!a || !b) return false
          // 并排 = 左栏整个在右栏左边，而且两栏各自真有宽度
          return a.left + a.w < b.left + 2 && a.w > 100 && b.w > 100
        })
        facts['chat.listNarrowerThanDetail'] = need('左栏比右栏窄', () => {
          const a = chatRect(chatList())
          const b = chatRect(chatDetail())
          return a && b ? a.w < b.w : false
        })

        // ── 每项右侧的删除按钮：需求本身（"对话列表每项加删除按钮"）──
        // 此刻可能还没有对话（夹具是后面建的）：没有项就没有要检查的——空过；
        // 有项则每一项都必须满足"主按钮 + 兄弟删除按钮"（不是按钮套按钮）。
        facts['chat.deleteButtonPerItem'] = need('每项右侧的删除按钮', () => {
          const items = [...d().querySelectorAll('.list-pane .conv-row')]
          return items.every(
            (li) =>
              !!li.querySelector('.list-row-main') && !!li.querySelector(':scope > .list-row-action'),
          )
        })

        // ── 空态：没有对话时列表里是空态，而输入框必须在**右栏里** ──
        facts['chat.emptyStateShown'] = (() => {
          const empty = d().querySelector('.list-pane .empty')
          return empty !== null && text(empty.querySelector('strong') ?? empty).length > 0
        })()
        facts['chat.composerInsideDetail'] = need('输入框在右栏里', () => {
          const box = d().querySelector('.detail-pane textarea')
          if (!box) return false
          return chatDetail().contains(box)
        })
        facts['chat.composerNotInList'] = need('输入框不在左栏里', () => {
          return d().querySelector('.list-pane textarea') === null
        })
        // 没选执行者时不该让人白打一段字：要么有下拉、要么有一条"先去建一个"的提示
        facts['chat.agentPickerOrHint'] = need('执行者选择器或提示', () => {
          const sel = d().querySelector('.detail-pane select')
          const warn = d().querySelector('.detail-pane .notice')
          return sel !== null || warn !== null
        })
        // ★ 发送键那句话必须在页面上说明白：这里 Enter 发送，与「新建任务」的
        //   「要做什么」（Enter 换行）**正好相反**，靠猜是不负责任的。
        facts['chat.enterHint'] = need('Enter 发送的说明', () => {
          const foot = d().querySelector('.detail-pane .pane-foot')
          if (!foot) return false
          const t = text(foot)
          return t.includes('Enter') && t.includes('Shift')
        })
        /**
         * ⚠️ 这里原有 `chat.boundaryHint`（左栏底部那句"这里不动手：聊天不产出判决，
         *    而动作的门槛就是判决。"）。2026-09 按要求把那句话从页面上拿掉了，这条
         *    断言连同 `run.mjs` 里的那一条一起删——**留一条量一个已经不存在的东西的
         *    断言，比没有断言更坏**：它会把"这句话又回来了"当成正常。
         *    边界本身没变，落点改在「带过去」（预填到新建任务）那条路上。
         */
        /**
         * 气泡圆角。
         *
         * ⚠️ 两条弯路，都走过：
         *
         *   1. 往 body 里塞一个 `class="bubble"` 去量 ⇒ 那条样式是 Chat.svelte
         *      **局部作用域**的（构建后是 `.bubble.svelte-xxxx`），塞在 body 里的
         *      元素根本匹配不到，量出来永远是 0px。**"量到了但量的是别的东西"
         *      比没有检查更糟**。
         *   2. 扫 `document.styleSheets` 找规则 ⇒ 这里量到的是 `null`（同步拿不到
         *      那份样式表；具体哪一环不可见不重要，结论是这条路从探针这侧不成立）。
         *
         * 现在改成就地读**构建产物那份 CSS 的文本**，正则在里面找 `.bubble` 的
         * border-radius。它量的是"样式表里写了什么"，不是"某个元素算出来是多少"
         * ——空态下页面上一个气泡都没有（探针不造对话），所以后者本来也量不到。
         */
        facts['chat.bubbleRadiusRule'] = await (async () => {
          const link = d().querySelector('link[rel="stylesheet"]')
          if (!link) return null
          try {
            const css = await f.contentWindow.fetch(link.href).then((r) => r.text())
            const m = css.match(/\.bubble[^{,]*\{[^}]*border-radius:\s*([^;}]+)/)
            return m ? m[1].trim() : null
          } catch {
            return null
          }
        })()

        facts['chat.hasContent'] = need('聊天页有内容', () => main().textContent.trim().length > 0)

        /**
         * 聊天那一页的下拉：执行者 + **每一条装着的 skill**。
         *
         * ★ 两条都要在：使用者要的是"**所有已安装的 skill** 都能选"，包括**没人挂**
         *   的那条。有主的走"选它 = 选那个人"（所以这里量"界面写出的那个名字是不是
         *   接口上真挂着它的执行者"——facts 从 `/api/agents` 现取，不从选项文字反读，
         *   反读就成了自说自话）；没主的绑当前执行者、由这个对话自己带着，而**那件事
         *   只能从发出去的请求体看出来**，所以最后一条检查把 `fetch` 截下来看
         *   `skillIds`：它要是没带上，界面可以一片正常，而这一轮就是白选。
         */
        const chatSelect = () => d().querySelector('#chat-agent')
        const chatSkillOpts = () =>
          [...(chatSelect()?.querySelectorAll('option') ?? [])].filter((o) =>
            (o.getAttribute('value') ?? '').startsWith('skill:'),
          )
        const chatFixtures = await (async () => {
          try {
            const agents = (await f.contentWindow.fetch('/api/agents').then((r) => r.json())).agents ?? []
            const skills = (await f.contentWindow.fetch('/api/skills').then((r) => r.json())).skills ?? []
            const owned = skills.find((s) => s.slug === 'chat-probe-skill')
            const orphan = skills.find((s) => s.slug === 'chat-orphan-skill')
            const owner = agents.find(
              (a) => a.role === 'executor' && (a.skillIds ?? []).includes(owned?.id),
            )
            const executors = agents.filter((a) => a.role === 'executor').map((a) => a.id)
            return { skills, owned, orphan, owner, executors }
          } catch {
            return {}
          }
        })()
        facts['chat.ownedSkillOption'] = need('挂在执行者身上的 skill 是一个选项，且写出等于跟谁说话', () => {
          const opt = chatSkillOpts().find(
            (o) => o.getAttribute('value') === `skill:${chatFixtures.owned?.id}`,
          )
          if (!opt) return false
          const t = opt.textContent ?? ''
          return t.includes('chat-probe-skill') && t.includes(chatFixtures.owner?.name ?? '\u0000')
        })
        facts['chat.allSkillsOffered'] = await (async () => {
          const skills = chatFixtures.skills ?? []
          if (skills.length === 0) {
            errors.push('所有已安装的 skill 都在选项里：夹具没造出来（见 run.mjs 里 skill 那一段）')
            return false
          }
          const opts = chatSkillOpts().map((o) => o.getAttribute('value'))
          const missing = skills.filter((s) => !opts.includes(`skill:${s.id}`))
          if (missing.length > 0) {
            errors.push(
              `装了却没出现在下拉里的 skill：${missing.map((s) => s.slug).join('、')}` +
                `（下拉里 ${opts.length} 项，装着 ${skills.length} 条）`,
            )
            return false
          }
          if (opts.length !== skills.length) {
            errors.push(`skill 选项数（${opts.length}）与装着的条数（${skills.length}）不一致`)
            return false
          }
          // 没人挂的那条也必须出现（"所有已安装的 skill 都要能选"）
          const orphanOpt = chatSkillOpts().find(
            (o) => o.getAttribute('value') === `skill:${chatFixtures.orphan?.id}`,
          )
          if (!orphanOpt) {
            errors.push('「chat-orphan-skill」没人挂，但它也必须能选——它现在不在下拉里')
            return false
          }
          return (orphanOpt.textContent ?? '').includes('chat-orphan-skill')
        })()
        facts['chat.skillBindsOwner'] = await (async () => {
          const sel = chatSelect()
          const opt = chatSkillOpts().find(
            (o) => o.getAttribute('value') === `skill:${chatFixtures.owned?.id}`,
          )
          if (!sel || !opt || !chatFixtures.owner) {
            errors.push('选 skill 绑定执行者：缺夹具（见 run.mjs 里 chat-probe-skill 那一段）')
            return false
          }
          const before = sel.value
          sel.value = opt.getAttribute('value')
          sel.dispatchEvent(new Event('change', { bubbles: true }))
          await wait(250)
          const hint = text(d().querySelector('.detail-pane [data-skill-owner]'))
          // 量完把它放回去：这一页后面还要按"初始状态"被别组检查看一眼
          sel.value = before
          sel.dispatchEvent(new Event('change', { bubbles: true }))
          await wait(120)
          if (!hint.includes(chatFixtures.owner.name)) {
            errors.push(`选 skill 之后界面上没写出"将使用 ${chatFixtures.owner.name}"（量到的是「${hint}」）`)
            return false
          }
          return true
        })()
        /**
         * ★★ 没人挂的 skill：选了要（1）说出"这一轮会带上它"、（2）**真的把
         * skillIds 发出去**。
         *
         * (2) 才是这条检查的全部意义：界面可以画得完全正确，而 `skillIds` 忘了带
         * ——那一轮就是用一个没带这条 skill 的执行者在说话，页面上看不出任何异常。
         * 所以把 `fetch` 换掉、只**截请求体**再回一个错误（不能让它真去建对话，
         * 那会起一条 run），量完立刻换回来。
         */
        facts['chat.orphanSkillSentAsSkillIds'] = await (async () => {
          const sel = chatSelect()
          const opt = chatSkillOpts().find(
            (o) => o.getAttribute('value') === `skill:${chatFixtures.orphan?.id}`,
          )
          if (!sel || !opt || !chatFixtures.orphan) {
            errors.push('没人挂的 skill：缺夹具（见 run.mjs 里 chat-orphan-skill 那一段）')
            return false
          }
          const before = sel.value
          sel.value = opt.getAttribute('value')
          sel.dispatchEvent(new Event('change', { bubbles: true }))
          await wait(250)
          const hint = text(d().querySelector('.detail-pane [data-skill-owner]'))
          if (!hint.includes('chat-orphan-skill')) {
            errors.push(`选了没人挂的 skill 之后，界面没说明这一轮会带上它（量到的是「${hint}」）`)
          }

          const real = f.contentWindow.fetch
          let sent = null
          f.contentWindow.fetch = function (input, init) {
            const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
            const method = (init && init.method) || 'GET'
            if (String(url).includes('/api/conversations') && method === 'POST') {
              try {
                sent = JSON.parse(String((init && init.body) || 'null'))
              } catch {
                sent = null
              }
              return Promise.resolve(
                new Response(JSON.stringify({ error: '探针只截请求体', code: 'probe' }), {
                  status: 500,
                  headers: { 'content-type': 'application/json' },
                }),
              )
            }
            return real.call(f.contentWindow, input, init)
          }
          try {
            const box = d().querySelector('.detail-pane textarea')
            const sendBtn = [...d().querySelectorAll('.detail-pane button')].find(
              (b) => (b.textContent ?? '').trim() === '发送',
            )
            if (!box || !sendBtn) {
              errors.push('没人挂的 skill：右栏里找不到输入框或"发送"按钮')
              return false
            }
            box.value = '探针：截一下请求体'
            box.dispatchEvent(new Event('input', { bubbles: true }))
            await wait(200)
            click(sendBtn)
            await wait(600)
          } finally {
            f.contentWindow.fetch = real
            sel.value = before
            sel.dispatchEvent(new Event('change', { bubbles: true }))
            await wait(120)
          }

          if (!sent) {
            errors.push('没人挂的 skill：没截到 POST /api/conversations 的请求体')
            return false
          }
          if (!Array.isArray(sent.skillIds) || sent.skillIds.length !== 1) {
            errors.push(
              `选了没人挂的 skill 却没把 skillIds 发出去（实际 ${JSON.stringify(sent.skillIds)}）——这一轮等于白选`,
            )
            return false
          }
          if (sent.skillIds[0] !== chatFixtures.orphan.id) {
            errors.push(`skillIds 发的是 ${sent.skillIds[0]}，不是选中的 ${chatFixtures.orphan.id}`)
            return false
          }
          // 绑的人必须还是个真执行者——"没人挂"不等于"没人说话"
          if (!(chatFixtures.executors ?? []).includes(sent.agentId)) {
            errors.push(`没人挂的 skill：请求体里的 agentId「${sent.agentId}」不是一个执行者`)
            return false
          }
          return true
        })()

        /**
         * ★★ 旧 daemon：`/api/identity` 里没有 `conversation-skills`。
         *
         * 这一档**很容易真踩上**：日常做法是"重建前端 → 刷新页面"，而**不带**重启
         * daemon。旧 daemon 不解析 `skillIds`（请求体那层没有 zod 校验，未知字段被
         * 忽略），于是"选了没人挂的 skill"会被**静默地当成没说**——那一轮用一个没带
         * 这条 skill 的执行者在说话，而界面上写着"将使用它 + 这条 skill"，两边都不报错。
         *
         * 所以那个标志不在时，没人挂的 skill **不许出现在下拉里**，并且要说明原因
         * （与「换人审 / 不审」「人工裁决」「任务级动作白名单」同一规矩：宁可少给一个
         * 选项，也不能给一个兑现不了的承诺）。有主的 skill 不受影响。
         *
         * 量完必须**还原**：把 fetch 换回来，并重新走一遍会重读身份的路径，让后面
         * 那些检查量到的是真实身份。
         */
        /**
         * 绕到「智能体」页**点一次它的「刷新」**，再回到聊天页。
         *
         * ⚠️ 只换 hash 是不够的：身份（`/api/identity`）是在那一页的 `refresh()`
         *    里重读的，光换视图拿到的是**上一次加载的那份**。第一版就是这么写的，
         *    于是下面那条检查量到的仍是"新 daemon"的行为（探针当场报了红——这正是
         *    "前提不成立时要能被抓住"的价值）。
         */
        const chatReloadIdentity = async () => {
          f.contentWindow.location.hash = '#/agents'
          if (!(await until(() => text(d().querySelector('.page-name')) === '智能体', 60))) {
            return false
          }
          await wait(200)
          // 「刷新」2026-09 起在顶栏里、紧跟着页名（原来在左栏头部）。⚠️ 这个 helper 的
          // 调用方会**紧接着读聊天页左栏**（`chatEnsureFixtureConversation`），
          // 所以这里点不到就等于页面留在智能体页 —— 后面那一串会一起红。
          const btn = [...d().querySelectorAll('.topbar .page-actions button')].find(
            (b) => text(b) === '刷新',
          )
          if (!btn) return false
          click(btn)
          await wait(400)
          f.contentWindow.location.hash = '#/chat'
          const back = await until(() => text(d().querySelector('.list-pane h2')) === '对话', 60)
          await wait(400)
          return back
        }
        facts['chat.unownedHiddenOnOldDaemon'] = await (async () => {
          const real = f.contentWindow.fetch
          f.contentWindow.fetch = function (input, init) {
            const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
            if (!String(url).includes('/api/identity')) {
              return real.call(f.contentWindow, input, init)
            }
            return real.call(f.contentWindow, input, init).then(async (res) => {
              const body = await res.json().catch(() => null)
              if (!body) return res
              body.capabilities = (body.capabilities ?? []).filter(
                (c) => c !== 'conversation-skills',
              )
              return new Response(JSON.stringify(body), {
                status: res.status,
                headers: { 'content-type': 'application/json' },
              })
            })
          }
          let out = false
          try {
            await chatReloadIdentity()
            const sel = chatSelect()
            if (!sel) {
              errors.push('旧 daemon 那一档：回到聊天页之后没找到执行者下拉（草稿态没起来）')
            } else {
              const stillOffered = chatSkillOpts().some(
                (o) => o.getAttribute('value') === `skill:${chatFixtures.orphan?.id}`,
              )
              const hint = text(d().querySelector('.detail-pane [data-skills-need-restart]'))
              if (stillOffered) {
                errors.push(
                  '旧 daemon（不认识 skillIds）上，"没人挂的 skill"仍然出现在下拉里——那一轮会静默地不带上它',
                )
              } else if (!hint.includes('chat-orphan-skill')) {
                errors.push(
                  `旧 daemon 上少了一个选项，但页面上没说原因（量到的提示是「${hint}」）`,
                )
              } else if (!chatSkillOpts().some((o) => o.getAttribute('value') === 'skill:' + (chatFixtures.owned?.id ?? ''))) {
                errors.push('旧 daemon 上连"有主的 skill"都不见了——那本来不受影响（走"选它 = 选那个人"）')
              } else {
                out = true
              }
            }
          } finally {
            f.contentWindow.fetch = real
            await chatReloadIdentity()
          }
          return out
        })()


        /* ══════════════════════════════════════════════════════════════
         * 右栏底部那一栏「工作目录的文件」
         * ══════════════════════════════════════════════════════════════
         *
         * 任务详情右边那一栏与它是**同一个组件**，差别只在"问谁"：那边按某次执行
         * 的目录问，这边按某个对话的目录问。这里量的是**按对话问**这条新路走通了
         * 没有，以及那一栏最要紧的两件事有没有真的落到屏幕上：

        const chatFilesPanel = () => d().querySelector('.detail-pane [data-chat-files]')
        const chatFilesOpenIt = async () => {
          const panel = chatFilesPanel()
          if (!panel) return false
          const head = panel.querySelector('button[aria-expanded]')
          if (!head) return false
          if (head.getAttribute('aria-expanded') !== 'true') {
            click(head)
            await wait(300)
          }
          return true
        }
        const chatFilesRows = () =>
          [...(chatFilesPanel()?.querySelectorAll('li') ?? [])].map((li) => ({
            text: text(li),
            managed: li.querySelector('.managed') !== null,
          }))

        /**
         * 把夹具那条对话准备好，并打开它。

         *    skill 那几条）是在"左栏一个对话都没有"的前提下量的——播种时就建好
         *    的话，那一段会因为页面直接进了某个对话而全部变红（试过）。

         * 也没有依据去问"变了没有"。
         *
         * 所以：外壳 `no-cache`（每次核对）+ 带内容哈希的产物 `immutable`，
         * 并且**带 ETag 回来问时要回 304**（核对要便宜，否则每次刷新都重下 HTML）。
         */
        facts['web.shellNotCachedBlindly'] = await (async () => {
          const res = await f.contentWindow.fetch('/index.html')
          const cc = res.headers.get('cache-control') ?? ''
          const etag = res.headers.get('etag') ?? ''
          if (!/no-cache/.test(cc)) {
            errors.push(`外壳的 cache-control 不是 no-cache（实际「${cc}」）——浏览器会拿着旧外壳不放`)
            return false
          }
          if (etag === '') {
            errors.push('外壳没有 ETag：浏览器没法问"变了没有"，只能整份重下或者一直用旧的')
            return false
          }
          return true
        })()

        facts['web.hashedAssetImmutable'] = await (async () => {
          const html = await (await f.contentWindow.fetch('/index.html')).text()
          const m = /assets\/(index-[A-Za-z0-9_-]+\.js)/.exec(html)
          if (!m) {
            errors.push('外壳里找不到构建产物（界面没构建？）')
            return false
          }
          const res = await f.contentWindow.fetch(`/assets/${m[1]}`)
          const cc = res.headers.get('cache-control') ?? ''
          if (!/immutable/.test(cc) || !/max-age=\d{6,}/.test(cc)) {
            errors.push(`带内容哈希的产物应当是 immutable 长缓存（实际「${cc}」）`)
            return false
          }
          // 带 ETag 回来问 ⇒ 必须 304（核对便宜，否则每次刷新都重下）
          const etag = res.headers.get('etag')
          if (!etag) {
            errors.push('产物没有 ETag')
            return false
          }
          const again = await f.contentWindow.fetch(`/assets/${m[1]}`, {
            headers: { 'if-none-match': etag },
          })
          if (again.status !== 304) {
            errors.push(`带 If-None-Match 再问应当是 304，实际 ${again.status}`)
            return false
          }
          return true
        })()

         * ⚠️ 怎么量：探针的 daemon 没有真模型，页面上生不出真实的代码块，所以这里

         *    而那正是当初出错的地方——不是"照着想象量"。
         * ⚠️ 高度必须与行数相称：只看 `white-space` 会漏掉"换成 pre-wrap 之后仍然
         *    没有换行"之类的情况，而使用者看到的就是高度。

        facts['chat.codeBlockKeepsNewlines'] = (() => {

          const host = d().createElement('div')
          host.className = 'markdown'

          host.style.position = 'absolute'
          host.style.left = '-9999px'

          host.innerHTML = `<pre><code>${body}</code></pre>`
          d().body.appendChild(host)

            if (h < LINES * 12) {

        const fvBar = () => d().querySelector('.fv-bar')

        /**

         *
         * ⚠️ 不能直接 `d().querySelector('video[data-file-video]')` + 另一个
         *    `d().querySelector('.fv-bar')`：那是**两个独立的全局查询**，只要文档里
         *    同时有两个查看器（另一个文件、另一栏、上一份没关掉的），取到的就不是
         *    同一份东西——"视频居然有原文那一面"这种假红就是这么来的（这一条踩过）。
         *    正确的取法是**先拿到那份文件的对话框，再在它里面问**。
         */
        const fvDialogFor = (selector) => {
          const el = d().querySelector(selector)
          if (el === null) return null
          return el.closest('[role="dialog"]') ?? el.parentElement
        }
        /** 出假红时要能一眼看出"当时文档里有几个查看器"——不然只能靠猜。 */
        const fvScene = () =>
          `现场：dialog=${d().querySelectorAll('[role="dialog"]').length}` +
          ` fvBar=${d().querySelectorAll('.fv-bar').length}` +
          ` video=${d().querySelectorAll('video[data-file-video]').length}` +
          ` audio=${d().querySelectorAll('audio[data-file-audio]').length}` +
          ` hex=${d().querySelectorAll('pre[data-hex]').length}` +
          ` bars=[${[...d().querySelectorAll('.fv-bar')]
            .map((b) => JSON.stringify(text(b).slice(0, 40)))
            .join(', ')}]`

        const fvWaitPlayable = async (selector, timeoutMs = 4000) => {
          const el = d().querySelector(selector)
          if (el === null) return null
          const deadline = Date.now() + timeoutMs
          while (Date.now() < deadline) {
            // readyState >= 1 = HAVE_METADATA：浏览器解出了时长/尺寸。**这一条**
            // 才是"接口那一层通了"的证据（类型对、字节取得到、Range 能用）。
            if (el.readyState >= 1) return el
            if (el.error !== null) return el
            await wait(200)
          }
          return el
        }

        facts['chat.fileViewerVideoPlays'] = await (async () => {
          if (!(await chatOpenFixtureConversation())) return false
          if (!(await fvOpenFile('clip.webm'))) return false
          const el = await fvWaitPlayable('video[data-file-video]')
          if (el === null) {
            errors.push(`视频文件没有渲染成 <video>（还是被当二进制了？）${fvScene()}`)
            await fvClose()
            return false
          }
          // ★ 这一份文件自己的那个对话框（不是"文档里第一个 .fv-bar"）
          const dialog = fvDialogFor('video[data-file-video]')
          if (dialog === null) {
            errors.push(`找不到播放器所在的对话框——这一条量不到。${fvScene()}`)
            await fvClose()
            return false
          }
          const hex = dialog.querySelector('pre[data-hex]') !== null
          const rawText = dialog.querySelector('.fv-pre[data-raw-text]') !== null
          const bar = dialog.querySelector('.fv-bar')
          const rawFace = bar === null ? false : bar.querySelector('[data-face-raw]') !== null
          const controls = el.hasAttribute('controls')
          const src = el.getAttribute('src') ?? ''
          const ready = el.readyState
          const err = el.error === null ? '' : `（播放器报错 code=${el.error.code}）`
          const barText = bar === null ? '(没有标题栏)' : text(bar).slice(0, 60)
          // ⚠️ 现场必须在**关闭之前**抓：关掉之后对话框就没了，量到的是一堆 0
          const scene = fvScene()
          await fvClose()
          if (hex || rawText) {
            errors.push(
              `视频文件被当二进制/文本显示了——那正是使用者报的那个 bug。${fvScene()}`,
            )
            return false
          }
          if (rawFace) {
            errors.push(
              `视频不该有「原文」那一面（把几百 MB 拉回页面来 hex dump 是荒谬的）。` +
                `这个对话框的标题栏是「${barText}」。${scene}`,
            )
            return false
          }
          if (!controls) {
            errors.push('播放器没有 controls——使用者没法暂停/拖进度')
            return false
          }
          if (!src.includes('/file?path=')) {
            errors.push(`播放器的 src 不是那条文件路由（量到的是「${src}」）`)
            return false
          }
          if (ready < 1) {
            errors.push(`播放器没拿到元数据（readyState=${ready}${err}）——接口那一层没通`)
            return false
          }
          return true
        })()

        /**
         * ★★ 接口那一层：**Range ⇒ 206**，而且是那一段。
         *
         * 这是"能不能 seek"的判据。老路由不认 Range：回 200 整份，浏览器就只能从头
         * 顺序播，拖进度条会跳回开头——而"看一段视频却不能拖"等于没支持。
         */
        facts['chat.fileViewerVideoRange206'] = await (async () => {
          const conv = await fvFixtureConversation()
          if (!conv) {
            errors.push('找不到夹具对话——这一条量不到')
            return false
          }
          const url = `/api/conversations/${conv.id}/file?path=${encodeURIComponent('clip.webm')}`
          const head = await f.contentWindow.fetch(url, { headers: { Range: 'bytes=0-99' } })
          const status = head.status
          const cr = head.headers.get('content-range') ?? ''
          const ar = head.headers.get('accept-ranges') ?? ''
          const type = head.headers.get('content-type') ?? ''
          const buf = new Uint8Array(await head.arrayBuffer())
          if (status !== 206) {
            errors.push(`带 Range 的请求该回 206，实际 ${status}——不认 Range 就拖不动进度`)
            return false
          }
          if (!/^bytes 0-99\/\d+$/.test(cr)) {
            errors.push(`content-range 不对（量到的是「${cr}」）`)
            return false
          }
          if (buf.length !== 100) {
            errors.push(`只该发要的那 100 字节，实际 ${buf.length}`)
            return false
          }
          if (ar !== 'bytes') {
            errors.push(`没有 accept-ranges: bytes（量到的是「${ar}」）`)
            return false
          }
          if (!type.startsWith('video/')) {
            errors.push(`content-type 不是 video/*（量到的是「${type}」）——界面正是按它分类的`)
            return false
          }
          // ★ 再核一次"发出来的就是磁盘上那一段"：自己整份取回来比字节
          const whole = new Uint8Array(
            await (await f.contentWindow.fetch(url)).arrayBuffer(),
          )
          for (let i = 0; i < 100; i += 1) {
            if (buf[i] !== whole[i]) {
              errors.push('206 那一段与整份文件的前 100 字节对不上')
              return false
            }
          }
          return true
        })()

        /**
         * ★ 媒体响应**不能**带那条 sandbox 的 CSP。
         *
         * 那条 CSP 是给"agent 写的**文档**"用的；带上它，浏览器在新标签页里为媒体
         * 合成的那张文档自己会被 `default-src 'none'` 管住，视频直接放不出来。
         * 但 `nosniff` 必须还在——它才是"不会被当文档解析"的那道闸。
         */
        facts['chat.fileViewerMediaNoSandboxCsp'] = await (async () => {
          const conv = await fvFixtureConversation()
          if (!conv) return false
          const media = await f.contentWindow.fetch(
            `/api/conversations/${conv.id}/file?path=${encodeURIComponent('clip.webm')}`,
          )
          const csp = media.headers.get('content-security-policy')
          const nosniff = media.headers.get('x-content-type-options')
          const textRes = await f.contentWindow.fetch(
            `/api/conversations/${conv.id}/file?path=${encodeURIComponent('page.html')}`,
          )
          const textCsp = textRes.headers.get('content-security-policy') ?? ''
          await media.arrayBuffer()
          await textRes.text()
          if (csp !== null) {
            errors.push(`媒体响应带了 CSP（「${csp}」）——那会让视频在新标签页里放不出来`)
            return false
          }
          if (nosniff !== 'nosniff') {
            errors.push('媒体响应少了 nosniff——那才是"不许当文档解析"的那道闸')
            return false
          }
          if (!textCsp.includes('sandbox')) {
            errors.push('文本/HTML 那一档的 sandbox CSP 被顺手拿掉了（这条边界不该动）')
            return false
          }
          return true
        })()

        facts['chat.fileViewerAudioPlays'] = await (async () => {
          if (!(await fvOpenFile('tone.wav'))) return false
          const el = await fvWaitPlayable('audio[data-file-audio]')
          if (el === null) {
            errors.push(`音频文件没有渲染成 <audio>${fvScene()}`)
            await fvClose()
            return false
          }

          const hex = dialog !== null && dialog.querySelector('pre[data-hex]') !== null
          const ready = el.readyState
          await fvClose()
          if (hex) {
            errors.push('音频被当二进制显示了')
            return false
          }
          if (ready < 1) {
            errors.push(`音频没拿到元数据（readyState=${ready}）`)
            return false
          }
          return true
        })()

        facts['chat.fileViewerUnplayableSaysWhy'] = await (async () => {
          // 冒充 .mkv 的垃圾字节：一定解不出来 ⇒ 界面必须说一句人话，而不是留一口黑框
          if (!(await fvOpenFile('broken.mkv'))) return false
          const el = await fvWaitPlayable('video[data-file-video]')
          if (el === null) {
            errors.push('放不出来的媒体没有渲染成 <video>（还是被当二进制了）')
            await fvClose()
            return false
          }
          const dialog = fvDialogFor('video[data-file-video]')
          // 等 error 事件落到界面上
          const deadline = Date.now() + 4000
          while (
            Date.now() < deadline &&
            (dialog === null || dialog.querySelector('[data-media-failed]') === null)
          ) {
            await wait(200)
          }
          const note = text(dialog?.querySelector('[data-media-failed]'))
          const hex = dialog !== null && dialog.querySelector('pre[data-hex]') !== null
          await fvClose()
          if (hex) {
            errors.push('放不出来的媒体被退化成十六进制了——该说的是"浏览器放不了"')
            return false
          }
          if (!note.includes('浏览器')) {
            errors.push(`放不出来时没有说清是谁的事（量到的是「${note}」）`)
            return false
          }
          return true
        })()

        facts['chat.filesHiddenInDraft'] = await (async () => {
          // 草稿态：还没有对话，也就还没有目录 ⇒ 不画那一栏
          //
          // ⚠️ 2026-09 顶栏改版：「新对话」从**左栏头部**搬到了顶栏里、紧跟着页名（它是整页
          //    的主线动作，不是左栏的动作）。量点跟着搬，判据没变——仍然是
          //    "点它一下进入起草态"。
          const newBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
            text(b).trim().startsWith('新建对话'),
          )
          if (!newBtn) {
            errors.push('顶栏找不到「新对话」按钮——这一条量不到')
            return false
          }
          click(newBtn)
          await wait(500)
          const stillThere = chatFilesPanel() !== null
          if (stillThere) {
            errors.push('草稿态下那一栏还在——那时还没有对话，也就还没有目录')
          }

          // ★ 工作目录的设定在「新对话」界面（2026-10）：Agent 选择器**下面**就是
          //    目录输入框（可留空 = 平台自动分配）。用 DOM 位置判断"在下面"——
          //    "出现了"和"出现在对的地方"是两回事。
          //    必须在这里量：**进入草稿态后**顶栏的「新对话」按钮会消失
          //    （起草时再给一个"开始新事情"的按钮是自相矛盾），单独一条要
          //    再点一次就点不到了。
          facts['chat.draftWorkDirInput'] = need('草稿态的工作目录输入框', () => {
            const select = d().querySelector('.detail-pane #chat-agent')
            const input = d().querySelector('.detail-pane #chat-draft-workdir')
            if (!select || !input) return false
            return (select.compareDocumentPosition(input) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0
          })
          return !stillThere
        })()

        /**
         * ★ 旧 daemon：没有 `conversation-files` ⇒ 那一栏要**说明原因**，而不是
         * 让它去撞 404 再把失败画成骨架屏——任务页那边正是这么撞过一次，
         * 表现是"取不到"和"还在加载"长得一模一样。
         */
        facts['chat.filesUnsupportedOnOldDaemon'] = await (async () => {
          const real = f.contentWindow.fetch
          f.contentWindow.fetch = function (input, init) {
            const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
            if (!String(url).includes('/api/identity')) {
              return real.call(f.contentWindow, input, init)
            }
            return real.call(f.contentWindow, input, init).then(async (res) => {
              const body = await res.json().catch(() => null)
              if (!body) return res
              body.capabilities = (body.capabilities ?? []).filter(
                (c) => c !== 'conversation-files',
              )
              return new Response(JSON.stringify(body), {
                status: res.status,
                headers: { 'content-type': 'application/json' },
              })
            })
          }
          let out = false
          try {
            await chatReloadIdentity()
            if (!(await chatOpenFixtureConversation())) return false
            if (!(await chatFilesOpenIt())) return false
            const hint = text(chatFilesPanel()?.querySelector('[data-files-need-restart]'))
            if (!hint.includes('重启')) {
              errors.push(`旧 daemon 上那一栏没说明原因（量到的是「${hint}」）`)
              return false
            }
            out = chatFilesRows().length === 0
            if (!out) errors.push('旧 daemon 上那一栏不该真的去列文件')
          } finally {
            f.contentWindow.fetch = real
            await chatReloadIdentity()
          }
          return out
        })()

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 删除确认：平台自己的居中对话框 ══════════════
        //
        // ★ 使用者的原话：「点删除对话，弹出来系统提示框，改用平台框，放中间」。
        //   所以这里量两件事：① 弹的是**平台画的** `.modal`（不是浏览器
        //   `window.confirm`——headless 里那个不画任何东西，量不到 `.modal`
        //   就说明还在用系统框）；② 它**在中间**。
        //   ⚠️ 必须点「取消」收场：真按了确认会把这个夹具对话删掉，后面
        //      依赖它的断言全跟着红。
        facts['chat.deleteConfirmUsesModal'] = await (async () => {
          if (!(await chatOpenFixtureConversation())) return false
          const row = [...d().querySelectorAll('.list-pane .conv-row')].find((li) =>
            text(li).includes('探针：这一条对话'),
          )
          const del = row?.querySelector('.list-row-action')
          if (!del) {
            errors.push('夹具对话那一项上没有删除按钮')
            return false
          }
          click(del)
          await wait(400)
          const modal = d().querySelector('.modal')
          if (!modal) {
            errors.push('点了删除没有弹出平台自己的对话框（还是 window.confirm？）')
            return false
          }
          const r = modal.getBoundingClientRect()
          const winW = f.contentWindow.innerWidth
          const offset = Math.abs((r.left + r.right) / 2 - winW / 2)
          if (offset > 60) {
            errors.push(`确认框没在中间（偏离中线 ${Math.round(offset)}px）`)
          }
          // 「取消」收场：框要关掉，而且那条对话**还在**
          const cancel = [...modal.querySelectorAll('.modal-foot button')].find(
            (b) => text(b).trim() === '取消',
          )
          if (!cancel) {
            errors.push('确认框里没有「取消」')
            return false
          }
          click(cancel)
          await wait(300)
          const stillOpen = d().querySelector('.modal') !== null
          if (stillOpen) errors.push('点了「取消」确认框没关掉')
          const survived = [...d().querySelectorAll('.list-pane .conv-row')].some((li) =>
            text(li).includes('探针：这一条对话'),
          )
          if (!survived) errors.push('★ 点了「取消」却把对话删掉了')
          return !stillOpen && survived && offset <= 60
        })()

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 建任务那一栏：至少不崩 ══════════════
        // ⚠️ 2026-10（D58 第二步）：`#/new` 现在落到「任务」页并**在右栏里**开表单，

        //    ——"有内容"太松了：整页画着列表也能过长，而那时建任务这条路是断的。
        f.contentWindow.location.hash = '#/new'
        await wait(900)
        facts['new.hasContent'] = need('建任务那一栏真的画出来了', () => {
          const body = d().querySelector('.detail-pane .create-body')
          const form = d().querySelector('.detail-pane .create-body .newtask-form')
          const rows = d().querySelectorAll('.list-pane .task-row').length
          return !!body && !!form && rows > 0
        })

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 列表栏骨架（D61，D62 补智能体栏头带）══════════════
        //
        // 聊天 / 任务 / 智能体三页的列表栏共用同一套骨架：
        //   · 栏头带：三页都有一条 51px 的栏头带。只有"栏标题 ≠ 页名"才放**标题**
        //     （聊天「对话」——它的计数也跟在标题旁边）；任务与智能体放
        //     **计数 + 搜索**（不放标题——与页名重复）。D62 给智能体补了带子
        //     （D61 使用者反馈"变化不大，只有任务有点变化"）；D63 给聊天补了
        //     计数 + 搜索（使用者："聊天页也改和任务类似呀"）。
        //   · 搜索框永远进栏头右侧，不独行（任务列表模式从"独行怼在列表上方"改来）。
        //   · 行高同一档（`--list-row-min-h`），每页内部恒定，三页互相相差 ≤1px。
        //   · 删除/操作按钮同一位置（右缘内缩 `--sp-1`、垂直居中）。
        //
        // ⚠️ 必须放在**这一段**（最后）：聊天那组刻意"不造对话"量的是空态，只有
        //    聊天段自己的夹具对话（`chatEnsureFixtureConversation`）造出来之后，
        //    左栏才有行可量。放在它前面，聊天三条会全部"没量到"（实测踩过）。
        {
          const sk = {
            headH: {}, searchInHead: {}, rowH: {}, delInset: {}, titleInHead: {},
            title: {}, chip: {}, rowBox: {}, hover: {},
          }
          const skPages = [
            { key: 'chat', hash: '#/chat', rows: '.conv-row', titleSel: '.conv-title', chipSel: null },
            { key: 'tasks', hash: '#/tasks', rows: '.task-row', titleSel: '.task-title', chipSel: '.stage-tag' },
            { key: 'agents', hash: '#/agents', rows: '.agent-row', titleSel: '.agent-line strong', chipSel: '.badge' },
          ]
          for (const pg of skPages) {
            f.contentWindow.location.hash = pg.hash
            await until(() => f.contentWindow.location.hash === pg.hash, 40)
            const haveRows = await until(() => {
              if (d().querySelectorAll('.list-pane ' + pg.rows).length > 0) return true
              if (d().querySelector('.board')) {
                const listBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
                  b.textContent.trim().startsWith('列表'),
                )
                if (listBtn) { click(listBtn); return false }
              }
              return false
            }, 50)
            await wait(300)
            const lp = d().querySelector('.list-pane')
            const head = lp.querySelector(':scope > .pane-head')
            // 栏头与搜索**不依赖行**：就算这一页没有行（理论上不该有），也要量
            sk.headH[pg.key] = need(`列表栏头高度（${pg.key}）`, () =>
              head ? Math.round(head.getBoundingClientRect().height) : null)
            sk.searchInHead[pg.key] = need(`搜索框位置（${pg.key}）`, () => {
              const inHead = !!head?.querySelector('input')
              const inBody = !!lp.querySelector('.pane-body input')
              return { inHead, inBody }
            })
            // D64：三页栏头带里**都不许有标题**（聊天原来的「对话」按要求去掉）——
            // 栏头规则从"标题 ≠ 页名才放标题"实际落到"三页都不放"。
            sk.titleInHead[pg.key] = need(`栏头带无标题（${pg.key}）`, () =>
              !head?.querySelector('h2'))
            if (pg.key === 'tasks') {
              // D64 顺手修 D61 的漏：全局 `.list-head`（51px）曾漏到任务列表里的
              // 分组标题「需你处理 / 其余任务」上，把它们**固定**撑成 51px
              // （实测 sep0/sep1 都是 51px）。修掉之后是内容高度：单行那条
              // （其余任务）38px、双行那条（需要注意+长提示折行）59px。
              // D67：「需要注意」后面的解释句（"执行失败/被取消…"）按要求删了，
              // 两条都回到单行 ~38px。漏的特征是"全部 == 51"——用 **min** 抓它。
              sk.separatorHeights = need('任务分组标题是内容高度', () => {
                const seps = [...lp.querySelectorAll('.pane-body .list-head')]
                if (seps.length === 0) return { min: 0, max: 0 }
                const hs = seps.map((x) => Math.round(x.getBoundingClientRect().height))
                return { min: Math.min(...hs), max: Math.max(...hs) }
              })
              // D67：删掉的解释句要**钉住"没有"**（谁把它加回来就红）——
              // 判据：第一条分组标题（需要注意）的文本里不许再出现它。
              sk.separatorNoHint = need('「需要注意」分组不带解释', () => {
                const seps = [...lp.querySelectorAll('.pane-body .list-head')]
                const t = seps.length > 0 ? text(seps[0]) ?? '' : ''
                return !t.includes('执行失败') && !t.includes('——')
              })
            }
            if (!haveRows) {
              sk.rowH[pg.key] = null
              continue
            }
            const first = d().querySelector('.list-pane ' + pg.rows)
            sk.rowH[pg.key] = need(`列表行高（${pg.key}）`, () =>
              first ? Math.round(first.getBoundingClientRect().height) : null)
            // ── 行内细节（D65）：标题 / 徽标 / 行容器 / hover 三页统一 ──
            sk.title[pg.key] = need(`行内标题（${pg.key}）`, () => {
              const t = first?.querySelector(pg.titleSel)
              if (!t) return null
              const c = getComputedStyle(t)
              return { fs: Math.round(parseFloat(c.fontSize) * 10) / 10, w: Number(c.fontWeight) }
            })
            if (pg.chipSel) {
              sk.chip[pg.key] = need(`徽标形状（${pg.key}）`, () => {
                const b = first?.querySelector(pg.chipSel)
                return b ? getComputedStyle(b).borderRadius : null
              })
            }
            sk.rowBox[pg.key] = need(`行容器（${pg.key}）`, () => {
              const c = first ? getComputedStyle(first) : null
              return c ? { align: c.alignItems, gap: c.gap } : null
            })
            sk.hover[pg.key] = need(`行 hover 底色（${pg.key}）`, () => {
              // D66：三页行 hover 统一在标准控件 ListRow 的 `.list-row:hover` 里
              // （scoped 选择器形如 `.list-row.svelte-xxx:hover`，`:hover` 在 hash 后面）。
              for (const sheet of [...d().styleSheets]) {
                try {
                  for (const rule of [...sheet.cssRules]) {
                    const st = rule.selectorText ?? ''
                    if (/\.list-row(?:\.|:)/.test(st) && st.includes(':hover')) {
                      const bg = rule.style.background || rule.style.backgroundColor
                      if (bg) return bg
                    }
                  }
                } catch {}
              }
              return null
            })
            if (pg.key === 'chat' || pg.key === 'tasks') {
              sk.delInset[pg.key] = need(`操作按钮位置（${pg.key}）`, () => {
                const li = first
                const btn = li?.querySelectorAll('button')[1]
                if (!li || !btn) return null
                const lr = li.getBoundingClientRect()
                const br = btn.getBoundingClientRect()
                return {
                  inset: Math.round((lr.right - br.right) * 10) / 10,
                  centerDelta:
                    Math.round(Math.abs(br.top + br.height / 2 - (lr.top + lr.height / 2)) * 10) / 10,
                }
              })
            }
          }
          Object.assign(facts, {
            'skeleton.headH': sk.headH,
            'skeleton.searchInHead': sk.searchInHead,
            'skeleton.rowH': sk.rowH,
            'skeleton.delInset': sk.delInset,
            'skeleton.headsTitleless': sk.titleInHead,
            'skeleton.separatorHeights': sk.separatorHeights,
            'skeleton.separatorNoHint': sk.separatorNoHint,
            'rowdetail.title': sk.title,
            'rowdetail.chip': sk.chip,
            'rowdetail.rowBox': sk.rowBox,
            'rowdetail.hover': sk.hover,
          })
        }

        publish(true)
      }

      main().catch((e) => {
        errors.push('探针自身异常：' + (e && e.stack ? e.stack : String(e)))
        publish(true)
      })
    </script>
  </body>
</html>
