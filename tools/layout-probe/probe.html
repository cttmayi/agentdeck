          const readAgent = async () =>
            await f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then((j) =>
                (j?.agents ?? []).find((a) => a.name.startsWith('探针用的内联老标准审核者')) ?? null,
              )
              .catch(() => null)
          const beforeAgent = await readAgent()
          const identityFrom = (a) =>
            [(a?.instructions ?? '').trim(), (a?.reviewStandard?.body ?? '').trim()]
              .filter((x) => x !== '')
              .join('\n\n')
          facts['fold.identityBefore'] = beforeAgent ? identityFrom(beforeAgent) : null
          // ★ 前提：此刻确实是"老形态"——编辑态那句提示在（`[data-legacy-standard]`
          //   只在有老字段时渲染）。原来它在查看态，现在在卡片里。
          facts['fold.noticeBefore'] = !!d().querySelector('.card.agent-card [data-legacy-standard]')
          // ★ 那句提示必须**提前说清保存会发生什么**（"我的指令怎么多了一段"不该
          //   是一次没预告的改动）。
          facts['fold.editHintWarns'] = (
            text(d().querySelector('.card.agent-card [data-legacy-standard]')) ?? ''
          ).includes('并进')
          // 改个**别的字段**（名字）：这正是"我什么都没配、保存一下提示该没了"的场景，
          // 而且指令不动 ⇒ 前后身份必须逐字节相同，断言最干净
          const nameBox = d().querySelector('#agent-name')
          if (nameBox) {
            nameBox.value = '探针用的内联老标准审核者（改过）'
            nameBox.dispatchEvent(new Event('input', { bubbles: true }))
            await wait(150)
          }
          const saveBtn = [...d().querySelectorAll('.card.agent-card ~ .form-actions button')].find(
            (b) => text(b) === '保存',
          ) ?? [...d().querySelectorAll('.form-actions button')].find((b) => text(b) === '保存')
          facts['fold.saveButtonFound'] = !!saveBtn
          if (saveBtn) {
            click(saveBtn)
            // ⚠️ 等的是**那句老提示消失**（保存成功的可见后果），不是固定 sleep，
            //    也不是"退出编辑态"——现在没有第二个态可退。
            facts['fold.noticeCleared'] = await until(
              () => !d().querySelector('.card.agent-card [data-legacy-standard]'),
              80,
            )
            await wait(300)
            const afterAgent = await readAgent()
            // ⚠️ 三态：'no-agent'（接口没读到）不许与"清掉了"混成同一个值——
            //    `afterAgent && ...` 写法的表现是"读不到 ⇒ 断言通过"，那是空过。
            facts['fold.reviewStandardAfter'] =
              afterAgent === null ? 'no-agent' : afterAgent.reviewStandard ? 'still-there' : null
            facts['fold.instructionsGotBody'] = !!(
              afterAgent && (afterAgent.instructions ?? '').includes('只看证据。')
            )
            facts['fold.identityUnchanged'] =
              beforeAgent && afterAgent
                ? identityFrom(afterAgent) === identityFrom(beforeAgent)
                : null
            facts['fold.identityAfter'] = afterAgent ? identityFrom(afterAgent) : null
            // 界面上：老提示没了……
            facts['fold.noticeAfter'] = !!d().querySelector('.card.agent-card [data-legacy-standard]')
            // ⚠️⚠️ **真缺陷（探针在这里量到了它）**：保存之后**界面那一格并没有跟着
            //    变成合并后的文字**——卡片只在自己持有的草稿上，而草稿只在"换了人"
            //    （`agent.id` 变）时才作废，所以服务端刚并进去的那段正文，界面上看不见。
            //    这不是"显示不一致"那么轻：下面那条第二轮保存会把**判断依据丢一半**。
            // ⚠️ 诊断（保留：这几条量的是"界面上到底有几个卡片/几个指令框"，
            //    以及"那一格有没有在保存之后跟上服务端"——判别"改的是不是同一个元素"
            //    靠的就是它们，踩过一次"读数取到了另一个元素"的坑）
            facts['fold.cardCount'] = d().querySelectorAll('.card.agent-card').length
            facts['fold.instructionsElementCount'] =
              d().querySelectorAll('#agent-instructions').length
            const samples = []
            for (let i = 0; i < 3; i++) {
              samples.push({
                t: i,
                // ⚠️ 取**完整**文本（不截断）：这一族要判"界面那一格与接口那份逐字相同"，
                //    截断之后"后面那半截没跟上"就没人看着了。
                editor: String(d().querySelector('#agent-instructions')?.value ?? ''),
                api: String((await readAgent())?.instructions ?? ''),
              })
              await wait(400)
            }
            facts['fold.editorVsApiSamples'] = samples
            const editorText = String(d().querySelector('#agent-instructions')?.value ?? '')
            facts['fold.editorShowsMerged'] = editorText.includes('只看证据。')
            facts['fold.editorTextAfterSave'] = editorText.slice(0, 60)
            // ★ 真实使用者的下一步：**在「指令」那一格里再改一个字**再保存。
            //   ⚠️ 为什么量这一下：第一轮保存之后，服务端那份 `instructions` 已经是
            //     "指令 + 老正文"（并进来了），而**界面上那一格还是旧的指令**
            //     （见上一条）。使用者看不到那段正文，就会在旧文字上继续改——
            //     那一刻 `buildPatch()` 判成"指令变了"，把**不带正文**的那份写回去，
            //     而老字段已经被清空（`reviewStandard = null`）⇒ 那段判断依据
            //     **再也回不来**。这正是"保存一次顺手清理"最怕的后果，所以必须量。
            const box2 = d().querySelector('#agent-instructions')
            if (box2 && saveBtn) {
              box2.value = box2.value + '\n（探针在保存之后又改了一个字）'
              box2.dispatchEvent(new Event('input', { bubbles: true }))
              await wait(200)
              click(saveBtn)
              // 等接口上那段文字真的变了（不是等输入框——它在点保存前就是了）
              let after2 = null
              for (let i = 0; i < 40; i++) {
                const a = await readAgent()
                if (a && (a.instructions ?? '').includes('探针在保存之后又改了一个字')) {
                  after2 = a
                  break
                }
                await wait(150)
              }
              facts['fold.editAfterSaveLanded'] = after2 !== null
              // ★ 真正要守的不变量：**投递出去的那段文字里，那段判断依据还在**
              //   （它在 `instructions` 里还是在老字段里，是"住在哪"的问题；
              //   住哪儿都不许丢——这是 `identityFrom` 存在的理由）。
              facts['fold.editAfterSaveKeepsCriteria'] = !!(
                after2 && identityFrom(after2).includes('只看证据。')
              )
              // ⚠️ **真缺陷**：这一轮保存把**老字段写回来了**。原因：组件手里的草稿
              //   在保存成功后没有跟着服务端的结果走——`draft.reviewStandard` 还是
              //    那个老对象，而服务端已经把它清成 `null`，于是 `buildPatch()` 判成
              //    "老字段变了"、把它整份 PATCH 回去（界面上那条老提示也会重新出现，
              //    库里的形状在两版之间来回跳）。这一次**没有丢正文**纯属侥幸
              //    （正文被拆在两个字段里投递），但"保存把刚清掉的老字段又写回来"
              //    本身就是错的：清理老数据这件事会被界面自动撤销。
              facts['fold.editAfterSaveResurrectsLegacy'] = !!(
                after2 && after2.reviewStandard !== null
              )
              facts['fold.instructionsAfterEdit'] = after2 ? (after2.instructions ?? '') : null
              facts['fold.identityAfterEdit'] = after2 ? identityFrom(after2) : null
            }
          }
        } else {
          facts['fold.detailSwitched'] = false
          facts['fold.saveButtonFound'] = null
          errors.push('找不到"探针用的内联老标准审核者"那张卡片')
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 默认智能体（D36）══════════════
        //
        // 使用者要的是"每个智能体上一个默认按钮，设过之后新建任务默认选它"。
        // 两轮反馈之后的语义：**单选**（设了新的，原来那个自动让位；没有"取消默认"），
        // 而且开关要在卡片**里面**、不许溢出。
        f.contentWindow.location.hash = '#/agents'
        await until(() => d().querySelectorAll('.list-row-main').length > 0)
        await wait(400)

        const paneEl2 = d().querySelector('.pane')
        const paneBodyEl = d().querySelector('.pane-body')
        const rowBox = (el) => {
          if (!el) return null
          const r = el.getBoundingClientRect()
          return { x: r.x, y: r.y, w: r.width, h: r.height, right: r.right }
        }
        // ⚠️ 限定在**列表**里：详情页也有徽章（审核标准的名字），
        //    文档级的 querySelectorAll 会把两件事混成一件（踩过）
        const badge = () => d().querySelector('.agent-list .default-badge')
        const toggleBtns = () =>
          [...d().querySelectorAll('.default-toggle')].filter(Boolean)
        const cancelBtns = () =>
          [...d().querySelectorAll('.agent-row button')].filter((b) =>
            (b.textContent ?? '').includes('取消默认'),
          )

        // ⚠️ 第二个执行者是**夹具**（run.mjs 在启动 Chrome 之前造的，见那边的注释：
        //    不能在探针里造，虚拟时间会让"等界面刷新"看早）。
        facts['defaultAgent.executorCount'] = [...d().querySelectorAll('.agent-row')].filter(
          (row) => row.querySelector('.badge.in_progress'),
        ).length

        facts['defaultAgent.badgeCount'] = d().querySelectorAll('.agent-list .default-badge').length
        facts['defaultAgent.noCancelButton'] = cancelBtns().length === 0
        facts['defaultAgent.setButtonCount'] = toggleBtns().length
        facts['defaultAgent.noButtonOnReviewer'] = !(
          d()
            .querySelector('.agent-row .badge.in_review')
            ?.closest('.agent-row')
            ?.querySelector('button.default-toggle')
        )

        // ★ 布局：开关必须在卡片的边框**里面**，整行不许溢出栏宽
        const paneW = rowBox(paneEl2)
        const rowWithToggle = toggleBtns()[0]?.closest('.agent-row')
        facts['defaultAgent.rowFitsPane'] = !!(
          rowWithToggle &&
          paneW &&
          rowBox(rowWithToggle).right <= paneW.right + 1
        )
        facts['defaultAgent.switchInsideRow'] = !!(
          rowWithToggle &&
          toggleBtns()[0] &&
          rowBox(toggleBtns()[0]).right <= rowBox(rowWithToggle).right + 1
        )
        facts['defaultAgent.rowOverflowX'] = rowWithToggle
          ? rowWithToggle.scrollWidth - rowWithToggle.clientWidth
          : null
        facts['defaultAgent.paneBodyOverflowX'] = paneBodyEl
          ? paneBodyEl.scrollWidth - paneBodyEl.clientWidth
          : null

        const target = toggleBtns()[0]
        facts['defaultAgent.setButtonFound'] = !!target
        if (target) {
          const targetRow = target.closest('.agent-row')
          facts['defaultAgent.targetName'] = text(targetRow.querySelector('.list-row-main strong'))
          const previous = need('点之前谁是默认', () => text(badge().closest('.agent-row').querySelector('.list-row-main strong')))
          facts['defaultAgent.previousName'] = previous

          click(target)
          const marked = await until(
            () =>
              text(badge()?.closest('.agent-row')?.querySelector('.list-row-main strong')) ===
              facts['defaultAgent.targetName'],
          )
          facts['defaultAgent.badgeMovesToTarget'] = marked
          // ★ 单选：设完之后「默认」徽章**只有一个**，而且没有"取消默认"这种东西
          facts['defaultAgent.badgeStillExactlyOne'] =
            d().querySelectorAll('.agent-list .default-badge').length === 1
          facts['defaultAgent.noCancelAfterSet'] = cancelBtns().length === 0
          facts['defaultAgent.targetHasNoToggle'] = !targetRow.querySelector('.default-toggle')

          // ★ 端到端：建任务那一栏里预选的就是它
          // ⚠️ 2026-10（D58 第二步）：表单住进「任务」页右栏之后，等的东西也变了——
          //    要等**那一栏里的**表单画出来（原来等的是"页面上有 select"，而任务页
          //    的列表/看板上也有 select 之类的东西，等到的是谁并不确定）。
          f.contentWindow.location.hash = '#/tasks/new'
          const ntReady = await until(
            () => !!d().querySelector('.detail-pane .create-body .newtask-form select'),
            60,
          )
          await wait(500)
          // ⚠️ 限定在**那张表单**里找（原来是在整页的 select 里找第一个带「（默认）」的）。
          const lead = ntReady ? d().querySelector('.detail-pane .create-body .newtask-form') : null
          const select = lead
            ? [...lead.querySelectorAll('select')].find((sel) =>
                [...sel.options].some((o) => (o.textContent ?? '').includes('（默认）')),
              )
            : null
          facts['defaultAgent.optionMarked'] = !!select
          facts['defaultAgent.selectListsOnlyExecutors'] = need('选择器里的选项', () => {
            const sel = select ?? (lead ? lead.querySelector('select') : null)
            if (!sel) return null
            return [...sel.options].every((o) => !(o.textContent ?? '').includes('（审核）'))
          })
          facts['defaultAgent.preselected'] = need('建任务那一栏预选的 agent', () => {
            const sel = select ?? (lead ? lead.querySelector('select') : null)
            if (!sel) return null
            const chosen = sel.options[sel.selectedIndex]
            return chosen ? (chosen.textContent ?? '').replace('（默认）', '').trim() : null
          })
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 顶栏：页名 + 这一页的动作 + 与页面无关的那几个 ══════════════
        //
        // 三个页面各量一遍（任务 / 智能体 / 工具），每个页面问六件事：
        //   ① 顶栏左边写着**这一页的名字**，而且与侧栏那一项**是同一句话**
        //   ② 动作**只属于这一页**——上一页的按钮一个都不许留下
        //   ③ `⋯` 在宽屏下不出现（动作直接平铺）
        //   ④ 顶栏恒为一行、不横向溢出：它的高度被 `.shell` 的
        //      `calc(100vh - var(--topbar-h))` 用着，一旦换行整个布局就错位
        //   ⑤ ★ 动作**紧跟着页名**（靠左），而在最右边的是与页面无关的那几个
        //      （语言 / 通知 / 登录 / 设置）——"这一页 + 这一页能做什么"是一句话，
        //      隔着一千多像素就变成两件不相干的事了
        //   ⑥ ★ 顶栏里的按钮**一种尺寸**，而且**当前模式看得出来**
        //      （`.active` 曾经是死类名：界面上根本没有它的样式，于是「列表 / 看板」
        //      两个按钮长得一模一样，使用者看不出自己在哪一个模式里）
        //
        // ⚠️ 期望值是**逐页写死**的，不写成"数量 > 0"：这一段的全部意义就是
        //    "按钮跟着页换"，只数个数的话，五个页面全显示同一排按钮也能过。
        facts['topbar.pageName'] = {}
        facts['topbar.actions'] = {}
        facts['topbar.oneLine'] = {}
        facts['topbar.overflowPx'] = {}
        facts['topbar.moreHiddenWide'] = {}
        facts['topbar.actionsLeftOfTitleRight'] = {}
        facts['topbar.actionsAtSidebarEdge'] = {}
        facts['topbar.actionGapPx'] = {}
        facts['topbar.buttonHeights'] = {}
        facts['topbar.trackHeight'] = {}
        facts['topbar.activeModeVisible'] = {}
        for (const [tpHash, tpName, tpWant] of [
          // ★ 2026-10（D58）：主操作排在最前（它就是「新建任务」——侧栏那一项
          //   并进了这一页），顺序也钉住。
          ['#/tasks', '任务', ['新建任务', '列表', '看板', '刷新']],
          ['#/agents', '智能体', ['新建智能体', '设置', '刷新']],
          ['#/tools', '工具', ['安装工具', '刷新']],
        ]) {
          f.contentWindow.location.hash = tpHash
          // ⚠️ 等到**地址真的生效**再量：`hashchange` 晚一拍，而页名在"建任务"
          //    与"任务"两种状态下都是「任务」⇒ 只等页名会立刻通过，量到的却是
          //    上一页的状态（实测踩过：那边还在建任务，于是被标成"当前"的按钮有 2 个）。
          await until(() => f.contentWindow.location.hash === tpHash, 40)
          const tpHere = await until(() => text(d().querySelector('.page-name')) === tpName, 60)
          if (!tpHere) errors.push(`顶栏页名：切到 ${tpHash} 之后没等到「${tpName}」`)
          const tpBar = d().querySelector('.topbar')
          facts['topbar.pageName'][tpHash] = need(`顶栏页名（${tpHash}）`, () =>
            text(d().querySelector('.page-name')),
          )
          // ① 与侧栏那一项对齐：两处各写一份文案迟早会不一样，所以这里钉住"同一句话"
          facts[`topbar.sameAsSidebar${tpHash}`] = need(`侧栏选中项（${tpHash}）`, () => {
            const active = d().querySelector('.sidebar .nav-item.active .nav-title')
            return active ? text(active) : null
          })
          // ② 动作清单：顺序也要对（顺序就是按钮顺序）
          facts['topbar.actions'][tpHash] = [
            ...d().querySelectorAll('.topbar .page-actions button'),
          ].map((b) => text(b))
          if (JSON.stringify(facts['topbar.actions'][tpHash]) !== JSON.stringify(tpWant)) {
            errors.push(
              `顶栏动作（${tpHash}）：${JSON.stringify(facts['topbar.actions'][tpHash])} ≠ ${JSON.stringify(tpWant)}`,
            )
          }
          // ③ 宽屏不该出现 `⋯`
          facts['topbar.moreHiddenWide'][tpHash] = need(`⋯（${tpHash}）`, () => {
            const more = d().querySelector('.page-more')
            return more ? cs(more).display === 'none' : null
          })
          // ④ 一行 + 不溢出
          facts['topbar.oneLine'][tpHash] = need(`顶栏高度（${tpHash}）`, () => {
            const want =
              parseFloat(cs(d().documentElement).getPropertyValue('--topbar-h')) *
              parseFloat(cs(d().documentElement).fontSize)
            return (
              tpBar.clientHeight === tpBar.scrollHeight &&
              Math.round(tpBar.getBoundingClientRect().height) <= Math.round(want) + 1
            )
          })
          facts['topbar.overflowPx'][tpHash] = need(`顶栏溢出（${tpHash}）`, () =>
            Math.max(0, tpBar.scrollWidth - tpBar.clientWidth),
          )
          // ⑤ 动作的**左缘与侧栏右缘对齐**（= 与主区内容共一条竖线），全局那组在最右
          //
          // ⚠️ 动作区在窄屏是 `display: none`，那时它的矩形是**退化的 0×0**（在
          //    父元素左上角），量出来的"间距"会是一个负数而看着像布局错了。
          //    所以这里先问"它这一档宽度下在不在"，不在就不量这一条。
          const actsVisible = (() => {
            const el = d().querySelector('.page-actions')
            return !!el && cs(el).display !== 'none' && el.getBoundingClientRect().width > 0
          })()
          facts['topbar.actionGapPx'][tpHash] = !actsVisible
            ? null
            : need(`页名与动作的间距（${tpHash}）`, () => {
                const name = d().querySelector('.page-name')?.getBoundingClientRect()
                const acts = d().querySelector('.page-actions')?.getBoundingClientRect()
                if (!name || !acts) return null
                return Math.round(acts.left - name.right)
              })
          facts['topbar.actionsAtSidebarEdge'][tpHash] = !actsVisible
            ? null
            : need(`动作左缘与侧栏右缘（${tpHash}）`, () => {
                const acts = d().querySelector('.page-actions')?.getBoundingClientRect()
                const side = d().querySelector('.sidebar')?.getBoundingClientRect()
                if (!acts || !side) return null
                // 顶栏与 `.shell` 共用同一个 `grid-template-columns`，动作的左缘
                // **在结构上**就该等于侧栏的右缘；允许 1px 取整误差。
                // ⚠️ 页名长短不该影响它：这一条量的是"对齐"，不是"间距"。
                return Math.abs(acts.left - side.right) <= 1
              })
          facts['topbar.actionsLeftOfTitleRight'][tpHash] = !actsVisible
            ? null
            : need(`动作与全局那组的位置关系（${tpHash}）`, () => {
                const acts = d().querySelector('.page-actions')?.getBoundingClientRect()
                const glob = d().querySelector('.global-actions')?.getBoundingClientRect()
                const bar = tpBar.getBoundingClientRect()
                if (!acts || !glob) return null
                /**
                 * ⚠️ 不能写成"动作在左半边"：1440px 下动作到 300px 左右，条件太松。
                 *    真正要钉的是**两组的相对关系**：动作整段在全局那组左边，
                 *    而且动作的右缘离顶栏右缘还有一大截（它没被推到右边去）。
                 */
                return acts.right < glob.left && bar.right - acts.right > bar.width * 0.3
              })
          // ⑥ 两档尺寸（工具条里的格子 / 工具条外的常驻控件）+ 激活态看得出来
          //
          // ⚠️ 2026-10（D59）：这一排改成了**一条工具条**，所以"整条带子上只有一种
          //    按钮高度"这条老判据不再成立——工具条的**轨道**与常驻控件同高（30），
          //    轨道里的**格子**矮一档（24），那是嵌套关系。分开量两组，两组的内部
          //    都必须齐：一组不齐仍然是"加一个按钮就把这排弄歪"。
          facts['topbar.buttonHeights'][tpHash] = need(`顶栏按钮高度（${tpHash}）`, () => {
            // ⚠️ 按**矩形高度 > 0** 过滤，不能只看 `display`：父元素 `display: none`
            //    时子元素的 computed display 仍然是 `inline-flex`，它会带着一个
            //    0px 的矩形混进来（自查脚本第一次跑就被这个骗了，报"高度不齐 30/0"）。
            const h = (b) => Math.round(b.getBoundingClientRect().height)
            const cells = [...d().querySelectorAll('.topbar .page-actions button')]
              .filter((b) => b.getBoundingClientRect().height > 0)
              .map(h)
            const others = [...d().querySelectorAll('.topbar button')]
              .filter((b) => !b.closest('.page-actions') && b.getBoundingClientRect().height > 0)
              .map(h)
            return { cells: [...new Set(cells)], others: [...new Set(others)] }
          })
          // 轨道的高度：它要与常驻控件同高（"这一条带子上的节奏"）
          facts['topbar.trackHeight'][tpHash] = need(`工具条轨道高度（${tpHash}）`, () => {
            const el = d().querySelector('.topbar .page-actions')
            return el ? Math.round(el.getBoundingClientRect().height) : null
          })
          facts['topbar.activeModeVisible'][tpHash] = need(`当前模式的标记（${tpHash}）`, () => {
            const btns = [...d().querySelectorAll('.topbar .page-actions button')]
            const on = btns.filter((b) => b.classList.contains('active'))
            /**
             * ⚠️ 只有任务页有"当前模式"这个概念（列表 / 看板）。另外两页一个
             *    `active` 都没有是**正常的**，不能算通过也不能算不通过——返回一个
             *    显式的"不适用"，`run.mjs` 那边按它放行。含糊地返回 true 会让这
             *    一条在多数页面上变成一句空话。
             */
            if (on.length === 0) return '不适用（这一页没有"当前模式"）'
            if (on.length !== 1) return `有 ${on.length} 个被标成当前`
            /**
             * ⚠️⚠️ 比对的**必须是同一种 kind 的旁边那一格**，不能是"随便找个没标
             *    active 的"：这一排里第一颗是**主操作**（强调色文字），拿它当基准的
             *    话，"当前那颗有没有底色"永远成立——实测踩过：我把 `.active` 的实心
             *    底整条删掉，这条检查**照样绿**（差异来自主操作那一颗的颜色）。
             *    同一 kind = 形状本该一样、只有状态不同，那才是要量的事。
             */
            const kindOf = (b) =>
              [...b.classList]
                .filter((c) => c !== 'active')
                .sort()
                .join(' ')
            const peer =
              btns.find((b) => !b.classList.contains('active') && kindOf(b) === kindOf(on[0])) ??
              btns.find((b) => !b.classList.contains('active'))
            if (!peer) return '所有按钮都被标成当前'
            const a = cs(on[0])
            const b = cs(peer)
            // 背景或文字色至少有一处不一样，否则"当前"是看不见的
            return a.backgroundColor !== b.backgroundColor || a.color !== b.color
          })
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 语言切换（D39）══════════════
        //
        // ⚠️ 这一段必须放在**最后**：前面所有检查都断言中文，切成英文会让它们全红。

        f.contentWindow.location.hash = '#/agents'
        await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
        await wait(300)
        {

          facts['lang.settingsLabel'] = need('顶栏「设置」按钮', () => {

             *    很可能是页面那个，于是这条就变成了"页面动作翻译了吗"，而它问的是

             *    ★ 2026-10：全局那组 2026-09 起是**图标按钮**（SVG，无文字），

            const b = [
              ...d().querySelectorAll('.topbar .global-actions button.icon-btn'),
            ].find((x) => (x.getAttribute('aria-label') ?? '') === 'Settings')
            return b ? 'Settings' : null

          // ★ 契约值**不翻译**：动作名、runtime key 这些仍然是机器值。

          //      审核者详情里的「行动权限」那一行，值仍然是原样的

          //      被当成文案翻掉）。
          //
          //   ⚠️ D41 把量点从 `comment.create` 换成了 `probe-tool.append-note`：

          //      在**同一个审核者**身上、走真实写入口刚勾上去的那个工具动作
          //      （见上面那条端到端）。所以这一条量的是一个**确实存在的契约值**，
          //      不是一条老数据里可能碰巧留着的字符串。
          //   ⚠️ 2026-09 三次改：勾了 append-note 的是 `探针用的老标准详情审核者`
          //      （[审核标准] 段在它身上走的真实保存），所以这里按名字选它，不再
          //      拿"第一个审核者"——首启那个审核员现在没有动作（判据纯文字）。
          f.contentWindow.location.hash = '#/agents'
          await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
          await wait(300)
          const reviewerRowEn = [...d().querySelectorAll('.agent-row')].find((row) =>
            (row.textContent ?? '').includes('探针用的老标准详情审核者'),

          if (reviewerRowEn) click(reviewerRowEn.querySelector('.list-row-main'))
          await until(() => !!d().querySelector('.card.agent-card'), 60)
          await wait(300)
          // 先记一个"详情真的渲染出来了"的基数（否则下面那条会空过）
          facts['lang.detailRowsInEn'] = d().querySelectorAll('.card.agent-card .cell').length
          facts['lang.contractValuesUntranslated'] = (() => {
            const detail = d().querySelector('.card.agent-card')
            if (!detail) return false
            const codes = [...detail.querySelectorAll('.field-row code')].map((c) => text(c))
            return codes.includes('probe-tool.append-note')
          })()

          // ── 阶段文案也跟着语言走（列头 / 短标签 / 行内提示） ──
          //   ★ 这一块是对"**推导层只给文案键**"的端到端验收：`stageOf` 返回的是
          //     `noteId`/`warningId`，列定义给的是 `titleId`/`hintId`，句子的中英
          //     两版都在词条表里。只要有一处还写着中文硬编码，这里就红。
          f.contentWindow.location.hash = '#/tasks'
          // ★ 先等**任务视图真的挂上**，再找「列表/看板」那对按钮。
          //   第一次跑就是漏了这一步：设完 hash 立刻找按钮，那时页面还是 Skills，
          //   于是"切回列表"没发生；而视图模式**存在 localStorage 里**（前面看板

          //
          //   ⚠️ 判据不能用 `.list-pane, .board`：**智能体页的左栏也叫 `.list-pane`**，

          //      「列表/看板」切换按钮等，才是"任务视图在不在"。
          await until(
            () =>
              [...d().querySelectorAll('button')].some((b) =>
                ['List', 'Board'].includes(b.textContent.trim()),

            60,

          const toListFirst = [...d().querySelectorAll('button')].find(

            // `h4` 里是「标题 + 计数 + 说明」三段，只取**标题**那一段：读整个 `h4`

            facts['lang.boardColumnsInEn'] = [...d().querySelectorAll('.column h4')].map((h) =>

            const backToList = [...d().querySelectorAll('button')].find(

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 新建任务：选谁 ⇒ 只读摘要 ⇒ 提交（2026-10 简化版）══════════════
        //
        // ⚠️ 2026-10 这一页**重做过**，原来那一大段（① 执行 / ② 审核 / ③ 行动 三步链 +
        //    ③ 里的左选右配选择器 + D44 固定参数编辑器 + D43 开关 + 三态「这一次」覆盖）

        //      · 动作选择器搬去了智能体组页的 ③ 行动（第三批量过），这一页不再有它。
        //    所以这一段的判据也换了：钉**现在**的契约，而不是留着 66 条红——红得久了，

        //
        // ⚠️ 位置：必须排在**语言切换那一段之后**（这一段量的是中文文案）与
        //    **D41 卸载工具那一段之前**（摘要里的"允许的动作"数要的是"工具包还装着"）。
        //
        // ⚠️ 夹具（组 + 执行者 + 两个审核者 + 一个动作名）由 `run.mjs` 造、经 URL 传进来：
        //    理由与前几段一样——探针**不许**靠"列表里的第一个"去找它们。

        //    显示的和发出去的请求体不是同一件事"，而那只有走完真入口、再从接口上把

        {
          const ntQuery = new URLSearchParams(location.search)
          const ntExecutorId = ntQuery.get('chainExecutor')
          const ntReviewerId = ntQuery.get('chainReviewer')
          const ntEmptyReviewerId = ntQuery.get('chainEmptyReviewer')
          const ntAction = ntQuery.get('chainAction')

          facts['newtask.fixtureExecutorId'] = ntExecutorId
          facts['newtask.fixtureReviewerId'] = ntReviewerId
          facts['newtask.fixtureEmptyReviewerId'] = ntEmptyReviewerId

          const ntApi = (p) => f.contentWindow.fetch(p).then((r) => r.json())

          const ntPickOptionByValue = (sel, value) => {

          const ntSourceBtn = (label) =>

          // ── 前提：这一档要**存在**（旧 daemon 不认 `groupId`，界面就不该给"组"这一档）
