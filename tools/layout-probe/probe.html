            const headerButtons = [...d().querySelectorAll('.detail-pane .pane-actions button')]
            const tidyIdx = headerButtons.findIndex((b) => text(b).includes('整理记忆'))
            const crystalIdx = headerButtons.findIndex((b) => text(b).includes('沉淀'))
            const tidyBtn = tidyIdx >= 0 ? headerButtons[tidyIdx] : null
            if (!tidyBtn) return { opened: false, reason: '对话头没有「整理成记忆」' }
            const leftOfCrystallize = tidyIdx >= 0 && crystalIdx >= 0 && tidyIdx < crystalIdx
            /**
             * ★ 分批第 264 批（使用者："这 3 个按钮的风格改成和『新建对话』『设置』一样的风格"）：
             *   对话头那排要和**顶栏那排工具条**同一种长相——量三件可比的：
             *   外框底色是不是同一条轨道（都带背景色、都圆角）、外框高度一样、里面每格高度一样。
             *   只量"有没有 class"是量不出"看起来一样"的。
             */
            const row = d().querySelector('.detail-pane .pane-actions')
            const topRow = d().querySelector('.topbar .page-actions')
            const rowStyle = row === null ? null : cs(row)
            const topStyle = topRow === null ? null : cs(topRow)
            const heights = headerButtons.map((b) => Math.round(b.getBoundingClientRect().height))
            const topHeights = topRow
              ? [...topRow.querySelectorAll('button')].map((b) =>
                  Math.round(b.getBoundingClientRect().height),
                )
              : []
            const toolbar = {
              rowPresent: row !== null,
              // 同一条轨道：底色不是透明的、圆角一样、高度一样（±1px 取整）
              sameTrack:
                rowStyle !== null &&
                topStyle !== null &&
                rowStyle.backgroundColor === topStyle.backgroundColor &&
                rowStyle.backgroundColor !== 'rgba(0, 0, 0, 0)' &&
                Math.abs(parseFloat(rowStyle.borderTopLeftRadius) - parseFloat(topStyle.borderTopLeftRadius)) <= 1,
              sameHeight:
                rowStyle !== null &&
                topStyle !== null &&
                Math.abs(
                  parseFloat(rowStyle.height) - parseFloat(topStyle.height),
                ) <= 1,
              // 里面每一格高度：那排自己一致，且与顶栏格子一致
              cellsSame:
                heights.length === 3 &&
                heights.every((h) => h === heights[0]) &&
                topHeights.length > 0 &&
                Math.abs(heights[0] - topHeights[0]) <= 1,
              heights,
              topHeights,
            }
            const memTotal = async () => {
              const list = await f.contentWindow
                .fetch('/api/agents')
                .then((r) => r.json())
                .catch(() => null)
              const items = Array.isArray(list?.agents) ? list.agents : []
              return items.reduce((n, a) => n + (typeof a.memoryCount === 'number' ? a.memoryCount : 0), 0)
            }
            const before = await memTotal()
            click(tidyBtn)
            const intro = await untilNet(() => !!d().querySelector('[data-tidy-intro]'), 40)
            const startBtn = d().querySelector('[data-tidy-start]')
            if (!intro || !startBtn) return { opened: false, reason: '对话框没有开场白与「开始分析」' }
            const introText = text(d().querySelector('[data-tidy-intro]')) ?? ''
            click(startBtn)
            const listed = await untilNet(() => !!d().querySelector('[data-tidy-list]'), 900)
            const rows = listed ? [...d().querySelectorAll('[data-tidy-list] .tidy-row')] : []
            const texts = rows.map((r) => r.querySelector('[data-tidy-text]')?.value ?? '')
            const editable = rows.length > 0 && rows.every((r) => {
              const el = r.querySelector('[data-tidy-text]')
              return el !== null && el.tagName === 'TEXTAREA'
            })
            const kinds = rows.length > 0 && rows.every((r) => r.querySelector('select') !== null)
            /**
             * ★ 分批第 244 批：**出处与"默认勾不勾"**（使用者："我只说了一句话，理论上就不该
             *   提取到记忆"）。假 CLI 吐三条：① 出处能在人的话里找到、② 找不到、③ 没给。
             *   量的是：每条都显示出处那一行，且只有①被默认勾上——②③ 要人亲手勾。
             */
            const fromLines = rows.map((r) => text(r.querySelector('[data-tidy-from]')) ?? '')
            const checkedBefore = rows.map(
              (r) => r.querySelector('[data-tidy-check]')?.checked === true,
            )
            const checkedCount = () =>
              [...d().querySelectorAll('[data-tidy-list] [data-tidy-check]')].filter(
                (el) => el.checked === true,
              ).length
            /**
             * ★ 分批第 246 批（使用者："位置很丑，选中框没有对齐，每一条的宽度也不一样，
             *   大多数都很短导致很多行"）：量**对齐**与**紧凑**，这两件事只有浏览器量得出来。
             *
             * 量的是三列的 x 与宽：勾选框左边缘、正文列左边缘/宽度、类型下拉的左边缘。
             * 只要有一行是"内容撑开的宽度"或"竖直居中"，这三个数组里就会出现不一致。
             */
            const rectOf = (el) => (el ? el.getBoundingClientRect() : null)
            const r1 = (n) => Math.round(n)
            const checkXs = rows.map((r) => {
              const b = rectOf(r.querySelector('[data-tidy-check]'))
              return b ? r1(b.left) : null
            })
            const textXs = rows.map((r) => {
              const b = rectOf(r.querySelector('[data-tidy-text]'))
              return b ? r1(b.left) : null
            })
            const textWs = rows.map((r) => {
              const b = rectOf(r.querySelector('[data-tidy-text]'))
              return b ? r1(b.width) : null
            })
            const selectLefts = rows.map((r) => {
              const b = rectOf(r.querySelector('select'))
              return b ? r1(b.left) : null
            })
            const rowHeights = rows.map((r) => r1(r.getBoundingClientRect().height))
            const listRect = rectOf(d().querySelector('[data-tidy-list]'))
            const allSame = (arr) => arr.length > 0 && arr.every((v) => v === arr[0])
            /**
             * 勾选框相对**它那一行文字首行**的偏移：每行都一样才算"对齐"。
             * （只比勾选框之间的 y 没意义——行高不同时 y 天生不同。）
             */
            const checkOffsets = rows.map((r) => {
              const box = rectOf(r.querySelector('[data-tidy-check]'))
              const txt = rectOf(r.querySelector('[data-tidy-text]'))
              return box && txt ? r1(box.top - txt.top) : null
            })
            const countBefore = checkedCount()
            const confirmBtn = d().querySelector('[data-tidy-confirm]')
            // 把②③也勾上，量"人亲手勾上之后确实能写进去"（决定权在人，只是默认不给）
            for (const r of rows) {
              const box = r.querySelector('[data-tidy-check]')
              if (box && box.checked !== true) click(box)
            }
            const countAfter = checkedCount()
            if (confirmBtn) click(confirmBtn)
            // 等写库完成：对话框那一片收起、对话末尾出现可撤销的回执
            await untilNet(() => !d().querySelector('[data-tidy-list]'), 200)
            /**
             * ⚠️ 这里的等待要比别处**宽**：点「记下」之后平台还要落库、写磁盘镜像
             *    （`MEMORY.md`）并 git 提交，那几件事加起来可能是几百毫秒；而
             *    `untilNet` 的第二个参数是**轮数**不是毫秒——给少了会"没等到"就判失败
             *    （实测正是这样：接口上记忆已经从 3 变 5，回执却被判成没有）。
             */
            const note = await untilNet(() => !!d().querySelector('[data-mem-note-tidy]'), 600)
            const noteText = note ? (text(d().querySelector('[data-mem-note-tidy]')) ?? '') : ''
            // 量产不到时，把现场记下来（不然"没有回执"这三个字没有下一步）
            const tail = note ? '' : (d().body?.textContent ?? '').replace(/\s+/g, ' ').slice(-260)
            const after = await memTotal()
            /**
             * ⚠️ **无论量到什么，最后都要把模态框关掉**。
             *
             * 第一版没有这一步：一旦候选没出现（假 CLI 那段当时是死代码），模态框就
             * 一直开着，遮罩盖住整个应用 ⇒ 后面几十条判据的点击全打在遮罩上，
             * 记出来的红与它们要测的东西毫无关系（实测一次 12 条）。
             * 清理放进 `finally`，失败的路径也走。
             */
            const closed = await (async () => {
              f.contentWindow.dispatchEvent(
                new f.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
              )
              return await untilNet(() => !d().querySelector('[data-tidy-list]'), 60)
            })()
            return {
              closed,
              opened: true,
              leftOfCrystallize,
              toolbar,
              intro: introText.includes('整段对话'),
              rows: rows.length,
              texts,
              editable,
              kinds,
              fromLines,
              checkedBefore,
              layout: {
                checkXs,
                textXs,
                textWs,
                selectLefts,
                rowHeights,
                listWidth: listRect ? r1(listRect.width) : 0,
                checksAligned: allSame(checkXs) && allSame(checkOffsets),
                textsAligned: allSame(textXs) && allSame(textWs),
                kindsAligned: allSame(selectLefts),
                oneLine: rowHeights.every((h) => h > 0 && h <= 64),
              },
              countBefore,
              countAfter,
              note,
              noteText,
              tail,
              before,
              after,
            }
          })()

          /**
           * ★ 分批第 245 批：**记忆关着时，聊天里不许出现「整理成记忆」**（使用者的要求：
           *   "如果没有被开启，就不应该有『整理成记忆的按钮』"）。
           *
           * 同时也量前缀 chip：记忆关着时打一句「记住：…」不该冒出"将记进它的记忆"。
           * 量完把开关打开并**回来重进一次页面**（后面还有判据要看这一页）。
           */
          facts['chat.memoryOffDisablesTidy'] = await (async () => {
            const list = await f.contentWindow.fetch('/api/conversations').then((r) => r.json())
            const convo = (list.items ?? []).find((c) => c.workDir === chatFilesWorkDir)
            if (!convo) return { ok: false, reason: '找不到夹具对话' }
            const patch = (on) =>
              f.contentWindow.fetch(`/api/agents/${convo.agentId}`, {
                method: 'PATCH',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ memoryEnabled: on }),
              })
            /** 按钮现在住在对话头那一排（`pane-actions`，沉淀技能左侧）。 */
            const headerBtns = () => [...d().querySelectorAll('.detail-pane .pane-actions button')]
            const hasTidy = () => headerBtns().some((b) => text(b).includes('整理记忆'))
            const before = hasTidy()
            const beforeBtn = headerBtns().find((b) => text(b).includes('整理记忆')) ?? null
            await patch(false)
            // 离开再回来：让这一页重新读 agents（`$agents` 里的 memoryEnabled 变了）
            f.contentWindow.location.hash = '#/tasks'
            await untilNet(() => !d().querySelector('[data-composer]'), 40)
            f.contentWindow.location.hash = '#/chat'
            await untilNet(() => !!d().querySelector('[data-composer]'), 60)
            if (!(await chatOpenFixtureConversation())) return { ok: false, reason: '打不开夹具对话' }
            await wait(400)
            const afterTidy = hasTidy()
            /**
             * ★ 分批第 263 批：记忆关着时这颗按钮**还在但置灰**，且 title 说清去哪儿打开。
             *   同时量"那一排还在"（沉淀技能那颗仍渲染）与"开着时不置灰"。
             */
            const afterBtn = headerBtns().find((b) => text(b).includes('整理记忆')) ?? null
            const afterDisabled = afterBtn === null ? null : afterBtn.disabled === true
            const afterTitle = afterBtn === null ? '' : (afterBtn.getAttribute('title') ?? '')
            const rowStillThere = headerBtns().some((b) => text(b).includes('沉淀'))
            // 前缀 chip：打一句触发词开头的话
            const composer = d().querySelector('[data-composer] .composer-input')
            let chipShown = false
            if (composer) {
              composer.value = '记住：这一句不该被记'
              composer.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }))
              chipShown = !!(await untilNet(() => !!d().querySelector('[data-mem-chip]'), 20))
              composer.value = ''
              composer.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }))
              await untilNet(() => !d().querySelector('[data-mem-chip]'), 20)
            }
            // 打开回来
            await patch(true)
            f.contentWindow.location.hash = '#/tasks'
            await untilNet(() => !d().querySelector('[data-composer]'), 40)
            f.contentWindow.location.hash = '#/chat'
            await untilNet(() => !!d().querySelector('[data-composer]'), 60)
            if (!(await chatOpenFixtureConversation())) return { ok: false, reason: '收尾时打不开夹具对话' }
            await wait(400)
            const restored = hasTidy()
            return {
              ok: true,
              before,
              beforeDisabled: beforeBtn === null ? null : beforeBtn.disabled === true,
              afterTidy,
              afterDisabled,
              afterTitle,
              rowStillThere,
              chipShown,
              restored,
            }
          })()

          facts['chat.settingsPrefixes'] = await (await (async () => {
            const openBtn = [...d().querySelectorAll('.topbar .page-actions button')].find(
              (b) => text(b).trim() === '设置',
            )
            if (!openBtn) return { present: false, reason: '聊天页顶栏没有「设置」' }
            click(openBtn)
            // ★ 295 批：设置在**主区面板**里（不再是右抽屉）
            const sec = (await untilNet(() => d().querySelector('[data-settings-panel] [data-memory-prefixes]'), 60))
              ? d().querySelector('[data-settings-panel] [data-memory-prefixes]')
              : null
            if (!sec) return { present: false, reason: '抽屉里没有记忆触发词那一节' }
            const words = () =>
              [...sec.querySelectorAll('[data-prefix-chips] .prefix-chip .mono')].map((n) => text(n))
            const before = words()
            const input = sec.querySelector('[data-prefix-input]')
            const addBtn = sec.querySelector('[data-prefix-add]')
            let added = false
            let inIdentity = false
            if (input && addBtn) {
              input.value = '探针词'
              input.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }))
              click(addBtn)
              added = await untilNet(() => words().includes('探针词'), 60)
              const identity = await f.contentWindow
                .fetch('/api/identity')
                .then((r) => r.json())
                .catch(() => null)
              inIdentity = Array.isArray(identity?.memoryPrefixes)
                ? identity.memoryPrefixes.includes('探针词')
                : false
              const chip = [...sec.querySelectorAll('[data-prefix-chips] .prefix-chip')].find((c) =>
                (text(c.querySelector('.mono')) ?? '').includes('探针词'),
              )
              const x = chip?.querySelector('[data-prefix-remove]')
              if (x) click(x)
              await untilNet(() => !words().includes('探针词'), 60)
            }
            /**
             * ★ 分批第 279 批：**语音那一节**也得在同一个抽屉里，而且每一档都要真的在
             *   下拉里（少了选项 = 那一档选不到 = "功能只在代码里"）。
             *
             * 探针这台 daemon 没有语音模型（临时数据目录），所以这里应该看到：
             *   · 状态行说"还没有语音模型…"（不是"可以用"）；
             *   · 一颗**「下载模型」**按钮（而不是"试录 3 秒"——没模型时那个按钮按了必失败）。
             */
            /**
             * ★ 分批第 280 批：词典那一节（两层矫正的可编辑面）。
             *   量"两层的编辑入口都在"：词 chips + 加词框、规则列表 + 加规则的两个框。
             *   ⚠️ 不量"真的加进去了"——那会改到探针 daemon 的临时词表，而下一条判据
             *   （`chat.voiceSettings`）读的是同一块地方；加词/删词的往返由
             *   `voice-api.test.ts` 的接口测试钉着。
             */
            const vocabSec = d().querySelector('[data-voice-vocab]')
            facts['chat.voiceVocab'] = (() => {
              if (vocabSec === null || vocabSec === undefined) return { present: false }
              return {
                present: true,
                termChips: vocabSec.querySelectorAll('[data-voice-term-chips] .prefix-chip').length,
                termInput: vocabSec.querySelector('[data-voice-term-input]') !== null,
                termAdd: vocabSec.querySelector('[data-voice-term-add]') !== null,
                rules: vocabSec.querySelectorAll('[data-voice-rules] .voice-rule').length,
                ruleFrom: vocabSec.querySelector('[data-voice-rule-from]') !== null,
                ruleTo: vocabSec.querySelector('[data-voice-rule-to]') !== null,
                ruleAdd: vocabSec.querySelector('[data-voice-rule-add]') !== null,
                labels: [...vocabSec.querySelectorAll('.voice-label')].map((n) =>
                  (text(n) ?? '').trim(),
                ),
              }
            })()

            const voiceSec = d().querySelector('[data-voice-settings]')
            const optionValues = (sel) =>
              sel === null ? null : [...sel.querySelectorAll('option')].map((o) => o.value)
            facts['chat.voiceSettings'] = (() => {
              if (voiceSec === null || voiceSec === undefined) return { present: false }
              const modelSel = voiceSec.querySelector('[data-voice-model]')
              const langSel = voiceSec.querySelector('[data-voice-language]')
              const sensSel = voiceSec.querySelector('[data-voice-sensitivity]')
              const status = (text(voiceSec.querySelector('[data-voice-status]')) ?? '').trim()
              const outputSel = voiceSec.querySelector('[data-voice-output]')
              return {
                present: true,
                models: optionValues(modelSel),
                languages: optionValues(langSel),
                sensitivities: optionValues(sensSel),
                // ★ 分批第 281 批：识别完之后走哪条路（只回填 / 先发一条消息）
                outputs: optionValues(outputSel),
                denoise: voiceSec.querySelector('[data-voice-denoise]') !== null,
                // ★ 286 批：用对话里的标识符辅助识别（默认开）
                useContext: voiceSec.querySelector('[data-voice-context]') !== null,
                useContextChecked:
                  voiceSec.querySelector('[data-voice-context]')?.checked === true,
                status,
                hasDownload: voiceSec.querySelector('[data-voice-download]') !== null,
                hasSelftest: voiceSec.querySelector('[data-voice-selftest]') !== null,
                path: (text(voiceSec.querySelector('.voice-path')) ?? '').trim(),
              }
            })()

            /**
             * ★ 295 批：关掉面板 = **点头部那颗返回**（主区面板不是浮层，Esc 不再关它）。
             *   留着会挡住后面判据量的聊天页——右栏此刻被设置换掉了。
             */
            const backFromSettings = d().querySelector('[data-settings-panel] [data-settings-back]')
            if (backFromSettings) click(backFromSettings)
            await untilNet(() => !d().querySelector('[data-memory-prefixes]'), 40)
            return { present: true, before, added, inIdentity }
          })())

          return !stillThere
        })()

        /**
         * ★ 旧 daemon：没有 `conversation-files` ⇒ 那一栏要**说明原因**，而不是
         * 让它去撞 404 再把失败画成骨架屏——任务页那边正是这么撞过一次，
         * 表现是"取不到"和"还在加载"长得一模一样。
         */
        facts['chat.filesUnsupportedOnOldDaemon'] = await (async () => {
          const real = f.contentWindow.fetch
          f.contentWindow.fetch = function (input, init) {
            const url = typeof input === 'string' ? input : input && input.url ? input.url : ''
            if (!String(url).includes('/api/identity')) {
              return real.call(f.contentWindow, input, init)
            }
            return real.call(f.contentWindow, input, init).then(async (res) => {
              const body = await res.json().catch(() => null)
              if (!body) return res
              body.capabilities = (body.capabilities ?? []).filter(
                (c) => c !== 'conversation-files',
              )
              return new Response(JSON.stringify(body), {
                status: res.status,
                headers: { 'content-type': 'application/json' },
              })
            })
          }
          let out = false
          try {
            await chatReloadIdentity()
            if (!(await chatOpenFixtureConversation())) return false
            if (!(await chatFilesOpenIt())) return false
            const hint = text(chatFilesPanel()?.querySelector('[data-files-need-restart]'))
            if (!hint.includes('重启')) {
              errors.push(`旧 daemon 上那一栏没说明原因（量到的是「${hint}」）`)
              return false
            }
            out = chatFilesRows().length === 0
            if (!out) errors.push('旧 daemon 上那一栏不该真的去列文件')
          } finally {
            f.contentWindow.fetch = real
            await chatReloadIdentity()
          }
          return out
        })()

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 删除确认：平台自己的居中对话框 ══════════════
        //
        // ★ 使用者的原话：「点删除对话，弹出来系统提示框，改用平台框，放中间」。
        //   所以这里量两件事：① 弹的是**平台画的** `.modal`（不是浏览器
        //   `window.confirm`——headless 里那个不画任何东西，量不到 `.modal`
        //   就说明还在用系统框）；② 它**在中间**。
        //   ⚠️ 必须点「取消」收场：真按了确认会把这个夹具对话删掉，后面
        //      依赖它的断言全跟着红。
        facts['chat.deleteConfirmUsesModal'] = await (async () => {
          if (!(await chatOpenFixtureConversation())) return false
          const row = [...d().querySelectorAll('.list-pane .conv-row')].find((li) =>
            text(li).includes('探针：这一条对话'),
          )
          const del = row?.querySelector('.list-row-action')
          if (!del) {
            errors.push('夹具对话那一项上没有删除按钮')
            return false
          }
          click(del)
          await wait(400)
          const modal = d().querySelector('.modal')
          if (!modal) {
            errors.push('点了删除没有弹出平台自己的对话框（还是 window.confirm？）')
            return false
          }
          const r = modal.getBoundingClientRect()
          const winW = f.contentWindow.innerWidth
          const offset = Math.abs((r.left + r.right) / 2 - winW / 2)
          if (offset > 60) {
            errors.push(`确认框没在中间（偏离中线 ${Math.round(offset)}px）`)
          }
          // 「取消」收场：框要关掉，而且那条对话**还在**
          const cancel = [...modal.querySelectorAll('.modal-foot button')].find(
            (b) => text(b).trim() === '取消',
          )
          if (!cancel) {
            errors.push('确认框里没有「取消」')
            return false
          }
          click(cancel)
          await wait(300)
          const stillOpen = d().querySelector('.modal') !== null
          if (stillOpen) errors.push('点了「取消」确认框没关掉')
          const survived = [...d().querySelectorAll('.list-pane .conv-row')].some((li) =>
            text(li).includes('探针：这一条对话'),
          )
          if (!survived) errors.push('★ 点了「取消」却把对话删掉了')
          return !stillOpen && survived && offset <= 60
        })()

        // ══════════════ 智能体生成者（D109）：按钮 + 审阅面板 ══════════════
        /**
         * ★ 2026-11：生成者流程的界面三件事。
         *   · 没有 agent-draft/agent-draft.md 的对话：按钮**不出现**（判据 = 条件出现，不置灰）；
         *   · 有 agent-draft/agent-draft.md 的对话：按钮出现（`hasAgentDraft`）；

         *
         * 夹具对话（上一段刚量完的那条）没有 agent-draft/ 目录（假 CLI 对普通聊天
         *  run 一律 `exit 127`，什么都不写）⇒ 先量"不出现"。生成者那条对话由假 CLI
         *  代办"写岗位卡"（prompt 带 `PROBE-MAKER-DRAFT` ⇒ 假 CLI 写
         *  `agent-draft/agent-draft.md` + `agent-draft/skill/meeting-notes-format/SKILL.md`，
         *  见 run.mjs）。
         */
        const makerButtons = () =>
          [...d().querySelectorAll('.pane-actions button')].filter((b) =>
            (text(b) ?? '').includes('确认生成智能体'),
          )
        const makerPanelParts = () => {
          const modal = d().querySelector('.modal')
          if (!modal) return null
          const hasName = [...modal.querySelectorAll('input')].some(
            (i) => (i.value ?? '') !== '',
          )
          /**
           * ⚠️ 2026-11（S4，D127）：**岗位卡不再有"角色"这一档**——角色退场之后
           *   生成的是一条普通智能体，面板上只剩「岗位名 + 指令」两段。
           *   `hasRole` 这一项留着但**恒为 false**，判据那边按"没有角色下拉"来判
           *  （见 run.mjs：`chat.agentMakerReviewPanel` 同时钉住"名/指令在"与"角色不在"）。
           */
          const hasRole = modal.querySelector('select') !== null
          const hasInstructions = [...modal.querySelectorAll('textarea')].length >= 1
          const hasSkillCard = (modal.textContent ?? '').includes('meeting-notes-format')
          const hasWarn = (modal.textContent ?? '').includes('未经验证')
          return { hasName, hasRole, hasInstructions, hasSkillCard, hasWarn }
        }

        facts['chat.agentMakerButtonHidden'] = await (async () => {
          if (!(await chatOpenFixtureConversation())) return false

        })()

        facts['chat.agentMakerButtonShows'] = await (async () => {
          // 走**真实用户路径**造生成者那条对话：新对话 → 选生成者 → 发送。
          // （接口 raw fetch 建出来的对话不会出现在左栏——聊天页那份列表 store
          //   只在空时拉一次，探针早踩过；而整页 reload 会把探针的虚拟时钟搞死，
          //   run.mjs 3513 行那段注释就是那次事故的教训。）
          const agents = (await f.contentWindow.fetch('/api/agents').then((r) => r.json())).agents ?? []
          // ⚠️ 2026-11（S4，D127）：判据从 `role === 'agent-maker'` 换成 `builtinKind`。

          //   `generic`（= 假 `agent-cli`）。探针 daemon 带 `--allow-builtin-edits`，

          const patchRes = await f.contentWindow.fetch(`/api/agents/${encodeURIComponent(maker.id)}`, {

          const newBtn = [...(d().querySelectorAll('.topbar .page-actions button') ?? [])].find(

          // ② 选「智能体生成者」

          input.dispatchEvent(new Event('input', { bubbles: true }))
          await wait(60)
          send.click()

          //    列表里出现生成者那条对话；hasAgentDraft 到位后按钮出现。
          const deadline = Date.now() + 12000
          for (;;) {
            if (makerButtons().length > 0) break
            if (Date.now() > deadline) {
              errors.push('生成者那条对话跑完也没等到「确认生成智能体」按钮（run 没到终态？）')
              return false
            }
            await wait(100)
          }
          // 按钮出现的同时，左栏应该已有生成者那条对话（refresh 拉过列表）
          const row = [...d().querySelectorAll('.list-pane .list-row-main')].find((b) =>
            (text(b) ?? '').includes('探针：生成者岗位'),
          )
          if (!row) {
            errors.push('左栏没有生成者那条对话（列表没刷新？）')
          }
          return true
        })()

        facts['chat.agentMakerPanelTwoParts'] = await (async () => {
          const btn = makerButtons()[0]
          if (!btn) {
            errors.push('没有「确认生成智能体」按钮可点')
            return false
          }
          click(btn)
          await wait(600)
          const parts = makerPanelParts()
          if (!parts) {
            errors.push('点了「确认生成智能体」没有弹出审阅面板')
            return false
          }
          // ⚠️ 2026-11（S4/D127）：角色那一档退场 ⇒ 现在要求 **hasName && hasInstructions
          //    && !hasRole**（还长出一个角色下拉就说明 S4 没删干净）。
          if (!parts.hasName || !parts.hasInstructions || parts.hasRole) {
            errors.push(`审阅面板的岗位卡部分不对（${JSON.stringify(parts)}）`)
          }
          if (!parts.hasSkillCard) {
            errors.push('审阅面板缺配套技能部分（meeting-notes-format 不在）')
          }
          if (!parts.hasWarn) {
            errors.push('配套技能部分缺"未经验证"提示（设计 §9.1，提示不是校验）')
          }
          const pass =
            parts.hasName && parts.hasInstructions && !parts.hasRole && parts.hasSkillCard && parts.hasWarn
          // 关掉面板收场（别让下一条量到开着面板的聊天页）
          const close = [...(d().querySelectorAll('.modal button') ?? [])].find(
            (b) => (text(b) ?? '').includes('关闭'),
          )
          if (close) click(close)
          await wait(300)
          return pass
        })()

        // ══════════════ 编排生成者（D135）：按钮 + 采纳面板 ══════════════
        /**
         * ★ 2026-11（D135）：与上面岗位卡那一节**同构**，判据换成编排三件事：
         *   ① 草稿写到 `workflow-draft/workflow-draft.md` 之后，栏头出现「确认采纳编排」
         *      （条件出现、不置灰——没草稿就没有按钮）；
         *   ② 点开是**可改**的面板：编排名 / 一句话说明 / **代码编辑器**（行号 + 着色）；
         *   ③ 点「采纳」真的落库：面板关掉，`/api/workflows` 里多出这一条（`source: ai`）。
         *
         * ⚠️ 假 CLI 那条分支会在正文里**故意**包一层 ```js 围栏（模型最常见的写法），
         *   所以 ② 能过就说明"解析时剥围栏"这条真的在后面起作用。
         */
        const wfMakerButtons = () =>
          [...d().querySelectorAll('.pane-actions button')].filter((b) =>
            (text(b) ?? '').includes('确认采纳编排'),

        facts['chat.workflowMakerButtonShows'] = await (async () => {
          const agents = (await f.contentWindow.fetch('/api/agents').then((r) => r.json())).agents ?? []
          const maker = agents.find((a) => a.slot === 'workflow-maker')
          if (!maker) {
            errors.push('找不到内置编排生成者（workflow-maker）')
            return false
          }
          // 与智能体生成者同一条：它内置的 runtimeKey 是 'default'（这台探针 daemon 上是
          // 真 claude）。要让它真跑一轮、把草稿写进工作目录，得先改挂 generic（= 假 agent-cli）。
          const patched = await f.contentWindow.fetch(
            `/api/agents/${encodeURIComponent(maker.id)}`,
            {
              method: 'PATCH',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ runtimeKey: 'generic' }),
            },

          if (!patched.ok) {
            errors.push(`把编排生成者改挂 generic 失败（HTTP ${patched.status}）——这条会空过`)
            return false
          }
          const newBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
            (text(b) ?? '').includes('新建对话'),
          )
          if (!newBtn) {
            errors.push('聊天页顶栏没有「新对话」——走不了编排生成者那条真实路径')
            return false

          click(newBtn)
          await wait(300)
          const sel = d().querySelector('#chat-agent')
          if (!sel) {
            errors.push('点了「新对话」没有出现执行者下拉')
            return false
          }
          const opt = [...sel.querySelectorAll('option')].find(
            (o) => o.getAttribute('value') === `agent:${maker.id}`,

          if (!opt) {
            errors.push('编排生成者不在新对话下拉里（它应该和智能体生成者一样能聊天）')

          sel.value = opt.getAttribute('value')
          sel.dispatchEvent(new Event('change', { bubbles: true }))
          await wait(250)
          const input = d().querySelector('.detail-pane [data-composer] .composer-input')
          const send = d().querySelector('.detail-pane [data-composer-send]')
          if (!input || !send) {

            return false
          }
          input.value = '探针：编排生成\nPROBE-WORKFLOW-DRAFT 帮我写个流水线'
          input.dispatchEvent(new Event('input', { bubbles: true }))
          await wait(60)
          send.click()
          const deadline = Date.now() + 12000
          for (;;) {
            if (wfMakerButtons().length > 0) break
            if (Date.now() > deadline) {
              errors.push('编排生成者跑完也没等到「确认采纳编排」按钮（run 没到终态？）')
              return false
            }
            await wait(100)
          }
          const row = [...d().querySelectorAll('.list-pane .list-row-main')].find((b) =>
            (text(b) ?? '').includes('探针：编排生成'),
          )
          if (!row) errors.push('左栏没有编排生成者那条对话（列表没刷新？）')
          return true
        })()

        facts['chat.workflowMakerPanel'] = await (async () => {
          const btn = wfMakerButtons()[0]
          if (!btn) {
            errors.push('没有「确认采纳编排」按钮可点')
            return null
          }
          click(btn)
          const opened = await until(() => !!d().querySelector('.modal .editor'), 60)
          if (!opened) {
            errors.push('点了「确认采纳编排」没有弹出采纳面板（或面板里没有代码编辑器）')
            return null
          }
          const modal = d().querySelector('.modal')
          const inputs = [...modal.querySelectorAll('input')].map((i) => i.value)
          const ed = modal.querySelector('.editor')
          const hl = ed.querySelector('.hl')
          const ta = ed.querySelector('textarea')
          return {
            编排名填好: inputs.includes('探针两段流水线'),
            说明填好: inputs.includes('先记账再复核（探针夹具）'),
            围栏已剥掉: !(ta.value ?? '').includes('```'),
            代码在: (ta.value ?? '').includes('flow('),
            行号: ed.querySelectorAll('.gutter span').length,
            原语着色: ed.querySelectorAll('.hl .tok-primitive').length,
            行高一致: hl && ta ? getComputedStyle(hl).lineHeight === getComputedStyle(ta).lineHeight : false,
          }
        })()

        facts['chat.workflowMakerAdopt'] = await (async () => {
          const modal = d().querySelector('.modal')
          if (!modal) return null
          const adopt = [...modal.querySelectorAll('button')].find(
            (b) => (text(b) ?? '').trim() === '确认采纳编排' && !b.disabled,
          )
          if (!adopt) {
            errors.push('采纳面板里没有可点的「确认采纳编排」主按钮')
            return null
          }
          click(adopt)
          const closed = await until(() => !d().querySelector('.modal .editor'), 80)
          const list = (await f.contentWindow.fetch('/api/workflows').then((r) => r.json())).items ?? []
          const created = list.find((w) => w.name === '探针两段流水线')
          if (!created) errors.push('采纳之后编排列表里没有这一条（写动作没落库？）')
          else if (created.source !== 'ai') {
            errors.push(`采纳出来的编排 source 应该是 ai，实际是 ${created.source}`)
          }
          return { 关掉面板: closed, 落库: !!created, 来源ai: created?.source === 'ai' }
        })()

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 建任务那一栏：至少不崩 ══════════════
        // ⚠️ 2026-10（D58 第二步）：`#/new` 现在落到「任务」页并**在右栏里**开表单，
        //    所以判据从"主区有内容"改成"右栏里那张表单真的画出来了 + 左边清单还在"
        //    ——"有内容"太松了：整页画着列表也能过长，而那时建任务这条路是断的。
        f.contentWindow.location.hash = '#/new'
        await wait(900)
        facts['new.hasContent'] = need('建任务那一栏真的画出来了', () => {
          const body = d().querySelector('.detail-pane .create-body')
          const form = d().querySelector('.detail-pane .create-body .newtask-form')
          const rows = d().querySelectorAll('.list-pane .task-row').length
          return !!body && !!form && rows > 0
        })

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 跨页"长得是不是同一套"（303 批）══════════════
        //
        // 语境：界面风格统一（298–302 批）把按钮/输入/徽标/字段收进了 `app.css` 的族里。
        // 但那只是"**代码里**只有一份定义"——同一个变体在**各页渲染出来**到底一不一样，
        // 类型检查看不见，静态护栏也看不见（护栏只读源码，量不出"聊天页主按钮 30px、
        // 任务页 31px"这种）。所以这里把三件最该一样的东西量出来，跨页比一遍：
        //   ① 同一种按钮变体（`btn--primary` 等）的高度与字号
        //   ② 徽标（`.badge`）的形状（圆角/字号/内距）
        //   ③ 列表行标题的字号
        // 顶栏那一排单独记一份：它是**按位置定尺寸**的上下文按钮（`--ctl-h-sm`），
        // 本来就比页面里的按钮矮，不参与"跨页比高度"，但要自己内部一致。
        {
          const stylePages = [
            { key: 'chat', hash: '#/chat' },
            { key: 'tasks', hash: '#/tasks' },
            { key: 'agents', hash: '#/agents' },
            { key: 'skills', hash: '#/skills' },
            // ⚠️ 2026-11：`#/tools`（工具页）与 `#/groups`（智能体组页）都随功能退场删了
            //    ⇒ 跨页风格样本换成**定时任务**与**关于**（同为"有列表/有按钮"的页）。
            { key: 'schedules', hash: '#/schedules' },
            { key: 'about', hash: '#/about' },
          ]
          const VARIANTS = ['btn--primary', 'btn--secondary', 'btn--ghost', 'btn--danger', 'btn--link']
          // 尺寸修饰也算进"哪一类按钮"里：`btn--ghost` 与 `btn--ghost btn--sm` 是
          // 两个不同的大小档，混在一个键里比字号只会得到"14 与 12 不一致"这种假红。
          const SIZES = { 'btn--sm': 'sm', 'btn--mini': 'mini', 'btn--tight': 'tight', 'btn--icon': 'icon' }
          const samples = {}
          for (const pg of stylePages) {
            f.contentWindow.location.hash = pg.hash
            await wait(900)
            samples[pg.key] = need(`风格样本（${pg.key}）`, () => {
              const btns = {}
              for (const b of d().querySelectorAll('button.btn, a.btn')) {
                const variant =
                  VARIANTS.find((c) => b.classList.contains(c)) ?? '(无变体)'
                const inTopbar = !!b.closest('.topbar')
                /**
                 * ★ D180：**栏脚那一行的按钮单独一档**（`@foot`）。
                 * `.foot-files` 自己把字号定在 `--fs-sm`（栏脚是紧凑带），按钮 `font: inherit`
                 * 就跟着是 13px；而页面里的同变体按钮是 14px —— 这是**语境**的差，
                 * 不是"同一类按钮被画成两种"。`@topbar` 早就用了同一种分档法。
                 */
                const inFoot = !!b.closest('.foot-files, .pane-foot')
                const size = Object.keys(SIZES).find((c) => b.classList.contains(c)) ?? ''
                const c = getComputedStyle(b)
                const key =
                  variant + (size === '' ? '' : '/' + SIZES[size]) + (inTopbar ? '@topbar' : '') + (inFoot && !inTopbar ? '@foot' : '')
                // 高度**按内容变**是正常的（只有图标的、带两行的），所以只比字号；
                // 高度照样记下来，报错时能一眼看出是哪一颗。
                const sample = `${Math.round(parseFloat(c.fontSize) * 10) / 10}（高 ${Math.round(b.getBoundingClientRect().height)}）`
                ;(btns[key] ??= []).push(sample)
              }
              /*
               * ⚠️ 2026-11（D142）：采样时**排除 `.stage-tag`**——它是 `.badge` 的一个
               *   变体（同一套配方，只把竖内距改成 0，免得把任务行撑高 2-3px，D61 定的）。
               *   它现在同时带 `.badge` 类，不排除的话这一条会拿"变体"去跟"基准"比内距。
               */
              const badge = d().querySelector('.badge:not(.stage-tag)')
              const bc = badge ? getComputedStyle(badge) : null
              const rowTitle = d().querySelector(
                '.list-pane .row-title, .list-pane .task-title, .list-pane .conv-title, .list-pane .agent-line strong',
              )
              return {
                btns,
                badge: bc
                  ? {
                      r: bc.borderRadius,
                      fs: bc.fontSize,
                      p: `${bc.paddingTop}/${bc.paddingRight}/${bc.paddingBottom}/${bc.paddingLeft}`,
                    }
                  : null,
                rowTitleFs: rowTitle ? getComputedStyle(rowTitle).fontSize : null,
              }
            })
          }
          // ⚠️ 一次性赋值（不是先 `facts[...] = {}` 再往里填）：`publish()` 是增量的，
          //    先放一个空对象会让**第一版快照**里这个键存在但没内容，判据当场红。
          facts['style.pageStyles'] = samples
        }

        // ══════════════ 列表栏骨架（D61，D62 补智能体栏头带）══════════════
        //
        // 聊天 / 任务 / 智能体三页的列表栏共用同一套骨架：
        //   · 栏头带：三页都有一条 51px 的栏头带。只有"栏标题 ≠ 页名"才放**标题**
        //     （聊天「对话」——它的计数也跟在标题旁边）；任务与智能体放
        //     **计数 + 搜索**（不放标题——与页名重复）。D62 给智能体补了带子
        //     （D61 使用者反馈"变化不大，只有任务有点变化"）；D63 给聊天补了
        //     计数 + 搜索（使用者："聊天页也改和任务类似呀"）。
        //   · 搜索框永远进栏头右侧，不独行（任务列表模式从"独行怼在列表上方"改来）。
        //   · 行高同一档（`--list-row-min-h`），每页内部恒定，三页互相相差 ≤1px。
        //   · 删除/操作按钮同一位置（右缘内缩 `--sp-1`、垂直居中）。
        //
        // ⚠️ 必须放在**这一段**（最后）：聊天那组刻意"不造对话"量的是空态，只有
        //    聊天段自己的夹具对话（`chatEnsureFixtureConversation`）造出来之后，
        //    左栏才有行可量。放在它前面，聊天三条会全部"没量到"（实测踩过）。
        {
          const sk = {
            headH: {}, searchInHead: {}, rowH: {}, delInset: {}, titleInHead: {},
            title: {}, chip: {}, rowBox: {}, hover: {}, listBox: {}, rowMetrics: {}, sub: {}, subBaseline: {},
          }
          /**
           * ★ 2026-11（D136）：采样页从 **3 页扩到 5 页**——加了定时任务与编排。
           *
           * ⚠️ 这是「编排列表风格不对」那次的根因：这一节的采样表是 D61–D66
           *   统一时存在的那三页，之后**新增的列表页从来没进过这张表**，于是
           *   "新页面是否与邻居一致"根本没有判据——新页面只有我为它**同时写的**
           *   自有判据（例如 `workflows.row` 量"两行结构/标题单行/行高≥64"，
           *   三条全过，而整行缩进 40px 它看不见）。自己写判据验证自己写的页面
           *   等于自证。往后**任何新增的列表页都必须先进这张表**。
           */
          const skPages = [
            { key: 'chat', hash: '#/chat', rows: '.conv-row', titleSel: '.conv-title', chipSel: null, subSel: '.conv-sub' },
            { key: 'tasks', hash: '#/tasks', rows: '.task-row', titleSel: '.task-title', chipSel: '.stage-tag', subSel: '.task-meta' },
            { key: 'agents', hash: '#/agents', rows: '.agent-row', titleSel: '.agent-line strong', chipSel: '.badge', subSel: '.agent-notes' },
            { key: 'schedules', hash: '#/schedules', rows: '.sched-row', titleSel: '.sched-title', chipSel: null, subSel: '.sched-sub' },
            { key: 'workflows', hash: '#/workflows', rows: '.wf-row', titleSel: '.wf-title', chipSel: '.badge', subSel: '.wf-sub' },
            // ★ 2026-11（D138）：「沉淀」也是列表页（ListPane + ListRow），原来**不在采样表里**
            //   ——它的行内容与另外五页不一致（标题字重 400、辅助信息大一号且字色更深）就是
            //   这么漏掉的。凡是"左列表右详情"的页面都必须在这张表里，否则它只有自证。
            { key: 'crystallize', hash: '#/crystallize', rows: '.crystal-row', titleSel: '.crystal-title', chipSel: '.badge', subSel: '.crystal-meta' },
          ]
          /*
           * ⚠️ 骨架/行内细节对比要求**每页都有行**。定时任务那一段的夹具是"量完就删"的，
           *   到这里列表已经空了——第一版没补，于是 `schedules` 的 rowH / listBox /
           *   title / rowBox 全是"没量到"，而"没量到"在判据里等于**假绿**（曾经就这么
           *   绿过：`workflows` 那一页缩进 40px、行距 0，五页对比里它根本不参与）。
           *   所以这里造一条，量完删掉。
           */
          const skSchedIds = []
          {
            const execId = new URLSearchParams(location.search).get('chainExecutor') ?? ''
            if (!execId) {
              errors.push('骨架对比：拿不到夹具执行者 id（schedules 那几页会没量到）')
            } else {
              // 两条：一条量行距（行距要两条紧邻的兄弟行才量得到），另一条当备份
              for (const name of ['探针骨架夹具一', '探针骨架夹具二']) {
                const res = await f.contentWindow.fetch('/api/schedules', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    name,
                    cron: '0 9 * * *',
                    executorType: 'agent',
                    executorId: execId,
                    taskText: 'x',
                  }),
                })
                if (res.status === 201) skSchedIds.push((await res.json()).id)
                else errors.push(`骨架对比：造定时任务夹具失败（HTTP ${res.status}）`)
              }
            }
          }

          for (const pg of skPages) {
            f.contentWindow.location.hash = pg.hash
            await until(() => f.contentWindow.location.hash === pg.hash, 40)
            const haveRows = await until(() => {
              if (d().querySelectorAll('.list-pane ' + pg.rows).length > 0) return true
              if (d().querySelector('.board')) {
                const listBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
                  b.textContent.trim().startsWith('列表'),
                )
                if (listBtn) { click(listBtn); return false }
              }
              return false
            }, 50)
            await wait(300)
            const lp = d().querySelector('.list-pane')
            const head = lp.querySelector(':scope > .pane-head')
            // 栏头与搜索**不依赖行**：就算这一页没有行（理论上不该有），也要量
            sk.headH[pg.key] = need(`列表栏头高度（${pg.key}）`, () =>
              head ? Math.round(head.getBoundingClientRect().height) : null)
            sk.searchInHead[pg.key] = need(`搜索框位置（${pg.key}）`, () => {
              const inHead = !!head?.querySelector('input')
              const inBody = !!lp.querySelector('.pane-body input')
              return { inHead, inBody }
            })
            // D64：三页栏头带里**都不许有标题**（聊天原来的「对话」按要求去掉）——
            // 栏头规则从"标题 ≠ 页名才放标题"实际落到"三页都不放"。
            sk.titleInHead[pg.key] = need(`栏头带无标题（${pg.key}）`, () =>
              !head?.querySelector('h2'))
            if (pg.key === 'tasks') {
              // D64 顺手修 D61 的漏：全局 `.list-head`（51px）曾漏到任务列表里的
              // 分组标题「需你处理 / 其余任务」上，把它们**固定**撑成 51px
              // （实测 sep0/sep1 都是 51px）。修掉之后是内容高度：单行那条
              // （其余任务）38px、双行那条（需要注意+长提示折行）59px。
              // D67：「需要注意」后面的解释句（"执行失败/被取消…"）按要求删了，
              // 两条都回到单行 ~38px。漏的特征是"全部 == 51"——用 **min** 抓它。
              // ★ 2026-11（使用者："平铺改一下，去掉之前的分类"）：「需要注意/
              //   其余任务」分段连同 `.list-head` 一起删了；分组标题现在是
              //   分组视图的 `.group-head`（组头）。同一意图换载体继续钉：
              //   组头也是内容高度（不许被全局固定高度带成一条死带）。
              sk.separatorHeights = need('任务分组标题是内容高度', () => {
                const seps = [...lp.querySelectorAll('.pane-body .list-group-head')]
                if (seps.length === 0) return { min: 0, max: 0 }
                const hs = seps.map((x) => Math.round(x.getBoundingClientRect().height))
                return { min: Math.min(...hs), max: Math.max(...hs) }
              })
              // D67：删掉的解释句要**钉住"没有"**（谁把它加回来就红）——
              // 判据：组头（分组标题）的文本里不许再出现它。
              sk.separatorNoHint = need('分组标题不带解释', () => {
                const seps = [...lp.querySelectorAll('.pane-body .list-group-head')]
                const t = seps.length > 0 ? text(seps[0]) ?? '' : ''
                return !t.includes('执行失败') && !t.includes('——')
              })
            }
            if (!haveRows) {
              sk.rowH[pg.key] = null
              continue
            }
            const first = d().querySelector('.list-pane ' + pg.rows)
            sk.rowH[pg.key] = need(`列表行高（${pg.key}）`, () =>
              first ? Math.round(first.getBoundingClientRect().height) : null)
            /*
             * ★ 2026-11（D136）：行高的**令牌**（`min-height`）与"页内是否恒定"。
             *
             * 为什么不能只比行高：`--list-row-min-h` 的注释写着"内容更高时跟随内容——
             * 统一的是这条底线，不是把内容压扁"。编排行的辅助信息里带一枚徽标，
             * 实际高度 67px（聊天 64 / 智能体 65），那是**内容差异**不是缺陷；
             * 而"令牌不一致"（比如某页把底线改成 56px）才是缺陷。所以拆成两条量：
             *   · 底线：每页 `min-height` 必须 = 64px（令牌一致）；
             *   · 恒定：同一页内任意两行高度差 ≤1px（列表是用来扫的，节奏不能抖）。
             */
            sk.rowMetrics[pg.key] = need(`行高令牌（${pg.key}）`, () => {
              const rows = [...d().querySelectorAll('.list-pane ' + pg.rows)]
              if (rows.length === 0) return null
              const hs = rows.map((r) => Math.round(r.getBoundingClientRect().height))
              return {
                minH: getComputedStyle(rows[0]).minHeight,
                spread: Math.max(...hs) - Math.min(...hs),
                /*
                 * ★ D231（诊断用，长期留着）：**每一行的高度与首行文字**。
                 *   只报 `spread` 的时候，"某一页差 32px"只能靠猜是哪一行——
                 *   这次就是靠它才看到"某条夹具的副行换行了"。多 60 字节，值。
                 */
                rows: rows.map((r, i) => ({
                  h: hs[i],
                  text: String(r.textContent ?? '').replace(/\s+/g, ' ').trim().slice(0, 60),
                })),
                n: hs.length,
              }
            })
            // ── 行内细节（D65）：标题 / 徽标 / 行容器 / hover 三页统一 ──
            sk.title[pg.key] = need(`行内标题（${pg.key}）`, () => {
              const t = first?.querySelector(pg.titleSel)
              if (!t) return null
              const c = getComputedStyle(t)
              return { fs: Math.round(parseFloat(c.fontSize) * 10) / 10, w: Number(c.fontWeight) }
            })
            if (pg.chipSel) {
              sk.chip[pg.key] = need(`徽标形状（${pg.key}）`, () => {
                const b = first?.querySelector(pg.chipSel)
                return b ? getComputedStyle(b).borderRadius : null
              })
            }
            /*
             * ★ 2026-11（D138）：**辅助信息那一行的字号与字色**。
             *   沉淀页原来这里比别的页大一号（`--fs-sm`）且没写字色（继承 `--text`）——
             *   而"标题字号/字重"那条量不到它。只在**容器自己声明**了这两项的三页量
             *   （定时任务 / 编排 / 沉淀）；另外三页把 `faint fs-xs` 写在元素或子元素上，
             *   容器级读数是继承值，不比。
             */
            if (pg.subSel) {
              sk.sub[pg.key] = need(`辅助行（${pg.key}）`, () => {
                const el = first?.querySelector(pg.subSel)
                if (!el) return null
                const c = getComputedStyle(el)
                return { fs: Math.round(parseFloat(c.fontSize) * 10) / 10, color: c.color }
              })
            }
            /*
             * ★ 2026-11（D142）：副行里**文字是否在同一基线上**。
             *
             * 这一行里常把文字与徽标混着放，徽标的盒子比文字高 —— `align-items: center`
             * 对齐的是**盒子**，于是"最近 15 小时前"比前面几段低 3px（实测）。
             * 现在统一 `.list-row-sub` 用 `align-items: baseline`。判据：副行内各段文字的
             * 顶边极差 ≤1px。
             */
            if (pg.subSel) {
              sk.subBaseline[pg.key] = need(`副行基线（${pg.key}）`, () => {
                const sub = first?.querySelector(pg.subSel)
                if (!sub) return null
                /*
                 * ⚠️ 只比**同字号**的几段：字号不同时，即使基线对齐，**顶边**也不一样
                 *    （11px 的阶段标签与 12px 的元信息天然差 ~1.9px）。第一版没滤字号，
                 *    任务页就一直红——那不是缺陷，是量法错了。
                 */
                const baseFs = getComputedStyle(sub).fontSize
                const tops = []
                const visit = (el) => {
                  for (const child of el.children) {
                    const own = [...child.childNodes]
                      .filter((n) => n.nodeType === 3 && (n.textContent ?? '').trim() !== '')
                      .map((n) => {
                        const r = document.createRange()
                        r.selectNodeContents(n)
                        return { top: r.getBoundingClientRect().top, fs: getComputedStyle(child).fontSize }
                      })
                    if (own.length > 0) tops.push(...own)
                    else visit(child)
                  }
                }
                visit(sub)
                const sameSize = tops.filter((x) => x.fs === baseFs)
                return {
                  alignItems: getComputedStyle(sub).alignItems,
                  n: sameSize.length,
                  // 同字号段不足两段 ⇒ 量不出极差（不是缺陷）
                  spread:
                    sameSize.length < 2
                      ? null
                      : Math.round(
                          (Math.max(...sameSize.map((x) => x.top)) -
                            Math.min(...sameSize.map((x) => x.top))) *
                            10,
                        ) / 10,
                }
              })
            }
            sk.rowBox[pg.key] = need(`行容器（${pg.key}）`, () => {
              const c = first ? getComputedStyle(first) : null
              return c ? { align: c.alignItems, gap: c.gap } : null
            })
            /*
             * ★★ 2026-11（D136）：**行容器 `ul` 自身**的三件事——这一条是"编排列表风格
             *   不对"那次的判据。以前量的是行（`.list-row`）里的东西，而行**被 ul 的
             *   默认内距整体推开**这件事不在任何判据里：
             *     · 缩进：`<ul>` 没重置 ⇒ 浏览器默认 `padding-left: 40px`，
             *       整列右移 40px、行宽少 40px（定时任务与编排各犯过一次）；
             *     · 行距：三个老页面是 `gap: var(--sp-1)`（4px），漏了就是 0；
             *     · 行左沿：以 `.pane-body` 的**内容左缘**为基准，行应当从 0 开始
             *       （pane 自己的内距不算——各页内距不同是合理的，缩进不是）。
             */
            sk.listBox[pg.key] = need(`行容器 ul（${pg.key}）`, () => {
              const ul = first?.closest('ul')
              if (!ul) return null
              const c = getComputedStyle(ul)
              const bodyEl = ul.closest('.pane-body') ?? ul.parentElement
              const bc = bodyEl ? getComputedStyle(bodyEl) : null
              const bodyContentLeft =
                bodyEl.getBoundingClientRect().left + parseFloat(bc?.paddingLeft ?? '0')
              const rows = [...ul.querySelectorAll(pg.rows)]
              // 行距只在"两条行是紧邻兄弟"时量（分组视图里中间会夹着组头，那样量不到）
              const gap =
                rows.length >= 2 && rows[0].nextElementSibling === rows[1]
                  ? Math.round(rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().bottom)
                  : null
              /*
               * ★ 2026-11（D141）：分段方式从"4px 空隙"改成"**行间一条 1px 的 `--line` 上边线**"
               *   ——空隙在静止状态（不 hover、不选中）什么也读不出来。这里量：
               *   `gap === 0`、第一行**没有**上边线、第二行有一条 `--line` 色的上边线。
               */
              const borderOf = (el) => {
                if (!el) return null
                const bc = getComputedStyle(el)
                return { w: bc.borderTopWidth, color: bc.borderTopColor }
              }
              const all = [...ul.querySelectorAll(pg.rows)]
              return {
                padLeft: c.paddingLeft,
                listStyle: c.listStyleType,
                gap,
                inset: Math.round(first.getBoundingClientRect().left - bodyContentLeft),
                firstRowTop: borderOf(all[0]),
                secondRowTop: borderOf(all[1]),
              }
            })
            sk.hover[pg.key] = need(`行 hover 底色（${pg.key}）`, () => {
              // D66：三页行 hover 统一在标准控件 ListRow 的 `.list-row:hover` 里
              // （scoped 选择器形如 `.list-row.svelte-xxx:hover`，`:hover` 在 hash 后面）。
              for (const sheet of [...d().styleSheets]) {
                try {
                  for (const rule of [...sheet.cssRules]) {
                    const st = rule.selectorText ?? ''
                    if (/\.list-row(?:\.|:)/.test(st) && st.includes(':hover')) {
                      const bg = rule.style.background || rule.style.backgroundColor
                      if (bg) return bg
                    }
                  }
                } catch {}
              }
              return null
            })
            if (pg.key === 'chat' || pg.key === 'tasks') {
              sk.delInset[pg.key] = need(`操作按钮位置（${pg.key}）`, () => {
                const li = first
                const btn = li?.querySelectorAll('button')[1]
                if (!li || !btn) return null
                const lr = li.getBoundingClientRect()
                const br = btn.getBoundingClientRect()
                return {
                  inset: Math.round((lr.right - br.right) * 10) / 10,
                  centerDelta:
                    Math.round(Math.abs(br.top + br.height / 2 - (lr.top + lr.height / 2)) * 10) / 10,
                }
              })
            }
          }
          for (const id of skSchedIds) {
            await f.contentWindow.fetch(`/api/schedules/${encodeURIComponent(id)}`, {
              method: 'DELETE',
            })
          }
          Object.assign(facts, {
            'skeleton.rowMetrics': sk.rowMetrics,
            'skeleton.headH': sk.headH,
            'skeleton.searchInHead': sk.searchInHead,
            'skeleton.rowH': sk.rowH,
            'skeleton.delInset': sk.delInset,
            'skeleton.headsTitleless': sk.titleInHead,
            'skeleton.separatorHeights': sk.separatorHeights,
            'skeleton.separatorNoHint': sk.separatorNoHint,
            'skeleton.listBox': sk.listBox,
            'skeleton.subRow': sk.sub,
            'skeleton.subBaseline': sk.subBaseline,
            'rowdetail.title': sk.title,
            'rowdetail.chip': sk.chip,
            'rowdetail.rowBox': sk.rowBox,
            'rowdetail.hover': sk.hover,
          })
        }

        /*
         * ══════════════ 列表分组：两页同一个组头（D137）══════════════
         *
         * 这一档原来**两页各写一套**（任务页是带边框卡片按钮、智能体页是淡字行，
         * 连 DOM 结构都不同）。现在组头是标准控件 `ListGroupHead` + `app.css` 的
         * `.list-group-head` 一族，所以这里量**等式**：
         *   · 两页组头同高（≤1px）、同字号、组名同字重（600）；
         *   · 都有 chevron（折叠字形），计数都在右侧；
         *   · 组间分隔线**只在第二组有**（第一组上方没有线——否则列表顶部会多一条悬空的）。
         * 折叠行为本身由各页自己的判据守着（`tasks.groupCollapseToggle` / `agents.listGroups`）。
         */
        {
          /** 按页面取"行标题"的类名（组头要跟它比字号与字色）。 */
          const pgTitleClass = (hash) =>
            hash === '#/tasks' ? 'task-title' : hash === '#/agents' ? 'agent-line' : null
          const measureGroups = async (hash) => {
            f.contentWindow.location.hash = hash
            await until(() => f.contentWindow.location.hash === hash, 40)
            await wait(400)
            const heads = [...d().querySelectorAll('.list-pane .list-group-head')]
            if (heads.length === 0) return null
            const first = heads[0]
            const second = heads[1] ?? null
            const c = getComputedStyle(first)
            const nameEl = first.querySelector('.list-group-name')
            const tail = first.querySelector('.list-group-tail')
            return {
              n: heads.length,
              h: Math.round(first.getBoundingClientRect().height),
              fs: Math.round(parseFloat(c.fontSize) * 10) / 10,
              nameWeight: nameEl ? getComputedStyle(nameEl).fontWeight : null,
              hasChevron: !!first.querySelector('.chevron'),
              glyph: (first.querySelector('.chevron')?.textContent ?? '').trim(),
              countRight:
                !!tail &&
                Math.round(tail.getBoundingClientRect().right) >=
                  Math.round(first.getBoundingClientRect().right) - 12,
              // ★ D140：组头与行的**可分辨性**（使用者两轮反馈：颜色太接近 / 头比内容还小）
              headBg: c.backgroundColor,
              nameFs: nameEl ? Math.round(parseFloat(getComputedStyle(nameEl).fontSize) * 10) / 10 : null,
              nameColor: nameEl ? getComputedStyle(nameEl).color : null,
              // 未选中的行（`.list-row.active` 是选中态，底色本来就不同——见 app.css 的注释）
              rowBg: (() => {
                const r = d().querySelector('.list-pane .list-row:not(.active)') ?? d().querySelector('.list-pane .list-row')
                return r ? getComputedStyle(r).backgroundColor : null
              })(),
              // 选中行的底色：组头**也不能**跟它同色，否则"选中的那一行"会被读成分组头
              activeRowBg: (() => {
                const r = d().querySelector('.list-pane .list-row.active')
                return r ? getComputedStyle(r).backgroundColor : null
              })(),
              rowTitleFs: (() => {
                const t = d().querySelector('.list-pane .list-row .' + (pgTitleClass(hash) ?? 'x'))
                return t ? Math.round(parseFloat(getComputedStyle(t).fontSize) * 10) / 10 : null
              })(),
              rowTitleColor: (() => {
                const t = d().querySelector('.list-pane .list-row .' + (pgTitleClass(hash) ?? 'x'))
                return t ? getComputedStyle(t).color : null
              })(),
              /* D140 第二轮：分割从"只有第二组有顶线"改成**每个组头下方一条线**
                 （两道线索：底色带 + 它下面那条线）。所以这里量三条：
                 · 第一组**上方**不许有线（列表顶部不该凭空多一条）；
                 · 每个组头下方必须是 1px；
                 · 第二组与上一组之间要留出空隙（不然"带子 + 线"贴着上一行，还是分不清）。 */
              borderTopFirst: getComputedStyle(first.closest('.list-group-head-wrap')).borderTopWidth,
              borderBottomFirst: getComputedStyle(first.closest('.list-group-head-wrap')).borderBottomWidth,
              borderBottomSecond: second
                ? getComputedStyle(second.closest('.list-group-head-wrap')).borderBottomWidth
                : null,
              gapBeforeSecond: second
                ? (() => {
                    // 第二组上方那条"上一组最后一行"的下沿；
                    // ⚠️ 上一组可能是**收起的**（智能体页「内置」默认收拢）⇒ 中间没有行，
                    //    这时量不到"组间距"，记 null（与"只有一组"同样是"没量到"，不是缺陷）
                    let el = second.closest('.list-group-head-wrap').previousElementSibling
                    while (el && !el.classList.contains('list-row')) el = el.previousElementSibling
                    return el
                      ? Math.round(second.getBoundingClientRect().top - el.getBoundingClientRect().bottom)
                      : null
                  })()
                : null,
            }
          }
          facts['skeleton.groupHead'] = {
            tasks: await measureGroups('#/tasks'),
            agents: await measureGroups('#/agents'),
          }
        }

        /**
         * ★ 分批第 237 批（使用者："我新入库的 SKILL，必须要重新刷新才可以看到，不合理"）：
         * **进「技能」页就该看到现在的真实样子**，不用先点「刷新」。
         *
         * 怎么量：应用**已经启动之后**（共享 store 早已载入）用接口新造一条技能——
         * 这模拟的就是"别处写进来"（沉淀入库、CLI 装的、别的工具写进技能目录）。
         * 然后切到 `#/skills`，**不点任何刷新**，看表格里有没有它。
         *
         * ⚠️ 服务端每次读都对账磁盘，所以这一条真正钉的是**页面有没有去读**（不是服务端）。
         *
         * ⚠️ **必须放在整支探针的最后**：它要把页面导航到「技能」页，而前面那些判据依赖
         *    "停在聊天页的草稿态"（第一版插在中间，9 条聊天判据当场全红——这正是它的价值）。
         */
        /**
         * ★ 分批第 239 批（使用者定："沉淀，确认入库后不删除，依然还可以继续反馈修改。
         *   并可以持续入库"）：**入库之后留在审阅屏**，只多一行「已入库」说明，
         *   「确认入库」还在（再点一次 = 更新同一份），「放弃」整页都没有。
         *
         * ⚠️ 这条**真的按一次入库**（会往探针那次性 daemon 的技能库里写一条），
         *   所以和上面那条一样放在整支探针的最后——前面那些判据不该被库里多出来的东西影响。
         */
        facts['crystal.committedStaysOnReview'] = await (async () => {
          // ⚠️ 这一段在 `cyEnter` / `cyQuery` 的作用域之外（它们在沉淀那一节里用 `const` 定义）
          //    ⇒ 这里自己从 URL 取夹具 id、自己走一遍"切走 → 进来 → 等审阅态"。
          const draftId = new URLSearchParams(location.search).get('crystalDraft')
          if (!draftId) {
            errors.push('没有起草夹具 id（这一条量不到）')
            return null
          }
          f.contentWindow.location.hash = '#/tasks'
          await untilNet(() => !d().querySelector('[data-review-actions]'), 40)
          f.contentWindow.location.hash = `#/crystallize/${draftId}`
          const entered = await untilNet(() => !!d().querySelector('[data-review-actions]'), 120)
          if (!entered) {
            errors.push('没进到审阅态（这一条量不到）')
            return null
          }
          const commitBtn = d().querySelector('[data-review-commit]')
          if (!commitBtn) {
            errors.push('审阅态没有「确认入库」按钮')
            return null
          }
          click(commitBtn)
          const dialog = await untilNet(() => !!d().querySelector('[role="dialog"]'), 40)
          if (!dialog) {
            errors.push('点「确认入库」没弹确认框')
            return null
          }
          const confirm = [...d().querySelectorAll('[role="dialog"] button')].find((b) =>
            /^(确认|入库)/.test(text(b).trim()) && !text(b).includes('取消'),
          )
          if (!confirm) {
            errors.push('确认框里找不到"确认"那一颗')
            return null
          }
          click(confirm)
          /**
           * 入库是异步的：打接口 → 落 skills-mine → git 提交。所以先等**确认框关掉**
           * （提交成功才会关），再等那一行说明。
           * ⚠️ `untilNet` 每一轮只是一次真实往返，120 轮在本地不到一秒——而 git 提交
           *   比它慢，第一版就是这么量到"还在保存中"的。这里给足 400 轮。
           */
          await untilNet(() => !d().querySelector('[role="dialog"]'), 400)
          const noted = await untilNet(() => !!d().querySelector('[data-committed-note]'), 200)
          const diag = {
            dialogStillOpen: !!d().querySelector('[role="dialog"]'),
            errorText: (text(d().querySelector('.crystal-flow .notice.bad')) ?? '').slice(0, 120),
            confirmLabel: text(confirm).trim(),
          }
          const stillReview = !!d().querySelector('[data-review-actions]')
          const stillCommit = !!d().querySelector('[data-review-commit]')
          const note = text(d().querySelector('[data-committed-note]')) ?? ''
          const noAbandon = ![...d().querySelectorAll('button')].some(
            (b) => text(b).trim() === '放弃',
          )
          if (!noted) errors.push('入库成功之后没有出现「已入库」那一行说明')
          if (!stillReview) errors.push('入库之后离开了审阅屏（应该留在原地继续改）')
          if (!stillCommit) errors.push('入库之后「确认入库」没了（还应该能再入库一次）')
          if (!noAbandon) errors.push('入库之后页面上又出现了「放弃」')
          return { noted, stillReview, stillCommit, noAbandon, note: note.slice(0, 40), diag }
        })()

        facts['skills.reloadsOnEnter'] = await (async () => {
          const lateSlug = 'probe-late-skill'
          const created = await f.contentWindow
            .fetch('/api/skills', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                skills: [
                  {
                    slug: lateSlug,
                    name: lateSlug,
                    description: '探针：应用启动之后才入库的一条技能',
                    body: '# probe late skill\n\n启动之后才写进来的。\n',
                  },
                ],
              }),
            })
            .then((r) => r.ok)
            .catch(() => false)
          if (!created) {
            errors.push('造"晚到的技能"失败（POST /api/skills）——这一条量不到')
            return null
          }
          f.contentWindow.location.hash = '#/skills'
          const onPage = await until(() => d().querySelector('.detail-pane') !== null, 80)
          // 再等一拍：页面自己那次读是异步的
          await untilNet(() => (d().body.innerText ?? '').includes(lateSlug), 40)
          const seen = (d().body.innerText ?? '').includes(lateSlug)
          if (!onPage) errors.push('没切到「技能」页')
          else if (!seen) {
            errors.push('应用启动之后才入库的技能，在「技能」页上看不到（没有自动重读）')
          }
          return seen
        })()
        /**
         * ★★ D220（使用者："建立对话的时候，只是新建一个 Item，不需要发送第一句话"）：
         *   放在**最后**执行——它会"新建一条空对话 → 删掉"，中途会改变聊天页状态，
         *   放中间会把后面一串判据的现场搞乱。
         */
        facts['chat.createEmptyConversation'] = await (async () => {
          f.contentWindow.location.hash = '#/chat'
          await until(() => !!d().querySelector('.list-pane'), 80)
          await wait(500)
          const before = (await f.contentWindow.fetch('/api/conversations').then((r) => r.json())).items ?? []
          const newBtn = [...d().querySelectorAll('.topbar .page-actions button')].find((b) =>
            (text(b) ?? '').includes('新建对话'),
          )
          if (!newBtn) {
            errors.push('聊天页顶栏找不到「新建对话」')
            return null
          }
          click(newBtn)
          const draftOpen = await until(() => !!d().querySelector('#chat-agent'), 40)
          const createBtn = d().querySelector('[data-chat-create]')
          if (!createBtn) {
            errors.push('起草态没有「创建对话」这颗按钮（[data-chat-create]）')
            return { 起草态: draftOpen, 有创建键: false }
          }
          click(createBtn)
          await wait(1500)
          const after = (await f.contentWindow.fetch('/api/conversations').then((r) => r.json())).items ?? []
          const created = after.find((c) => !before.some((b) => b.id === c.id)) ?? null
          // 建好之后已经是**对话态** ⇒ 标题在 `.detail-head` 里（起草态的 `.pane-head` 没了）
          const head = text(d().querySelector('.detail-pane .detail-head h2')) ?? ''
          const result = {
            起草态: draftOpen,
            有创建键: true,
            多了一条: created !== null,
            标题是未命名: head === '未命名对话',
            轮数: created ? created.turnCount : null,
            建好之后有输入条: !!d().querySelector('.detail-pane textarea'),
          }
          // 收尾：删掉这条测试对话（别把探针的现场留给后面的运行）
          if (created) {
            await f.contentWindow.fetch('/api/conversations/' + created.id, { method: 'DELETE' })
          }
          return result
        })()

        publish(true)
      }

      main().catch((e) => {
        errors.push('探针自身异常：' + (e && e.stack ? e.stack : String(e)))
        publish(true)
      })
    </script>
  </body>
</html>
