<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>agentdeck layout probe</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 12px/1.5 monospace; }
      iframe { width: 1280px; height: 880px; border: 0; display: block; }
      pre { margin: 0; padding: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      ══════════════════════════════════════════════════════════════════
      界面布局探针：它为什么存在
      ══════════════════════════════════════════════════════════════════

      `tsc`/`svelte-check` 看不见布局：类名写对了、模板结构合法，但
      "两栏有没有并排"、"窄屏返回按钮有没有出现"、"`.main:has(> .split-layout)`
      有没有真的生效"这些只有**浏览器量得出来**。改布局时靠"我看着像对"
      是不够的——这个项目里已经有过两次"接口都在、就是没接线"的缺陷。

      于是：把**真应用**放进同源 iframe，用**真实点击**驱动它，把
      `getComputedStyle` 的结果写进自己的 DOM，再由 `run.mjs` 用
      `chrome --dump-dom` 抓回去断言。探针只上报**事实**，期望值全在
      `run.mjs` 里——"量"和"判"分开，改了期望不必动这里。

      ⚠️ 它**基本不造 run**：造 run 就会去调真的 CLI（NFR-T-01 的底线）。所以它验的是
         **布局与结构**，不是"跑起来之后长什么样"。唯一的例外是「新建任务的三步链」
         那一组：那里要证明"界面上选的"与"发出去的请求体"是同一件事，只有真的点一次
         「创建并派发」、再从接口上把那条 run 读回来才做得到。那两条 run 用的
         runtime 是 `generic`（命令 `agent-cli` 不存在）⇒ 它们会立刻失败，**不会**
         拉起任何一个真实的模型去干活（见 `run.mjs` 里造那个夹具 agent 的说明）。
    -->
    <iframe id="f" src="/#/agents"></iframe>
    <pre id="out">pending</pre>
    <script>
      const f = document.getElementById('f')
      const facts = {}
      const errors = []
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const d = () => f.contentDocument
      const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : null)

      /**
       * ══════════════════════════════════════════════════════════════════
       * ★ 2026-10（探针加固）：拿不到元素**不许把整趟打死**
       * ══════════════════════════════════════════════════════════════════
       *
       * 原来 `cs(el)` / `click(el)` 直接就把 `el` 用出去，`el === null` 时抛
       * TypeError 一路穿到 `main()` 外面 ⇒ **后面每一段都没量**。报告里于是出现
       * 500 多条"没量到这个值（选择器可能改了）"，而真因只有一个，藏在第一个异常里
       * ——排查它要一次次重跑（这一趟就是被 `.detail-pane .back` 那个已经不存在的
       * 按钮打死的）。
       *
       * 现在的规矩：**拿不到值就记一条、继续往下量**。一次跑完能看到全部问题，
       * 而不是"修一个冒一个"。
       */
      const seenNotes = new Set()
      function note(message) {
        if (seenNotes.has(message)) return
        seenNotes.add(message)
        errors.push(message)
      }

      /** 计算样式；元素不在时给空对象（读到的字段是 undefined ⇒ 那条断言红，正是要的）。 */
      function cs(el) {
        if (!el) {
          note('getComputedStyle：目标元素不存在（选择器可能改了）')
          return {}
        }
        return f.contentWindow.getComputedStyle(el)
      }

      /**
       * 智能体详情**卡片里每一格的小标题**。
       *
       * ⚠️ 2026-10 起智能体详情只有**一个态、一张卡片**（选中即编辑）：旧的
       *    `.detail .section h3`（查看态的段落标题）与 `.detail .field-row .row-label`
       *    都不存在了，段落身份由 `.cell > .cell-label` 表示。多处断言要问"这一页
       *    有哪些段"，所以只在这里定义一次——各段各写一遍选择器，改一次界面就要
       *    改十几处（而且会漏）。
       */
      function agentCellLabels(root) {
        const scope = root ?? d()
        return [...scope.querySelectorAll('.card.agent-card .cell')].map((cell) => {
          // ⚠️ 有的格用小标题元素（`<div class="cell"><span class="cell-label">…`），
          //    有的是 `<label class="cell">标题<textarea …>`（「指令」那一格就是）。
          //    只认 `.cell-label` 会把「指令」这一格整个漏掉——它恰恰是判断依据的
          //    唯一出处，漏掉它会让"这一页有哪些格"这件事量错（踩过）。
          const label = cell.querySelector('.cell-label')
          if (label) return text(label)
          const own = [...cell.childNodes].find(
            (n) => n.nodeType === 3 && (n.textContent ?? '').trim() !== '',
          )
          return own ? (own.textContent ?? '').trim() : null
        })
      }

      function publish(done) {
        document.getElementById('out').textContent = JSON.stringify({ errors, facts, done }, null, 1)
      }

      /** 轮询等待条件成立；拿不到就返回 false（调用方自己记一条 error）。 */
      async function until(fn, tries = 100) {
        for (let i = 0; i < tries; i++) {
          try {
            if (fn()) return true
          } catch {}
          await wait(150)
        }
        return false
      }

      function click(el) {
        if (!el) {
          note('click：目标元素不存在（选择器可能改了）')
          return false
        }
        el.dispatchEvent(
          new MouseEvent('click', { bubbles: true, cancelable: true, view: f.contentWindow }),
        )
        return true
      }

      function need(name, fn) {
        try {
          const v = fn()
          if (v === undefined) errors.push(`${name}：拿不到值`)
          return v
        } catch (e) {
          errors.push(`${name}：${e && e.message ? e.message : e}`)
          return null
        }
      }

      async function main() {
        await new Promise((r) => f.addEventListener('load', r, { once: true }))

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 智能体：主从布局 ══════════════
        // 首启会播种一对 agent（一个执行、一个审核），所以这里等得到卡片；
        // 等不到就说明界面或接口坏了——那本身就是要报出来的事。
        const gotCards = await until(() => d().querySelectorAll('.list-row-main').length > 0)
        const cards = () => [...d().querySelectorAll('.list-row-main')]
        facts['agents.gotData'] = gotCards
        if (!gotCards) errors.push('智能体页等了 15 秒也没出现任何 .list-row-main（数据没到或列表没渲染）')

        facts['agents.cardCount'] = cards().length
        // 每张卡都要有：名字、角色徽章、一行说明（指令摘要 + 关系/技能/runtime 两部分）
        // ★ 2026-10（紧凑性）：原先是**两行**说明（`.agent-note` × 2，各占一行），
        //   使用者要求合并成一行——所以这里改量 `.agent-notes` 里的两个子 span。
        facts['agents.everyCardWellFormed'] =
          cards().length > 0 &&
          cards().every(
            (c) =>
              !!c.querySelector('strong') &&
              !!c.querySelector('.badge') &&
              !!c.querySelector('.agent-notes-trunc') &&
              !!c.querySelector('.agent-notes-meta'),
          )
        facts['agents.executorShowsReviewer'] = need('执行者卡片上的审核者', () => {
          const exec = cards().find((c) => c.textContent.includes('执行'))
          return exec ? text(exec.querySelector('.agent-notes-meta')) : null
        })

        const layout = () => d().querySelector('.split-layout')
        const main = () => d().querySelector('main.main')

        facts['agents.initialClass'] = need('初始 class', () => layout()?.className)
        facts['agents.initialListDisplay'] = need('初始左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.initialDetailDisplay'] = need('初始右栏', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        // `:has(> .split-layout)` 那条规则若失效，整页会变成"外层滚动"而不是
        // 两栏各自滚动——类型检查完全看不出来，所以这里量出来。
        facts['agents.mainOverflowY'] = need('main overflow-y', () => cs(main()).overflowY)
        facts['agents.mainPaddingTop'] = need('main padding-top', () => cs(main()).paddingTop)
        facts['agents.layoutHeightDelta'] = need('布局高度 vs main 高度差', () =>
          Math.round(layout().getBoundingClientRect().height - main().clientHeight),
        )

        // ── 真点击第一条 ──
        click(cards()[0])
        const entered = await until(() => layout()?.className.includes('with-detail'))
        if (!entered) errors.push('点了第一条 agent 之后 .split-layout 没有带上 with-detail')
        facts['agents.afterClickClass'] = need('点击后 class', () => layout()?.className)
        facts['agents.tracks'] = need('两栏宽度', () => cs(layout()).gridTemplateColumns.split(' '))
        // ⚠️ 选中态挂在 `.agent-row`（那一行才是卡片：边框要包住右侧的开关），
        //    所以这里按**行**取，再确认它里面确实是刚点的那张卡
        facts['agents.activeCardClass'] = need('选中态', () =>
          d().querySelector('.agent-row.active')?.className.replace(/ svelte-\w+/, ''),
        )
        // ⚠️ 2026-10（使用者拍板）：智能体**没有预览页了**——选中即编辑，右栏
        //    进来就是一张可编辑卡片（与智能体组页同款）。原来这里认的是
        //    `.detail-pane .detail`（查看态那套 DOM），那一整套随改造删掉了。
        facts['agents.detailRendered'] = need('右栏是否渲染出详情（可编辑卡片）', () =>
          !!d().querySelector('.detail-pane .card.agent-card'),
        )
        // ★ 这三条钉的就是"没有查看/编辑两态"这个决定：右栏没有 hero 头、
        //   页面上没有「编辑」按钮、卡片里就是能改的控件。
        facts['agents.detailNoHero'] = need('没有 hero 头', () =>
          !d().querySelector('.detail-pane .hero'),
        )
        facts['agents.detailNoEditButton'] = need('没有「编辑」按钮', () =>
          ![...d().querySelectorAll('.detail-pane button')].some(
            (b) => text(b).trim() === '编辑',
          ),
        )
        facts['agents.detailEditableInPlace'] = need('卡片里就是可编辑的控件', () =>
          !!d().querySelector('.detail-pane #agent-instructions') &&
          !!d().querySelector('.detail-pane .role-picker .role-card'),
        )
        facts['agents.detailHeading'] = need('右栏标题（单态卡片里就是名字输入框的值）', () =>
          String(d().querySelector('.detail-pane #agent-name')?.value ?? ''),
        )
        // ── D69.15 标题统一（**只对还有栏头 hero 的页面成立**）：智能体页
        //    2026-10 起没有预览页头了，这条在智能体页退化成"没有 hero"这一事实
        //    （栏头标题的统一由任务/聊天那两条继续钉着）。
        facts['heads.agentsHeadTitleFs'] = need('智能体栏头标题字号 fs-lg', () => {
          const h2 = d().querySelector('.detail-pane .hero h2')
          return h2 ? cs(h2).fontSize === '17px' : 'NO-HERO'
        })
        // ── D69.15.2 风格一致：hero 必须**通栏**（hero 在 pane-body 里，负边距
        //    抵消留白——分隔线横贯整栏、与任务/聊天栏头同位置；否则缩在 24px
        //    留白里窄 48px）。
        facts['heads.agentsHeroFullBleed'] = need('智能体 hero 通栏', () => {
          const hero = d().querySelector('.detail-pane .hero')
          const pane = d().querySelector('.detail-pane')
          if (!hero || !pane) return 'NO-HERO'
          const a = hero.getBoundingClientRect()
          const b = pane.getBoundingClientRect()
          return Math.abs(a.left - b.left) <= 1 && Math.abs(a.top - b.top) <= 1
        })
        // ── D69.15.2 风格一致：角色提示小字 14px（曾用 `small` 12px，比任务/
        //    聊天的副题元信息小一圈）
        facts['heads.agentsRoleHintFs'] = need('智能体角色提示字号 14px', () => {
          const hint = d().querySelector('.detail-pane .hero .role-line .faint')
          return hint ? cs(hint).fontSize === '14px' : 'NO-HINT'
        })
        // ── runtime 选择器：选项必须来自身份接口，不是写死两项 ──
        //
        //   加一个 runtime = 描述表一行 + 适配器包 + 装配表一行。若界面写死
        //   选项，那个 runtime 就**只有直接调接口才选得到**——"接口支持、界面
        //   没有入口"是这个仓库最常见的那类缺陷。
        // ⚠️ 这一段原来要**先点「编辑」**才量得到 runtime 选择器。2026-10 起
        //    没有两态了 ⇒ 选择器直接在卡片里，不需要任何前置点击（点了也点不到，
        //    「编辑」按钮已经不存在——那正是上面 `detailNoEditButton` 量的事）。
        const editBtn = null
        facts['agents.editButtonFound'] = !!editBtn
        {
          const sel = d().querySelector('select#agent-runtime')
          facts['agents.runtimeOptions'] = sel ? [...sel.options].map((o) => o.value).sort() : null
          // ── 未接真实 CLI 的 runtime（evidence 非 verified）不进 runtimes 数组 ──
          //
          //   2026-10（使用者决定）：未验证的 runtime（generic）**不显示在 UI 上**，
          //   所以身份接口的 `runtimes` 数组只应含 `verified` 的项（UI 全从它来）。
          //   判据是 `evidence` 而不是 runtime 名字——加第四个未验证 runtime 时
          //   自动隐藏，不用改这一处。原先把非 claude 的 runtime 当成"未验证"去
          //   选中并期望警告出现——那套在"未验证不进列表"之后量不到了。
          try {
            const identity = await fetch(`${location.origin}/api/identity`).then((r) => r.json())
            facts['agents.identityRuntimeKeys'] = (identity.runtimes ?? [])
              .map((r) => r.key)
              .sort()
            facts['agents.noProvisionalRuntime'] = (identity.runtimes ?? []).every(
              (r) => r.evidence === 'verified',
            )
          } catch {
            facts['agents.identityRuntimeKeys'] = null
            facts['agents.noProvisionalRuntime'] = null
          }

          // ⚠️ 这里原来要"别把状态留在编辑态"（后面的断言按只读态写的）。现在
          //    只有一个态，**不要**点取消：那会退出这一栏（`onclose`），后面的
          //    窄屏出口那几条需要"有一条被选中"的现场。
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════════════════════════════════════════════════════════
        // ⚠️ 2026-10：这里原来量的是"窄屏下的 `.detail-pane .back` 返回按钮"。
        //    那个按钮**已经不存在了**——AgentDetail 改成"选中即编辑"之后没有
        //    查看态，栏头由 `MainArea` 渲染，而智能体页没有给它 `backLabel`
        //    （列表就在左边，宽屏不需要返回；窄屏的出口与任务页一样是**侧边栏那一项**）。
        //
        //    所以这一段改成量真正成立的两件事：
        //      ① 宽屏：两栏都在（列表 + 详情）；
        //      ② 窄屏：列表让位、详情占满，而且**真的出得去**（点侧边栏「智能体」）。
        //    判据是"出得去"，不是"某个按钮在不在"——按钮当初就是被要求去掉的。
        facts['agents.wideListDisplay'] = need('宽屏左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )

        // ── 收窄：应当只剩一栏（列表让位给详情）──
        f.style.width = '900px'
        await wait(400)
        facts['agents.narrowListDisplay'] = need('窄屏左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.narrowDetailDisplay'] = need('窄屏右栏（选中态）', () =>
          cs(d().querySelector('.detail-pane')).display,
        )

        // ── 窄屏出口 ⇒ 回到列表（详情让位）──
        //    ⚠️ 2026-10 实测：**点侧边栏「智能体」那一项是空操作**（导航到同一个
        //       视图不改变 `selectedId` 这个组件状态）⇒ 窄屏下左栏被详情顶掉之后，
        //       靠侧边栏回不去。当前真正有的出口是底部那颗「取消」
        //       （`cancelEdit()` = 放弃草稿 + 退出这一栏）。
        //    ★ 两种口径分开记：`sidebarNoOp` 是一条**事实**（它是个真缺陷，
        //       但不是这一批要改的东西——改界面与对齐探针是两件事），
        //       `narrowExit*` 量的是**真的出得去**。
        const navAgentsBtn = [...d().querySelectorAll('.nav-item')].find((b) =>
          text(b)?.includes('智能体'),
        )
        if (navAgentsBtn) {
          click(navAgentsBtn)
          await wait(500)
        }
        facts['agents.sidebarNavNoOpWhenSelected'] = need('点侧边栏「智能体」是不是空操作', () =>
          layout()?.className.includes('with-detail') === true,
        )
        const cancelBtn = [...d().querySelectorAll('.detail-pane .form-actions button')].find(
          (b) => text(b).trim() === '取消',
        )
        facts['agents.narrowExitFound'] = !!cancelBtn
        if (cancelBtn) {
          click(cancelBtn)
          await until(() => !layout()?.className.includes('with-detail'), 60)
        }
        facts['agents.afterExitClass'] = need('出口之后 class', () => layout()?.className)
        facts['agents.afterExitListDisplay'] = need('出口之后左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.afterExitDetailDisplay'] = need('出口之后右栏（窄屏）', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        // 回到宽屏，后面几段按默认窗口量
        f.style.width = '1280px'
        await wait(400)
        f.style.width = '1280px'
        await wait(300)

        // ── Runtime 概览（原来六列表格，现在是竖排卡片）──
        const rc = () => [...d().querySelectorAll('.runtime-card')]
        facts['agents.runtimeCardCount'] = rc().length
        facts['agents.runtimeCardsWellFormed'] =
          rc().length > 0 && rc().every((c) => c.querySelectorAll('.runtime-line').length >= 1)

        // ★ 2026-10 极简（使用者点名"只显示 claude 2.0.14，其他都不需要"）：
        //    每张卡**只**有「CLI 名 + 版本」，不再有核对/会话/版本支持那些行。
        facts['agents.runtimeCardMinimal'] = need('CLI 卡只剩名字与版本', () => {
          const card = rc().find((c) => text(c).includes('claude'))
          if (!card) return false
          const t = text(card)
          const noExtras =
            !t.includes('会话') &&
            !t.includes('核对') &&
            !t.includes('声明支持') &&
            !t.includes('没有写明')
          return noExtras
        })

        // ★ 2026-10（D63）：智能体页的页头导语**按要求去掉了**（"这里配置每个
        //   智能体：它的指令、行动权限，以及由谁来审它。"——它是在复述下面卡片
        //   已经在说的话）。原来这里钉的是"必须有导语"（`common.pageIntros`），
        //   跟着改成钉"**没有**"：谁把导语加回来（或探针停错了页），这条就红。
        facts['agents.noPageIntro'] = need('智能体页没有页头导语', () => {
          const intro = d().querySelector('.view-intro')
          return !intro
        })

        // ★ 2026-10 一致性：**置灰的按钮必须写清为什么**（项目纪律）。
        //   只查"有 title"这一半：另一半是"按钮文字随状态变"（如「保存中…」），
        //   那种在这里量不出来，但它不算"没解释"。
        facts['common.disabledButtonsExplained'] = need('置灰按钮都有解释', () => {
          const btns = [...d().querySelectorAll('button[disabled]')]
          const naked = btns.filter((b) => !b.getAttribute('title'))
          if (naked.length > 0) {
            errors.push(
              `${naked.length} 个置灰按钮没写为什么：` +
                naked.map((b) => text(b).trim().slice(0, 12)).join(' / '),
            )
          }
          return naked.length === 0
        })

        // ★ 2026-10 一致性：**提示文字不叠加两档字号**
        //   （原来有 `class="hint faint small"` 这种写法：fs-sm 与 fs-xs 一起上，
        //   同一页的说明文字因此大小不一）。
        facts['common.noHintStacking'] = need('提示文字不叠加字号档', () => {
          return d().querySelectorAll('.hint.faint.small, .hint.small').length === 0
        })

        // ★ 2026-10 一致性：**抽屉的头部只有一种写法**（`.drawer-head` + `<h2>`）。
        //   技能页的目录抽屉原来写的是 `<header>` + `<h3>`，而那个文件里没有
        //   `header`/`h3` 的样式 ⇒ 它**完全没有抽屉头部的样式**（没有 flex、
        //   没有内边距、没有分隔线，关闭按钮从右侧掉到标题下面）。
        facts['common.drawerHeadsStandard'] = need('抽屉头部写法统一', () => {
          const bad = [...d().querySelectorAll('.drawer')].filter(
            (dr) => dr.querySelector('.drawer-head') === null,
          )
          if (bad.length > 0) {
            errors.push(`${bad.length} 个抽屉没有 .drawer-head（头部写法不一致）`)
          }
          return bad.length === 0
        })

        /**
         * ★★ 「设置」抽屉：**没保存就关掉，草稿必须丢掉**。
         *
         * ══════════════════════════════════════════════════════════════
         * 这条检查的由来：使用者报的一次"内容没恢复"
         * ══════════════════════════════════════════════════════════════
         *
         * 原话是「我修改了内容，没有保存直接点关闭或者取消后，重新打开，内容没有
         * 恢复保存前的内容」。实测确实如此：改到 238 字符、关掉、重开——还是 238。
         *
         * 根因是那个"初始值只取一次"的开关只被设成 true、**从来不重置**：第一次
         * 打开之后它永远是 true，于是"取消"之后再打开，框里留着的是上一次没保存
         * 的草稿。而"取一次"本身是对的（保存之后 store 会刷新，那一冲会让人以为
         * 自己写的东西没了）——所以修法是**每次打开重新取一遍**，不是去掉它。
         *
         * ⚠️ 这条检查**不改动任何已保存的东西**：它只往输入框里打字，然后关掉
         *    （不点保存），所以那份配置在服务端一个字都没变。
         * ⚠️ 判据是"重开之后的内容 == 打开时的内容（= 已保存的值）"，而不是
         *    "字数变了没有"：只有前者才是使用者那句话的意思。
         */
        facts['agents.settingsDraftDiscarded'] = await (async () => {
          f.contentWindow.location.hash = '#/agents'
          // ⚠️ 2026-09 顶栏改版：页面标题从主区头部搬到了顶栏，所以"这一页出来了"
          //    这个信号跟着改量点（判据没变：仍然是**这一页的名字**出现在屏幕上）。
          await until(() => text(d().querySelector('.page-name')) === '智能体', 60)
          await wait(500)
          const openSettings = async () => {
            // 页面动作（「设置」等）2026-09 起在顶栏里、紧跟着页名：所有页面**同一个位置**
            const btn = [...d().querySelectorAll('.topbar .page-actions button')].find(
              (b) => text(b) === '设置',
            )
            if (!btn) return false
            click(btn)
            await wait(1500)
            return d().querySelector('.drawer textarea') !== null
          }
          const field = () => d().querySelector('.drawer textarea')
          if (!(await openSettings())) {
            errors.push('打开智能体页的「设置」之后没看到模版输入框')
            return false
          }
          /**
           * ⚠️ 已保存的值**可能是空的**（平台有默认模版，`current.executeTemplate`
           *    就是空串，界面靠 placeholder 显示默认那一段）。所以这里不要求它非空：
           *    判据是"改完之后关掉，重开必须回到**打开时那一份**"——空也算一份。
           */
          const saved = field()?.value ?? ''
          // 改一下（**不保存**）
          const box = field()
          box.value = `${saved}\n\n【探针：这段没保存，关掉之后不该还在】`
          box.dispatchEvent(new Event('input', { bubbles: true }))
          await wait(400)
          if ((field()?.value ?? '').length === saved.length) {
            errors.push('改了输入框但内容没变（这一条量不到）')
            return false
          }
          // 关掉（走 Esc，等于点「关闭」）
          f.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
          await wait(800)
          if (d().querySelector('.drawer') !== null) {
            errors.push('Esc 没关掉抽屉（这一条的第一步就没成立）')
            return false
          }
          // 重开：必须回到已保存的那份
          if (!(await openSettings())) {
            errors.push('重开「设置」时没看到模版输入框')
            return false
          }
          const again = field()?.value ?? ''
          f.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
          await wait(400)
          if (again !== saved) {
            errors.push(
              `没保存就关掉之后，重开时框里不是已保存的内容（${saved.length} → ${again.length} 字符）` +
                `——多出来的是上一次的草稿`,
            )
            return false
          }
          return true
        })()

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 任务：同样的主从 + 去重字样 ══════════════
        // ⚠️ 页名是「任务」（顶上那条 `shell.navTasks`——侧栏叫什么这里就叫什么，
        //    合并之后侧栏那一项改叫「任务」了；D58 之前这里等的是「任务清单」）。
        f.contentWindow.location.hash = '#/tasks'
        await until(() => text(d().querySelector('.page-name')) === '任务')
        // 等表格真的出现行：run.mjs 会先造一条任务当夹具。等不到就是夹具没造上，
        // 下面那条"重复字样"的检查会**空过**——所以这里必须如实报出来。
        const gotRows = await until(() => d().querySelectorAll('.list-pane .task-row').length > 0)
        facts['tasks.gotRows'] = gotRows
        if (!gotRows) errors.push('任务页里一行都没等到（夹具任务没造上或列表没渲染）')

        const rows = [...d().querySelectorAll('.list-pane .task-row')]

        // ── D69.15.2 风格一致：空态=纯空态提示，**不该有栏头**（D69.15 一度把
        //    返回按钮/空标题挂在空态上方——backLabel 无条件传、sub snippet 恒真，
        //    空态头顶一条边框线 + 窄屏一枚没用的返回按钮）。
        facts['heads.tasksEmptyNoHead'] = need('任务空态没有栏头', () => {
          const pane = d().querySelector('.detail-pane')
          if (!pane) return 'NO-PANE'
          return !pane.querySelector('.detail-head') && !!pane.querySelector('.empty')
        })
        facts['tasks.rowCount'] = rows.length
        // 从没跑过的任务：标签「执行中」+ 额外信息「还没开始执行」。
        // 这一行同时钉住了"标签之外的信息该不该显示"这条规则。
        facts['tasks.firstRowStageCell'] = need('第一行元信息', () =>
          text(rows[0]?.querySelector('.task-meta')),
        )
        // ── 行高：长标题不许把一行撑高 ──
        facts['tasks.rowHeights'] = need('各行高度', () =>
          rows.map((r) => Math.round(r.getBoundingClientRect().height)),
        )
        facts['tasks.maxRowHeight'] = need('最高的一行', () =>
          Math.max(...rows.map((r) => Math.round(r.getBoundingClientRect().height))),
        )
        // ★ 行高与标题长度无关：拿"长标题那行"和"短标题那行"对比。
        facts['tasks.heightSpread'] = need('长短标题的行高差', () => {
          const heights = rows.map((r) => Math.round(r.getBoundingClientRect().height))
          return heights.length >= 2 ? Math.max(...heights) - Math.min(...heights) : 'ROWS-TOO-FEW'
        })
        // 被裁掉了吗（scrollHeight > clientHeight 说明内容被截断了，而不是被挤宽）
        facts['tasks.titleClipped'] = need('长标题是否被截断显示', () => {
          const longRow = rows.find((r) =>
            (r.querySelector('.task-title')?.textContent ?? '').startsWith('探针用的任务'),
          )
          const t = longRow?.querySelector('.task-title')
          if (!t) return 'NO-LONG-TITLE-ROW'
          // 单行省略：内容比可见宽度长，就是被截断了
          return t.scrollWidth > t.clientWidth + 1
        })
        // 标题那一格的实际宽度（它现在独占一行，应当接近整栏宽）
        facts['tasks.titleWidth'] = need('标题宽度', () => {
          const t = rows[0]?.querySelector('.task-title')
          return t ? Math.round(t.getBoundingClientRect().width) : null
        })
        facts['tasks.layoutPresent'] = need('任务页主从布局', () =>
          !!d().querySelector('.split-layout .list-pane') &&
          !!d().querySelector('.split-layout .detail-pane'),
        )
        facts['tasks.mainOverflowY'] = need('任务页 main overflow-y', () => cs(main()).overflowY)
        // 使用者点名要去掉的那句「等待审核」：整份渲染结果里一次都不该出现。
        // 任何视图里重新长出这句话，这里就会红。
        facts['tasks.duplicateStageTextCount'] = need('「等待审核」出现次数', () =>
          (d().documentElement.innerHTML.match(/等待审核/g) ?? []).length,
        )

        // ── 点一行 → 右栏显示**完整**的标题 ──
        // 列表把标题截断了，所以"完整标题还能不能看到"必须另有地方证明：
        // 详情栏就是那个地方。顺带守住"改写列表标记之后点选还通不通"。
        facts['tasks.clickedRowTitle'] = need('被点那一行的标题', () =>
          text(rows[0]?.querySelector('.task-title')),
        )
        click(rows[0]?.querySelector('.list-row-main') ?? rows[0])
        await until(() => d().querySelector('.detail-pane .detail-head h2'))
        facts['tasks.detailTitleAfterClick'] = need('点之后右栏的标题', () =>
          text(d().querySelector('.detail-pane .detail-head h2')),
        )
        // 列表里只剩日期 ⇒ 完整时间戳必须在别处还看得见（否则是悄悄丢信息）
        facts['tasks.detailHasTimestamp'] = need('右栏有没有完整时间戳', () =>
          /\d{1,2}:\d{2}/.test(text(d().querySelector('.detail-pane .detail-sub')) ?? ''),
        )

        // ── D69.9：任务详情重排——"重要资讯直接展示、非重要资讯折叠" ──
        // 夹具第一行是**从没跑过**的任务（见上面 firstRowStageCell 的注释）。
        //   a) 折叠区块头部是**真按钮** + aria-expanded（与表格 ExpandToggle 同一纪律）；
        //   b) 未跑的任务描述默认**展开**（状态驱动：未跑时描述是唯一正文）；
        //   c) 点折叠头真的能收起 / 再展开（折叠不是摆设）。
        const descHead = [...d().querySelectorAll('.detail-pane .fold-head')].find((h) =>
          text(h).includes('说明'),
        )
        facts['tasks.foldHeadsAreButtons'] = need('折叠头是真按钮', () => {
          const heads = [...d().querySelectorAll('.detail-pane .fold-head')]
          return (
            heads.length >= 1 &&
            heads.every((h) => h.tagName === 'BUTTON' && h.hasAttribute('aria-expanded'))
          )
        })
        facts['tasks.neverRunDescOpen'] = need('未跑任务描述默认展开', () => {
          const body = d().querySelector('.detail-pane .fold-body')
          return (
            descHead?.getAttribute('aria-expanded') === 'true' &&
            !!body &&
            cs(body).display !== 'none'
          )
        })
        facts['tasks.foldToggles'] = await (async () => {
          if (!descHead) return 'NO-FOLD-HEAD'
          click(descHead)
          await wait(200)
          const closed = descHead.getAttribute('aria-expanded') === 'false'
          click(descHead)
          await wait(200)
          const reopened = descHead.getAttribute('aria-expanded') === 'true'
          return closed && reopened
        })()

        // ── D69.10：人工裁决条 sticky 钉底——内容超出一屏时「通过/反馈/放弃」
        //    固定在本栏底部、不跟着滚走；不满一屏时自然跟在正文后面。
        facts['tasks.decideBarSticky'] = need('人工裁决条钉在底部', () => {
          const bar = d().querySelector('.detail-pane .decide-bar')
          if (!bar) return 'NO-DECIDE-BAR'
          return cs(bar).position === 'sticky' && cs(bar).bottom === '0px'
        })

        // ── D69.14：裁决区标题「这条任务怎么办」已删（使用者要求去掉字样）──
        facts['tasks.noDecideHeading'] = need('裁决区不再有「这条任务怎么办」标题', () => {
          const bar = d().querySelector('.detail-pane .decide-bar')
          if (!bar) return 'NO-DECIDE-BAR'
          return !text(bar).includes('这条任务怎么办')
        })

        // ── D69.15 标题统一：任务详情栏头（MainArea 渲染）标题字号 fs-lg +
        //    与 `.pane-head` 同一套留白/下边框。使用者抓的："连最基本的 Title
        //    高度都不一样"——任务/智能体标题原来 22px（全局 h2 的 fs-xl）、
        //    聊天 17px（fs-lg），且任务头贴顶、没有下边框。
        facts['heads.tasksHeadMetrics'] = need('任务详情栏头标题统一指标', () => {
          const h2 = d().querySelector('.detail-pane .detail-head h2')
          const head = d().querySelector('.detail-pane .detail-head')
          if (!h2 || !head) return 'NO-HEAD'
          return (
            cs(h2).fontSize === '17px' &&
            cs(head).paddingTop === '16px' &&
            cs(head).paddingBottom === '12px' &&
            cs(head).borderBottomWidth === '1px'
          )
        })

        // ── 每项右侧的删除按钮：需求本身（"任务列表每项加删除按钮"）──
        // 每个 `.task-row` 里都该有一个 `.list-row-action`，且它不在主按钮里
        // （按钮套按钮是非法结构）。
        facts['tasks.deleteButtonPerRow'] = need('每行右侧的删除按钮', () =>
          rows.every(
            (r) =>
              !!r.querySelector('.list-row-main') &&
              !!r.querySelector(':scope > .list-row-action'),
          ),
        )

        // ★ 选中框的样式：上面刚点过一行，所以这里有 `.active`。
        //   这两个值会与聊天栏的同名量值比对（见 run.mjs 里 `chat.activeItemBorder`
        //   那条）——"当前选中"在三处列表里必须长得一样。
        facts['tasks.activeItemBorder'] = need('任务选中项的描边色', () => {
          const el = d().querySelector('.list-pane .task-row.active')
          return el ? cs(el).borderTopColor : ''
        })
        facts['tasks.activeItemBackground'] = need('任务选中项的背景色', () => {
          const el = d().querySelector('.list-pane .task-row.active')
          return el ? cs(el).backgroundColor : ''
        })

        // ★ 2026-10：**协议状态值不许上屏**。执行记录的状态徽标原来是裸的
        //   `{run.status}`（界面上出现 `completed` / `running` /
        //   `waiting_local_directory`），而词表里 `term.runStatus.*` 八条中文
        //   早就写好了、一条都没被引用。同页的判决结论、动作状态、任务阶段
        //   都有中文，只有它没有。
        facts['tasks.runStatusLocalized'] = need('执行记录状态是中文', () => {
          const english = [
            'deferred',
            'queued',
            'dispatched',
            'waiting_local_directory',
            'running',
            'completed',
            'failed',
            'cancelled',
          ]
          const bad = [...d().querySelectorAll('.badge')].filter((b) =>
            english.includes(text(b).trim()),
          )
          if (bad.length > 0) {
            errors.push(
              `徽标里还在显示协议英文状态：${bad.map((b) => text(b).trim()).join(', ')}`,
            )
          }
          return bad.length === 0
        })

        // ★ 容器是 `<ul>`（每项要装"主按钮 + 兄弟删除按钮"，只有 `li` 装得下），
        //   而 `ul` 自带 `padding-inline-start: 40px` 与圆点标记。忘了归零的表现
        //   是**整列内容右移 40px**（使用者的原话："任务清单的列表的每个项目的
        //   内容怎么靠右了"）。这里量两件事：行左边缘贴着列表左边缘、
        //   标题也从行的左边起（不是被推到中间/右边）。
        facts['tasks.rowsNotIndented'] = need('任务行没有 ul 默认缩进', () => {
          const list = d().querySelector('.list-pane .task-list')
          const row = rows[0]
          if (!list || !row) return false
          const l = list.getBoundingClientRect()
          const r = row.getBoundingClientRect()
          const title = row.querySelector('.task-title')
          if (!title) return false
          const t = title.getBoundingClientRect()
          return Math.abs(l.left - r.left) <= 1 && t.left - r.left < 40
        })
        // 圆点标记也不该有（`list-style: none`）
        facts['tasks.noListMarker'] = need('行首没有圆点标记', () => {
          const row = rows[0]
          return !!row && cs(row).listStyleType === 'none'
        })

        // ── ★ 2026-10（D58）：建任务的入口**在这一页**，而且点了真到得了表单 ──
        //   合并（侧栏「新建任务」并进「任务」）这件事，少一个入口就必须多一个
        //   入口——否则功能是"没了"而不是"搬家"，而那种缺失在界面上看不出来
        //   （只是"没地方建"）。三条一起钉：文字、它是主操作、点了真跳。
        //   ⚠️ 点击会切页再切回来（旧的行节点会失效），所以放在所有"先抓住
        //      行节点再断言"的检查**之后**、切看板那一段之前。
        const createBtn = [...d().querySelectorAll('.page-actions button')].find(
          (b) => b.textContent.trim() === '新建任务',
        )
        facts['tasks.createActionLabel'] = need('任务页顶栏的「新建任务」按钮文字', () =>
          createBtn ? createBtn.textContent.trim() : null,
        )
        facts['tasks.createActionKind'] = need('那个按钮的 class', () =>
          createBtn ? createBtn.className.replace(/ svelte-\w+/, '').trim() : null,
        )
        if (!createBtn) {
          errors.push('任务页顶栏没有「新建任务」按钮——侧栏那一项已经去掉了，建任务就没入口了')
        } else {
          click(createBtn)
          // ★★ 判据三条一起要（D58 第二步）：地址是**正规那个**（`#/tasks/new`）、
          //   表单真的在**右栏里**（不是整页换来换去）、而且**左边那份清单还在**。
          //   只判"到得了表单"会漏掉这次改动的全部意义——那样整页表单也能过。
          const reached = await until(
            () =>
              f.contentWindow.location.hash === '#/tasks/new' &&
              text(d().querySelector('.page-name')) === '任务' &&
              !!d().querySelector('.detail-pane .create-body .newtask-form'),
            40,
          )
          const ntRowsBeside = d().querySelectorAll('.list-pane .task-row').length
          const ntListVisible = cs(d().querySelector('.list-pane')).display !== 'none'
          facts['tasks.createActionReachesForm'] = reached
          facts['tasks.createKeepsListBeside'] = reached && ntListVisible && ntRowsBeside > 0
          facts['tasks.createPaneFormPresent'] = !!d().querySelector(
            '.detail-pane .create-body .newtask-form',
          )
          // 提交栏的可滚区：这一栏里是**右栏**，不是 `.main`（它 `overflow: hidden`）
          facts['tasks.createBodyIsScroller'] = need('建任务那一栏的可滚区', () => {
            const body = d().querySelector('.detail-pane .create-body')
            return body ? cs(body).overflowY : null
          })
          if (!reached) {
            errors.push(
              `点任务页的「新建任务」没进到右栏的表单（hash=${f.contentWindow.location.hash}，` +
                `页名=${text(d().querySelector('.page-name'))}）`,
            )
          }
          if (!facts['tasks.createKeepsListBeside']) {
            errors.push(
              `建任务时左边那份清单不见了（列表 display=${cs(d().querySelector('.list-pane')).display}，` +
                `行数=${ntRowsBeside}）——合并的意义正是"清单当参照、表单在右边"`,
            )
          }

          // ── ★★ 窄屏：表单**占满整栏**（清单让位）+ 有「返回列表」 ──
          //   这是合并最容易漏的一档：`.split-layout:not(.with-detail) .detail-pane`
          //   在 `≤72rem` 时是 `display:none`，而"进建任务"正好是**没有选中任何
          //   任务**的时刻——`with-detail` 少算一个 `$creating`，窗口一窄点「新建
          //   任务」就**什么都不出现**（宽屏上完全看不出来）。
          //
          //   ⚠️ 顺便钉住容器查询：`800px` 的窗口里右栏内容宽约 496px

        // ══════════════ 新建表单 / 设置：右侧抽屉（D32）══════════════

        f.contentWindow.location.hash = '#/agents'

        facts['template.viewportWidth'] = f.contentWindow.innerWidth

        /**

         * 原来这里量的是"栏头高度开抽屉前后不变"（抽屉曾经被渲染进栏头，把栏头从
         * 167px 撑到 1070px、把主从布局整垮）。2026-09 智能体页左栏的栏头整个删了
         * （标题与顶栏页名重复、按钮搬去顶栏、说明段并进右栏空态），那个量点就
         * **没有主体了**——照旧量一个不存在的元素，它会两边都是 0 而永远通过，
         * 也就是"空过"（`README.md` 的教训一节讲的正是这种全绿但没量到东西）。
         *
         * 所以改成量一张**几何快照**：顶栏 / 侧栏 / 左栏 / 右栏 / 清单里第一条的
         * 位置与尺寸。抽屉一旦进了文档流，这几项里至少有一项会动。
         */
        const layoutSnapshot = () =>
          ['.topbar', '.sidebar', '.list-pane', '.detail-pane', '.list-row-main']
            .map((sel) => {
              const el = d().querySelector(sel)
              if (!el) return `${sel}:—`

              return `${sel}:${Math.round(r.x)},${Math.round(r.y)},${Math.round(r.width)},${Math.round(r.height)}`
            })
            .join(' | ')
        const layoutBefore = layoutSnapshot()

            facts['settings.varListHasLive'] = ['{{runId}}', '{{skills}}'].every((name) =>

          // ★ 2026-10 三框改造：预览按块。示例材料在 **③ 任务框**里（`{{task}}` 展开

          const taskTab = blockTabs.find((t) => text(t).includes('任务'))

          /**

                const preChat = d().querySelector('.drawer .preview pre')

                facts['settings.chatPreviewRenders'] = chatRendered.includes(CHAT_MARK)

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）

        // ══════════════ 判断依据：只有「指令」那一栏，没有「审核标准」══════════════

        const reviewerRow = [...d().querySelectorAll('.agent-row')].find((row) =>
          (row.textContent ?? '').includes('探针用的老标准详情审核者'),

        if (reviewerRow) {
          click(reviewerRow.querySelector('.list-row-main'))
          // ⚠️ 等的是**可编辑卡片**（`.card.agent-card`），不是 `.detail`——2026-10

          await until(() => !!d().querySelector('.card.agent-card'))
          await wait(400)
          const agentCard = () => d().querySelector('.detail-pane .card.agent-card')
          /**
           * 卡片里每一格的标题。

           */
          const cellLabels = () => agentCellLabels()

          // ⚠️ 这一段原来量的是"标准那一行里有一个显示名字的徽标"（`.std-name-badge`）、

          facts['standard.noStandardRowLabel'] = !cellLabels().some((l) => l === '审核标准')
          facts['standard.noStandardSectionTitle'] = !cellLabels().some((t) =>
            (t ?? '').includes('用什么标准'),
          )
          /** 卡片里每一格的小标题（新的"段落标题"就是它）。 */
          facts['standard.detailCellLabels'] = cellLabels()
          // ★ 判断依据的**唯一出处**是「指令」那一格，而它是**能改的**（textarea）：
          //   所以判据从"只读那一行里有一段正文"改成"指令框里有那段正文"。
          facts['standard.detailShowsBody'] = (() => {
            const box = d().querySelector('.detail-pane #agent-instructions')
            facts['standard.instructionsBoxFound'] = !!box
            facts['standard.instructionsLen'] = box ? String(box.value ?? '').trim().length : null
            // ⚠️ 判据原来量的是只读行里的 `<pre>`，阈值 >20 是**投递出去的那份

            //    （老字段还在提示里、保存时才并进来），所以夹具那 9 个字的指令
            //    本来就量不到 20 ⇒ 阈值改成"这一格里有那段指令的正文"，而

            //    （那一条才是真正的不变量，且不依赖界面长相）。
            return box ? String(box.value ?? '').includes('你是严格的审核者') : false
          })()
          // ★ 技能那一格还在（删的是"标准"，不是"挂载"）。
          facts['standard.skillsSectionStillThere'] = cellLabels().some((t) =>
            (t ?? '').includes('技能'),
          )
          /**
           * 「行动权限」那一格：**只留一句指路**。

           * ⚠️ 2026-10：`ActionPicker`（允许触发的动作 + 固定参数 + 调试）**整个能力

           *    （组页 ③ 行动）。详情里现在只有一句 `agents.actionsMovedToGroup`，
           *    而且**刻意不复用那个选择器**（设计注释：两处长得一模一样、只有一处
           *    生效，是最坏的一种界面）。
           *    ⇒ 所以这一格的判据是"**只有一句话、没有任何可操作的东西**"。
           *    原来那一族断言（chips 逐字等于接口 `allowedActions`、"勾一个动作再保存
           *    真的写进去"）描述的是**已经不存在的写入口**，从这里删掉了；
           *    它们要守的东西搬到了**智能体组页的 ③ 行动**（下一批补那里）。

          const actionsCell = () => {

          facts['standard.detailActionsCellTitle'] = need('行动权限那一格的小标题', () =>

          facts['standard.detailHasActionsCell'] = actionsCell() !== null
          facts['standard.actionsPointerText'] = actionsCell() ? text(actionsCell()) : null
          facts['standard.actionsPointerOnly'] = (() => {

            if (!cell) return false
            return (

              cell.querySelector('input') === null &&
              cell.querySelector('button') === null &&
              cell.querySelector('.chip') === null
            )
          })()
          // ★ 负向：那一格里**不说"动作也来自这些技能"**（那句话是给"没有权限"的
          //   审核者解释出处的，而这一格现在只说"去组里配"）。
          facts['standard.actionsHintAbsentWhenSet'] = !String(

          ).includes('也来自这些技能')
          /**
           * ⚠️ **事实（当前是个真缺口）**：`agents.headlineNoInstructions`
           *    （"它审不了任何东西：没有写「指令」…点「编辑」写一段"）这句警告
           *    **在界面里一处都没有了**——它原来住在被删掉的查看态 headline 上，

           *    apps/` 为空）。所以"没写指令的审核者会看到一句解释"这件事**没了**：
           *    使用者只会看到它一直不接活。这里如实记一条事实，供报告点名。

          const headlineText = () => text(d().querySelector('.detail-pane .headline')) ?? ''
          facts['standard.headlineElementGone'] = d().querySelector('.detail-pane .headline') === null
          facts['standard.emptyWarning'] = !headlineText().includes('审不了任何东西')
          // ⚠️ **老标准"一键并进"的入口也没有了**：它原来在查看态里（`standardLegacyNoticeFromSkill`

          facts['standard.legacyFoldInButtonGone'] = ![...d().querySelectorAll('.detail-pane button')].some(

        } else {

          const roleCards = [...form2.querySelectorAll('.role-card')]

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════════════════════════════════════════════════════
          // 两栏各自量：**标准 = 一段正文**，**行动权限 = 动作勾选**
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)

          //

        const foldRow = [...d().querySelectorAll('.agent-row')].find((row) =>

        // ══════════════ 默认智能体（D36）══════════════

          rowBox(toggleBtns()[0]).right <= rowBox(rowWithToggle).right + 1
        )
        facts['defaultAgent.rowOverflowX'] = rowWithToggle
          ? rowWithToggle.scrollWidth - rowWithToggle.clientWidth
          : null
        facts['defaultAgent.paneBodyOverflowX'] = paneBodyEl
          ? paneBodyEl.scrollWidth - paneBodyEl.clientWidth
          : null

        const target = toggleBtns()[0]
        facts['defaultAgent.setButtonFound'] = !!target
        if (target) {
          const targetRow = target.closest('.agent-row')
          facts['defaultAgent.targetName'] = text(targetRow.querySelector('.list-row-main strong'))
          const previous = need('点之前谁是默认', () => text(badge().closest('.agent-row').querySelector('.list-row-main strong')))
          facts['defaultAgent.previousName'] = previous

          click(target)
          const marked = await until(
            () =>
              text(badge()?.closest('.agent-row')?.querySelector('.list-row-main strong')) ===
              facts['defaultAgent.targetName'],
          )
          facts['defaultAgent.badgeMovesToTarget'] = marked
          // ★ 单选：设完之后「默认」徽章**只有一个**，而且没有"取消默认"这种东西
          facts['defaultAgent.badgeStillExactlyOne'] =
            d().querySelectorAll('.agent-list .default-badge').length === 1
          facts['defaultAgent.noCancelAfterSet'] = cancelBtns().length === 0
          facts['defaultAgent.targetHasNoToggle'] = !targetRow.querySelector('.default-toggle')

          // ★ 端到端：建任务那一栏里预选的就是它
          // ⚠️ 2026-10（D58 第二步）：表单住进「任务」页右栏之后，等的东西也变了——
          //    要等**那一栏里的**表单画出来（原来等的是"页面上有 select"，而任务页
          //    的列表/看板上也有 select 之类的东西，等到的是谁并不确定）。
          f.contentWindow.location.hash = '#/tasks/new'
          const ntReady = await until(
            () => !!d().querySelector('.detail-pane .create-body .newtask-form select'),
            60,
          )
          await wait(500)
          // ⚠️ 限定在**那张表单**里找（原来是在整页的 select 里找第一个带「（默认）」的）。
          const lead = ntReady ? d().querySelector('.detail-pane .create-body .newtask-form') : null
          const select = lead
            ? [...lead.querySelectorAll('select')].find((sel) =>
                [...sel.options].some((o) => (o.textContent ?? '').includes('（默认）')),
              )
            : null
          facts['defaultAgent.optionMarked'] = !!select
          facts['defaultAgent.selectListsOnlyExecutors'] = need('选择器里的选项', () => {
            const sel = select ?? (lead ? lead.querySelector('select') : null)
            if (!sel) return null
            return [...sel.options].every((o) => !(o.textContent ?? '').includes('（审核）'))
          })
          facts['defaultAgent.preselected'] = need('建任务那一栏预选的 agent', () => {
            const sel = select ?? (lead ? lead.querySelector('select') : null)
            if (!sel) return null
            const chosen = sel.options[sel.selectedIndex]
            return chosen ? (chosen.textContent ?? '').replace('（默认）', '').trim() : null
          })
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 顶栏：页名 + 这一页的动作 + 与页面无关的那几个 ══════════════
        //
        // 三个页面各量一遍（任务 / 智能体 / 工具），每个页面问六件事：
        //   ① 顶栏左边写着**这一页的名字**，而且与侧栏那一项**是同一句话**
        //   ② 动作**只属于这一页**——上一页的按钮一个都不许留下
        //   ③ `⋯` 在宽屏下不出现（动作直接平铺）
        //   ④ 顶栏恒为一行、不横向溢出：它的高度被 `.shell` 的
        //      `calc(100vh - var(--topbar-h))` 用着，一旦换行整个布局就错位
        //   ⑤ ★ 动作**紧跟着页名**（靠左），而在最右边的是与页面无关的那几个
        //      （语言 / 通知 / 登录 / 设置）——"这一页 + 这一页能做什么"是一句话，
        //      隔着一千多像素就变成两件不相干的事了
        //   ⑥ ★ 顶栏里的按钮**一种尺寸**，而且**当前模式看得出来**
        //      （`.active` 曾经是死类名：界面上根本没有它的样式，于是「列表 / 看板」
        //      两个按钮长得一模一样，使用者看不出自己在哪一个模式里）
        //
        // ⚠️ 期望值是**逐页写死**的，不写成"数量 > 0"：这一段的全部意义就是
        //    "按钮跟着页换"，只数个数的话，五个页面全显示同一排按钮也能过。
        facts['topbar.pageName'] = {}
        facts['topbar.actions'] = {}
        facts['topbar.oneLine'] = {}
        facts['topbar.overflowPx'] = {}
        facts['topbar.moreHiddenWide'] = {}
        facts['topbar.actionsLeftOfTitleRight'] = {}
        facts['topbar.actionsAtSidebarEdge'] = {}
        facts['topbar.actionGapPx'] = {}
        facts['topbar.buttonHeights'] = {}
        facts['topbar.trackHeight'] = {}
        facts['topbar.activeModeVisible'] = {}
        for (const [tpHash, tpName, tpWant] of [
          // ★ 2026-10（D58）：主操作排在最前（它就是「新建任务」——侧栏那一项
          //   并进了这一页），顺序也钉住。
          ['#/tasks', '任务', ['新建任务', '列表', '看板', '刷新']],
          ['#/agents', '智能体', ['新建智能体', '设置', '刷新']],
          ['#/tools', '工具', ['安装工具', '刷新']],
        ]) {
          f.contentWindow.location.hash = tpHash
          // ⚠️ 等到**地址真的生效**再量：`hashchange` 晚一拍，而页名在"建任务"
          //    与"任务"两种状态下都是「任务」⇒ 只等页名会立刻通过，量到的却是
          //    上一页的状态（实测踩过：那边还在建任务，于是被标成"当前"的按钮有 2 个）。
          await until(() => f.contentWindow.location.hash === tpHash, 40)
          const tpHere = await until(() => text(d().querySelector('.page-name')) === tpName, 60)
          if (!tpHere) errors.push(`顶栏页名：切到 ${tpHash} 之后没等到「${tpName}」`)
          const tpBar = d().querySelector('.topbar')
          facts['topbar.pageName'][tpHash] = need(`顶栏页名（${tpHash}）`, () =>
            text(d().querySelector('.page-name')),
          )
          // ① 与侧栏那一项对齐：两处各写一份文案迟早会不一样，所以这里钉住"同一句话"
          facts[`topbar.sameAsSidebar${tpHash}`] = need(`侧栏选中项（${tpHash}）`, () => {
            const active = d().querySelector('.sidebar .nav-item.active .nav-title')
            return active ? text(active) : null
          })
          // ② 动作清单：顺序也要对（顺序就是按钮顺序）
          facts['topbar.actions'][tpHash] = [
            ...d().querySelectorAll('.topbar .page-actions button'),
          ].map((b) => text(b))
          if (JSON.stringify(facts['topbar.actions'][tpHash]) !== JSON.stringify(tpWant)) {
            errors.push(
              `顶栏动作（${tpHash}）：${JSON.stringify(facts['topbar.actions'][tpHash])} ≠ ${JSON.stringify(tpWant)}`,
            )
          }
          // ③ 宽屏不该出现 `⋯`
          facts['topbar.moreHiddenWide'][tpHash] = need(`⋯（${tpHash}）`, () => {
            const more = d().querySelector('.page-more')
            return more ? cs(more).display === 'none' : null
          })
          // ④ 一行 + 不溢出
          facts['topbar.oneLine'][tpHash] = need(`顶栏高度（${tpHash}）`, () => {
            const want =
              parseFloat(cs(d().documentElement).getPropertyValue('--topbar-h')) *
              parseFloat(cs(d().documentElement).fontSize)
            return (
              tpBar.clientHeight === tpBar.scrollHeight &&
              Math.round(tpBar.getBoundingClientRect().height) <= Math.round(want) + 1
            )
          })
          facts['topbar.overflowPx'][tpHash] = need(`顶栏溢出（${tpHash}）`, () =>
            Math.max(0, tpBar.scrollWidth - tpBar.clientWidth),
          )
          // ⑤ 动作的**左缘与侧栏右缘对齐**（= 与主区内容共一条竖线），全局那组在最右
          //
          // ⚠️ 动作区在窄屏是 `display: none`，那时它的矩形是**退化的 0×0**（在
          //    父元素左上角），量出来的"间距"会是一个负数而看着像布局错了。
          //    所以这里先问"它这一档宽度下在不在"，不在就不量这一条。
          const actsVisible = (() => {
            const el = d().querySelector('.page-actions')
            return !!el && cs(el).display !== 'none' && el.getBoundingClientRect().width > 0
          })()
          facts['topbar.actionGapPx'][tpHash] = !actsVisible
            ? null
            : need(`页名与动作的间距（${tpHash}）`, () => {
                const name = d().querySelector('.page-name')?.getBoundingClientRect()
                const acts = d().querySelector('.page-actions')?.getBoundingClientRect()
                if (!name || !acts) return null
                return Math.round(acts.left - name.right)
              })
          facts['topbar.actionsAtSidebarEdge'][tpHash] = !actsVisible
            ? null
            : need(`动作左缘与侧栏右缘（${tpHash}）`, () => {
                const acts = d().querySelector('.page-actions')?.getBoundingClientRect()
                const side = d().querySelector('.sidebar')?.getBoundingClientRect()
                if (!acts || !side) return null
                // 顶栏与 `.shell` 共用同一个 `grid-template-columns`，动作的左缘
                // **在结构上**就该等于侧栏的右缘；允许 1px 取整误差。
                // ⚠️ 页名长短不该影响它：这一条量的是"对齐"，不是"间距"。
                return Math.abs(acts.left - side.right) <= 1
              })
          facts['topbar.actionsLeftOfTitleRight'][tpHash] = !actsVisible
            ? null
            : need(`动作与全局那组的位置关系（${tpHash}）`, () => {
                const acts = d().querySelector('.page-actions')?.getBoundingClientRect()
                const glob = d().querySelector('.global-actions')?.getBoundingClientRect()
                const bar = tpBar.getBoundingClientRect()
                if (!acts || !glob) return null
                /**
                 * ⚠️ 不能写成"动作在左半边"：1440px 下动作到 300px 左右，条件太松。
                 *    真正要钉的是**两组的相对关系**：动作整段在全局那组左边，
                 *    而且动作的右缘离顶栏右缘还有一大截（它没被推到右边去）。
                 */
                return acts.right < glob.left && bar.right - acts.right > bar.width * 0.3
              })
          // ⑥ 两档尺寸（工具条里的格子 / 工具条外的常驻控件）+ 激活态看得出来
          //
          // ⚠️ 2026-10（D59）：这一排改成了**一条工具条**，所以"整条带子上只有一种
          //    按钮高度"这条老判据不再成立——工具条的**轨道**与常驻控件同高（30），
          //    轨道里的**格子**矮一档（24），那是嵌套关系。分开量两组，两组的内部
          //    都必须齐：一组不齐仍然是"加一个按钮就把这排弄歪"。
          facts['topbar.buttonHeights'][tpHash] = need(`顶栏按钮高度（${tpHash}）`, () => {
            // ⚠️ 按**矩形高度 > 0** 过滤，不能只看 `display`：父元素 `display: none`
            //    时子元素的 computed display 仍然是 `inline-flex`，它会带着一个
            //    0px 的矩形混进来（自查脚本第一次跑就被这个骗了，报"高度不齐 30/0"）。
            const h = (b) => Math.round(b.getBoundingClientRect().height)
            const cells = [...d().querySelectorAll('.topbar .page-actions button')]
              .filter((b) => b.getBoundingClientRect().height > 0)
              .map(h)
            const others = [...d().querySelectorAll('.topbar button')]
              .filter((b) => !b.closest('.page-actions') && b.getBoundingClientRect().height > 0)
              .map(h)
            return { cells: [...new Set(cells)], others: [...new Set(others)] }
          })
          // 轨道的高度：它要与常驻控件同高（"这一条带子上的节奏"）
          facts['topbar.trackHeight'][tpHash] = need(`工具条轨道高度（${tpHash}）`, () => {
            const el = d().querySelector('.topbar .page-actions')
            return el ? Math.round(el.getBoundingClientRect().height) : null
          })
          facts['topbar.activeModeVisible'][tpHash] = need(`当前模式的标记（${tpHash}）`, () => {
            const btns = [...d().querySelectorAll('.topbar .page-actions button')]
            const on = btns.filter((b) => b.classList.contains('active'))
            /**
             * ⚠️ 只有任务页有"当前模式"这个概念（列表 / 看板）。另外两页一个
             *    `active` 都没有是**正常的**，不能算通过也不能算不通过——返回一个
             *    显式的"不适用"，`run.mjs` 那边按它放行。含糊地返回 true 会让这
             *    一条在多数页面上变成一句空话。
             */
            if (on.length === 0) return '不适用（这一页没有"当前模式"）'
            if (on.length !== 1) return `有 ${on.length} 个被标成当前`
            /**
             * ⚠️⚠️ 比对的**必须是同一种 kind 的旁边那一格**，不能是"随便找个没标
             *    active 的"：这一排里第一颗是**主操作**（强调色文字），拿它当基准的
             *    话，"当前那颗有没有底色"永远成立——实测踩过：我把 `.active` 的实心
             *    底整条删掉，这条检查**照样绿**（差异来自主操作那一颗的颜色）。
             *    同一 kind = 形状本该一样、只有状态不同，那才是要量的事。
             */
            const kindOf = (b) =>
              [...b.classList]
                .filter((c) => c !== 'active')
                .sort()
                .join(' ')
            const peer =
              btns.find((b) => !b.classList.contains('active') && kindOf(b) === kindOf(on[0])) ??
              btns.find((b) => !b.classList.contains('active'))
            if (!peer) return '所有按钮都被标成当前'
            const a = cs(on[0])
            const b = cs(peer)
            // 背景或文字色至少有一处不一样，否则"当前"是看不见的
            return a.backgroundColor !== b.backgroundColor || a.color !== b.color
          })
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 语言切换（D39）══════════════
        //
        // ⚠️ 这一段必须放在**最后**：前面所有检查都断言中文，切成英文会让它们全红。
        //    测完切回中文，保证探针结束时状态与开始时一致。
        //
        // ★ 2026-10：语言切换器 2026-09 已从顶栏撤进**设置抽屉**（顶栏那份撤了——
        //   "不是常用设置"）。探针原来量 `.topbar select`，那早已不存在，这一组
        //   一直全红。改为：打开设置抽屉 → 取抽屉里 value 是 'zh'/'en' 的那个
        //   select（其它 select 的 value 不是 locale 码，不会误取）。
        f.contentWindow.location.hash = '#/agents'
        await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
        await wait(300)
        {
          // ⚠️ 必须点**全局**那组的设置（`openDrawer.set('settings')`）：agents
          //   页的「设置」开的是 WorkspaceSettings（第一句话模版），**没有语言
          //   切换器**——语言段 2026-09 起在全局 SettingsDrawer 里。全局组里
          //   inbox 和 settings 都是 icon-btn，按 aria-label 区分。
          const openBtn = [
            ...d().querySelectorAll('.topbar .global-actions button.icon-btn'),
          ].find((b) => (b.getAttribute('aria-label') ?? '') === '设置')
          if (openBtn) {
            click(openBtn)
            await wait(1500)
          } else {
            errors.push('语言组：全局设置按钮（icon-btn）找不到（抽屉打不开，语言切换量不到）')
          }
        }
        const langSelectOf = () =>
          [...d().querySelectorAll('.drawer select')].find(
            (s) => ['zh', 'en'].includes(s.value),
          ) ?? null
        const langSelect = langSelectOf()
        facts['lang.switchPresent'] = !!langSelect
        facts['lang.defaultIsZh'] = langSelect ? langSelect.value : null
        /**
         * ⚠️ 量的是**「新建任务」那一项**，不是"第一项"。
         *
         * 原来这里写的是 `.sidebar .nav-title` 的**第一个**——加「聊天」之后
         * 第一项变成了聊天，这三条当场变红。那不是它们要报的事：这三条问的是
         * "界面语言真的切了吗"，与侧边栏顺序无关。按**文字**去取那一项，
         * 以后再加视图也不会误报。
         */
        const langNavItem = (label) =>
          [...d().querySelectorAll('.sidebar .nav-title')].find((el) => text(el) === label) ?? null
        // ⚠️ 2026-10（D58）：取样点从「新建任务」换成「任务」——前者已不是导航项
        //    （合并进「任务」了）。这一条问的是"界面语言真的切了吗"，与取样哪一项无关。
        facts['lang.navBefore'] = need('切换前的导航文字', () => {
          const el = langNavItem('任务')
          return el ? text(el) : null
        })

        if (langSelect) {
          // ⚠️ 同下：切 en 的瞬间抽屉还没重渲染，旧引用仍有效；但为对称起见
          //    也重新取一次（万一前面的 wait 已经让抽屉刷过一遍）。
          const langSelectEn = langSelectOf()
          if (langSelectEn) {
            langSelectEn.value = 'en'
            langSelectEn.dispatchEvent(new Event('change', { bubbles: true }))
          } else {
            errors.push('语言组：切换时抽屉里的语言 select 不见了')
          }
          // 英文生效：导航文字与顶栏按钮都变成英文
          const switched = await until(() => langNavItem('Tasks') !== null, 40)
          facts['lang.switchedToEn'] = switched
          facts['lang.navAfter'] = need('切换后的导航文字', () => {
            const el = langNavItem('Tasks')
            return el ? text(el) : null
          })
          facts['lang.settingsLabel'] = need('顶栏「设置」按钮', () => {
            /**
             * ⚠️ 必须点名 `.global-actions`（2026-09 顶栏改版之后加的那一层）。
             *    **智能体页那个「设置」按钮在英文下同样叫 `Settings`**，而页面动作
             *    就在同一格里（`/agents` 页那个「设置」）——
             *    按钮在英文下同样叫 `Settings`**——按文字在全条顶栏里找，找到的
             *    很可能是页面那个，于是这条就变成了"页面动作翻译了吗"，而它问的是
             *    "与页面无关的那个设置按钮翻译了吗"。
             *    ★ 2026-10：全局那组 2026-09 起是**图标按钮**（SVG，无文字），
             *      文字 `text() === 'Settings'` 永远匹配不到——改按 `aria-label`
             *      量（读屏器拿到的就是它，翻译的正是这一份）。
             */
            const b = [
              ...d().querySelectorAll('.topbar .global-actions button.icon-btn'),
            ].find((x) => (x.getAttribute('aria-label') ?? '') === 'Settings')
            return b ? 'Settings' : null
          })
          // ★ 契约值**不翻译**：动作名、runtime key 这些仍然是机器值。
          //
          //   ⚠️ 这条原来在 **Skills 页**上量：那张表里有一列「允许的动作」，值就是
          //      `comment.create`。D40 收口把动作从 skill 搬到了**审核者**身上
          //      （`Agent.allowedActions`）之后，那一列整列没有了——量点跟着搬到了
          //      审核者详情里的「行动权限」那一行，值仍然是原样的
          //      `<code>comment.create</code>`。
          //
          //      改的是**它现在在哪一段**、以及**哪一个具体的动作名**，判据一点没
          //      放宽：仍然要求英文界面下这个机器值一字不差地出现在页面上（而不是
          //      被当成文案翻掉）。
          //
          //   ⚠️ D41 把量点从 `comment.create` 换成了 `probe-tool.append-note`：
          //      前者已经不是任何动作了（内置动作整组被移除），而后者是探针自己
          //      在**同一个审核者**身上、走真实写入口刚勾上去的那个工具动作
          //      （见上面那条端到端）。所以这一条量的是一个**确实存在的契约值**，
          //      不是一条老数据里可能碰巧留着的字符串。
          //   ⚠️ 2026-09 三次改：勾了 append-note 的是 `探针用的老标准详情审核者`
          //      （[审核标准] 段在它身上走的真实保存），所以这里按名字选它，不再
          //      拿"第一个审核者"——首启那个审核员现在没有动作（判据纯文字）。
          f.contentWindow.location.hash = '#/agents'
          await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
          await wait(300)
          const reviewerRowEn = [...d().querySelectorAll('.agent-row')].find((row) =>
            (row.textContent ?? '').includes('探针用的老标准详情审核者'),
          )
          if (reviewerRowEn) click(reviewerRowEn.querySelector('.list-row-main'))
          await until(() => !!d().querySelector('.card.agent-card'), 60)
          await wait(300)
          // 先记一个"详情真的渲染出来了"的基数（否则下面那条会空过）
          facts['lang.detailRowsInEn'] = d().querySelectorAll('.card.agent-card .cell').length
          facts['lang.contractValuesUntranslated'] = (() => {
            const detail = d().querySelector('.card.agent-card')
            if (!detail) return false
            const codes = [...detail.querySelectorAll('.field-row code')].map((c) => text(c))
            return codes.includes('probe-tool.append-note')
          })()

          // ── 阶段文案也跟着语言走（列头 / 短标签 / 行内提示） ──
          //   ★ 这一块是对"**推导层只给文案键**"的端到端验收：`stageOf` 返回的是
          //     `noteId`/`warningId`，列定义给的是 `titleId`/`hintId`，句子的中英
          //     两版都在词条表里。只要有一处还写着中文硬编码，这里就红。
          f.contentWindow.location.hash = '#/tasks'
          // ★ 先等**任务视图真的挂上**，再找「列表/看板」那对按钮。
          //   第一次跑就是漏了这一步：设完 hash 立刻找按钮，那时页面还是 Skills，
          //   于是"切回列表"没发生；而视图模式**存在 localStorage 里**（前面看板

          //   `—`，看起来像"选择器改了"，其实是探针自己的状态没整理。
          //
          //   ⚠️ 判据不能用 `.list-pane, .board`：**智能体页的左栏也叫 `.list-pane`**，
          //      所以从智能体页过来时它在"还没切过去"的那一刻就已经命中（这一节
          //      前一版停在 Skills 页，那个选择器只是**碰巧**对）。按任务视图独有的
          //      「列表/看板」切换按钮等，才是"任务视图在不在"。
          await until(
            () =>
              [...d().querySelectorAll('button')].some((b) =>
                ['List', 'Board'].includes(b.textContent.trim()),
              ),
            60,
          )
          const toListFirst = [...d().querySelectorAll('button')].find(

          facts['lang.modeBeforeInEn'] = need('进任务视图时的模式', () =>

          if (toListFirst) {

          }
          const gotRowsEn = await until(

          facts['lang.taskRowsInEn'] = gotRowsEn
          if (gotRowsEn) {
            facts['lang.stageShort'] = need('英文界面下的阶段短标签', () =>

            facts['lang.stageNote'] = need('英文界面下的行内提示', () =>

          const toBoardEn = [...d().querySelectorAll('button')].find(

          facts['lang.boardButtonInEn'] = !!toBoardEn
          if (toBoardEn) {
            click(toBoardEn)
            await until(() => d().querySelectorAll('.column').length > 0, 40)
            // `h4` 里是「标题 + 计数 + 说明」三段，只取**标题**那一段：读整个 `h4`

            facts['lang.boardColumnsInEn'] = [...d().querySelectorAll('.column h4')].map((h) =>

            //   （或同一轮后面的）断言去 `.list-pane .task-row` 上抓不到任何东西。
            const backToList = [...d().querySelectorAll('button')].find(
              (b) => b.textContent.trim() === 'List',
            )
            if (backToList) {
              click(backToList)
              await until(() => d().querySelectorAll('.list-pane .task-row').length > 0, 40)
            }
            facts['lang.backToListInEn'] = !!backToList
          }

          // 切回中文，并以服务端为准确认它记住了
          // ⚠️ 用 `langSelectOf()` 重新取：切到 en 之后抽屉因 locale 重渲染，
          //    旧的 `langSelect` 引用可能已脱离 DOM（探针第一次跑就栽在这）。
          const langSelectZh = langSelectOf()
          if (!langSelectZh) errors.push('语言组：切回中文时抽屉里的语言 select 不见了')
          else {
            langSelectZh.value = 'zh'
            langSelectZh.dispatchEvent(new Event('change', { bubbles: true }))
          }
          // ⚠️ 这里原来等的是 `.sidebar .nav-title` 的**第一项**等于「新建任务」——
          //    加「聊天」之后第一项就是聊天，那条等待**永远超时**（每次白烧 10s 虚拟时间）。
          //    D58 又把「新建任务」从导航里去掉了，所以改成"按文字找那一项"（与上面
