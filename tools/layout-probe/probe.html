<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>agentdeck layout probe</title>
    <style>
      html, body { margin: 0; background: #111; color: #eee; font: 12px/1.5 monospace; }
      iframe { width: 1280px; height: 880px; border: 0; display: block; }
      pre { margin: 0; padding: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      ══════════════════════════════════════════════════════════════════
      界面布局探针：它为什么存在
      ══════════════════════════════════════════════════════════════════

      `tsc`/`svelte-check` 看不见布局：类名写对了、模板结构合法，但
      "两栏有没有并排"、"窄屏返回按钮有没有出现"、"`.main:has(> .split-layout)`
      有没有真的生效"这些只有**浏览器量得出来**。改布局时靠"我看着像对"
      是不够的——这个项目里已经有过两次"接口都在、就是没接线"的缺陷。

      于是：把**真应用**放进同源 iframe，用**真实点击**驱动它，把
      `getComputedStyle` 的结果写进自己的 DOM，再由 `run.mjs` 用
      `chrome --dump-dom` 抓回去断言。探针只上报**事实**，期望值全在
      `run.mjs` 里——"量"和"判"分开，改了期望不必动这里。

      ⚠️ 它**基本不造 run**：造 run 就会去调真的 CLI（NFR-T-01 的底线）。所以它验的是
         **布局与结构**，不是"跑起来之后长什么样"。唯一的例外是「新建任务的三步链」
         那一组：那里要证明"界面上选的"与"发出去的请求体"是同一件事，只有真的点一次
         「创建并派发」、再从接口上把那条 run 读回来才做得到。那两条 run 用的
         runtime 是 `generic`（命令 `agent-cli` 不存在）⇒ 它们会立刻失败，**不会**
         拉起任何一个真实的模型去干活（见 `run.mjs` 里造那个夹具 agent 的说明）。
    -->
    <iframe id="f" src="/#/agents"></iframe>
    <pre id="out">pending</pre>
    <script>
      const f = document.getElementById('f')
      const facts = {}
      const errors = []
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      const d = () => f.contentDocument
      const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : null)

      /**
       * ══════════════════════════════════════════════════════════════════
       * ★ 2026-10（探针加固）：拿不到元素**不许把整趟打死**
       * ══════════════════════════════════════════════════════════════════
       *
       * 原来 `cs(el)` / `click(el)` 直接就把 `el` 用出去，`el === null` 时抛
       * TypeError 一路穿到 `main()` 外面 ⇒ **后面每一段都没量**。报告里于是出现
       * 500 多条"没量到这个值（选择器可能改了）"，而真因只有一个，藏在第一个异常里
       * ——排查它要一次次重跑（这一趟就是被 `.detail-pane .back` 那个已经不存在的
       * 按钮打死的）。
       *
       * 现在的规矩：**拿不到值就记一条、继续往下量**。一次跑完能看到全部问题，
       * 而不是"修一个冒一个"。
       */
      const seenNotes = new Set()
      function note(message) {
        if (seenNotes.has(message)) return
        seenNotes.add(message)
        errors.push(message)
      }

      /** 计算样式；元素不在时给空对象（读到的字段是 undefined ⇒ 那条断言红，正是要的）。 */
      function cs(el) {
        if (!el) {
          note('getComputedStyle：目标元素不存在（选择器可能改了）')
          return {}
        }
        return f.contentWindow.getComputedStyle(el)
      }

      /**
       * 智能体详情**卡片里每一格的小标题**。
       *
       * ⚠️ 2026-10 起智能体详情只有**一个态、一张卡片**（选中即编辑）：旧的
       *    `.detail .section h3`（查看态的段落标题）与 `.detail .field-row .row-label`
       *    都不存在了，段落身份由 `.cell > .cell-label` 表示。多处断言要问"这一页
       *    有哪些段"，所以只在这里定义一次——各段各写一遍选择器，改一次界面就要
       *    改十几处（而且会漏）。
       */
      function agentCellLabels(root) {
        const scope = root ?? d()
        return [...scope.querySelectorAll('.card.agent-card .cell')].map((cell) => {
          // ⚠️ 有的格用小标题元素（`<div class="cell"><span class="cell-label">…`），
          //    有的是 `<label class="cell">标题<textarea …>`（「指令」那一格就是）。
          //    只认 `.cell-label` 会把「指令」这一格整个漏掉——它恰恰是判断依据的
          //    唯一出处，漏掉它会让"这一页有哪些格"这件事量错（踩过）。
          const label = cell.querySelector('.cell-label')
          if (label) return text(label)
          const own = [...cell.childNodes].find(
            (n) => n.nodeType === 3 && (n.textContent ?? '').trim() !== '',
          )
          return own ? (own.textContent ?? '').trim() : null
        })
      }

      function publish(done) {
        document.getElementById('out').textContent = JSON.stringify({ errors, facts, done }, null, 1)
      }

      /** 轮询等待条件成立；拿不到就返回 false（调用方自己记一条 error）。 */
      async function until(fn, tries = 100) {
        for (let i = 0; i < tries; i++) {
          try {
            if (fn()) return true
          } catch {}
          await wait(150)
        }
        return false
      }

      /**
       * ★★★ 不用时钟的等待（2026-10-21，踩过一次大坑）。
       *
       * ══════════════════════════════════════════════════════════════════
       * 为什么"跑着"那一屏不能用 `until()` 等
       * ══════════════════════════════════════════════════════════════════
       *
       * 探针是拿 `chrome --virtual-time-budget` 跑完之后 --dump-dom 收结果的。实测（三组
       * 对照实验，`/tmp/sse*.mjs`）：**只要页面里有一个没结束的 fetch（SSE 就是），
       * Chrome 的虚拟时钟就完全不走** —— 连 `setInterval` 的 tick 都是 0，
       * 而虚拟时间预算因此永不到期：dump **永远写不出来**，整个探针挂到超时。
       *
       * 而"审核跑着"那一屏恰恰就是"开着一条 SSE"（`RunLog` 订阅 run 事件流）。
       * 所以那一段的等待只能靠**DOM 变化**（MutationObserver 在微任务里回调，
       * 不依赖时钟），等完之后还必须让这条流**关掉**（点取消 ⇒ run 落终态 ⇒ 流自己结束；
       * 再兜一层：切换路由把这个组件卸载掉），否则后面整页都醒不过来。
       *
       * `maxEvents` 是**故意的上界**：真等到没有变化了也不无限等——宁可让判据变红，
       * 也不要一个挂十分钟、什么都看不出来的探针。
       */
      /**
       * ★★★ 时钟冻结时的"心跳"：用一次**真网络往返**代替 `wait()`。
       *
       * 上面解释了"SSE 开着时虚拟时钟不走"。但**网络请求照样完成**——所以拿一次轻量
       * 的 GET 当节拍器，就能在流开着的时候做有上界的轮询（既不挂死，也不会无限等）。
       */
      async function untilNet(fn, tries = 60) {
        for (let i = 0; i < tries; i++) {
          try {
            if (fn()) return true
          } catch {}
          try {
            await fetch('/api/agents', { cache: 'no-store' })
          } catch {}
        }
        return false
      }

      async function untilDom(fn, maxEvents = 80) {
        for (let i = 0; i < maxEvents; i++) {
          try {
            if (fn()) return true
          } catch {}
          const changed = await new Promise((resolve) => {
            const target = d().documentElement
            if (!target) {
              resolve(false)
              return
            }
            const mo = new MutationObserver(() => {
              mo.disconnect()
              resolve(true)
            })
            mo.observe(target, { subtree: true, childList: true, characterData: true })
          })
          if (!changed) return false
        }
        return false
      }

      function click(el) {
        if (!el) {
          note('click：目标元素不存在（选择器可能改了）')
          return false
        }
        el.dispatchEvent(
          new MouseEvent('click', { bubbles: true, cancelable: true, view: f.contentWindow }),
        )
        return true
      }

      function need(name, fn) {
        try {
          const v = fn()
          if (v === undefined) errors.push(`${name}：拿不到值`)
          return v
        } catch (e) {
          errors.push(`${name}：${e && e.message ? e.message : e}`)
          return null
        }
      }

      async function main() {
        await new Promise((r) => f.addEventListener('load', r, { once: true }))

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 智能体：主从布局 ══════════════
        // 首启会播种一对 agent（一个执行、一个审核），所以这里等得到卡片；
        // 等不到就说明界面或接口坏了——那本身就是要报出来的事。
        const gotCards = await until(() => d().querySelectorAll('.list-row-main').length > 0)
        const cards = () => [...d().querySelectorAll('.list-row-main')]
        facts['agents.gotData'] = gotCards
        if (!gotCards) errors.push('智能体页等了 15 秒也没出现任何 .list-row-main（数据没到或列表没渲染）')

        facts['agents.cardCount'] = cards().length

        // ★★ 内置起草者 / 内置 skill 审核者那一行：角色徽标要说出它们是谁（§9/D81、§10/D82）。
        //    ⚠️ 这一条是**改出来才发现**的：列表原先写的是 `role === 'reviewer' ? 审核 : 执行`，
        //    加了 `drafter` / `skill-reviewer` 之后，它们被标成**「执行」**——一个永远不会
        //    接任务的 agent 看起来像执行者。判据用**名字**定位那一行（内置 agent 的名字由
        //    平台给，使用者能改的是指令不是名字的用途），再量徽标文字。
        {
          const rowOf = (needle) =>
            cards().find(
              (c) => (c.querySelector('strong')?.textContent ?? '').includes(needle),
            ) ?? null
          const drafterRow = rowOf('起草者')
          facts['agents.drafterRowFound'] = !!drafterRow
          facts['agents.drafterRowBadge'] = drafterRow
            ? (drafterRow.querySelector('.badge')?.textContent ?? '').trim()
            : null
          const skillAuditorRow = rowOf('Skill 审核者')
          facts['agents.skillAuditorRowFound'] = !!skillAuditorRow
          facts['agents.skillAuditorRowBadge'] = skillAuditorRow
            ? (skillAuditorRow.querySelector('.badge')?.textContent ?? '').trim()
            : null
        }
        // 每张卡都要有：名字、角色徽章、一行说明（指令摘要 + 关系/技能/runtime 两部分）
        // ★ 2026-10（紧凑性）：原先是**两行**说明（`.agent-note` × 2，各占一行），
        //   使用者要求合并成一行——所以这里改量 `.agent-notes` 里的两个子 span。
        facts['agents.everyCardWellFormed'] =
          cards().length > 0 &&
          cards().every(
            (c) =>
              !!c.querySelector('strong') &&
              !!c.querySelector('.badge') &&
              !!c.querySelector('.agent-notes-trunc') &&
              !!c.querySelector('.agent-notes-meta'),
          )
        facts['agents.executorShowsReviewer'] = need('执行者卡片上的审核者', () => {
          const exec = cards().find((c) => c.textContent.includes('执行'))
          return exec ? text(exec.querySelector('.agent-notes-meta')) : null
        })

        const layout = () => d().querySelector('.split-layout')
        const main = () => d().querySelector('main.main')

        facts['agents.initialClass'] = need('初始 class', () => layout()?.className)
        facts['agents.initialListDisplay'] = need('初始左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.initialDetailDisplay'] = need('初始右栏', () =>
          cs(d().querySelector('.detail-pane')).display,
        )
        // `:has(> .split-layout)` 那条规则若失效，整页会变成"外层滚动"而不是
        // 两栏各自滚动——类型检查完全看不出来，所以这里量出来。
        facts['agents.mainOverflowY'] = need('main overflow-y', () => cs(main()).overflowY)
        facts['agents.mainPaddingTop'] = need('main padding-top', () => cs(main()).paddingTop)
        facts['agents.layoutHeightDelta'] = need('布局高度 vs main 高度差', () =>
          Math.round(layout().getBoundingClientRect().height - main().clientHeight),
        )

        // ── 真点击第一条 ──
        click(cards()[0])
        const entered = await until(() => layout()?.className.includes('with-detail'))
        if (!entered) errors.push('点了第一条 agent 之后 .split-layout 没有带上 with-detail')
        facts['agents.afterClickClass'] = need('点击后 class', () => layout()?.className)
        facts['agents.tracks'] = need('两栏宽度', () => cs(layout()).gridTemplateColumns.split(' '))
        // ⚠️ 选中态挂在 `.agent-row`（那一行才是卡片：边框要包住右侧的开关），
        //    所以这里按**行**取，再确认它里面确实是刚点的那张卡
        facts['agents.activeCardClass'] = need('选中态', () =>
          d().querySelector('.agent-row.active')?.className.replace(/ svelte-\w+/, ''),
        )
        // ⚠️ 2026-10（使用者拍板）：智能体**没有预览页了**——选中即编辑，右栏
        //    进来就是一张可编辑卡片（与智能体组页同款）。原来这里认的是
        //    `.detail-pane .detail`（查看态那套 DOM），那一整套随改造删掉了。
        facts['agents.detailRendered'] = need('右栏是否渲染出详情（可编辑卡片）', () =>
          !!d().querySelector('.detail-pane .card.agent-card'),
        )
        // ★ 这三条钉的就是"没有查看/编辑两态"这个决定：右栏没有 hero 头、
        //   页面上没有「编辑」按钮、卡片里就是能改的控件。
        facts['agents.detailNoHero'] = need('没有 hero 头', () =>
          !d().querySelector('.detail-pane .hero'),
        )
        facts['agents.detailNoEditButton'] = need('没有「编辑」按钮', () =>
          ![...d().querySelectorAll('.detail-pane button')].some(
            (b) => text(b).trim() === '编辑',
          ),
        )
        facts['agents.detailEditableInPlace'] = need('卡片里就是可编辑的控件', () =>
          !!d().querySelector('.detail-pane #agent-instructions') &&
          !!d().querySelector('.detail-pane .role-picker .role-card'),
        )
        facts['agents.detailHeading'] = need('右栏标题（单态卡片里就是名字输入框的值）', () =>
          String(d().querySelector('.detail-pane #agent-name')?.value ?? ''),
        )
        // ── D69.15 标题统一（**只对还有栏头 hero 的页面成立**）：智能体页
        //    2026-10 起没有预览页头了，这条在智能体页退化成"没有 hero"这一事实
        //    （栏头标题的统一由任务/聊天那两条继续钉着）。
        facts['heads.agentsHeadTitleFs'] = need('智能体栏头标题字号 fs-lg', () => {
          const h2 = d().querySelector('.detail-pane .hero h2')
          return h2 ? cs(h2).fontSize === '17px' : 'NO-HERO'
        })
        // ── D69.15.2 风格一致：hero 必须**通栏**（hero 在 pane-body 里，负边距
        //    抵消留白——分隔线横贯整栏、与任务/聊天栏头同位置；否则缩在 24px
        //    留白里窄 48px）。
        facts['heads.agentsHeroFullBleed'] = need('智能体 hero 通栏', () => {
          const hero = d().querySelector('.detail-pane .hero')
          const pane = d().querySelector('.detail-pane')
          if (!hero || !pane) return 'NO-HERO'
          const a = hero.getBoundingClientRect()
          const b = pane.getBoundingClientRect()
          return Math.abs(a.left - b.left) <= 1 && Math.abs(a.top - b.top) <= 1
        })
        // ── D69.15.2 风格一致：角色提示小字 14px（曾用 `small` 12px，比任务/
        //    聊天的副题元信息小一圈）
        facts['heads.agentsRoleHintFs'] = need('智能体角色提示字号 14px', () => {
          const hint = d().querySelector('.detail-pane .hero .role-line .faint')
          return hint ? cs(hint).fontSize === '14px' : 'NO-HINT'
        })
        // ── runtime 选择器：选项必须来自身份接口，不是写死两项 ──
        //
        //   加一个 runtime = 描述表一行 + 适配器包 + 装配表一行。若界面写死
        //   选项，那个 runtime 就**只有直接调接口才选得到**——"接口支持、界面
        //   没有入口"是这个仓库最常见的那类缺陷。
        // ⚠️ 这一段原来要**先点「编辑」**才量得到 runtime 选择器。2026-10 起
        //    没有两态了 ⇒ 选择器直接在卡片里，不需要任何前置点击（点了也点不到，
        //    「编辑」按钮已经不存在——那正是上面 `detailNoEditButton` 量的事）。
        const editBtn = null
        facts['agents.editButtonFound'] = !!editBtn
        {
          const sel = d().querySelector('select#agent-runtime')
          const runtimeOpts = sel ? [...sel.options].map((o) => o.value) : null
          facts['agents.runtimeOptions'] = runtimeOpts ? [...runtimeOpts].sort() : null
          // ★ `default` 是**伪值**（跟随全局默认，不是某个 runtime），所以它**不该**出现在
          //   "与身份接口的 runtimes 一致"这条比较里 —— 不排掉的话，那条断言会因为
          //   "选项多了一个 default"而红，而界面其实是对的（2026-10 实测就红在这里）。
          //   排掉之后**另加一条**量"default 在不在、是不是第一项"：少了它，新建的 agent
          //   会落到第一个具体 runtime，等于"打开编辑页什么都没做，保存就改了默认"。
          facts['agents.runtimeOptionsNoDefault'] = runtimeOpts
            ? runtimeOpts.filter((k) => k !== 'default').sort()
            : null
          facts['agents.runtimeFollowDefaultFirst'] = runtimeOpts ? runtimeOpts[0] === 'default' : null
          // ── 未接真实 CLI 的 runtime（evidence 非 verified）不进 runtimes 数组 ──
          //
          //   2026-10（使用者决定）：未验证的 runtime（generic）**不显示在 UI 上**，
          //   所以身份接口的 `runtimes` 数组只应含 `verified` 的项（UI 全从它来）。
          //   判据是 `evidence` 而不是 runtime 名字——加第四个未验证 runtime 时
          //   自动隐藏，不用改这一处。原先把非 claude 的 runtime 当成"未验证"去
          //   选中并期望警告出现——那套在"未验证不进列表"之后量不到了。
          try {
            const identity = await fetch(`${location.origin}/api/identity`).then((r) => r.json())
            facts['agents.identityRuntimeKeys'] = (identity.runtimes ?? [])
              .map((r) => r.key)
              .sort()
            facts['agents.noProvisionalRuntime'] = (identity.runtimes ?? []).every(
              (r) => r.evidence === 'verified',
            )
          } catch {
            facts['agents.identityRuntimeKeys'] = null
            facts['agents.noProvisionalRuntime'] = null
          }

          // ⚠️ 这里原来要"别把状态留在编辑态"（后面的断言按只读态写的）。现在
          //    只有一个态，**不要**点取消：那会退出这一栏（`onclose`），后面的
          //    窄屏出口那几条需要"有一条被选中"的现场。
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════════════════════════════════════════════════════════
        // ⚠️ 2026-10：这里原来量的是"窄屏下的 `.detail-pane .back` 返回按钮"。
        //    那个按钮**已经不存在了**——AgentDetail 改成"选中即编辑"之后没有
        //    查看态，栏头由 `MainArea` 渲染，而智能体页没有给它 `backLabel`
        //    （列表就在左边，宽屏不需要返回；窄屏的出口与任务页一样是**侧边栏那一项**）。
        //
        //    所以这一段改成量真正成立的两件事：
        //      ① 宽屏：两栏都在（列表 + 详情）；
        //      ② 窄屏：列表让位、详情占满，而且**真的出得去**（点侧边栏「智能体」）。
        //    判据是"出得去"，不是"某个按钮在不在"——按钮当初就是被要求去掉的。
        facts['agents.wideListDisplay'] = need('宽屏左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )

        // ── 收窄：应当只剩一栏（列表让位给详情）──
        f.style.width = '900px'
        await wait(400)
        facts['agents.narrowListDisplay'] = need('窄屏左栏', () =>
          cs(d().querySelector('.list-pane')).display,
        )
        facts['agents.narrowDetailDisplay'] = need('窄屏右栏（选中态）', () =>

        f.style.width = '1280px'
        await wait(400)
        f.style.width = '1280px'
        await wait(300)

        // ── Runtime 概览（原来六列表格，现在是竖排卡片）──
        const rc = () => [...d().querySelectorAll('.runtime-card')]
        facts['agents.runtimeCardCount'] = rc().length

        // ★ 2026-10（D63）：智能体页的页头导语**按要求去掉了**（"这里配置每个

        facts['agents.noPageIntro'] = need('智能体页没有页头导语', () => {

        // ★ 2026-10 一致性：**置灰的按钮必须写清为什么**（项目纪律）。

        facts['common.disabledButtonsExplained'] = need('置灰按钮都有解释', () => {
          const btns = [...d().querySelectorAll('button[disabled]')]
          const naked = btns.filter((b) => !b.getAttribute('title'))
          if (naked.length > 0) {
            errors.push(
              `${naked.length} 个置灰按钮没写为什么：` +
                naked.map((b) => text(b).trim().slice(0, 12)).join(' / '),
            )
          }
          return naked.length === 0
        })

        // ★ 2026-10 一致性：**提示文字不叠加两档字号**
        //   （原来有 `class="hint faint small"` 这种写法：fs-sm 与 fs-xs 一起上，
        //   同一页的说明文字因此大小不一）。
        facts['common.noHintStacking'] = need('提示文字不叠加字号档', () => {
          return d().querySelectorAll('.hint.faint.small, .hint.small').length === 0
        })

        // ★ 2026-10 一致性：**抽屉的头部只有一种写法**（`.drawer-head` + `<h2>`）。
        //   技能页的目录抽屉原来写的是 `<header>` + `<h3>`，而那个文件里没有
        //   `header`/`h3` 的样式 ⇒ 它**完全没有抽屉头部的样式**（没有 flex、
        //   没有内边距、没有分隔线，关闭按钮从右侧掉到标题下面）。
        facts['common.drawerHeadsStandard'] = need('抽屉头部写法统一', () => {
          const bad = [...d().querySelectorAll('.drawer')].filter(
            (dr) => dr.querySelector('.drawer-head') === null,

            errors.push(`${bad.length} 个抽屉没有 .drawer-head（头部写法不一致）`)
          }
          return bad.length === 0
        })

        /**
         * ★★ 「设置」抽屉：**没保存就关掉，草稿必须丢掉**。
         *
         * ══════════════════════════════════════════════════════════════
         * 这条检查的由来：使用者报的一次"内容没恢复"
         * ══════════════════════════════════════════════════════════════
         *
         * 原话是「我修改了内容，没有保存直接点关闭或者取消后，重新打开，内容没有
         * 恢复保存前的内容」。实测确实如此：改到 238 字符、关掉、重开——还是 238。
         *
         * 根因是那个"初始值只取一次"的开关只被设成 true、**从来不重置**：第一次
         * 打开之后它永远是 true，于是"取消"之后再打开，框里留着的是上一次没保存
         * 的草稿。而"取一次"本身是对的（保存之后 store 会刷新，那一冲会让人以为
         * 自己写的东西没了）——所以修法是**每次打开重新取一遍**，不是去掉它。
         *
         * ⚠️ 这条检查**不改动任何已保存的东西**：它只往输入框里打字，然后关掉
         *    （不点保存），所以那份配置在服务端一个字都没变。
         * ⚠️ 判据是"重开之后的内容 == 打开时的内容（= 已保存的值）"，而不是
         *    "字数变了没有"：只有前者才是使用者那句话的意思。
         */
        facts['agents.settingsDraftDiscarded'] = await (async () => {
          f.contentWindow.location.hash = '#/agents'
          // ⚠️ 2026-09 顶栏改版：页面标题从主区头部搬到了顶栏，所以"这一页出来了"
          //    这个信号跟着改量点（判据没变：仍然是**这一页的名字**出现在屏幕上）。
          await until(() => text(d().querySelector('.page-name')) === '智能体', 60)
          await wait(500)
          const openSettings = async () => {
            // 页面动作（「设置」等）2026-09 起在顶栏里、紧跟着页名：所有页面**同一个位置**
            const btn = [...d().querySelectorAll('.topbar .page-actions button')].find(
              (b) => text(b) === '设置',
            )
            if (!btn) return false
            click(btn)
            await wait(1500)
            return d().querySelector('.drawer textarea') !== null
          }
          const field = () => d().querySelector('.drawer textarea')
          if (!(await openSettings())) {
            errors.push('打开智能体页的「设置」之后没看到模版输入框')
            return false
          }
          /**
           * ⚠️ 已保存的值**可能是空的**（平台有默认模版，`current.executeTemplate`
           *    就是空串，界面靠 placeholder 显示默认那一段）。所以这里不要求它非空：
           *    判据是"改完之后关掉，重开必须回到**打开时那一份**"——空也算一份。
           */
          const saved = field()?.value ?? ''
          // 改一下（**不保存**）
          const box = field()
          box.value = `${saved}\n\n【探针：这段没保存，关掉之后不该还在】`
          box.dispatchEvent(new Event('input', { bubbles: true }))
          await wait(400)
          if ((field()?.value ?? '').length === saved.length) {
            errors.push('改了输入框但内容没变（这一条量不到）')
            return false
          }
          // 关掉（走 Esc，等于点「关闭」）
          f.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
          await wait(800)
          if (d().querySelector('.drawer') !== null) {
            errors.push('Esc 没关掉抽屉（这一条的第一步就没成立）')
            return false
          }
          // 重开：必须回到已保存的那份
          if (!(await openSettings())) {
            errors.push('重开「设置」时没看到模版输入框')
            return false
          }
          const again = field()?.value ?? ''
          f.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
          await wait(400)
          if (again !== saved) {
            errors.push(
              `没保存就关掉之后，重开时框里不是已保存的内容（${saved.length} → ${again.length} 字符）` +
                `——多出来的是上一次的草稿`,
            )
            return false
          }
          return true
        })()

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 任务：同样的主从 + 去重字样 ══════════════
        // ⚠️ 页名是「任务」（顶上那条 `shell.navTasks`——侧栏叫什么这里就叫什么，
        //    合并之后侧栏那一项改叫「任务」了；D58 之前这里等的是「任务清单」）。
        f.contentWindow.location.hash = '#/tasks'
        await until(() => text(d().querySelector('.page-name')) === '任务')
        // 等表格真的出现行：run.mjs 会先造一条任务当夹具。等不到就是夹具没造上，
        // 下面那条"重复字样"的检查会**空过**——所以这里必须如实报出来。
        const gotRows = await until(() => d().querySelectorAll('.list-pane .task-row').length > 0)
        facts['tasks.gotRows'] = gotRows
        if (!gotRows) errors.push('任务页里一行都没等到（夹具任务没造上或列表没渲染）')

        const rows = [...d().querySelectorAll('.list-pane .task-row')]

        // ── D69.15.2 风格一致：空态=纯空态提示，**不该有栏头**（D69.15 一度把
        //    返回按钮/空标题挂在空态上方——backLabel 无条件传、sub snippet 恒真，
        //    空态头顶一条边框线 + 窄屏一枚没用的返回按钮）。
        facts['heads.tasksEmptyNoHead'] = need('任务空态没有栏头', () => {
          const pane = d().querySelector('.detail-pane')
          if (!pane) return 'NO-PANE'
          return !pane.querySelector('.detail-head') && !!pane.querySelector('.empty')
        })
        facts['tasks.rowCount'] = rows.length
        // 从没跑过的任务：标签「执行中」+ 额外信息「还没开始执行」。
        // 这一行同时钉住了"标签之外的信息该不该显示"这条规则。
        facts['tasks.firstRowStageCell'] = need('第一行元信息', () =>
          text(rows[0]?.querySelector('.task-meta')),
        )
        // ── 行高：长标题不许把一行撑高 ──
        facts['tasks.rowHeights'] = need('各行高度', () =>
          rows.map((r) => Math.round(r.getBoundingClientRect().height)),
        )
        facts['tasks.maxRowHeight'] = need('最高的一行', () =>
          Math.max(...rows.map((r) => Math.round(r.getBoundingClientRect().height))),
        )
        // ★ 行高与标题长度无关：拿"长标题那行"和"短标题那行"对比。
        facts['tasks.heightSpread'] = need('长短标题的行高差', () => {
          const heights = rows.map((r) => Math.round(r.getBoundingClientRect().height))
          return heights.length >= 2 ? Math.max(...heights) - Math.min(...heights) : 'ROWS-TOO-FEW'
        })
        // 被裁掉了吗（scrollHeight > clientHeight 说明内容被截断了，而不是被挤宽）
        facts['tasks.titleClipped'] = need('长标题是否被截断显示', () => {
          const longRow = rows.find((r) =>
            (r.querySelector('.task-title')?.textContent ?? '').startsWith('探针用的任务'),
          )
          const t = longRow?.querySelector('.task-title')
          if (!t) return 'NO-LONG-TITLE-ROW'
          // 单行省略：内容比可见宽度长，就是被截断了
          return t.scrollWidth > t.clientWidth + 1
        })
        // 标题那一格的实际宽度（它现在独占一行，应当接近整栏宽）
        facts['tasks.titleWidth'] = need('标题宽度', () => {
          const t = rows[0]?.querySelector('.task-title')
          return t ? Math.round(t.getBoundingClientRect().width) : null
        })
        facts['tasks.layoutPresent'] = need('任务页主从布局', () =>
          !!d().querySelector('.split-layout .list-pane') &&
          !!d().querySelector('.split-layout .detail-pane'),
        )
        facts['tasks.mainOverflowY'] = need('任务页 main overflow-y', () => cs(main()).overflowY)
        // 使用者点名要去掉的那句「等待审核」：整份渲染结果里一次都不该出现。
        // 任何视图里重新长出这句话，这里就会红。
        facts['tasks.duplicateStageTextCount'] = need('「等待审核」出现次数', () =>
          (d().documentElement.innerHTML.match(/等待审核/g) ?? []).length,
        )

        // ── 点一行 → 右栏显示**完整**的标题 ──
        // 列表把标题截断了，所以"完整标题还能不能看到"必须另有地方证明：
        // 详情栏就是那个地方。顺带守住"改写列表标记之后点选还通不通"。
        facts['tasks.clickedRowTitle'] = need('被点那一行的标题', () =>
          text(rows[0]?.querySelector('.task-title')),
        )
        click(rows[0]?.querySelector('.list-row-main') ?? rows[0])
        await until(() => d().querySelector('.detail-pane .detail-head h2'))
        facts['tasks.detailTitleAfterClick'] = need('点之后右栏的标题', () =>

        // 列表里只剩日期 ⇒ 完整时间戳必须在别处还看得见（否则是悄悄丢信息）
        facts['tasks.detailHasTimestamp'] = need('右栏有没有完整时间戳', () =>
          /\d{1,2}:\d{2}/.test(text(d().querySelector('.detail-pane .detail-sub')) ?? ''),
        )

        // ── D69.9：任务详情重排——"重要资讯直接展示、非重要资讯折叠" ──
        // 夹具第一行是**从没跑过**的任务（见上面 firstRowStageCell 的注释）。
        //   a) 折叠区块头部是**真按钮** + aria-expanded（与表格 ExpandToggle 同一纪律）；
        //   b) 未跑的任务描述默认**展开**（状态驱动：未跑时描述是唯一正文）；

        const descHead = [...d().querySelectorAll('.detail-pane .fold-head')].find((h) =>
          text(h).includes('说明'),
        )
        facts['tasks.foldHeadsAreButtons'] = need('折叠头是真按钮', () => {
          const heads = [...d().querySelectorAll('.detail-pane .fold-head')]
          return (
            heads.length >= 1 &&
            heads.every((h) => h.tagName === 'BUTTON' && h.hasAttribute('aria-expanded'))

        })
        facts['tasks.neverRunDescOpen'] = need('未跑任务描述默认展开', () => {
          const body = d().querySelector('.detail-pane .fold-body')
          return (
            descHead?.getAttribute('aria-expanded') === 'true' &&

        facts['tasks.foldToggles'] = await (async () => {
          if (!descHead) return 'NO-FOLD-HEAD'
          click(descHead)
          await wait(200)
          const closed = descHead.getAttribute('aria-expanded') === 'false'
          click(descHead)
          await wait(200)
          const reopened = descHead.getAttribute('aria-expanded') === 'true'
          return closed && reopened
        })()

        // ── D69.10：人工裁决条 sticky 钉底——内容超出一屏时「通过/反馈/放弃」
        //    固定在本栏底部、不跟着滚走；不满一屏时自然跟在正文后面。
        facts['tasks.decideBarSticky'] = need('人工裁决条钉在底部', () => {
          const bar = d().querySelector('.detail-pane .decide-bar')
          if (!bar) return 'NO-DECIDE-BAR'
          return cs(bar).position === 'sticky' && cs(bar).bottom === '0px'
        })

        // ── D69.14：裁决区标题「这条任务怎么办」已删（使用者要求去掉字样）──
        facts['tasks.noDecideHeading'] = need('裁决区不再有「这条任务怎么办」标题', () => {
          const bar = d().querySelector('.detail-pane .decide-bar')
          if (!bar) return 'NO-DECIDE-BAR'
          return !text(bar).includes('这条任务怎么办')
        })

        // ── D69.15 标题统一：任务详情栏头（MainArea 渲染）标题字号 fs-lg +
        //    与 `.pane-head` 同一套留白/下边框。使用者抓的："连最基本的 Title
        //    高度都不一样"——任务/智能体标题原来 22px（全局 h2 的 fs-xl）、
        //    聊天 17px（fs-lg），且任务头贴顶、没有下边框。
        facts['heads.tasksHeadMetrics'] = need('任务详情栏头标题统一指标', () => {
          const h2 = d().querySelector('.detail-pane .detail-head h2')
          const head = d().querySelector('.detail-pane .detail-head')
          if (!h2 || !head) return 'NO-HEAD'
          return (
            cs(h2).fontSize === '17px' &&
            cs(head).paddingTop === '16px' &&
            cs(head).paddingBottom === '12px' &&
            cs(head).borderBottomWidth === '1px'
          )
        })

        // ── 每项右侧的删除按钮：需求本身（"任务列表每项加删除按钮"）──
        // 每个 `.task-row` 里都该有一个 `.list-row-action`，且它不在主按钮里
        // （按钮套按钮是非法结构）。
        facts['tasks.deleteButtonPerRow'] = need('每行右侧的删除按钮', () =>
          rows.every(
            (r) =>
              !!r.querySelector('.list-row-main') &&
              !!r.querySelector(':scope > .list-row-action'),
          ),
        )

        // ★ 选中框的样式：上面刚点过一行，所以这里有 `.active`。
        //   这两个值会与聊天栏的同名量值比对（见 run.mjs 里 `chat.activeItemBorder`
        //   那条）——"当前选中"在三处列表里必须长得一样。
        facts['tasks.activeItemBorder'] = need('任务选中项的描边色', () => {
          const el = d().querySelector('.list-pane .task-row.active')
          return el ? cs(el).borderTopColor : ''
        })
        facts['tasks.activeItemBackground'] = need('任务选中项的背景色', () => {
          const el = d().querySelector('.list-pane .task-row.active')
          return el ? cs(el).backgroundColor : ''
        })

        // ★ 2026-10：**协议状态值不许上屏**。执行记录的状态徽标原来是裸的
        //   `{run.status}`（界面上出现 `completed` / `running` /
        //   `waiting_local_directory`），而词表里 `term.runStatus.*` 八条中文
        //   早就写好了、一条都没被引用。同页的判决结论、动作状态、任务阶段
        //   都有中文，只有它没有。
        facts['tasks.runStatusLocalized'] = need('执行记录状态是中文', () => {
          const english = [
            'deferred',
            'queued',
            'dispatched',
            'waiting_local_directory',
            'running',
            'completed',
            'failed',
            'cancelled',
          ]
          const bad = [...d().querySelectorAll('.badge')].filter((b) =>
            english.includes(text(b).trim()),
          )
          if (bad.length > 0) {
            errors.push(
              `徽标里还在显示协议英文状态：${bad.map((b) => text(b).trim()).join(', ')}`,
            )
          }
          return bad.length === 0
        })

        // ★ 容器是 `<ul>`（每项要装"主按钮 + 兄弟删除按钮"，只有 `li` 装得下），
        //   而 `ul` 自带 `padding-inline-start: 40px` 与圆点标记。忘了归零的表现
        //   是**整列内容右移 40px**（使用者的原话："任务清单的列表的每个项目的
        //   内容怎么靠右了"）。这里量两件事：行左边缘贴着列表左边缘、

        facts['tasks.rowsNotIndented'] = need('任务行没有 ul 默认缩进', () => {

          const r = row.getBoundingClientRect()

          if (!title) return false
          const t = title.getBoundingClientRect()
          return Math.abs(l.left - r.left) <= 1 && t.left - r.left < 40

        facts['tasks.noListMarker'] = need('行首没有圆点标记', () => {
          const row = rows[0]
          return !!row && cs(row).listStyleType === 'none'
        })

        // ── ★ 2026-10（D58）：建任务的入口**在这一页**，而且点了真到得了表单 ──

        //   ⚠️ 点击会切页再切回来（旧的行节点会失效），所以放在所有"先抓住

        const createBtn = [...d().querySelectorAll('.page-actions button')].find(

        facts['tasks.createActionKind'] = need('那个按钮的 class', () =>

          // ★★ 判据三条一起要（D58 第二步）：地址是**正规那个**（`#/tasks/new`）、

          facts['tasks.createPaneFormPresent'] = !!d().querySelector(

          //      **1280 的窗口**：右栏只有 624px，而 `@media` 会说"窗口挺宽的"。

          f.style.width = '800px'
          await wait(500)
          facts['tasks.createNarrowListHidden'] = need('窄屏左栏', () =>

          facts['tasks.createNarrowExitViaSidebar'] = await (async () => {

          //

          //    提交栏是 `sticky` + 负外边距，它**故意**比 `<form>` 宽出去一点
          //    （去抵消 frame 的左右留白，不然滚过去的内容会从它两侧露出来）——

          facts['tasks.createNarrowNoOverflowX'] = need('窄屏这一栏是否横向溢出', () => {

          // ── 回到 1280：这就是探针默认那个窗口，而**右栏只有 624px** ──
          f.style.width = '1280px'
          await wait(500)
          facts['tasks.createWideColumns'] = need('1280 窗口下右栏表单的列数', () => {
            const form = d().querySelector('.detail-pane .create-body .newtask-form')
            if (!form) return null
            return cs(form).gridTemplateColumns.split(' ').filter(Boolean).length
          })
          facts['tasks.createWidePaneInner'] = need('1280 窗口下右栏内容宽', () => {
            const frame = d().querySelector('.detail-pane .create-body .form-frame')
            return frame ? Math.round(frame.getBoundingClientRect().width) : null
          })
          // 对照：窗口画宽到 1600 ⇒ 右栏内容约 860px ⇒ 回到**两列**
          // （这一条与上面那条配对，"按容器判"才算被证过：同一份 CSS，窗口不同、
          //   右栏宽度不同 ⇒ 列数不同）
          f.style.width = '1600px'
          await wait(500)
          facts['tasks.createWiderColumns'] = need('1600 窗口下右栏表单的列数', () => {
            const form = d().querySelector('.detail-pane .create-body .newtask-form')
            if (!form) return null
            return cs(form).gridTemplateColumns.split(' ').filter(Boolean).length
          })
          facts['tasks.createWiderPaneInner'] = need('1600 窗口下右栏内容宽', () => {
            const frame = d().querySelector('.detail-pane .create-body .form-frame')
            return frame ? Math.round(frame.getBoundingClientRect().width) : null

          f.style.width = '1280px'
          await wait(400)

          // ── ★ 宽屏"怎么回去"：顶栏那颗「列表」——它本来就已经是选中态，

          //    ⚠️ 这一条在窄屏（≤60rem）量不了：那时顶栏那排动作收进 `⋯` 里了。
          facts['tasks.createListButtonLeaves'] = await (async () => {
            const btn = [...d().querySelectorAll('.page-actions button')].find(

            if (!btn) return null

            const left = await until(() => !d().querySelector('.detail-pane .create-body'), 40)

          const ntTa = d().querySelector('.detail-pane .create-body textarea')
          const ntRow = d().querySelector('.list-pane .task-row .list-row-main')
          if (ntTa && ntRow) {

            ntTa.dispatchEvent(new Event('input', { bubbles: true }))
            await wait(120)
            click(ntRow)
            const ntAsked = await until(() => !!d().querySelector('.modal'), 40)
            facts['tasks.leaveCreateAsks'] = ntAsked
            if (!ntAsked) {
              errors.push('表单里写了一半、点左边另一条任务 ⇒ 没有问一句就把右栏换掉了（草稿会静默消失）')
            } else {

              } else {

                const ntTaAfter = d().querySelector('.detail-pane .create-body textarea')
                const ntKept =

                facts['tasks.leaveCreateCancelKeepsDraft'] = ntKept
                if (!ntKept) {

                }

            // ── ★★ 第二条出口：**侧边栏的「任务」那一项** ──

            const ntNav = [...d().querySelectorAll('.sidebar .nav-item')].find((b) =>
              text(b).includes('任务'),
            )
            if (ntNav) {
              click(ntNav)
              const ntAsked2 = await until(() => !!d().querySelector('.modal'), 40)
              facts['tasks.sidebarLeaveAsks'] = ntAsked2
              if (!ntAsked2) {
                errors.push('写着草稿、点侧栏「任务」⇒ 没有问一句就切走了（那条路最容易点到）')

                    !d().querySelector('.detail-pane .create-body') &&
                    cs(d().querySelector('.list-pane')).display !== 'none'
                  facts['tasks.discardConfirmLeaves'] = ntLeft
                  if (!ntLeft) errors.push('点了「放弃」之后没回到列表（确认框点了等于没点）')
                }

            } else {
              facts['tasks.sidebarLeaveAsks'] = null
              errors.push('侧边栏里没有「任务」那一项（那一条出口没量到）')

          } else {
            facts['tasks.leaveCreateAsks'] = null
            errors.push('建任务那一栏里没有正文框（或列表没有可点的行），草稿那两条没量到')

        // ══════════════ Skills：安装面板在**主区**里（2026-10 起不再是抽屉）══════════════

        // ══════════════ ★ P2：历史（git）那一节 ══════════════
        //
        // ⚠️ 必须**在打开安装面板之前**量：面板一开，列表就被从 DOM 里换掉了
        //    （下面那条 `skills.panelReplacesList` 钉的正是这件事）。
        //
        // 夹具是 run.mjs 里**真入库**的那条 `probe-mine`（走
        // POST /api/crystallize/commit ⇒ daemon 在 skills-mine 里打了真 commit）。
        // 为什么非得真入库：这一节的内容来自 git，注入一条 `source:'mine'` 的技能
        // 只能量到「还没有历史」，列表、首次入库标记、全部新增的 diff 一条都量不到。
        const mineRow = rowOfSlug('probe-mine')
        const installRow = rowOfSlug('probe-skill')
        facts['skills.historyMineRowFound'] = !!mineRow
        /** 展开某一行并等它里面的内容（点首格 chevron，与工具页同一做法）。 */
        const expandRow = async (row) => {
          const toggle = row?.querySelector('.expand-toggle')
          if (!toggle) return false
          click(toggle)
          await until(() => !!row?.parentElement?.querySelector('td[colspan]'))
          return true
        }
        /** 展开行的内容格（表格里展开的内容挂在下一行的 `td[colspan]` 上）。 */
        const expandedCell = (row) =>
          row?.nextElementSibling?.querySelector('td[colspan]') ??
          row?.parentElement?.querySelector('td[colspan]') ??
          null
        if (mineRow) {
          await expandRow(mineRow)
          const cell = expandedCell(mineRow)
          const foldTitle = () =>
            [...(cell?.querySelectorAll('button, summary') ?? [])].find((b) =>
              (text(b) ?? '').includes('历史（git）'),
            ) ?? null
          facts['skills.historySectionOnMine'] = !!foldTitle()
          // 折叠入口必须是**真按钮**（tab 能到、读屏器能读）——与全站折叠区块同一纪律
          facts['skills.historyFoldTag'] = foldTitle()?.tagName ?? null
          const fold = foldTitle()
          if (fold) {
            click(fold)
            // 打开 ⇒ 组件挂载 ⇒ 取历史 ⇒ 默认选中最新那条（都要等异步回来）
            await until(() => !!d().querySelector('.history-row'))
          }
          const rows = [...d().querySelectorAll('.history-row')]
          facts['skills.historyEntryCount'] = rows.length
          // 默认选中**最新**那条（打开这一节想问的是"最近改了什么"）
          facts['skills.historyTopActive'] =
            rows.length > 0 ? rows[0].classList.contains('active') : null
          facts['skills.historyRowText'] = rows.length > 0 ? (text(rows[0]) ?? '').slice(0, 80) : null
          // 只有一条提交时，它就是"首次入库"——那条标记要看得见（否则最早那条会被
          // 读成"相对上一版改了什么"，而它其实是对着空目录）
          facts['skills.historyFirstVersionBadge'] =
            rows.length === 1 ? (text(rows[0]) ?? '').includes('首次入库') : null
          const diffs = [...d().querySelectorAll('.rev-diff .file-diff')]
          facts['skills.historyDiffFileCount'] = diffs.length
          facts['skills.historyDiffChangeBadges'] = [
            ...d().querySelectorAll('.rev-diff .change'),
          ].map((el) => (text(el) ?? '').trim())
          facts['skills.historyDiffHunkCount'] = d().querySelectorAll('.rev-diff .hunk-head').length
          // ★ 界面上的文件数必须与**后端算的那一份**对得上（前端只渲染，不自己算）：
          //   比 DOM 行数与 `/compare` 返回的"非 same 文件数"，多一个少一个都要红。
          facts['skills.historyDiffMatchesApi'] = await (async () => {
            try {
              const list = await f.contentWindow.fetch('/api/skills').then((r) => r.json())
              const mine = (list.skills ?? []).find((sk) => sk.slug === 'probe-mine')
              if (!mine) return null
              const hist = await f.contentWindow
                .fetch(`/api/skills/${encodeURIComponent(mine.id)}/history`)
                .then((r) => r.json())
              if (!hist.available || (hist.entries ?? []).length === 0) return null
              const rev = hist.entries[0].rev
              const cmp = await f.contentWindow
                .fetch(
                  `/api/skills/${encodeURIComponent(mine.id)}/compare?from=empty&to=${encodeURIComponent(rev)}`,
                )
                .then((r) => r.json())
              if (!cmp.available) return null
              const changed = (cmp.files ?? []).filter((x) => x.change !== 'same').length
              return { 界面上: diffs.length, 后端算的: changed }
            } catch {
              return null
            }
          })()
          // 安装来的技能**不该**有这一节（那是外部内容，重新装就行；点开看到
          // "版本管理未启用"是纯噪音）
          if (installRow) {
            await expandRow(installRow)
            const installCell = expandedCell(installRow)
            facts['skills.historyAbsentOnInstalled'] = ![
              ...(installCell?.querySelectorAll('button, summary') ?? []),
            ].some((b) => (text(b) ?? '').includes('历史（git）'))
          }
        }

        const openBtn = [...d().querySelectorAll('button')].find(
          (b) => b.textContent.trim() === '安装技能',
        )
        facts['skills.openButtonFound'] = !!openBtn
        if (!openBtn) {
          errors.push('找不到「安装技能」按钮')
        } else {
          click(openBtn)
          const opened = await until(() => d().querySelector('.main-panel'))
          if (!opened) errors.push('点了「安装技能」之后主区没有出现 .main-panel')
        }

        const panel = d().querySelector('.main-panel')
        if (panel) {
          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════ ★ 2026-10：安装面板在主区里，不是弹框 ══════════════
          //
          // 使用者报的是"技能和工具的安装都是右侧弹框"，要的是与智能体页
          // 「新建智能体」同一种行为：**主区换成表单**。所以这里量的不是"在不在
          // 右边"，而是三件事：
          //   ① 它是 `.main` 内容区里的一块（左右边缘对齐主区的内容盒）；
          //   ② 它**不是**浮层（`position` 不是 fixed/absolute、没有遮罩）；
          //   ③ 它**取代**列表（表格不在 DOM 里），而不是被推到视口外。
          facts['skills.panelClass'] = panel.className.replace(/ svelte-\w+/, '')
          facts['skills.panelInMain'] = need('面板在主区内容盒里', () => {
            const main = d().querySelector('.main')
            if (!main) throw new Error('找不到 .main')
            const r = panel.getBoundingClientRect()
            const mr = main.getBoundingClientRect()
            const padRight = parseFloat(cs(main).paddingRight) || 0
            const padLeft = parseFloat(cs(main).paddingLeft) || 0
            const pos = cs(panel).position
            if (pos === 'fixed' || pos === 'absolute') {
              throw new Error(`面板是浮层（position: ${pos}）——弹框的味道又回来了`)
            }
            const dLeft = Math.round(Math.abs(r.left - (mr.left + padLeft)))
            const dRight = Math.round(Math.abs(r.right - (mr.right - padRight)))
            if (dLeft > 2 || dRight > 2) {
              throw new Error(`面板左右边缘没对齐主区内容盒（左差 ${dLeft}px、右差 ${dRight}px）`)
            }
            return true
          })
          facts['skills.panelNoBackdrop'] = !d().querySelector('.drawer-backdrop')
          // 列表是被"换掉"的，不是被推走：面板开着时表格**不在 DOM 里**
          facts['skills.panelReplacesList'] = !d().querySelector('.main table')
          facts['skills.panelBackLabel'] = need('返回入口文案', () =>
            text(panel.querySelector('.panel-back')),
          )
          facts['skills.panelBackVisible'] = need('返回入口可见', () => {
            const back = panel.querySelector('.panel-back')
            if (!back) throw new Error('面板头部没有返回入口（列表被换掉了，它是唯一的路）')
            // ⚠️ 判据取**真实盒子**：`.back-to-list` 那个全局 class 在宽屏是
            //    `display:none`，抄错一个 class 就会得到一个"看着有、其实不可见"的返回
            return back.getBoundingClientRect().width > 0
          })
          facts['skills.footButtonText'] = need('面板底部按钮', () =>
            text(panel.querySelector('.main-panel-foot button')),
          )
          facts['skills.tabCount'] = panel.querySelectorAll('.tab').length
          // 页签条里那个和面板头重复的「关闭」应当已经删掉
          facts['skills.duplicateCloseInTabs'] = !!panel.querySelector('.tabs .close')

          // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
          publish(false)
          // ══════════════ 远端目录页签的**状态链**（2026-10 使用者报过的那条）══════════════
          //
          // 报的原话：「安装 skill，提示『远端不可用』，我明确已经启动 remote 了」。
          // 根因在模板里：`{#if remoteError}` 写的是**裸的 store 对象**（恒为真），
          // 于是这条"远端不可用"**无条件**显示、冒号后面还空着（因为压根没有错误），
          // 同时把"未登录"和"目录里没有条目"两个状态都挤掉了。
          //
          // 两条判据刻意做成**与环境无关**（远端在不在、有没有登录都成立）：
          //   · 出现了「远端不可用」⇒ 冒号后面必须有**真实的错误文字**（不许空着）
          //   · 这个页签不许一片空白 ⇒ 四种状态里必须有一种在渲染
          const remoteTabBtn = [...panel.querySelectorAll('.tab')].find((b) =>
            /远端/.test(b.textContent),
          )
          if (!remoteTabBtn) {
            errors.push('安装面板里找不到「远端目录」页签')
          } else {
            click(remoteTabBtn)
            await wait(600)
            // ★ 判据一：**出现了**那句提示，冒号后面就必须有真实的错误文字。
            //   它没出现也是正常（远端在跑、目录拉到了）——所以这条判据是
            //   "如果出现就不许空着"，与环境无关。
            facts['skills.remoteUnavailableLabel'] = need(
              '「远端不可用」那句提示（出现时冒号后必须有真实错误）',
              () => {
                const bad = panel.querySelector('.notice.bad')
                if (!bad) return '(没有出现，正常)'
                // 那句话 = 提示块的文字减去下面那段说明（说明里也有地址和括号，
                // 直接对整块做正则会**被它救活**，于是这条检查永远绿）
                const hint = bad.querySelector('p')
                const label = (text(bad) || '').replace(hint ? text(hint) || '' : '', '').trim()
                if (!/：\s*\S/.test(label)) {
                  throw new Error(
                    `冒号后面没有错误文字（渲染成「${label}」）——这正是 2026-10 那个 bug：` +
                      '裸用 store（`{#if remoteError}`）让这条提示无条件显示',
                  )
                }
                return label.slice(0, 80)
              },
            )
            // ★ 判据二：这个页签**不许一片空白**。四种状态（远端不可用 / 未登录 /
            //   目录为空 / 表）必须至少有一种在——原来那个 bug 把其中两种压成了
            //   死代码，而"整页只剩一句错的提示"看起来也像"页面就是这样"。
            facts['skills.remoteStates'] = need(
              '远端目录页签的状态（四种里至少有一种在渲染）',
              () => {
                const states = ['.notice.bad', '.notice.warn', '.empty', 'table'].filter(
                  (sel) => panel.querySelector(sel) !== null,
                )
                if (states.length === 0) {
                  throw new Error(
                    '四种状态一个都没渲染（远端不可用 / 未登录 / 目录为空 / 表）',
                  )
                }
                return states.join('+')
              },
            )
          }

          // 返回入口回到列表（列表被换掉了，所以这一步是**唯一**的路）
          const backBtn = panel.querySelector('.panel-back')
          if (backBtn) {
            click(backBtn)
            await wait(300)
            facts['skills.backReturnsToList'] = await until(
              () => !d().querySelector('.main-panel') && !!d().querySelector('.main table'),
              40,
            )
          } else {
            facts['skills.backReturnsToList'] = false
          }

          // Esc 关闭（这个面板是视图自己渲染的，不在 App 的 $openDrawer 里；
          // 技能页的设置抽屉与它同一页，Esc 手感必须一致）
          click(openBtn)
          await until(() => d().querySelector('.main-panel'), 40)
          f.contentWindow.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
          )
          await wait(300)
          facts['skills.escClosesPanel'] =
            !d().querySelector('.main-panel') && !!d().querySelector('.main table')
        }

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 从本地安装：扫描已知目录 ⇒ 逐条装 ⇒ 能挂给智能体 ══════════════
        //
        // ══════════════════════════════════════════════════════════════════
        // 这一段原来量的是**抽屉 + 勾目录**那一套（2026-10 之前）
        // ══════════════════════════════════════════════════════════════════
        // 原来是：Skills 页顶栏「设置」按钮 → `.drawer` → 四个候选目录（每个一个勾选框）
        // → 还能自己填一个路径加进去 → 勾上之后"每次读列表自动对账读进库"，然后量
        // "本地目录来的那条技能在表里、徽标里带路径、卸载按钮置灰"。
        //
        // ⚠️ **那一套已经撤了（D73）**：现在扫只负责"看现在有什么"（`GET
        //    /api/skills/local-dirs`，只读、不写库），**装不装由使用者逐条点**；也没有
        //    "自己加一个目录"——候选目录是**内置表**（Claude Code / Codex / Cursor /
        //    AGENTS 约定目录），显示名在界面词表里。于是：
        //      · 顶栏没有「设置」按钮了（原来这里会因为"找不到它"而 21 条断言全空过）；
        //      · 那一栏也不是抽屉，而是 Skills 页的**一个页签**「从本地安装」；
        //      · 目录行上**没有勾选框**（这条现在是**要钉住**的判据，不再是缺点了）；
        //      · 夹具那个"自己填进去的目录"根本不会被扫到（候选表是内置的），
        //        所以"表里有 probe-local-a/b"这条断言**没法再量**——改成量真的那条路：
        //        扫到的目录里**挑一条真的技能装进来**，再看它是不是真的落库、能不能挂。
        //
        // ⚠️ 探针的 daemon 用 `--skills-root` 指向 `.cache/layout-probe/`，所以这次安装
        //    只写进**临时库**（不碰 `~/.agentdeck`）；候选目录读的是本机家目录，**只读**。
        //    机器上那几个目录里一个技能都没有时，如实上报（不许把"没东西可装"说成通过）。
        {
          f.contentWindow.location.hash = '#/skills'
          await until(() => text(d().querySelector('.page-name')) === '技能', 60)
          await wait(300)
          // ⚠️ 「从本地安装」这几个页签住在**安装面板里**（`.main-panel .tabs`），不是
          //    技能页列表上的页签——要先把面板打开（顶栏主操作「安装技能」）。第一版
          //    直接找 `.tabs .tab`，量到 0 个，整段空过（教训：选择器要照着界面上
          //    的真实结构写，别照着自己想象的页面结构写）。
          const localInstallBtn = [
            ...d().querySelectorAll('.topbar .page-actions button'),
          ].find((b) => (text(b) ?? '').includes('安装技能'))
          facts['skills.localPanelButtonFound'] = !!localInstallBtn
          if (localInstallBtn) {
            click(localInstallBtn)
            await until(() => !!d().querySelector('.main-panel'), 40)
            await wait(300)
          }
          facts['skills.tabTexts'] = [...d().querySelectorAll('.main-panel .tabs .tab')].map(
            (b) => text(b),
          )
          // ⚠️ 用 **includes** 比，不用等号：页签里除了词条还可能带计数/角标，等号比
          //    会在"文字对了但多一个角标"时判成"没找到"（第一版就是这么空过的）。
          const localTab = [...d().querySelectorAll('.main-panel .tabs .tab')].find((b) =>
            (text(b) ?? '').includes('从本地安装'),
          )
          facts['skills.localTabFound'] = !!localTab
          if (!localTab) {
            errors.push('Skills 页没有「从本地安装」页签（这一段全空过）')
          } else {
            click(localTab)
            facts['skills.localTabActive'] = await until(
              () =>
                [...d().querySelectorAll('.main-panel .tabs .tab')].some(
                  (b) => (text(b) ?? '').includes('从本地安装') && b.classList.contains('active'),
                ),
              40,
            )
            // 扫的是**本机**目录，要等接口回来（`$localSkillScan`）
            await until(
              () => d().querySelectorAll('.main-panel table tr.cat-row').length > 0,
              60,
            )
            await wait(300)
            const localGroups = () => [...d().querySelectorAll('.main-panel table tr.cat-row')]
            facts['skills.localGroupCount'] = localGroups().length
            facts['skills.localGroupLabels'] = localGroups().map(
              (r) => text(r.querySelector('.cat-label')),
            )
            // ★ 每个目录都要把**路径**说清（"哪个目录"是这一页唯一的上下文）
            facts['skills.localGroupsAllHavePath'] = localGroups().every(
              (r) => (text(r.querySelector('.dir-group-path')) ?? '').length > 1,
            )
            facts['skills.localGroupPaths'] = localGroups().map((r) =>
              text(r.querySelector('.dir-group-path')),
            )
            // ★★ D73 之后这里**一个勾选框都不该有**：装不装是逐条点的事，不再"勾目录
            //    ⇒ 后台自动对账"。勾选框回来了就说明那条被撤的路又接上了。
            // ⚠️ 只数**表里**的勾选框：面板里那颗「覆盖已存在的技能」是另一件事
            //    （它管"同名要不要覆盖"，与"勾上目录就自动对账"无关）。第一版数了整
            //    个面板 ⇒ 把覆盖开关也算进来 ⇒ 判据变红，而红的理由与 D73 无关。
            facts['skills.localTabNoCheckbox'] =
              d().querySelectorAll('.main-panel table input[type=checkbox]').length === 0
            facts['skills.localTabNoCheckboxCount'] =
              d().querySelectorAll('.main-panel table input[type=checkbox]').length
            facts['skills.localPanelCheckboxCount'] =
              d().querySelectorAll('.main-panel input[type=checkbox]').length
            // ★ 目录行上要有「安装」/「已安装」的分寸：折叠着的时候先说"里面几个"，
            //   展开之后逐条给按钮（不是整目录一键装——那会把使用者没看过的也装进来）
            facts['skills.localGroupCounts'] = localGroups().map((r) =>
              text(r.querySelector('.cat-count')),
            )
            const openFirstGroup = async (row) => {
              click(row.querySelector('.cat-toggle'))
              return until(
                () => !!(row.nextElementSibling && row.nextElementSibling.querySelector('code')),
                40,
              )
            }
            let expanded = null
            for (const row of localGroups()) {
              if (await openFirstGroup(row)) {
                expanded = row
                break
              }
            }
            facts['skills.localGroupExpands'] = !!expanded
            const localSkillRows = () =>
              [...d().querySelectorAll('.main-panel table tbody tr')].filter(
                (r) =>
                  !!r.querySelector('code') &&
                  !!r.querySelector('button') &&
                  !r.classList.contains('cat-row'),
              )
            facts['skills.localRowCount'] = localSkillRows().length
            facts['skills.localRowsAllHaveInstallButton'] = localSkillRows().every((r) =>
              [...r.querySelectorAll('button')].some((b) =>
                ['安装', '已安装', '正在检查并安装…'].includes(text(b)),
              ),
            )
            // ★ 真的装一条：挑第一条**还没装**的技能（已经装过的按钮是禁用的）
            const firstInstall = [...d().querySelectorAll('.main-panel table tbody tr')]
              .filter((r) => !!r.querySelector('code'))
              .map((r) => ({
                slug: text(r.querySelector('code')),
                btn: [...r.querySelectorAll('button')].find((b) => text(b) === '安装'),
              }))
              .find((x) => x.btn)
            facts['skills.localInstallCandidate'] = firstInstall ? firstInstall.slug : null
            if (firstInstall && firstInstall.btn) {
              const installedBefore = await f.contentWindow
                .fetch('/api/skills')
                .then((r) => r.json())
                .then((p) => (p.skills ?? []).map((s) => s.slug))
                .catch(() => null)
              click(firstInstall.btn)
              // ★ 等的是**接口上真的有了**（不是等按钮变灰——那可能只是本地状态）
              let after = null
              for (let i = 0; i < 60; i++) {
                after = await f.contentWindow
                  .fetch('/api/skills')
                  .then((r) => r.json())
                  .then((p) => (p.skills ?? []).map((s) => s.slug))
                  .catch(() => null)
                if (after && after.includes(firstInstall.slug)) break
                await wait(200)
              }
              facts['skills.localInstallLandedOnServer'] = !!(
                after && after.includes(firstInstall.slug)
              )
              facts['skills.localInstalledSlug'] = firstInstall.slug
              facts['skills.localSlugWasNew'] = !!(
                installedBefore && !installedBefore.includes(firstInstall.slug)
              )
              // ★ 那一条的来源徽标：本地目录来的要指回**它的来源目录**（不是一句
              //   含糊的"本地"）——装进来的东西正文已经落在我们自己的 skills 目录下，
              //   徽标是使用者唯一能追回去的线索。
              const installedSkill = await f.contentWindow
                .fetch('/api/skills')
                .then((r) => r.json())
                .then((p) => (p.skills ?? []).find((s) => s.slug === firstInstall.slug) ?? null)
                .catch(() => null)
              facts['skills.localInstallSourceKind'] = installedSkill
                ? installedSkill.source
                : null
              // ⚠️ 界面那枚徽标认的是 **`localDir`**（不是 `source.path`——那个字段
              //    在库里是 null，来源目录落在 `localDir` 上）。第一版读 `source.path`：
              //    量到 null ⇒ 下面那条永远红，而界面其实是对的。
              facts['skills.localInstallSourcePath'] = installedSkill
                ? (installedSkill.localDir ?? null)
                : null
              // ★ 关掉面板回到列表，再看那一条：装进来的东西**必须在那张表里出现**，
              //   而且来源徽标要带着**它的来源目录**（不是笼统的「本机自建」）。
              const backToList = d().querySelector('.main-panel .panel-back')
              if (backToList) {
                click(backToList)
              } else {
                f.contentWindow.dispatchEvent(
                  new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }),
                )
              }
              const listBack = await until(
                () => !d().querySelector('.main-panel') && !!d().querySelector('.main table'),
                40,
              )
              facts['skills.listBackAfterLocalInstall'] = listBack
              const localRow = [...d().querySelectorAll('.main table tbody tr')].find((r) =>
                (text(r) ?? '').includes(firstInstall.slug),
              )
              facts['skills.localRowInList'] = !!localRow
              facts['skills.localBadgeHasPath'] = (() => {
                if (!localRow) return false
                // 那一行的来源列里要出现**来源目录的路径**（逐字，不截断成"本地"）
                const wanted = installedSkill?.localDir ?? '@@'
                return (text(localRow) ?? '').includes(wanted)
              })()
            } else {
              facts['skills.localInstallCandidate'] = null
              errors.push(
                '「从本地安装」里没有一条**可装**的技能（本机那几个目录是空的？）——' +
                  '"装进来 ⇒ 能挂给智能体"这条链这次量不到',
              )
            }
            // ★ 跳过的东西要说清理由（没有 SKILL.md / 太深 / 解析不了…）——一直挂在
            //   组里，不藏在折叠里。机器上没有被跳过的东西时如实记 null。
            facts['skills.dirsSkipNote'] = need('「跳过」那一行', () => {
              const note = d().querySelector('.main-panel .dir-skip')
              return note ? (text(note) ?? '').includes('跳过') : null
            })
            // ★ 目录读不了要说读不了（不是一张空表）
            facts['skills.dirReadErrorShown'] = !!d().querySelector('.main-panel .notice.warn')
            // ★ 空目录要**如实说**「里面没有技能」（不是一行空白，也不是干脆不列这个目录）。
            //   ⚠️ 这条得**展开每一组**才看得到，所以是异步的（`need()` 是同步的，量不了）。
            const emptyGroupResults = []
            for (const row of localGroups()) {
              const count = Number((text(row.querySelector('.cat-count')) ?? '0').trim())
              if (count !== 0) continue
              const ok = await openFirstGroup(row)
              const next = row.nextElementSibling
              emptyGroupResults.push(
                ok && !!next && (text(next) ?? '').includes('里面没有技能'),
              )
            }
            facts['skills.dirEmptyGroupCount'] = emptyGroupResults.length
            facts['skills.dirEmptyReported'] =
              emptyGroupResults.length === 0 ? null : emptyGroupResults.every(Boolean)
          }
        }

          // ── 能挂给智能体：去智能体页点开一个执行者，看选择器里有没有它 ──
          //
          //   ★ 这一环是那条链的**终点**：装进来的本地技能必须能被挂到执行者身上
          //     （"装进来"与"用得上"是两件事，中间断了是最容易漏的）。
          //   ⚠️ 选择器里要出现的是**刚刚真的装进来的那个 slug**
          //     （`facts['skills.localInstalledSlug']`）——原来钉的是夹具那两个名字
          //     （`probe-local-a/b`），而那两个现在扫不到（候选目录是内置表）。
          f.contentWindow.location.hash = '#/agents'
          await until(() => d().querySelectorAll('.agent-row').length > 0, 60)
          await wait(400)
          const ldsExecItem = [...d().querySelectorAll('.list-row-main')].find((el) =>
            (el.textContent ?? '').includes('探针用的执行者'),
          )
          const wantSlug = facts['skills.localInstalledSlug'] ?? null
          if (ldsExecItem) {
            click(ldsExecItem)
            await until(
              () => String(d().querySelector('#agent-name')?.value ?? '') === '探针用的执行者',
              60,
            )
            await wait(300)
            // 单态卡片：技能那一栏直接在卡片里（没有「编辑」这一步了）
            const ldsPicker = d().querySelector('.skill-picker')
            facts['skills.pickerFound'] = !!ldsPicker
            const ldsOptions = [...d().querySelectorAll('.skill-picker input')].map(
              (i) => i.value,
            )
            // ⚠️ 选择器的取值是**技能 id**，不是 slug（第一版拿 slug 比，永远 false）。
            //    这里把 id 翻成 slug 一起记下来——判据要能读懂，也得能追到是哪一个。
            const allSkills = await f.contentWindow
              .fetch('/api/skills')
              .then((r) => r.json())
              .then((p) => p.skills ?? [])
              .catch(() => [])
            const slugOf = new Map(allSkills.map((sk) => [String(sk.id), sk.slug]))
            facts['skills.pickerOptions'] = ldsOptions
            facts['skills.pickerOptionSlugs'] = ldsOptions.map((v) => slugOf.get(v) ?? `?${v}`)
            const wantId = wantSlug
              ? String((allSkills.find((sk) => sk.slug === wantSlug) ?? {}).id ?? '')
              : ''
            facts['skills.pickerWantId'] = wantId || null
            facts['skills.pickerHasLocalSkill'] = !!wantId && ldsOptions.includes(wantId)
            // ★ 真的能勾上（不是"只有一行字"）：勾之后服务端那份要跟着变
            const ldsBox = wantId
              ? [...d().querySelectorAll('.skill-picker input')].find((i) => i.value === wantId)
              : null
            if (ldsBox && !ldsBox.checked) {
              click(ldsBox)
              await wait(200)
              // ⚠️ 选择器是 `bind:group` 的**草稿**（只改本地状态）——落库要点保存。
              //    第一版勾完就等接口：接口永远不动，于是"勾不上"变红，而其实只是少点
              //    了一下保存（使用者走的正是"勾 ⇒ 保存"这条路）。
              const pickerSave = [...d().querySelectorAll('.detail-pane button')].find((b) =>
                (text(b) ?? '').startsWith('保存'),
              )
              facts['skills.pickerSaveButtonFound'] = !!pickerSave
              if (pickerSave) {
                click(pickerSave)
                await wait(400)
              }
              let skillIds = null
              for (let i = 0; i < 40; i++) {
                skillIds = await f.contentWindow
                  .fetch('/api/agents')
                  .then((r) => r.json())
                  .then(
                    (p) =>
                      (p.agents ?? []).find((a) => a.name === '探针用的执行者')?.skillIds ?? null,
                  )
                  .catch(() => null)
                if (skillIds && skillIds.length > 0) break
                await wait(200)
              }
              facts['skills.pickerCheckboxTook'] = !!(skillIds && skillIds.length > 0)
            } else if (ldsBox) {
              facts['skills.pickerCheckboxTook'] = true
            }
            facts['skills.pickerSkillIdsAfter'] = await f.contentWindow
              .fetch('/api/agents')
              .then((r) => r.json())
              .then(
                (p) =>
                  (p.agents ?? []).find((a) => a.name === '探针用的执行者')?.skillIds ?? null,
              )
              .catch(() => null)
          } else {
            errors.push('智能体页找不到执行者卡片，挂载那一环量不了')
          }
        f.contentWindow.location.hash = '#/skills'
        await until(() => text(d().querySelector('.page-name')) === '技能', 60)

        // ★ 发布一次当前事实（跑不完时 dump 里也能看到跑到哪一段了）
        publish(false)
        // ══════════════ 侧边栏第五项 + 工具（D40）══════════════
        //
        // 使用者要的是"可插拔的行动"：一个工具包 = **一个组**（一个目录、一次
        // 安装），组内多个动作，判决里写作 `<包slug>.<动作名>`。这一节量的是
        // 界面把这三件事说清楚了没有：
        //
        //   ① **侧边栏五项**（D40 起「工具」是第 5 项，排在 Skills 之后）；
        //   ② 列表：组名、动作数、**挂给了谁**；
        //   ③ 点开一行：动作清单（契约值 `<slug>.<动作名>`、`summary`、
        //      「不可回滚」标注、参数分 bound / open 两组）；
        //   ④ 安装抽屉：**右侧**、Esc 能关、失败时显示 error + **多行 detail**，
        //      成功时说清装进来了什么、并且列表立刻多一条；
        //   ⑤ 智能体详情：执行者有「工具」段、挂载能来回改并立刻刷新；
        //      **审核者没有那一段**。
        //
        // ⚠️ 夹具（三个工具目录 + 一次安装 + 一次挂载）由 `run.mjs` 造，理由
        //    与 skill 那份一样：探针跑在 `--virtual-time-budget` 下，`setTimeout`
        //    是虚拟的而网络是真的，"自己造再等界面刷新"会看早。
        // ⚠️ 两个夹具路径从 URL 传进来（抽屉里那次安装要真的往输入框里打字）。
        const probeQuery = new URLSearchParams(location.search)
        const badToolPath = probeQuery.get('badToolPath')
        const uiToolPath = probeQuery.get('uiToolPath')

        f.contentWindow.location.hash = '#/tools'
        await until(() => text(d().querySelector('.page-name')) === '工具')
        await until(() => d().querySelectorAll('.tool-table tbody tr.tool-row').length > 0)
        await wait(400)

        // ── ① 侧边栏：恰好五项，而且**顺序就是那五项** ──
        //
        //    ★ 这一组是"4 → 5"那次改动的守卫：`view.ts` 的 `VIEWS` 与
        //      `Sidebar.svelte` 的 `ITEMS` 是两处联动，少动一处不报错，
        //      只表现为"视图打不开 / 侧边栏点不到它"。
        //
        //    ⚠️ **只数个数 + 只看最后一项是不够的**（实测过两次变异）：
        //      · "把「工具」插到 Skills 前面" ⇒ 末项变成 Skills，抓得住；
        //      · "把 Skills 那一项的文案悄悄换成「工具」" ⇒ 项数还是 5、末项还是
        //        「工具」，**两条全绿**——一个非末项凭空消失也照样通过。
        //      所以这里把**整串顺序**一起量出来，由 `shell.navItems` 那条逐项比对。
        //      （原来有没有"恰好四项"的断言？没有——那一版只有注释与文档里的说法。）
        const probeNavTitles = [...d().querySelectorAll('.sidebar .nav-title')].map((el) =>
          text(el),
        )
        facts['shell.navItems'] = probeNavTitles
        facts['shell.navItemCount'] = d().querySelectorAll('.sidebar .nav-item').length
        facts['shell.navLastItem'] =
          probeNavTitles.length > 0 ? probeNavTitles[probeNavTitles.length - 1] : null

        // ── ② 列表 ──
        facts['tools.title'] = need('工具页标题', () => text(d().querySelector('.page-name')))
        const probeToolRows = () => [...d().querySelectorAll('.tool-table tbody tr.tool-row')]
        const probeFixtureRow = () =>
          probeToolRows().find(
            (r) => text(r.querySelector('.tool-slug')) === 'probe-tool',
          )
        facts['tools.rowCount'] = probeToolRows().length
        facts['tools.fixtureFound'] = !!probeFixtureRow()
        if (!probeFixtureRow()) errors.push('工具列表里找不到夹具工具 probe-tool（夹具没装上？）')
        facts['tools.fixtureActionCell'] = need('夹具那行的动作数', () =>
          text(probeFixtureRow()?.querySelector('.tool-action-count')),
        )

        // ★ D69：单元格原子样式（`.desc-clamp` / `.row-actions`）已上移 app.css
        //   共用——钉住它们**真的生效**（有人把样式改回各视图私有、或删掉，这里就红）。
        facts['tools.descClampApplied'] = (() => {
          const el = probeFixtureRow()?.querySelector('.desc-clamp')
          return el ? cs(el).webkitLineClamp : null
        })()
        facts['tools.rowActionsFlex'] = (() => {
          const el = probeFixtureRow()?.querySelector('.row-actions')
          return el ? cs(el).display : null
        })()

        // ★ 2026-10 与技能页同格式：工具表也有「更新于」列（原来没有）
        facts['tools.updatedAtColumn'] = need('工具表有「更新于」列', () => {
          const head = text(d().querySelector('.tool-table thead'))
          return head.includes('更新于')
        })
        // ★ D69.7：工具表「来源」列也在「版本」之前（与技能页同一列序）
        facts['tools.sourceBeforeVersion'] = (() => {
          const ths = [...d().querySelectorAll('.tool-table thead th')].map((th) => text(th))
          return ths.indexOf('来源') !== -1 && ths.indexOf('来源') < ths.indexOf('版本')
        })()
        // ★ D69.8：同技能页——首格 `▸ slug` 的 flex 容器不折行
        facts['tools.slugCellFlexWrap'] = (() => {
          const row = probeFixtureRow()
          const el = row?.querySelector('.row-title')
          return el ? cs(el).flexWrap : null
        })()

        // ── ③ 点一行 → 动作清单 ──
        // ★ 2026-10：展开入口早就从「看动作」文字按钮挪到首格的 chevron
        //   （`expand-toggle`）——探针这里还在找文字按钮，会一直找不到、一直
        //   量不到展开后的动作，下面四条全红。改点 chevron。
        const probeExpand = probeFixtureRow()?.querySelector('.expand-toggle')
        if (probeExpand) {
          click(probeExpand)
          await until(() => !!d().querySelector('.tool-detail-row .tool-action'))
        }
        facts['tools.actionTypes'] = [
          ...d().querySelectorAll('.tool-detail-row .tool-action-type'),
        ].map((el) => text(el))
        const probeActionText = () =>
          text(d().querySelector('.tool-detail-row')) ?? ''
        facts['tools.irreversibleFlag'] = need('不可回滚那条标注', () =>
          probeActionText().includes('不可回滚'),
        )
        // ⚠️ 「模型看不到也填不了」那句解释**不在每个动作卡片里**了：它整块面板只说
        //    一次（`.param-legend`）。理由见 Tools.svelte 里那段注释（实测 2 个动作时
        //    那两句重复了 124px）。所以这条要分两半量：**分组还在**，而且**解释还在**。
        facts['tools.boundGroupNote'] = need('绑定参数那一组', () => {
          const group = d().querySelector('.tool-detail-row .params-bound')
          const legend = d().querySelector('.tool-detail-row .param-legend')
          return (
            !!group &&
            text(group).startsWith('平台绑定') &&
            !!legend &&
            (text(legend) ?? '').includes('模型看不到也填不了')
          )
        })
        facts['tools.openGroupNote'] = need('模型可填那一组', () => {
          const group = d().querySelector('.tool-detail-row .params-open')
          // 那一组要显示类型与上限：夹具的 `text` 是 string/max 500
          return !!group && /最长\s*500/.test(text(group) ?? '')
        })

        // ── ④ 安装面板：在主区里（不是弹框）+ 返回 + 失败（多行 detail）+ 成功 ──
        const probeInstallBtn = [...d().querySelectorAll('.topbar .page-actions button')].find(
          (b) => text(b) === '安装工具',
        )
        facts['tools.installButtonFound'] = !!probeInstallBtn
        if (!probeInstallBtn) {
          errors.push('找不到「安装工具」按钮')
        } else {
          click(probeInstallBtn)
          const probePanelOpen = await until(() => !!d().querySelector('.main-panel'))
          if (!probePanelOpen) errors.push('点了「安装工具」之后主区没有出现 .main-panel')
          const probePanel = d().querySelector('.main-panel')
          if (probePanel) {
            // ★ 2026-10：与技能页同一套判据（理由写在那边的同一段注释里）——
            //   面板在**主区内容盒**里、不是浮层、并且**取代**了列表。
            facts['tools.panelInMain'] = need('面板在主区内容盒里', () => {
              const main = d().querySelector('.main')
              if (!main) throw new Error('找不到 .main')
              const r = probePanel.getBoundingClientRect()
              const mr = main.getBoundingClientRect()
              const padLeft = parseFloat(cs(main).paddingLeft) || 0
              const padRight = parseFloat(cs(main).paddingRight) || 0
              const pos = cs(probePanel).position
              if (pos === 'fixed' || pos === 'absolute') {
                throw new Error(`面板是浮层（position: ${pos}）——弹框的味道又回来了`)
              }
              const dLeft = Math.round(Math.abs(r.left - (mr.left + padLeft)))
              const dRight = Math.round(Math.abs(r.right - (mr.right - padRight)))
              if (dLeft > 2 || dRight > 2) {
                throw new Error(`面板左右边缘没对齐主区内容盒（左差 ${dLeft}px、右差 ${dRight}px）`)
              }
              return true
            })
            facts['tools.panelNoBackdrop'] = !d().querySelector('.drawer-backdrop')
            facts['tools.panelReplacesList'] = !d().querySelector('.main table')
            facts['tools.panelBackLabel'] = need('返回入口文案', () =>
              text(probePanel.querySelector('.panel-back')),
            )
            facts['tools.panelBackVisible'] = need('返回入口可见', () => {
              const back = probePanel.querySelector('.panel-back')
              if (!back) throw new Error('面板头部没有返回入口（列表被换掉了，它是唯一的路）')
              return back.getBoundingClientRect().width > 0
            })

            // 往输入框里打字要派发 `input`：`bind:value` 靠它（只改 value 不生效）
            const probeType = (el, value) => {
              el.value = value
              el.dispatchEvent(new Event('input', { bubbles: true }))
            }
            const probeSource = d().querySelector('#tool-source')
            const probeFoot = () => d().querySelector('.main-panel-foot button')

            // ── 失败路径：一个"清单合法但入口不在包里"的目录 ──
            if (probeSource && probeFoot() && badToolPath) {
              probeType(probeSource, badToolPath)
              click(probeFoot())
              const probeFailed = await until(
                () => !!d().querySelector('.main-panel .tool-error-detail'),
                60,
              )
              facts['tools.installFailureShown'] = probeFailed
              if (!probeFailed) {
                errors.push('装一个坏包之后没有出现失败块（.tool-error-detail）')
              }
              facts['tools.installFailureDetailLines'] = need('detail 有几行', () => {
                const el = d().querySelector('.main-panel .tool-error-detail')
                return el ? (el.textContent ?? '').split('\n').length : null
              })
              facts['tools.installFailureDetailKeepsLines'] = need('detail 的 white-space', () => {
                const el = d().querySelector('.main-panel .tool-error-detail')
                return el ? cs(el).whiteSpace === 'pre-wrap' : null
              })
              facts['tools.installFailureHint'] = need('失败时的下一步建议', () => {
                const hints = [
                  ...d().querySelectorAll('.main-panel .notice.bad p.faint.small'),
                ]
                return hints.length > 0 ? text(hints[hints.length - 1]) : null
              })
            }

            if (probeSource && probeFoot() && uiToolPath) {
              probeType(probeSource, uiToolPath)
              click(probeFoot())
              const probeOk = await until(
                () => !!d().querySelector('.main-panel .notice.good'),
                90,
              )
              facts['tools.installSuccess'] = probeOk
              if (!probeOk) errors.push('在主区面板里装一个合法包没有出现成功块（.notice.good）')
              facts['tools.installSuccessListsWhat'] = need('成功块说的是什么', () => {
                const block = d().querySelector('.main-panel .notice.good')
                if (!block) return null
                const body = text(block) ?? ''
                // 「装进来什么」= 动作名 + 文件名都列出来了
                return body.includes('probe-tool-ui.ping') && body.includes('scripts/run.mjs')
              })
            }

            // ★ 返回入口回到列表（列表被面板换掉了，这是唯一的路）
            const probeBack = probePanel.querySelector('.panel-back')
            if (probeBack) {
              click(probeBack)
              await wait(300)
              facts['tools.backReturnsToList'] = await until(
                () => !d().querySelector('.main-panel') && !!d().querySelector('.main table'),
                40,
              )
            } else {
              facts['tools.backReturnsToList'] = false
            }

            click(probeInstallBtn)
            await until(() => d().querySelector('.main-panel'), 40)
            f.contentWindow.dispatchEvent(

          }
        }

        await until(() => probeToolRows().length >= 2, 60)

        // ── ④.5 造「配过、但包已卸载」那个组（D41 那一族的夹具）──────────────
